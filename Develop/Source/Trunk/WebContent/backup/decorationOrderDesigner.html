<div id="decorationOrderPageContent" class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="orderSearchDiv"></div>
			<table id="listGrid"></table>
			<div id="gridPager"></div>
		</div>
	</div>
	
	<div class="modal fade" id="agreementModal" tabindex="-1" role="dialog"	aria-labelledby="agreementDialog" aria-hidden="true" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="agreementDialog">合同</h4>
				</div>
			
				<div class="modal-body">
					<p align="center">
						<button type="button" class="btn btn-app btn-primary no-radius" id='additionalInfoBtn'>
							<i class="icon-envelope bigger-230"></i>录入信息
						</button>
						<a href="#" class="btn btn-app btn-primary no-radius" id='printContractBtn' target="_blank">
							<i class="icon-envelope bigger-230"></i>打印合同
						</a>
					</p>
				</div>
				
				<div class="modal-footer">
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="additionalTermsModal" tabindex="-1" role="dialog" aria-labelledby="additionalTermsDailog" aria-hidden="true" data-backdrop="static">
		<div class="modal-dialog" style="width: 800px;">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="additionalTermsDailog">合同信息</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal" role="form">
						<input id='contractAutoId' class='hide' />
						<div class="form-group">
							<label for="workingDuration" class="col-sm-3 control-label no-padding-right">工期</label>
							<div class="col-sm-9">
								<input type="text" class="col-xs-10 col-sm-5 v_number" data-toggle="popover" data-trigger='manual' maxlength="4" id="workingDuration">
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="startTime">开工时间</label>
							<div class="col-sm-9">
								<input id="startTime" type="text" class="col-sm-5 date-picker" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="endTime">竣工时间</label>
							<div class="col-sm-9">
								<input id="endTime" type="text" class="col-sm-5 date-picker" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="form-group"  style="padding: 0 10px;">
							<div class="wysiwyg-editor" id="additionalInfo"></div>
						</div>
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveAdditionalInfoBtn" class="btn btn-primary">保存</button>
		        	<button type="button" id="cancelAdditionalInfoBtn" class="btn btn-default" data-dismiss="modal">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>
	
	<div class="modal fade" id="drawLineModal" tabindex="-1" role="dialog"	aria-labelledby="drawLineDialog" aria-hidden="true" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content">
			
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="drawLineDialog">放线申请</h4>
				</div>
				
				<div class="modal-body">
					<form class="form-horizontal" role="form">
					<div class="well">
						<h4 class="green smaller lighter">说明</h4>
						<p>申请放线时间不等同于最终放线时间 .</p>
					</div>
					<div class="form-group">
						<input class="hide" id="decorationOrderId" type="text" />
							<label for="applayTime" class="col-sm-3 control-label no-padding-right">放线时间</label>
							<div class="col-sm-9">
								<input class="date-picker col-xs-10 col-sm-5 v_required" id="applayTime" type="text" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						
						<div class="form-group">
							<label for="applayDes" class="col-sm-3 control-label no-padding-right">备注</label>
							<div class="col-sm-9">
								<textarea id="applayDes" class="col-xs-10 col-sm-5 v_name" rows="3" data-toggle="popover" data-trigger='manual' maxlength="100"></textarea>
							</div>
						</div>
					</form>
				</div>
				
				<div class="modal-footer">
					<button type="button" id="applayDrawLineBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
