		<script type="text/javascript">
			var isF5 = false;
			document.onkeydown = function (e) {
	            var ev = window.event || e;
	            var code = ev.keyCode || ev.which;
	            if (code == 116) {
	            	isF5 = true;
	            }
	        } 
			window.onbeforeunload = onclose;
			function onclose(){
				if(!isF5){
					isF5 = false;
					return "";
				}
			}
			
			var hostServer = "http://" + document.location.host + "/";
			var mediaServer = hostServer;
			var communionServer = "./";
			var dmediaServer = hostServer;
			var versionCode = "";
			var cookies = document.cookie.split(";");
			
			for(var i=0;i<cookies.length;i++){
				var cookie = cookies[i];
				
				if(cookie.indexOf("hostServer") != -1){
					//hostServer = cookie.split("=")[1];
					window.hostServer = unescape(hostServer);
				}else if(cookie.indexOf("dmediaServer") != -1){
					dmediaServer = cookie.split("=")[1];
					window.dmediaServer = unescape(dmediaServer);
				}else if(cookie.indexOf("mediaServer") != -1){
					//mediaServer = cookie.split("=")[1];
					window.mediaServer = unescape(mediaServer);
				}else if(cookie.indexOf("communionServer") != -1){
					communionServer = cookie.split("=")[1];
					window.communionServer = unescape(communionServer);
				}else if(cookie.indexOf("versionCode") != -1){
					versionCode = cookie.split("=")[1];
				}else if(cookie.indexOf("authentication") != -1){
					window.authentication = cookie.split("=")[1];
				}
			}
			
			var csses = "";
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/bootstrap.min.css?version=' + versionCode + '" />'; // basic styles 
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/font-awesome.min.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/jquery.gritter.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/jquery-ui-1.10.3.full.min.css?version=' + versionCode + '" />'; // page specific plugin styles
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/fullcalendar.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/chosen.min.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/datepicker.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/daterangepicker.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/bootstrap-timepicker.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/ui.jqgrid.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/zTreeStyle.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/huploadify.css?version=' + versionCode + '" />';
			
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/ace.min.css?version=' + versionCode + '" />'; // ace styles
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/ace-rtl.min.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/ace-skins.min.css?version=' + versionCode + '" />';
			
			csses += '<link rel="stylesheet" href="' + hostServer + 'css/main.css?version=' + versionCode + '" />';
			
			document.write(csses);

			if(!window.jQuery){
				jses += '<script src="' + hostServer + 'assets/js/jquery-2.0.3.min.js?version=' + versionCode + '"><\/script>';
