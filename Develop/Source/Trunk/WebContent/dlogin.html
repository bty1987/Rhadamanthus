<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<title>FIP</title>
	<meta name="keywords" content="方林,装饰,ERP" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<link rel="shortcut icon" href="fanglin.ico" mce_href="fanglin.ico" type="image/x-icon">

	<script>
		//        var hostServer = "http://" + document.location.host + "/";
		var hostServer = "";
		var cookies = document.cookie.split(";");

		for(var i=0;i<cookies.length;i++){
			var cookie = cookies[i];
			if(cookie.indexOf("hostServer") != -1){
				//hostServer = cookie.split("=")[1];
				window.hostServer = unescape(hostServer);
				break;
			}
		}

		var csses = "";
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/bootstrap.min.css" />' // basic styles
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/font-awesome.min.css" />'
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/jquery-ui-1.10.3.full.min.css" />' // page specific plugin styles

		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/ace.min.css" />' // ace styles
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/ace-rtl.min.css" />'
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/ace-skins.min.css" />'
		
		csses += '<link rel="stylesheet" href="' + hostServer + 'css/main.css" />';

		document.write(csses);
	</script>

</head>

<body class="login-layout" >
<div class="main-container">
	<div class="main-content">
		<div class="row">
			<div class="col-sm-10 col-sm-offset-1" style="position:absolute; top:10%;">
				<div id="login-box" class="visible no-border" style="overflow: visible;">
					<form class="form-horizontal" role="form" id="loginFrom">
						<div align="center">
							<img src="./images/icon.png" style="width: 120px;">
							<h3><span class="white">方林信息平台</span></h3>
							<h5><span class="white">Fanglin Information Platform</span></h5>

							<label id="errorMsg" class="block clearfix red center" style="height: 15px;"></label>
							<div class="block clearfix" style="margin: 10px;" id="dloginContainer">

								<div class="login_content">
									<div class="login_body">

										<div class="login_qrcode">
											<div id="qrcode" class="login_qrcode_content" title=""><img alt="二维码" src=""></div>
											<div class="login_qrcode_text">
												请使用钉钉扫描二维码登录
												<span style="color:#38adff;cursor:pointer;"><!--<i class="icon-refresh"></i>-->刷新</span>
											</div>
											<div class="login_qrcode_scan" style="display: none;">
												二维码已扫描
											</div>
											<div class="login_qrcode_refresh  hide" style="display: block;">您的二维码已失效，<br>请点击下方刷新按钮</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>

<div id="backgroundImage">
	<img src="./images/background.jpg" width="1920" height="1080" />
</div>

<script type="text/javascript">

	var jses = "";


	if(!window.jQuery){
		jses += '<script src="' + hostServer + 'assets/js/jquery-2.0.3.min.js"><\/script>';
	}

	if("ontouchend" in document){
		jses += '<script src="' + hostServer + 'assets/js/jquery.mobile.custom.min.js"><\/script>';
	}

	jses += '<script src="' + hostServer + 'assets/js/bootstrap.min.js"><\/script>';
	jses += '<script src="' + hostServer + 'assets/js/typeahead-bs2.min.js"><\/script>';
	jses += '<script src="' + hostServer + 'assets/js/ace.min.js"><\/script>';
	jses += '<script src="' + hostServer + 'assets/js/ace-elements.min.js"><\/script>';
	jses += '<script src="' + hostServer + 'assets/js/ace-extra.min.js"><\/script>';
	jses += '<script src="' + hostServer + 'assets/js/jquery.fullscreenBackground.min.js"><\/script>';

	jses += '<script src="' + hostServer + 'js/com/api.js"><\/script>';
	jses += '<script src="' + hostServer + 'js/dlogin.js"><\/script>';

	document.write(jses);
</script>

</body>
</html>
