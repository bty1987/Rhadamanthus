<!DOCTYPE html>

    <link rel="stylesheet" href="assets/css/pace.min.css" />
    <script src='assets/js/pace.min.js'></script>

    <script type="text/javascript">

        var isF5 = false;
        document.onkeydown = function (e) {
            var ev = window.event || e;
            var code = ev.keyCode || ev.which;
            if (code == 116) {
                isF5 = true;
            }
        }
        window.onbeforeunload = onclose;
        function onclose(){
            if(!isF5){
                isF5 = false;
                return "";
            }
        }

        var server = './'
        var versionCode = '';
        var cookies = document.cookie.split(";");

        for(var i=0;i<cookies.length;i++){
            var cookie = cookies[i];

            if(cookie.indexOf("versionCode") != -1){
                versionCode = cookie.split("=")[1];
            }else if(cookie.indexOf("authentication") != -1){
                window.authentication = cookie.split("=")[1];
            }else if(cookie.indexOf("loginTime") != -1){
                window.loginTime = cookie.split("=")[1];
            }
        }

        var csses = "";
        csses += '<link rel="stylesheet" href="assets/css/bootstrap.min.css?version=' + versionCode + '" />'; // basic styles
        csses += '<link rel="stylesheet" href="assets/css/font-awesome.min.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/css/jquery.gritter.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/css/jquery-ui-1.10.3.full.min.css?version=' + versionCode + '" />'; // page specific plugin styles



        csses += '<link rel="stylesheet" href="assets/css/fullcalendar.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/css/chosen.min.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/css/datepicker.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/css/daterangepicker.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/css/bootstrap-timepicker.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/css/zTreeStyle.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/css/huploadify.css?version=' + versionCode + '" />';

        csses += '<link rel="stylesheet" href="assets/css/ace.min.css?version=' + versionCode + '" />'; // ace styles
        csses += '<link rel="stylesheet" href="' + server + 'css/main.css?version=' + versionCode + '" />';

        document.write(csses);

        var jses = "";

        if(!window.jQuery){
            jses += '<script src="' + server + 'assets/js/jquery-2.0.3.min.js?version=' + versionCode + '"><\/script>';
        }

        document.write(jses);
    </script>

</head>
