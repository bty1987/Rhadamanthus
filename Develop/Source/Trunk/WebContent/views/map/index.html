<!DOCTYPE html>
<html>  
<head>  
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />  
	<meta name="viewport" content="initial-scale=1.0, user-scalable=no" /> 
	
	<style type="text/css">
		body, html, #allmap {width: 100%;height: 100%; overflow: hidden; margin:0; font-family:"微软雅黑";}
	</style>
	
	<script type = "text/javascript" src = "http://api.map.baidu.com/api?v=2.0&ak=49YYCNGougjjYuqAZKqzkBEx"></script> 
	
</head>
<body style="margin:0">  
	<div id="allmap"></div>
	
	<script type="text/javascript">
		window.jQuery || document.write("<script src='../../assets/js/jquery-2.0.3.min.js'><"+"/script>");
		if("ontouchend" in document) document.write("<script src='../../assets/js/jquery.mobile.custom.min.js'><"+"/script>");
	</script>
	
	<script src="../../assets/js/bootstrap.min.js"></script>
	<script src="../../assets/js/bootbox.min.js"></script>
	
	<script src="../../assets/js/date-time/moment.min.js"></script>
	<script src="../../assets/js/date-time/daterangepicker.min.js"></script>
	<script src="../../assets/js/jqGrid/i18n/grid.locale-cn.js"></script>
	<script src="../../assets/js/jqGrid/jquery.jqGrid.src.js"></script>
	<script src="../../assets/js/jquery.gritter.min.js"></script>
	
	<script src="../../assets/js/ace-elements.min.js"></script>
	<script src="../../assets/js/ace.min.js"></script>

	<script src="../../js/com/api.js"></script>
	<script src="../../js/com/utils.js"></script>
	<script src="../../js/com/params.js"></script>
	<script src="../../js/com/core.js"></script>
	
	<script>
		
		var hostServer = "http://" + document.location.host + "/";
		window.hostServer = unescape(hostServer);
		params.hostServer = window.hostServer;
		
        //创建地图函数
		var mp = new BMap.Map("allmap"); // 在百度地图容器中创建一个地图 
		var point = new BMap.Point(123.38497,41.810947);//定义一个中心点
		mp.centerAndZoom(point, 15); // 设定地图中心和坐标并将地图显示在地图容器中
		mp.setMapStyle({style:'light'});
		mp.enableKeyboard();
		mp.enableScrollWheelZoom(true);
        
        //自定义覆盖物  
		function ComplexCustomOverlay(point, text, mouseoverText){  
			this._point = point;  
			this._text = text; 
			this._mouseoverText = mouseoverText;
		}
		
        //标记点提示框样式
        ComplexCustomOverlay.prototype = new BMap.Overlay();  
        ComplexCustomOverlay.prototype.initialize = function(map){  
			this._map = map;  
			var div = this._div = document.createElement("div");  
			div.style.position = "absolute";
			//div.style.zIndex = BMap.Overlay.getZIndex(this._point.lat); //堆叠顺序 
			div.style.zIndex = 1;
			div.style.backgroundColor = "yellow";  
			div.style.border = "1px solid green";  
			div.style.color = "255 255 255";  
			div.style.height = "18px";  
			div.style.padding = "2px";  
			div.style.lineHeight = "18px";  
			div.style.borderRadius = "5px";
			div.style.whiteSpace = "nowrap";  
			div.style.MozUserSelect = "none";  
			div.style.fontSize = "12px";
			var span = this._span = document.createElement("span");
			div.appendChild(span);
			span.innerHTML = this._text;
			var that = this;
			div.onclick = function(){
			   window.open('html/1.html');    //跳转定向
			};
          
          	//提示框下面的小三角和提示框横向位置 
			var arrow = this._arrow = document.createElement("div");  
			arrow.style.background = "url(http://map.baidu.com/fwmap/upload/r/map/fwmap/static/house/images/label.png) no-repeat";//提示框下的三角图标  
			arrow.style.position = "absolute";  
			arrow.style.width = "11px";  
			arrow.style.height = "10px";  
			arrow.style.top = "21px";  
			arrow.style.left = "8px";
			arrow.style.overflow = "hidden"; //滚动条 
			div.appendChild(arrow);
          
          	//鼠标放上和离开的触发事件
			div.onmouseover = function(){
				this.style.zIndex = 1000;
				this.style.backgroundColor = "#6BADCA";  
				this.style.borderColor = "#0000ff";
				this.getElementsByTagName("span")[0].innerHTML = that._mouseoverText;
				arrow.style.backgroundPosition = "0px -20px";  
			};  
      
			div.onmouseout = function(){  
				this.style.zIndex = 1;
				this.style.backgroundColor = "yellow";
				this.style.borderColor = "#BC3B3A";
				this.getElementsByTagName("span")[0].innerHTML = that._text;
				arrow.style.backgroundPosition = "0px 0px";
			};  
      
			mp.getPanes().labelPane.appendChild(div);  
            
			return div;  
        }; 
        
		ComplexCustomOverlay.prototype.draw = function(){  
			var map = this._map;  
			var pixel = map.pointToOverlayPixel(this._point);  
			this._div.style.left = pixel.x - parseInt(this._arrow.style.left) + "px";  
			this._div.style.top  = pixel.y - 30 + "px";           
		};  

		var points = [];
		
		com.post(api.data.queryVillage, {}, function(res){
		
			var villages = res.villages;
			
			for(var i=0;i<villages.length;i++){
			
				var village = villages[i];
				var villageName = village.villageName;
				var x = village.x;
				var y = village.y;
				var count = village.count;
				var comment = villageName + "已完成订单" + count + "套";
	
				var address = new BMap.Point(point.lng, point.lat);
				var mytext = new ComplexCustomOverlay(new BMap.Point(x, y), villageName, comment); //控制标注地址和备注信息
				
				mp.addOverlay(mytext);
			}
		}, null, false);
        
</script>  
</body>  
</html>
