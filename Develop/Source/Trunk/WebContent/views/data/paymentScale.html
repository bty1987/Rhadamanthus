<div>
<div class="page-content">
	<div class="row">
		<div class="col-xs-12">

			<div id="resultList" class="clearfix tab-pane active"></div>
			
			<div class="row" style="margin-left:30px;margin-right:30px">
				<div id="list" style="margin-left:10px"></div>

				<h3 class="clearfix">
					<a class="btn btn-minier btn-success" id="addBtn"><i
						class=" icon-plus"></i>添加</a>
				</h3>
			</div>
		</div>
	</div>
	

</div>

	<div class="modal fade" id="paymentScaleModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel">添加款项比例</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" id="form1">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="cid">公司名称</label>
							<div class="col-sm-9">
								<select id="cid" class="col-xs-10 col-sm-6   v_required" data-placeholder="请输入公司名称" data-toggle="popover" data-trigger='manual'>
									<option value="">&nbsp;</option>
								</select>
								<span class='star'></span>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="names">款项名称</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="names" class="col-xs-10 col-sm-6 v_required " data-toggle="popover" data-trigger='manual' />
								<span class='star'></span>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="scal">款项比例</label>
							<div class="col-sm-9"  id="clear">
								<!--<select id="brandright" multiple="multiple" class="col-sm-7 col-xs-10 chosen-select tag-input-style" data-placeholder="..." data-toggle="popover" data-trigger='manual'></select>-->
								<input id="scal" type="text" class="form-control v_required" name="tags"  placeholder="请输入比例 ..." />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="comment">备注</label>
							<div class="col-sm-9">
								<textarea id="comment" maxlength="128" class="col-xs-10 col-sm-6  "  rows="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>


</div>

<script type="text/javascript">
	$.getScript('js/data/paymentScale.js?version=' + versionCode);
</script>
