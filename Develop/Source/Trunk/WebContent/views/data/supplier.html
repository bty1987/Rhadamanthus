<div id="supplierPageContent">
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12">
                <div id="condList" class="fl_search clearfix"></div><!-- 查询条件-->
                <div id="resultList" class="clearfix tab-pane active"></div><!--查询结果-->
                <div id="pagenation" class="fl-page-wrap clearfix"></div><!--分页-->
            </div>
        </div>

        <div class="modal fade" id="supplierModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
                        <h4 class="modal-title" id="myModalLabel">厂商信息</h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal" role="form">
                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="supplierName">厂商名</label>
                                <div class="col-sm-9">
                                    <input type="text" id="supplierName"  class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                    <span class='star'></span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="loginId">登陆名</label>
                                <div class="col-sm-9">
                                    <input type="text" id="loginId" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                    <span class='star'></span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="password">密码</label>
                                <div class="col-sm-9">
                                    <input type="text" id="password" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                    <span class='star'></span>
                                </div>
                            </div>

                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                        <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    $.getScript('js/data/supplier.js?version=' + versionCode);
</script>
