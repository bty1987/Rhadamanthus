
<div id="DrawLineApplyPageContent" class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="drawLineSearchDiv"></div>
			<table id="listGrid"></table>
			<div id="gridPager"></div>
		</div>
	</div>
	
	<div class="modal fade" id="drawLineApplyModal" tabindex="-1" role="dialog"	aria-labelledby="drawLineApplyDialog" aria-hidden="true">
		<div class="modal-dialog" style="width:800px;">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="drawLineApplyDialog">部署信息</h4>
				</div>
				<div class="modal-body">
					<div id="calendar"></div>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="drawLineModal" tabindex="-1" role="dialog"	aria-labelledby="drawLineDialog" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="drawLineDialog">放线确认信息</h4>
				</div>
				
				<div class="modal-body">
					<form class="form-horizontal" role="form">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="actualDate">放线日期</label>
							<div class="col-sm-9">
								<input type="text" class="hide" id="autoId" />
								<input class="date-picker col-xs-10 col-sm-5 v_required" id="actualDate" type="text" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
					
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="startTime">开始时间</label>
							<div class="col-sm-9">
								<div class="bootstrap-timepicker">
									<input id="startTime" type="text" class="v_required"/>
								</div>
							</div>
						</div>
					
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="endTime">结束时间</label>
							<div class="col-sm-9">
								<div class="bootstrap-timepicker">
									<input id="endTime" type="text" class="v_required"/>
								</div>
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="drawLineGroup">放线小组</label>
							<div class="col-sm-9">
								<select class='col-xs-10 col-sm-5' id='drawLineGroup' data-toggle="popover" data-trigger='manual' ></select>
							</div>
						</div>
					</form>
				</div>
				
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default"
						data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript(hostServer + 'js/drawLine/drawLineApply.js?version=' + versionCode);
</script>
