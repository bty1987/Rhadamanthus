<div id="chargebackContent" class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<table id="listgrid"></table>
			<div id="gridPager"></div>
		</div>
	</div>
</div>

<div class="modal fade" id="statusModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
   			<div class="modal-header">
      			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
      			<h4 class="modal-title" id="myModalLabel">状态修改</h4>
   			</div>
   			<div class="modal-body">
	      		<form class="form-horizontal">
	      			<div class="form-group">
						<div class='col-sm-12 center commontStaticText red'></div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="comment">说明</label>
						<div class="col-sm-9">
							<textarea id="comment" maxlength="256" class="col-xs-10 col-sm-9" rows="4"></textarea>
						</div>
					</div>
				</form>
    		</div>
			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary">确定</button>
	        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
	      	</div>
  		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript('js/audit/chargeback.js?version=' + versionCode);
</script>
