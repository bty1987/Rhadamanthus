<div class="row">
	<div class="col-xs-12">
		<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
		<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
	</div>
</div>

<div class="modal fade" id="backVisitModal" tabindex="-1" role="dialog" aria-labelledby="backVisitDialog" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="backVisitDialog">回访</h4>
			</div>

			<div class="modal-body">
				<form class="form-horizontal" role="form">
					<div class="form-group">
						<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="orderId">订单号</label>
						<div class="col-sm-9">
							<input id="orderId" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					
					<div class="form-group">
						<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="orderAddr">楼盘地址</label>
						<div class="col-sm-9">
							<input id="orderAddr" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
				
					<div class="form-group">
						<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="customerName">客户名称</label>
						<div class="col-sm-9">
							<input id="customerName" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="backVisitType">类型</label>
						<div class="col-sm-9">
							<select class="col-xs-10 col-sm-5 v_required" id="backVisitType" data-toggle="popover" data-trigger='manual'></select>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="backVisitTime">时间</label>
						<div class="col-sm-9">
							<input id="backVisitTime" class="date-picker col-xs-10 col-sm-5" type="text" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
				
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="backVisitDes">描述</label>
						<div class="col-sm-9">
							<textarea id="backVisitDes" rows="3" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></textarea>
						</div>
					</div>
					<div class="space-4"></div>

				</form>
			</div>

			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript('js/construction/customerServiceBackVisit.js?version=' + versionCode);
</script>
