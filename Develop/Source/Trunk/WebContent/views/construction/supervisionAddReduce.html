<div id="fl-statement"></div>

<div class="row">
	<div class="col-xs-12">
		<table id="listGrid"></table>
		<div id="gridPager"></div>
	</div>
</div>

<div class="modal fade" id="addReduceModal" tabindex="-1" role="dialog" aria-labelledby="addReduceDialog" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="addReduceDialog">增减项</h4>
			</div>

			<div class="modal-body">
				<form class="form-horizontal" role="form">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="addReduceDes">描述</label>
						<div class="col-sm-9">
							<textarea id="addReduceDes" rows="3" class="col-xs-10 col-sm-5 v_required"></textarea>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="addReduceType">类别</label>
						<div class="col-sm-9">
							<select id="addReduceType" class="col-xs-10 col-sm-5 v_required">
								<option value="0">增项</option>
								<option value="1">减项</option>
							</select>
						</div>
					</div>
					<div class="space-4"></div>
				</form>
			</div>

			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="addOrReduceDetailModal" tabindex="-1" role="dialog" aria-labelledby="addOrReduceDetailModal" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
     		<div class="modal-header">
       			<button type="button" class="close" data-dismiss="modal">
	       			<span aria-hidden="true">&times;</span>
	       			<span class="sr-only">Close</span>
       			</button>
       			<h4 class="modal-title" id="addOrReduceDetailModal">增减项明细</h4>
     		</div>
     		<div class="modal-body">
				<div id='addOrReduceItemDiv'>                       
					<table id="addOrReduceItemList"></table>
					<div id="addOrReduceItemListGridPager"></div>     
				</div>   
				<div class="modal-footer ">
		        	<button type="button" id="canceDetailBtn" class="btn btn-default" data-dismiss="modal">返回</button>
		      	</div>
   			</div>
   		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript(hostServer + 'js/construction/supervisionAddReduce.js?version=' + versionCode);
</script>
