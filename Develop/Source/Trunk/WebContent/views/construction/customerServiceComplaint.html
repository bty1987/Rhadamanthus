<div id="fl-statement"></div>

<div class="row">
	<div class="col-xs-12">
		<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
		<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
	</div>
</div>

<div class="modal fade" id="complaintModal" tabindex="-1" role="dialog" aria-labelledby="complaintDialog" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="complaintDialog">投诉</h4>
			</div>

			<div class="modal-body">
				<form class="form-horizontal" role="form">
					<div class="form-group">
						<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="orderId">订单号</label>
						<div class="col-sm-9">
							<input id="orderId" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
				
					<div class="form-group">
						<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="customerName">客户名称</label>
						<div class="col-sm-9">
							<input id="customerName" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					
					<div class="form-group">
							<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="complaintTime">时间</label>
							<div class="col-sm-9">
								<input id="complaintTime" class="date-picker col-xs-10 col-sm-5 v_required" type="text" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
				
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="complaintLevel">等级</label>
						<div class="col-sm-9">
							<select id="complaintLevel" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'>
								<option value="0">普通</option>
								<option value="1">重要</option>
							</select>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="complaintType">类型</label>
						<div class="col-sm-9">
							<select id="complaintType" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'>
								<option value="0">装修</option>
								<option value="1">主材</option>
							</select>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="complaintDes">描述</label>
						<div class="col-sm-9">
							<textarea id="complaintDes" rows="3" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></textarea>
						</div>
					</div>
					<div class="space-4"></div>

				</form>
			</div>

			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="complaintHandleModal" tabindex="-1" role="dialog" aria-labelledby="complaintHandleDialog" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="complaintHandleDialog">投诉</h4>
			</div>

			<div class="modal-body">
				<form class="form-horizontal" role="form">
					<div class="form-group">
						<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="handleOrderId">订单号</label>
						<div class="col-sm-9">
							<input id="handleOrderId" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
				
					<div class="form-group">
						<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="handleCustomerName">客户名称</label>
						<div class="col-sm-9">
							<input id="handleCustomerName" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="handleComplaintLevel">等级</label>
						<div class="col-sm-9">
							<select id="handleComplaintLevel" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'>
								<option value="0">普通</option>
								<option value="1">重要</option>
							</select>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="handleComplaintType">类型</label>
						<div class="col-sm-9">
							<select id="handleComplaintType" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'>
								<option value="0">装修</option>
								<option value="1">主材</option>
							</select>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="complaintHandleDes">处理描述</label>
						<div class="col-sm-9">
							<textarea id="complaintHandleDes" rows="3" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></textarea>
						</div>
					</div>
					<div class="space-4"></div>

				</form>
			</div>

			<div class="modal-footer">
				<button type="button" id="saveHandleBtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancelHandleBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript(hostServer + 'js/construction/customerServiceComplaint.js?version=' + versionCode);
</script>
