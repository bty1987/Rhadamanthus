<div id="fl-statement"></div>

<div class="row">
	<div class="col-xs-12">
		<table id="deductionListGrid"></table>
		<div id="deductionGridPager"></div>
	</div>
	
	<div class="modal fade" id="deductionModal" tabindex="-1" role="dialog"	aria-labelledby="deductionDialog" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="decorationOrderDialog">扣款</h4>
				</div>
				
				<div class="modal-body">
					<form class="form-horizontal" role="form">
					
						<div class="form-group">
							<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="orderId">订单号</label>
							<div class="col-sm-9">
								<input id="orderId" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
					
						<div class="form-group">
							<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="orderAddr">楼盘名称</label>
							<div class="col-sm-9">
								<input id="orderAddr" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						
						<div class="form-group">
							<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="deductionTime">时间</label>
							<div class="col-sm-9">
								<input id="deductionTime" class="date-picker col-xs-10 col-sm-5" type="text" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						
						<div class="form-group">
							<label for="form-field-1" class="col-sm-3 control-label no-padding-right" for="deductionMoney">金额</label>
							<div class="col-sm-9">
								<input id="deductionMoney" class="col-xs-10 col-sm-5" type="text" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="deductionDes">备注</label>
							<div class="col-sm-9">
								<textarea id="deductionDes" class="col-xs-10 col-sm-5" rows="3" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>
					</form>
				</div>
				
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
	
</div>

<script type="text/javascript">
	$.getScript(hostServer + 'js/construction/inspectionDeduction.js?version=' + versionCode);
</script>
