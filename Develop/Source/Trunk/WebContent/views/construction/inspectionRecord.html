<div id="fl-statement"></div>

<div class="row">
	<div class="col-xs-12">
		<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
		<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
	</div>
	
	<div class="modal fade" id="recordModal" tabindex="-1" role="dialog" aria-labelledby="recordDialog" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="decorationOrderDialog">记录</h4>
				</div>
				
				<div class="modal-body">
					<form class="form-horizontal" role="form">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="orderId">订单号</label>
							<div class="col-sm-9">
								<input id="orderId" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual' value="111"/>
							</div>
						</div>
					
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="orderAddr">楼盘地址</label>
							<div class="col-sm-9">
								<input id="orderAddr" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="startDate">开始时间</label>
							<div class="col-sm-9">
								<input id="startDate" class="date-picker col-xs-10 col-sm-5 v_required"  type="text" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
							</div>
							<label class="col-sm-3 control-label no-padding-right" for="startTime"></label>
							<div class="col-sm-9">
								<div class="bootstrap-timepicker">
									<input id="startTime" class="col-xs-10 col-sm-5 v_required" type="text" />
								</div>
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="endDate">结束时间</label>
							<div class="col-sm-9">
								<input id="endDate" class="date-picker col-xs-10 col-sm-5 v_required"  type="text" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
							</div>
							<label class="col-sm-3 control-label no-padding-right" for="endTime"></label>
							<div class="col-sm-9">
								<div class="bootstrap-timepicker">
									<input id="endTime" class="col-xs-10 col-sm-5 v_required" type="text" />
								</div>
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="recordDes">备注</label>
							<div class="col-sm-9">
								<textarea id="recordDes" class="col-xs-10 col-sm-5 v_required" rows="3" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>
						
					</form>
				</div>
				
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript(hostServer + 'js/construction/inspectionRecord.js?version=' + versionCode);
</script>
