<div id="decorationOrderPageContent" class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="orderSearchDiv"></div>
			<table id="listGrid"></table>
			<div id="gridPager"></div>
		</div>
	</div>
	
	<div class="modal fade" id="agreementModal" tabindex="-1" role="dialog"	aria-labelledby="agreementDialog" aria-hidden="true" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="agreementDialog">合同</h4>
				</div>
			
				<div class="modal-body">
					<p align="center">
						<button type="button" class="btn btn-app btn-primary no-radius" id='signContractBtn'>
							<i class="icon-envelope bigger-230"></i>
							签订合同
						</button>
					</p>
				</div>
				
				<div class="modal-footer">
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="refundContractModal" tabindex="-1" role="dialog" aria-labelledby="refundContractDialog" aria-hidden="true" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span>
						<span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="drawLineDialog">退款</h4>
				</div>
				
				<div class="modal-body">
					<form class="form-horizontal" role="form">
						<div class="form-group">
							<input class="hide" id="decorationOrderId" type="text" />
							<label for="applayTime" class="col-sm-3 control-label no-padding-right">付款信息</label>
							<div class="col-sm-9">
								<span id="decorationPaymentInfo"></span>
							</div>
						</div>
							
						<div class="form-group">
							<label for="refundValue" class="col-sm-3 control-label no-padding-right">退款金额</label>
							<div class="col-sm-9">
								<input id="refundValue" class="col-xs-10 col-sm-5 v_required v_price" type="text" data-toggle="popover" data-trigger='manual'/>
								<input id="paymentValue" type="hidden"/>
							</div>
						</div>
					</form>
				</div>
				
				<div class="modal-footer">
					<button type="button" id="refundContractBtn" class="btn btn-primary">提交</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="customerInfoModal" tabindex="-1" role="dialog" aria-labelledby="customerInfoDialog" aria-hidden="true" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span>
						<span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="customerInfoDialog">客户信息修改</h4>
				</div>
				
				<div class="modal-body">
					<form class="form-horizontal" role="form">
						<div class="form-group">
							<label for="refundValue" class="col-sm-3 control-label no-padding-right">客户姓名</label>
							<div class="col-sm-9">
								<input id="customerName" class="col-xs-10 col-sm-5 v_required v_name" type="text" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
							
						<div class="form-group">
							<label for="refundValue" class="col-sm-3 control-label no-padding-right">联系方式</label>
							<div class="col-sm-9">
								<input id="phone" class="col-xs-10 col-sm-5 v_required v_phones2" type="text" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
					</form>
				</div>
				
				<div class="modal-footer">
					<button type="button" id="customerInfoBtn" class="btn btn-primary">提交</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
