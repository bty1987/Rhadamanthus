<div id="fl-statement"></div>

<div class="row">
	<div class="col-xs-12">
		<div id="backVisitSearchDiv"></div>
		<table id="listGrid"></table>
		<div id="gridPager"></div>
	</div>
	
	<div class="modal fade" id="backVisitModal" tabindex="-1" role="dialog"	aria-labelledby="backVisitDialog" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="backVisitDialog">订单</h4>
				</div>
				
				<div class="modal-body">
					<form class="form-horizontal" role="form">
						<div class="form-group">
							<label for="grade" class="col-sm-3 control-label no-padding-right">等级</label>
							<div class="col-sm-9">
								<select id="grade" class="col-xs-10 col-sm-5 v_required"></select>
							</div>
						</div>
						
						<div class="form-group">
							<label for="backVisitContent" class="col-sm-3 control-label no-padding-right">内容</label>
							<div class="col-sm-9">
								<textarea id="backVisitContent" class="col-xs-10 col-sm-5 v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="50"></textarea>
							</div>
						</div>
					</form>
				</div>
				
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
	
<script type="text/javascript">
	$.getScript(hostServer + 'js/decoration/decorationOrderBackVisit.js?version=' + versionCode);
</script>
