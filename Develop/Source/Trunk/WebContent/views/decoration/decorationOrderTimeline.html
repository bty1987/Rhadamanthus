<link rel="stylesheet" href="assets/css/photoswipe.css">
<link rel="stylesheet" href="assets/default-skin/default-skin.css">

<div class="page-content">
    <div class="row">

        <style>

            @media only screen and (min-width: 991px){

                .timeline-center.timeline-container:before {
                    left: 50%;
                    margin-left: -2px;
                }

                .timeline-center .timeline-label{
                    margin-left: 50%;
                }

                .timeline-center .timeline-item{
                    width: 50%;
                }

                .timeline-center .timeline-info{
                    position: absolute;
                }

                .timeline-center .timeline-item:nth-of-type(2n){
                    margin-left: 50%;
                }

                .timeline-center .timeline-item:nth-of-type(2n) .timeline-info{
                    left: -30px;
                }

                .timeline-center .timeline-item:nth-of-type(2n) .widget-box{
                    margin-left: 30px;
                }

                /*.timeline-center .timeline-item :nth-of-type(2n){
                    width: 50%;
                }*/

                .timeline-center .timeline-item:nth-of-type(2n+1) .timeline-info{
                    right: -30px;
                }

                .timeline-center .timeline-item:nth-of-type(2n+1) .widget-box{
                    margin-left: 0;
                    margin-right: 30px;
                }

            }

            .flloading:after {
                content: "";
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: rgba(0, 0, 0, 0.5);
                /*background-image: url("assets/img/loading.gif");*/
                background-position: center;
                background-repeat: no-repeat;
                z-index: 999;
            }

            .flloading:before {
                font-family: FontAwesome;
                content: "\f110";
                position: absolute;
                width: 30px;
                height: 30px;
                margin-left: -15px;
                margin-top: -15px;
                top: 50%;
                left: 50%;
                z-index: 1000;
                font-size: 30px;
                color: #FFF;
                -moz-animation: spin 2s infinite linear;
                -o-animation: spin 2s infinite linear;
                -webkit-animation: spin 2s infinite linear;
                animation: spin 2s infinite linear;
                text-align: center;
                line-height: 30px;
            }

            .timeline-item .imglist{
                min-height: 60px;
            }

            .timeline-item .imglist .img-item{
                background-color: #fff;
                border: 1px solid #aaa;
                padding: 2px;
                display: inline-block;
                width: 50px;
                height: 50px;
                margin-right: 10px;
            }

            .timeline-item .imglist img{
                display: block;
                width: 100% !important;
                height: 100% !important;
                background-color: transparent;
                border: none;
                padding: 0;
            }

            .my-gallery img {
                width: 100%;
                height: 100%;
                display: block;
            }
            
            .my-gallery figure {
                background-color: #fff;
                border: 1px solid #aaa;
                padding: 2px;
                display: inline-block;
                width: 50px;
                height: 50px;
                margin-right: 10px;
            }

            .my-gallery figure .wrap{
                height: 100%;
            }
            
            .my-gallery figcaption {
                display: none;
            }
        </style>

        <div class="col-xs-12 ">
            <div class="timeline-container timeline-center">

                <div class="timeline-items">
                
                    <div class="timeline-item clearfix" id="orderId">
                        <div class="timeline-info">
                            <i class="timeline-indicator icon-star btn btn-danger no-hover"></i>
                        </div>

                        <div class="widget-box">
                            <div class="widget-header header-color-red widget-header-small">
                                <h3 class="smaller">订单号:<b id="oid"></b></h3>
                            </div>
                        </div>
                    </div>

                    <!--基本信息-->
                    <div class="timeline-item clearfix" id="baseinfo">
                    
                        <div class="timeline-info">
                            <i class="timeline-indicator icon-star btn btn-success no-hover"></i>
                        </div>
                    
                        <div class="widget-box">
                            <div class="widget-header header-color-green widget-header-small">
                                <h5 class="smaller">基本信息</h5>
                            </div>

                            <div class="widget-body">
                                <div class="widget-main clearfix" >

                                    <div class="col-xs-12 col-sm-12">
                                        <i class="icon-caret-right blue"></i>
                                        <span>楼盘地址 ：<i class="icon-map-marker light-orange bigger-110"></i></span>
                                        <span name="addr"></span>
                                    </div>


                                    <div class="col-xs-12 col-sm-6">
                                        <i class="icon-caret-right blue"></i>
                                        <span>客户名 ：</span>
                                        <span name="uname"> 小明</span>
                                    </div>

                                    <div class="col-xs-12 col-sm-6">
                                        <i class="icon-caret-right blue"></i>
                                        <span>设计师 ：</span>
                                        <span name="dname"></span>
                                        <span class="blue" name="dphone"></span>
                                    </div>

                                    <div class="col-xs-12 col-sm-6">
                                        <i class="icon-caret-right blue"></i>
                                        <span>业务员 ：</span>
                                        <span name="sname"></span>
                                        <span class="blue" name="sphone"></span>
                                    </div>

                                    <div class="col-xs-12 col-sm-6">
                                        <i class="icon-caret-right blue"></i>
                                        <span>订单状态 ：</span>
                                        <span name="status"> 小明</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!--报价-->
                    <div class="timeline-item clearfix" id="quotations">

                        <div class="timeline-info">
                            <i class="timeline-indicator icon-star btn btn-warning no-hover"></i>
                        </div>

                        <div class="widget-box">
                            <div class="widget-header header-color-orange widget-header-small">
                                <h5 class="smaller">报价</h5>
                            </div>
                        </div>
                    </div>
                    
                    <!--图纸-->
                    <div class="timeline-item clearfix" id="orderpics">

                        <div class="timeline-info">
                            <i class="timeline-indicator icon-star btn btn-info no-hover"></i>
                        </div>

                        <div class="widget-box">
                            <div class="widget-header header-color-blue widget-header-small">
                                <h5 class="smaller">图纸</h5>
                            </div>

                            <div class="widget-body">
                                <div class="widget-main" >
                                    <div class="clearfix">
                                        <p class="orange">效果图</p>
                                        <div name="effect" class="my-gallery"></div>
                                    </div>

                                    <div class="clearfix">
                                        <p class="green">工程图</p>
                                        <div name="project" class="my-gallery"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!--款项-->
                    <div class="timeline-item clearfix" id="payment">
                        <div class="timeline-info">
                            <i class="timeline-indicator icon-trophy btn btn-grey no-hover green"></i>
                        </div>

                        <div class="widget-box">
                            <div class="widget-header header-color-grey widget-header-small">
                                <h5 class="smaller">款项信息</h5>
                            </div>

                            <div class="widget-body">
                                <div class="widget-main">
                                    <ul name="list" class="list-unstyled list-striped pricing-table-header"></ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!--水力电-->
                    <div class="timeline-item clearfix" id="project">
                        <div class="timeline-info">
                            <i class="timeline-indicator icon-trophy btn btn-success no-hover green"></i>
                        </div>

                        <div class="widget-box">
                            <div class="widget-header header-color-green widget-header-small">
                                <h5 class="smaller">施工信息</h5>
                            </div>

                            <div class="widget-body">
                                <div class="widget-main">
                                    <p class="orange">工人信息</p>
                                    <div class="dialogs" name="workers"></div>
                                    <p class="orange">施工图片</p>
                                    <div name="project" class="my-gallery"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 图片弹层 -->
    <div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="pswp__bg"></div>
        <div class="pswp__scroll-wrap">
            <div class="pswp__container">
                <div class="pswp__item"></div>
                <div class="pswp__item"></div>
                <div class="pswp__item"></div>
            </div>

            <div class="pswp__ui pswp__ui--hidden">
                <div class="pswp__top-bar">
                    <div class="pswp__counter"></div>
                    <button class="pswp__button pswp__button--close" title="Close (Esc)"></button>
                    <button class="pswp__button pswp__button--zoom" title="Zoom in/out"></button>
                    <div class="pswp__preloader">
                        <div class="pswp__preloader__icn">
                            <div class="pswp__preloader__cut">
                                <div class="pswp__preloader__donut"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pswp__share-modal pswp__share-modal--hidden pswp__single-tap">
                    <div class="pswp__share-tooltip"></div>
                </div>

                <button class="pswp__button pswp__button--arrow--left" title="Previous (arrow left)"></button>
                <button class="pswp__button pswp__button--arrow--right" title="Next (arrow right)"></button>

                <div class="pswp__caption">
                    <div class="pswp__caption__center"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $(function(){

        $.getScript('assets/js/photoswipe.min.js', function(){
            $.getScript('assets/js/photoswipe-ui-default.min.js', function(){
                $.getScript('js/decoration/decorationOrderTimeline.js?version=' + versionCode);
            });
        })
    });
</script>
