<div id="materialInsidePageContent" class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="searchDiv"></div>
			<table id="listgrid"></table>
			<div id="gridPager"></div>
		</div>
	</div>
	
	<div class="modal fade" id="materialInsideModal" tabindex="-1" role="dialog"	aria-labelledby="materialInsideDialog" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="materialInsideDialog">场外信息</h4>
				</div>
				<div class="modal-body">
					<div class="row">
					<div class="col-sm-12">
					<form class="form-horizontal" role="form">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="orderId">订单编号</label>
							<div class="col-sm-9">
								<input type="text" id="orderId" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
					
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="materialType">品类</label>
							<div class="col-sm-9">
								<select class="col-xs-9 col-sm-4 v_required" id="materialType" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="materialBrand">品牌</label>
							<div class="col-sm-9">
								<select class="col-xs-9 col-sm-4 v_required" id="materialBrand" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="designerName">设计师</label>
							<div class="col-sm-9">
								<select class="chosen-select col-sm-4" id="designerName" data-placeholder="请输入设计师" data-toggle="popover" data-trigger='manual' style="display: none;">
									<option value="">&nbsp;</option>
								</select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="sales">销售额</label>
							<div class="col-sm-9">
								<input type="text" id="sales" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="profit">利润</label>
							<div class="col-sm-9">
								<input type="text" id="profit" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="des">备注</label>
							<div class="col-sm-9">
								<textarea id="des" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
						
					</form>
					</div>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript(hostServer + 'js/material/materialInside.js?version=' + versionCode);
</script>
