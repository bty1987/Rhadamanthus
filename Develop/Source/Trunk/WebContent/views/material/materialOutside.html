
<div id="materialOutsidePageContent" class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="materialOutsideModal" tabindex="-1" role="dialog"	aria-labelledby="materialOutsideDialog" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="materialOutsideDialog">场外信息</h4>
				</div>
				<div class="modal-body">
					<div class="row">
					<div class="col-sm-12">
					<form class="form-horizontal" role="form">
					
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="orderId">订单号</label>
							<div class="col-sm-9">
								<input type="text" class="col-sm-5 v_required" id="orderId" data-toggle="popover" data-trigger='manual' maxlength="15">
							</div>
						</div>
						<div class="space-4"></div>
					
						<div class="form-group" id="orderAddr" style="display: none;">
							<label for="orderAddr" class="col-sm-3 control-label no-padding-right">楼盘地址</label>
							<div class="col-sm-9">
								<input type="text" id="orderAddrInfo" class="col-sm-5" disabled="disabled"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group" id="customerName" style="display: none;">
							<label class="col-sm-3 control-label no-padding-right" for="customerName">客户</label>
							<div class="col-sm-9">
								<input type="text" id="customerNameInfo" class="col-sm-5" disabled="disabled"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div id="materialBrandInfo">
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="materialType">品类</label>
								<div class="col-sm-9">
									<select class="col-xs-9 col-sm-4 v_required" id="materialType" data-toggle="popover" data-trigger='manual'></select>
								</div>
							</div>
							<div class="space-4"></div>
							
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="materialBrand">品牌</label>
								<div class="col-sm-9">
									<select class="col-xs-9 col-sm-4 v_required" id="materialBrand" data-toggle="popover" data-trigger='manual'></select>
								</div>
							</div>
							<div class="space-4"></div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="salesmanName">业务员</label>
							<div class="col-sm-9">
								<select class="chosen-select col-sm-4" id="salesmanName" data-placeholder="请输入业务员" data-toggle="popover" data-trigger='manual' style="display: none;">
									<option value="">&nbsp;</option>
								</select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="sales">销售额</label>
							<div class="col-sm-9">
								<input type="text" id="sales" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="profit">利润</label>
							<div class="col-sm-9">
								<input type="text" id="profit" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="des">备注</label>
							<div class="col-sm-9">
								<textarea id="des" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
						
					</form>
					</div>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="approvalMaterialOutsideRefundModal" tabindex="-1" role="dialog" aria-labelledby="approvalMaterialOutsideRefundModal" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
     		<div class="modal-header">
       			<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
       			<h4 class="modal-title" id="myModalLabel">主材场外退款申请</h4>
     		</div>
     		<div class="modal-body">
	      		<form class="form-horizontal" role="form">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="materialOutsideRefundDes">描述</label>
						<div class="col-sm-9">
							<textarea id="materialOutsideRefundDes" maxlength="128" class="col-xs-10 col-sm-6 v_required" rows="3" data-toggle="popover" data-trigger='manual'></textarea>
							<span class='star'></span>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label for="vApproveManSel" class="col-sm-3 control-label no-padding-right">审批人</label>
						<div class="col-sm-9">
							<select id="vApproveManSel" class="chosen-select col-xs-10 col-sm-6 v_required" data-placeholder="请输入审批人" data-toggle="popover" data-trigger='manual' style="display: none;">
								<option value="">&nbsp;</option>
							</select> 
							<span class='star'></span>
						</div>
					</div>
					<div class="space-4"></div>
				</form>
     		</div>
			<div class="modal-footer">
				<button type="button" id="vApproveSaveBtn" class="btn btn-primary">修改申请</button>
	        	<button type="button" id="vApproveCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
	      	</div>
   		</div>
	</div>
</div>

	$.getScript(hostServer + 'js/material/materialOutside.js?version=' + versionCode);
