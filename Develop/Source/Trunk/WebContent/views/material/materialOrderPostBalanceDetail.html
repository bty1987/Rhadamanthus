<div id="materialOrderPostBalanceDetailPageContent" class="page-content">
	<div id="fl-statement"></div>

	<div class="row">
		<div class="col-xs-12">
			<table id="listGrid"></table>
			<div id="gridPager"></div>
		</div>
	</div>
</div>

<div class="modal fade" id="materialSubOrderItemBalanceModal" tabindex="-1" role="dialog" aria-labelledby="materialSubOrderItemBalanceModal" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="materialSubOrderItemBalanceModal">订单点数</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal" role="form">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="calcType">计算方式</label>
						<div class="col-sm-9">
							<input type="text" id="calcType" readonly="readonly" class="col-xs-10 col-sm-4 v_required" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="value">修改值</label>
						<div class="col-sm-9">
							<input type="text" id="value" class="col-xs-10 col-sm-4 v_required" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					<div class="space-4"></div>
					
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript(hostServer + 'js/material/materialOrderPostBalanceDetail.js?version=' + versionCode);
</script>
