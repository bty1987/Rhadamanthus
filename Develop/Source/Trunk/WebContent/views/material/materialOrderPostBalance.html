<div id="materialOrderPostBalancePageContent">
	<div class="page-content">
		<div class="row">
			<div class="col-xs-12">
				<div id="searchDiv"></div>
				<table id="listGrid"></table>
				<div id="gridPager"></div>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="materialSubOrderPostBalanceModal" tabindex="-1" role="dialog" aria-labelledby="materialSubOrderPostBalanceDialog" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title">主材订单结算</h4>
			</div>

			<div class="modal-body">
				<form class="form-horizontal" role="form">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="custProfit">利润值</label>
						<div class="col-sm-9">
							<input id="custProfit" type="text" class="col-sm-6 v_required" />
						</div>
					</div>
				</form>
			</div>

			<div class="modal-footer">
				<button type="button" id="postBalanceBtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript(hostServer + 'js/material/materialOrderPostBalance.js?version=' + versionCode);
</script>
