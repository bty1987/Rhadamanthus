<div id="materialSubOrderDetailPageContent" class="page-content">
	<div id="fl-statement"></div>

	<div class="row">
		<div class="col-xs-12">
			<ul class="flex-table">
				<li class="line  table-title">
					<div class="line-wrap order">
						<div class="cell index"></div>
					</div>
					<div class="line-wrap content">
						<div class="cell name">名称</div>
						<div class="cell type">品类</div>
						<div class="cell brand">品牌</div>
						<div class="cell unit">单位</div>
						<div class="cell money">折扣价</div>
						<div class="cell money">售价</div>
						<div class="cell num">数量</div>
						<div class="cell money">总价</div>
						<div class="cell money">结算值</div>
						<div class="cell seat">备注</div>
						<div class="cell package "></div>
					</div>
					<div class="line-wrap action">
						<div class="cell option">操作</div>
					</div>
				</li>
			</ul>

			<ul class="flex-table" id="list">
				<!-- <div class="fl-quo-input hide" style="background: transparent"><input type="text" class="v_required v_float"></div>  -->
			</ul>

			<div>
				<h3 class="clearfix">
					<a style="margin-top: 7px;margin-right:10px;" class="btn btn-minier btn-danger pull-left" id="refundBtn"><i class="icon-shopping-basket bigger-110"></i>退货</a>
					<a style="margin-top: 7px;margin-right:10px;" class="btn btn-minier btn-success pull-left hide" id="refundCommitBtn"><i class="icon-ok bigger-110"></i>确认</a>
					<a style="margin-top: 7px;margin-right:10px;" class="btn btn-minier btn-purple pull-left hide" id="refundCancelBtn"><i class="icon-remove bigger-110"></i>取消</a>
					<a style="margin-top: 7px;margin-right:10px;" class="btn btn-minier btn-primary pull-left" id="backBtn"><i class="icon-mail-forward bigger-110"></i>返回</a>
				</h3>
			</div>
		</div>
	</div>

	<div class="modal fade" id="rejectMaterialSubOrderModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="updateMaterialSubOrderModal">退货信息</h4>
				</div>

				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="refundTotal">退货总额</label>
							<div class="col-sm-9">
								<input id="refundTotal" type="text" class=" col-sm-6" readonly="readonly"/>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="refund">实际退款额</label>
							<div class="col-sm-9">
								<input id="refund" type="text" value="0" class=" col-sm-6 v_required v_price" />
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="refundDes" >备注信息</label>
							<div class="col-sm-9">
								<textarea id="refundDes" maxlength="256" class="col-sm-6 v_required" rows="3"></textarea>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="refund">审批人</label>
							<div class="col-sm-9">
								<select id="approver" class="chosen-select col-md-6 v_required" data-toggle="popover" data-trigger='manual' style="display: none;">
									<option value="">&nbsp;</option>
								</select> <i class='icon-asterisk'></i>
							</div>
						</div>

					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="saveRefundBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
