
<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="businessDeptModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel">部门或大区</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="businessDeptId">部门编号</label>
							<div class="col-sm-9">
								<input type="text" maxlength="10" id="businessDeptId" class="col-xs-10 col-sm-6 v_businessDept v_required" data-toggle="popover" data-trigger='manual'/>
								<span class='star'></span>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="businessDeptName">部门名称</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="businessDeptName" class="col-xs-10 col-sm-6 v_name v_required" data-toggle="popover" data-trigger='manual'/>
								<span class='star'></span>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="departmenttype">部门类型</label>
							<div class="col-sm-9">
								<select id="departmenttype" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'></select>
								<span class='star'></span>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="fatherdept">所属部门</label>
							<div class="col-sm-9">
								<select id="fatherdept" class="col-xs-10 col-sm-6 " data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="cityProperSel">所属城区</label>
							<div class="col-sm-9">
								<select id="cityProperSel" class="city col-xs-10 col-sm-6 " data-toggle="popover" data-trigger='manual'></select>

							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="contractPrefix">合同号标识</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="contractPrefix" class="col-xs-10 col-sm-6"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="des">描述</label>
							<div class="col-sm-9">
								<textarea id="des" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript('js/department/department.js?version=' + versionCode);
</script>
