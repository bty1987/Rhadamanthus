
<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<!-- 查询条件-->
			<div id="condList" class="fl_search clearfix"></div>
			<!--查询结果-->
			<div id="resultList" class="clearfix tab-pane active"></div>
			<!--分页-->
			<div id="pagenation" class="fl-page-wrap clearfix" style="text-align: center;max-width: 680px;">

				<a style="margin-top: 7px;" class="btn btn-minier  btn-primary pull-left" name="add"><i class="icon-plus bigger-110"></i>添加</a>

				<div class="pager-info" style="display: inline-block;">
					第<span class="bigger-120 blue" name="nowPage">0</span>页，
					共<span class="bigger-120 blue" name="totalPage">0</span>页，
					每页显示<span class="bigger-120 blue" name="rows">10</span>条，
					共找到<span class="bigger-120 blue" name="totalRecords">0</span>条
				</div>

				<ul class="pager pull-right">
					<li class="previous" name="prev">
						<a href="javascript:void (0);" >← 上一页</a>
					</li>
					<li class="next" name="next">
						<a href="javascript:void (0);" >下一页 →</a>
					</li>
				</ul>
			</div>
		</div>
	</div>

	<div class="modal fade" id="quotationItemModal" tabindex="-1" role="dialog"	aria-labelledby="quotationItemDialog" aria-hidden="false" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id=""quotationItemDialog"">报价项</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" role="form">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="itemId">编号</label>
							<div class="col-sm-9">
								<input type="text" id="autoId" class="col-xs-10 col-sm-5 hide" />
								<input type="text" id="itemId" class="col-xs-10 col-sm-5 v_itemId v_required" data-toggle="popover" data-trigger='manual' maxlength="8"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="version">版本</label>
							<div class="col-sm-3">
								<select class="form-control v_required" id="version" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="itemName">名称</label>
							<div class="col-sm-9">
								<input type="text" id="itemName" class="col-xs-10 col-sm-5 v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationType">类型</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="quotationType" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationClassification">分类</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="quotationClassification" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationBigCategory">大类</label>
							<div class="col-sm-3">
								<select class="form-control v_required" id="quotationBigCategory" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationSmallCategory">小类</label>
							<div class="col-sm-5">
								<select class="form-control v_required" id="quotationSmallCategory" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="measurementUnit">单位</label>
							<div class="col-sm-3">
								<select class="form-control v_required" id="measurementUnit" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="workType">工种</label>
							<div class="col-sm-3">
								<select class="form-control v_required" id="workType" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationItemDes">信息</label>
							<div class="col-sm-9">
								<textarea id="quotationItemDes" class="col-xs-10 col-sm-5 v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="500"></textarea>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="unitPrice">单价</label>
							<div class="col-sm-9">
								<input type="text" id="unitPrice" class="col-xs-10 col-sm-5 v_required v_float" data-toggle="popover" data-trigger='manual' maxlength="5"/>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript(hostServer + 'js/quotation/quotationItem.js?version=' + versionCode);
</script>
