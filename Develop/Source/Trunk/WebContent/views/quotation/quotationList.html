	<script type="text/javascript">
	
		var hostServer = "http://" + document.location.host + "/";
		var versionCode = "";
		var cookies = document.cookie.split(";");
		
		for(var i=0;i<cookies.length;i++){
			var cookie = cookies[i];
			
			if(cookie.indexOf("hostServer") != -1){
				//hostServer = cookie.split("=")[1];
				window.hostServer = unescape(hostServer);
			}else if(cookie.indexOf("versionCode") != -1){
				versionCode = cookie.split("=")[1];
			}
		}
		
		var jses = "";
		
		if(!window.jQuery){
			jses += '<script src="' + hostServer + 'assets/js/jquery-2.0.3.min.js?version=' + versionCode + '"><\/script>';
		}
	
		if("ontouchend" in document){
			jses += '<script src="' + hostServer + 'assets/js/jquery.mobile.custom.min.js?version=' + versionCode + '"><\/script>';
		}
		
		jses += '<script src="' + hostServer + 'assets/js/bootstrap.min.js?version=' + versionCode + '"><\/script>';
		jses += '<script src="' + hostServer + 'assets/js/bootbox.min.js?version=' + versionCode + '"><\/script>';
		
		jses += '<script src="' + hostServer + 'assets/js/date-time/moment.min.js?version=' + versionCode + '"><\/script>';
		jses += '<script src="' + hostServer + 'assets/js/date-time/daterangepicker.min.js?version=' + versionCode + '"><\/script>';
		jses += '<script src="' + hostServer + 'assets/js/jqGrid/i18n/grid.locale-cn.js?version=' + versionCode + '"><\/script>';
		jses += '<script src="' + hostServer + 'assets/js/jqGrid/jquery.jqGrid.src.js?version=' + versionCode + '"><\/script>';
		
		jses += '<script src="' + hostServer + 'assets/js/jquery.gritter.min.js?version=' + versionCode + '"><\/script>';
		
		jses += '<script src="' + hostServer + 'assets/js/ace-elements.min.js?version=' + versionCode + '"><\/script>';
		jses += '<script src="' + hostServer + 'assets/js/ace.min.js?version=' + versionCode + '"><\/script>';
		
		jses += '<script src="' + hostServer + 'js/com/api.js?version=' + versionCode + '"><\/script>';
		jses += '<script src="' + hostServer + 'js/com/utils.js?version=' + versionCode + '"><\/script>';
		jses += '<script src="' + hostServer + 'js/com/core.js?version=' + versionCode + '"><\/script>';
		jses += '<script src="' + hostServer + 'js/com/params.js?version=' + versionCode + '"><\/script>';
		
		jses += '<script src="' + hostServer + 'js/quotation/quotationList.js?version=' + versionCode + '"><\/script>';
		
		document.write(jses);
