
<div class="page-content">

	<div id="functionAreaList" class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div id="functionAreaQuotationItemList" class="row hide">
		<div  class="col-xs-12">
			<div class="tabbable">
				<ul id="myTab" class="nav nav-tabs">
					<li class="active">
						<a id="showFunctionAreaName" href="#add" data-toggle="tab">功能区报价项</a>
					</li>
				</ul>

				<div class="tab-content ">
					<div class="tab-pane in active" id="add">
						<input type="text" id="selectFunctionAreaId" class="hide">
						<input type="text" id="selectVersionId" class="hide">
						<div id="itemList"></div>
						<h3 id="itemBtns">
							<a name="addBtn" class="btn btn-minier  btn-primary" style="margin-right: 10px"><i class="icon-plus bigger-110"></i>添加</a>
							<a name="delBtn" class="btn btn-minier  btn-danger" ><i class="icon-trash  bigger-110"></i>删除</a>
						</h3>
					</div>
				</div>
			</div>
			<div class="text-right col-md-12">
				<div class="hr"></div>
				<button id="btnBack" type="button" class="btn btn-info">
					<i class="icon-mail-forward bigger-110"></i>
					返回
				</button>
			</div>
		</div>
	</div>

	<div class="modal fade" id="functionAreaModal" tabindex="-1" role="dialog"	aria-labelledby="functionAreaDialog" aria-hidden="true" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="functionAreaDialog">功能区</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" role="form">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaId">编号</label>
							<div class="col-sm-9">
								<input type="text" id="faId" class="col-xs-10 col-sm-5 hide" />
								<input type="text" id="functionAreaId" class="col-xs-10 col-sm-5 v_required v_functionAreaId" data-toggle="popover" data-trigger='manual' maxlength='5'/>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="versionId">报价版本</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="versionId" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaName">名称</label>
							<div class="col-sm-9">
								<input type="text" id="functionAreaName" class="col-xs-10 col-sm-5 v_required v_name" rows="3" data-toggle="popover" data-trigger='manual' maxlength='20'/>
							</div>
						</div>
						<div class="space-4"></div>
						
							<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaType">类型</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="functionAreaType" data-toggle="popover" data-trigger='manual'>
								<option value="普通" selected="true">普通 </option>
								<option value="一次性包死">一次性包死</option>
								<option value="综合项目">综合项目</option>
								<option value="管理费">管理费</option>
								</select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaOrder">排序</label>
							<div class="col-sm-9">
								<input type="text" id="functionAreaOrder" class="col-xs-10 col-sm-5 v_required v_number"  data-toggle="popover" data-trigger='manual' maxlength='5'/>
							</div>
						</div>
						<div class="space-4"></div>
						
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="selectItemModal" tabindex="-1" role="dialog"	aria-labelledby="selectItemDialog" aria-hidden="true" data-backdrop="static">
		<div class="modal-dialog" style="width:900px;">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="selectItemDialog">选择报价项目</h4>
				</div>
				<div class="modal-body">
					
					<div class="row">

						<!-- 查询条件-->
						<div id="quoCondList" class="fl_search clearfix"></div>
						<!--查询结果-->
						<div id="quoResultList" class="clearfix tab-pane active"></div>
						<!--分页-->
						<div id="quoPagenation" class="fl-page-wrap clearfix" style="text-align: center;max-width: 680px;">

							<div class="pager-info" style="display: inline-block;">
								第<span class="bigger-120 blue" name="nowPage">0</span>页，
								共<span class="bigger-120 blue" name="totalPage">0</span>页，
								每页显示<span class="bigger-120 blue" name="rows">10</span>条，
								共找到<span class="bigger-120 blue" name="totalRecords">0</span>条
							</div>

							<ul class="pager pull-right">
								<li class="previous" name="prev">
									<a href="javascript:void (0);" >← 上一页</a>
								</li>
								<li class="next" name="next">
									<a href="javascript:void (0);" >下一页 →</a>
								</li>
							</ul>
						</div>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveSelectItemBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelSelectItemBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript('js/quotation/functionArea.js?version=' + versionCode);
</script>
