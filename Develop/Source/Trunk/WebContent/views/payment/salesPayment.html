<div class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <ul class="nav nav-tabs">
                <li class="active">
                    <a data-toggle="tab" href="#decorationPaymentList">家具收款</a>
                </li>
                <li class="">
                    <a data-toggle="tab" href="#history">历史收款</a>
                </li>
            </ul>
            <div class="tab-content">
                <div id="decorationPaymentList" class="tab-pane active">
                    <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
                    <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
                    <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
                </div>
                <div id="history" class="tab-pane">
                    <div id="hcondList" class="fl_search clearfix"></div> <!-- 查询条件-->
                    <div id="hresultList" class="clearfix tab-pane active"></div> <!--查询结果-->
                    <div id="hpagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
                </div>
            </div>
        </div>
    </div>
</div>

<div id="layerAdd" style="padding: 10px 0;display: none">
    <div class="modal-header">
        <h4 class="modal-title" id="myModalLabel">付款信息</h4>
    </div>
    <div class="modal-body">
        <form class="form-horizontal" id="form">
            <div class="block clearfix">
                <label class="col-md-3 control-label" style="margin-top: -5px">付款方式</label>
                <label class="inline">
                    <input type="checkbox" class="ace" id="cashCheckbox" key="cash" select="0">
                    <span class="lbl"> 现金</span>
                </label>
                <label class="inline">
                    <input type="checkbox" class="ace" id="bankCheckbox" key="bank" select="0">
                    <span class="lbl"> 刷卡</span>
                </label>
                <label class="inline">
                    <input type="checkbox" class="ace" id="checkvCheckbox" key="checkv" select="1">
                    <span class="lbl"> 转账</span>
                </label>
                <label class="inline">
                    <input type="checkbox" class="ace" id="installmentCheckbox" key="installment" select="1">
                    <span class="lbl"> 分期</span>
                </label>
                <label class="inline">
                    <input type="checkbox" class="ace" id="accountsCheckbox" key="accounts" select="1">
                    <span class="lbl"> 对公账户</span>
                </label>
                <label class="inline">
                    <input type="checkbox" class="ace" id="advanceCheckbox" key="advance" select="1">
                    <span class="lbl"> 预付款</span>
                </label>
                <label class="inline">
                    <input type="checkbox" class="ace" id="couponCheckbox" key="coupon" select="0">
                    <span class="lbl"> 优惠券</span>
                </label>
            </div>

            <div id="infoDiv">
                <h4 class="header blue bolder smaller">基本信息</h4>
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="referMoney">应收金额</label>
                    <div class="col-md-9">
                        <input type="text" id="referMoney" class="col-xs-10 col-sm-5 v_required" data-toggle="popover"
                               data-trigger='manual' readonly/>
                    </div>
                </div>
                <div class="space-4 "></div>
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="collectDes">说明</label>
                    <div class="col-md-9">
                        <textarea id="collectDes" class="col-md-6 v_name v_required" rows="3" data-toggle="popover"
                                  data-trigger='manual' maxlength="40"></textarea>
                    </div>
                </div>
                <div class="space-4 "></div>
            </div>

            <div id="cashDiv" name="top" class="hide">
                <h4 class="header blue bolder smaller">现金</h4>
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="cashInfo">类型</label>
                    <div class="col-sm-9">
                        <select id="cashInfo" class="col-xs-10 col-sm-5"></select>
                    </div>
                </div>
                <div class="space-4"></div>

                <div class="form-group">
                    <label for="cash" class="col-sm-3 control-label no-padding-right">现金金额</label>
                    <span class="col-md-9 block no-padding-right  ">
											<input type="text" id="cash" class="col-xs-10 col-sm-5 v_required v_float"
                                                   data-toggle="popover" data-trigger='manual'/>
										</span>
                </div>
                <div class="space-4"></div>
            </div>

            <div id="bankDiv" name="top" class="hide">
                <h4 class="header blue bolder smaller">
                    银行卡
                    <button id="bankAdd" class="btn btn-minier btn-success pull-right inline" num="0">添加</button>
                </h4>
                <div id="bankDivGroup"></div>
            </div>

            <div id="checkvDiv" name="top" class="hide">
                <h4 class="header blue bolder smaller">转账</h4>
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="checkvBankName">银行</label>
                    <div class="col-sm-9">
                        <select id="checkvBankName" class="col-xs-10 col-sm-5"></select>
                    </div>
                </div>
                <div class="space-4"></div>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="checkv" >转账金额</label>
                    <div class="col-sm-9">
                        <input type="text" id="checkv" class="col-xs-10 col-sm-5 v_required v_float"  data-toggle="popover" data-trigger='manual' >
                    </div>
                </div>
                <div class="space-4 "></div>
            </div>

            <div id="installmentDiv" name="top" class="hide">
                <h4 class="header blue bolder smaller">分期</h4>
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="installmentBankName">银行</label>
                    <div class="col-sm-9">
                        <select id="installmentBankName" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
                    </div>
                </div>
                <div class="space-4"></div>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="installment" >分期金额</label>
                    <div class="col-sm-9">
                        <input type="text" id="installment" class="col-xs-10 col-sm-5 v_required v_float"  data-toggle="popover" data-trigger='manual' >
                    </div>
                </div>
                <div class="space-4 "></div>
            </div>

            <div id="accountsDiv" name="top" class="hide">
                <h4 class="header blue bolder smaller">对公账户</h4>
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="accountsBankName">银行</label>
                    <div class="col-sm-9">
                        <select id="accountsBankName" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
                    </div>
                </div>
                <div class="space-4"></div>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="accounts" >对公金额</label>
                    <div class="col-sm-9">
                        <input type="text" id="accounts" class="col-xs-10 col-sm-5 v_required v_float"  data-toggle="popover" data-trigger='manual' >
                    </div>
                </div>
                <div class="space-4 "></div>
            </div>

            <div id="advanceDiv" name="top" class="hide">
                <h4 class="header blue bolder smaller">预付款</h4>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="advanceType">预付款类型</label>
                    <div class="col-sm-9">
                        <select id="advanceType" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
                    </div>
                </div>
                <div class="space-4"></div>

                <div class="form-group">
                    <label for="advance" class="col-sm-3 control-label no-padding-right">余额</label>
                    <div class="col-sm-9">
                        <input type="text" id="advance" class="col-xs-10 col-sm-5 v_required v_float" data-toggle="popover"
                               data-trigger='manual' maxlength="8" disabled/>
                    </div>
                </div>

                <div class="space-4"></div>

                <div class="form-group">
                    <label for="payAdvance" class="col-sm-3 control-label no-padding-right">支付金额</label>
                    <div class="col-sm-9">
                        <input type="text" id="payAdvance" class="col-xs-10 col-sm-5 v_required v_float" data-toggle="popover"
                               data-trigger='manual' maxlength="8"/>
                    </div>
                </div>


                <div class="space-4 "></div>
            </div>

            <div id="couponDiv" name="top" class="hide">
                <h4 class="header blue bolder smaller">优惠券</h4>
                <div class="form-group">
                    <div class="col-sm-12">
                        <select id="couponType" multiple="multiple" class="chosen-select tag-input-style v_required" data-placeholder="..." data-toggle="popover" data-trigger='manual'></select>
                    </div>
                </div>
                <div class="space-4"></div>
            </div>
        </form>
    </div>

    <div class="modal-footer">
        <span id="paymentInfo" class="alert-danger pull-left inline"></span>
    </div>
</div>

<script type="text/javascript">
    $.getScript('js/payment/salesPayment.js');
</script>
