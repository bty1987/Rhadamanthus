
<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="subFunctionActionModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="myModalLabel">Action信息</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal" role="form">
		      			<input type="text" id="actionId" class="col-xs-10 col-sm-5 hidden" />

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="actionName">action名称</label>
							<div class="col-sm-9">
								<input type="text" id="actionName" class="col-xs-10 col-sm-5 v_required v_name " data-toggle="popover" data-trigger='manual' maxlength="64"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="moduleId" >模块</label>
							<div class="col-sm-9">
								<select id="moduleId" class="col-xs-10 col-sm-5 v_required"></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionId" >功能</label>
							<div class="col-sm-9">
								<select id="functionId" class="col-xs-10 col-sm-5 v_required"></select>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="subFunctionId" >子功能</label>
							<div class="col-sm-9">
								<select id="subFunctionId" class="col-xs-10 col-sm-5 v_required"></select>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="defaultFlag">默认权限</label>
							<div class="col-sm-9">
								<input type="checkbox" id="defaultFlag" />
							</div>
						</div>
						<div class="space-4"></div>

						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="actionDes" >描述</label>
							<div class="col-sm-9">
								<textarea id="actionDes" class="col-xs-10 col-sm-5 v_name" rows="3" data-toggle="popover" data-trigger='manual' maxlength="20"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>
</div>

<script type="text/javascript">
	$.getScript('js/system/subFunctionAction.js?version=' + versionCode);
</script>
