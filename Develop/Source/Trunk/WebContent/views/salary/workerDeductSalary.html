<div class="page-content">
	<div class="row">
		<div  class="col-xs-12">
			
			<div class="tabbable">
				<ul class="nav nav-tabs" id="myTab">
					<li class="active">
						<a data-toggle="tab" href="#order" >工人订单扣款信息</a>
					</li>

					<li class="">
						<a data-toggle="tab" href="#personal" id="historyWorkerTab">工人个人扣款信息</a>
					</li>
				</ul>

				<div class="tab-content ">
					<div id="order" class="tab-pane in active">
							<div id="listOrder"  class="row">
								<div id="searchOrderDiv"></div>
								<table id="listGridOrder"></table>
								<div id="gridPagerOrder"></div>
							</div>
							
							<div id="listOrderDetail" class="row">
								<div id="searchOrderDetailDiv"></div>
								<table id="listGridOrderDetail"></table>
								<div id="gridPagerOrderDetail"></div>
							</div>
					</div>
					
					<div id="personal" class="tab-pane in active">
						<div id="listPersonal" class="row">
							<div id="searchPersonalDiv"></div>
							<table id="listGridPersonal"></table>
							<div id="gridPagerPersonal"></div>
						</div>
						
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="deductSalaryModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="deductSalaryDialog">客户</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="workType">工种</label>
							<div class="col-sm-9">
								<select id="workType" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="userName">工人姓名</label>
							<div class="col-sm-9">
								<select id="userName" class="chosen-select col-md-5" data-placeholder="请输入工人名称" data-toggle="popover" data-trigger='manual'>
								<option value="">&nbsp;</option>
							</select> 
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group" id="orderDeductTypeDiv">
							<label class="col-sm-3 control-label no-padding-right" for="orderDeductType">扣款类型</label>
							<div class="col-sm-9">
								<select id="orderDeductType" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group" id="presonDeductTypeDiv">
							<label class="col-sm-3 control-label no-padding-right" for="presonDeductType">扣款类型</label>
							<div class="col-sm-9">
								<select id="presonDeductType" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="deduct">扣款</label>
							<div class="col-sm-9">
								<input type="text" id="deduct" maxlength="64" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="des">备注</label>
							<div class="col-sm-9">
								<textarea id="des" maxlength="64" class="col-xs-10 col-sm-5" cols="3" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>
						<div class="space-4"></div>
						
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript('js/salary/workerDeductSalary.js?version=' + versionCode);
</script>
