
<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	

	<div class="modal fade" id="workersalaryModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h4 class="modal-title" id="myModalLabel">工人工费信息</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group " >
								<label class="col-sm-3 control-label no-padding-right " for="workersalaryuser">姓名</label>
								<div class="col-md-9">
									<select id="workersalaryuser" class="col-xs-10  v_name v_required" data-placeholder="请输入工人名称" data-toggle="popover" data-trigger='manual'>
										<option value="">&nbsp;</option>
									</select>
								</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="workersalary">工费</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="workersalary" class="col-xs-10 col-sm-6 v_name v_required" data-toggle="popover" data-trigger='manual'/>
								<span class='star'></span>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="workersalarySubtype">类型</label>
							<div class="col-sm-9">
								<select  maxlength="64" id="workersalarySubtype" class="col-xs-10 col-sm-6 v_name v_required" data-toggle="popover" data-trigger='manual'/>
								<span class='star'></span>
							</div>
						</div>
						<div class="space-4" ></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="workersalarycomment">备注</label>
							<div class="col-sm-9">
								<textarea id="workersalarycomment" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
	<div class="modal fade" id="importModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title">导入</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<div class="col-sm-12" id="import"></div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.getScript('js/salary/workerSalary.js?version=' + versionCode);
</script>
