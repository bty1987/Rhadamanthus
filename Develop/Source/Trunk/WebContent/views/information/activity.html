<div id="activityPageContent">
	<div class="page-content">
		<div class="row">
			<div class="col-xs-12">
				<div id="searchDiv"></div>
				<table id="listgrid"></table>
				<div id="gridPager"></div>
			</div>
		</div>
		
		<div class="modal fade" id="activityModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
	      			<div class="modal-header">
	        			<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
	        			<h4 class="modal-title" id="myModalLabel">活动信息</h4>
	      			</div>
	      			<div class="modal-body">
			      		<form class="form-horizontal" role="form">
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="activityName">名称</label>
								<div class="col-sm-9">
									<input type="text" id="activityName" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
									<span class='star'></span>
								</div>
							</div>
							
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="startTime">开始时间</label>
								<div class="col-sm-9">
									<div class="input-group col-xs-10 col-sm-7 no-padding v_required" data-for="startTime" data-toggle="popover" data-trigger='manual'>
										<input class="form-control date-picker" id="startTime" type="text" data-date-format="yyyy-mm-dd">
										<span class="input-group-addon">
											<i class="icon-calendar bigger-110"></i>
										</span>
									</div>
									<span class='star'></span>
								</div>
							</div>
							
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="endTime">结束时间</label>
								<div class="col-sm-9">
									<div class="input-group col-xs-10 col-sm-7 no-padding v_required" data-for="endTime" data-toggle="popover" data-trigger='manual'>
										<input class="form-control date-picker" id="endTime" type="text" data-date-format="yyyy-mm-dd">
										<span class="input-group-addon">
											<i class="icon-calendar bigger-110"></i>
										</span>
									</div>
									<span class='star'></span>
								</div>
							</div>
							
						</form>
	      			</div>
					<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>
</div>

</div>

<script type="text/javascript">
	$.getScript(hostServer + 'js/information/activity.js?version=' + versionCode);
</script>
