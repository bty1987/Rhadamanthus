<!DOCTYPE html>
<html>
<head lang="zh-cmn-Hans">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
    <meta name="format-detection" content="telephone=no" />
    <title>订单详情</title>
    <link rel="stylesheet" href="../assets/css/weui.css"/>
    <link rel="stylesheet" href="../assets/css/example.css"/>
    <link rel="stylesheet" href="../css/main.css"/>
</head>

<body>
<div class="bd">
    <div class="weui_cells_title">订单信息</div>
    <div class="weui_cells">
        <div class="weui_cell">
            <div class="weui_cell_bd weui_cell_primary">
                <p>订单编号</p>
            </div>
            <div class="weui_cell_ft" id="oederid"></div>
        </div>
        <div class="weui_media_box weui_media_text">
            <h4 class="weui_media_title">订单地址</h4>
            <p class="weui_cells_tips no-padding" id="addr"></p>
        </div>
        <div class="weui_cell">
            <div class="weui_cell_bd weui_cell_primary">
                <p>设计师：<span id="designer"></span></p>
            </div>
            <a href="javascript:;" class="weui_cell_ft" id="dphone"></a>
        </div>
        <div class="weui_cell">
            <div class="weui_cell_bd weui_cell_primary">
                <p>业务员：<span id="salesman"></span></p>
            </div>
            <a href="javascript:;" class="weui_cell_ft" id="sphone"></a>
        </div>
    </div>
</div>

<div class="weui_grids">
    <a class="weui_grid" href="javascript:;" id="projectbtn">
        <div class="weui_grid_icon">
            <i class="icon icon_panel"></i>
        </div>
        <p class="weui_grid_label">
            工程
        </p>
    </a>
    <a href="javascript:;" class="weui_grid" id="chargebtn">
        <div class="weui_grid_icon">
            <i class="icon icon_cell"></i>
        </div>
        <p class="weui_grid_label">
            款项
        </p>
    </a>
    <!--<a href="javascript:;" class="weui_grid">
        <div class="weui_grid_icon">
            <i class="icon icon_toast"></i>
        </div>
        <p class="weui_grid_label">
            报价
        </p>
    </a>
    <a href="javascript:;" class="weui_grid">
        <div class="weui_grid_icon">
            <i class="icon icon_article"></i>
        </div>
        <p class="weui_grid_label">
            主材
        </p>
    </a>-->
</div>


</body>

<script type='text/javascript' src='//g.alicdn.com/sj/lib/zepto/zepto.js' charset='utf-8'></script>
<script src="../assets/js/deferred.js"></script>
<script src="../assets/js/callbacks.js"></script>
<script src="../utils/config.js"></script>
<script src="../utils/dingding.js"></script>
<script src="../utils/utils.js"></script>

<script src="orderDetail.js"></script>
</html>
