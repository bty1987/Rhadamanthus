<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>工程详情</title>
    <meta name="viewport" content="initial-scale=1, maximum-scale=1">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link rel="stylesheet" href="//g.alicdn.com/msui/sm/0.6.2/css/sm.css">
    <link rel="stylesheet" href="//g.alicdn.com/msui/sm/0.6.2/css/sm-extend.css">
</head>

<style>
    .fl-mg.content-block{
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        padding: 0 0.25rem;
    }

    .fl-mg.list-block{
        margin-top: 0.5rem;
    }

    .panel.fl-panel{
        background: #CDCDCD;
    }

    .theme-grey {
        background-color: #fbfbfb;
    }

    .list-block.theme-grey ul{
        background: transparent;
        color: #999;
    }


    .theme-grey .list-block ul:before,
    .list-block.theme-grey ul:before {
        background-color: #e6e6e6;
    }
    .theme-grey .list-block ul:after,
    .list-block.theme-grey ul:after {
        background-color: #e6e6e6;
    }

    .theme-grey.list-block .item-inner:after {

        background-color: #e6e6e6;

    }

    .inset.fl-inset {
        margin-left: 0.25rem;
        margin-right: 0.25rem;
    }

    .content-block-title{
        margin-top: 1rem;
    }

    .mgb-0{
        margin-bottom: 0;
    }

    #worker{
        -webkit-user-select: none;/*禁用手机浏览器的用户选择功能 */
        -moz-user-select: none;
    }

    .img-item{
        float: left;
        width: 80px;
        height: 80px;
        margin: 5px;
        overflow: hidden;
        -webkit-user-select: none;/*禁用手机浏览器的用户选择功能 */
        -moz-user-select: none;
    }
    .img-item img{
        width: 100%;
    }
</style>

<body>

<!-- page集合的容器，里面放多个平行的.page，其他.page作为内联页面由路由控制展示 -->
<div class="page-group">

    <!-- 其他的单个page内联页（如果有） -->
    <div class="page page-current" id='router3'>

        <div class="content">
            <div class="content-block-title">开始、结束时间</div>
            <!--时间-->
            <div class="list-block mgb-0" id="time">
                <ul>
                    <!-- Text inputs -->
                    <li>
                        <div class="item-content">
                            <div class="item-inner">
                                <div class="item-title label">开始时间</div>
                                <div class="item-input">
                                    <input type="text" data-toggle='date' class="start-time"/>
                                </div>
                            </div>
                        </div>
                    </li>
                    <li>
                        <div class="item-content">
                            <div class="item-inner">
                                <div class="item-title label">结束时间</div>
                                <div class="item-input">
                                    <input type="text" data-toggle='date' class="end-time"/>
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
            <!--保存时间-->
            <div class="content-block" style="background: #fff;margin: 0;padding-top: 8px;padding-bottom: 8px">
                <a class="button button-fill external" href="javascript:;" id="saveTime">确定</a>
            </div>
            <div class="content-block-title">工人</div>
            <!--工人-->
            <div class="list-block mgb-0">
                <ul id="worker">
                    <!--<li class="item-content">
                        <div class="item-inner">
                            <div class="item-title">小明</div>
                        </div>
                    </li>-->
                </ul>
            </div>
            <!--添加工人-->
            <div class="content-block" style="background: #fff;margin: 0;padding-top: 8px;padding-bottom: 8px">
                <a class="button button-fill external" href="javascript:;" id="addWorder">添加</a>
            </div>
            <div class="content-block-title">图片</div>
            <!--图片-->
            <div id="pic" class="content-block mgb-0" style="background: #fff;padding-top: 8px;padding-bottom: 8px;overflow: hidden;">
                <!--<div class="img-item"><img src="//img.alicdn.com/tps/i3/TB1kt4wHVXXXXb_XVXX0HY8HXXX-1024-1024.jpeg"></div>-->
            </div>
            <!--上传图片-->
            <div class="content-block" style="background: #fff;margin-top: 0;padding-top: 8px;padding-bottom: 8px">
                <a class="button button-fill external" href="javascript:;" id="addPic">上传</a>
            </div>

        </div>
    </div>
</div>

<!-- popup, panel 等放在这里 -->
<div class="panel-overlay"></div>
<!-- Left Panel with Reveal effect -->
<div class="panel fl-panel panel-left panel-cover" id="search-panel">

    <div class="content-block fl-mg">
        <div class="searchbar">
            <div class="search-input">
                <label for="search" class="icon icon-search"></label>
                <input type="text" placeholder="输入关键字..." id="search">
            </div>
        </div>
    </div>

    <div class="list-block inset fl-inset media-list theme-grey fl-mg">
        <ul>

        </ul>
    </div>
</div>

</body>
<script type='text/javascript' src='//g.alicdn.com/sj/lib/zepto/zepto.js' charset='utf-8'></script>
<script type="text/javascript" src="../assets/js/deferred.js"></script>
<script type="text/javascript" src="../assets/js/callbacks.js"></script>
<script type="text/javascript" src="../assets/js/touch.js"></script>
<script type='text/javascript' src='//g.alicdn.com/msui/sm/0.6.2/js/sm.js' charset='utf-8'></script>
<script type='text/javascript' src='//g.alicdn.com/msui/sm/0.6.2/js/sm-extend.js' charset='utf-8'></script>

<script type="text/javascript">
	if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
		document.write('<script type="text/javascript" src="http://g.alicdn.com/ilw/ding/0.5.1/scripts/dingtalk.js"><\/script>'); 
	}else{
		document.write('<script type="text/javascript" src="http://g.alicdn.com/dingding/dingtalk-pc-api/2.4.2/index.js"><\/script>')
	}
</script>

<script type="text/javascript" src="../utils/config.js"></script>
<script type="text/javascript" src="../utils/dingding.js"></script>
<script type="text/javascript" src="../utils/utils.js"></script>

<script type='text/javascript' src="project.js" charset="utf-8"></script>

</html>
