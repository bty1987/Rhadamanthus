<!DOCTYPE html>
<html>
<head lang="zh-cmn-Hans">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
    <title>订单首页</title>
    <link rel="stylesheet" href="//g.alicdn.com/msui/sm/0.6.2/css/sm.css">
    <link rel="stylesheet" href="../assets/css/weui.css"/>
    <link rel="stylesheet" href="../assets/css/example.css"/>
    <link rel="stylesheet" href="../css/main.css"/>
</head>
<style>
    .fl-panel{
        background: #fff;
    }
    .modal-text{
        word-break: break-all;
    }
</style>
<body>



    <div class="has-btn-b page" id="page-infinite-scroll-bottom">

        <div class="weui_msg hide">
            <div>
                <div class="weui_icon_area"><i class="weui_icon_msg weui_icon_safe_warn"></i></div>
                <div class="weui_text_area">
                    <h2 class="weui_msg_title">提示</h2>
                    <p class="weui_msg_desc">您当前未绑定订单请点击下方按钮开始绑定</p>
                </div>
            </div>
        </div>

        <div class="fl-panel content infinite-scroll native-scroll" data-distance="100">
            <div class="weui_panel_bd list-container" >
<!--列表-->
            </div>
            <!-- 加载提示符 -->
            <div class="infinite-scroll-preloader hide">
                <div class="preloader"></div>
            </div>
        </div>

    </div>



<!--BEGIN toast-->
<div id="toast" style="display: none;" >
    <div class="weui_mask_transparent"></div>
    <div class="weui_toast ">
        <i class="weui_icon_toast"></i>
        <p class="weui_toast_content">绑定成功</p>
    </div>
</div>
<!--end toast-->

</body>
<script type='text/javascript' src='//g.alicdn.com/sj/lib/zepto/zepto.js' charset='utf-8'></script>
<script src="../assets/js/deferred.js"></script>
<script src="../assets/js/callbacks.js"></script>

<script type='text/javascript' src='//g.alicdn.com/msui/sm/0.6.2/js/sm.js' charset='utf-8'></script>

<script src="../utils/config.js"></script>
<script src="../utils/dingding.js"></script>
<script src="../utils/utils.js"></script>

<script src="orderList.js"></script>
</html>
