<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>404 Error Page - Ace Admin</title>

		<meta name="description" content="404 Error Page" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<script type="text/javascript">
			
			var hostServer = "http://" + document.location.host + "/";
			var versionCode = "";
			var cookies = document.cookie.split(";");
			
			for(var i=0;i<cookies.length;i++){
				var cookie = cookies[i];
				
				if(cookie.indexOf("hostServer") != -1){
					hostServer = cookie.split("=")[1];
					window.hostServer = unescape(hostServer);
				}else if(cookie.indexOf("versionCode") != -1){
					versionCode = cookie.split("=")[1];
				}
			}
			
			var csses = "";
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/bootstrap.min.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/font-awesome.min.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/ace.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/ace-rtl.min.css?version=' + versionCode + '" />';
			csses += '<link rel="stylesheet" href="' + hostServer + 'assets/css/ace-skins.min.css?version=' + versionCode + '" />';
			
			document.write(csses);
			
		</script>

		<script src="./assets/js/ace-extra.min.js"></script>

	</head>

	<body>
		<div class="main-container" id="main-container">
			<div class="main-container-inner">
				<a class="menu-toggler" id="menu-toggler" href="#">
					<span class="menu-text"></span>
				</a>

				<div class="">
					<div class="page-content">
						<div class="row">
							<div class="col-xs-12">
								<div class="error-container">
									<div class="well">
										<h1 class="grey lighter smaller">
											<span class="blue bigger-125">
												<i class="icon-sitemap"></i>
											</span>
											Page Not Found
										</h1>
										<hr />
										<h3 class="lighter smaller">We looked everywhere but we couldn't find it!</h3>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<a href="#" id="btn-scroll-up" class="btn-scroll-up btn btn-sm btn-inverse">
				<i class="icon-double-angle-up icon-only bigger-110"></i>
			</a>
		</div>
		
		<script type="text/javascript">
			var jses = "";
		
			if(!window.jQuery){
				jses += '<script src="' + hostServer + 'assets/js/jquery-2.0.3.min.js?version=' + versionCode + '"><\/script>';
			}
		
			if("ontouchend" in document){
				jses += '<script src="' + hostServer + 'assets/js/jquery.mobile.custom.min.js?version=' + versionCode + '"><\/script>';
			}
			
			jses += '<script src="' + hostServer + 'assets/js/bootstrap.min.js?version=' + versionCode + '"><\/script>';
			jses += '<script src="' + hostServer + 'assets/js/typeahead-bs2.min.js?version=' + versionCode + '"><\/script>';
			jses += '<script src="' + hostServer + 'assets/js/ace-elements.js?version=' + versionCode + '"><\/script>';
			jses += '<script src="' + hostServer + 'assets/js/ace.js?version=' + versionCode + '"><\/script>';
			
			document.write(jses);
		</script>

	</body>
</html>
