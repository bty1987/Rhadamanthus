    <script type="text/javascript">

        window.notOperate = false;
        window.templateStyle = "clear";

        var isF5 = false;
        document.onkeydown = function (e) {
            var ev = window.event || e;
            var code = ev.keyCode || ev.which;
            if (code == 116) {
                isF5 = true;
            }
        };
        window.onbeforeunload = onclose;
        function onclose(){
            if(!isF5){
                isF5 = false;
                return "";
            }
        }

        var server = './';
        var versionCode = '';
        var cookies = document.cookie.split(";");

        for(var i=0;i<cookies.length;i++){
            var cookie = cookies[i];

            if(cookie.indexOf("versionCode") != -1){
                versionCode = cookie.split("=")[1];
            }else if(cookie.indexOf("authentication") != -1){
                window.authentication = cookie.substr(cookie.indexOf('=') + 1);
            }else if(cookie.indexOf("loginTime") != -1){
                window.loginTime = cookie.split("=")[1];
            }else if(cookie.indexOf("communion") != -1){
                window.communion = cookie.split("=")[1];
            }
        }

        // 登录超时
        if(window.loginTime == undefined ){
            isF5 = true;
            window.location.href = "/";
        }

        var csses = "";
        /* clear */
        csses += '<link type="text/css" rel="stylesheet" href="assets/clear/css/app.css"/>'; /**/
        csses += '<link type="text/css" rel="stylesheet" href="assets/clear/css/bootstrap-clear.min.css" />';/**/
        csses += '<link rel="stylesheet" href="assets/clear/css/simple-line-icons/simple-line-icons.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/chosen-clear.min.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/datepicker.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/daterangepicker.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/timeline.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/zTreeStyle.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/huploadify.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/bootstrap-timepicker.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/fullcalendar.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/form_editors.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/nestable.css">';
        csses += '<link rel="stylesheet" href="assets/clear/css/jquery.gritter.css" />';
        csses += '<link rel="stylesheet" href="assets/clear/css/custom.css">';
        /* clear end */

        /* altogether */
        csses += '<link rel="stylesheet" href="assets/altogether/css/font-awesome.min.css" />';
        csses += '<link rel="stylesheet" href="assets/altogether/css/layer.css" />';
        csses += '<link rel="stylesheet" href="assets/altogether/css/layui.css" />'; /*  layui components: table/form/date/layer */
        csses += '<link rel="stylesheet" href="assets/altogether/css/iconfont.css" />'; /*  iconfont  */
        csses += '<link rel="stylesheet" href="assets/altogether/css/locking.css" />'; /*  lockscreen */
		csses += '<link rel="stylesheet" href="assets/altogether/css/keyboard.css" />'; /*  keyboard */
        /* altogether end */

        csses += '<link rel="stylesheet" href="css/clear.css" />';

        document.write(csses);
