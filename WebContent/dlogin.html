<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>Information Platform</title>

	<meta charset="utf-8" />

	<link rel="shortcut icon" href="fanglin.ico" type="image/x-icon">
	
	<script>
		var hostServer = "";
		var cookies = document.cookie.split(";");

		for(var i=0;i<cookies.length;i++){
			var cookie = cookies[i];
			if(cookie.indexOf("hostServer") != -1){
				//hostServer = cookie.split("=")[1];
				window.hostServer = unescape(hostServer);
				break;
			}
		}

		var csses = "";
		/* ace */
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/ace/css/shaking.css" />';
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/ace/css/bootstrap.min.css" />'; // basic styles
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/altogether/css/font-awesome.min.css" />';
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/altogether/css/iconfont.css" />'; /* iconfont */
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/ace/css/jquery-ui-1.10.3.full.min.css" />'; // page specific plugin styles
		csses += '<link rel="stylesheet" href="' + hostServer + 'assets/ace/css/ace.css" />'; // ace styles
        /* ace end */

		csses += '<link rel="stylesheet" href="' + hostServer + 'css/main.css" />';

		document.write(csses);
	</script>
	<style>
		#winTop {
			-webkit-app-region: drag;
		}
		p{
			margin: 8px 0px;
		}
		button {
			-webkit-app-region: no-drag;
		}
	</style>

</head>

<body class="login-layout" style="display: none">
<div class="main-container hide">
	<div style="position: fixed; display: inline-block; color: rgb(255, 255, 255); font-size: 72px; left: 20px; bottom: 20px; opacity:0.5">
		<i class="icon-chrome"></i>
		<i class="icon-firefox"></i>
	</div>
	<div class="main-content">
		<div class="row">
			<div class="col-sm-12" style="position:absolute; top:10%;">
				<div id="login-box" class="visible no-border" style="overflow: visible;">
					<form class="form-horizontal" id="loginFrom">
						<div align="center">
							<img id="icon" src="" alt="">
							<h3><span class="white" id="name"></span></h3>
							<h5><span class="white" id="ename"></span></h5>

							<!--用户名密码登录-->
							<div id="unamePwdContainer" class="hide">
								<div class="clearfix" style="margin: 30px 20px 20px 20px; overflow-y: auto;">
									<label id="errorMsg" class="block clearfix red center" style="margin-bottom: 15px;"></label>

									<!-- 登录表单容器 -->
									<div style="max-width: 360px; margin: 0 auto; padding: 0 10px;">

										<!-- 用户名输入框 -->
										<div class="form-group" style="margin-bottom: 15px;">
											<div class="input-icon input-icon-right">
												<input type="text" class="form-control" id="userId" placeholder="登陆ID" maxlength="32" autocomplete="off">
												<span id="userIdIcon" class="icon-user" data-rel="popover" data-trigger="hover" data-placement="top" data-content=""></span>
											</div>
										</div>

										<!-- 密码输入框 -->
										<div class="form-group" style="margin-bottom: 15px;">
											<div class="input-icon input-icon-right">
												<input type="password" class="form-control" id="password" placeholder="密码" maxlength="32" autocomplete="off">
												<span id="passwordIcon" class="icon-lock" data-rel="popover" data-trigger="hover" data-placement="top" data-content=""></span>
											</div>
										</div>

										<!-- 验证码输入框和图片 -->
										<div class="form-group" style="margin-bottom: 18px;">
											<div class="row" style="margin: 0;">
												<div class="col-xs-8" style="padding-left: 0; padding-right: 8px;">
													<div class="input-icon input-icon-right">
														<input type="text" class="form-control" id="nowCode" placeholder="验证码" maxlength="8">
														<span id="newCodeIcon" class="" data-rel="popover" data-trigger="hover" data-placement="top" data-content=""></span>
													</div>
												</div>
												<div class="col-xs-4" style="padding-left: 0; padding-right: 0; text-align: right;">
													<img src="" id="Verify" style="cursor: pointer; height: 30px; display: inline-block;" alt="看不清,换一张" title="点击刷新验证码" />
												</div>
											</div>
										</div>

										<!-- 登录按钮 -->
										<div class="form-group" style="margin-bottom: 12px;">
											<button type="button" class="btn btn-primary btn-block" id="loginBtn">
												<i class="icon-key"></i> 登录
											</button>
										</div>

										<!-- 其他登录方式 -->
										<div class="form-group">
											<div class="row" style="margin: 0;">
												<div class="col-xs-4" style="padding-left: 0; padding-right: 5px;">
													<button id="FormToQR" type="button" class="btn btn-danger btn-block">
														<i class="icon-key"></i> 钉钉
													</button>
												</div>
												<div class="col-xs-4" style="padding-left: 5px; padding-right: 5px;">
													<button id="FormToWX" type="button" class="btn btn-success btn-block">
														<i class="icon-key"></i> 微信
													</button>
												</div>
												<div class="col-xs-4" style="padding-left: 5px; padding-right: 0;">
													<button id="FormToWW" type="button" class="btn btn-info btn-block">
														<i class="icon-key"></i> 企微
													</button>
												</div>
											</div>
										</div>

									</div>
								</div>
							</div>

							<!-- 二维码登录-->
							<div class="clearfix" id="QRLogin">

								<div class="login_content">
									<div class="login_body">

										<div class="login_qrcode">
											<div id="qrcode" class="login_qrcode_content" title=""><img class="hide" alt="二维码" src=""></div>
											<div class="login_qrcode_text">
												请使用钉钉扫描二维码登录
												<span style="color:#38adff;cursor:pointer;">刷新</span>
												<p><a id="QRToWX">微信扫码登录</a></p>
												<p><a id="QRToWW">企微扫码登录</a></p>
												<p><a id="QRToForm">用户名和密码登录</a></p>
											</div>
											<div class="login_qrcode_scan" style="display: none;">
												二维码已扫描
											</div>
											<div class="login_qrcode_refresh hide" style="display: block;">您的二维码已失效, <br>请点击下方刷新按钮</div>
										</div>
									</div>
								</div>
							</div>

							<!-- 微信登录-->
							<div class="clearfix hide" id="WXLogin">

								<div class="login_content">
									<div class="login_body">

										<div class="login_qrcode">
											<div id="wxcode" class="login_qrcode_content" title=""><img class="hide" alt="二维码" src=""></div>
											<div class="login_wxcode_text">
												请使用微信扫码登录
												<span style="color:#38adff;cursor:pointer;">刷新</span>
												<p><a id="WXToQR">钉钉扫码登录</a></p>
												<p><a id="WXToWW">企微扫码登录</a></p>
												<p><a id="WXToForm">用户名和密码登录</a></p>
											</div>
											<div class="login_qrcode_scan" style="display: none;">
												二维码已扫描
											</div>
											<div class="login_wxcode_refresh hide" style="display: block;">您的二维码已失效, <br>请点击下方刷新按钮</div>
										</div>
									</div>
								</div>
							</div>

							<!-- 企微登录-->
							<div class="clearfix hide" id="WWLogin">

								<div class="login_content">
									<div class="login_body">

										<div class="login_qrcode">
											<div class="login_wwcode_text" style="text-align: center; padding: 40px 20px;">
												<button type="button" class="btn btn-lg btn-info" id="wwLoginBtn" style="margin: 20px 0;">
													<i class="icon-desktop"></i> 点击打开企业微信登录
												</button>
												<div style="margin-top: 30px; font-size: 14px; color: #666;">
													<p><a id="WWToQR" style="color: #38adff;">钉钉扫码登录</a></p>
													<p><a id="WWToWX" style="color: #38adff;">微信扫码登录</a></p>
													<p><a id="WWToForm" style="color: #38adff;">用户名和密码登录</a></p>
												</div>
											</div>
											<div class="login_wwcode_refresh hide" style="display: block; text-align: center; padding: 20px;">
												<span style="color: #999;">企业微信登录功能开发中...</span>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>

<!-- 
<div id="backgroundImage">
	<img src="" width="1920" height="1080" />
</div>
 -->

<div class="slide hide" style="width: 100%; height: 100%;">
    <div class="bg" id="container" style="width: 100%; height: 100%;">
        <div id="canvas"></div>
    </div>
</div>

<script src="assets/altogether/js/jquery-2.0.3.min.js"></script>
<script src="assets/altogether/js/crypto.min.js"></script>

<script type="text/javascript">

	if(parent.window.isPC){
        var gui = require('nw.gui');
        var win = gui.Window.get();
	}

    var jses = "";

    if("ontouchend" in document){
        /* ace */
        jses += '<script src="' + hostServer + 'assets/ace/js/jquery.mobile.custom.min.js"><\/script>';
    }

    /* ace */
    jses += '<script src="' + hostServer + 'assets/ace/js/bootstrap.min.js"><\/script>';
    jses += '<script src="' + hostServer + 'assets/ace/js/ace.js"><\/script>';
    jses += '<script src="' + hostServer + 'assets/ace/js/ace-elements.js"><\/script>';
    jses += '<script src="' + hostServer + 'assets/ace/js/ace-extra.min.js"><\/script>';
    jses += '<script src="' + hostServer + 'assets/ace/js/jquery.fullscreenBackground.min.js"><\/script>';
    jses += '<script src="' + hostServer + 'assets/ace/js/cav.js"><\/script>';
    jses += '<script src="' + hostServer + 'assets/ace/js/shaking.js"><\/script>';
    /* ace end */
    if(!parent.window.isEncryption){
        jses += '<script src="' + hostServer + 'js/com/config.js"><\/script>';
        jses += '<script src="' + hostServer + 'js/com/server.js"><\/script>';
        jses += '<script src="' + hostServer + 'js/dlogin.js"><\/script>';
    }else if(parent.window.isPC && parent.window.isEncryption){
        win.evalNWBin(null, 'js/com/config.bin');
        win.evalNWBin(null, 'js/dlogin.bin');
    }

    document.write(jses);
</script>

</body>
</html>
