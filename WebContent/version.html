<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="timeline-1">
				<div class="row">
					<div class="col-xs-12 col-sm-12">
						<div class="timeline-container">
                            <div class="timeline-items">
                            
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<script>
    $(function(){

        var displayFunc = (function () {
            var renderList = function (tableId, listData) {
                var $divitems = $('div.' + tableId).empty();

                if (listData && listData.length) {
                    $.each(listData, function (i, v) {
                        var $divClearfix = creatLine(v);

                        $divClearfix.appendTo($divitems);
                    });

                }
            };

            var creatLine = function (v) {
                var $divClearfix = $('<div></div>').addClass('timeline-item clearfix');//总div

                var $divInfo = $('<div></div>').addClass('timeline-info').appendTo($divClearfix) //星星div

                if(v.no.indexOf('001')!=-1 && v.no=='v1.0.001'){
                    var $istaryellow = $('<i></i>').addClass('timeline-indicator icon-star btn btn-warning no-hover green').appendTo($divInfo);
                }else if(v.no.indexOf('001')!=-1 && v.no!='v1.0.001'){
                    var $istargreen = $('<i></i>').addClass('timeline-indicator icon-star btn btn-success no-hover').appendTo($divInfo);
                }else if (v.no.indexOf('001')==-1){
                    var $istarblue = $('<i></i>').addClass('timeline-indicator icon-star btn btn-info no-hover').appendTo($divInfo);
                }

                var $divTransparent = $('<div></div>').addClass('widget-box transparent').appendTo($divClearfix);
                var $divSmall = $('<div></div>').addClass('widget-header widget-header-small').appendTo($divTransparent)
                var $h5 = $('<h5></h5>').addClass('smaller').html(v.no).appendTo($divSmall);
                var $spanToolbar = $('<span></span>').addClass('widget-toolbar').appendTo($divSmall);
                var $acollapse = $('<a href="#"></a>').attr('data-action','collapse').appendTo($spanToolbar);
                var $iicon = $('<i></i>').addClass('icon-chevron-up').appendTo($acollapse)
                var $spannoborder = $('<span></span>').addClass('widget-toolbar no-border').appendTo($divSmall);
                var $itime = $('<i></i>').addClass('icon-time bigger-110').append(v.createTime).appendTo($spannoborder)

                var $divbody = $('<div></div>').addClass('widget-body').appendTo($divTransparent);
                var $divmain = $('<div></div>').addClass('widget-main').html(v.comment).appendTo($divbody)



                return $divClearfix;
            };

            return {
                init: function (tableId, listData) {
                    $('div.' + tableId).html(null);
                    renderList(tableId, listData);
                },
                drawLine: function (v) {
                    return creatLine(v);
                }
            }
        })();

        com.post(api.upgrade.queryVersion,{},function(res){
            displayFunc.init('timeline-items',res.versions);
        })

    })
</script>
