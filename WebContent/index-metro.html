    <script type="text/javascript">

        window.notOperate = false;

        var isF5 = false;
        document.onkeydown = function (e) {
            var ev = window.event || e;
            var code = ev.keyCode || ev.which;
            if (code == 116) {
                isF5 = true;
            }
        };
        window.onbeforeunload = onclose;
        function onclose() {
            if (!isF5) {
                isF5 = false;
                return "";
            }
        }

        var server = './';
        var versionCode = '';
        var cookies = document.cookie.split(";");

        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i];

            if (cookie.indexOf("versionCode") != -1) {
                versionCode = cookie.split("=")[1];
            } else if (cookie.indexOf("authentication") != -1) {
                window.authentication = cookie.split("=")[1];
            } else if (cookie.indexOf("loginTime") != -1) {
                window.loginTime = cookie.split("=")[1];
            }
        }

        // 登录超时
        if(window.loginTime == undefined ){
            isF5 = true;
            window.location.href = "/";
        }

<div class="modal fade" id="phonecallModal" tabindex="-1">
    <div class="modal-dialog">

            <div class="modal-body">

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="username">姓名</label>

                        <div class="col-sm-9">

                        </div>
                    </div>

                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="caller">主叫号码</label>

                        <div class="col-sm-9">

                    </div>

                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="callee">被叫号码</label>

                        <div class="col-sm-9">
                            <input id="callee" type="text" class=" v_required v_phone" data-toggle="popover" data-trigger='manual' maxlength="11">
                        </div>
                    </div>

                </form>
            </div>

            <div class="modal-footer ">
                <button class="btn btn-success" type="button" id="save"><i class="icon-phone bigger-110"></i>拨打电话</button>
                <button type="button" name="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
