<!DOCTYPE html>
<html>
	<head>
		<title>FIP</title>
		<meta name="keywords" content="方林,装饰,ERP,信息平台" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		
		<link rel="shortcut icon" href="fanglin.ico" mce_href="fanglin.ico"
			type="image/x-icon">
		
		<script type="text/javascript" src="assets/js/jquery-2.0.3.min.js"></script>
		<script type="text/javascript" src="js/com/config.js"></script>
		
		<script>
		
			function getUrlParams() {
		        var paramsObj = {};
		        var paramsString = window.location.search.substring(1);
		        if (paramsString) {
		            var pairs = paramsString.split('&');
		            for (var i = 0; i < pairs.length; i++) {
		                var pair = pairs[i].split('=');
		                var key = decodeURIComponent(pair[0]);
		                var value = decodeURIComponent(pair[1] || '');
		                paramsObj[key] = value;
		            }
		        }
		        return paramsObj;
		    }
		
		    var setCookie = function(cname, cvalue, minutes) {
		
		        var d = new Date();
		        d.setTime(d.getTime() + (minutes * 60 * 1000));
		        var expires = "expires=" + d.toUTCString();
		        document.cookie = cname + "=" + cvalue + "; " + expires;
		    }

		    function getTemplateIndexUrl() {

		        var template = null;

		        try {
		            template = window.localStorage && window.localStorage.getItem("fl_template");
		        } catch (e) {
		        }

		        if (!template) {
		            var cookies = document.cookie.split(";");

		            for (var i = 0; i < cookies.length; i++) {
		                var cookie = cookies[i].replace(/^\s+|\s+$/g, "");

		                if (cookie.indexOf("templateStyle=") == 0) {
		                    template = cookie.substring("templateStyle=".length);
		                    break;
		                }
		            }
		        }

		        var urls = {
		            ace: "index.html",
		            metro: "index-metro.html",
		            clear: "index-clear.html"
		        };

		        return urls[template] || "index.html";
		    }
		
		    var authentication;
		    var args = window.location.search.substr(1);
		
		    if (args.indexOf('authentication=') != -1) {
		        authentication = getUrlParams()["authentication"] + "==";
		        
		        var osstoken = getUrlParams()["osstoken"];
		
		        setCookie("authentication", authentication, config.timeout);
		        setCookie("osstoken", osstoken, config.timeout);
		        setCookie("loginTime", new Date().getTime(), config.timeout);
		
		        window.location.href = getTemplateIndexUrl() + "?timestamp=" + new Date().getTime();
		    }
		</script>
	
	</head>
	
	<body>
	</body>
</html>
