    <script type="text/javascript">

        var isF5 = false;
        document.onkeydown = function (e) {
            var ev = window.event || e;
            var code = ev.keyCode || ev.which;
            if (code == 116) {
                isF5 = true;
            }
        }
        window.onbeforeunload = onclose;
        function onclose(){
            if(!isF5){
                isF5 = false;
                return "";
            }
        }

        var server = './'
        var versionCode = '';
        var cookies = document.cookie.split(";");

        for(var i=0;i<cookies.length;i++){
            var cookie = cookies[i];

            if(cookie.indexOf("versionCode") != -1){
                versionCode = cookie.split("=")[1];
            }else if(cookie.indexOf("authentication") != -1){
                window.authentication = cookie.split("=")[1];
            }else if(cookie.indexOf("loginTime") != -1){
                window.loginTime = cookie.split("=")[1];
            }
        }

        var csses = "";
        /* ace */
        csses += '<link rel="stylesheet" href="assets/ace/css/bootstrap.min.css?version=' + versionCode + '" />'; // basic styles

        csses += '<link rel="stylesheet" href="assets/ace/css/font-awesome-fa.min.css?version=' + versionCode + '" />';

        csses += '<link rel="stylesheet" href="assets/ace/css/jquery.gritter.css?version=' + versionCode + '" />';

        csses += '<link rel="stylesheet" href="assets/ace/css/jquery-ui-1.10.3.full.min.css?version=' + versionCode + '" />'; // page specific plugin styles

        csses += '<link rel="stylesheet" href="assets/ace/css/fullcalendar.css?version=' + versionCode + '" />';

        csses += '<link rel="stylesheet" href="assets/ace/css/chosen.min.css?version=' + versionCode + '" />';

        csses += '<link rel="stylesheet" href="assets/ace/css/datepicker.css?version=' + versionCode + '" />';

        csses += '<link rel="stylesheet" href="assets/ace/css/daterangepicker.css?version=' + versionCode + '" />';

        csses += '<link rel="stylesheet" href="assets/ace/css/bootstrap-timepicker.css?version=' + versionCode + '" />';

        csses += '<link rel="stylesheet" href="assets/ace/css/huploadify.css?version=' + versionCode + '" />';

        csses += '<link rel="stylesheet" href="assets/ace/css/colorbox.css?version=' + versionCode + '" />';

        csses += '<link rel="stylesheet" href="assets/ace/css/ace.css?version=' + versionCode + '" />';
        /* ace end */

        /* altogether */
        csses += '<link rel="stylesheet" href="assets/altogether/css/font-awesome.min.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/altogether/css/layer.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/altogether/css/iconfont.css?version=' + versionCode + '" />'; /*  iconfont  */
        /* altogether end */

        csses += '<link rel="stylesheet" href="' + server + 'css/main.css?version=' + versionCode + '" />';

        document.write(csses);

        var jses = "";

        if(!window.jQuery){
            jses += '<script src="' + server + 'assets/altogether/js/jquery-2.0.3.min.js?version=' + versionCode + '"><\/script>';
        }

        document.write(jses);
    </script>

<div class="modal fade" id="phonecallModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title">拨打电话</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="username">姓名</label>

                        <div class="col-sm-9">
                            <input id="username" type="text" class=" " data-toggle="popover" readonly data-trigger='manual' maxlength="32">
                        </div>
                    </div>

                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="caller">主叫号码</label>

                        <div class="col-sm-9">
                            <input id="caller" type="text" class="" data-toggle="popover" readonly data-trigger='manual' >
                        </div>
                    </div>

                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="callee">被叫号码</label>

                        <div class="col-sm-9">
                            <input id="callee" type="text" class=" v_required v_phone" data-toggle="popover" data-trigger='manual' maxlength="11">
                        </div>
                    </div>

                </form>
            </div>

            <div class="modal-footer ">
                <button class="btn btn-success" type="button" id="save"><i class="icon-phone bigger-110"></i>拨打电话</button>
                <button type="button" name="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>
