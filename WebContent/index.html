    <script type="text/javascript">

        window.notOperate = false;

        var isF5 = false;
        document.onkeydown = function (e) {
          var ev = window.event || e;
            var code = ev.keyCode || ev.which;
            if (code == 116) {
                isF5 = true;
            }
        };

        if(!parent.window.isPC) window.onbeforeunload = onclose;

        function onclose(){
            if(!isF5){
                isF5 = false;
                return "";
            }
        }

        var server = './';
        var versionCode = '';
        var cookies = document.cookie.split(";");

        for(var i=0;i<cookies.length;i++){
            var cookie = cookies[i];
            
            if(cookie.indexOf("versionCode") != -1){
                versionCode = cookie.split("=")[1];
            }else if(cookie.indexOf("authentication") != -1){
                window.authentication = cookie.substr(cookie.indexOf('=') + 1);
            }else if(cookie.indexOf("loginTime") != -1){
                window.loginTime = cookie.split("=")[1];
            }else if(cookie.indexOf("communion") != -1){
                window.communion = cookie.split("=")[1];
            }
        }

        // 登录超时
        if(window.loginTime == undefined ){
            isF5 = true;
            window.location.href = "/";
        }

        var csses = "";
        /* ace */
        csses += '<link rel="stylesheet" href="assets/ace/css/bootstrap.min.css?version=' + versionCode + '" />'; // basic styles
        csses += '<link rel="stylesheet" href="assets/ace/css/font-awesome-fa.min.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/ace/css/fullcalendar.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/ace/css/huploadify.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/ace/css/colorbox.css?version=' + versionCode + '" />'; // picture box
        csses += '<link rel="stylesheet" href="assets/ace/css/ace.css?version=' + versionCode + '" />';
        /* ace end */

        /* altogether */
        csses += '<link rel="stylesheet" href="assets/altogether/css/font-awesome.min.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/altogether/css/layer.css?version=' + versionCode + '" />';
        csses += '<link rel="stylesheet" href="assets/altogether/css/iconfont.css?version=' + versionCode + '" />'; /*  iconfont  */
        csses += '<link rel="stylesheet" href="assets/altogether/css/locking.css?version=' + versionCode + '" />'; /*  lockscreen */
        /* altogether end */

        csses += '<link rel="stylesheet" href="' + server + 'css/main.css?version=' + versionCode + '" />';

        document.write(csses);

        var jses = "";

        if(!window.jQuery){
            jses += '<script src="' + server + 'assets/altogether/js/jquery-2.0.3.min.js?version=' + versionCode + '"><\/script>';
        }

        document.write(jses);
    </script>
