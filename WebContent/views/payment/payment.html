
<div id="payment" class="col-md-12">
	<div class="row">
		<div id="paymentList">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>

		<div class="modal fade" id="collectModal" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
						<h4 class="modal-title" id="myModalLabel">收款信息</h4>
					</div>
					<div class="modal-body">
						<form class="form-horizontal">
							<div style='color:red;text-align:center;display:none;' class='payWayError'>请选择付款方式</div>
							<div class="form-group">
								<label class="col-md-3 control-label no-padding-right" id="paymentMethod">付款方式</label>
								<div class="col-sm-9" id="checkbox">
									<label class="hide cashCheckbox">
										<input type="checkbox" class="ace" id="cashCheckbox">
										<span class="lbl"> 现金</span>
									</label>
									<label class="hide bankCheckbox">
										<input type="checkbox" class="ace" id="bankCheckbox">
										<span class="lbl"> 刷卡</span>
									</label>
									<label class="hide checkvCheckbox">
										<input type="checkbox" class="ace" id="checkvCheckbox">
										<span class="lbl"> 银行</span>
									</label>
								</div>
							</div>
							<div class="space-4 "></div>

							<div class="form-group" id="paymentTypeDiv">
								<label class="col-sm-3 control-label no-padding-right" for="advanceType">预付款类型</label>
								<div class="col-sm-9">
									<select id="advanceType" class="col-xs-10 col-sm-5" style="min-width: 50%; width: 170px;">
										<option value='0'>合同预付款</option>
										<option value='2'>主材预付款</option>
									</select>
								</div>
							</div>
							<div class="space-4 "></div>

							<div class="form-group" id="balanceDiv">
								<label for="balance" class="col-md-3 control-label">余额</label>
								<div class="col-md-9">
									<input type="text" id="balance" class="col-md-6 v_required v_float_3" disabled/>
								</div>
							</div>
							<div class="space-4 "></div>

							<div class="form-group" id="withdrawDiv">
								<label for="withdraw" class="col-md-3 control-label">提现金额</label>
								<div class="col-md-9">
									<input type="text" id="withdraw" class="col-md-6 v_required v_float_3"/>
								</div>
							</div>
							<div class="space-4 "></div>

							<div class="form-group" >
								<label class="col-md-3 control-label no-padding-right" for="des" >说明</label>
								<div class="col-md-9">
									<textarea id="des" class="col-md-6 v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="256"></textarea>
								</div>
							</div>

							<div class="space-1" id="historyDiv">
								<h4 class="header blue bolder smaller">历史收款</h4>
								<ul id="historyData"></ul>
							</div>

							<div id="cashDiv" referCheckbox="cashCheckbox" style="display: none;">
								<h4 class="header blue bolder smaller">现金</h4>
								<div class="form-group">
									<label class="col-sm-3 control-label no-padding-right" for="cashInfo">类型</label>
									<div class="col-sm-9">
										<input type="text" id="cashInfo" class="col-xs-10 col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" />
									</div>
								</div>
								<div class="space-4"></div>

								<div class="form-group">
									<label for="cash" class="col-md-3 control-label no-padding-right">现金金额</label>
									<div class="col-sm-9">
										<input type="text" id="cash" class="col-xs-10 col-sm-5 v_required v_float_3"  data-toggle="popover" data-trigger='manual'/>
									</div>
								</div>
								<div class="space-4"></div>
							</div>

							<div id="posDiv" referCheckbox="bankCheckbox" style="display: none;">
								<h4 class="header blue bolder smaller">POS</h4>
								<div id="posGroup"></div>
							</div>

							<div id="bankDiv" referCheckbox="bankCheckbox" style="display: none;">
								<h4 class="header blue bolder smaller">POS</h4>
								<div id="bankGroup">
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right">开户行</label>
										<div class="col-sm-8">
											<input class="col-xs-10 col-sm-6" type="text" id="bankName" data-toggle="popover" data-trigger="manual" data-placement="bottom" autocomplete="off">
											<button class="btn btn-minier btn-orange pull-right inline" id="createPaytran">在线支付</button>
										</div>
									</div>
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right">刷卡金额</label>
										<div class="col-sm-8">
											<input class="col-sm-6" data-toggle="popover" data-trigger="manual" type="text" id="bank">
										</div>
									</div>
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right">方式</label>
										<div class="col-sm-8">
											<select class="col-sm-6 inline" data-toggle="popover" data-trigger="manual" id="posway"></select>
										</div>
									</div>
								</div>
							</div>

							<div id="checkvDiv" referCheckbox="checkvCheckbox" style="display: none;">
								<h4 class="header blue bolder smaller">
									银行
									<button id="checkvAdd" class="btn btn-minier btn-success pull-right inline" num="0" maxnum="0">添加</button>
								</h4>
								<div id="checkvGroup"></div>
							</div>
						</form>
					</div>

					<div class="modal-footer ">
						<button type="button" id="collectBtn" class="btn btn-primary">收款</button>
						<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
					</div>
				</div>
			</div>
		</div>

		<!-- 创建预付款账户 -->
		<div class="modal fade" id="createPaymentModal" tabindex="-1">
			<div class="modal-dialog" style="margin-top: 10%;">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
						<h4 class="modal-title">创建账户</h4>
					</div>
					<div class="modal-body">
						<form class="form-horizontal">
							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="decorationOrderId">装修单号</label>
								<div class="col-sm-8">
									<input type="text" id="decorationOrderId" class="col-xs-10 col-sm-7 v_required" />
								</div>
							</div>
						</form>
					</div>

					<div class="modal-footer" style="text-align: center">
						<button type="button" id="createBtn" class="btn btn-primary">确定</button>
					</div>
				</div>
			</div>
		</div>


		<!-- 生成预付款 -->
		<div class="modal fade" id="createCollectPaymentModal" tabindex="-1">
			<div class="modal-dialog" style="margin-top: 10%;">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
						<h4 class="modal-title">生成预付款</h4>
					</div>
					<div class="modal-body">
						<form class="form-horizontal">
							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="collect_orderId">装修单号</label>
								<div class="col-sm-8">
									<input type="text" id="collect_orderId" class="col-xs-10 col-sm-7 v_required" />
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="collect_advance_type">预付款类型</label>
								<div class="col-sm-8">
									<select id="collect_advance_type" class="col-xs-10 col-sm-7">
										<option value='0'>合同预付款</option>
										<option value='2'>主材预付款</option>
									</select>
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="collect_money">收款金额</label>
								<div class="col-sm-8">
									<input type="text" id="collect_money" class="col-xs-10 col-sm-7 v_required v_float_3" />
								</div>
							</div>
						</form>
					</div>

					<div class="modal-footer" style="text-align: center">
						<button type="button" id="confirmBtn" class="btn btn-primary">确定</button>
					</div>
				</div>
			</div>
		</div>

	</div>

</div>

<div class="modal fade" id="collectCodeQrcodeModal" tabindex="-1"></div>
<div class="modal fade" id="alipayCodeQrcodeModal" tabindex="-1"></div>
<div id="layerPopUp" class="portlet box page-content"></div>

<script type="text/javascript">
	$.loadScript(['js/utils/paymentUtils.js', 'js/utils/kingdeeUtils.js', 'js/payment/payment.js']);
</script>
