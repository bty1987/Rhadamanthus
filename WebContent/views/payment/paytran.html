<div id="paytranContent">
	<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
	<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
	<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->

	<div class="modal fade" id="createPaytranModal" tabindex="-1">
		<div class="modal-dialog" style="margin-top: 10%;">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title">生成转换款</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-4 control-label no-padding-right orange" for="orderId">装修单号</label>
							<div class="col-sm-8">
								<input type="text" id="orderId" class="col-xs-10 col-sm-7 v_required" />
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-4 control-label no-padding-right orange" for="bankName">开户行</label>
							<div class="col-sm-8">
								<input class="col-xs-10 col-sm-7 v_typeahead v_required" type="text" id="bankName" data-toggle="popover" data-trigger="manual" data-placement="bottom" autocomplete="off">
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-4 control-label no-padding-right orange" for="money">收款金额</label>
							<div class="col-sm-8">
								<input type="text" id="money" class="col-xs-10 col-sm-7 v_required v_float_3" />
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-4 control-label no-padding-right orange" for="atttype">业务类型</label>
							<div class="col-sm-8">
								<select id="atttype" class="col-xs-10 col-sm-7">
									<option value='0'>装修</option>
									<option value='1'>主材</option>
								</select>
							</div>
						</div>
					</form>
				</div>

				<div class="modal-footer" style="text-align: center">
					<button type="button" id="confirmBtn" class="btn btn-primary" data-i18n="msg.ok">确定</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="posPayModal" tabindex="-1">
		<div class="modal-dialog" style="margin-top: 10%;">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title">POS推送</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-4 control-label no-padding-right orange" for="way" data-i18n="page.payment.label.method">方式</label>
							<div class="col-sm-8">
								<select id="way" class="col-xs-10 col-sm-7"></select>
							</div>
						</div>
					</form>
				</div>

				<div class="modal-footer" style="text-align: center">
					<button type="button" id="posConfirmBtn" class="btn btn-primary" data-i18n="msg.ok">确定</button>
				</div>
			</div>
		</div>
	</div>

</div>

<div id="paytranCodeQrcodeModal"></div>

<script type="text/javascript">
	$.loadScript(['js/utils/paymentUtils.js', 'js/payment/paytran.js']);
</script>
