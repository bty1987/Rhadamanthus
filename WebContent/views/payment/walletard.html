<div class="col-xs-12" id="walletard">
    <div class="row">
        <div id="walletardList">
            <div id="walletardResultList" class="clearfix"></div>
            <div id="btnList" class="fl-page-wrap clearfix col-xs-12">
                <a id="bindCard" class="btn btn-minier btn-primary pull-left" style="margin:0px 3px">
                    <i class="icon-money bigger-110"></i>
                    <span>绑定银行卡</span>
                </a>
            </div>
        </div>

        <!-- 绑定银行卡 -->
        <div class="modal fade" id="bindCardModal" tabindex="-1">
            <div class="modal-dialog" style="margin-top: 10%;">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                        <h4 class="modal-title">绑定银行卡</h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal">
                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="bankNo">银行卡号</label>
                                <div class="col-sm-8">
                                    <input type="text" id="bankNo" class="col-xs-10 col-sm-7 v_required" />
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="bankName">银行名称</label>
                                <div class="col-sm-8">
                                    <input type="text" id="bankName" class="col-xs-10 col-sm-7 v_required" />
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="validTime">有效期</label>
                                <div class="col-sm-8">
                                    <input class="date-picker-date col-xs-10 col-sm-7 v_required" id="validTime" type="text" readonly="readonly" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="cvv">安全码</label>
                                <div class="col-sm-8">
                                    <input type="text" id="cvv" class="col-xs-10 col-sm-7 v_required" />
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="type">类型</label>
                                <div class="col-sm-8">
                                    <select id='type' class='col-xs-10 col-sm-7 v_required' data-toggle="popover"></select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="mobile">电话</label>
                                <div class="col-sm-8">
                                    <input type="text" id="mobile" class="col-xs-10 col-sm-7 v_required v_phone" />
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="bindCardcode"></label>
                                <div class="col-sm-8">
                                    <input type="text" id="bindCardcode" class="col-xs-10 col-sm-7 v_required" placeholder="验证码" maxlength="8" />
                                    <a id="bindCardgetCode" class="btn btn-success btn-sm">获取验证码</a>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="modal-footer" style="text-align: center">
                        <button type="button" id="bindCardBtn" class="btn btn-primary">转账</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/paymentUtils.js', 'js/payment/walletard.js']);
</script>
