<div id="decorationPaymentPosContent">

	<div class="row">
		<div class="col-xs-12">
			<div class="tabbable">
				<ul class="nav nav-tabs" id="myTab">
					<li class="active">
						<a data-toggle="tab" href="#decorationPaymentListPos" >装修收款</a>
					</li>
					<li class="">
						<a data-toggle="tab" href="#historyDecorationPaymentListPos">历史收款</a>
					</li>
				</ul>
				<div class="tab-content">
					<div id="decorationPaymentListPos" class="tab-pane active">
						<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
					</div>
					<div id="historyDecorationPaymentListPos" class="tab-pane">
						<div id="hcondList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="hresultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="hpagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
					</div>
				</div>
			</div>
			
			<div class="modal fade" id="addReduceDetail" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
		      			<div class="modal-header">
		        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
		        			<h4 class="modal-title" id="myModalLabel">增减项明细</h4>
		      			</div>
		      			<div class="modal-body">
							<div id="acondList" class="fl_search clearfix"></div> <!-- 查询条件-->
							<div id="aresultList" class="clearfix tab-pane active"></div> <!--查询结果--> 
							<div class="modal-footer ">
					        	<button type="button" id="canceDetailBtn" class="btn btn-default" data-dismiss="modal">返回</button>
					      	</div>
		    			</div>
		    		</div>
		  		</div>
		  	</div>

			<div class="modal fade" id="baseItemModal" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
		      			<div class="modal-header">
		        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
		        			<h4 class="modal-title" id="myModalPayLabel">付款信息</h4>
		      			</div>
		      			<div class="modal-body">
		      				<form class="form-horizontal">
		      					<input type="text" id="decorationPaymentId" class="hide" />
		      					<div class="block clearfix">
									<label class="col-md-3 control-label" >付款方式</label>
									<label class="inline">
										<input type="checkbox" class="ace" id="bankCheckbox" key="bank" select="1">
										<span class="lbl"> 刷卡</span>
									</label>
									<label class="inline">
										<input type="checkbox" class="ace" id="advanceCheckbox" key="advance" select="1">
										<span class="lbl"> 预付款</span>
									</label>
								</div>
		
								<div id="infoDiv">
									<h4 class="header blue bolder smaller">基本信息</h4>
									<div class="form-group">
										<label class="col-md-3 control-label" for="referMoney">应收款</label>
										<div class="col-md-9">
											<input type="text" id="referMoney" class="col-xs-10 col-sm-6 v_required v_float_3" readonly  data-toggle="popover" data-trigger='manual' maxlength="8"/>
										</div>
									</div>
									<div class="space-4 "></div>
									<div class="form-group" >
										<label class="col-md-3 control-label no-padding-right" for="collectDes" >说明</label>
										<div class="col-md-9">
											<textarea id="collectDes" class="col-md-6 v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="40"></textarea>
										</div>
									</div>
								</div>

								<div id="posDiv" referCheckbox="bankCheckbox" style="display: none;">
									<h4 class="header blue bolder smaller">
										POS
									</h4>
									<div id="decorationPosposDivGroup"></div>
								</div>
								
								<div id="bankDiv" referCheckbox="bankCheckbox">
									<h4 class="header blue bolder smaller">
										POS
									</h4>
									<div id="decorationPosbankDivGroup"></div>
								</div>
								
								<div id="advanceDiv" referCheckbox="advanceCheckbox" style="display: none;">
			      					<h4 class="header blue bolder smaller">预付款</h4>
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="advanceType">类型</label>
										<div class="col-sm-7">
											<select id="advanceType" class="col-xs-10 col-sm-5 v_required " data-toggle="popover" style="min-width: 50%; width: 170px;" data-trigger='manual'></select>
										</div>
									</div>
									<div class="space-4"></div>
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="balanceAdvance" >合同余额</label>
										<div class="col-sm-9">
											<input type="text" id="balanceAdvance" class="col-xs-10 col-sm-5"  data-toggle="popover" data-trigger='manual' >
										</div>
									</div>

						      		<div class="form-group">
										<label for="advance" class="col-md-3 control-label">金额</label>
										<div class="col-md-9 block no-padding-right  ">
											<input type="text" id="advance" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
										</div>
									</div>
								</div>
							</form>
		      			</div>
		      			
						<div class="modal-footer ">
							<button type="button" id="collectBtn" class="btn btn-primary">收款</button>
				        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				      	</div>
		    		</div>
		  		</div>
		  	</div>

		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/utils/paymentUtils.js', 'js/payment/decorationPayment4pos.js']);
</script>
