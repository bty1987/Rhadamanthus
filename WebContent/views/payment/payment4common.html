<div class="page-content" id="paymentCommon">

    <div id="fl-statement" style="display: none;"></div>

    <div class="row">
        <div class="col-xs-12 form-line" id="orderIdDiv" style="display: none; padding-bottom: 20px;">
            <span class="fl-filter-inline">
                <label>装修单号:</label> <input type="text" id="orderId" />
            </span>
            <button class="btn btn-xs btn-info btn-search" id="searcher">查询</button>
        </div>
    </div>

    <div class="row form-line" id="infolist" style="display: none; padding-bottom: 20px;">
        <div class="col-xs-6 col-md-3">
            <a href="#" id="print" class="btn btn-purple btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-print bigger-230"></i>
                <span>打印</span>
            </a>
        </div>
    </div>

    <div class="row">
        <div class="row col-xs-12">
            <div class="col-xs-6 col-md-6 widget-container-span ui-sortable">
                <h3 class="modal-title blue">预付款</h3>
                <div class="tabbable">
                    <div id="condListAdvance" class="fl_search clearfix"></div>
                    <div id="resultListAdvance" class="clearfix tab-pane active"></div>
                    <div id="pagenationAdvance" class="fl-page-wrap clearfix"></div>
                </div>
            </div>

            <div class="col-xs-6 col-md-6 widget-container-span ui-sortable">
                <h3 class="modal-title blue">装修款</h3>
                <div class="tabbable">
                    <div id="condListDecoration" class="fl_search clearfix"></div>
                    <div id="resultListDecoration" class="clearfix tab-pane active"></div>
                    <div id="pagenationDecoration" class="fl-page-wrap clearfix"></div>
                </div>
            </div>

            <div class="col-xs-6 col-md-6 widget-container-span ui-sortable">
                <h3 class="modal-title blue">销售款</h3>
                <div class="tabbable">
                    <div id="condListSales" class="fl_search clearfix"></div>
                    <div id="resultListSales" class="clearfix tab-pane active"></div>
                    <div id="pagenationSales" class="fl-page-wrap clearfix"></div>
                </div>
            </div>

            <div class="col-xs-6 col-md-6 widget-container-span ui-sortable">
                <h3 class="modal-title blue">服务款</h3>
                <div class="tabbable">
                    <div id="condListService" class="fl_search clearfix"></div>
                    <div id="resultListService" class="clearfix tab-pane active"></div>
                    <div id="pagenationService" class="fl-page-wrap clearfix"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="printPaymentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="printPaymentDialog">款项</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group" id="paymentType">
                            <label class="col-sm-3 control-label no-padding-right orange">款项类型</label>
                            <div class="col-md-9">
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="0" name="ptype">
                                    <span class="lbl">预付款</span>
                                </label>
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="1" name="ptype">
                                    <span class="lbl">装修款</span>
                                </label>
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="3" name="ptype">
                                    <span class="lbl">销售款</span>
                                </label>
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="4" name="ptype">
                                    <span class="lbl">服务款</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-group" id="receiptType">
                            <label class="col-sm-3 control-label no-padding-right orange">收据类型</label>
                            <div class="col-md-9">
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="1" name="rtype">
                                    <span class="lbl">现金</span>
                                </label>
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="2" name="rtype">
                                    <span class="lbl">刷卡</span>
                                </label>
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="3" name="rtype">
                                    <span class="lbl">银行</span>
                                </label>
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="4" name="rtype">
                                    <span class="lbl">预付款</span>
                                </label>
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="5" name="rtype">
                                    <span class="lbl">优惠券</span>
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="space-4"></div>

                <div class="modal-footer">
                    <button type="button" id="printBtn" class="btn btn-primary">打印</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/paymentUtils.js', 'js/payment/payment4common.js']);
</script>
