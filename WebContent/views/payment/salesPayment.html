                    <a data-toggle="tab" href="#salesPaymentList">家具收款</a>

                <li class="">
                    <a data-toggle="tab" href="#historySales">历史收款</a>
                </li>

                <div id="salesPaymentList" class="tab-pane active">
                    <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->

                </div>
                <div id="historySales" class="tab-pane">

<!--<div id="layerAdd" style="padding: 10px 0;display: none">-->
<div class="modal fade" id="layerAdd" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="myModalLabel"></h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="form">
                    <div class="block clearfix">
                        <label class="col-md-3 control-label" style="margin-top: -5px">付款方式</label>
                        <label class="inline">
                            <input type="checkbox" class="ace" id="cashCheckbox" key="cash" select="0">
                            <span class="lbl"> 现金</span>
                        </label>
                        <label class="inline">
                            <input type="checkbox" class="ace" id="bankCheckbox" key="bank" select="0">
                            <span class="lbl"> 刷卡</span>
                        </label>
                        <label class="inline">
                            <input type="checkbox" class="ace" id="checkvCheckbox" key="checkv" select="0">
                            <span class="lbl"> 转账</span>
                        </label>
                        <label class="inline">
                            <input type="checkbox" class="ace" id="advanceCheckbox" key="advance" select="1">
                            <span class="lbl"> 预付款</span>
                        </label>
                        <label class="inline">
                            <input type="checkbox" class="ace" id="couponCheckbox" key="coupon" select="0">
                            <span class="lbl"> 优惠券</span>
                        </label>
                    </div>

                    <div id="infoDiv">
                        <h4 class="header blue bolder smaller">基本信息</h4>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="referMoney">应收金额</label>
                            <div class="col-md-9">
                                <input type="text" id="referMoney" class="col-xs-10 col-sm-6 v_required" data-toggle="popover"data-trigger='manual' readonly/>
                            </div>
                        </div>
                        <div class="space-4 "></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="collectDes">说明</label>
                            <div class="col-md-9">
                                <textarea id="collectDes" class="col-md-6 v_name v_required" rows="3" data-toggle="popover"
                                          data-trigger='manual' maxlength="40"></textarea>
                            </div>
                        </div>
                        <div class="space-4 "></div>

                        <div class="space-1" id="historyUpdateSA">
                            <h4 class="header blue bolder smaller">历史收款</h4>
                            <span id="cashHistorySA" class="blue" style="font-size: 14px; margin-left: 20px;"></span><br/>
                            <span id="bankHistorySA" class="blue" style="font-size: 14px; margin-left: 20px;"></span><br/>
                            <span id="checkvHistorySA" class="blue" style="font-size: 14px; margin-left: 20px;"></span>
                            <span id="installmentHistorySA" class="blue" style="font-size: 14px; margin-left: 20px;"></span><br/>
                            <span id="accountsHistorySA" class="blue" style="font-size: 14px; margin-left: 20px;"></span>
                        </div>
                    </div>

                    <div id="cashDiv" name="top" class="hide">
                        <h4 class="header blue bolder smaller">现金</h4>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="salescashInfo">类型</label>
                            <div class="col-sm-9">
                                <input type="text" id="salescashInfo" class="col-xs-10 col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label for="cash" class="col-sm-3 control-label no-padding-right">现金金额</label>
                            <div class="col-md-9 block no-padding-right  ">
                                <input type="text" id="cash" class="col-xs-10 col-sm-5 v_required v_float" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </div>

                    <div id="bankDiv" name="top" class="hide">
                        <h4 class="header blue bolder smaller">
                            银行卡
                            <button id="salesbankAdd" class="btn btn-minier btn-success pull-right inline" num="0" maxnum="0">添加</button>
                        </h4>
                        <div id="salesbankDivGroup"></div>
                    </div>

                    <div id="checkvDiv" name="top" class="hide">
                        <h4 class="header blue bolder smaller">
                            转账
                            <button id="salescheckvAdd" class="btn btn-minier btn-success pull-right inline" num="0" maxnum="0">添加</button>
                        </h4>
                        <div id="salescheckvDivGroup"></div>
                    </div>

                    <div id="advanceDiv" name="top" class="hide">
                        <h4 class="header blue bolder smaller">预付款</h4>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="advanceType">预付款类型</label>
                            <div class="col-sm-7">
                                <select id="advanceType" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" style="min-width: 50%; width: 170px;" data-trigger='manual'></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label for="advance" class="col-sm-3 control-label no-padding-right">余额</label>
                            <div class="col-sm-9">
                                <input type="text" id="advance" class="col-xs-10 col-sm-5 v_required v_float" data-toggle="popover" data-trigger='manual' maxlength="8" disabled/>
                            </div>
                        </div>

                        <div class="space-4"></div>

                        <div class="form-group">
                            <label for="payAdvance" class="col-sm-3 control-label no-padding-right">支付金额</label>
                            <div class="col-sm-9">
                                <input type="text" id="payAdvance" class="col-xs-10 col-sm-5 v_required v_float" data-toggle="popover"
                                       data-trigger='manual' maxlength="8"/>
                            </div>
                        </div>


                        <div class="space-4 "></div>
                    </div>

                    <div id="couponDiv" name="top" class="hide">
                        <h4 class="header blue bolder smaller">优惠券</h4>
                        <div class="form-group">
                            <div class="col-sm-12">
                                <select id="couponType" multiple="multiple" class="chosen-select tag-input-style v_required" data-placeholder="..." data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <span id="paymentInfo" class="alert-danger pull-left inline"></span>
                <button type="button" id="collectOrRefundBtn" class="btn btn-primary">收款</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<!-- 装修单信息 -->
<div class="modal fade" id="decorationInfo" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="decorationInfoDialog">装修单信息</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">装修单号</label>
                        <div class="col-sm-8">
                            <span id="orderId" style="line-height: 30px"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">楼盘地址</label>
                        <div class="col-sm-8">
                            <span id="address" style="line-height: 30px"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">类型</label>
                        <div class="col-sm-8">
                            <span id="type" style="line-height: 30px"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">等级</label>
                        <div class="col-sm-8">
                            <span id="grade" style="line-height: 30px"></span>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="text-align: center">
                <button type="button" id="cancelDecorationInfoBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/paymentUtils.js', 'js/payment/salesPayment.js']);
</script>
