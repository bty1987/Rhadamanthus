
<div>
	<div class="row">
		<div class="col-xs-12">
			<div class="paymentTab">
				<ul class="nav nav-tabs" id="myTab">
					<li class="active">
						<a data-toggle="tab" href="#paymentPosList">预付款</a>
					</li>
				</ul>
				<div class="tab-content ">
					<div id="paymentPosList" class="tab-pane active">
						<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="paymentModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="myModalLabel">收款信息</h4>
      			</div>
      			<div class="modal-body">
      				<form class="form-horizontal">
      					<div style='color:red;text-align:center;display:none;' class='payWayError'>请选择付款方式</div>
	      				<div class="block clearfix pay_way">
							<label class="col-md-3 control-label" id="paymentMethod">付款方式</label>
							<label class="inline">
								<input type="checkbox" class="ace" id="bankCheckbox">
								<span class="lbl"> 刷卡</span>
							</label>
						</div>
						<div class="space-4 "></div>

						<div class="form-group" id="paymentTypeDiv">
							<label class="col-sm-3 control-label no-padding-right" for="paymentTypeSel">预付款类型</label>
							<div class="col-sm-9">
								<select id="paymentTypeSel" class="col-xs-10 col-sm-5" style="min-width: 50%; width: 170px;">
									<option value='0'>合同预付款</option>
									<option value='2'>主材预付款</option>
								</select>
							</div>
						</div>
						<div class="space-4 "></div>

						<div class="form-group" id="refundSumBalanceDiv">
							<label for="refundSum" class="col-md-3 control-label">余额</label>
							<span class="col-md-9">
								<input type="text" id="refundSum" class="col-md-5 v_required v_float_3" disabled/>
							</span>
						</div>
						<div class="space-4 "></div>

						<div class="form-group" id="refundSumWithdrawDiv">
							<label for="refundSum" class="col-md-3 control-label">提现金额</label>
							<div class="col-md-9">
								<input type="text" id="refund" class="col-md-5 v_required v_float_3"/>
							</div>
						</div>
						<div class="space-4 "></div>
						
						<div class="form-group" >
							<label class="col-md-3 control-label no-padding-right" for="des" >说明</label>
							<div class="col-md-9">
								<textarea id="des" class="col-md-6 v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="256"></textarea>
							</div>
						</div>

						<div id="posDiv" referCheckbox="bankCheckbox" style="display: none;">
							<h4 class="header blue bolder smaller">
								POS
							</h4>
							<div id="paymentPosposDivGroup"></div>
						</div>
						
						<div id="bankDiv" referCheckbox="bankCheckbox" style='display: none'>
							<h4 class="header blue bolder smaller">
								POS
							</h4>
							<div id="paymentPosbankDivGroup"></div>
						</div>
					</form>
      			</div>
      			
				<div class="modal-footer ">
					<button type="button" id="collectBtn" class="btn btn-primary">收款</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>

	<!-- 装修单信息 -->
	<div class="modal fade" id="decorationInfo" tabindex="-1">
		<div class="modal-dialog" style="margin-top: 10%;">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="DecorationInfoLabel">装修单信息</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group" >
							<label class="col-sm-4 control-label no-padding-right">装修单号</label>
							<div class="col-md-8">
								<span id="orderId" style="line-height: 30px"></span>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-4 control-label no-padding-right">楼盘地址</label>
							<div class="col-sm-8">
								<span id="address" style="line-height: 30px"></span>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-4 control-label no-padding-right">类型</label>
							<div class="col-sm-8">
								<span id="type" style="line-height: 30px"></span>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-4 control-label no-padding-right">等级</label>
							<div class="col-sm-8">
								<span id="grade" style="line-height: 30px"></span>
							</div>
						</div>
					</form>
				</div>

				<div class="modal-footer" style="text-align: center">
					<button type="button" id="cancelDecorationInfoBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 创建预付款 -->
	<div class="modal fade" id="createPaymentModal" tabindex="-1">
		<div class="modal-dialog" style="margin-top: 10%;">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title">创建预付款</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-4 control-label no-padding-right orange" for="decorationOrderId">装修单号</label>
							<div class="col-sm-8">
								<input type="text" id="decorationOrderId" class="col-xs-10 col-sm-7 v_required" />
							</div>
						</div>
					</form>
				</div>

				<div class="modal-footer" style="text-align: center">
					<button type="button" id="createBtn" class="btn btn-primary">确定</button>
				</div>
			</div>
		</div>
	</div>

</div>

<script type="text/javascript">
	$.loadScript(['js/utils/paymentUtils.js', 'js/payment/payment4pos.js']);
</script>
