<div id="activityPayment" class="col-md-12">
    <div class="row">
        <div id="activityPaymentList">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>

        <div class="modal fade" id="createModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content" style="width:900px;margin-left:-30%">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"><span>×</span><span class="sr-only">Close</span></button>
                        <h4 class="modal-title" id="myModalLabel">添加</h4>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-xs-12">
                                <form class="form-horizontal">
                                    <div class="row">
                                        <div class="col-md-12">
                                            <div class="form-group">
                                                <label for="mno" class="col-sm-3 control-label no-padding-right">会员号</label>
                                                <div class="col-md-9">
                                                    <input type="text" id="mno" maxlength="15" class="col-xs-10 col-sm-6 v_required"/>
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label for="orderId" class="col-sm-3 control-label no-padding-right">装修单号</label>
                                                <div class="col-md-9">
                                                    <input type="text" id="orderId" maxlength="15" class="col-xs-10 col-sm-6 v_required"/>
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label class="col-sm-3 control-label no-padding-right" for="type">类型</label>
                                                <div class="col-sm-9">
                                                    <select id="type" name="type" maxlength="256" class="col-xs-10 col-sm-6 v_required"></select>
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label class="col-sm-3 control-label no-padding-right"
                                                       for="brand">品牌</label>
                                                <div class="col-sm-9">
                                                    <input type="text" id="brand" name="brand" maxlength="32" class="col-xs-10 col-sm-6" readonly="readonly">
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label class="col-sm-3 control-label no-padding-right"
                                                       for="money">金额</label>
                                                <div class="col-sm-9">
                                                    <input type="text" id="money" maxlength="256" class="col-xs-10 col-sm-6 v_float_3">
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label class="col-sm-3 control-label no-padding-right"
                                                       for="comment">备注</label>
                                                <div class="col-sm-9">
                                                    <input type="text" id="comment" name="comment" maxlength="32" class="col-xs-10 col-sm-6">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer" style="text-align: center">
                        <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    </div>
                </div>
            </div>
        </div>


        <div class="modal fade" id="collectModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="myModalLabels">付款信息</h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal" id="form">
                            <div class="block clearfix">
                                <label class="col-md-3 control-label" style="margin-top: -5px">付款方式</label>
                                <label class="hide cashCheckbox">
                                    <input type="checkbox" class="ace" id="cashCheckbox" key="cash" select="0">
                                    <span class="lbl"> 现金</span>
                                </label>
                                <label class="hide bankCheckbox">
                                    <input type="checkbox" class="ace" id="bankCheckbox" key="bank" select="0">
                                    <span class="lbl"> 刷卡</span>
                                </label>
                                <label class="hide couponCheckbox">
                                    <input type="checkbox" class="ace" id="couponCheckbox" key="coupon" select="0">
                                    <span class="lbl"> 优惠券</span>
                                </label>
                            </div>

                            <div id="infoDiv">
                                <h4 class="header blue bolder smaller">基本信息</h4>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right" for="referMoney">应收金额</label>
                                    <div class="col-md-9">
                                        <input type="text" id="referMoney" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual' readonly/>
                                    </div>
                                </div>
                                <div class="space-4 "></div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right" for="collectDes">说明</label>
                                    <div class="col-md-9">
                                    <textarea id="collectDes" class="col-md-6 v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="40"></textarea>
                                    </div>
                                </div>
                                <div class="space-4 "></div>
                            </div>

                            <div id="cashDiv" name="top" referCheckbox="cashCheckbox"  style="display: none;">
                                <h4 class="header blue bolder smaller">现金</h4>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right" for="cashInfo">类型</label>
                                    <div class="col-sm-9">
                                        <select id="cashInfo" class="col-xs-10 col-sm-6 v_required"></select>
                                    </div>
                                </div>
                                <div class="space-4"></div>

                                <div class="form-group">
                                    <label for="cash" class="col-sm-3 control-label no-padding-right">现金金额</label>
                                    <span class="col-md-9 block no-padding-right">
                                        <input type="text" id="cash" class="col-xs-10 col-sm-6 v_float_3" data-toggle="popover" data-trigger='manual'/>
                                    </span>
                                </div>
                                <div class="space-4"></div>
                            </div>

                            <div id="posDiv" referCheckbox="bankCheckbox" style="display: none;">
                                <h4 class="header blue bolder smaller">POS</h4>
                                <div id="posGroup"></div>
                            </div>

                            <div id="bankDiv" referCheckbox="bankCheckbox" style="display: none;">
                                <h4 class="header blue bolder smaller">POS</h4>
                                <div id="bankGroup">
                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right">开户行</label>
                                        <div class="col-sm-8">
                                            <input class="col-xs-10 col-sm-6" type="text" id="bankName" data-toggle="popover" data-trigger="manual" data-placement="bottom" autocomplete="off">
                                            <button class="btn btn-minier btn-orange pull-right inline" id="posSend">POS推送</button>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right">刷卡金额</label>
                                        <div class="col-sm-8">
                                            <input class="col-sm-6" data-toggle="popover" data-trigger="manual" type="text" id="bank">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right">方式</label>
                                        <div class="col-sm-8">
                                            <select class="col-sm-6 inline" data-toggle="popover" data-trigger="manual" id="posway"></select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="space-4"></div>

                            <div id="couponDiv" name="top" referCheckbox="couponCheckbox" style="display: none;">
                                <h4 class="header blue bolder smaller">优惠券</h4>
                                <div class="form-group">
                                    <div class="col-sm-12">
                                        <ul id="couponGroup" class="item-list list-inline"></ul>
                                    </div>
                                    <div class="col-sm-12" id="couponInputs">
                                        <input type="text" id="couponType" class="col-xs-10 col-sm-5 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" placeholder="请选择优惠券种类" />
                                        <input type="text" id="couponVal" class="col-xs-10 col-sm-5 v_float_3" placeholder="请输入优惠券金额" style="margin: 0 10px">
                                        <button type="button" id="couponAdd" class="btn btn-info btn-minier" style="width: 50px; line-height: 30px">添加</button>
                                    </div>
                                </div>
                                <div class="space-4"></div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer ">
                        <button type="button" id="collectBtn" class="btn btn-primary">确定</button>
                        <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/paymentUtils.js', 'js/payment/activityPayment.js']);
</script>
