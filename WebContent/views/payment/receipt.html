<div id="receiptContent" class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div class="tabbable">
				<div class="tab-content">
					<div id="receiptList" class="tab-pane active">
						<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="receiptModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content" style="width:450px;margin-top: 30%">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel">导出收据</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<div class="col-xs-12">
							<form class="form-horizontal">
								<div class="row">
									<div class="col-md-12">
										<div class="" id="pluginss"></div>
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="executeDates">执行日期</label>
											<div class="col-sm-9">
												<input class="date-picker col-xs-10 col-sm-8 v_required " id="executeDates" type="text" readonly="readonly" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="executeTimes">执行时间</label>
											<div class="col-sm-9">
												<div class="bootstrap-timepicker">
													<input id="executeTimes" type="text" class="v_required col-xs-10 col-sm-8"/>
												</div>
											</div>
										</div>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
				<div class="modal-footer" style="text-align: center">
					<button type="button" id="saveBtn" class="btn btn-primary">确定</button>
					<button type="button" id="cancelBtn" class="btn btn-default">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/utils/planUtils.js', 'js/payment/receipt.js']);
</script>
