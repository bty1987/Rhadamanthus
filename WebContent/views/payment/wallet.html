
<div id="wallet" class="col-md-12">
	<div class="row">
		<div id="walletList">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>

		<!-- 绑定 -->
		<div class="modal fade" id="bindModal" tabindex="-1">
			<div class="modal-dialog" style="margin-top: 10%;">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
						<h4 class="modal-title" id="title"></h4>
					</div>
					<div class="modal-body">
						<form class="form-horizontal">
							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="phone">电话号</label>
								<div class="col-sm-8">
									<input type="text" id="phone" class="col-xs-10 col-sm-7 v_required" />
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="code"></label>
								<div class="col-sm-8">
									<input type="text" id="code" class="col-xs-10 col-sm-7 v_required" placeholder="验证码" maxlength="8" />
									<a id="getCode" class="btn btn-success btn-sm">获取验证码</a>
								</div>
							</div>
						</form>
					</div>

					<div class="modal-footer" style="text-align: center">
						<button type="button" id="bindBtn" class="btn btn-primary" data-i18n="msg.ok">确定</button>
					</div>
				</div>
			</div>
		</div>

		<!-- 提现 -->
		<div class="modal fade" id="withdrawModal" tabindex="-1">
			<div class="modal-dialog" style="margin-top: 10%;">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
						<h4 class="modal-title">提现</h4>
					</div>
					<div class="modal-body">
						<form class="form-horizontal">
							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="amount">提现金额</label>
								<div class="col-sm-8">
									<input type="text" id="amount" class="col-xs-10 col-sm-7 v_float_3" />
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="card">到账银行卡</label>
								<div class="col-sm-8">
									<select id='card' class='col-xs-10 col-sm-7 v_required' data-toggle="popover"></select>
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="withdrawcode"></label>
								<div class="col-sm-8">
									<input type="text" id="withdrawcode" class="col-xs-10 col-sm-7 v_required" placeholder="验证码" maxlength="8" />
									<a id="withdrawgetCode" class="btn btn-success btn-sm">获取验证码</a>
								</div>
							</div>
						</form>
					</div>

					<div class="modal-footer" style="text-align: center">
						<button type="button" id="withdrawBtn" class="btn btn-primary">提现</button>
					</div>
				</div>
			</div>
		</div>

		<!-- 转账 -->
		<div class="modal fade" id="transferModal" tabindex="-1">
			<div class="modal-dialog" style="margin-top: 10%;">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
						<h4 class="modal-title">转账</h4>
					</div>
					<div class="modal-body">
						<form class="form-horizontal">
							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="transferUser">姓名</label>
								<div class="col-md-8">
									<input type="text" id="transferUser" class="col-xs-10 col-sm-7 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" />
								</div>
							</div>

							<!--<div class="form-group">-->
								<!--<label class="col-sm-4 control-label no-padding-right orange" for="cardNum">卡号</label>-->
								<!--<div class="col-sm-8">-->
									<!--<input type="text" id="cardNum" class="col-xs-10 col-sm-7 v_required" />-->
								<!--</div>-->
							<!--</div>-->

							<!--<div class="form-group">-->
								<!--<label class="col-sm-4 control-label no-padding-right orange" for="bank" data-i18n="page.payment.label.bank">银行</label>-->
								<!--<div class="col-md-8">-->
									<!--<input type="text" id="bank" class="col-xs-10 col-sm-7 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" />-->
								<!--</div>-->
							<!--</div>-->

							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="transferAmount">金额</label>
								<div class="col-sm-8">
									<input type="text" id="transferAmount" class="col-xs-10 col-sm-7 v_float_3" />
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-4 control-label no-padding-right orange" for="transfercode"></label>
								<div class="col-sm-8">
									<input type="text" id="transfercode" class="col-xs-10 col-sm-7 v_required" placeholder="验证码" maxlength="8" />
									<a id="transfergetCode" class="btn btn-success btn-sm">获取验证码</a>
								</div>
							</div>
						</form>
					</div>

					<div class="modal-footer" style="text-align: center">
						<button type="button" id="transferBtn" class="btn btn-primary">转账</button>
					</div>
				</div>
			</div>
		</div>

		<!--银行卡-->
		<div id="walletardPopup" class="portlet box"></div>

		<!--交易记录-->
		<div id="walletranPopup" class="portlet box"></div>

	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/utils/paymentUtils.js', 'js/payment/wallet.js']);
</script>
