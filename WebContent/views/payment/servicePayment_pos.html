<div id="decorationPaymentPosContent">

	<div class="row">
		<div class="col-xs-12">
			<div class="tabbable">
				<ul class="nav nav-tabs" id="myTab">
					<li class="active">
						<a data-toggle="tab" href="#servicePaymentPosList" >服务收款</a>
					</li>
				</ul>
				<div class="tab-content ">
					<div id="servicePaymentPosList" class="tab-pane active">
						<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
					</div>
				</div>
			</div>

			<div class="modal fade" id="baseItemModal" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
		      			<div class="modal-header">
		        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
		        			<h4 class="modal-title" id="myModalLabel">付款信息</h4>
		      			</div>
		      			<div class="modal-body">
		      				<form class="form-horizontal">
		      					<input type="text" id="decorationPaymentId" class="hide" />
		      					<div class="block clearfix">
									<label class="col-md-3 control-label" >付款方式</label>
									<label class="inline">
										<input type="checkbox" class="ace" id="bankCheckbox" key="bank" select="1">
										<span class="lbl"> 刷卡</span>
									</label>
								</div>
		
								<div id="infoDiv">
									<h4 class="header blue bolder smaller">基本信息</h4>
									<div class="form-group">
										<label class="col-md-3 control-label" for="referMoney">应收款</label>
										<div class="col-md-9">
											<input type="text" id="referMoney"class="col-xs-10 col-sm-6 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
										</div>
									</div>
									<div class="form-group" id="serviceMoney" style="display: none">
										<label class="col-md-3 control-label" for="referMoney">剩余服务费</label>
										<div class="col-md-9">
											<input type="text" id="sMoney" class="col-xs-10 col-sm-6 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
										</div>
									</div>
									<div class="space-4 "></div>
									<div class="form-group" >
										<label class="col-md-3 control-label no-padding-right" for="collectDes" >说明</label>
										<div class="col-md-9">
											<textarea id="collectDes" class="col-md-6 v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="40"></textarea>
										</div>
									</div>
									<div class="space-4 "></div>
								</div>

								<div id="posDiv" referCheckbox="bankCheckbox" style="display: none;">
									<h4 class="header blue bolder smaller">
										POS
									</h4>
									<div id="servicePosposDivGroup"></div>
								</div>
								
								<div id="bankDiv" style="display: none;" referCheckbox="bankCheckbox">
									<h4 class="header blue bolder smaller">
										POS
									</h4>
									<div id="servicePosbankDivGroup"></div>
								</div>
							</form>
		      			</div>
		      			
						<div class="modal-footer ">
							<button type="button" id="collectBtn" class="btn btn-primary">收款</button>
				        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				      	</div>
		    		</div>
		  		</div>
		  	</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/utils/paymentUtils.js', 'js/payment/servicePayment_pos.js']);
</script>
