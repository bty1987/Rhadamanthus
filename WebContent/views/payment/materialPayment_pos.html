<div id="materialPaymentPosContent">
	<div id="fl-statement"></div>

	<div class="row">
		<div class="col-xs-12">
			<div class="tabbable">
				<ul class="nav nav-tabs" id="myTab">
					<li class="active">
						<a data-toggle="tab" href="#materialPaymentPosList" >主材收款</a>
					</li>
				</ul>
				<div class="tab-content ">
					<div id="materialPaymentPosList" class="tab-pane active">
						<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
					</div>
				</div>
			</div>

			<div class="modal fade" id="baseItemModal" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
		      			<div class="modal-header">
		        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
		        			<h4 class="modal-title" id="myModalLabel">付款信息</h4>
		      			</div>
		      			<div class="modal-body">
		      				<form class="form-horizontal">
		      					<div class="block clearfix">
									<label class="col-md-3 control-label" >付款方式</label>
									<label class="inline">
										<input type="checkbox" class="ace" id="bankCheckbox" key="bank" select="0">
										<span class="lbl"> 刷卡</span>
									</label>
									<label class="inline">
										<input type="checkbox" class="ace" id="advanceCheckbox" key="advance" select="1">
										<span class="lbl"> 预付款</span>
									</label>
								</div>
								<div id="infoDiv">
									<h4 class="header blue bolder smaller">基本信息</h4>
									<div class="form-group" >
										<label class="col-sm-3 control-label no-padding-right" for="referMoney" >应收金额</label>
										<div class="col-md-9">
											<input type="text" id="referMoney" class="col-xs-10 col-sm-5 v_required" style="min-width: 50%; width: 170px;"  data-toggle="popover" data-trigger='manual' />
										</div>
									</div>
									<div class="space-4 "></div>
									<div class="form-group" >
										<label class="col-sm-3 control-label no-padding-right" for="des" >说明</label>
										<div class="col-md-9">
											<textarea id="des" class="col-md-6 v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="40"></textarea>
										</div>
									</div>
								</div>
							
								<div id="posDiv" referCheckbox="bankCheckbox" style="display: none;">
									<h4 class="header blue bolder smaller">
										POS
									</h4>
									<div id="materialPosposDivGroup"></div>
								</div>
								
								<div id="bankDiv" referCheckbox="bankCheckbox" style="display: none;">
									<h4 class="header blue bolder smaller">
										POS
									</h4>
									<div id="materialPosbankDivGroup"></div>
								</div>

								<div id="advanceDiv" referCheckbox="advanceCheckbox" style="display: none;">
									<h4 class="header blue bolder smaller">预付款</h4>
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="advanceType">类型</label>
										<div class="col-sm-7">
											<select id="advanceType" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' style="min-width: 50%; width: 170px;"></select>
										</div>
									</div>
									<div class="space-4"></div>
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="materialAdvance" >主材余额</label>
										<div class="col-sm-9">
											<input type="text" id="materialAdvance"  class="col-xs-10 col-sm-5"  data-toggle="popover" data-trigger='manual' >
										</div>
									</div>
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="advance" >金额</label>
										<div class="col-sm-9">
											<input type="text" id="advance" class="col-xs-10 col-sm-5 v_required v_float_3"  data-toggle="popover" data-trigger='manual' >
										</div>
									</div>
									<div class="space-4 "></div>
								</div>
							</form>
		      			</div>
		      			
						<div class="modal-footer">
							<button type="button" id="saveBtn" class="btn btn-primary">收款</button>
				        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				      	</div>
		    		</div>
		  		</div>
		  	</div>

			<!-- 装修单信息 -->
			<div class="modal fade" id="decorationInfo" tabindex="-1">
				<div class="modal-dialog" style="margin-top: 10%;">
					<div class="modal-content">
						<div class="modal-header">
							<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
							<h4 class="modal-title" id="DecorationInfoLabel">装修单信息</h4>
						</div>
						<div class="modal-body">
							<form class="form-horizontal">
								<div class="form-group" >
									<label class="col-sm-4 control-label no-padding-right">装修单号</label>
									<div class="col-md-8">
										<span id="orderId" style="line-height: 30px"></span>
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-4 control-label no-padding-right">楼盘地址</label>
									<div class="col-sm-8">
										<span id="address" style="line-height: 30px"></span>
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-4 control-label no-padding-right">类型</label>
									<div class="col-sm-8">
										<span id="type" style="line-height: 30px"></span>
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-4 control-label no-padding-right">等级</label>
									<div class="col-sm-8">
										<span id="grade" style="line-height: 30px"></span>
									</div>
								</div>
							</form>
						</div>

						<div class="modal-footer" style="text-align: center">
							<button type="button" id="cancelDecorationInfoBtn" class="btn btn-default" data-dismiss="modal">取消</button>
						</div>
					</div>
				</div>
			</div>

		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/utils/paymentUtils.js', 'js/payment/materialPayment_pos.js']);
</script>
