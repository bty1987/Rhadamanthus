<div id="paymentActivity">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <div id="resultList" class="clearfix tab-pane active"></div>
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
        </div>
    </div>

    <div class="modal fade" id="updatePaymentActivityModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="paymentActivityModalDialog">款项活动</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="type">类型</label>
                            <div class="col-sm-9">
                                <select class="col-sm-6 inline" data-toggle="popover" data-trigger="manual" id="type"></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="activity">活动</label>
                            <div class="col-sm-9">
                                <select class="col-sm-6 inline" data-toggle="popover" data-trigger="manual" id="activity"></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="comment">备注</label>
                            <div class="col-sm-9">
                                <textarea id="comment" maxlength="128" class="col-xs-10 col-sm-6 v_required" rows="3" data-toggle="popover" data-trigger='manual'></textarea>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/payment/paymentActivity.js']);
</script>
