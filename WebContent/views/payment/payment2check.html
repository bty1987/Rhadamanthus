<div id="paymentContent">
	<div class="row">
		<div class="col-xs-12">
			<div class="tabbable">
				<ul class="nav nav-tabs" id="myTab">
					<li class="active">
						<a data-toggle="tab" href="#paymentListOver" id="paymentTab">已收款</a>
					</li>
					<li class="">
						<a data-toggle="tab" href="#paymentHistoryListOver" id="paymentHistoryTab">已确认</a>
					</li>
				</ul>
				<div class="tab-content">
					<div id="paymentListOver" class="tab-pane active">
						<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
					</div>

					<div id="paymentHistoryListOver" class="tab-pane">
						<div id="hcondList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="hresultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="hpagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="paymentCheckModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel">收款信息</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div style='color:red;text-align:center;display:none;' class='payWayError'>请选择付款方式</div>
						<div class="block clearfix pay_way">
							<label class="col-md-3 control-label" id="paymentMethod">付款方式</label>
							<label class="inline">
								<input type="checkbox" class="ace" id="cashCheckbox">
								<span class="lbl"> 现金</span>
							</label>
							<label class="inline">
								<input type="checkbox" class="ace" id="bankCheckbox">
								<span class="lbl"> 刷卡</span>
							</label>
							<label class="inline">
								<input type="checkbox" class="ace" id="checkvCheckbox">
								<span class="lbl"> 银行</span>
							</label>
						</div>
						<div class="space-4 "></div>

						<div class="form-group" id="paymentTypeDiv">
							<label class="col-sm-3 control-label no-padding-right" for="paymentTypeSel">预付款类型</label>
							<div class="col-sm-9">
								<select id="paymentTypeSel" class="col-xs-10 col-sm-5" style="min-width: 50%; width: 170px;">
									<option value='0'>合同预付款</option>
									<option value='2'>主材预付款</option>
								</select>
							</div>
						</div>
						<div class="space-4 "></div>

						<div class="form-group" id="refundSumBalanceDiv">
							<label for="refundSum" class="col-md-3 control-label">余额</label>
							<span class="col-md-9">
								<input type="text" id="refundSum" class="col-md-5 v_required v_float_3" disabled/>
							</span>
						</div>
						<div class="space-4 "></div>

						<div class="form-group" id="refundSumWithdrawDiv">
							<label for="refundSum" class="col-md-3 control-label">提现金额</label>
							<div class="col-md-9">
								<input type="text" id="refund" class="col-md-5 v_required v_float_3"/>
							</div>
						</div>
						<div class="space-4 "></div>

						<div class="form-group" >
							<label class="col-md-3 control-label no-padding-right" for="des" >说明</label>
							<div class="col-md-9">
								<textarea id="des" class="col-md-6 v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="256"></textarea>
							</div>
						</div>

						<div class="space-1" id="historyUpdateP">
							<h4 class="header blue bolder smaller">历史收款</h4>
							<span id="cashHistoryP" class="blue" style="font-size: 14px; margin-left: 20px;"></span><br/>
							<span id="bankHistoryP" class="blue" style="font-size: 14px; margin-left: 20px;"></span><br/>
							<span id="checkvHistoryP" class="blue" style="font-size: 14px; margin-left: 20px;"></span>
							<span id="installmentHistoryP" class="blue" style="font-size: 14px; margin-left: 20px;"></span><br/>
							<span id="accountsHistoryP" class="blue" style="font-size: 14px; margin-left: 20px;"></span>
						</div>

						<div id="cashDiv" referCheckbox="cashCheckbox">
							<h4 class="header blue bolder smaller">现金</h4>
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="paymentCheckcashInfo">类型</label>
								<div class="col-sm-9">
									<input type="text" id="paymentCheckcashInfo" class="col-xs-10 col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" />
								</div>
							</div>
							<div class="space-4"></div>

							<div class="form-group">
								<label for="cash" class="col-md-3 control-label">现金金额</label>
								<div class="col-sm-9">
									<input type="text" id="cash" class="col-xs-10 col-sm-5 v_required v_float_3"  data-toggle="popover" data-trigger='manual'/>
									<span style='height:34px; line-height:34px;'>&nbsp;元</span>
								</div>
							</div>
							<div class="space-4"></div>
						</div>

						<div id="posDiv" referCheckbox="bankCheckbox" style="display: none;">
							<h4 class="header blue bolder smaller">
								POS
							</h4>
							<div id="paymentCheckposDivGroup"></div>
						</div>

						<div id="bankDiv" referCheckbox="bankCheckbox" style='display: none'>
							<h4 class="header blue bolder smaller">
								POS
							</h4>
							<div id="paymentCheckbankDivGroup"></div>
						</div>

						<div id="checkvDiv" referCheckbox="checkvCheckbox" style="display: none;">
							<h4 class="header blue bolder smaller">
								银行
								<button id="paymentCheckcheckvAdd" class="btn btn-minier btn-success pull-right inline" num="0" maxnum="0">添加</button>
							</h4>
							<div id="paymentCheckcheckvDivGroup"></div>
						</div>
					</form>
				</div>

				<div class="modal-footer ">
					<button type="button" id="collectBtn" class="btn btn-primary">收款</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

</div>

<script type="text/javascript">
	$.loadScript(['js/utils/paymentUtils.js', 'js/payment/payment2check.js']);
</script>
