<div id="oalesPayment" class="col-md-12">
    <div class="row">
        <div id="oalesPaymentList">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>

        <div class="modal fade" id="collectModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="myModalLabels"></h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal" id="form">
                            <div class="block clearfix">
                                <label class="col-md-3 control-label" style="margin-top: -5px" data-i18n="page.payment.label.payMethod">付款方式</label>
                                <label class="hide cashCheckbox">
                                    <input type="checkbox" class="ace" id="cashCheckbox" key="cash" select="0">
                                    <span class="lbl" data-i18n="page.payment.label.cash"> 现金</span>
                                </label>
                                <label class="hide bankCheckbox">
                                    <input type="checkbox" class="ace" id="bankCheckbox" key="bank" select="0">
                                    <span class="lbl" data-i18n="page.payment.label.card"> 刷卡</span>
                                </label>
                                <label class="hide checkvCheckbox">
                                    <input type="checkbox" class="ace" id="checkvCheckbox" key="checkv" select="0">
                                    <span class="lbl" data-i18n="page.payment.label.bank"> 银行</span>
                                </label>
                            </div>

                            <div id="infoDiv">
                                <h4 class="header blue bolder smaller" data-i18n="page.payment.label.baseInfo">基本信息</h4>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right" for="referMoney" data-i18n="page.payment.label.receivable">应收金额</label>
                                    <div class="col-md-9">
                                        <input type="text" id="referMoney" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual' readonly/>
                                    </div>
                                </div>
                                <div class="space-4 "></div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right" for="collectDes">说明</label>
                                    <div class="col-md-9">
                                    <textarea id="collectDes" class="col-md-6 v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="40"></textarea>
                                    </div>
                                </div>
                                <div class="space-4 "></div>
                                
                                <div class="space-1" id="historyDiv">
                                    <h4 class="header blue bolder smaller" data-i18n="page.payment.label.historyCollect">历史收款</h4>
                                    <ul id="historyData"></ul>
                                </div>
                            </div>

                            <div id="cashDiv" name="top" referCheckbox="cashCheckbox"  style="display: none;">
                                <h4 class="header blue bolder smaller" data-i18n="page.payment.label.cash">现金</h4>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right" for="cashInfo">类型</label>
                                    <div class="col-md-9 block no-padding-right">
                                        <input type="text" id="cashInfo" class="col-xs-10 col-sm-6 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" />
                                    </div>
                                </div>
                                <div class="space-4"></div>

                                <div class="form-group">
                                    <label for="cash" class="col-sm-3 control-label no-padding-right" data-i18n="page.payment.label.cashAmount">现金金额</label>
                                    <span class="col-md-9 block no-padding-right">
                                        <input type="text" id="cash" class="col-xs-10 col-sm-6 v_float_3" data-toggle="popover" data-trigger='manual'/>
                                    </span>
                                </div>
                                <div class="space-4"></div>
                            </div>

                            <div id="posDiv" referCheckbox="bankCheckbox" style="display: none;">
                                <h4 class="header blue bolder smaller">POS</h4>
                                <div id="posGroup"></div>
                            </div>

                            <div id="bankDiv" referCheckbox="bankCheckbox" style="display: none;">
                                <h4 class="header blue bolder smaller">POS</h4>
                                <div id="bankGroup">
                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right">开户行</label>
                                        <div class="col-sm-8">
                                            <input class="col-xs-10 col-sm-6" type="text" id="bankName" data-toggle="popover" data-trigger="manual" data-placement="bottom" autocomplete="off">
                                            <button class="btn btn-minier btn-orange pull-right inline" id="createPaytran" data-i18n="page.payment.label.onlinePay">在线支付</button>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right" data-i18n="page.payment.label.cardAmount">刷卡金额</label>
                                        <div class="col-sm-8">
                                            <input class="col-sm-6" data-toggle="popover" data-trigger="manual" type="text" id="bank">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right" data-i18n="page.payment.label.method">方式</label>
                                        <div class="col-sm-8">
                                            <select class="col-sm-6 inline" data-toggle="popover" data-trigger="manual" id="posway"></select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="space-4"></div>

                                <div id="checkvDiv" referCheckbox="checkvCheckbox" style="display: none;">
                                    <h4 class="header blue bolder smaller" data-i18n="page.payment.label.bank">
                                                                                                                银行
                                        <button id="checkvAdd" class="btn btn-minier btn-success pull-right inline" num="0" maxnum="0">添加</button>
                                    </h4>
                                <div id="checkvGroup"></div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer ">
                        <button type="button" id="collectBtn" class="btn btn-primary" data-i18n="page.payment.label.collect">收款</button>
                        <button type="button" id="refundBtn" class="btn btn-danger" data-i18n="page.payment.label.refund">退款</button>
                        <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="oalesCodeQrcodeModal" tabindex="-1"></div>

<script type="text/javascript">
    $.loadScript(['js/utils/paymentUtils.js', 'js/payment/oalesPayment.js']);
</script>
