<div id="decorationPaymentContent" class="page-content">

	<div class="row">
		<div class="col-xs-12">
			<div class="tabbable">
				<ul class="nav nav-tabs" id="myTab">
					<li class="active">
						<a data-toggle="tab" href="#servicePaymentList" >服务收款</a>
					</li>
					<li class="">
						<a data-toggle="tab" href="#historyService" id="historyReduceSalaryTab">历史收款</a>
					</li>
				</ul>
				<div class="tab-content ">
					<div id="servicePaymentList" class="tab-pane active">
						<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
					</div>
					<div id="historyService" class="tab-pane">
						<div id="hcondList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="hresultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="hpagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
					</div>
				</div>
			</div>

			<div class="modal fade" id="baseItemModal" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
		      			<div class="modal-header">
		        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
		        			<h4 class="modal-title" id="myModalLabel">付款信息</h4>
		      			</div>
		      			<div class="modal-body">
		      				<form class="form-horizontal">
		      					<input type="text" id="decorationPaymentId" class="hide" />
		      					<div class="block clearfix">
									<label class="col-md-3 control-label" >付款方式</label>
									<label class="inline">
										<input type="checkbox" class="ace" id="cashCheckbox" key="cash" select="0">
										<span class="lbl"> 现金</span>
									</label>
									<label class="inline">
										<input type="checkbox" class="ace" id="bankCheckbox" key="bank" select="1">
										<span class="lbl"> 刷卡</span>
									</label>
									<label class="inline">
										<input type="checkbox" class="ace" id="checkvCheckbox" key="checkv" select="1">
										<span class="lbl"> 转账</span>
									</label>
								</div>
		
								<div id="infoDiv">
									<h4 class="header blue bolder smaller">基本信息</h4>
									<div class="form-group">
										<label class="col-md-3 control-label" for="referMoney">应收款</label>
										<div class="col-md-9">
											<input type="text" id="referMoney"class="col-xs-10 col-sm-6 v_required v_float" data-toggle="popover" data-trigger='manual' maxlength="8"/>
										</div>
									</div>
									<div class="form-group" id="serviceMoney" style="display: none">
										<label class="col-md-3 control-label" for="referMoney">剩余服务费</label>
										<div class="col-md-9">
											<input type="text" id="sMoney" class="col-xs-10 col-sm-6 v_required v_float" data-toggle="popover" data-trigger='manual' maxlength="8"/>
										</div>
									</div>
									<div class="space-4 "></div>
									<div class="form-group" >
										<label class="col-md-3 control-label no-padding-right" for="collectDes" >说明</label>
										<div class="col-md-9">
											<textarea id="collectDes" class="col-md-6 v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="40"></textarea>
										</div>
									</div>
									<div class="space-4 "></div>

									<div class="space-1" id="historyUpdateS">
										<h4 class="header blue bolder smaller">历史收款</h4>
										<span id="cashHistoryS" class="blue" style="font-size: 14px; margin-left: 20px;"></span><br/>
										<span id="bankHistoryS" class="blue" style="font-size: 14px; margin-left: 20px;"></span><br/>
										<span id="checkvHistoryS" class="blue" style="font-size: 14px; margin-left: 20px;"></span>
										<span id="installmentHistoryS" class="blue" style="font-size: 14px; margin-left: 20px;"></span><br/>
										<span id="accountsHistoryS" class="blue" style="font-size: 14px; margin-left: 20px;"></span>
									</div>
								</div>
								
			      				<div id="cashDiv" style="display: none;" referCheckbox="cashCheckbox">
			      					<h4 class="header blue bolder smaller">现金</h4>
			      					<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="servicecashInfo">类型</label>
										<div class="col-sm-9">
											<input type="text" id="servicecashInfo" class="col-xs-10 col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" />
										</div>
									</div>
									<div class="space-4"></div>
									
						      		<div class="form-group">
										<label for="cash" class="col-md-3 control-label no-padding-right">现金金额</label>
										<div class="col-md-9 block no-padding-right">
											<input type="text" id="cash" class="col-xs-10 col-sm-5 v_required v_float"  data-toggle="popover" data-trigger='manual' maxlength="8"/>
										</div>
									</div>
									<div class="space-4 "></div>
								</div>
								
								<div id="bankDiv" style="display: none;" referCheckbox="bankCheckbox">
									<h4 class="header blue bolder smaller">
										银行卡
										<button id="servicebankAdd" class="btn btn-minier btn-success pull-right inline" num="0" maxnum="0">添加</button>
									</h4>
									<div id="servicebankDivGroup"></div>
								</div>

								<div id="checkvDiv" style="display: none;" referCheckbox="checkvCheckbox">
									<h4 class="header blue bolder smaller">
										转账
										<button id="servicecheckvAdd" class="btn btn-minier btn-success pull-right inline" num="0" maxnum="0">添加</button>
									</h4>
									<div id="servicecheckvDivGroup"></div>
								</div>

							</form>
		      			</div>
		      			
						<div class="modal-footer ">
							<span id="paymentInfo" class="alert-danger pull-left inline"></span>
							<button type="button" id="collectBtn" class="btn btn-primary">收款</button>
				        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				      	</div>
		    		</div>
		  		</div>
		  	</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/utils/paymentUtils.js', 'js/payment/servicePayment.js']);
</script>
