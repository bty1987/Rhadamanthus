<div id="servicePayment" class="col-md-12">
	<div class="row">
		<div id="servicePaymentList">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>

		<div class="modal fade" id="collectModal" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
						<h4 class="modal-title" id="myModalLabel">付款信息</h4>
					</div>
					<div class="modal-body">
						<form class="form-horizontal">
							<input type="text" id="decorationPaymentId" class="hide" />
							<div class="block clearfix">
								<label class="col-md-3 control-label" >付款方式</label>
								<label class="hide cashCheckbox">
									<input type="checkbox" class="ace" id="cashCheckbox" key="cash" select="0">
									<span class="lbl"> 现金</span>
								</label>
								<label class="hide bankCheckbox">
									<input type="checkbox" class="ace" id="bankCheckbox" key="bank" select="1">
									<span class="lbl"> 刷卡</span>
								</label>
								<label class="hide checkvCheckbox">
									<input type="checkbox" class="ace" id="checkvCheckbox" key="checkv" select="1">
									<span class="lbl"> 银行</span>
								</label>
								<label class="hide advanceCheckbox">
									<input type="checkbox" class="ace" id="advanceCheckbox" key="advance" select="1">
									<span class="lbl"> 预付款</span>
								</label>
							</div>

							<div id="infoDiv">
								<h4 class="header blue bolder smaller">基本信息</h4>
								<div class="form-group">
									<label class="col-md-3 control-label" for="referMoney">应收款</label>
									<div class="col-md-9">
										<input type="text" id="referMoney" class="col-xs-10 col-sm-6 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
									</div>
								</div>
								<div class="form-group" id="serviceMoneyDiv" style="display: none">
									<label class="col-md-3 control-label" for="serviceMoney">剩余服务费</label>
									<div class="col-md-9">
										<input type="text" id="serviceMoney" class="col-xs-10 col-sm-6 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
									</div>
								</div>
								<div class="space-4 "></div>
								<div class="form-group" >
									<label class="col-md-3 control-label no-padding-right" for="comment" >说明</label>
									<div class="col-md-9">
										<textarea id="comment" class="col-md-6 v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="40"></textarea>
									</div>
								</div>
								<div class="space-4 "></div>

								<div class="space-1" id="historyDiv">
									<h4 class="header blue bolder smaller">历史收款</h4>
									<ul id="historyData"></ul>
								</div>
							</div>

							<div id="cashDiv" style="display: none;" referCheckbox="cashCheckbox">
								<h4 class="header blue bolder smaller">现金</h4>
								<div class="form-group">
									<label class="col-sm-3 control-label no-padding-right" for="cashInfo">类型</label>
									<div class="col-sm-9">
										<input type="text" id="cashInfo" class="col-xs-10 col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" />
									</div>
								</div>
								<div class="space-4"></div>

								<div class="form-group">
									<label for="cash" class="col-md-3 control-label no-padding-right">现金金额</label>
									<div class="col-md-9 block no-padding-right">
										<input type="text" id="cash" class="col-xs-10 col-sm-5 v_required v_float_3"  data-toggle="popover" data-trigger='manual' maxlength="8"/>
									</div>
								</div>
								<div class="space-4 "></div>
							</div>

							<div id="posDiv" referCheckbox="bankCheckbox" style="display: none;">
								<h4 class="header blue bolder smaller">POS</h4>
								<div id="posGroup"></div>
							</div>

							<div id="bankDiv" style="display: none;" referCheckbox="bankCheckbox">
								<h4 class="header blue bolder smaller">POS</h4>
								<div id="bankGroup">
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right">开户行</label>
										<div class="col-sm-8">
											<input class="col-xs-10 col-sm-6" type="text" id="bankName" data-toggle="popover" data-trigger="manual" data-placement="bottom" autocomplete="off">
											<button class="btn btn-minier btn-orange pull-right inline" id="posSend">POS推送</button>
										</div>
									</div>
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right">刷卡金额</label>
										<div class="col-sm-8">
											<input class="col-sm-6" data-toggle="popover" data-trigger="manual" type="text" id="bank">
										</div>
									</div>
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right">方式</label>
										<div class="col-sm-8">
											<select class="col-sm-6 inline" data-toggle="popover" data-trigger="manual" id="posway"></select>
										</div>
									</div>
								</div>
							</div>

							<div id="checkvDiv" style="display: none;" referCheckbox="checkvCheckbox">
								<h4 class="header blue bolder smaller">
									银行
									<button id="checkvAdd" class="btn btn-minier btn-success pull-right inline" num="0" maxnum="0">添加</button>
								</h4>
								<div id="checkvGroup"></div>
							</div>

							<div id="advanceDiv" style="display: none;" referCheckbox="advanceCheckbox">
								<h4 class="header blue bolder smaller">预付款</h4>
								<div class="form-group">
									<label class="col-sm-3 control-label no-padding-right" for="advanceType">类型</label>
									<div class="col-sm-7">
										<select id="advanceType" class="col-xs-10 col-sm-5 v_required " data-toggle="popover" style="min-width: 50%; width: 170px;" data-trigger='manual'></select>
									</div>
								</div>
								<div class="space-4"></div>
								<div class="form-group">
									<label class="col-sm-3 control-label no-padding-right" for="recharge" >合同余额</label>
									<div class="col-sm-9">
										<input type="text" id="recharge" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual' >
									</div>
								</div>

								<div class="form-group">
									<label for="advance" class="col-md-3 control-label">金额</label>
									<div class="col-md-9 block no-padding-right  ">
										<input type="text" id="advance" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
									</div>
								</div>
							</div>

						</form>
					</div>
		      			
					<div class="modal-footer ">
						<button type="button" id="collectBtn" class="btn btn-primary">收款</button>
						<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/utils/paymentUtils.js', 'js/payment/servicePayment.js']);
</script>
