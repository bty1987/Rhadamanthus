<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="serviceCondList" class="fl_search clearfix"></div>
            <div id="serviceResultList" class="clearfix tab-pane active"></div>
            <div id="servicePagenation" class="fl-page-wrap clearfix"></div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-xs-12">
        <div class="row" style="margin-left:10px;margin-right:10px">
            <div id="constructionPlans"></div>
            <div>
                <div>
                    <a class="btn btn-minier btn-info pull-left" id="addBtn" style="margin-top: 7px;margin-left: 2px">
                        <i class="icon-plus bigger-110"></i>
                        <span>添加</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addServicePriceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="villageDialog">添加服务费</h4>
            </div>

            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal">

                            <div class="form-group default">
                                <div class="col-xs-12" id="servicePriceList" ></div>
                            </div>

                            <div class="form-group default">
                                <label class="col-sm-3 control-label no-padding-right" for="supplier">名称</label>
                                <div class="col-sm-9">
                                    <input type="text" id="name" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' />
                                </div>
                            </div>
                            <div class="form-group default">
                                <label class="col-sm-3 control-label no-padding-right" for="supplier">开始时间</label>
                                <div class="col-sm-9">
                                    <input type="text" id="startDate" class="col-xs-10 col-sm-6 date-picker-date v_required" data-date-format="yyyy-mm-dd">                                    
                                </div>
                            </div>

                            <div class="form-group default">
                                <label class="col-sm-3 control-label no-padding-right" for="supplier">结束时间</label>
                                <div class="col-sm-9">
                                    <input type="text" id="reportedDate" class="col-xs-10 col-sm-6 date-picker-date v_required" data-date-format="yyyy-mm-dd">                                    
                                </div>
                            </div>

                            <div class="form-group default">
                                <label class="col-sm-3 control-label no-padding-right" for="supplier">最大金额</label>
                                <div class="col-sm-9">
                                    <input type="text" id="maxAmount" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' />
                                </div>
                            </div>
                            <div class="space-4"></div>

                            <div class="form-group default">
                                <label class="col-sm-3 control-label no-padding-right" for="category">最小金额</label>
                                <div class="col-sm-9">
                                    <input type="text" id="minAmount" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' />
                                </div>
                            </div>
                            <div class="space-4"></div>

                            <div class="form-group default">
                                <label class="col-sm-3 control-label no-padding-right" for="category">超额服务费</label>
                                <div class="col-sm-9">
                                    <input type="text" id="serviceCharge" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' />
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="servicePriceSubmitBtn" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $.loadScript(['js/personnel/supplierContractService.js']);
</script>
