<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addItemDialog">职位信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <input type="text" id="did" class="hide"/>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="dutyName">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="dutyName" class="col-xs-10 col-sm-5 v_required"
                                       data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="dutyCode">编号</label>
                            <div class="col-sm-9">
                                <input type="text" id="dutyCode" class="col-xs-10 col-sm-5"
                                       placeholder="留空自动生成（如：D001）" data-i18n-ph="page.personnel.ph.empNoAuto"
                                       data-toggle="popover" data-trigger='manual' maxlength="32"/>
                                <span class="help-inline" style="margin-left: 5px; color: #999;">
                                    <i class="icon-info-sign"></i> 留空自动生成，或手动输入自定义编号
                                </span>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="lead">领导标识</label>
                            <div class="col-sm-9">
                                <select maxlength="64" id="lead" class="col-xs-10 col-sm-5  v_required" data-toggle="popover" data-trigger='manual'>
                                    <option value="0">职员</option>
                                    <option value="1">领导</option>
                                </select>
                            </div>
                        </div>

                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="depttype">所属部门</label>
                            <div class="col-sm-9">
                                <select id="depttype" class="col-xs-10 col-sm-5 v_required" data-toggle="popover"data-trigger='manual'></select>
                            </div>
                        </div>

                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveAddItemBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelAddItemBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="layerPopUp" class="portlet box page-content"></div> <!-- 弹窗 -->
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/kingdeeUtils.js', 'js/personnel/duty.js']);
</script>
