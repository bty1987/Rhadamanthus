
<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addplanModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addItemDialog">人员信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="type">类型:</label>
                            <div class="col-sm-9">
                                <select id="type" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' style="width: 200px">
                                    <option value="0">招聘</option>
                                    <option value="1">培训</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <div>
                                <label class="col-sm-3 control-label no-padding-right" for="backVisitContent">需求内容:</label>
                            </div>
                            <div>
                                <textarea id="backVisitContent" class="form-control v_name v_required" rows="3" data-toggle="popover" data-trigger="manual" maxlength="128" style="width: 205px" style="height: 27px"></textarea>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="addplanBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelplanBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>
