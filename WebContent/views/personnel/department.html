<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="deptModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span>
						<span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" >部门或大区</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group" id="ndeptId">
							<label class="col-sm-3 control-label no-padding-right orange" for="deptId">部门编号</label>
							<div class="col-sm-9">
								<input type="text" maxlength="10" id="deptId" class="col-xs-10 col-sm-6 " readonly="readonly"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="deptName">部门名称</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="deptName" class="col-xs-10 col-sm-6 v_name v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="deptype">部门类型</label>
							<div class="col-sm-9">
								<select id="deptype" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="fatherdept">所属分区</label>
							<div class="col-sm-9">
								<select id="fatherdept" class="col-xs-10 col-sm-6 " data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kino">金蝶编号</label>
							<div class="col-sm-9">
								<input type="text" id="kino" class="col-xs-10 col-sm-6 v_required" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kiname">金蝶名称</label>
							<div class="col-sm-9">
								<input type="text" id="kiname" class="col-xs-10 col-sm-6 v_required" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label for="manager" class="col-sm-3 control-label no-padding-right">管理人员</label>
							<div class="col-md-9">
								<input type="text" id="manager" class="col-xs-10 col-sm-6 v_required v_typeahead" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="isdet">是否定岗</label>
							<div class="col-sm-9">
								<select id="isdet" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'>
									<option value = '0'>开放</option>
									<option value = '1'>定岗</option>
								</select>
							</div>
						</div>
						
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="des">描述</label>
							<div class="col-sm-9">
								<textarea id="des" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
	
<div id="layersPopUp" class="portlet box page-content"></div> <!-- 弹窗 -->
</div>
	
<script type="text/javascript">
	$.loadScript(['js/personnel/department.js']);
</script>
