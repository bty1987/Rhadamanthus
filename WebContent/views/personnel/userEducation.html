<div >
    <div id="fl-statement"><div class="page-header"><h1>人事-权配<small><i class="icon-double-angle-right"></i>相关教育信息</small></h1></div></div>

    <div class="row">
			
		<div class="col-md-12">
			<div id="list"></div>
			<div style="margin-top: 10px">
                <div>
                    <a id="addBtn" class="btn btn-minier btn-primary pull-left" style="margin-right: 10px">
                        <i class="icon-plus bigger-110"></i>
                        <span>添加</span>
                    </a>
                </div>
            </div>
		</div>
	</div>

	<div class="modal fade" id="addEducationModal" tabindex="-1">
	        <div class="modal-dialog">
	            <div class="modal-content">
	                <div class="modal-header">
	                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
	                    <h4 class="modal-title" id="aid">教育信息</h4>
	                </div>
	                <div class="modal-body">
	                    <div class="row">
	                        <div class="col-xs-12">
	                            <form class="form-horizontal">
	                                <div class="row">
	                                    <div class="col-md-12">
	
	                                        <div class="form-group">
	                                            <label for="organ" class="col-sm-3 control-label no-padding-right">机构</label>
	                                            <div class="col-md-9">
	                                                <input type="text" id="organ" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
	                                            </div>
	                                        </div>
	
	                                        <div class="form-group">
	                                            <label for="certificate" class="col-sm-3 control-label no-padding-right">证书</label>
	                                            <div class="col-sm-9">
	                                                 <input type="text" id="certificate" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
	                                            </div>
	                                        </div>
	                                        
	                                        <div class="form-group">
	                                            <label for="specialty" class="col-sm-3 control-label no-padding-right" data-i18n="page.personnel.label.major">专业</label>
	                                            <div class="col-sm-9">
	                                                 <input type="text" id="specialty" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
	                                            </div>
	                                        </div>
	                                        
	                                        <div class="form-group">
	                                            <label for="beginTime" class="col-sm-3 control-label no-padding-right">开始时间</label>
	                                            <div class="col-sm-9">
	                                                <input class="col-xs-10 col-sm-6 v_required"  id="beginTime" type="text" data-date-format="yyyy-mm-dd">
	                                            </div>
	                                        </div>
	                                        
	                                        <div class="form-group">
	                                            <label for="endTime" class="col-sm-3 control-label no-padding-right">结束时间</label>
	                                            <div class="col-sm-9">
	                                                <input class="col-xs-10 col-sm-6 v_required"  id="endTime" type="text" data-date-format="yyyy-mm-dd">
	                                            </div>
	                                        </div>
	                                        
	                                        <div class="form-group">
	                                            <label for="content" class="col-sm-3 control-label no-padding-right">内容</label>
	                                            <div class="col-sm-9">
	                                                <textarea rows="4" cols="" class="col-xs-10 col-sm-6" id="content"></textarea>
	                                            </div>
	                                        </div>
	                                    </div>
	                                </div>
	                            </form>
	                        </div>
	                    </div>
	                </div>
	            <div class="modal-footer" style="text-align: center">
	                <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
	                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
	            </div>
	        </div>
	    </div>
	</div>
	
</div>



<script type="text/javascript">
    $.loadScript(['js/personnel/userEducation.js']);
</script>
