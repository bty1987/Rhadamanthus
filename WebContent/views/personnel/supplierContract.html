<div class="modal fade" id="addContractModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="aid">合同</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal">
                            <div class="row">
                                <div class="col-md-12">

                                    <div class="form-group">
                                        <label for="name" class="col-sm-3 control-label no-padding-right">名称</label>
                                        <div class="col-md-9">
                                            <input type="text" id="name" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual' />
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="contractTemplate" class="col-sm-3 control-label no-padding-right orange">合同模板</label>
                                        <div class="col-md-9">
                                            <select class="col-xs-10 col-sm-6 v_required" id="contractTemplate"></select>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="comment" class="col-sm-3 control-label no-padding-right">说明</label>
                                        <div class="col-sm-9">
                                            <textarea rows="4" cols="" class="col-xs-10 col-sm-6" id="comment"></textarea>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="text-align: center">
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="userContractModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span> <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">印章</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">选择印章:</label>
                        <div class="col-sm-9">
                            <select id='signet' class='col-xs-10 col-sm-6'></select>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="signBtn" class="btn btn-primary">提交</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>
