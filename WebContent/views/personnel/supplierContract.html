    <div class="widget-container-span col-xs-6 col-md-3" id="userInfo"></div>

    <div id="function" class="widget-container-span col-xs-6 col-md-3">
        <a href="#" id="registUser" class="btn btn-default btn-app btn-sm radius-4" style="padding: 5px 0;">

        </a>

        <a href="#" id="confirmUser" class="btn btn-yellow btn-app btn-sm radius-4" style="padding: 5px 0;">
            <i class="icon-exclamation-sign bigger-230"></i>
            <span>确认</span>
        </a>

        <a href="#" id="resetUser" class="btn btn-yellow btn-app btn-sm radius-4 hide" style="padding: 5px 0;">
            <i class="icon-circle-blank bigger-230"></i>
            <span>重置</span>
        </a>
    </div>

    <div id="add" class="widget-container-span col-xs-6 col-md-3">

        <a href="#" id="addContractBtn" class="btn btn-default btn-app btn-sm radius-4" style="padding: 5px 0;">

            <span>添加合同</span>
        </a>

        <a href="#" id="backBtn" class="btn btn-info btn-app btn-sm radius-4" style="padding: 5px 0;">

<div class="widget-container-span col-md-12">
    <div class="widget-box transparent">
        <div id="fl-statement2" class=""></div>
    </div>

    <div class="" id="contracts"></div>
</div>

<div class="modal fade" id="addContractModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="aid">合同</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                  <div class="col-xs-12">
                      <form class="form-horizontal">
                          <div class="row">
                              <div class="col-md-12">
                
                                  <div class="form-group">
                                      <label for="name" class="col-sm-3 control-label no-padding-right">名称</label>
                                      <div class="col-md-9">
                                          <input type="text" id="name" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
                                      </div>
                                  </div>

                                  <div class="form-group">
                                    <label for="contractTemplate" class="col-sm-3 control-label no-padding-right orange">合同模板</label>
                                    <div class="col-md-9">
                                        <select class="col-xs-10 col-sm-6 v_required" id="contractTemplate" ></select>
                                    </div>
                                </div>

                                  <div class="form-group">
                                      <label for="signTime" class="col-sm-3 control-label no-padding-right">签订时间</label>
                                      <div class="col-sm-9">
                                          <input class="col-xs-10 col-sm-6 v_required"  id="signTime" type="text" data-date-format="yyyy-mm-dd">
                                      </div>
                                  </div>
                
                                  <div class="form-group">
                                      <label for="startTime" class="col-sm-3 control-label no-padding-right">开始时间</label>
                                      <div class="col-sm-9">
                                          <input class="col-xs-10 col-sm-6 v_required"  id="startTime" type="text" data-date-format="yyyy-mm-dd">
                                      </div>
                                  </div>
                
                                  <div class="form-group">
                                      <label for="endTime" class="col-sm-3 control-label no-padding-right">结束时间</label>
                                      <div class="col-sm-9">
                                          <input class="col-xs-10 col-sm-6 v_required"  id="endTime" type="text" data-date-format="yyyy-mm-dd">
                                      </div>
                                  </div>
                
                                  <div class="form-group">
                                      <label class="col-sm-3 control-label no-padding-right ">状态</label>
                                      <div class="col-md-9">
                                          <select id="status" class="col-xs-10 col-sm-6"></select>
                                      </div>
                                  </div>
                
                                  <div class="form-group">
                                      <label for="comment" class="col-sm-3 control-label no-padding-right">说明</label>
                                      <div class="col-sm-9">
                                          <textarea rows="4" cols="" class="col-xs-10 col-sm-6" id="comment"></textarea>
                                      </div>
                                  </div>
                
                              </div>
                          </div>
                      </form>
                  </div>
                </div>
            </div>
            <div class="modal-footer" style="text-align: center">
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                 <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="userContractModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                    <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">印章</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">选择印章:</label>
                        <div class="col-sm-9">
                            <select id='signet' class='col-xs-10 col-sm-6'></select>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="signBtn" class="btn btn-primary">提交</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

    </div>
</div>
