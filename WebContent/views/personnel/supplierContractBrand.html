<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div>
			<div id="resultList" class="clearfix tab-pane active"></div>
			<div id="pagenation" class="fl-page-wrap clearfix"></div>
		</div>
	</div>
</div>

<div class="modal fade" id="addSupplierAddBrandModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span>&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="villageDialog">添加品牌</h4>
			</div>

			<div class="modal-body">
				<div class="row">
					<div class="col-xs-12">
						<form class="form-horizontal">
							<div class="form-group default">
								<label class="col-sm-3 control-label no-padding-right"
									for="supplier">品牌</label>
								<div class="col-sm-9">
									<input type="text" id="brandName" maxlength="12"
										class="col-xs-10 col-sm-6 v_required" data-toggle="popover"
										data-trigger='manual' />
								</div>
							</div>
							<div class="form-group default">
								<label class="col-sm-3 control-label no-padding-right"
									for="name">结算类型</label>
								<div class="col-sm-9">
									<select id="ctype" class="col-xs-10 col-sm-6 v_required"
										data-toggle="popover" data-trigger='manual'>
									</select>

								</div>
							</div>
							<div class="space-4"></div>

							<div class="form-group default">
								<label class="col-sm-3 control-label no-padding-right"
									for="supplier">结算值</label>
								<div class="col-sm-9">
									<input type="text" id="cvalue" class="col-xs-10 col-sm-6"
										data-toggle="popover" data-trigger='manual' />
								</div>
							</div>
							<div class="space-4"></div>

							<div class="form-group default">
								<label class="col-sm-3 control-label no-padding-right"
									for="category">违约金</label>
								<div class="col-sm-9">
									<input type="text" id="breakpay" class="col-xs-10 col-sm-6"
										data-toggle="popover" data-trigger='manual' />
								</div>
							</div>

						</form>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" id="submitBtn" class="btn btn-primary">保存</button>
			</div>
		</div>
	</div>
</div>
<script type="text/javascript">
    $.loadScript(['js/personnel/supplierContractBrand.js']);
</script>
