<div class="row">
    <div class="col-xs-12">
        <div class="timeline-items">
            <div class="timeline-item clearfix">
                <div class="widget-box transparent" style="margin:0px;border-left:0px ">
                    <div class="widget-header widget-header-small" style="background-color: white">
                        <h5 class="smaller" style="font-size: 15px; ">招聘人员信息</h5>
                        <span class="widget-toolbar " style="float:initial ;position: initial">
                             <a href="#" data-action="collapse">
                                 <i class="icon-chevron-up"></i>
                             </a>
                        </span>
                    </div>

                    <div class="widget-body">
                        <div class="widget-body-inner"  style="display: block; background-color: white !important;">
                            <div class="widget-main" >
                                <form class="form-horizontal" id="recruitmentFrom">
                                    <div class="form-group col-sm-6">
                                        <label class="col-sm-4 control-label no-padding-right orange">姓名</label>
                                        <div class="col-sm-8">
                                            <span type="text" maxlength="32" id="name"></span>
                                        </div>
                                    </div>

                                     <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right orange">身份证号</label>
                                        <div class="col-sm-8">
                                            <span type="text" maxlength="32" id="identity"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">民族</label>
                                        <div class="col-sm-8">
                                            <span type="text" maxlength="3" id="nation"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">体重</label>
                                        <div class="col-sm-8">
                                            <span type="text" maxlength="3" id="weight"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">身高</label>
                                        <div class="col-sm-8">
                                            <span type="text" maxlength="50" id="height"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">应聘方式</label>
                                        <div class="col-sm-8">
                                            <span  type="checkbox"  id="employWay"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">户口类型</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="householdType"></span>
                                        </div>
                                    </div >

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right ">政治面貌</label>
                                        <div class="col-sm-8">
                                            <span type="text"  id="political"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right orange">学历</label>
                                        <div class="col-sm-8">
                                            <span id="education" type="text"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right orange">电话</label>
                                        <div class="col-sm-8">
                                            <span type="text" maxlength="21" id="phone"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right ">微信号</label>
                                        <div class="col-sm-8">
                                            <span type="text" id="wechat"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right ">QQ号</label>
                                        <div class="col-sm-8">
                                            <span type="text" maxlength="128" id="qq"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right orange">现住址</label>
                                        <div class="col-sm-8">
                                            <span type="text" maxlength="128" id="address"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right orange">籍贯</label>
                                        <div class="col-sm-8">
                                            <span type="text" maxlength="32" id="nativePlace"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right orange">户籍地</label>
                                        <div class="col-sm-8">
                                            <span type="text" maxlength="128" id="hometownPlace"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right orange">专业</label>
                                        <div class="col-sm-8">
                                            <span type="text" id="specialty"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right orange">紧急联系人</label>
                                        <div class="col-sm-8">
                                            <span id="emergencyMan"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right orange">紧急联系人电话</label>
                                        <div class="col-sm-8">
                                            <span type="text" id="emergencyPhone"></span>
                                        </div>
                                    </div>
                                    

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">婚姻状况</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isMarried"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">生育状况</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isBirth"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否有独立住房</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isHouse"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否有独立车辆</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isCar"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否有房贷</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isHouseLoan"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否有车贷</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isCarLoan"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否有驾照</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isCarID"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否有护照</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isPassID"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否有港澳通行证</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isHMID"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否有台湾通行证</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isTWID"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否与原单位签订劳动合同</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isContract"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否已缴纳社会保险</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isSnsurance"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否已经与其它单位解除了劳动关系</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isFire"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否缴纳其他商业保险</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isCnsurance"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">现在是否还在竟业限制期内</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isCompete"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">公司提供培训机会时，是否同意并签订协议</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isTrain"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否曾有前科劣迹、行政/邢事拘留等经历</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isCriminal"></span>
                                        </div>
                                    </div>

                                    <div class="form-group col-sm-6" >
                                        <label class="col-sm-4 control-label no-padding-right">是否患有精神系统疾病、传染性疾病、家族遗传病史、既往重病史</label>
                                        <div class="col-sm-8">
                                            <span type="checkbox" id="isDisease"></span>
                                        </div>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/personnel/selectRecruitment.js']);
</script>
