<div >
    <div id="fl-statement"><div class="page-header"><h1>人事-权配<small><i class="icon-double-angle-right"></i>相关工作信息</small></h1></div></div>

    <div class="row">
			
		<div class="col-md-12">
			<div id="list"></div>
			<div style="margin-top: 10px">
                <div>
                    <a id="addBtn" class="btn btn-minier btn-primary pull-left" style="margin-right: 10px">
                        <i class="icon-plus bigger-110"></i>
                        <span>添加</span>
                    </a>
                </div>
            </div>
		</div>
	</div>

	<div class="modal fade" id="addOperationModal" tabindex="-1">
	        <div class="modal-dialog">
	            <div class="modal-content">
	                <div class="modal-header">
	                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
	                    <h4 class="modal-title" id="aid">工作信息</h4>
	                </div>
	                <div class="modal-body">
	                    <div class="row">
	                        <div class="col-xs-12">
	                            <form class="form-horizontal">
	                                <div class="row">
	                                    <div class="col-md-12">
	
	                                        <div class="form-group">
	                                            <label for="company" class="col-sm-3 control-label no-padding-right">公司</label>
	                                            <div class="col-md-9">
	                                                <input type="text" id="company" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
	                                            </div>
	                                        </div>
	
	                                        <div class="form-group">
	                                            <label for="trade" class="col-sm-3 control-label no-padding-right">行业</label>
	                                            <div class="col-sm-9">
	                                                 <input type="text" id="trade" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
	                                            </div>
	                                        </div>
	                                        
	                                        <div class="form-group">
	                                            <label for="duty" class="col-sm-3 control-label no-padding-right">职位</label>
	                                            <div class="col-sm-9">
	                                                 <input type="text" id="duty" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
	                                            </div>
	                                        </div>
	                                        
	                                        <div class="form-group">
	                                            <label for="beginTime" class="col-sm-3 control-label no-padding-right">开始时间</label>
	                                            <div class="col-sm-9">
	                                                <input class="col-xs-10 col-sm-6"  id="beginTime" type="text" data-date-format="yyyy-mm-dd">
	                                            </div>
	                                        </div>
	                                        
	                                        <div class="form-group">
	                                            <label for="endTime" class="col-sm-3 control-label no-padding-right">结束时间</label>
	                                            <div class="col-sm-9">
	                                                <input class="col-xs-10 col-sm-6"  id="endTime" type="text" data-date-format="yyyy-mm-dd">
	                                            </div>
	                                        </div>

	                                        <div class="form-group">
	                                            <label for="salary" class="col-sm-3 control-label no-padding-right">薪资</label>
	                                            <div class="col-sm-9">
	                                                 <input type="text" id="salary" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
	                                            </div>
	                                        </div>
	                                        
	                                        <div class="form-group">
	                                            <label for="comment" class="col-sm-3 control-label no-padding-right">描述</label>
	                                            <div class="col-sm-9">
	                                                <textarea rows="4" cols="" class="col-xs-10 col-sm-6" id="comment"></textarea>
	                                            </div>
	                                        </div>
	                                    </div>
	                                </div>
	                            </form>
	                        </div>
	                    </div>
	                </div>
	            <div class="modal-footer" style="text-align: center">
	                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
	                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
	            </div>
	        </div>
	    </div>
	</div>
	
</div>



<script type="text/javascript">
    $.loadScript(['js/personnel/recruitmentOperation.js']);
</script>
