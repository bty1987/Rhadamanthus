<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
</div>

<div class="modal fade" id="userAdvanceModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
     		<div class="modal-header">
       			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
       			<h4 class="modal-title">员工信息配置</h4>
     		</div>
     		<div class="modal-body">
	      		<form class="form-horizontal">
	      		
	      			<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="isLogin">可否登陆系统</label>
						<div class="col-sm-9">
							<input type="checkbox" id="isLogin" />
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="extranet">外网权限</label>
						<div class="col-sm-9">
							<input type="checkbox" id="extranet" />
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="roleSel">角色</label>
						<div class="col-sm-9">
							<select class="col-sm-7 col-xs-10 v_required" id="roleSel" data-toggle="popover" data-trigger='manual'></select>
						</div>
					</div>
					<div class="space-4"></div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="oldcompany">现在公司</label>
						<div class="col-sm-9">
							<input type="text"  id="oldcompany" class="col-sm-7 col-xs-10 v_required" data-toggle="popover" readonly="readonly" data-trigger='manual'/>
						</div>
					</div>

					<div class="space-4"></div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="company">公司修改为</label>
						<div class="col-sm-9">
							<select class="col-sm-7 col-xs-10 v_required" id="company" data-toggle="popover" data-trigger='manual' ></select>
						</div>
					</div>
					<div class="space-4"></div>
				</form>
     		</div>
			<div class="modal-footer">
				<button type="button" id="advanceSaveBtn" class="btn btn-primary">提交</button>
	        	<button type="button" id="advanceCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
	      	</div>
   		</div>
	</div>
</div>


<div class="modal fade" id="moduleModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title">权限配置</h4>
			</div>
			<div class="modal-body">

			</div>

			<div class="modal-footer ">
				<button type="button" name="saveBtn" class="btn btn-primary">保存</button>
				<button type="button" name="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="companyModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">

			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title">公司权限配置</h4>
			</div>

			<div class="modal-body">
				<form class="form-horizontal">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="currentcompany">现有公司权限</label>
						<div class="col-sm-9">
							<div class="tags" style="border: 0px" id="currentcompany"></div>
						</div>
					</div>
					<div class="space-4"></div>
					<div class="form-group" >
						<label class="col-sm-3 control-label no-padding-right" for="companyse">公司</label>
						<div class="col-sm-9">
							<select multiple="multiple" class="col-sm-7 col-xs-10 chosen-select tag-input-style v_required" id="companyse" data-placeholder="..." data-toggle="popover" data-trigger='manual'></select>
						</div>
					</div>
                 </form>
			</div>

			<div class="modal-footer ">
				<button type="button" name="saveCompanyBtn" class="btn btn-primary">保存</button>
				<button type="button" name="cancelCompanyBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>

		</div>
	</div>
</div>
