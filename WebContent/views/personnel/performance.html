<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
</div>

<div class="modal fade" id="performanceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="addItemDialog">绩效信息</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">

                    <div class="form-group">
                        <label for="users" class="col-sm-3 control-label no-padding-right">员工</label>
                        <div class="col-sm-9">
                            <input class=" col-md-5 v_typeahead v_required" type="text" id="users"  data-toggle="popover" data-placement="bottom" data-trigger='manual'></input>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="performanceType">绩效类型</label>
                        <div class="col-sm-9">
                            <select class="col-xs-10 col-sm-6 v_type v_required" id="performanceType">
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="performanceLevel">等级</label>
                        <div class="col-sm-9">
                            <select class="col-xs-10 col-sm-6 v_type v_required" id="performanceLevel">
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="startTime">开始时间</label>
                        <div class="col-sm-9">
                            <div class="input-group col-xs-10 col-sm-7 no-padding v_required" data-for="endTime" data-toggle="popover" data-trigger='manual'>
                                <input class="form-control date-picker-date" id="startTime" type="text" data-date-format="yyyy-mm-dd">
									<span class="input-group-addon">
										<i class="icon-calendar bigger-110"></i>
									</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="endTime">结束时间</label>
                        <div class="col-sm-9">
                            <div class="input-group col-xs-10 col-sm-7 no-padding v_required" data-for="endTime" data-toggle="popover" data-trigger='manual'>
                                <input class="form-control date-picker-date" id="endTime" type="text" data-date-format="yyyy-mm-dd">
									<span class="input-group-addon">
										<i class="icon-calendar bigger-110"></i>
									</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="work">工作</label>
                        <div class="col-sm-8">
                            <input type="text" class="col-xs-8 m-wrap v_required" maxlength="11" id="work">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="values">得分</label>
                        <div class="col-sm-8">
                            <input type="text" class="col-xs-8 m-wrap v_number v_required" maxlength="11" id="values">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="content">说明</label>
                        <div class="col-sm-8">
                            <input type="text" class="col-xs-8 m-wrap" maxlength="11" id="content">
                        </div>
                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/personnel/performance.js'])
</script>
