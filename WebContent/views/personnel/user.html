<!--人事-员工-->
<div class="page-content" id="decorationOrderPageContent">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	<div class="modal fade" id="qrcodeModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" >员工二维码</h4>
				</div>
				<div class="modal-body">
					<div class="qrcode" id="Qrcode" style="border: 0px;">
					</div>
				</div>
				<div class="modal-footer">
					<button type="button"  class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="importModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title">导入</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<div class="col-sm-12" id="import"></div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

</div>

<div class="modal fade" id="ddModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content col-md-12">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span id="closeM">&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="functionAreaDialog">部门</h4>
			</div>
			<div class="modal-body">
				<div id="tree3" class="tree"></i><!--这个tree显示的是蓝色小加号-->
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" id="savebtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancel" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="userExpModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content col-md-12">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span id="closeMo">&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="userEx">在本公司的工作经历</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal">
					<div class="form-group">
						<div class="col-sm-12" id="userException"></div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="cancelExp" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>
