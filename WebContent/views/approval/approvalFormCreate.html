<div class="row">
    <div class="col-xs-12">

        <!-- 表单元信息 -->
        <form class="form-horizontal" id="formForm">
            <div class="form-group">
                <label class="col-sm-2 control-label no-padding-right orange" for="code">表单编码</label>
                <div class="col-sm-4">
                    <input type="text" id="code" class="col-xs-12 v_required" maxlength="64" placeholder="如 DECORATION_CONTRACT_FORM" />
                </div>
                <label class="col-sm-2 control-label no-padding-right orange" for="name">表单名称</label>
                <div class="col-sm-4">
                    <input type="text" id="name" class="col-xs-12 v_required" maxlength="100" />
                </div>
            </div>
            <div class="space-4"></div>

            <div class="form-group">
                <label class="col-sm-2 control-label no-padding-right" for="flowId">关联流程</label>
                <div class="col-sm-4">
                    <select id="flowId" class="col-xs-12"><option value="">不关联</option></select>
                </div>
                <label class="col-sm-2 control-label no-padding-right" for="comment">说明</label>
                <div class="col-sm-4">
                    <input type="text" id="comment" class="col-xs-12" maxlength="255" />
                </div>
            </div>
        </form>

        <div class="hr hr-dotted"></div>

        <!-- 表单设计器:左控件库 + 中预览 + 右属性 -->
        <div class="row" style="min-height: 400px;">

            <!-- 左侧:控件库 -->
            <div class="col-xs-3" style="border-right: 1px solid #e0e0e0; min-height: 400px;">
                <h5 class="header lighter blue"><i class="icon-th"></i> 控件库</h5>
                <p class="muted small">点击添加到表单</p>
                <div id="controlLib" class="clearfix"></div>
            </div>

            <!-- 中间:表单预览 -->
            <div class="col-xs-5" style="border-right: 1px solid #e0e0e0; min-height: 400px;">
                <h5 class="header lighter blue"><i class="icon-eye-open"></i> 表单预览</h5>
                <p class="muted small">点击字段可编辑属性,拖动排序</p>
                <div id="formPreview" class="form-horizontal"></div>
                <div id="notfield" class="alert alert-info center" style="margin: 20px;">
                    <i class="icon-info-circle"></i> 从左侧控件库添加字段
                </div>
            </div>

            <!-- 右侧:字段属性 -->
            <div class="col-xs-4" style="min-height: 400px;">
                <h5 class="header lighter blue"><i class="icon-wrench"></i> 字段属性</h5>
                <div id="propEmpty" class="alert alert-warning center" style="margin: 20px;">
                    <i class="icon-hand-up"></i> 请先在中间区域选择一个字段
                </div>

                <form class="form-horizontal" id="propForm" style="display:none;">
                    <input type="hidden" id="fieldIndex" />

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right orange">字段键</label>
                        <div class="col-sm-8">
                            <input type="text" id="fieldKey" class="col-xs-12" maxlength="50" placeholder="英文标识,如 discountRate" />
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right orange">字段标签</label>
                        <div class="col-sm-8">
                            <input type="text" id="fieldLabel" class="col-xs-12" maxlength="100" placeholder="中文显示,如 降点比例" />
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">必填</label>
                        <div class="col-sm-8">
                            <label class="checkbox-inline"><input type="checkbox" id="required" value="1"> 是</label>
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">默认值</label>
                        <div class="col-sm-8">
                            <input type="text" id="defaultValue" class="col-xs-12" />
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">下拉数据源</label>
                        <div class="col-sm-8">
                            <input type="text" id="dataSource" class="col-xs-12" placeholder="逗号分隔 或 beanClass#method" />
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right" data-i18n="page.approval.label.verifyRule">验证规则</label>
                        <div class="col-sm-8">
                            <input type="text" id="validateRule" class="col-xs-12" placeholder="require,integer,float,phone" />
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <div class="col-sm-offset-4 col-sm-8">
                            <button type="button" id="applyPropBtn" class="btn btn-primary btn-sm"><i class="icon-ok"></i> 应用</button>
                            <button type="button" id="deleteFieldBtn" class="btn btn-danger btn-sm"><i class="icon-trash"></i> 删除字段</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="hr hr-dotted"></div>

        <div class="clearfix" style="margin: 10px 0;">
            <button type="button" id="submitBtn" class="btn btn-primary pull-right">
                <i class="icon-save"></i> 保存表单
            </button>
        </div>

    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/approval/approvalFormCreate.js']);
</script>
