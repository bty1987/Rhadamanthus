<div class="row">
    <div class="col-xs-12">

        <form class="form-horizontal" id="formForm">
            <div class="form-group">
                <label class="col-sm-2 control-label no-padding-right orange" for="code">表单编码</label>
                <div class="col-sm-4">
                    <input type="text" id="code" class="col-xs-12 v_required" maxlength="64" placeholder="如 DECORATION_CONTRACT_FORM" />
                </div>
                <label class="col-sm-2 control-label no-padding-right orange" for="name">表单名称</label>
                <div class="col-sm-4">
                    <input type="text" id="name" class="col-xs-12 v_required" maxlength="100" />
                </div>
            </div>
            <div class="space-4"></div>

            <div class="form-group">
                <label class="col-sm-2 control-label no-padding-right" for="flowId">关联流程ID</label>
                <div class="col-sm-4">
                    <input type="number" id="flowId" class="col-xs-12" placeholder="选填,approvalFlow.flowId" />
                </div>
                <label class="col-sm-2 control-label no-padding-right" for="comment">说明</label>
                <div class="col-sm-4">
                    <input type="text" id="comment" class="col-xs-12" maxlength="255" />
                </div>
            </div>
        </form>

        <div class="hr hr-dotted"></div>

        <div class="row">
            <div class="col-xs-12">
                <div class="page-header">
                    <h4 class="header lighter blue">字段配置 <small>每个字段一行,控件类型决定前端渲染</small></h4>
                </div>

                <table class="table table-striped table-bordered" id="fieldTable" style="display:none;">
                    <thead>
                        <tr>
                            <th class="col-xs-1">排序</th>
                            <th class="col-xs-2">字段键 (key)</th>
                            <th class="col-xs-2">字段标签 (label)</th>
                            <th class="col-xs-2">控件类型</th>
                            <th class="col-xs-1">必填</th>
                            <th class="col-xs-3">默认值 / 数据源 / 验证</th>
                            <th class="col-xs-1">操作</th>
                        </tr>
                    </thead>
                    <tbody id="fieldBody"></tbody>
                </table>

                <div id="notfield" class="alert alert-info center">
                    <i class="icon-info-circle"></i> 暂无字段,请点击下方按钮添加
                </div>

                <div class="clearfix" style="margin: 10px 0;">
                    <button type="button" id="addFieldBtn" class="btn btn-warning btn-sm pull-left">
                        <i class="icon-plus"></i> 添加字段
                    </button>
                    <button type="button" id="submitBtn" class="btn btn-primary btn-sm pull-right">
                        <i class="icon-save"></i> 保存表单
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- 字段编辑弹窗 -->
<div class="modal fade" id="fieldModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title">字段配置</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="fieldFormField">
                    <input type="hidden" id="fieldIndex" />

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange">字段键</label>
                        <div class="col-sm-3">
                            <input type="text" id="fieldKey" class="col-xs-12 v_required" maxlength="50" placeholder="英文,如 discountRate" />
                        </div>
                        <label class="col-sm-3 control-label no-padding-right orange">字段标签</label>
                        <div class="col-sm-3">
                            <input type="text" id="fieldLabel" class="col-xs-12 v_required" maxlength="100" placeholder="中文,如 降点比例" />
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange">控件类型</label>
                        <div class="col-sm-3">
                            <select id="controlType" class="col-xs-12">
                                <option value="1">文本</option>
                                <option value="2">文本域</option>
                                <option value="3">数字</option>
                                <option value="4">下拉</option>
                                <option value="5">日期</option>
                                <option value="6">用户选择</option>
                                <option value="7">部门选择</option>
                                <option value="8">附件</option>
                            </select>
                        </div>
                        <label class="col-sm-3 control-label no-padding-right">排序</label>
                        <div class="col-sm-3">
                            <input type="number" id="sortOrder" class="col-xs-12" value="0" min="0" />
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">必填</label>
                        <div class="col-sm-3">
                            <select id="required" class="col-xs-12">
                                <option value="0">否</option>
                                <option value="1">是</option>
                            </select>
                        </div>
                        <label class="col-sm-3 control-label no-padding-right">默认值</label>
                        <div class="col-sm-3">
                            <input type="text" id="defaultValue" class="col-xs-12" />
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">下拉数据源</label>
                        <div class="col-sm-9">
                            <input type="text" id="dataSource" class="col-xs-12" placeholder="逗号分隔 或 beanClass#method" />
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">验证规则</label>
                        <div class="col-sm-9">
                            <input type="text" id="validateRule" class="col-xs-12" placeholder="require,integer,float,phone 逗号分隔" />
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveFieldBtn" class="btn btn-primary">确定</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/approval/approvalFormCreate.js']);
</script>
