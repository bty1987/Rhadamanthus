<div id="row">
    <div class="col-xs-4">
        <div class="form-horizontal" id="formItems">
            <h3 class="col-xs-12 header smaller lighter blue">控件</h3>
            <div class="btn-toolbar" id="referquery"></div>
            <div class="btn-toolbar" id="referfilling"></div>
            <div class="btn-toolbar" id="referother"></div>
        </div>
    </div>
    <div class="col-xs-8" id="right" style="border-left: 1px solid #c1c1c1;">
        <div class="col-xs-12">
            <h3 class="col-xs-12 header smaller lighter blue">已选控件列表</h3>
        </div>
        <div id="processForm">
            <div class="form-horizontal col-sm-6">
	            <div class="form-group">
	                <label class="col-sm-3 control-label orange" for="name">审批名称</label>
	                <div class="col-sm-9">
	                    <input type="text" id="name" class="col-sm-12 v_required" />
	                </div>
	            </div>
	
	            <div class="form-group">
	                <label class="col-sm-3 control-label orange" for="no">编号</label>
	                <div class="col-sm-9">
	                    <input type="text" id="no" class="col-sm-12 v_required" maxlength="4" />
	                </div>
	            </div>
            </div>
            
            <div class="form-horizontal col-sm-6">
	            <div class="form-group">
	                <label class="col-sm-3 control-label orange" for="code">Code</label>
	                <div class="col-sm-9">
	                    <input type="text" id="code" class="col-sm-12 v_required" />
	                </div>
	            </div>
            </div>
        </div>

        <div class="col-sm-12 form-horizontal">
            <h4 class="header smaller lighter blue">项目</h4>
            <div class="" id="notfield">
                <p class="alert alert-info center">无项目信息</p>
            </div>
            <div>
                <ul class="item-list fl-table-list ui-sortable" id="itemfield"></ul>
            </div>
        </div>
        <div class="col-sm-12 form-horizontal">
            <h4 class="header smaller lighter blue">详细</h4>
            <div class="" id="notitem">
                <p class="alert alert-info center">无详细信息</p>
            </div>
            <div>
                <ul class="item-list fl-table-list ui-sortable" id="itemitem"></ul>
            </div>
        </div>
        <div class="col-sm-12 form-horizontal">
            <h4 class="header smaller lighter blue">备注</h4>
            <div class="" id="notcomment">
                <p class="alert alert-info center">无备注信息</p>
            </div>
            <div>
                <ul class="item-list fl-table-list ui-sortable" id="itemcomment"></ul>
            </div>
        </div>
    </div>
    
    <hr class="col-xs-11" />
    
    <div class="col-xs-12">
        <button type="button" id="submitBtn" class="btn btn-primary pull-right">保存</button>
    </div>
</div>

<!-- 输入必要信息-->
<div class="modal fade" id="referModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                <span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title">参数信息</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="formFiled">
                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right orange" for="ID">ID</label>
                        <div class="col-sm-8">
                            <input type="text" id="ID" class="col-xs-10 col-sm-7 v_required" />
                        </div>
                    </div>

                    <div class="form-group show update">
                        <label class="col-sm-4 control-label no-padding-right orange" for="name">标题名称</label>
                        <div class="col-sm-8">
                            <input type="text" id="name" class="col-xs-10 col-sm-7 v_required" />
                        </div>
                    </div>

                    <div class="form-group show noUpdate">
                        <label class="col-sm-4 control-label no-padding-right" for="form">项目类型</label>
                        <div class="col-sm-8">
                            <select type="text" id="form" class="col-xs-10 col-sm-7">
                                <option value="field">项目</option>
                                <option value="item">详细</option>
                                <option value="comment">备注</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group validate">
                        <label class="col-sm-4 control-label no-padding-right" for="validate">验证规则</label>
                        <div class="col-sm-8">
                            <ul class="list-unstyled fl-inline-list clearfix" id="validate"></ul>
                        </div>
                    </div>

                    <div class="form-group data">
                        <label class="col-sm-4 control-label no-padding-right" for="data">下拉框值</label>
                        <div class="col-sm-8">
                            <textarea type="text" id="data" class="col-xs-10 col-sm-7" rows="10" maxlength="1024"></textarea>
                            <span class="col-sm-8 red">*注意: 回车作为数值分隔符*</span>
                        </div>
                        
                        <hr />

                        <label class="col-sm-4 control-label no-padding-right"></label>
                        <div class="col-sm-8">
                            <span id="dataItem" class="item-list list-inline col-sm-7"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right" for="comment">备注</label>
                        <div class="col-sm-8">
                            <textarea type="text" id="comment" class="col-xs-10 col-sm-7" rows="5" maxlength="512"></textarea>
                        </div>
                    </div>

                </form>
            </div>

            <div class="modal-footer" style="text-align: center">
                <button type="button" id="createBtn" class="btn btn-primary">确定</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/approval/process2create.js']);
</script>
