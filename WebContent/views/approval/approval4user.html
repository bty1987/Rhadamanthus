<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	<div class="modal fade" id="approveModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="myModalLabel" data-i18n="page.approval.label.approver">审批人员</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal" id="form">
		      		
						<div class="form-group">
							<label for="userSel" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.approval.label.approver">审批人员</label>
							<div class="col-md-9">
								<input type="text" class="col-xs-10 col-sm-6 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="approver" placeholder="审批人">
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="type" data-i18n="page.approval.label.approveType">审批类型</label>
							<div class="col-sm-9">
								<select id='type' class='col-xs-10 col-sm-6'></select>
							</div>
						</div>
						<div class="space-4"></div>
			            <div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">说明</label>
							<div class="col-md-9">
								<textarea id="comment" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
							</div>
						</div>		
							<div class="space-4"></div>		
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/approval/approval4user.js']);
</script>
