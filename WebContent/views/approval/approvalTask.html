<div class="row">
    <div class="col-xs-12">
        <h3 class="header lighter blue">我的待办任务</h3>
        <div id="taskList" class="clearfix"></div>
    </div>
</div>

<!-- 审批操作弹窗 -->
<div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title" id="taskModalTitle">审批</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group" id="transferGroup" style="display:none;">
                        <label class="col-sm-3 control-label orange">转交给</label>
                        <div class="col-sm-9">
                            <input type="text" id="transferTo" class="col-sm-12" placeholder="目标用户 userId" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">批注</label>
                        <div class="col-sm-9">
                            <textarea id="taskComment" maxlength="500" class="col-sm-12" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="text-align:center;">
                <button class="btn btn-success" id="agreeBtn">通过</button>
                <button class="btn btn-danger" id="refuseBtn">拒绝</button>
                <button class="btn btn-warning" id="transferBtn">转交</button>
                <button class="btn btn-default" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- 审批轨迹弹窗 -->
<div class="modal fade" id="traceModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title">审批轨迹</h4>
            </div>
            <div class="modal-body">
                <ul class="item-list" id="traceList"></ul>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/approval/approvalTask.js']);
</script>
