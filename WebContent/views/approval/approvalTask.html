<div class="row">
    <div class="col-xs-12">
        <div class="page-header">
            <h3 class="header lighter blue">我的待办任务</h3>
        </div>

        <div class="clearfix" style="margin-bottom: 10px;">
            <button type="button" id="startApprovalBtn" class="btn btn-primary btn-sm pull-right">
                <i class="icon-plus"></i> 发起审批
            </button>
        </div>

        <div id="taskBody" class="clearfix tab-pane active"></div>

        <div id="notTask" class="alert alert-info center">
            <i class="icon-info-circle"></i> 暂无待办任务
        </div>
    </div>
</div>

<!-- 审批操作弹窗 -->
<div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title" id="taskModalTitle" data-i18n="page.approval.label.approve">审批</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group" id="transferGroup" style="display:none;">
                        <label class="col-sm-3 control-label no-padding-right orange">转交给</label>
                        <div class="col-sm-9">
                            <input type="text" id="transferTo" class="col-xs-12" placeholder="目标用户 userId" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" data-i18n="page.approval.label.annotation">批注</label>
                        <div class="col-sm-9">
                            <textarea id="taskComment" maxlength="500" class="col-xs-12" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" id="agreeBtn"><i class="icon-check"></i> 通过</button>
                <button class="btn btn-danger" id="refuseBtn"><i class="icon-remove"></i> 拒绝</button>
                <button class="btn btn-warning" id="transferBtn"><i class="icon-share"></i> 转交</button>
                <button class="btn btn-default" data-dismiss="modal" data-i18n="msg.close">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- 审批轨迹弹窗 -->
<div class="modal fade" id="traceModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title">审批轨迹</h4>
            </div>
            <div class="modal-body">
                <div id="traceBody" class="clearfix tab-pane active"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" data-dismiss="modal" data-i18n="msg.close">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- 发起审批弹窗 -->
<div class="modal fade" id="startModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title">发起审批</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange">审批流程</label>
                        <div class="col-sm-9">
                            <select id="generalFlowSelect" class="col-xs-12"><option value="" data-i18n="msg.selectPlease">请选择</option></select>
                        </div>
                    </div>
                </form>
                <hr />
                <div id="generalFormArea"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="submitGeneralBtn"><i class="icon-ok"></i> 提交审批</button>
                <button class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/approval/approvalTask.js']);
</script>
