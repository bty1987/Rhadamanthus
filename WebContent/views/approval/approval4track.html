    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                    <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="customerphoneInfo" data-i18n="page.approval.label.approve">审批</h4>
            </div>

            <div class="modal-body" >
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal">
                            <div class="col-md-12">
				                <div class="form-group">
				                    <label class="col-sm-3 control-label no-padding-right" for="address" data-i18n="page.approval.label.result">结果</label>
				                    <div class="col-sm-9">
				                        <span id="result" class="col-xs-10 col-sm-6" rows="3"></span>
				                    </div>
				                </div>
				            
				                <div class="form-group">

				                        <textarea id="annotate" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
				                    </div>
				                </div>
			                </div>
		                </form>
	                </div>
	           </div>

            </div>
            <div class="modal-footer" style="text-align: center;">
