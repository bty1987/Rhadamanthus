
<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

<!--订单号,订单类型,积分,积分分数,说明-->
<div class="modal fade" id="memberModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title" id="myModalLabel">新增会员积分</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal">

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="type">订单类型</label>
						<div class="col-sm-9">
							<select class="col-xs-10 col-sm-7" id="type">
								<option value="1">主材</option>
								<option value="2">装修</option>
							</select>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="subtype">积分增减</label>
						<div class="col-sm-9">
							<select class="col-xs-10 col-sm-7" id="subtype">
								<option value="0">增积分</option>
								<option value="1">减积分</option>
							</select>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="credit">积分分数</label>
						<div class="col-sm-9">
							<input type="text" id="credit" maxlength="64" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
							<span class='star'></span>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="comment">积分说明</label>
						<div class="col-sm-9">
							<textarea name="" id="comment" cols="40" rows="5" style="resize: none"></textarea>
							<span class='star'></span>
						</div>
					</div>

				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<!--转积分-->
<div class="modal fade" id="turnPointsModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title" id="turnPointsModalLabel">会员卡转积分</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal">

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="comment">目标卡号</label>
						<div class="col-sm-9">
							<input type="text" id="cardId" maxlength="64" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
							<span class='star'></span>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="credit">转出分数</label>
						<div class="col-sm-9">
							<input type="text" id="turnPointsCredit" maxlength="64" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
							<span class='star'></span>
						</div>
					</div>

				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="turnPointsBtn" class="btn btn-primary">保存</button>
				<button type="button" id="turnPointsCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>
