
<div id="quotationCtemPageContent" class="page-content">		
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件 -->
    		<div id="resultList" class="clearfix tab-pane active"></div><!-- 查询 -->
    		<div id="pagenation" class="fl-page-wrap clearfix"></div> <!-- 分页 -->
		</div>
	</div>
	
	<div class="modal fade" id=updateQuotationCtemModal tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="quotationCtemDialog">公共项</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right " for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_name v_required" data-toggle="popover" data-trigger='manual' maxlength="64"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="type">业务</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-5 v_required" id="type" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationType">类型</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="quotationType" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationClassification">分类</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="quotationClassification" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationBigCategory">大类</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="quotationBigCategory" data-toggle="popover" data-trigger='manual'>
									<option>请选择类型</option>
								</select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationSmallCategory">小类</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="quotationSmallCategory" data-toggle="popover" data-trigger='manual'>
									<option>请选择类型</option>
								</select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="measurementUnit">单位</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="measurementUnit" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="workType">工种</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="workType" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveQuotationCtemBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<div id="quotationCtemPopUp" class="portlet box"></div>

<script type="text/javascript">
	$.loadScript(['js/quotation/quotationCtem.js']);
</script>
