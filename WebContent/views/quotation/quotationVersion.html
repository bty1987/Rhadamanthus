<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id=updateQuotationVersionModal tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="quotationVersionDialog">报价版本</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right " for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_name v_required" data-toggle="popover" data-trigger='manual' maxlength="30"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="trafficRate">车运费比例</label>
                            <div class="col-sm-9">
                                <input type="text" id="trafficRate" class="col-xs-10 col-sm-5 v_float v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="trafficDiscount">车运费折扣</label>
                            <div class="col-sm-9">
                                <input type="checkbox" id="trafficDiscount" class="ace"/>
                                <span class="lbl discount-lbl"></span>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="manageRate">管理费比例</label>
                            <div class="col-sm-9">
                                <input type="text" id="manageRate" class="col-xs-10 col-sm-5 v_float v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="manageDiscount">管理费折扣</label>
                            <div class="col-sm-9">
                                <input type="checkbox" id="manageDiscount" class="ace"/>
                                <span class="lbl discount-lbl"></span>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="taxRate">税金比例</label>
                            <div class="col-sm-9">
                                <input type="text" id="taxRate" class="col-xs-10 col-sm-5 v_float v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">税金折扣</label>
                            <div class="col-sm-9">
                                <input type="radio" id="manageTaxDiscount" checked="checked" name="taxDiscount" class="ace"/>
                                <span class="lbl"></span>
                                <label>管理税金</label>

                                <input type="radio" id="totalTaxDiscount" name="taxDiscount" class="ace"/>
                                <span class="lbl"></span>
                                <label>总额税金</label>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="type">类型</label>
                            <div class="col-sm-9">
                                <select id="type" class="col-xs-10 col-sm-5 v_required ace"></select>
                            </div>
                        </div>
						<div class="space-4"></div>

					    <div class="form-group">
							<label class="col-sm-3 control-label no-padding-right " for="offset">偏移量</label>
							<div class="col-sm-9">
								<input type="text" id="offset" class="col-xs-10 col-sm-5 v_name v_required v_number" value="0" data-toggle="popover" data-trigger='manual' maxlength="30"/>
							</div>
						</div>
						<div class="space-4"></div>	
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="comment">备注</label>
                            <div class="col-sm-9">
                                <textarea id="comment" class="col-xs-10 col-sm-5 v_name" rows="3" data-toggle="popover" data-trigger='manual' maxlength="50"></textarea>
                            </div>
                        </div>
                        <div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

</div>

<script type="text/javascript">
	$.loadScript(['js/quotation/quotationVersion.js']);
</script>
