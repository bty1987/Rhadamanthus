<div id="quotationPrice" class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="quotationPriceCondList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="quotationPriceResultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="quotationPricePagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
    
    <div class="modal fade" id="createQuotationPriceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addQuotationPrice" data-i18n="page.quotation.label.price">价格</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="addPrice" data-i18n="page.quotation.label.addPrice">增补价</label>
                            <div class="col-sm-9">
                                <input type="text" id="addPrice" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="unitPrice" data-i18n="page.quotation.label.unitPrice">单价</label>
                            <div class="col-sm-9">
                                <input type="text" id="unitPrice" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="subPrice" data-i18n="page.quotation.label.reducePrice">退减价</label>
                            <div class="col-sm-9">
                                <input type="text" id="subPrice" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="updateTime">更新时间</label>
                            <div class="col-sm-9">
                                <input type="text" id="updateTime"class="col-xs-10 col-sm-5 v_required date-picker" data-toggle="popover" data-trigger='manual' maxlength="64"/>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveQuotationPriceBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/quotationPrice.js']);
</script>
