<div id="selectionModule">
    <div class="col-xs-12">

        <!-- 左上角合计 -->
        <div class="col-xs-12 col-md-3">
            <div class="widget-box  transparent">
                <div class="widget-header">
                    <h4 id="quotationName">装修单信息</h4>
                </div>
                
                <div class="widget-body">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label class=" col-md-4 no-padding-right">装修单号</label>
                            <label id=orderId class="col-md-8 no-padding-left">0.00</label>
                        </div>
                        <div class="form-group">
                            <label class=" col-md-4 no-padding-right">楼盘地址</label>
                            <label id="address" class="col-md-8 no-padding-left">0.00</label>
                        </div>
                        <div class="form-group">
                            <label class=" col-md-4 no-padding-right">报价版本</label>
                            <label id="version" class="col-md-8 no-padding-left">0.00</label>
                        </div>
                    </div>
                    <div class="col-md-12 hr hr-14"></div>
                </div>
                
                <div class="widget-header">
                    <h4 id="quotationName">选材单信息</h4>
                </div>

                <div class="widget-body">
                    <div class="widget-main">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label class=" col-md-6  no-padding-right">总价</label>
                                    <label id="total" class=" col-md-4  no-padding-left">0.00</label>
                                </div>
                                <div class="form-group">
                                    <label class=" col-md-6  no-padding-right">报价总价</label>
                                    <label id="quotationTotal" class=" col-md-4  no-padding-left">0.00</label>
                                </div>
                                <div class="form-group">
                                    <label class=" col-md-6  no-padding-right">拓展增总价</label>
                                    <label id="extensionAddTotal" class=" col-md-4  no-padding-left">0.00</label>
                                </div>
                                <div class="form-group">
                                    <label class=" col-md-6  no-padding-right">拓展减总价</label>
                                    <label id="extensionReduceTotal" class=" col-md-4  no-padding-left">0.00</label>
                                </div>
                                <div class="form-group">
                                    <label class=" col-md-6  no-padding-right">增减增总价</label>
                                    <label id="addReduceAddTotal" class=" col-md-4  no-padding-left">0.00</label>
                                </div>
                                <div class="form-group">
                                    <label class="col-md-6 no-padding-right">增减减总价</label>
                                    <label id="addReduceMinusTotal" class="col-md-6 no-padding-left">0.00</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--左下角按钮-->
        <div class="col-xs-12 col-md-3" style="position:fixed; bottom:10px; background-color: white;">
            <div class="col-md-12 center">
                 <div class="ui-pg-div">
                     <button id="saveMaterialBtn" class="btn btn-minier btn-yellow col-md-3">选材项</button>
                     <button id="sendSelectionBtn" class="btn btn-minier col-md-3" style="margin-left: 2px;">推送</button>
                 </div>
            </div>
            <div class="col-md-12 space-6"></div>
            <div class="col-md-12">
                <div class="ui-pg-div">
                    <button id="saveSelectionBtn" class="btn btn-minier btn-inverse col-md-3" data-loading-text="Loading...">
                        <i class="icon-save"></i>保存
                    </button>
                    <button id="printFinanceBtn" class="btn btn-minier btn-primary col-md-3" style="margin-left: 2px;" target="_blank">
                        <i class="icon-print"></i>打印
                    </button>
                    <button id="returnBtn" class="btn btn-minier btn-info col-md-3" style="margin-left: 2px;">
                        <i class="icon-mail-forward"></i>返回
                    </button>
                </div>
            </div>
        </div>

        <!-- 右边项目项 -->
        <div class="col-xs-12 col-md-9" style="border-width: 0 0 0 1px;border-style: solid; border-color: #c1c1c1;">
            <div class="row clearfix">
                <div class="col-xs-12 col-md-12" id="selectionBox"></div>
            </div>
        </div>

        <!-- 选材按钮弹窗层 -->
        <div class="modal fade" id="quotationItemSoodsModal" tabindex="-1">
            <div class="modal-dialog" style="width:70%;">
                <div class="modal-content col-md-12">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal">
                            <span>&times;</span>
                        </button>
                        <h4 class="modal-title">报价项选材</h4>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
                            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
                            <div id="pagenation" class="fl-page-wrap clearfix" style="text-align: center;max-width: 680px;"></div> <!--分页-->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 选材项按钮弹窗层 -->
        <div class="modal fade" id="quotationItemMateria" tabindex="-1">
            <div class="modal-dialog" style="width:70%;">
                <div class="modal-content col-md-12">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal">
                            <span>&times;</span>
                        </button>
                        <h4 class="modal-title">选材项</h4>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div id="condLists" class="fl_search clearfix"></div> <!-- 查询条件-->
                            <div id="resultLists" class="clearfix tab-pane active"></div> <!--查询结果-->
                            <div id="pagenations" class="fl-page-wrap clearfix" style="text-align: center;max-width: 680px;"></div> <!--分页-->
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/selectionPart.js']);
</script>
