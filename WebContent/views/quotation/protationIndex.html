
<div id="protationIndexPageContent" class="page-content">

	<div id="fl-statement" style="display: none;"></div>

	<div class="clearfix" id="decorationInfo" style="display: none;">
		<div class="col-xs-6">
			<a href="#" id="createProtation" class="btn btn-default btn-app btn-sm radius-4" style="padding: 5px 0;">
				<i class="icon-plus-sign bigger-230"></i>
				<span>创建</span>
			</a>

			<a href="#" id="btnBack" class="btn btn-info btn-app btn-sm radius-4" style="padding: 5px 0;">
				<i class="icon-mail-forward bigger-230"></i>
				<span>返回</span>
			</a>
		</div>
	</div>
	
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件 -->
    		<div id="resultList" class="clearfix tab-pane active"></div>
    		<div id="pagenation" class="fl-page-wrap clearfix"></div> <!-- 分页 -->
		</div>
	</div>
			
	<div class="modal fade" id="protationModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="protationDialog">报价</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_required v_name"  maxlength='15'/>
								<input type="text" id="pid" class="col-xs-10 col-sm-5 hide"/>
							</div>
						</div>
						<div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="produce">产品</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-5 v_required" id="produce" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

						<div class="form-group" id="versionGroup">
							<label class="col-sm-3 control-label no-padding-right" for="version">版本</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5" id="version" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quoteArea">面积</label>
							<div class="col-sm-9">
								<input type="text" id="quoteArea" class="col-xs-10 col-sm-5 v_required v_quoteArea"  maxlength='15'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="preferPrice">优惠价</label>
							<div class="col-sm-9">
								<input type="text" id="preferPrice" class="col-xs-10 col-sm-5 v_preferPrice"  maxlength='15'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="comment">备注</label>
							<div class="col-sm-9">
								<textarea id="comment" class="col-xs-10 col-sm-5 v_name" rows="3" data-toggle="popover" data-trigger='manual'  maxlength='25'></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="protationPreferModal" tabindex="-1" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">优惠价格修改</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="preferPrices">优惠价</label>
							<div class="col-sm-9">
								<input type="text" id="preferPrices" class="col-xs-10 col-sm-5 v_float_3"  maxlength='15'/>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="preferManage">管理优惠</label>
							<div class="col-sm-9">
								<input type="text" id="preferManage" class="col-xs-10 col-sm-5 v_float_3"  maxlength='15'/>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="preferAdvance">特殊优惠</label>
							<div class="col-sm-9">
								<input type="text" id="preferAdvance" class="col-xs-10 col-sm-5 v_float_3"  maxlength='15'/>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="savePreferBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="approveModal" tabindex="-1" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel">修改申请</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="changeReason">描述</label>
							<div class="col-sm-9">
								<textarea id="changeReason" maxlength="128" class="col-xs-10 col-sm-6 v_required" rows="3" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group" id="approveGroup">
							<label for="approveManSel" class="col-sm-3 control-label no-padding-right">审批人</label>
							<div class="col-sm-9">
								<div id="approveManSel" class="col-xs-10 col-sm-6 ">
								</div>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label for="dingApprove" class="col-sm-3 control-label no-padding-right">钉钉同步</label>
							<div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="dingApprove">
								<span class="lbl status-lbl"></span>
							</div>
						</div>

						<div class="form-group">
							<label for="wechatApprove" class="col-sm-3 control-label no-padding-right">企业微信同步</label>
							<div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="wechatApprove" disabled="disabled">
								<span class="lbl status-lbl"></span>
							</div>
						</div>

						<div class="form-group">
							<label for="larkApprove" class="col-sm-3 control-label no-padding-right">飞书同步</label>
							<div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="larkApprove" disabled="disabled">
								<span class="lbl status-lbl"></span>
							</div>
						</div>

						<div class="form-group">
							<label for="fenxApprove" class="col-sm-3 control-label no-padding-right">纷享同步</label>
							<div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="fenxApprove" disabled="disabled">
								<span class="lbl status-lbl"></span>
							</div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="submitApproveBtn" class="btn btn-primary">修改申请</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

	$.loadScript(['js/quotation/protationIndex.js']);
</script>
