<div id="selectionItemPageContent">
    <div>
        <div class="row">
            <div class="col-xs-12">
                <!-- 查询条件-->
                <div id="condList" class="fl_search clearfix"></div>
                <!--查询结果-->
                <div id="resultList" class="clearfix tab-pane active"></div>
                <!--分页-->
                <div id="pagenation" class="fl-page-wrap clearfix"></div>
            </div>

            <div class="modal fade" id="updateSelectionItemModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                            <h4 class="modal-title" id="myModalLabel">编辑数量</h4>
                        </div>
                        <div class="modal-body">
                            <form class="form-horizontal">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="num">数量</label>
                                    <div class="col-sm-9">
                                        <input type="text" id="num" maxlength="12" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                                    </div>
                                </div>

                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" id="updateBtn" class="btn btn-primary">保存</button>
                            <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="finishSelectionItemModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                            <h4 class="modal-title" id="myModalLabe2">完结</h4>
                        </div>
                        <div class="modal-body">
                            <form class="form-horizontal">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="refnum">退数量</label>
                                    <div class="col-sm-9">
                                        <input type="text" id="refnum" maxlength="12" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                                    </div>
                                </div>

                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" id="finishSaveBtn" class="btn btn-primary">保存</button>
                            <button type="button" id="finishCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="checkSelectionItemModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                            <h4 class="modal-title" id="myModalLabe3">审核</h4>
                        </div>
                        <div class="modal-body">
                            <form class="form-horizontal">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="comment">注释</label>
                                    <div class="col-sm-9">
                                        <input type="text" id="comment" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                    </div>
                                </div>

                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" id="checkSaveBtn" class="btn btn-primary">保存</button>
                            <button type="button" id="checkCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/selectionItemPage.js']);
</script>
