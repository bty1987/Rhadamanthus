<div id="addReducePageContent" class="page-content">

    <div id="fl-statement" style="display: none;"></div>
    
    <div class="clearfix row" id="decorationInfo" style="display: none;">
    
        <div class="col-xs-6 col-md-3">
            <a href="#" id="add" class="btn btn-success btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-plus-sign bigger-230"></i>
                <span>创建</span>
            </a>
            
            <a href="#" id="print" class="btn btn-purple btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-plus-sign bigger-230"></i>
                <span>打印</span>
            </a>
            
            <a href="#" id="btnNotice" class="btn btn-inverse btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-plus-sign bigger-230"></i>
                <span>发送</span>
            </a>
            
            <a href="#" id="btnNotice" class="btn btn-warning btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-plus-sign bigger-230"></i>
                <span>刷新</span>
            </a>

            <a href="#" id="btnBack" class="btn btn-info btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-mail-forward bigger-230"></i>
                <span>返回</span>
            </a>
        </div>
    </div>

	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件 -->
			<div id="resultList" class="clearfix tab-pane active"></div>
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!-- 分页 -->
		</div>
	</div>
	
	<div class="modal fade" id="addReduceModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="addReduceDialog">增减单</h4>
				</div>
	
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="addReduceDes">描述</label>
							<div class="col-sm-9">
								<textarea id="addReduceDes" rows="3" class="col-xs-10 col-sm-5 v_required"></textarea>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="addReduceType">类别</label>
							<div class="col-sm-9">
								<select id="addReduceType" class="col-xs-10 col-sm-5 v_required">
									<option value="0">增项</option>
									<option value="1">减项</option>
								</select>
							</div>
						</div>
						<div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="addReduceAtttype">类别</label>
                            <div class="col-sm-9">
                                <select id="addReduceAtttype" class="col-xs-10 col-sm-5 v_required">
                                    <option value="0">工程</option>
                                    <option value="1">主材</option>
                                </select>
                            </div>
                        </div>
                        <div class="space-4"></div>
					</form>
				</div>
	
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelAddBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
