<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <!-- 子页面弹窗容器（用于popup4page加载item等子页面） -->
    <div id="layerPopUp" class="portlet box page-content"></div>

    <!-- 查看任务弹窗 -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">当前任务列表 - <span id="taskUserName"></span></h4>
                </div>
                <div class="modal-body" style="max-height: 500px; overflow-y: auto;">
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>装修单号</th>
                                <th>公司</th>
                                <th>装修类型</th>
                                <th>状态</th>
                                <th>优先级</th>
                                <th>请求人</th>
                                <th>分配时间</th>
                            </tr>
                        </thead>
                        <tbody id="taskListBody">
                        </tbody>
                    </table>
                    <div id="taskEmptyMsg" class="alert alert-info" style="display:none;">当前没有负责的任务</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.close">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增/编辑弹窗 -->
    <div class="modal fade" id="userRuleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="modalTitle">预算员规则</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <input type="hidden" id="qaurid">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="user" data-i18n="page.quotation.label.budgeter">预算员</label>
                            <div class="col-sm-9">
                                <input type="text" id="user" class="col-xs-10 col-sm-8 v_required" placeholder="输入姓名或拼音搜索" data-i18n-ph="page.quotation.ph.searchByNameAlt2" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="status" data-i18n="page.quotation.label.status">状态</label>
                            <div class="col-sm-9">
                                <select id="status" class="col-xs-10 col-sm-8 v_required"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="lastFinishTime">最后完成时间</label>
                            <div class="col-sm-9">
                                <input type="text" id="lastFinishTime" class="col-xs-10 col-sm-8" placeholder="选择日期时间" data-i18n-ph="page.quotation.ph.selectDateTime" readonly />
                                <span class="help-block" style="margin-bottom: 0;">用于自动分配排序，留空则使用当前时间</span>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/quotationAssignUserRule.js']);
</script>
