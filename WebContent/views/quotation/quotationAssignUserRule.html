<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <!-- 子页面弹窗容器（用于popup4page加载item等子页面） -->
    <div id="layerPopUp" class="portlet box page-content"></div>

    <!-- 新增/编辑弹窗 -->
    <div class="modal fade" id="userRuleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="modalTitle">预算员规则</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <input type="hidden" id="qaurid">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="user">预算员</label>
                            <div class="col-sm-9">
                                <input type="text" id="user" class="col-xs-10 col-sm-8 v_required" placeholder="输入姓名或拼音搜索" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="status">状态</label>
                            <div class="col-sm-9">
                                <select id="status" class="col-xs-10 col-sm-8 v_required"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="lastFinishTime">最后完成时间</label>
                            <div class="col-sm-9">
                                <input type="text" id="lastFinishTime" class="col-xs-10 col-sm-8" placeholder="选择日期时间" readonly />
                                <span class="help-block" style="margin-bottom: 0;">用于自动分配排序，留空则使用当前时间</span>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/quotationAssignUserRule.js']);
</script>
