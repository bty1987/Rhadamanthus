<div class="page-content">
	<!-- 统计卡片 -->
	<div class="row">
		<div class="col-xs-12">
			<div class="alert alert-info">
				<i class="icon-info-sign"></i>
				<strong>预算员统计：</strong>
				可用 <span id="availableCount" class="badge badge-success">0</span> |
				忙碌 <span id="busyCount" class="badge badge-warning">0</span> |
				已停用 <span id="stoppedCount" class="badge badge-grey">0</span>
			</div>
		</div>
	</div>

	<!-- 工具栏 -->
	<div class="row">
		<div class="col-xs-12">
			<button id="addBtn" class="btn btn-sm btn-success">
				<i class="icon-plus"></i> 新增预算员
			</button>
			<button id="refreshBtn" class="btn btn-sm btn-primary">
				<i class="icon-refresh"></i> 刷新
			</button>
			<button id="workloadBtn" class="btn btn-sm btn-info">
				<i class="icon-bar-chart"></i> 工作负载
			</button>
		</div>
	</div>

	<!-- 查询条件 -->
	<div class="row search-row">
		<div class="col-xs-12">
			<div class="form-inline">
				<label>状态:</label>
				<select id="statusSelect">
					<option value="">全部</option>
					<option value="1">可用</option>
					<option value="2">忙碌</option>
					<option value="3">已停用</option>
				</select>

				<label>姓名:</label>
				<input type="text" id="userName" placeholder="请输入姓名">

				<button id="searchBtn" class="btn btn-sm btn-primary">
					<i class="icon-search"></i> 查询
				</button>
			</div>
		</div>
	</div>

	<!-- 数据表格 -->
	<div class="row">
		<div class="col-xs-12">
			<table id="dataTable" class="table table-striped table-bordered table-hover">
				<thead>
					<tr>
						<th><input type="checkbox" id="selectAll"></th>
						<th>工号</th>
						<th>姓名</th>
						<th>部门</th>
						<th>状态</th>
						<th>当前任务数</th>
						<th>支持类型</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody id="dataBody"></tbody>
			</table>
		</div>
	</div>

	<!-- 分页 -->
	<div class="row">
		<div class="col-xs-12">
			<div id="pagination"></div>
		</div>
	</div>
</div>

<!-- 编辑模态框 -->
<div class="modal fade" id="editModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span>&times;</span>
				</button>
				<h4 class="modal-title" id="modalTitle">编辑预算员</h4>
			</div>
			<div class="modal-body">
				<form id="editForm" class="form-horizontal">
					<input type="hidden" id="burid">

					<div class="form-group">
						<label class="col-sm-3 control-label">用户<span class="required">*</span></label>
						<div class="col-sm-9">
							<select id="userId" class="form-control chosen-select" required>
								<option value="">请选择用户</option>
							</select>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label">最大任务数</label>
						<div class="col-sm-9">
							<input type="number" id="maxTasks" class="form-control" value="5" min="1" max="20">
							<span class="help-block">预算员同时能处理的最大任务数量</span>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label">支持类型<span class="required">*</span></label>
						<div class="col-sm-9">
							<label class="inline">
								<input type="checkbox" name="supportType" value="1" class="ace"> 半包
							</label>
							<label class="inline">
								<input type="checkbox" name="supportType" value="2" class="ace"> 整装
							</label>
							<span class="help-block">至少选择一种类型</span>
						</div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				<button type="button" class="btn btn-primary" id="saveBtn">保存</button>
			</div>
		</div>
	</div>
</div>

<!-- 工作负载模态框 -->
<div class="modal fade" id="workloadModal" tabindex="-1">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span>&times;</span>
				</button>
				<h4 class="modal-title">预算员工作负载</h4>
			</div>
			<div class="modal-body">
				<table id="workloadTable" class="table table-striped table-bordered table-hover">
					<thead>
						<tr>
							<th>姓名</th>
							<th>当前任务数</th>
							<th>最大任务数</th>
							<th>负载率</th>
							<th>状态</th>
						</tr>
					</thead>
					<tbody id="workloadBody"></tbody>
				</table>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/quotation/quotationAssignUserRule.js']);
</script>
