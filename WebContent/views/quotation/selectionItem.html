<div id="selectionItemPageContent">
    <div>
        <div class="row">
            <div class="col-xs-12">
                <!-- 查询条件-->
                <div id="condList" class="fl_search clearfix"></div>
                <!--查询结果-->
                <div id="resultList" class="clearfix tab-pane active"></div>
                <!--分页-->
                <div id="pagenation" class="fl-page-wrap clearfix"></div>
            </div>

            <div class="modal fade" id="updateSelectionItemModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                            <h4 class="modal-title" id="myModalLabel">编辑数量</h4>
                        </div>
                        <div class="modal-body">
                            <form class="form-horizontal">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="num">数量</label>
                                    <div class="col-sm-9">
                                        <input type="text" id="num" maxlength="12" class="col-xs-10 col-sm-7 v_required v_afloat_3" data-toggle="popover" data-trigger='manual'/>
                                    </div>
                                </div>

                                <div class="form-group" id="dcomment">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="comment">备注</label>
                                    <div class="col-sm-9">
                                        <input type="text" id="comment" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                    </div>
                                </div>

                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" id="updateBtn" class="btn btn-primary">保存</button>
                            <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="modal fade" id="refundSelectionItemModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                            <h4 class="modal-title" id="myModalLabe2">完结</h4>
                        </div>
                        <div class="modal-body">
                            <form class="form-horizontal">
                            	<div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="utilitynum">实用量</label>
                                    <div class="col-sm-9">
                                        <input type="text" id="utilitynum" maxlength="12" class="col-xs-10 col-sm-7 v_float_3" data-toggle="popover" data-trigger='manual'/>
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="refnum">退货</label>
                                    <div class="col-sm-9">
                                        <input type="text" id="refnum" maxlength="12" class="col-xs-10 col-sm-7 v_float_3" data-toggle="popover" data-trigger='manual'/>
                                    </div>
                                </div>

                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" id="refundBtn" class="btn btn-primary">保存</button>
                            <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="balanceSelectionItemModal" tabindex="-1">
			    <div class="modal-dialog">
			        <div class="modal-content">
			            <div class="modal-header">
			                <button type="button" class="close" data-dismiss="modal">
			                    <span>&times;</span><span class="sr-only">Close</span>
			                </button>
			                <h4 class="modal-title" id="decorationInfoDialog">结算单</h4>
			            </div>
			            <div class="modal-body">
			                <form class="form-horizontal">
			                    <div class="form-group">
			                        <label class="col-sm-3 control-label no-padding-right orange" for="taskName">结算名</label>
			                        <div class="col-sm-9">
			                            <input id="balanceSales" type="text" class="col-xs-10 col-sm-5 v_required v_typeahead" data-toggle="popover" data-trigger='manual' maxlength="32"/>
			                        </div>
			                    </div>
			                </form>
			            </div>
			            <div class="modal-footer">
			                <button type="button" id="balanceSalesBtn" class="btn btn-primary">提交</button>
			                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
			            </div>
			        </div>
			    </div>
			</div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/selectionItem.js']);
</script>
