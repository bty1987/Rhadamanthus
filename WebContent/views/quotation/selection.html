<div id="selectionModule"  class="page-content">
    <div class="col-xs-12">

        <!-- 左上角合计 -->
        <div class="col-xs-12 col-md-2">
            <div class="widget-box  transparent">
                <div class="widget-header">
                    <h4 id="quotationName">选材单总额信息</h4>
                </div>

                <div class="widget-body">
                    <div class="widget-main">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label class=" col-md-6  no-padding-right">总价</label>
                                    <label id="total" class=" col-md-4  no-padding-left">0.00</label>
                                </div>
                                <div class="form-group">
                                    <label class=" col-md-6  no-padding-right">报价总价</label>
                                    <label id="quotationTotal" class=" col-md-4  no-padding-left">0.00</label>
                                </div>
                                <div class="form-group">
                                    <label class=" col-md-6  no-padding-right">拓展增总价</label>
                                    <label id="extensionAddTotal" class=" col-md-4  no-padding-left">0.00</label>
                                </div>
                                <div class="form-group">
                                    <label class=" col-md-6  no-padding-right">拓展减总价</label>
                                    <label id="extensionReduceTotal" class=" col-md-4  no-padding-left">0.00</label>
                                </div>
                                <div class="form-group">
                                    <label class=" col-md-6  no-padding-right">增减增总价</label>
                                    <label id="addReduceAddTotal" class=" col-md-4  no-padding-left">0.00</label>
                                </div>
                                <div class="form-group">
                                    <label class="col-md-6 no-padding-right">增减减总价</label>
                                    <label id="addReduceMinusTotal" class="col-md-6 no-padding-left">0.00</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--左下角按钮-->
        <div class="col-xs-12 col-md-2" style="position:fixed; bottom:10px; background-color: white;">
            <div class="col-md-12">
                <div class="ui-pg-div">
                    <button id="saveSelectionBtn" class="btn btn-minier btn-inverse col-md-3" data-loading-text="Loading...">
                        <i class="icon-save"></i>保存
                    </button>
                    <button id="returnBtn" class="btn btn-minier btn-info col-md-3" style="margin-left: 2px;">
                        <i class="icon-mail-forward"></i>返回
                    </button>
                </div>
            </div>
        </div>

        <!-- 右边项目项 -->
        <div class="col-xs-12 col-md-10" style="border-width: 0 0 0 1px;border-style: solid; border-color: #c1c1c1;">
            <div class="row clearfix">
                <div class="col-xs-12 col-md-12" id="quotationItemList"></div>
                <div class="col-xs-12 col-md-12" id="extensionAddItemList"></div>
                <div class="col-xs-12 col-md-12" id="extensionReduceItemList"></div>
                <div class="col-xs-12 col-md-12" id="addReduceAddItemList"></div>
                <div class="col-xs-12 col-md-12" id="addReduceReduceItemList"></div>

            </div>
        </div>

        <!-- 选材按钮弹窗 -->
        <div class="modal fade" id="addSelectionItemModal" tabindex="-1">
            <div class="modal-dialog" style="margin-top: 10%;">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                        <h4 class="modal-title" id="SaveModal">添加选材项</h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal">
                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="goodsName">商品</label>
                                <div class="col-sm-4">
                                    <select class="form-control v_required" id="goodsName" data-toggle="popover" data-trigger='manual'></select>
                                </div>
                            </div>
                        </form>

                    </div>
                    <div class="modal-footer">
                        <button type="button" id="addSelectionItemBtn" class="btn btn-primary">保存</button>
                        <button type="button" id="addSelectionItemCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                    </div>
                </div>
            </div>
        </div>


    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/selection.js']);
</script>
