
<div id="quotationIndexPageContent" class="page-content">

			<a href="#" id="createQuotation" class="btn btn-default btn-app btn-sm radius-4" style="padding: 5px 0;">
				<i class="icon-plus-sign bigger-230"></i>
				<span>创建</span>
			</a>

			<a href="#" id="replicaQuotation" class="btn btn-success btn-app btn-sm radius-4" style="padding: 5px 0;">
				<i class="icon-hdd bigger-230"></i>
				<span>拷贝报价</span>
			</a>

			<a href="#" id="compareQuotation" class="btn btn-yellow btn-app btn-sm radius-4 hide" style="padding: 5px 0;">

				<span>对比</span>
			</a>

			<a href="#" id="btnBack" class="btn btn-info btn-app btn-sm radius-4" style="padding: 5px 0;">
				<i class="icon-mail-forward bigger-230"></i>
				<span>返回</span>
			</a>
		</div>
        
	</div>
	
	<div class="row">
		<div class="col-xs-12">

			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件 -->

        	<div id="pagenation" class="fl-page-wrap clearfix"></div> <!-- 分页 -->
		</div>
	</div>

	<div class="modal fade" id="quotationModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="quotationDialog">报价</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div id="createOredrIdGroup">
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="createOredrId">目标单号</label>
								<div class="col-sm-9">
									<input type="text" id="createOredrId" class="col-xs-10 col-sm-5 v_required v_name"  maxlength='15'/>
								</div>
							</div>
							<div class="space-4"></div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_required v_name"  maxlength='15'/>
								<input type="text" id="qid" class="col-xs-10 col-sm-5 hide"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="style">装修风格</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="style" data-toggle="popover" data-trigger='manual'>
									<option value="现代简约" selected="selected">现代简约</option>
									<option value="中式">中式</option>
									<option value="欧式">欧式</option>
									<option value="田园">田园</option>
									<option value="日式">日式</option>
									<option value="东南亚">东南亚</option>
									<option value="地中海">地中海</option>
									<option value="美式">美式</option>
									<option value="其他">其他</option>
								</select>
							</div>
						</div>

						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="content">备注</label>
							<div class="col-sm-9">
								<textarea id="content" class="col-xs-10 col-sm-5 v_name" rows="3" data-toggle="popover" data-trigger='manual'  maxlength='25'></textarea>
							</div>
						</div>
						<div class="space-4"></div>

						<div id="keepriceGroup">
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="quotationTime">保价时间</label>
								<div class="col-sm-9">
									<input type="checkbox" id="quotationTime" class="ace"/>
									<span class="lbl status-lbl"></span>
								</div>
							</div>
							<div class="space-4"></div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="quotationPrice">保价价格</label>
								<div class="col-sm-9">
									<input type="checkbox" id="quotationPrice" class="ace" disabled="disabled"/>
									<span class="lbl status-lbl"></span>
								</div>
							</div>
							<div class="space-4"></div>
						</div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

								</div>

						<div id="bOrderId" class="hide">

								<label class="col-sm-3 control-label no-padding-right" for="replicaOrderId">装修单号</label>

									</select>
								</div>
							</div>
						</div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="quotationTime">保价时间</label>
                            <div class="col-sm-9">
                                <input type="checkbox" id="quotationTime" class="ace"/>
                                <span class="lbl status-lbl"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="quotationPrice">保价价格</label>
                            <div class="col-sm-9">
                                <input type="checkbox" id="quotationPrice" class="ace" disabled="disabled"/>
                                <span class="lbl status-lbl"></span>
                            </div>
                        </div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="replicaBtn" class="btn btn-primary">保存</button>
					<button type="button" id="rcancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>

			</div>

</div>
