<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="addItemModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="addItemDialog">报价项信息</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<input type="text" id="sdiId" class="hide" />
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="itemId">编号</label>
							<div class="col-sm-9">
								<input type="text" id="itemId" class="col-xs-10 col-sm-5 v_required v_itemId" data-toggle="popover" data-trigger='manual' maxlength="8"/>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="itemName">名称</label>
							<div class="col-sm-9">
								<input type="text" id="itemName" class="col-xs-10 col-sm-5 v_required"  data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationBigCategory">大类</label>
							<div class="col-sm-3">
								<select class="form-control v_required" id="quotationBigCategory" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="measurementUnit">单位</label>
							<div class="col-sm-3">
								<select class="form-control v_required" id="measurementUnit" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="itemWorkType">工种</label>
							<div class="col-sm-3">
								<select class="form-control v_required" id="itemWorkType" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationItemDes">信息</label>
							<div class="col-sm-9">
								<textarea id="quotationItemDes" class="col-xs-10 col-sm-5 v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="500"></textarea>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="unitPrice">单价</label>
							<div class="col-sm-9">
								<input type="text" id="unitPrice" class="col-xs-10 col-sm-5 v_required v_float" data-toggle="popover" data-trigger='manual' maxlength="5"/>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveAddItemBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelAddItemBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script src="./js/quotation/systemDefineItem.js"></script>
