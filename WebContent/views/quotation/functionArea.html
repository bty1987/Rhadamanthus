
<div>
	<div id="functionAreaList" class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div id="functionAreaQuotationItemList" class="row hide">
	   <div id="fl-statement"></div>
		<div  class="col-xs-12">
			<input type="text" id="selectFunctionAreaId" class="hide">
            <input type="text" id="selectVersionId" class="hide">
            <div id="itemList"></div>
            <h3 id="itemBtns">
                <a id="addBtn" class="btn btn-minier btn-success"><i class="icon-plus bigger-110"></i>添加</a>
                <a id="delBtn" class="btn btn-minier btn-danger"><i class="icon-trash bigger-110"></i>删除</a>
                <a id="btnBack" class="btn btn-minier btn-primary"><i class="icon-mail-forward bigger-110"></i>返回</a>
            </h3>
		</div>
	</div>

	<div class="modal fade" id="functionAreaModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="functionAreaDialog">功能区</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaId">编号</label>
							<div class="col-sm-9">
								<input type="text" id="faId" class="col-xs-10 col-sm-5 hide" />
								<input type="text" id="functionAreaId" class="col-xs-10 col-sm-5 v_required v_functionAreaId" data-toggle="popover" data-trigger='manual' maxlength='5'/>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="versionId">报价版本</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="versionId" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaName">名称</label>
							<div class="col-sm-9">
								<input type="text" id="functionAreaName" class="col-xs-10 col-sm-5 v_required v_name" data-toggle="popover" data-trigger='manual' maxlength='10'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaType">类型</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="functionAreaType" data-toggle="popover" data-trigger='manual'>
								<option value="普通" selected="selected">普通 </option>
								<option value="一次性包死">一次性包死</option>
								<option value="综合项目">综合项目</option>
								<option value="管理费">管理费</option>
								</select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaOrder">排序</label>
							<div class="col-sm-9">
								<input type="text" id="functionAreaOrder" class="col-xs-10 col-sm-5 v_required v_number"  data-toggle="popover" data-trigger='manual' maxlength='5'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaType">类型</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="type" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaOrder">总价</label>
							<div class="col-sm-9">
								<input type="text" id="total" class="col-xs-10 col-sm-5 v_number" data-toggle="popover" data-trigger='manual' maxlength='5' value='0'/>
							</div>
						</div>
						<div class="space-4"></div>
						
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="selectItemModal" tabindex="-1">
		<div class="modal-dialog" style="width:900px;">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="selectItemDialog">选择报价项目</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<div id="quoCondList" class="fl_search clearfix"></div> <!-- 查询条件-->
						<div id="quoResultList" class="clearfix tab-pane active"></div> <!--查询结果-->
						<div id="quoPagenation" class="fl-page-wrap clearfix" style="text-align: center;max-width: 680px;"></div> <!--分页-->
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveSelectItemBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelSelectItemBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/quotation/functionArea.js']);
</script>
