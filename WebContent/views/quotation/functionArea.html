
<div>
	<div id="functionAreaList" class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="functionAreaModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="functionAreaDialog" data-i18n="page.quotation.label.functionArea">功能区</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaId" data-i18n="page.quotation.label.number">编号</label>
							<div class="col-sm-9">
								<input type="text" id="faid" class="col-xs-10 col-sm-5 hide" />
								<input type="text" id="no" class="col-xs-10 col-sm-5 v_required v_functionArea_no" data-toggle="popover" data-trigger='manual' maxlength='5'/>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="versionId" data-i18n="page.quotation.label.quotationVersion">报价版本</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="versionId" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaName" data-i18n="page.quotation.label.name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_required v_name" data-toggle="popover" data-trigger='manual' maxlength='10'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaType">功能区类型</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5" id="functionAreaType" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="functionAreaOrder" data-i18n="page.quotation.label.sort">排序</label>
							<div class="col-sm-9">
								<input type="text" id="functionAreaOrder" class="col-xs-10 col-sm-5 v_required v_number"  data-toggle="popover" data-trigger='manual' maxlength='5'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="type" data-i18n="page.quotation.label.type">类型</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="type" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="total" data-i18n="page.quotation.label.totalPrice">总价</label>
							<div class="col-sm-9">
								<input type="text" id="total" class="col-xs-10 col-sm-5 v_number" data-toggle="popover" data-trigger='manual' maxlength='5' value='0'/>
							</div>
						</div>
						<div class="space-4"></div>
						
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="functionAreaOtemModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">量房参数</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-horizontal" id="itemlist"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="textBtn" class="btn btn-primary btn-success">文本</button>
					<button type="button" id="radioBtn" class="btn btn-primary btn-warning">单选</button>
					<button type="button" id="checkBtn" class="btn btn-primary btn-inverse">多选</button>
					<button type="button" id="inputBtn" class="btn btn-primary btn-pink">输入框</button>
					<button type="button" id="saveOtemBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
				</div>
			</div>
		</div>
	</div>

</div>

<div id="functionAreaItemPopUp" class="portlet box"></div>

<script type="text/javascript">
	$.loadScript(['js/quotation/functionArea.js']);
</script>
