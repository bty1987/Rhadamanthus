<div id="quotationRefund" class="page-content">
	<div class="row">
		<div id="quotationReFundList">
			<div  class="col-xs-12">
				<div id="condList" class="fl_search clearfix"></div>
				<div id="resultList" class="clearfix tab-pane active"></div>
				<div id="pagenation" class="fl-page-wrap clearfix"></div>
			</div>
		</div>
	</div>

	<!--增加报退单-->
	<div class="modal fade" id="addQuotationRefundModal" tabindex="-1" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">退报单创建</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="replicaOrderId">装修单号</label>
							<div class="col-sm-9">
								<input type="text" id="replicaOrderId" class="col-xs-10 col-sm-5 v_required v_name"  maxlength='15'/>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="replicaQuotation">报价名称</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="replicaQuotation" data-toggle="popover" data-trigger='manual'>
								</select>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="comment">说明</label>
							<div class="col-sm-9">
								<textarea id="comment" class="col-xs-10 col-sm-5 v_name" rows="3" data-toggle="popover" data-trigger='manual'  maxlength='64'></textarea>
							</div>
						</div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="saveQuotationRefundBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
<script type="text/javascript">
    $.loadScript(['js/quotation/quotationRefundIndex.js']);
</script>
