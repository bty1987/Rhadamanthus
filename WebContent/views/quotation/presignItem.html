<div id="presignItem">
    <div class="row">
        <div id="condList1" class="fl_search clearfix"></div> <!-- 查询条件-->
        <div id="resultList1" class="clearfix tab-pane"></div> <!--查询结果-->
        <div id="pagenation1" class="fl-page-wrap clearfix"></div> <!--分页-->
    </div>

    <div class="modal fade" id="createPresignItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addPresignItem">预签项</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="name" data-i18n="page.quotation.label.name">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="name" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="basicNum">基础量</label>
                            <div class="col-sm-9">
                                <input type="text" id="basicNum" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="cost" data-i18n="page.quotation.label.cost">成本</label>
                            <div class="col-sm-9">
                                <input type="text" id="cost" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="price" data-i18n="page.quotation.label.price">价格</label>
                            <div class="col-sm-9">
                                <input type="text" id="price" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="addPrice" data-i18n="page.quotation.label.addPrice">增补价</label>
                            <div class="col-sm-9">
                                <input type="text" id="addPrice" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="subPrice" data-i18n="page.quotation.label.reducePrice">退减价</label>
                            <div class="col-sm-9">
                                <input type="text" id="subPrice" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">面积规则</label>
                            <div class="col-sm-9">
                                <input type="radio" id="number" name="areaCale" class="ace"/>
                                <span class="lbl"></span>
                                <label data-i18n="page.quotation.label.num">数量</label>
                            
                                <input type="radio" id="area" name="areaCale" class="ace"/>
                                <span class="lbl"></span>
                                <label data-i18n="page.quotation.label.area">面积</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="type" data-i18n="page.quotation.label.type">类型</label>
                            <div class="col-sm-9">
                                <select id="type" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="onetype">一类</label>
                            <div class="col-sm-9">
                                <select id="onetype" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>

                         <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="atttype">业务类型</label>
                            <div class="col-sm-9">
                                <select id="atttype" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="content" data-i18n="page.quotation.label.explain">说明</label>
                            <div class="col-sm-9">
                                <input type="text" id="content" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="512"/>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="savePresignItemBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/presignItem.js']);
</script>
