<div id="presignItem" class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList1" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList1" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation1" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="createPresignItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addPresignItem">预签项</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="name">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="name" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="basicNum">基础量</label>
                            <div class="col-sm-9">
                                <input type="text" id="basicNum" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="cost">成本</label>
                            <div class="col-sm-9">
                                <input type="text" id="cost" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="price">价格</label>
                            <div class="col-sm-9">
                                <input type="text" id="price" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="type">类型</label>
                            <div class="col-sm-9">
                                <select id="type" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="onetype">一类</label>
                            <div class="col-sm-9">
                                <select id="onetype" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'>
									<option value="0">普通</option>
									<option value="1">标配</option>
								</select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="savePresignItemBtn" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/presignItem.js']);
</script>
