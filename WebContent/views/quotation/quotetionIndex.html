
<div id="quotetionIndexPageContent" class="page-content">

    <div id="quotetion-statement"></div>

    <div class="clearfix" id="quotetionContent">
        <div class="col-xs-6">
            <a href="#" id="createQuotetionBtn" class="btn btn-default btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-plus-sign bigger-230"></i>
                <span data-i18n="page.quotation.btn.create">创建</span>
            </a>

            <a href="#" id="copyQuotetionBtn" class="btn btn-success btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-hdd bigger-230"></i>
                <span>预报拷贝</span>
            </a>

            <a href="#" id="copyOwnQuotetionBtn" class="btn btn-success btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-user bigger-230"></i>
                <span>报价拷贝</span>
            </a>

            <a href="#" id="copyOtherQuotetionBtn" class="btn btn-success btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-group bigger-230"></i>
                <span>报价拷贝</span>
            </a>

            <a href="#" id="compareQuotetionBtn" class="btn btn-info btn-app btn-sm radius-4 hide" style="padding: 5px 0;">

        </div>

    <div class="row">
        <div class="col-xs-12">
            <div class="" id="quotetionList"></div>

        	<div id="pagenation" class="fl-page-wrap clearfix"></div> <!-- 分页 -->
        </div>
    </div>

    <div class="hr hr32 hr-dotted"></div>

    <div class="modal fade" id="updateQuotetionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="quotetionDialog">报价</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="name" data-i18n="page.quotation.label.name">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="name" class="col-xs-10 col-sm-5 v_required v_name" maxlength='15' /> <input type="text" id="quotetionid" class="col-xs-10 col-sm-5 hide" />
                            </div>
                        </div>

                        <div class="form-group" id="version">
                            <label class="col-sm-3 control-label no-padding-right" for="quotationVersion" data-i18n="page.quotation.label.quotationVersion">报价版本</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-5 v_required" id="quotationVersion" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="content" data-i18n="page.quotation.label.comment">备注</label>
                            <div class="col-sm-9">
                                <textarea id="content" class="col-xs-10 col-sm-5 v_name" rows="3" data-toggle="popover" data-trigger='manual' maxlength='25'></textarea>
                            </div>
                        </div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="updateQuotetionBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="replicaQuotetionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="replicaQuotetionDialog" data-i18n="page.quotation.title.copyQuotation">拷贝报价</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="replicaType">拷贝类型</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-5 v_required" id="replicaType" data-toggle="popover" data-trigger='manual'>
                                </select>
                            </div>
                        </div>

                        <div id="replicaQuotetionNo" class="hide">
                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="quotetionNo" data-i18n="page.quotation.label.quotationNo">报价编号</label>
                                <div class="col-sm-9">
                                    <input type="text" id="quotetionNo" class="col-xs-10 col-sm-5 v_required v_name" maxlength='50' />
                                </div>
                            </div>
                        </div>

                        <div id="cloneOrderId" class="hide">
                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="replicaOrderId" data-i18n="page.quotation.label.orderNo">装修单号</label>
                                <div class="col-sm-9">
                                    <input type="text" id="replicaOrderId" class="col-xs-10 col-sm-5 v_required v_name" maxlength='15' />
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="quotation" data-i18n="page.quotation.label.quotationName">报价名称</label>
                                <div class="col-sm-9">
                                    <select class="col-xs-10 col-sm-5 v_required" id="quotation" data-toggle="popover" data-trigger='manual'>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="quotationTime" data-i18n="page.quotation.label.prepriceTime">保价时间</label>
                            <div class="col-sm-9">
                                <input type="checkbox" id="quotationTime" class="ace"/>
                                <span class="lbl status-lbl"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="quotationPrice" data-i18n="page.quotation.label.preprice">保价价格</label>
                            <div class="col-sm-9">
                                <input type="checkbox" id="quotationPrice" class="ace" disabled="disabled"/>
                                <span class="lbl status-lbl"></span>
                            </div>
                        </div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="replicaQuotetionBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>

            </div>
        </div>
    </div>
</div>
