<div class="page-content">

	<div id="functionAreaCategoryList" class="row">
		<div id="fl-statement"></div>
		<div class="col-xs-12">
			<div id="categoryCondList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="categoryPagenation" class="fl-page-wrap clearfix"></div> <!--分页/按钮条-->
			<div id="categoryResultList" class="clearfix tab-pane active"></div> <!--查询结果-->
		</div>
	</div>

	<div class="modal fade" id="categoryModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">添加品类</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="categoryId">品类</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5" id="categoryId" data-toggle="popover" data-trigger="manual"></select>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveCategoryBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="formatModal" tabindex="-1">
		<div class="modal-dialog" style="width: 720px;">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">规格维护 - <span id="formatCategoryName" class="blue"></span></h4>
				</div>
				<div class="modal-body">
					<ul class="list-unstyled spaced" style="margin-bottom: 6px;">
						<li class="text-warning orange">
							<span>支持参数包括: {a}周长 , {b}面积 , {c}举架 , {d}洞面长 , {e}洞面高 , {f}窗面长 , {g}窗面高 , {h}梁长 , {i}梁高 (取自报价功能区参数, 长度单位毫米, 面积单位平方毫米, 如 {b}/1000000 为平方米)</span>
						</li>
						<li class="text-warning orange">
							<span>支持运算符号包括: + , - , * , / , ( , ) ; 取整: !( 公式 ) , 同时支持数字作为运算元素</span>
						</li>
					</ul>
					<table id="formatList" class="table table-striped table-bordered table-hover" style="margin-bottom: 0;">
						<thead>
							<tr>
								<th style="width: 30%;">规格</th>
								<th style="width: 30%;">公式</th>
								<th>备注</th>
								<th style="width: 130px;">操作</th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
				</div>
			</div>
		</div>
	</div>

</div>

<style type="text/css">
	#formatList .cell-input {
		width: 100%; height: auto; padding: 0; margin: 0;
		border: none; background: transparent; box-shadow: none; outline: none;
	}
	#formatList .cell-input:focus {
		background: #f4f9fd; box-shadow: 0 1px 0 #6fb3e0;
	}
	#formatList .add-row td {
		background: #fcfcfc;
		border-top: 1px dashed #ddd;
	}
</style>

<script type="text/javascript">
	$.loadScript(['js/quotation/functionAreaCategory.js']);
</script>
