<div id="presignProduce">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="createPresignProduceModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="addItemDialog">预签产品</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="version">版本</label>
                            <div class="col-sm-9">
                                <select id="version" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="quotePrice">起报价</label>
							<div class="col-sm-9">
								<input type="text" id="quotePrice" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="discount">折扣</label>
							<div class="col-sm-9">
								<input type="text" id="discount" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="manageRate">管理费比例</label>
							<div class="col-sm-9">
								<input type="text" id="manageRate" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="manageFormula">管理费公式</label>
							<div class="col-sm-9">
								<textarea rows="5" maxlength="64" id="manageFormula" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>

						<div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="comment">管理费说明</label>
                            <div class="col-sm-9">
                                <ul class="list-unstyled col-xs-10 col-sm-10">
                                    <li class="text-warning orange">
                                        <span>支持参数包括: 起报价 , 优惠额 , 功能区 , 个性 , 减项 , 赋能, 特殊优惠</span>
                                    </li>
                                    <li class="text-warning orange">
                                        <span>支持运算符号包括: + , - , * , / , ( , )</span>
                                    </li>
                                    <li class="text-warning orange">
                                        <span>同时支持数字作为运算元素</span>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="manageDiscount">管理费折扣</label>
                            <div class="col-sm-9">
                                <input type="checkbox" id="manageDiscount" class="ace"/>
                                <span class="lbl discount-lbl"></span>
                            </div>
                        </div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="taxRate">税金比例</label>
							<div class="col-sm-9">
								<input type="text" id="taxRate" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="taxFormula">税金公式</label>
							<div class="col-sm-9">
								<textarea rows="5" maxlength="64" id="taxFormula" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>

						<div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taxComment">税金说明</label>
                            <div class="col-sm-9">
                                <ul class="list-unstyled col-xs-10 col-sm-10">
                                    <li class="text-warning orange">
                                        <span>支持参数包括: 起报价 , 优惠额 , 功能区 , 个性 , 减项 , 赋能, 管理费, 特殊优惠, 管理优惠</span>
                                    </li>
                                    <li class="text-warning orange">
                                        <span>支持运算符号包括: + , - , * , / , ( , )</span>
                                    </li>
                                    <li class="text-warning orange">
                                        <span>同时支持数字作为运算元素</span>
                                    </li>
                                </ul>
                            </div>
                        </div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="costPrice">成本单价</label>
							<div class="col-sm-9">
								<input type="text" id="costPrice" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="mostPrice">主材成本</label>
							<div class="col-sm-9">
								<input type="text" id="mostPrice" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="profitRate">利润率</label>
							<div class="col-sm-9">
								<input type="text" id="profitRate" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="costRate">工程增项成本比例</label>
							<div class="col-sm-9">
								<input type="text" id="costRate" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="mostRate">主材增项成本比例</label>
							<div class="col-sm-9">
								<input type="text" id="mostRate" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="offset">偏移量</label>
							<div class="col-sm-9">
								<input type="text" id="offset" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>

					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="savePresignProduceBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<div id="presignItemPopUp" class="portlet box"></div>

<script type="text/javascript">
    $.loadScript(['js/quotation/presignProduce.js']);
</script>
