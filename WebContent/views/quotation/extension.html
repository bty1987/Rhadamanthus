<div id="extensionPageContent" class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <!-- 查询条件-->
            <div id="condList" class="fl_search clearfix"></div>
            <!--查询结果-->
            <div id="resultList" class="clearfix tab-pane active"></div>

            <div>
                <h3 class="clearfix">
                    <a id="add" class="btn btn-minier btn-success pull-left" style="margin-top: 7px;margin-right:10px;"><i class="icon-plus bigger-110"></i>添加</a>
                    <a id="btnBack" class="btn btn-minier btn-primary pull-left" style="margin-top: 7px;margin-right:10px;"><i class="icon-mail-forward bigger-110"></i>返回</a>
                </h3>
            </div>
        </div>
    </div>

    <div class="modal fade" id="extensionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="extensionDialog">扩展项</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="extensionDes">描述</label>
                            <div class="col-sm-9">
                                <textarea id="extensionDes" rows="3" class="col-xs-10 col-sm-5 v_required"></textarea>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="extensionType">类别</label>
                            <div class="col-sm-9">
                                <select id="extensionType" class="col-xs-10 col-sm-5 v_required">
                                    <option value="0">增项</option>
                                    <option value="1">减项</option>
                                </select>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelAddBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/extension.js?version=' + versionCode]);
</script>
