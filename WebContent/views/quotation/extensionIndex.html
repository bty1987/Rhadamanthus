<div id="extensionPageContent" class="page-content">

    <div id="fl-statement" style="display: none;"></div>
    
    <div class="clearfix" id="decorationInfo" style="display: none;">
        <div class="col-xs-6">
            <a href="#" id="add" class="btn btn-success btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-plus-sign bigger-230"></i>
                <span data-i18n="page.quotation.btn.create">创建</span>
            </a>

            <a href="#" id="btnBack" class="btn btn-primary btn-app btn-sm radius-4" style="padding: 5px 0;">
                <i class="icon-mail-forward bigger-230"></i>
                <span data-i18n="msg.back">返回</span>
            </a>
        </div>
    </div>
    
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件 -->
            <div id="resultList" class="clearfix tab-pane active"></div>
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!-- 分页 -->
        </div>
    </div>
    
    <div class="modal fade" id="extensionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="extensionDialog" data-i18n="page.quotation.label.extensionItem">扩展项</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="extensionDes">描述</label>
                            <div class="col-sm-9">
                                <textarea id="extensionDes" rows="3" class="col-xs-10 col-sm-5 v_required"></textarea>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="extensionType" data-i18n="page.quotation.label.category">类别</label>
                            <div class="col-sm-9">
                                <select id="extensionType" class="col-xs-10 col-sm-5 v_required"></select>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="extensionAtttype">业务类型</label>
                            <div class="col-sm-9">
                                <select id="extensionAtttype" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelAddBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/extensionIndex.js']);
</script>
