<div id="quotationFormatContent" class="page-content">
    <div class="row">
        <div class="col-xs-12">
			<div id="quotationFormatCondList" class="fl_search clearfix"></div> <!-- 查询条件 -->
			<div id="quotationFormatResultList" class="clearfix tab-pane active"></div>
			<div id="quotationFormatPagenation" class="fl-page-wrap clearfix"></div> <!-- 分页 -->
			
			<div class="row" style="margin-top: 20px">
                 <div class="col-xs-12">
                      <a class="btn btn-minier btn-primary pull-left" id="addQuotationFormatBtn" style="margin-right: 10px">
                          <i class="icon-plus bigger-110"></i>
                          <span>添加</span>
                      </a>
                      <a class="btn btn-minier" id="quotationFormatBackBtn">
                          <i class="icon-mail-forward bigger-110"></i>
                          <span data-i18n="msg.back">返回</span>
                      </a>
                 </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="addQuotationFormatModal" tabindex="-1">
	    <div class="modal-dialog" style="margin-top: 10%;">
	        <div class="modal-content">
	            <div class="modal-header">
	                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
	                <h4 class="modal-title">添加规格</h4>
	            </div>
	            <div class="modal-body">
	                <form class="form-horizontal">
	                    <div class="form-group">
	                        <label class="col-sm-3 control-label no-padding-right orange" for="name" data-i18n="page.quotation.label.name">名称</label>
	                        <div class="col-sm-9">
	                            <input type="text" id="name" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" maxlength="64"/>
	                        </div>
	                    </div>
	                    
	                    <div class="form-group">
	                        <label class="col-sm-3 control-label no-padding-right orange" for="format">规格</label>
	                        <div class="col-sm-9">
	                            <input type="text" id="format" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" maxlength="64"/>
	                        </div>
	                    </div>
	                </form>
	
	            </div>
	            <div class="modal-footer">
	                <button type="button" id="quotationFormatBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
	                <button type="button" id="CancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
	            </div>
	        </div>
	    </div>
	</div>
</div>

<script type="text/javascript">
    $.loadScript(['js/quotation/quotationFormat.js']);
</script>
