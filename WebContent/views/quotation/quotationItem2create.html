<div class="row">
        <div class="col-xs-12">
            <div id="quotationItemCondList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="quotationItemResultList" class="fl-page-wrap clearfix col-xs-12"></div>
            <div id="quotationItemPagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
</div>


<div class="modal fade" id="quotationItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content col-md-12">
            <div class="modal-header">
                <h4 class="modal-title" id="quotationItemDialog">项目</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="itemId">编号</label>
                        <div class="col-sm-9">
                            <input type="text" id="qiid" class="col-xs-10 col-sm-5 hide"/>
                            <input type="text" id="no" class="col-xs-10 col-sm-5 v_quotation_no v_required"
                                   data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="quotationType">类型</label>
                        <div class="col-sm-9">
                            <select class="col-xs-10 col-sm-5 v_required" id="quotationType" data-toggle="popover"
                                    data-trigger='manual'></select>
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right orange">商品名称</label>
                        <div class="col-md-9">
                            <input type="text" class="col-xs-10 col-sm-7 v_required" id="goodsname" name="name" data-required="1" data-toggle="popover" data-trigger='manual' >
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right orange">商品品牌</label>
                        <div class="col-md-9">
                            <input type="text" autocomplete="off" id="brand" class="col-xs-10 col-sm-7 editable v_required">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right">商品辅类</label>
                        <div class="col-md-9">
                            <select class="col-xs-10 col-sm-7" id="accessoriesType" name="accessoriesType" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>
                    <div class="space-4"></div>

                </form>
            </div>
        </div>
    </div>
</div>



<script type="text/javascript" >
    $.loadScript(['js/quotation/quotationItem2create.js']);
</script>
