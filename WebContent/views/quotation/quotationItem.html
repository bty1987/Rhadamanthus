
<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="quotationItemModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="quotationItemDialog">报价项</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group" style="display: none;">
							<label class="col-sm-2 control-label no-padding-right" for="itemId">编号</label>
							<div class="col-sm-10">
								<input type="text" id="qiid" class="col-xs-10 col-sm-5 hide" />
								<input type="text" id="no" class="col-xs-10 col-sm-5 v_quotation_no v_required" data-toggle="popover" data-trigger='manual' maxlength="8"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="version">版本</label>
							<div class="col-sm-10">
								<select class="col-xs-10 col-sm-5 v_required" id="version" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="itemName">名称</label>
							<div class="col-sm-10">
								<input type="text" id="name" class="col-xs-12 col-sm-10 v_required" data-toggle="popover" data-trigger='manual' maxlength="128"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="alias">别名</label>
							<div class="col-sm-10">
								<input type="text" id="alias" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="128"/>
							</div>
						</div>
						<div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-2 control-label no-padding-right" for="type">业务</label>
                            <div class="col-sm-10">
                                <select class="col-xs-10 col-sm-5 v_required" id="type" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="quotationType">类型</label>
							<div class="col-sm-10">
								<select class="col-xs-10 col-sm-5 v_required" id="quotationType" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="quotationClassification">分类</label>
							<div class="col-sm-10">
								<select class="col-xs-10 col-sm-5 v_required" id="quotationClassification" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="quotationBigCategory">大类</label>
							<div class="col-sm-10">
								<select class="col-xs-10 col-sm-5 v_required" id="quotationBigCategory" data-toggle="popover" data-trigger='manual'>
									<option>请选择类型</option>
								</select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="quotationSmallCategory">小类</label>
							<div class="col-sm-10">
								<select class="col-xs-10 col-sm-5 v_required" id="quotationSmallCategory" data-toggle="popover" data-trigger='manual'>
									<option>请选择类型</option>
								</select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="measurementUnit">单位</label>
							<div class="col-sm-10">
								<select class="col-xs-10 col-sm-5 v_required" id="measurementUnit" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="workType">工种</label>
							<div class="col-sm-10">
								<select class="col-xs-10 col-sm-5 v_required" id="workType" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="comment">信息</label>
							<div class="col-sm-10">
								<textarea id="comment" class="col-xs-10 col-sm-5 v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="500"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="addPrice">增补价</label>
							<div class="col-sm-10">
								<input type="text" id="addPrice" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="unitPrice">单价</label>
							<div class="col-sm-10">
								<input type="text" id="unitPrice" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="subPrice">退减价</label>
							<div class="col-sm-10">
								<input type="text" id="subPrice" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="achePrices">业绩额</label>
							<div class="col-sm-10">
								<input type="text" id="achePrices" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
							</div>
						</div>
						<div class="space-4"></div>

					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
    
    <div class="modal fade" id="selectItemModal" tabindex="-1">
        <div class="modal-dialog" style="width:900px;">
            <div class="modal-content col-md-12">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="selectItemDialog">选择报价项目</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div id="quoCondList" class="fl_search clearfix"></div> <!-- 查询条件-->
                        <div id="quoResultList" class="clearfix tab-pane active"></div> <!--查询结果-->
                        <div id="quoPagenation" class="fl-page-wrap clearfix" style="text-align: center;max-width: 680px;"></div> <!--分页-->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="cancelSelectItemBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

	<div class="modal fade" id="importModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title">导入</h4>
					<h6><span style="color: purple;padding: 10px">每张表第一列不在上传内容中</span></h6>
					<h6><span style="color: purple;padding: 10px"> 上传格式: 序号 编号 版本 名称 类型 分类 大类 小类 单位 工种 说明 增补价 单价 退减价 状态	折扣</span></h6>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" >
						<div class="form-group">
							<div class="col-sm-12" id="import"></div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="updateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="functionAreaDialog">更新</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="formula">公式</label>
							<div class="col-sm-9">
								<textarea rows="10" maxlength="64" id="formula" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>
						<div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="comment">说明</label>
                            <div class="col-sm-9">
                                <ul class="list-unstyled spaced col-xs-12 col-sm-9">
                                    <li class="text-warning orange">
                                        <span>支持参数包括: 周长 , 面积 , 举架 , 洞面 , 窗面 , 梁长 , 梁高, 参数 , 变量, 税金, 管理费, 不打折总额, 打折总额, 车运费, 楼层, 电梯, 计价面积, 反计价面积</span>
                                    </li>
                                    <li class="text-warning orange">
                                        <span>支持运算符号包括: + , - , * , / , ( , ) , |, ~</span>
                                    </li>
                                    <li class="text-warning orange">
                                        <span>支持取整: 取整(公式)</span>
                                    </li>
                                    <li class="text-warning orange">
                                        <span>同时支持数字作为运算元素</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div class="space-4"></div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btnUpdate" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="updateCostModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">成本</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="cost">成本</label>
							<div class="col-sm-9">
								<input type="text" id="cost" class="col-xs-10 col-sm-6 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="achePrice">业绩额</label>
							<div class="col-sm-9">
								<input type="text" id="achePrice" class="col-xs-10 col-sm-6 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
							</div>
						</div>
						<div class="space-4"></div>

					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="updateCostBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<div id="createSoodsPopUp" class="portlet box"></div>
<div id="normoodPopUp" class="portlet box"></div>
<div id="normricePopUp" class="portlet box"></div>
<div id="normtimePopUp" class="portlet box"></div>
<div id="quotationPricePopUp" class="portlet box"></div>
<div id="quotationRtemPopUp" class="portlet box"></div>

	$.loadScript(['js/quotation/quotationItem.js?version=' + versionCode]);
</script>
