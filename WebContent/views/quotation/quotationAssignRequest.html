<div class="page-content">
	<!-- 统计卡片 -->
	<div class="row">
		<div class="col-xs-12">
			<div class="alert alert-info">
				<i class="icon-info-sign"></i>
				<strong>队列统计：</strong>
				待处理 <span id="pendingCount" class="badge badge-warning">0</span> |
				处理中 <span id="processingCount" class="badge badge-info">0</span> |
				今日已分配 <span id="todayAssignedCount" class="badge badge-success">0</span> |
				平均等待时间 <span id="avgWaitTime" class="badge">0</span> 分钟
			</div>
		</div>
	</div>

	<!-- 工具栏 -->
	<div class="row">
		<div class="col-xs-12">
			<button id="refreshBtn" class="btn btn-sm btn-primary">
				<i class="icon-refresh"></i> 刷新
			</button>
			<button id="batchProcessBtn" class="btn btn-sm btn-success">
				<i class="icon-check"></i> 批量处理
			</button>
			<button id="batchCancelBtn" class="btn btn-sm btn-danger">
				<i class="icon-remove"></i> 批量取消
			</button>
			<button id="clearCompletedBtn" class="btn btn-sm btn-default">
				<i class="icon-trash"></i> 清除已完成(7天前)
			</button>
		</div>
	</div>

	<!-- 查询条件 -->
	<div class="row search-row">
		<div class="col-xs-12">
			<div class="form-inline">
				<label>状态:</label>
				<select id="statusSelect">
					<option value="">全部</option>
					<option value="1">待处理</option>
					<option value="2">处理中</option>
					<option value="3">已完成</option>
					<option value="4">已取消</option>
				</select>

				<label>优先级:</label>
				<select id="prioritySelect">
					<option value="">全部</option>
					<option value="1">最高</option>
					<option value="2">高</option>
					<option value="3">普通</option>
					<option value="4">低</option>
				</select>

				<label>订单编号:</label>
				<input type="text" id="orderId" placeholder="请输入订单编号">

				<button id="searchBtn" class="btn btn-sm btn-primary">
					<i class="icon-search"></i> 查询
				</button>
			</div>
		</div>
	</div>

	<!-- 数据表格 -->
	<div class="row">
		<div class="col-xs-12">
			<table id="dataTable" class="table table-striped table-bordered table-hover">
				<thead>
					<tr>
						<th><input type="checkbox" id="selectAll"></th>
						<th>订单编号</th>
						<th>客户姓名</th>
						<th>装修类型</th>
						<th>优先级</th>
						<th>状态</th>
						<th>请求时间</th>
						<th>等待时长</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody id="dataBody"></tbody>
			</table>
		</div>
	</div>

	<!-- 分页 -->
	<div class="row">
		<div class="col-xs-12">
			<div id="pagination"></div>
		</div>
	</div>
</div>

<!-- 手动处理对话框 -->
<div class="modal fade" id="processModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span>&times;</span>
				</button>
				<h4 class="modal-title">手动分配预算员</h4>
			</div>
			<div class="modal-body">
				<form id="processForm" class="form-horizontal">
					<input type="hidden" id="processBarid">
					<input type="hidden" id="processOrderId">

					<div class="form-group">
						<label class="col-sm-3 control-label">订单编号</label>
						<div class="col-sm-9">
							<p class="form-control-static" id="displayOrderId"></p>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label">预算员<span class="required">*</span></label>
						<div class="col-sm-9">
							<select id="budgetUserId" class="form-control chosen-select" required>
								<option value="">请选择预算员</option>
							</select>
							<span class="help-block">仅显示当前可用的预算员</span>
						</div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				<button type="button" class="btn btn-primary" id="confirmProcessBtn">确认分配</button>
			</div>
		</div>
	</div>
</div>

<!-- 优先级调整对话框 -->
<div class="modal fade" id="priorityModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span>&times;</span>
				</button>
				<h4 class="modal-title">调整优先级</h4>
			</div>
			<div class="modal-body">
				<form id="priorityForm" class="form-horizontal">
					<input type="hidden" id="priorityBarid">

					<div class="form-group">
						<label class="col-sm-3 control-label">订单编号</label>
						<div class="col-sm-9">
							<p class="form-control-static" id="priorityOrderId"></p>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label">优先级<span class="required">*</span></label>
						<div class="col-sm-9">
							<select id="prioritySelect" class="form-control">
								<option value="1">最高 - 紧急订单</option>
								<option value="2">高 - VIP客户</option>
								<option value="3">普通 - 常规订单</option>
								<option value="4">低 - 非紧急</option>
							</select>
						</div>
					</div>

					<div class="form-group">
						<div class="col-sm-offset-3 col-sm-9">
							<div class="alert alert-warning">
								<i class="icon-warning-sign"></i>
								注意：优先级调整后，该订单会在相应优先级队列中按请求时间排序
							</div>
						</div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				<button type="button" class="btn btn-primary" id="confirmPriorityBtn">确认</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/quotation/quotationAssignRequest.js']);
</script>
