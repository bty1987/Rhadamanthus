<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <!-- 新增/编辑弹窗 -->
    <div class="modal fade" id="requestModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="modalTitle">新增分配请求</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <input type="hidden" id="qarid">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="orderId">装修单号</label>
                            <div class="col-sm-9">
                                <input type="text" id="orderId" class="col-xs-10 col-sm-8 v_required">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="company">公司</label>
                            <div class="col-sm-9">
                                <select id="company" class="col-xs-10 col-sm-8 v_required"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="department">部门</label>
                            <div class="col-sm-9">
                                <select id="department" class="col-xs-10 col-sm-8"></select>
                                <span class="help-block" style="margin-bottom: 0;">留空表示该公司所有部门</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="decorationType">装修类型</label>
                            <div class="col-sm-9">
                                <select id="decorationType" class="col-xs-10 col-sm-8 v_required"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="priority">优先级</label>
                            <div class="col-sm-9">
                                <select id="priority" class="col-xs-10 col-sm-8 v_required"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="requestUser">请求人</label>
                            <div class="col-sm-9">
                                <input type="text" id="requestUser" class="col-xs-10 col-sm-8" placeholder="输入拼音或姓名搜索">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="remark">备注</label>
                            <div class="col-sm-9">
                                <textarea id="remark" class="col-xs-10 col-sm-8" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    //$.loadScript(['js/quotation/quotationAssignRequest.js']);
</script>
