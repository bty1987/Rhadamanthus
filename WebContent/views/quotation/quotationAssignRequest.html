<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <!-- 新增/编辑弹窗 -->
    <div class="modal fade" id="requestModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="modalTitle">新增分配请求</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <input type="hidden" id="qarid">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="orderId" data-i18n="page.quotation.label.orderNo">装修单号</label>
                            <div class="col-sm-9">
                                <input type="text" id="orderId" class="col-xs-10 col-sm-8 v_required">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="company" data-i18n="page.quotation.label.company">公司</label>
                            <div class="col-sm-9">
                                <select id="company" class="col-xs-10 col-sm-8 v_required"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="department">部门</label>
                            <div class="col-sm-9">
                                <select id="department" class="col-xs-10 col-sm-8"></select>
                                <span class="help-block" style="margin-bottom: 0;">留空表示该公司所有部门</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="decorationType" data-i18n="page.quotation.label.decorationType">装修类型</label>
                            <div class="col-sm-9">
                                <select id="decorationType" class="col-xs-10 col-sm-8 v_required"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="priority">优先级</label>
                            <div class="col-sm-9">
                                <select id="priority" class="col-xs-10 col-sm-8 v_required"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="requestUser">请求人</label>
                            <div class="col-sm-9">
                                <input type="text" id="requestUser" class="col-xs-10 col-sm-8" placeholder="输入拼音或姓名搜索" data-i18n-ph="page.quotation.ph.searchByNameAlt">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="remark" data-i18n="page.quotation.label.comment">备注</label>
                            <div class="col-sm-9">
                                <textarea id="remark" class="col-xs-10 col-sm-8" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 手动分配弹窗 -->
    <div class="modal fade" id="manualAssignModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">手动分配预算员</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <input type="hidden" id="manualAssignOrderId">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" data-i18n="page.quotation.label.orderNo">装修单号</label>
                            <div class="col-sm-9">
                                <span id="manualAssignOrderIdDisplay" class="form-control-static"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" data-i18n="page.quotation.label.company">公司</label>
                            <div class="col-sm-9">
                                <span id="manualAssignCompanyDisplay" class="form-control-static"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" data-i18n="page.quotation.label.decorationType">装修类型</label>
                            <div class="col-sm-9">
                                <span id="manualAssignDecorationTypeDisplay" class="form-control-static"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="manualAssignBudgeter" data-i18n="page.quotation.label.budgeter">预算员 <span class="required">*</span></label>
                            <div class="col-sm-9">
                                <input type="text" id="manualAssignBudgeter" class="col-xs-10 col-sm-8 v_required" placeholder="输入拼音或姓名搜索" data-i18n-ph="page.quotation.ph.searchByNameAlt">
                                <span class="help-block" style="margin-bottom: 0;">请输入预算员姓名或拼音进行搜索</span>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="confirmManualAssignBtn" class="btn btn-purple">
                        <i class="icon-hand-right"></i> 确认分配
                    </button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 替换预算员弹窗 -->
    <div class="modal fade" id="replaceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">替换预算员</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <input type="hidden" id="replaceOrderId">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" data-i18n="page.quotation.label.orderNo">装修单号</label>
                            <div class="col-sm-9">
                                <span id="replaceOrderIdDisplay" class="form-control-static"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" data-i18n="page.quotation.label.company">公司</label>
                            <div class="col-sm-9">
                                <span id="replaceCompanyDisplay" class="form-control-static"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" data-i18n="page.quotation.label.decorationType">装修类型</label>
                            <div class="col-sm-9">
                                <span id="replaceDecorationTypeDisplay" class="form-control-static"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">当前预算员</label>
                            <div class="col-sm-9">
                                <span id="replaceCurrentBudgeterDisplay" class="form-control-static" style="color:#d15b47;font-weight:bold;"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="replaceBudgeter">新预算员 <span class="required">*</span></label>
                            <div class="col-sm-9">
                                <input type="text" id="replaceBudgeter" class="col-xs-10 col-sm-8 v_required" placeholder="输入拼音或姓名搜索" data-i18n-ph="page.quotation.ph.searchByNameAlt">
                                <span class="help-block" style="margin-bottom: 0;">请输入新预算员姓名或拼音进行搜索</span>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="confirmReplaceBtn" class="btn btn-danger">
                        <i class="icon-exchange"></i> 确认替换
                    </button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 正向自动分配弹窗 -->
    <div class="modal fade" id="autoAssignModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">
                        <i class="icon-magic bigger-120 blue"></i> 正向自动分配
                    </h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="autoAssignOrderId" data-i18n="page.quotation.label.orderNo">装修单号 <span class="required">*</span></label>
                            <div class="col-sm-9">
                                <input type="text" id="autoAssignOrderId" class="col-xs-10 col-sm-8 v_required" placeholder="输入装修单号，如：2024030001" data-i18n-ph="page.quotation.ph.orderNoExample">
                                <span class="help-block" style="margin-bottom: 0;">输入需要分配报价员的装修单号</span>
                            </div>
                        </div>

                        <div class="alert alert-info">
                            <i class="icon-info-sign"></i>
                            <strong>功能说明：</strong>
                            <ul style="margin: 5px 0 0 20px;">
                                <li>系统会根据装修单的类型、公司、部门信息自动查找可用预算员</li>
                                <li>优先分配给最后完成时间最早的预算员</li>
                                <li>如果找不到可用预算员，系统会将任务加入等待队列</li>
                                <li>该功能不依赖分配请求记录，可直接发起分配</li>
                            </ul>
                        </div>

                        <div class="alert alert-warning">
                            <i class="icon-warning-sign"></i>
                            <strong>注意：</strong>
                            <ul style="margin: 5px 0 0 20px;">
                                <li>确保装修单存在且未分配报价员</li>
                                <li>系统会根据用户规则自动筛选匹配的预算员</li>
                                <li>分配成功后会自动创建分配记录</li>
                            </ul>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="confirmAutoAssignBtn" class="btn btn-info">
                        <i class="icon-magic"></i> 自动分配
                    </button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="layerPopUp4talkAssign" class="portlet box page-content"></div>

<script type="text/javascript">
    $.loadScript(['js/quotation/quotationAssignRequest.js']);
</script>
