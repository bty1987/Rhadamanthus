<!--厂商结算值弹窗-->
<div id="vbalanceValue" style="display: none">
    <div style="padding: 40px 0;">
        <div class="row-fluid">
            <form class="form-horizontal" novalidate="novalidate" id="form">

                <div class="alert alert-error hide">

                    <button data-dismiss="alert" class="close"></button>

                    You have some form errors. Please check below.

                </div>

                <div class="alert alert-success hide">

                    <button data-dismiss="alert" class="close"></button>

                    Your form validation is successful!

                </div>

                <div class="form-group" style="margin-right: 0">

                    <label class="col-xs-4 control-label ">厂商结算值</label>

                    <div class="col-xs-8">

                        <input type="text" class="col-xs-4 v_required v_afloat_3" name="vbalanceValue">
                        <i class="icon-asterisk"></i>

                    </div>

                </div>

                <div class="form-group" style="margin-right: 0">

                    <label class="col-xs-4 control-label ">总价</label>

                    <div class="col-xs-8">

                        <input type="text" class="col-xs-4" name="total" readonly>

                    </div>

                </div>

                <div>
                    <div class="form-group col-xs-10 col-sm-6" style="text-align: right">
                        <button type="button" id="supplierSaveBtn" class="btn btn-success">提交</button>
                    </div>
                </div>


            </form>
        </div>

    </div>
</div>
