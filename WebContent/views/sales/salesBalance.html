<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
</div>

<!-- 装修单信息 -->
<div class="modal fade" id="decorationInfo" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="decorationInfoDialog" data-i18n="page.sales.label.decorationInfo">装修单信息</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">装修单号</label>
                        <div class="col-sm-8">
                            <span id="orderId" style="line-height: 30px"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">楼盘地址</label>
                        <div class="col-sm-8">
                            <span id="address" style="line-height: 30px"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">设计师</label>
                        <div class="col-sm-8">
                            <span id="designer" style="line-height: 30px"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">跟单员</label>
                        <div class="col-sm-8">
                            <span id="escorter" style="line-height: 30px"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">监理</label>
                        <div class="col-sm-8">
                            <span id="supervisor" style="line-height: 30px"></span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right">类型</label>
                        <div class="col-sm-8">
                            <span id="typeness" style="line-height: 30px"></span>
                        </div>
                    </div>
                                            
                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right" data-i18n="page.sales.label.engineeringStatus">工程状态</label>
                        <div class="col-sm-8">
                            <span id="projectStatus" style="line-height: 30px"></span>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="text-align: center">
                <button type="button" id="cancelDecorationInfoBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<!--厂商结算值弹窗-->
<div id="vbalanceValue" style="display: none">
    <div style="padding: 40px 0;">
        <div class="row-fluid">
            <form class="form-horizontal" novalidate="novalidate" id="form">

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-4 control-label orange">厂商结算值</label>
                    <div class="col-xs-8">
                        <input type="text" class="v_required v_afloat_3" name="vbalanceValue">
                    </div>
                </div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-4 control-label ">总价</label>
                    <div class="col-xs-8">
                        <input type="text" name="total" readonly>
                    </div>
                </div>

                <div class="form-group col-sm-12" style="text-align: right">
                    <button type="button" id="supplierSaveBtn" class="btn btn-success" data-i18n="msg.submit">提交</button>
                </div>

            </form>
        </div>

    </div>
</div>

<!--结算值弹窗-->
<div id="pbalanceValue" style="display: none">
    <div style="padding: 40px 0;">
        <div class="row-fluid">
            <form class="form-horizontal" novalidate="novalidate" id="form1">

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-4 control-label orange">结算值</label>
                    <div class="col-xs-8">
                        <input type="text" class="v_required v_afloat_3" name="pbalanceValue">
                    </div>
                </div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-4 control-label">预结算成本额</label>
                    <div class="col-xs-8">
                        <input type="text" name="balanceValue" readonly>
                    </div>
                </div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-4 control-label">厂商结算额</label>
                    <div class="col-xs-8">
                        <input type="text" name="vbalanceValue" readonly>
                    </div>
                </div>

                <div class="form-group col-sm-12" style="text-align: right">
                    <button type="button" id="balanceSaveBtn" class="btn btn-success" data-i18n="msg.submit">提交</button>
                </div>

            </form>
        </div>

    </div>
</div>
<div class="modal fade" id="drawingModal" tabindex="-1">
    <div class="modal-dialog" style="width:60%">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">销售结算图片</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="row-fluid">
                            <ul class="ace-thumbnails" id="salesDrawing"></ul>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class=" col-sm-1" style="padding-top:2px;float: right; padding-right: 100px">
                    <a class="form-group" id="salesUpload"></a>
                </div>
            </div>
        </div>
    </div>
</div>
