<div>
    <div class="row" id="pageing">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div>
            <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
            <!--分页-->
        </div>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" id="fl-statement">
                <div id="list" style="margin-left:10px"></div>
                <a class="btn btn-minier pull-left btn-success" id="addOalesPay"><i class="icon-shopping-cart "></i>创建</a>
            </div>
        </div>
    </div>



    <div class="modal fade" id="oalesPayModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">外销付款</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="name">名称</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" id="name">
                            </div>
                        </div>
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="money">金额</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" id="money">
                            </div>
                        </div>
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="type">类型</label>
                            <div class="col-sm-8">
                                <select class="col-xs-8 m-wrap v_required" id="type"></select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="payTime">付款时间</label>
                            <div class="col-sm-8">
                                <input class="col-xs-8 date-picker-date v_required" id="payTime" type="text" data-date-format="yyyy-mm-dd">
                            </div>
                        </div>
                        <div class="form-group material">
                            <label class="col-md-3 control-label no-padding-right orange" for="comment">备注</label>
                            <div class="col-sm-8">
                                <textarea class="col-xs-8 m-wrap" id="comment" rows="3" cols="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveOalesPayBtn" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createrTimeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">外销付款</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="createTime">创建时间</label>
                            <div class="col-sm-8">
                                <input class="col-xs-8 date-picker-date v_required" id="createTime" type="text" data-date-format="yyyy-mm-dd">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveCreateTime" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
    $.loadScript(['js/sales/oalesPay.js']);
</script>
