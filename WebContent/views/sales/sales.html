<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
</div>

<div>
    <div id="layerAdd" class="page-content" style="display: none">

        <div class="row">

            <form class="form-horizontal">
                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="total">总价</label>
                    <div class="col-xs-9">
                        <input type="text" id="total" readonly="readonly"/>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="depositPayment">定金</label>
                    <div class="col-xs-9">
                        <input type="text" id="depositPayment" class="v_float_3" readonly="readonly"/>
                        <button id="depositPaymentBtn" class="btn small">交款</button>
                        <button id="depositCancelBtn" class="btn small">撤消</button>
                        <button id="depositRefundBtn" class="btn small" >退款</button>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="realDepositPayment">实收定金</label>
                    <div class="col-xs-9">
                        <input type="text" id="realDepositPayment" readonly="readonly"/>
                        <span id="depositPaymentInfo" class="label label-warning"></span>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="fullPayment">补款</label>
                    <div class="col-xs-9">
                        <input type="text" id="fullPayment" readonly="readonly"/>
                        <button id="fullPaymentBtn" class="btn small">交款</button>
                        <button id="fullPaymentRefundBtn" class="btn small">退款</button>
                        <button id="fullCancelBtn" class="btn small ">撤消</button>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="realFullPayment">实收补款</label>
                    <div class="col-xs-9">
                        <input type="text" id="realFullPayment" readonly="readonly"/>
                        <span id="fullPaymentInfo" class="label label-warning"></span>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label" for="coupon">券信息</label>
                    <div class="col-xs-9">
                        <input type="text" id="couponInf" readonly="readonly"/>
                        <button id="couponBtn" class="btn small">修改</button>
                        <button id="couponRefundBtn" class="btn small ">退券</button>
                    </div>
                    <label class="col-xs-3"></label>
                    <div class="col-xs-9" id="couponInfo" style="display: none; margin-top: 5px;">
                        <select id="couponType" class="col-xs-4" data-toggle="popover" data-trigger='manual'></select>
                        <input id="couponValue" type="text" class="col-xs-2 v_float_3" value="0" data-toggle="popover" data-trigger='manual'/>
                        <button id="couponCommitBtn" class="btn small">提交</button>
                        <button id="couponCancelBtn" class="btn small">取消</button>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label  " for="coupon">券值</label>
                    <div class="col-xs-9">
                        <input type="text" id="coupon" readonly="readonly"/>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="maling">抹零</label>
                    <div class="col-xs-9">
                        <input type="text" id="maling" readonly="readonly"/>
                        <button id="malingBtn" class="btn small">修改</button>
                    </div>
                    <label class="col-xs-3"></label>
                    <div id="malingInfo" class="col-xs-9" style="display: none; margin-top: 5px;">
                        <input id="malingValue" type="text" class="col-xs-3 v_float_3" value="0" data-toggle="popover" data-trigger='manual'/>
                        <button id="malingCommitBtn" class="btn small">提交</button>
                        <button id="malingCancelBtn" class="btn small">取消</button>
                    </div>
                </div>

                <div class="form-group col-xs-12">
                    <button type="button" id="saveBtn" class="btn btn-primary pull-right">确定</button>
                </div>

            </form>
        </div>
    </div>

    <!--折让审批弹窗-->
    <div id = "layerSubmit" style="display: none" class="page-content">
        <div class="row">
            <form class="form-horizontal">

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="fullPaymentTotal">补款总额</label>
                    <div class="col-xs-9">
                        <input type="text" id="fullPaymentTotal" readonly/>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="approvalComment">备注信息</label>
                    <div class="col-xs-9">
                        <textarea maxlength="128" id="approvalComment" class="v_required" rows="3"></textarea>
                    </div>
                </div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="approver">审批人</label>
                    <div class="col-xs-9 controls" id="approver"></div>
                </div>

                <div class="form-group pull-right" style="margin-right: 0">
                    <button type="button" id="fullPaymentCancelBtn" class="btn btn-primary">取消</button>
                    <button type="button" id="fullPaymentSaveBtn" class="btn btn-success">提交</button>
                </div>
                
            </form>
        </div>
    </div>

    <!-- 装修单信息 -->
    <div class="modal fade" id="decorationInfo" tabindex="-1">
        <div class="modal-dialog" style="margin-top: 10%;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="decorationInfoDialog">装修单信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">装修单号</label>
                            <div class="col-sm-8">
                                <span id="orderId" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">楼盘地址</label>
                            <div class="col-sm-8">
                                <span id="address" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">设计师</label>
                            <div class="col-sm-8">
                                <span id="designer" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">监理</label>
                            <div class="col-sm-8">
                                <span id="supervisor" style="line-height: 30px"></span>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="cancelDecorationInfoBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

</div>
<div id="miniPopUp"></div>
<div id="layerPopUp" class="portlet box"></div>
<script type="text/javascript">
    $.loadScript(['js/sales/sales.js','js/utils/approvalUtils.js']);
</script>
