<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
</div>

<div>

    <div id="layerAdd" class="page-content" style="display: none">

        <div class="row">

            <form class="form-horizontal">
                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="total">总价</label>
                    <div class="col-xs-9">
                        <input type="text" id="total" readonly="readonly"/>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="depositPayment">定金</label>
                    <div class="col-xs-9">
                        <input type="text" id="depositPayment" class="v_float_3" readonly="readonly"/>
                        <button id="depositPaymentBtn" class="btn btn-minier btn-info">交款</button>
                        <button id="repositPaymentBtn" class="btn btn-minier btn-danger">不退</button>
                        <button id="depositCancelBtn" class="btn btn-minier btn-danger">撤消</button>
                        <button id="depositRefundBtn" class="btn btn-minier btn-danger" >退款</button>
                        <button id="depositPrintBtn" class="btn btn-minier btn-grey">打印</button>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="realDepositPayment">实收定金</label>
                    <div class="col-xs-9">
                        <input type="text" id="realDepositPayment" readonly="readonly"/>
                        <span id="depositPaymentInfo" class="label label-warning"></span>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="fullPayment">补款</label>
                    <div class="col-xs-9">
                        <input type="text" id="fullPayment" readonly="readonly"/>
                        <button id="fullPaymentBtn" class="btn btn-minier btn-info">交款</button>
                        <button id="fullPaymentRefundBtn" class="btn btn-minier btn-danger">退款</button>
                        <button id="fullCancelBtn" class="btn btn-minier btn-danger">撤消</button>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="realFullPayment">实收补款</label>
                    <div class="col-xs-9">
                        <input type="text" id="realFullPayment" readonly="readonly"/>
                        <span id="fullPaymentInfo" class="label label-warning"></span>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label" for="coupon">券信息</label>
                    <div class="col-xs-9">
                        <input type="text" id="couponInf" readonly="readonly"/>
                        <button id="couponBtn" class="btn btn-minier btn-yellow">修改</button>
                        <button id="couponRefundBtn" class="btn btn-minier btn-danger">退券</button>
                    </div>
                    <label class="col-xs-3"></label>
                    <div class="col-xs-9" id="couponInfo" style="display: none; margin-top: 5px;">
                        <select id="couponType" class="col-xs-4" data-toggle="popover" data-trigger='manual'></select>
                        <input id="couponValue" type="text" class="col-xs-2 v_float_3" value="0" data-toggle="popover" data-trigger='manual'/>
                        <button id="couponCommitBtn" class="btn btn-minier btn-success">提交</button>
                        <button id="couponCancelBtn" class="btn btn-minier btn-danger">取消</button>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label  " for="coupon">券值</label>
                    <div class="col-xs-9">
                        <input type="text" id="coupon" readonly="readonly"/>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="maling">抹零</label>
                    <div class="col-xs-9">
                        <input type="text" id="maling" readonly="readonly"/>
                        <button id="malingBtn" class="btn small">修改</button>
                    </div>
                    <label class="col-xs-3"></label>
                    <div id="malingInfo" class="col-xs-9" style="display: none; margin-top: 5px;">
                        <input id="malingValue" type="text" class="col-xs-3 v_float_3" value="0" data-toggle="popover" data-trigger='manual'/>
                        <button id="malingCommitBtn" class="btn btn-minier btn-success">提交</button>
                        <button id="malingCancelBtn" class="btn btn-minier btn-danger">取消</button>
                    </div>
                </div>

                <div class="form-group col-xs-12">
                    <button type="button" id="saveBtn" class="btn btn-primary pull-right">确定</button>
                </div>

            </form>
        </div>

    </div>

    <!-- 不退按钮弹窗层 -->
    <div class="modal fade" id="repositPaymentModal" tabindex="-1">
        <div class="modal-dialog" style="width:70%;">
            <div class="modal-content col-md-12">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                    <h4 class="modal-title">品牌结算</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div id="lists"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="repositBtns" class="btn btn-primary">确认</button>
                    <button type="button" id="cancelReposits" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--折让审批弹窗-->
    <div id = "layerSubmit" style="display: none" class="page-content">
        <div class="row">
            <form class="form-horizontal">

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="fullPaymentTotal">补款总额</label>
                    <div class="col-xs-9">
                        <input type="text" id="fullPaymentTotal" readonly/>
                    </div>
                </div>
                <div class="space5"></div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="approvalComment">备注信息</label>
                    <div class="col-xs-9">
                        <textarea maxlength="128" id="approvalComment" class="v_required" rows="3"></textarea>
                    </div>
                </div>

                <div class="form-group" style="margin-right: 0">
                    <label class="col-xs-3 control-label " for="approver">审批人</label>
                    <div class="col-xs-9 controls" id="approver"></div>
                </div>

                <div class="form-group pull-right" style="margin-right: 0">
                    <button type="button" id="fullPaymentCancelBtn" class="btn btn-primary">取消</button>
                    <button type="button" id="fullPaymentSaveBtn" class="btn btn-success">提交</button>
                </div>

            </form>
        </div>
    </div>

    <!-- 装修单信息 -->
    <div class="modal fade" id="decorationInfo" tabindex="-1">
        <div class="modal-dialog" style="margin-top: 10%;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="decorationInfoDialog">装修单信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">装修单号</label>
                            <div class="col-sm-8">
                                <span id="orderId" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">楼盘地址</label>
                            <div class="col-sm-8">
                                <span id="address" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">设计师</label>
                            <div class="col-sm-8">
                                <span id="designer" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">跟单员</label>
                            <div class="col-sm-8">
                                <span id="escorter" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">监理</label>
                            <div class="col-sm-8">
                                <span id="supervisor" style="line-height: 30px"></span>
                            </div>
                        </div>
                                                
                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">工程状态</label>
                            <div class="col-sm-8">
                                <span id="projectStatus" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">类型</label>
                            <div class="col-sm-8">
                                <span id="typeness" style="line-height: 30px"></span>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="cancelDecorationInfoBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="ascription" tabindex="-1">
        <div class="modal-dialog" style="width: 600px">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="myModalLabel">归属信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal" id="form">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="uSalesman">渠道</label>
                            <div class="col-sm-9">
                                <input type="text" id="uSalesman" maxlength="64" class="col-xs-10 col-sm-7 v_required v_typeahead" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="uInstorer">驻店</label>
                            <div class="col-sm-9">
                                <input type="text" id="uInstorer" maxlength="64" class="col-xs-10 col-sm-7 v_required v_typeahead" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>


                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="uGuider">导购</label>
                            <div class="col-sm-9">
                                <input type="text" id="uGuider" maxlength="64" class="col-xs-10 col-sm-7 v_required v_typeahead" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="uSupplier">厂商</label>
                            <div class="col-sm-9">
                                <input type="text" id="uSupplier" maxlength="64" class="col-xs-10 col-sm-7 v_required v_typeahead" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="ascriptionBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelAscription" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--参加活动-->
    <div class="modal fade" id="salesActivitysModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="activityDialog">活动归属</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="activitys_">当前活动: </label>
                            <div class="col-sm-9">
                                <input type="text" id="activitys_" maxlength="64" class="col-sm-5" readonly="readonly" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>

                        <div class="space-4"></div>

                        <div class="form-group">
                            <label for="activityInfo" class="col-sm-3 control-label no-padding-right">修改活动</label>
                            <div class="col-sm-9">
                                <select class='col-sm-5 v_required' id='activityInfo' data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="submitSalesActivityBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="drawingModal" tabindex="-1">
        <div class="modal-dialog" style="width:60%">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">销售图片</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="row-fluid">
                                <ul class="ace-thumbnails" id="salesDrawing"></ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class=" col-sm-1" style="padding-top:2px;float: right; padding-right: 100px">
                        <a class="form-group" id="salesUpload"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="miniPopUp"></div>
<div id="layerPopUp" class="portlet box"></div>

<script type="text/javascript">
    $.loadScript(['js/utils/salesPageUtils.js','js/sales/sales.js','js/utils/approvalUtils.js']);
</script>
