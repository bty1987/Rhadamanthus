<div class="page-content">
    <div class="row">
        <div class="col-xs-12" id="fl-statement">
            <div id="list" style="margin-left:10px"></div>
            <div class="action-buttons" style="margin-top: 5px">
                <a class="btn btn-minier pull-left btn-yellow" id="importBtn"><i
                        class="icon-download-alt bigger-110 "></i>导出</a>
                <a class="btn btn-minier pull-left btn-success" id="refundBtn"><i class="icon-shopping-cart "></i>退货</a>
                <a class="btn btn-minier pull-left btn-warning hide" id="refundCommitBtn"><i class="icon-ok "></i>确认</a>
                <a class="btn btn-minier pull-left btn-inverse hide" id="refundCancelBtn"><i class="icon-remove  "></i>取消</a>
                <a class="btn btn-minier pull-left btn-danger" id="fullRefundBtn"><i class="icon-shopping-cart "></i>全退</a>
                <a class="btn btn-minier pull-left btn-pink" id="reOrderBtn"><i class="icon-shopping-cart "></i>倒单</a>
            </div>
        </div>
    </div>
</div>

<div id="layerEdit" style="display: none" class="page-content">
    <div class="row">
        <form class="form-horizontal">
            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label" for="salesItemDetialnum">数量</label>
                <div class="col-xs-9">
                    <input type="text" id="salesItemDetialnum" class="v_required v_float_3"/>
                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label" for="salesItemDetialtotal">总价</label>
                <div class="col-xs-9">
                    <input type="text" id="salesItemDetialtotal" class="v_required v_float_3" readonly/>
                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label" for="salesItemDetialcomment">备注</label>
                <div class="col-xs-9">
                    <textarea maxlength="128" id="salesItemDetialcomment" rows="3" style="margin-left: 0%"></textarea>
                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group" style="margin-right: 0">
                <div class="form-group col-xs-10 col-sm-7" style="text-align: right">
                    <button type="button" id="editCancelBtn" class="btn btn-grey">取消</button>
                    <button type="button" id="editSaveBtn" class="btn btn-success">确定</button>
                </div>
            </div>
            <div class="space5"></div>

        </form>
    </div>
</div>

<div id="layerRefund" class="page-content" style="display: none">
    <div class="row">
        <form class="form-horizontal">
            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label" for="refundTotal">退货总额</label>
                <div class="col-xs-4">
                    <input type="text" id="refundTotal" readonly/>
                </div>
                
                <div class="col-xs-4">
                    <label class="inline" style="margin-left: 10px;">
                        <input type="radio" class="ace" id="loose" name="grade" checked>
                        <span class="lbl">抹零</span>&nbsp;
                    </label>

                    <label class="inline">
                        <input type="radio" class="ace" id="ruond" name="grade">
                        <span class="lbl">取整</span>&nbsp;
                    </label>
                </div>
            </div>
            <div class="space5"></div>
            
            <div class="form-group" style="margin-right: 0">
            	<label class="col-xs-3 control-label" for="designDept">设计部</label>
                <div class="col-xs-4">
                    <input type="text" id="designDept"/>
                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label" for="refundDes">备注信息</label>
                <div class="col-xs-9">
                    <textarea maxlength="128" id="refundDes" class="v_required" rows="3"></textarea>
                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label" for="salesItemDetialapprover">审批人</label>
                <div class="col-xs-9 controls" id="salesItemDetialapprover">

                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group">
                <label for="dingApprove" class="col-sm-3 control-label no-padding-right">钉钉同步</label>
                <div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="dingApprove">
                    <span class="lbl status-lbl"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="wechatApprove" class="col-sm-3 control-label no-padding-right">企业微信同步</label>
                <div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="wechatApprove" disabled="disabled">
                    <span class="lbl status-lbl"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="larkApprove" class="col-sm-3 control-label no-padding-right">飞书同步</label>
                <div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="larkApprove" disabled="disabled">
                    <span class="lbl status-lbl"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="fenxApprove" class="col-sm-3 control-label no-padding-right">纷享同步</label>
                <div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="fenxApprove" disabled="disabled">
                    <span class="lbl status-lbl"></span>
                </div>
            </div>

            <div class="form-group pull-right" style="margin-right: 0">
                <button type="button" id="approverCancelBtn" class="btn btn-grey">取消</button>
                <button type="button" id="approverSaveBtn" class="btn btn-success">确定</button>
            </div>

            <div class="space5"></div>
        </form>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/sales/salesItem.js', 'js/utils/approvalUtils.js']);
</script>
