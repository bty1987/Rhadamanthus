<div class="page-content">
	<div class="row">
		<div id="salesFollowupInfo" class="col-xs-12" style="padding-bottom: 10px;"></div>
		<div id="salesFollowupStats" class="col-xs-12" style="padding-bottom: 4px;"></div>
		<div class="col-xs-12" style="padding-bottom: 6px;">
			<div class="pull-right action-buttons">
				<select id="followupFilter" class="form-control input-sm" style="width: 160px; display: inline-block;"></select>
				<button id="addFollowupBtn" class="btn btn-minier btn-primary">新增跟单</button>
			</div>
		</div>
		<div class="col-xs-12">
			<div id="salesFollowupList" class="clearfix tab-pane active"></div>
		</div>
	</div>

	<!-- 新增跟单 -->
	<div class="modal fade" id="addFollowupModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span>
					</button>
					<h4 class="modal-title">新增跟单</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">事项</label>
							<div class="col-sm-8">
								<select id="followupItem" class="form-control input-sm" style="width: 160px;"></select>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">方式</label>
							<div class="col-sm-8">
								<select id="followupWay" class="form-control input-sm" style="width: 160px;"></select>
							</div>
						</div>
						<div class="form-group preOnly">
							<label class="col-sm-3 control-label no-padding-right">品类</label>
							<div class="col-sm-8">
								<select id="followupCategory" class="form-control input-sm" style="width: 160px;"></select>
							</div>
						</div>
						<div class="form-group preOnly">
							<label class="col-sm-3 control-label no-padding-right">品牌</label>
							<div class="col-sm-8">
								<select id="followupBrand" class="form-control input-sm" style="width: 160px;"></select>
							</div>
						</div>
						<div class="form-group postOnly">
							<label class="col-sm-3 control-label no-padding-right">处理结果</label>
							<div class="col-sm-8">
								<input type="text" class="col-xs-8 m-wrap" maxlength="256" id="followupResult">
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">跟进内容</label>
							<div class="col-sm-8">
								<textarea class="col-sm-12 v_required" maxlength="512" rows="3" id="followupContent" placeholder="发生了什么/客户反馈了什么/约了什么"></textarea>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">下一步计划</label>
							<div class="col-sm-8">
								<input type="text" class="col-xs-8 m-wrap" maxlength="256" id="followupPlan">
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">计划跟进时间</label>
							<div class="col-sm-8">
								<input type="text" class="col-sm-6" id="followupPlanTime" name="date-range-picker" readonly="readonly">
							</div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveFollowupBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/salesFollowupUtils.js', 'js/sales/salesFollowup.js']);
</script>
