<div id="sales2create">

    <div id="fl-statement">
        <div class="page-header">
            <h1>
                <span>销售</span>
                <small><i class="icon-double-angle-right"></i>创建</small>
            </h1>
        </div>
    </div>

    <div class="row">

        <div class="col-xs-12 col-sm-3" style="border-right: 1px solid #d5d5d5;">
            <div class="widget-box transparent">
                <div class="widget-body" id="left">
                    <div class="widget-main1">
                        <form class="form-horizontal" role="form">

                            <div class="form-group">
                                <label for="goods" class="col-xs-12 col-sm-2 control-label no-padding-right orange" data-i18n="page.sales.label.goods">商品</label>
                                <div class="col-xs-12 col-sm-10">
                                    <div class="input-group">
                                        <input class="form-control v_required v_typeahead" width-mult="2" type="text" id="goods" placeholder="请输入商品名">
                                        <span class="input-group-addon select">
                                            <i class="icon-filter bigger-110"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="goodsNo" class="col-xs-12 col-sm-2 control-label no-padding-right orange">编号</label>
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10" id="goodsNo" readonly="readonly">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="category" class="col-xs-12 col-sm-2 control-label no-padding-right orange" data-i18n="page.sales.label.category">品类</label>
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10" id="category" readonly="readonly">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="brand" class="col-xs-12 col-sm-2 control-label no-padding-right orange" data-i18n="page.sales.label.brand">品牌</label>
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10" id="brand" readonly="readonly">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="measurementUnit" class="col-xs-12 col-sm-2 control-label no-padding-right orange">单位</label>
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10" id="measurementUnit" readonly="readonly">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="color" class="col-xs-12 col-sm-2 control-label no-padding-right orange" data-i18n="page.sales.label.color">颜色</label>
                                <div class="col-xs-12 col-sm-10">
                                    <select class="col-xs-12 col-sm-10 v_required" id="color" data-placeholder="请输入颜色"></select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="format" class="col-xs-12 col-sm-2 control-label no-padding-right orange" data-i18n="page.sales.label.spec">规格</label>
                                <div class="col-xs-12 col-sm-10">
                                    <select class="col-xs-12 col-sm-10 v_required" id="format" data-placeholder="请输入规格"></select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="purchase" class="col-xs-12 col-sm-2 control-label no-padding-right orange" data-i18n="page.sales.label.sellingPrice">售价</label>
                                <div class="col-xs-12 col-sm-10">
                                    <select class="col-xs-12 col-sm-10 v_required" id="purchase" data-placeholder="请输入售价"></select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="discount" class="col-xs-12 col-sm-2 control-label no-padding-right orange">折扣</label>
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10" id="discount" readonly="readonly">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="disPrice" class="col-xs-12 col-sm-2 control-label no-padding-right orange" data-i18n="page.sales.label.discountPrice">折扣价</label>
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10 v_required v_float_3" id="disPrice">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="postDis" class="col-xs-12 col-sm-2 control-label no-padding-right orange" data-i18n="page.sales.label.allowance">折让</label>
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10 v_required v_discount" id="postDis">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="selling" class="col-xs-12 col-sm-2 control-label no-padding-right orange" data-i18n="page.sales.label.allowancePrice">折让价</label>
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10 v_required v_float_3" id="selling">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="num" class="col-xs-12 col-sm-2 control-label no-padding-right orange">数量</label>
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10 v_required v_float_3" id="num">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="total" class="col-xs-12 col-sm-2 control-label no-padding-right orange">总价</label>
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10" id="total" readonly="readonly">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="remark" class="col-xs-12 col-sm-2 control-label no-padding-right">备注</label>
                                <div class="col-xs-12 col-sm-10">
                                    <textarea class="col-xs-12 col-sm-10" id="remark" maxlength="128" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-xs-12 col-sm-10">
                                    <input type="text" class="col-xs-12 col-sm-10 hide" id="bid">
                                </div>
                            </div>

                            <div class="form-group buttons row-fluid col-xs-12">
                                <button id="add" type="button" class="btn btn-primary pull-left col-xs-4">
                                    <span>添加</span>
                                </button>
                                <button id="submit" type="button" class="btn btn-success pull-left col-xs-4">
                                    <span data-i18n="msg.submit">提交</span>
                                </button>
                                <button id="refresh" type="button" class="btn btn-danger pull-left col-xs-4">
                                    <span data-i18n="msg.reset">重置</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>


        <div id="searchInfo">
            <div class="col-xs-12 col-sm-3">
                <div class="widget-box transparent">
                    <div class="widget-body">
                        <div class="widget-main1">
                            <form class="form-horizontal" role="form">
                                <div class="form-group">
                                    <div>
                                        <label for="orderId" class="col-xs-12 col-sm-3 control-label no-padding-right orange">装修单号</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <input id="orderId" type="text" class="col-xs-12 col-sm-10 v_required" placeholder="请输入装修单号" />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div>
                                        <label for="salesman" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.sales.label.channel">渠道</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <input id="salesman" type="text" class="col-xs-12 col-sm-10 v_required v_typeahead" />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div>
                                        <label for="brand" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.sales.label.brand">品牌</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <input id="brands" type="text" class="col-xs-12 col-sm-10 v_required v_typeahead" />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div>
                                        <label for="coupon" class="col-xs-12 col-sm-3 control-label no-padding-right" data-i18n="page.sales.label.couponValue">券值</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <input id="coupon" type="text" class="col-xs-12 col-sm-10 v_float_3" value="0" />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group" id="typeGroup">
                                    <div>
                                        <label for="type" class="col-xs-12 col-sm-3 control-label no-padding-right">类型</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <select id="type" class="col-xs-12 col-sm-10"></select>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12 col-sm-3">
                <div class="widget-box transparent">
                    <div class="widget-body">
                        <div class="widget-main1">
                            <form class="form-horizontal" role="form">
                                <div class="form-group">
                                    <div>
                                        <label for="orderAddr" class="col-xs-12 col-sm-3 control-label no-padding-right">楼盘地址</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <input id="orderAddr" type="text" class="col-xs-12 col-sm-10 v_required" readonly />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div>
                                        <label for="instorer" class="col-xs-12 col-sm-3 control-label no-padding-right orange" data-i18n="page.sales.label.inStore">驻店</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <input id="instorer" type="text" class="col-xs-12 col-sm-10 v_typeahead v_required" />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div>
                                        <label for="supplier" class="col-xs-12 col-sm-3 control-label no-padding-right" data-i18n="page.sales.label.manufacturer">厂商</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <select class="col-xs-12 col-sm-10" id="supplier"></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div>
                                        <label for="maling" class="col-sm-3 control-label no-padding-right" data-i18n="page.sales.label.wipeChange">抹零</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <input id="maling" type="text" class="col-xs-12 col-sm-10 v_float_3" value="0" />
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12 col-sm-3">
                <div class="widget-box transparent">
                    <div class="widget-body">
                        <div class="widget-main1">
                            <form class="form-horizontal" role="form">
                                <div class="form-group">
                                    <div>
                                        <label for="customer" class="col-xs-12 col-sm-3 control-label no-padding-right orange" data-i18n="page.sales.label.customerName">客户姓名</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <input id="customer" type="text" class="col-xs-12 col-sm-10 v_required" readonly="readonly" />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div>
                                        <label for="guider" class="col-xs-12 col-sm-3 control-label no-padding-right orange" data-i18n="page.sales.label.guide">导购</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <input id="guider" type="text" class="col-xs-12 col-sm-10 v_typeahead v_required" />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div>
                                        <label for="couponInfo" class="col-xs-12 col-sm-3 control-label no-padding-right" data-i18n="page.sales.label.couponInfo">券信息</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <select id="couponInfo" class="col-xs-12 col-sm-10"></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div>
                                        <label for="totals" class="col-xs-12 col-sm-3 control-label no-padding-right" data-i18n="page.sales.label.totalAmount">总额</label>
                                        <div class="col-xs-12 col-sm-9">
                                            <input id="totals" type="text" class="col-xs-12 col-sm-10" value="0" readonly />
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12 col-sm-9">
                <div class="widget-box transparent">
                    <div class="widget-body">
                        <div class="widget-main1">
                            <form class="form-horizontal" role="form">
                                <div class="form-group">
                                    <div class="col-xs-12">
                                        <label for="comment" class="col-xs-12 col-sm-1 control-label no-padding-right orange">备注</label>
                                        <div class="col-xs-12 col-sm-11">
                                            <textarea id="comment" class="col-xs-12 col-sm-10 v_required" rows="2" maxlength="128"></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-xs-12">
                                        <label for="bComment" class="col-xs-12 col-sm-1 control-label no-padding-right">品牌备注</label>
                                        <div class="col-xs-12 col-sm-11">
                                            <textarea id="bComment" class="col-xs-12 col-sm-10" readonly="readonly" rows="2" maxlength="256"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="form-horizontal">
                    <ul id="salesItemList" class="widget-main1 col-xs-12" style="margin : 0px;"></ul>
                </div>
            </div>
        </div>

    </div>
</div>

<div class="modal fade" id="itemModel" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                    <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" data-i18n="page.sales.label.packageDetail">套餐详情</h4>
            </div>
            <div class="modal-body" id="itemList"></div>
            <div class="modal-footer"></div>
        </div>
    </div>
</div>

<div id="viewPopUp" class="portlet box"></div>

<div id="layerPopUp" class="portlet box page-content"></div>

<script type="text/javascript">
    $.loadScript(['js/sales/sales2create.js', 'js/utils/salesUtils.js']);
</script>
