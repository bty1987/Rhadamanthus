<div class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div class="tab-content col-xs-12" style="border: 0;">
                <div class="form-horizontal">
                    <div>
                        <div class="caption"></div>
                    </div>
                    <div class="widget-body" style="border: 0px;">
                        <div class="widget-main" id="searchInfo" style="border-bottom: 1px solid #c5d0dc">
                            <div class="form-group">
                                <div class="lable_input col-xs-4">
                                    <label for="SupplementOrderId" class="col-sm-3 control-label no-padding-right orange">装修单号</label>
                                    <div class="col-sm-9">
                                        <input id="SupplementOrderId" type="text" class="col-sm-10 v_required" placeholder="请输入装修单号" readonly/>
                                    </div>

                                </div>
                                <div class="lable_input col-xs-4">
                                    <label for="customerName" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.sales.label.customerName">客户姓名</label>
                                    <div class="col-sm-9">
                                        <input id="customerName" type="text" class="col-sm-10 v_required" readonly/>
                                    </div>

                                </div>
                                <div class="lable_input col-xs-4">
                                    <label for="salesmanName" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.sales.label.channel">渠道</label>
                                    <div class="col-sm-9">
                                        <input id="salesmanName" type="text" class="order_inputinfo col-sm-10 v_typeahead v_required"/>
                                    </div>

                                </div>
                            </div>
                            <div class="form-group">
                                <div class="lable_input col-xs-4">
                                    <label for="instorer" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.sales.label.inStore">驻店</label>
                                    <div class="col-sm-9">
                                        <input id="instorer" type="text" class="order_inputinfo col-sm-10 v_typeahead v_required"/>
                                    </div>

                                </div>
                                <div class="lable_input col-xs-4">
                                    <label for="guider" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.sales.label.guide">导购</label>
                                    <div class="col-sm-9">
                                        <input id="guider" type="text" class="order_inputinfo col-sm-10 v_typeahead v_required"/>
                                    </div>

                                </div>
                                <div class="lable_input col-xs-4">
                                    <label for="brands" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.sales.label.brand">品牌</label>
                                    <div class="col-sm-9">
                                        <input id="brands" type="text" class="col-sm-10 v_required" readonly/>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="lable_input col-xs-4">
                                    <label for="SupplementCoupon" class="col-sm-3 control-label no-padding-right" data-i18n="page.sales.label.couponValue">券值</label>
                                    <div class="col-sm-9">
                                        <input id="SupplementCoupon" type="text" class="order_inputinfo col-sm-10"/>
                                    </div>

                                </div>
                                <div class="lable_input col-xs-4">
                                    <label for="SupplementCouponInfo" class="col-sm-3 control-label no-padding-right" data-i18n="page.sales.label.couponInfo">券信息</label>
                                    <div class="col-sm-9">
                                        <select id="SupplementCouponInfo" class="col-sm-10"></select>
                                    </div>

                                </div>
                                <div class="lable_input col-xs-4">
                                    <label for="SupplementMaling" class="col-sm-3 control-label no-padding-right" data-i18n="page.sales.label.wipeChange">抹零</label>
                                    <div class="col-sm-9">
                                        <input id="SupplementMaling" type="text" class="order_inputinfo col-sm-10"/>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="lable_input col-xs-4">
                                    <label for="totals" class="col-sm-3 control-label no-padding-right" data-i18n="page.sales.label.totalAmount">总额</label>
                                    <div class="col-sm-9">
                                        <input id="totals" type="text" class="order_inputinfo col-sm-10" readonly/>
                                    </div>
                                </div>
                                <div class="lable_input col-xs-4">
                                    <label for="orderAddr" class="col-sm-3 control-label no-padding-right">楼盘地址</label>
                                    <div class="col-sm-9">
                                        <input id="orderAddr" type="text" class="col-sm-10 v_required" readonly/>
                                    </div>
                                </div>
                                <div class="lable_input col-xs-4">
                                    <label for="comment" class="col-sm-3 control-label no-padding-right">备注</label>
                                    <div class="col-sm-9">
                                        <input id="comment" type="text" class="order_inputinfo col-sm-10"/>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                <!--已添加的主材-->
                <div class="form-horizontal">

                    <ul id="salesItemList" class="widget-main" style="margin: 0px;"></ul>

                    <button id="submit" type="button" class="btn btn-success pull-right col-xs-1">
                        <span data-i18n="msg.submit">提交</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="viewPopUp" class="portlet box"></div>

<script type="text/javascript">
    $.loadScript(['js/sales/sales2supple.js']);
</script>
