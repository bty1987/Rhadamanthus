<div class="modal fade" id="salesActivityCommentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="commentName"></h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="space-4"></div>
                    <div class="form-group">
                        <label for="salesActivityComment" class="col-sm-3 control-label no-padding-right">备注</label>
                        <div class="col-sm-9">

                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="submitSalesActivityCommentBtn" class="btn btn-primary">保存</button>

            </div>
        </div>
    </div>
</div>

<!--领取活动物品-->
<div class="modal fade" id="salesActivityItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="agreementDialog">领取活动物品</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label for="activity" class="col-sm-3 control-label no-padding-right">活动</label>
                        <div class="col-sm-9">
                            <select class='col-sm-5 v_required' id='activity' data-toggle="popover"
                                    data-trigger='manual'></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-9">
                            <ul id="things" class="item-list list-inline"></ul>
                        </div>

                        <div class="col-sm-12" id="thingsInputs">
                            <label for="activity" class="col-sm-3 control-label no-padding-right">物品</label>
                            <div class="col-sm-9">
                                <div id="thingsDiv">
                                    <input type="text" id="thingsName" class="col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" placeholder="请选择物品"/>
                                </div>
                                <input type="text" id="thingsNum" class="col-sm-4 v_float_3 v_required" placeholder="请输入数量" style="margin: 0 10px">
                                <button type="button" id="thingsAdd" class="btn btn-info btn-minier" style="width: 50px; line-height: 30px">添加</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-9">
                            <ul id="coupons" class="item-list list-inline"></ul>
                        </div>
                        <div class="col-sm-12" id="couponInputs">
                            <label for="activity" class="col-sm-3 control-label no-padding-right">劵</label>
                            <div class="col-sm-9">
                                <div id="couponsDiv">
                                    <input type="text" id="couponsName" class="col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" placeholder="请选择券"/>
                                </div>
                                <input type="text" id="couponsNum" class="col-sm-4 v_float_3 v_required" placeholder="请输入数量" style="margin: 0 10px">
                                <button type="button" id="couponsAdd" class="btn btn-info btn-minier" style="width: 50px; line-height: 30px">添加</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-9">
                            <ul id="paper" class="item-list list-inline"></ul>
                        </div>

                        <div class="col-sm-12" id="paperInputs">
                            <label for="activity" class="col-sm-3 control-label no-padding-right">红包</label>
                            <div class="col-sm-9">
                                <div id="paperDiv">
                                    <input type="text" id="paperName" class="col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" placeholder="请选择红包"/>
                                </div>
                                <input type="text" id="paperNum" class="col-sm-4 v_float_3 v_required" placeholder="请输入数量" style="margin: 0 10px">
                                <button type="button" id="paperAdd" class="btn btn-info btn-minier" style="width: 50px; line-height: 30px">添加</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="salesActivityItemContent"
                               class="col-sm-3 control-label no-padding-right">说明</label>
                        <div class="col-sm-9">
                            <textarea id="salesActivityItemContent" class="col-sm-6 " style="height: 100px"></textarea>
                        </div>
                    </div>
                    <div class="space-4"></div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="submitSalesActivityItemBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancel" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>
