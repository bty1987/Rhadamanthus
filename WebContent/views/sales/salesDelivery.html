<div id="salesdeliveryPageContent">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <div id="resultList" class="clearfix tab-pane active"></div>
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
        </div>
    </div>
    
    <div class="modal fade" id="EditModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="myModalLabel">xing 编辑</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange"
                                   for="protranTime">预计配送时间</label>
                            <div class="col-sm-9">
                                <div class="input-group col-xs-10 col-sm-7 no-padding" data-for="protranTime"
                                     data-toggle="popover" data-trigger='manual'>
                                    <input class="form-control date-picker-date v_required" id="protranTime"
                                           type="text" data-date-format="yyyy-mm-dd">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="comment">备注</label>
                            <div class="col-sm-9">
                                <div class="input-group col-xs-10 col-sm-7 no-padding" data-for="comment"
                                     data-toggle="popover" data-trigger='manual'>
                                    <input class="form-control" id="comment" type="text">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveEditBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelEditBtn" class="btn btn-default" data-dismiss="modal">取消
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="drawingModal" tabindex="-1">
        <div class="modal-dialog" style="width:60%">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">配送图片</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="row-fluid">
                                <ul class="ace-thumbnails" id="salesDrawing"></ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class=" col-sm-1" style="padding-top:2px;float: right; padding-right: 100px">
                        <a class="form-group" id="salesUpload"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="decorationInfo" tabindex="-1">
        <div class="modal-dialog" style="margin-top: 10%;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="decorationInfoDialog">装修单信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">装修单号</label>
                            <div class="col-sm-8">
                                <span id="orderId" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">楼盘地址</label>
                            <div class="col-sm-8">
                                <span id="address" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">设计师</label>
                            <div class="col-sm-8">
                                <span id="designer" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">跟单员</label>
                            <div class="col-sm-8">
                                <span id="escorter" style="line-height: 30px"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">监理</label>
                            <div class="col-sm-8">
                                <span id="supervisor" style="line-height: 30px"></span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">类型</label>
                            <div class="col-sm-8">
                                <span id="typeness" style="line-height: 30px"></span>
                            </div>
                        </div>
                                                
                        <div class="form-group">
                            <label class="col-sm-4 control-label no-padding-right">工程状态</label>
                            <div class="col-sm-8">
                                <span id="projectStatus" style="line-height: 30px"></span>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="cancelDecorationInfoBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/salesPageUtils.js', 'js/sales/salesDelivery.js']);
</script>
