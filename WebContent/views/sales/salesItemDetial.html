

<div class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="list" style="margin-left:10px"></div>
            <div>
                <h3 class="clearfix" >
                    <a  class="btn btn-minier pull-left" id="importBtn"><i class="icon-download-alt bigger-110 "></i>导出</a>
                    <a  class="btn btn-minier pull-left" id="refundBtn" ><i class="icon-shopping-cart "></i>退货</a>
                    <a  class="btn btn-minier pull-left hide" id="refundCommitBtn"><i class="icon-ok "></i>确认</a>
                    <a  class="btn btn-minier pull-left hide" id="refundCancelBtn"><i class="icon-remove  "></i>取消</a>
                    <a  class="btn btn-minier pull-left" id="fullRefundBtn"><i class="icon-shopping-cart "></i>全退</a>
                    <a  class="btn btn-minier pull-left" id="reOrderBtn"><i class="icon-shopping-cart "></i>倒单</a>
                    <a  class="btn btn-minier pull-left" id="backBtn"><i class="icon-mail-forward "></i>返回</a>
                </h3>
            </div>
        </div>
    </div>
</div>


<div id="layerEdit" style="padding: 40px 0;display: none">
    <div class="row-fluid">
        <form class="form-horizontal">
            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label " for="num">数量</label>
                <div class="col-xs-9">
                    <input type="text" id="num" class=" col-xs-4 v_required v_float" />
                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label " for="total">总价</label>
                <div class="col-xs-9">
                    <input type="text" id="total" class=" col-xs-4 v_required v_float" readonly/>
                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label " for="comment">备注</label>
                <div class="col-xs-9">
                    <textarea maxlength="128" id="comment" class="col-xs-4" rows="3" style="margin-left: 0%" ></textarea>
                </div>
            </div>
            <div class="space5"></div>

        </form>
    </div>
</div>

<div id="layerRefund" style="padding: 40px 0;display: none">
    <div class="row-fluid">
        <form class="form-horizontal">
            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label " for="refundTotal" >退货总额</label>
                <div class="col-xs-9">
                    <input type="text" id="refundTotal" class=" col-xs-4" readonly/>
                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label " for="refund">实际退款额</label>
                <div class="col-xs-9">
                    <input type="text" id="refund" class=" col-xs-4 v_required v_float" />
                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label " for="refundDes">备注信息</label>
                <div class="col-xs-9">
                    <textarea maxlength="128" id="refundDes" class="col-xs-4 v_required" rows="3" ></textarea>
                </div>
            </div>
            <div class="space5"></div>

            <div class="form-group" style="margin-right: 0">
                <label class="col-xs-3 control-label " for="approver">审批人</label>
                <div class="col-xs-9 controls" id="approver">

                </div>
            </div>
            <div class="space5"></div>
        </form>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/sales/salesItemDetial.js','js/utils/approvalUtils.js']);
</script>
