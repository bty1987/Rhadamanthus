<div class="page-content">
    <div class="row">
        <div class="col-sm-4 widget-container-span">
            <div class="widget-box transparent">
                <div class="widget-header">
                    <h2 class="lighter">活动信息</h2>
                </div>
                <div class="widget-header">
                    <div id="paramsNo"></div>
                </div>

            </div>
            <div class="row">
                <div class="col-xs-12 col-sm-12 pricing-span-body" style="padding: 30px;">
                    <div id="salesActivityItem"></div>
                </div>
                <hr/>
            </div>
        </div>

        <div class="col-sm-8 widget-container-span">
            <div class="widget-box transparent">
                <div class="widget-header">
                    <h2 class="lighter">活动物品</h2>
                </div>

                <div class="widget-header">
                    <div id="paramsOrder"></div>
                </div>

            </div>
            <div class="row">
                <div class="col-xs-12 col-sm-12 pricing-span-body" style="padding: 30px;">
                    <div id="salesActivityItems"></div>
                </div>
                <hr/>
            </div>
        </div>
    </div>
</div>

<!--参加活动-->
<div class="modal fade" id="salesActivityModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="activityDialog">活动名称</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="space-4"></div>
                    <div class="form-group">
                        <label for="activityInfo" class="col-sm-3 control-label no-padding-right">修改活动</label>
                        <div class="col-sm-9">
                            <select class='col-xs-10 col-sm-5 v_required' id='activityInfo' data-toggle="popover"
                                    data-trigger='manual'></select>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="submitSalesActivityBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<!--领取活动物品-->
<div class="modal fade" id="salesActivityItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="agreementDialog">领取活动物品</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label for="activity" class="col-sm-3 control-label no-padding-right">活动</label>
                        <div class="col-sm-9">
                            <select class='col-xs-10 col-sm-5 v_required' id='activity' data-toggle="popover"
                                    data-trigger='manual'></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-9">
                            <ul id="things" class="item-list list-inline"></ul>
                        </div>

                        <div class="col-sm-12" id="thingsInputs">
                            <label for="activity" class="col-sm-3 control-label no-padding-right">物品</label>
                            <div class="col-sm-9">
                                <div id="thingsDiv">
                                    <input type="text" id="thingsName" class="col-xs-10 col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" placeholder="请选择物品"/>
                                </div>
                            <input type="text" id="thingsNum" class="col-xs-10 col-sm-4 v_float_3 v_required" placeholder="请输入数量" style="margin: 0 10px">
                            <button type="button" id="thingsAdd" class="btn btn-info btn-minier" style="width: 50px; line-height: 30px">添加</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-9">
                            <ul id="coupons" class="item-list list-inline"></ul>
                        </div>
                        <div class="col-sm-12" id="couponInputs">
                            <label for="activity" class="col-sm-3 control-label no-padding-right">劵</label>
                            <div class="col-sm-9">
                                <div id="couponsDiv">
                                    <input type="text" id="couponsName" class="col-xs-10 col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" placeholder="请选择券"/>
                                </div>
                            <input type="text" id="couponsNum" class="col-xs-10 col-sm-4 v_float_3 v_required" placeholder="请输入数量" style="margin: 0 10px">
                            <button type="button" id="couponsAdd" class="btn btn-info btn-minier" style="width: 50px; line-height: 30px">添加</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="salesActivityItemContent"
                               class="col-sm-3 control-label no-padding-right">说明</label>
                        <div class="col-sm-9">
                            <textarea id="salesActivityItemContent" class="col-xs-10 col-sm-6 " style="height: 100px"></textarea>
                        </div>
                    </div>
                    <div class="space-4"></div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="submitSalesActivityItemBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancel" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/sales/salesActivity.js']);
</script>
