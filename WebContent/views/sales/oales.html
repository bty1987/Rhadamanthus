<div id="oales">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div>
            <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
            <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="oalesModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" data-i18n="page.sales.label.externalOrder">外销单</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="orderId">装修单号</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="orderId">
                            </div>
                        </div>
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="brandName" data-i18n="page.sales.label.brand">品牌</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_typeahead v_required" id="brandName">
                            </div>
                        </div>
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="supplier" data-i18n="page.sales.label.manufacturer">厂商</label>
                            <div class="col-sm-8">
                                <select class="col-xs-8 m-wrap v_required" id="supplier"></select>
                            </div>
                        </div>
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="atttype">业务类型</label>
                            <div class="col-sm-8">
                                <select class="col-xs-8 m-wrap v_required" id="atttype"></select>
                            </div>
                        </div>
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="service" data-i18n="page.sales.label.serviceManager">服务管家</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_typeahead v_required" id="service">
                            </div>
                        </div>
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="channer" data-i18n="page.sales.label.channel">渠道</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_typeahead v_required" id="channer">
                            </div>
                        </div>
                        <div class="form-group material refund">
                            <label for="total" class="col-md-3 control-label no-padding-right orange" data-i18n="page.sales.label.totalAmount">总额</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_float_3 v_required" id="total">
                            </div>
                        </div>
                        <div class="form-group material">
                            <label class="col-md-3 control-label no-padding-right orange" for="materialer">主材员</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_typeahead v_required" id="materialer">
                            </div>
                        </div>
                        <div class="form-group material refund">
                            <label for="cost" class="col-md-3 control-label no-padding-right orange">成本</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_float_3 v_required" id="cost">
                            </div>
                        </div>
                        <div class="form-group material">
                            <label for="threshold" class="col-md-3 control-label no-padding-right orange" data-i18n="page.sales.label.coefficient">系数</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_float_3 v_required" id="threshold">
                            </div>
                        </div>
                        <div class="form-group material refund hide">
                            <label for="profit" class="col-md-3 control-label no-padding-right orange" data-i18n="page.sales.label.profit">利润</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_float_3 v_required" id="profit">
                            </div>
                        </div>
                        <div class="form-group material">
                            <label for="awardType" class="col-md-3 control-label no-padding-right orange" data-i18n="page.sales.label.rewardType">奖励类型</label>
                            <div class="col-sm-8">
                                <select class="col-xs-8 m-wrap v_required" id="awardType"></select>
                            </div>
                        </div>
                        <div class="form-group material finance refund">
                            <label for="award" class="col-md-3 control-label no-padding-right orange" data-i18n="page.sales.label.reward">奖励</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_float_3 v_required" id="award">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="drawingModal" tabindex="-1">
        <div class="modal-dialog" style="width:60%">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" data-i18n="page.sales.label.deliveryImg">配送图片</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="row-fluid">
                                <ul class="ace-thumbnails" id="salesDrawing"></ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class=" col-sm-1" style="padding-top:2px;float: right; padding-right: 100px">
                        <a class="form-group" id="salesUpload"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="accountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="decorationInfoDialog" data-i18n="page.sales.label.balanceOrder">结算单</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="balanceOales" data-i18n="page.sales.label.balanceName">结算名</label>
                            <div class="col-sm-9">
                                <input id="balanceOales" type="text" class="col-xs-10 col-sm-5 v_required v_typeahead" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="balanceOalesBtn" class="btn btn-primary" data-i18n="msg.submit">提交</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

</div>
<div id="oalesPayPopUp" class="portlet box"></div>
<div id="oalesItemPopUp" class="portlet box"></div>
<div id="oalesRecordPopUp" class="portlet box"></div>
<script type="text/javascript">
    $.loadScript(['js/utils/salesPageUtils.js','js/sales/oales.js']);
</script>
