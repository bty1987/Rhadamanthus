<div id="oales">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div>
            <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
            <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="oalesModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">外销单</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="orderId">装修单号</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="orderId">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="brandName">品牌</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" id="brandName">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="atttype">业务类型</label>
                            <div class="col-sm-8">
                                <select class="col-xs-8 m-wrap v_required" id="atttype"></select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="service">服务管家</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" id="service">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="total" class="col-md-3 control-label no-padding-right orange">总额</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_float_3 v_required" id="total">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right" for="comment">备注</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap" id="comment">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="atttype">业务类型</label>
                            <div class="col-sm-8">
                                <select class="col-xs-8 m-wrap v_required" id="atttype"></select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="service">服务管家</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" id="service">
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="awardModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">外销单</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                    
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="brandName">奖励类型</label>
                            <div class="col-sm-8">
                                <select class="col-xs-8 m-wrap" id="awardType"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="award" class="col-md-3 control-label no-padding-right orange">奖励金额</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required v_float_3 " id="award">
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="awardBtn" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="profitModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">外销单</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label for="profit" class="col-md-3 control-label no-padding-right orange">利润</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required v_float_3" id="profit">
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="profitBtn" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>
</div>
