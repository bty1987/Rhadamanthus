
<div class="page-content">

	<div class="row">
		<div class="col-xs-12">

			<div class="row">

				<h3 class="grey lighter  position-relative">
					<i class="icon-leaf green"></i>
					操作
					<button class="btn blue pull-right btn-sm" id="addModule">添加</button>
				</h3>
				<div class="hr hr8 hr-double hr-dotted"></div>
			</div>

			<div id="operationTable" class="row"></div>
		</div>
		<div class="col-xs-5">

		</div>

	</div>




</div>

<div class="modal fade" id="operationModal" tabindex="-1" role="dialog"	aria-labelledby="moduleDialog" aria-hidden="true" data-backdrop="static">
	<div class="modal-dialog">
		<div class="modal-content col-md-12">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span aria-hidden="true">&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="operationDialog">操作</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal" role="form">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="operation">操作</label>
						<div class="col-sm-9">
							<input type="text" id="operation" class="col-xs-10 col-sm-5 v_required " data-toggle="popover" data-trigger='manual' maxlength='64'/>
						</div>
					</div>
					<div class="space-4"></div>


					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="operationName">操作名</label>
						<div class="col-sm-9">
							<input type="text" id="operationName" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					<div class="space-4"></div>



					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="fatherModule">所属模块</label>
						<div class="col-sm-9">

							<input type="text"  autocomplete="off" id="fatherModule" class="col-xs-10 col-sm-5"  data-toggle="popover" data-trigger='manual'/>

						</div>
					</div>

					<div class="space-4"></div>

				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>
<script type="text/javascript">
	$.loadScript(['js/system/operation.js']);
</script>
