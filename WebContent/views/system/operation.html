<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div><!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div><!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div><!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addOperation" tabindex="-1" role="dialog" aria-labelledby="moduleDialog" aria-hidden="true" data-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content col-md-12">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span aria-hidden="true">&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addOperationDialog">添加</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal" role="form">
                    
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="name">操作名</label>
                            <div class="col-sm-9">
                                <input type="text" id="name" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>
                    
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="operation">操作</label>
                            <div class="col-sm-9">
                                <input type="text" id="operation" class="col-xs-10 col-sm-5 v_required " data-toggle="popover" data-trigger='manual' maxlength='64' />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="module">所属模块</label>
                            <div class="col-sm-9">
                                <input type="text" autocomplete="off" id="module" class="col-xs-10 col-sm-5 v_typeahead" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="type">类型</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-5 v_required" id="type"></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="logFlag">日志记录</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-5" id="logFlag">
                                    <option value="2">自动</option>
                                    <option value="1">始终记录</option>
                                    <option value="0">不记录</option>
                                </select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    $.loadScript(['js/system/operation.js']);
</script>
