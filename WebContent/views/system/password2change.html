
<div class="row">
    <div class="col-xs-12">

        <div id="user-profile-3" class="user-profile row">
            <div class="col-sm-offset-1 col-sm-10">

                <div class="space"></div>

                <form class="form-horizontal">
                    <div class="tabbable">
                        <ul class="nav nav-tabs padding-16">
                            <li class="active">
                                <a data-toggle="tab" href="#edit-password">
                                    <i class="blue icon-key bigger-125"></i>
                                    <span>修改密码</span>
                                </a>
                            </li>
                        </ul>

                        <div class="tab-content profile-edit-tab-content">
                            <div id="edit-password" class="tab-pane in active">
                                <div class="space-10"></div>

                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right" for="oldPassword">旧密码</label>
                                    <div class="col-sm-9">
                                        <input id="oldPassword" type="password" class=" v_required" data-toggle="popover" data-trigger='manual' maxlength="32">
                                    </div>
                                </div>

                                <div class="space-4"></div>

                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right" for="password">新密码</label>
                                    <div class="col-sm-9">
                                        <input id="password" type="password" class=" v_required" data-toggle="popover" data-trigger='manual' maxlength="32">
                                    </div>
                                </div>

                                <div class="space-4"></div>

                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right" for="rePassword">再次输入新密码</label>
                                    <div class="col-sm-9">
                                        <input id="rePassword" type="password" class=" v_required" data-toggle="popover" data-trigger='manual' maxlength="32">
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                	<label class="col-sm-3 control-label no-padding-right" for="rePassword">密码必须包含以下内容</label>
                                    <div class="col-sm-9">
                                        <div class="requirement" id="req-length">
						                    <i>•</i> <span>至少8个字符</span>
						                </div>
						                <div class="requirement" id="req-lowercase">
						                    <i>•</i> <span>至少1个小写字母</span>
						                </div>
						                <div class="requirement" id="req-uppercase">
						                    <i>•</i> <span>至少1个大写字母</span>
						                </div>
						                <div class="requirement" id="req-number">
						                    <i>•</i> <span>至少1个数字</span>
						                </div>
						                <div class="requirement" id="req-special">
						                    <i>•</i> <span>至少1个特殊字符 (!@#$%^&*)</span>
						                </div>
                                    </div>
					            </div>
                            </div>
                        </div>
                    </div>

                    <div class="clearfix form-actions">
                        <div class="col-md-offset-3 col-md-9">
                            <button class="btn btn-info" type="button" id="saveBtn">
                                <i class="icon-ok bigger-110"></i>
                                <span>保存</span>
                            </button>
                            &nbsp; &nbsp;
                            <button class="btn" type="button" id="reset">
                                <i class="icon-undo bigger-110"></i>
                                <span>重置</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="assets/altogether/js/crypto.min.js"></script>
<script type="text/javascript">
    $.loadScript(['js/system/password2change.js']);
</script>
