
<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="regionModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="myModalLabel">大区</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="regionId">大区编号</label>
							<div class="col-sm-9">
								<input type="text" id="regionId" class="col-xs-10 col-sm-6 v_required v_region" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="regionName">大区名称</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="regionName" class="col-xs-10 col-sm-6 v_required v_name" data-toggle="popover" data-trigger='manual'/>
								<span class='star'></span>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/system/region.js']);
</script>
