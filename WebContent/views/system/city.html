
<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="cityModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="myModalLabel">城市</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="cityId">城市编号</label>
							<div class="col-sm-9">
								<input type="text" id="cityId" class="col-xs-10 col-sm-6 v_required v_city" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="cityName">城市名称</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="cityName" class="col-xs-10 col-sm-6 v_required v_name" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="cityProvince">省份</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="cityProvince" class="col-xs-10 col-sm-6 v_required v_province" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="regionSel">所属大区</label>
							<div class="col-sm-9">
								<select id="regionSel" class="col-xs-10 col-sm-6 v_name"></select>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>
  	
  	
  	<div class="modal fade" id="mapModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">城市地址</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" id="mapForm">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="no">城市编号</label>
							<div class="col-sm-9">
								<input disabled type="text" name="no" maxlength="10" class="col-xs-10 col-sm-6 v_required v_no" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="name">城市名称</label>
							<div class="col-sm-9">
								<input disabled class="col-xs-10 col-sm-6 v_required v_name" maxlength="20" type="text" name="name" id="name" data-toggle="popover" data-trigger='manual'/>
								<button type="button" id="placeBtn" class="btn btn-success" style="padding: 2px 12px;">确定位置</button>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group" style="display: none">
							<label class="col-sm-3 control-label no-padding-right" for="city">城市名称</label>
							<div class="col-sm-9">
								<input disabled class="col-xs-10 col-sm-6 v_required v_name" id="city" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group" id="mapContainer"></div>
					</form>
				</div>
				<div class="modal-footer">
				    <button type="button" name="resetPositionBtn" class="btn btn-warning">重选位置</button>
				    <button type="button" name="resetMapBtn" class="btn btn-success">重新加载地图</button>
					<button type="button" id="saveMapBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelMapBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
    $(function(){
        $.getScript('https://map.qq.com/api/gljs?v=1.exp&key=U5FBZ-SQLKZ-H5BX3-TCVW6-L3APZ-LUF5F', function(){
            $.loadScript(['js/system/city.js']);
        });
    });
</script>
