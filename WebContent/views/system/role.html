<div>
    <div class="row">
        <div id="roleList" class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div>
            <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
            <!--分页-->
        </div>

        <div id="roleRightDiv" class="col-xs-12 hidden">
            <div>
                <span id="roleRightContent"></span>
            </div>
            <div class="col-xs-4">
                <ul id="treeDemo" class="ztree"></ul>
            </div>
            <input id="roleRightRoleId" class="col-xs-10 col-sm-5 hidden">
            <div class="col-xs-8">
                <span>
                    说明: <br />&nbsp;&nbsp;&nbsp;&nbsp;选择功能文件夹可以控制该角色左侧功能树形菜单的可见权限. <br />&nbsp;&nbsp;&nbsp;&nbsp;选择从能文件夹下的子项可以控制该角色对哪些action有权限.
                </span>
            </div>
            <div class="col-xs-12 space-5 form-group"></div>
            <div class="col-xs-12">
                <button type="button" id="saveRoleRightBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="cancelRoleRightBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="roleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="myModalLabel" data-i18n="page.system.label.roleInfo">角色信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <div class="block clearfix">
                                <label for="roleId" class="col-sm-3 control-label no-padding-right" data-i18n="page.system.label.roleNo">角色编号</label>
                                <span class="col-md-9 block   ">
                                    <input type="text" id="roleId" class="col-xs-10 col-sm-5 v_required v_roleId" data-toggle="popover" data-trigger='manual' maxlength="4" />
                                </span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="roleName" data-i18n="page.system.label.roleName">角色名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="roleName" class="col-xs-10 col-sm-5 v_required v_name" data-toggle="popover" data-trigger='manual' maxlength="8" />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="content" data-i18n="page.system.label.roleDesc">角色描述</label>
                            <div class="col-sm-9">
                                <textarea id="content" class="col-xs-10 col-sm-5 v_name" rows="3" data-toggle="popover" data-trigger='manual' maxlength="20"></textarea>
                            </div>
                        </div>
                        <div class="space-4 "></div>
                    </form>
                </div>

                <div class="modal-footer ">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--外链配置-->
    <div class="modal fade" id="chainPageModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">外链配置</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="currentchainPage">现有外链</label>
                            <div class="col-sm-9">
                                <div class="tags" style="border: 0px" id="currentchainPage"></div>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="chainPage">外链</label>
                            <div class="col-sm-9">
                                <div id="chainList" class="tags" style="border: 0px"></div>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer ">
                    <button type="button" id="saveChainPageBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>

            </div>
        </div>
    </div>

    <!--操作配置-->
    <div class="modal fade" id="operationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" data-i18n="page.system.label.operateConfig">操作配置</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group hide">
                            <label class="col-sm-3 control-label no-padding-right" for="currentOperation">现有操作</label>
                            <div class="col-sm-9">
                                <div class="tags" style="border: 0px" id="currentOperation"></div>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">操作</label>
                            <div id="operation" class="tags" style="border: 0px"></div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" name="saveBtn" class="btn btn-primary hide" data-i18n="msg.save">保存</button>
                    <button type="button" name="cancelBtn" class="btn btn-default hide" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--模块配置-->
    <div class="modal fade" id="moduleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" data-i18n="page.system.label.moduleConfig">模块配置</h4>
                </div>
                <div class="modal-body"></div>

                <div class="modal-footer">
                    <button type="button" name="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" name="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--模块配置(新)-->
    <div class="modal fade" id="moduleNewModal" tabindex="-1">
        <div class="modal-dialog" style="width: 80%; max-width: 600px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">模块配置(新)</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-xs-12">
                            <div id="moduleNewTree" style="max-height: 500px; overflow-y: auto; border: 1px solid #ddd; padding: 10px;">
                                <!-- 模块树将在这里动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="saveModuleNewBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--模块复制弹窗-->
    <div class="modal fade" id="companyCopyModal" tabindex="-1">
        <div class="modal-dialog" style="width: 600px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">模块复制</h4>
                    <span id="copyRoleName" class="text-info"></span>
                </div>
                <div class="modal-body">
                    <div class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" data-i18n="page.system.label.sourceRole">源角色</label>
                            <div class="col-sm-9">
                                <span class="form-control-static" id="sourceRoleName"></span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">目标公司</label>
                            <div class="col-sm-9">
                                <div id="companyList" style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px;">
                                    <!-- 公司列表将在这里动态生成 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="confirmCopyBtn" class="btn btn-primary" data-i18n="page.system.label.confirmCopy">确认复制</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--图表配置-->
    <div class="modal fade" id="chartPageModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">图表配置</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="currentchartPage">现有图表</label>
                            <div class="col-sm-9">
                                <div class="tags" style="border: 0px" id="currentchartPage"></div>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="chartPage">图表</label>
                            <div class="col-sm-9">
                                <div id="chartList" class="tags" style="border: 0px"></div>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer ">
                    <button type="button" id="saveChartPageBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>

            </div>
        </div>
    </div>

    <!--任务配置-->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">任务权限配置</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group hide">
                            <label class="col-sm-3 control-label no-padding-right" for="taskPermList">现有任务权限</label>
                            <div class="col-sm-9">
                                <div class="tags" style="border: 0px" id="taskPermList"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="addRoleModule" data-i18n="page.system.label.task">任务</label>
                            <div class="col-sm-9">
                                <input type="text" id="task" class="col-sm-8 v_required v_typeahead" data-toggle="popover" data-trigger='manual'/>
                                <button type="button" id="addRoleModuleBtn" class="btn btn-xs btn-primary" style="margin: 3px 5px;" data-i18n="msg.save">保存</button>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" data-i18n="page.system.label.task">任务</label>
                            <div id="taskList" class="tags" style="border: 0px"></div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" name="saveTaskBtn" class="btn btn-primary hide" data-i18n="msg.save">保存</button>
                    <button type="button" name="cancelTaskBtn" class="btn btn-default hide" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>

            </div>
        </div>
    </div>

    <!--任务复制弹窗-->
    <div class="modal fade" id="taskCopyModal" tabindex="-1">
        <div class="modal-dialog" style="width: 600px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">任务复制</h4>
                    <span id="copyTaskRoleName" class="text-info"></span>
                </div>
                <div class="modal-body">
                    <div class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" data-i18n="page.system.label.sourceRole">源角色</label>
                            <div class="col-sm-9">
                                <span class="form-control-static" id="sourceTaskRoleName"></span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">目标公司</label>
                            <div class="col-sm-9">
                                <div id="taskCompanyList" style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px;">
                                    <!-- 公司列表将在这里动态生成 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="confirmTaskCopyBtn" class="btn btn-primary" data-i18n="page.system.label.confirmCopy">确认复制</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* 三级模块样式 */
    .dd-item.item-green {
        background-color: #f8fff8;
        border-left: 3px solid #82b465;
    }

    .dd-item.item-green .dd-handle {
        background-color: #f8fff8;
        border: 1px solid #d6e9c6;
    }

    .dd-item.item-green .dd-handle:hover {
        background-color: #e8f5e8;
    }

    /* 层级缩进样式优化 */
    .dd-list .dd-list .dd-list {
        margin-left: 20px;
    }

    /* 按钮hover效果 */
    .btn:hover .fa-spinner {
        animation: none;
    }
</style>

<script type="text/javascript">
    $.loadScript(['js/system/role.js']);
</script>
