<div>
    <div class="row">
        <div id="roleList" class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div>
            <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
            <!--分页-->
        </div>

        <div id="roleRightDiv" class="col-xs-12 hidden">
            <div>
                <span id="roleRightContent"></span>
            </div>
            <div class="col-xs-4">
                <ul id="treeDemo" class="ztree"></ul>
            </div>
            <input id="roleRightRoleId" class="col-xs-10 col-sm-5 hidden">
            <div class="col-xs-8">
                <span>
                    说明: <br />&nbsp;&nbsp;&nbsp;&nbsp;选择功能文件夹可以控制该角色左侧功能树形菜单的可见权限. <br />&nbsp;&nbsp;&nbsp;&nbsp;选择从能文件夹下的子项可以控制该角色对哪些action有权限.
                </span>
            </div>
            <div class="col-xs-12 space-5 form-group"></div>
            <div class="col-xs-12">
                <button type="button" id="saveRoleRightBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelRoleRightBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="roleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="myModalLabel">角色信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <div class="block clearfix">
                                <label for="roleId" class="col-sm-3 control-label no-padding-right">角色编号</label>
                                <span class="col-md-9 block   ">
                                    <input type="text" id="roleId" class="col-xs-10 col-sm-5 v_required v_roleId" data-toggle="popover" data-trigger='manual' maxlength="4" />
                                </span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="roleName">角色名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="roleName" class="col-xs-10 col-sm-5 v_required v_name" data-toggle="popover" data-trigger='manual' maxlength="8" />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="content">角色描述</label>
                            <div class="col-sm-9">
                                <textarea id="content" class="col-xs-10 col-sm-5 v_name" rows="3" data-toggle="popover" data-trigger='manual' maxlength="20"></textarea>
                            </div>
                        </div>
                        <div class="space-4 "></div>
                    </form>
                </div>

                <div class="modal-footer ">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--外链配置-->
    <div class="modal fade" id="chainPageModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">外链配置</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="currentchainPage">现有外链</label>
                            <div class="col-sm-9">
                                <div class="tags" style="border: 0px" id="currentchainPage"></div>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="chainPage">外链</label>
                            <div class="col-sm-9">
                                <div id="chainList" class="tags" style="border: 0px"></div>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer ">
                    <button type="button" id="saveChainPageBtn" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>

            </div>
        </div>
    </div>

    <!--操作配置-->
    <div class="modal fade" id="operationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">操作配置</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group hide">
                            <label class="col-sm-3 control-label no-padding-right" for="currentOperation">现有操作</label>
                            <div class="col-sm-9">
                                <div class="tags" style="border: 0px" id="currentOperation"></div>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">操作</label>
                            <div id="operation" class="tags" style="border: 0px"></div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" name="saveBtn" class="btn btn-primary hide">保存</button>
                    <button type="button" name="cancelBtn" class="btn btn-default hide" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--模块配置-->
    <div class="modal fade" id="moduleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">模块配置</h4>
                </div>
                <div class="modal-body"></div>

                <div class="modal-footer">
                    <button type="button" name="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" name="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--图表配置-->
    <div class="modal fade" id="chartPageModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">图表配置</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="currentchartPage">现有图表</label>
                            <div class="col-sm-9">
                                <div class="tags" style="border: 0px" id="currentchartPage"></div>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="chartPage">图表</label>
                            <div class="col-sm-9">
                                <div id="chartList" class="tags" style="border: 0px"></div>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer ">
                    <button type="button" id="saveChartPageBtn" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>

            </div>
        </div>
    </div>

    <!--任务配置-->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">任务权限配置</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group hide">
                            <label class="col-sm-3 control-label no-padding-right" for="taskPermList">现有任务权限</label>
                            <div class="col-sm-9">
                                <div class="tags" style="border: 0px" id="taskPermList"></div>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">任务</label>
                            <div id="taskList" class="tags" style="border: 0px"></div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer ">
                    <button type="button" name="saveTaskBtn" class="btn btn-primary hide">保存</button>
                    <button type="button" name="cancelTaskBtn" class="btn btn-default hide" data-dismiss="modal">取消</button>
                </div>

            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/system/role.js']);
</script>
