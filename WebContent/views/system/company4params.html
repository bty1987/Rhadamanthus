<div>
    <!-- 页面标题 -->
    <div id="fl-statement"></div>

    <!-- 工具栏 -->
    <div class="row">
        <div class="col-xs-12">
            <div class="form-inline">
                <!-- 公司选择器 -->
                <div class="form-group">
                    <label>公司：</label>
                    <select id="companySelect" class="form-control input-sm">
                        <option value="">请选择公司</option>
                    </select>
                </div>

                <!-- 搜索框 -->
                <div class="form-group">
                    <input type="text" id="searchInput" class="form-control input-sm"
                           placeholder="搜索配置项名称、配置键、说明或当前值..." style="width: 360px;">
                </div>

                <!-- 操作按钮 -->
                <button id="addConfigBtn" class="btn btn-sm btn-success">
                    <i class="icon-plus"></i> 新增自定义配置
                </button>

                <button id="refreshBtn" class="btn btn-sm btn-info">
                    <i class="icon-refresh"></i> 刷新
                </button>
            </div>

            <!-- 提示 -->
            <div class="alert alert-info" style="margin-top: 10px; margin-bottom: 0;">
                <i class="icon-info-sign"></i>
                下方列出当前系统支持的全部可配置项。<strong>蓝色</strong>为已配置的实际值，<strong>灰色「未配置」</strong>表示该项尚未设置，将使用系统默认值。点击「设置值」可新增配置，点击「编辑」可修改已有配置。
            </div>
        </div>
    </div>

    <!-- 配置分组折叠面板 -->
    <div class="row" style="margin-top: 15px;">
        <div class="col-xs-12">
            <div class="panel-group" id="configAccordion">
                <!-- 动态生成分组面板 -->
            </div>
        </div>
    </div>
</div>

<!-- 编辑/新增模态框 -->
<div class="modal fade" id="configModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="modalTitle">配置项</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal" id="configForm">
                    <!-- 分组 -->
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">分组</label>
                        <div class="col-sm-9">
                            <select id="configGroup" class="form-control">
                                <option value="">请选择分组</option>
                            </select>
                        </div>
                    </div>

                    <!-- 配置键 -->
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">配置键</label>
                        <div class="col-sm-9">
                            <input type="text" id="configKey" class="form-control" maxlength="125">
                            <small class="text-muted" id="configKeyDisplay">建议使用字母、数字、下划线</small>
                        </div>
                    </div>

                    <!-- 配置名称(目录项自动填充,仅展示参考) -->
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">配置名称</label>
                        <div class="col-sm-9">
                            <input type="text" id="configName" class="form-control"
                                   placeholder="该配置项的中文名称(参考)" maxlength="64" readonly>
                        </div>
                    </div>

                    <!-- 说明(目录项自动填充,仅展示参考) -->
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">说明</label>
                        <div class="col-sm-9">
                            <textarea id="configDesc" class="form-control" rows="2" readonly
                                      style="background-color:#f5f5f5;"></textarea>
                        </div>
                    </div>

                    <!-- 配置值 -->
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">配置值</label>
                        <div class="col-sm-9">
                            <textarea id="configValue" class="form-control" rows="3"
                                      placeholder="输入配置值"></textarea>
                        </div>
                    </div>

                    <!-- 备注 -->
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">备注</label>
                        <div class="col-sm-9">
                            <textarea id="configComment" class="form-control" rows="2"
                                      placeholder="配置项备注说明" maxlength="125"></textarea>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="deleteBtn" class="btn btn-danger pull-left" style="display:none;">
                    <i class="icon-trash"></i> 删除此配置
                </button>
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/system/systemConfigCatalog.js', 'js/system/company4params.js']);
</script>
