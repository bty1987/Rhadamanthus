<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="updateCompanyModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="addItemDialog">公司信息</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<input type="text" id="cid" class="hide" />
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="no">编号</label>
							<div class="col-sm-9">
								<input type="text" id="no" class="col-xs-10 col-sm-5 v_required v_company" data-toggle="popover" data-trigger='manual' maxlength="8"/>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="code">code</label>
							<div class="col-sm-9">
								<input type="text" id="code" class="col-xs-10 col-sm-5 v_required"  data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="shortname">短名</label>
							<div class="col-sm-9">
								<input type="text" id="shortname" class="col-xs-10 col-sm-5 v_required"  data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_required"  data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
							<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="fullname">全名</label>
							<div class="col-sm-9">
								<input type="text" id="fullname" class="col-xs-10 col-sm-5 v_required"  data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
							<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="address">地址</label>
							<div class="col-sm-9">
								<input type="text" id="address" class="col-xs-10 col-sm-5 v_required"  data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
							<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="corporation">法人</label>
							<div class="col-sm-9">
								<input type="text" id="corporation" class="col-xs-10 col-sm-5 v_required"  data-toggle="popover" data-trigger='manual' maxlength="4"/>
							</div>
						</div>
							<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="phone">电话</label>
							<div class="col-sm-9">
								<input type="text" id="phone" class="col-xs-10 col-sm-5 v_required v_phones2"  data-toggle="popover" data-trigger='manual' maxlength="32"/>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="phone">业务类型</label>
							<div class="col-sm-9">
								<select id="atttype" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="updateCompanyBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="updateOrganizationModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<h4 class="modal-title" id="addItemDialog">组织信息</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="drganization">装修组织</label>
							<div class="col-sm-9">
								<input type="text" class="col-xs-10 col-sm-5" data-toggle="popover"  data-trigger="manual" id="drganization">
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="srganization">销售组织</label>
							<div class="col-sm-9">
								<input type="text" class="col-xs-10 col-sm-5" data-toggle="popover"  data-trigger="manual" id="srganization">
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="updateOrganizationBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/system/company.js']);
</script>
