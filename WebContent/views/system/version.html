
<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="versionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="myModalLabel" data-i18n="page.system.btn.addVersion">添加版本</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="no">版本号</label>
                            <div class="col-sm-9">
                                <input type="hidden" id="vid" />
                                <input type="text" id="no" maxlength="64" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="createTime">创建时间</label>
                            <div class="col-sm-9">
                                <input type="text" id="createTime" maxlength="64" class="col-xs-10 col-sm-7 v_required date-picker" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="createTime">说明</label>
                            <div class="col-sm-9">
                                <textarea id="comment" class="col-xs-10 col-sm-7 v_required" rows="10" cols="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
	$.loadScript(['js/system/version.js']);
</script>
