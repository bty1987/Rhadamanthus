<div class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addItemDialog">职位信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <input type="text" id="did" class="hide"/>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="dutyName">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="dutyName" class="col-xs-10 col-sm-5 v_required"
                                       data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="lead">领导标识</label>
                            <div class="col-sm-9">
                                <select maxlength="64" id="lead" class="col-xs-10 col-sm-5  v_required"
                                        data-toggle="popover" data-trigger='manual'> <span class='star'></span>
                                    <option value="0">普通</option>
                                    <option value="1">领导</option>
                                </select>
                            </div>
                        </div>

                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="depttype">所属部门</label>
                            <div class="col-sm-9">
                                <select id="depttype" class="col-xs-10 col-sm-5 v_required" data-toggle="popover"
                                        data-trigger='manual'></select>
                                <span class='star'></span>
                            </div>
                        </div>

                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveAddItemBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelAddItemBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/system/duty.js']);
</script>
