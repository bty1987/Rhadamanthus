<div id="personInfoPageContent">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="setupModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="personInfoDialog">人员部署</h4>
				</div>

				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="supervisorQuality">监理员</label>
							<div class="col-sm-9">
								<input type="text" class="v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="supervisor" placeholder="监理">
							</div>
						</div>
                        <div class="space-4"></div>
                        
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">工程公司</label>
							<div class="col-sm-9">
								<span class="col-xs-10 col-sm-6" style="margin-top: 5px;" id="conpanyName"></span>
							</div>
						</div>
						<div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">工程公司</label>
                            <div class="col-sm-9">
                                <select id='conpany' class='col-xs-10 col-sm-5'></select>
                            </div>
                        </div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="deployedBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
