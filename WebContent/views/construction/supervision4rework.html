<div>
	<div id="fl-statement"></div>

	<div class="row">
		<div class="col-xs-12">
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	<div class="modal fade" id="reworkModal" tabindex="-1"	>
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="reworkDialog">返工信息</h4>
				</div>

				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for=createTime>返工时间</label>
							<div class="col-sm-9">
								<input class="date-picker-date col-xs-10 col-sm-5 v_required" id="createTime" type="text" data-date-format="yyyy-mm-dd"  />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="reworkDes">返工说明</label>
							<div class="col-sm-9">
								<textarea id="reworkDes" class="col-xs-10 col-sm-5 v_required" maxlength="256" rows="3" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="SaveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/utils/constructionPageUtils.js', 'js/construction/supervision4rework.js']);
</script>
