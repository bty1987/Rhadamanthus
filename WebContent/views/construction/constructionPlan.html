<div id="fl-statement"><div class="page-header"><h1>工程计划<small><i class="icon-double-angle-right"></i>施工计划</small></h1></div></div>
<div class="row">
    <div class="col-xs-12">
        <div class="row" style="margin-left:10px;margin-right:10px">
            <div id="constructionPlans"></div>
            <div>
                <div>
                    <a class="btn btn-minier btn-yellow pull-left" id="constructionPlanBtn" style="margin-top: 7px;margin-left: 2px"><i class="icon-plus bigger-110"></i>添加</a>
                </div>
                <div>
                    <a class="btn btn-minier btn-success pull-left" id="printBtn" style="margin-top: 7px;margin-left: 4px"><i class="icon-plus bigger-110"></i>打印</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="constructionPlanModal" tabindex="-1" >
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myModalLabel">施工计划</h4>
            </div>
            <div class="modal-body" >
                <form class="form-horizontal">

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right ">名称</label>
                        <div class="col-md-9">
                            <select id='name' class='col-xs-10 col-sm-6'></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">开始时间</label>
                        <div class="col-sm-9">
                            <input type="text" id='startTime' class='col-xs-10 col-sm-6'/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">结束时间</label>
                        <div class="col-sm-9">
                            <input type="text" id='endTime' class='col-xs-10 col-sm-6'/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">说明</label>
                        <div class="col-md-9">
                            <textarea id="comment" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="space-4"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/construction/constructionPlan.js']);
</script>
