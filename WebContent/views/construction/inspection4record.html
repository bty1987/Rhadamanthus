<div class="modal fade" id="recordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="decorationOrderDialog">璁板綍</h4>
            </div>
            
            <div class="modal-body" id="inspectionRecord">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="orderId">瑁呬慨鍗曞彿</label>
                        <div class="col-sm-9">
                            <input id="orderId" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual' value="111"/>
                        </div>
                    </div>
                
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="orderAddr">妤肩洏鍦板潃</label>
                        <div class="col-sm-9">
                            <input id="orderAddr" type="text" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="startDate">寮�鏃堕棿</label>
                        <div class="col-sm-9">
                            <input id="startDate" class="date-picker col-xs-10 col-sm-5 v_required" readonly="readonly"  type="text" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
                        </div>
                        <label class="col-sm-3 control-label no-padding-right" for="startTime"></label>
                        <div class="col-sm-9">
                            <div class="bootstrap-timepicker">
                                <input id="startTime" class="date-picker-date col-xs-10 col-sm-5 v_required" type="text" />
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="endDate">缁撴潫鏃堕棿</label>
                        <div class="col-sm-9">
                            <input id="endDate" class="date-picker col-xs-10 col-sm-5 v_required" readonly="readonly"  type="text" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
                        </div>
                        <label class="col-sm-3 control-label no-padding-right" for="endTime"></label>
                        <div class="col-sm-9">
                            <div class="bootstrap-timepicker">
                                <input id="endTime" class="date-picker-date col-xs-10 col-sm-5 v_required" type="text" />
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="recordDes">澶囨敞</label>
                        <div class="col-sm-9">
                            <textarea id="recordDes" class="col-xs-10 col-sm-5 v_required" rows="3" maxlength="256" data-toggle="popover" data-trigger='manual'></textarea>
                        </div>
                    </div>
                    
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary">淇濆瓨</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">鍙栨秷</button>

        </div>

</div>
