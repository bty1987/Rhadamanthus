<div id="supervisionPageContent">
	<div class="row">
		<div class="col-xs-12">
			<div id="supervisionCondList" class="fl_search clearfix"></div>
			<div id="supervisionResultList" class="clearfix tab-pane active"></div>
			<div id="supervisionPagenation" class="fl-page-wrap clearfix"></div>
		</div>
	</div>
</div>

<div class="modal fade" id="constructionInfoModal" tabindex="-1" >
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title" id="myModalLabel">工程信息</h4>
			</div>
			<div class="modal-body" >
				<form class="form-horizontal">

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">工期</label>
						<div class="col-sm-9">
							<input type="text" id='timeLimit' class='col-xs-10 col-sm-6' />
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right ">铲大白</label>
						<div class="col-md-9">
							<select id='ishovel' class='col-xs-10 col-sm-6'></select>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right ">钥匙</label>
						<div class="col-sm-9">
							<select id='iskey' class='col-xs-10 col-sm-6'></select>
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right ">开工仪式</label>
						<div class="col-sm-9">
							<select id='isCeremony' class='col-xs-10 col-sm-6'></select>
						</div>
					</div>
					<div class="space-4"></div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">预计放线时间</label>
						<div class="col-sm-9">
							<input type="text" id='drawlineTime' class='col-xs-10 col-sm-6' />
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">预计完工时间</label>
						<div class="col-sm-9">
							<input type="text" id='finishTime' class='col-xs-10 col-sm-6' />
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">预计领钥匙时间</label>
						<div class="col-sm-9">
							<input type="text" id='keyTime' class='col-xs-10 col-sm-6' />
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">预计设计完成时间</label>
						<div class="col-sm-9">
							<input type="text" id='designTime' class='col-xs-10 col-sm-6' />
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">备注说明</label>
						<div class="col-md-9">
							<textarea id="comment" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
						</div>
					</div>
					<div class="space-4"></div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="printQuotationCNModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title" id="myModalLabe3">打印定额工费</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right orange">施工节点</label>
						<div class="col-md-9">
							<select id="constructionNode" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual"></select>
						</div>
					</div>
                    
                    <div class="form-group" id="subtype">

                            <label for="no" class="col-sm-3 control-label no-padding-right orange">内容</label>
                            <div class="col-md-9">
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="1" name="type" checked="checked">
                                    <span class="lbl">报价</span>
                                </label>

                                <label class="inline">
                                    <input type="checkbox" class="ace" value="2" name="type">
                                    <span class="lbl">拓展</span>
                                </label>

                                <label class="inline">
                                    <input type="checkbox" class="ace" value="4" name="type">
                                    <span class="lbl">增减</span>
                                </label>
                                
                                <label class="inline">
                                    <input type="checkbox" class="ace" value="8" name="type">
                                    <span class="lbl">附加</span>
                                </label>

                            </div>
                        </div>

				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="printNormriceSBtn" class="btn btn-primary">监理打印</button>
				<button type="button" id="printNormriceWBtn" class="btn btn-primary">工人打印</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<div id="stockRecordPopUp" class="portlet box page-content"></div>

<script type="text/javascript">
	$.loadScript(['js/construction/supervision.js']);
</script>
