<div>
	<div class="row" id="drawLineGroupList">
		<div class="col-md-12">
			<div id="condList" class="fl_search clearfix"></div>
			<div id="resultList" class="clearfix tab-pane active"></div>
		</div>
	</div>
	
	<div class="modal fade" id="editModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="drawLineDialog">放线确认信息</h4>
				</div>

				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right"
								for="actualDate">放线日期</label>
							<div class="col-sm-9">
								<input type="text" class="hide" id="dlid" />
								<input type="text" class="hide" id="groupIndex" /> 
								<input class="date-picker-date col-xs-10 col-sm-5 v_required" id="actualDate" readonly="readonly"  type="text" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="startTime">开始时间</label>
							<div class="col-sm-9">
								<div class="bootstrap-timepicker">
									<input id="startTime" type="text" class="timepicker v_required col-xs-10 col-sm-5" />
								</div>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="endTime">结束时间</label>
							<div class="col-sm-9">
								<div class="bootstrap-timepicker">
									<input id="endTime" type="text" class="timepicker v_required col-xs-10 col-sm-5" />
								</div>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="drawLineGroup">放线小组</label>
							<div class="col-sm-9">
								<select class='col-xs-10 col-sm-5 v_required' id='drawLineGroup' data-toggle="popover" data-trigger='manual'>
								</select>
							</div>
						</div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="applyModal" tabindex="-1">
		<div class="modal-dialog" style="width:800px;">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="drawLineApplyDialog">部署信息</h4>
				</div>
				
				<div class="modal-body">
					<div id="calendar"></div>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="setupModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="drawLineDeploymentDialog">人员部署</h4>
				</div>

				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<div class="col-sm-12" align="center">
								<span id="orderInfos"></span>
							</div>
						</div>
						<div class="space-4"></div>
					
						<div class="form-group">
							<label class="col-sm-4 control-label no-padding-right orange" for="supervisor">监理员</label>
							<div class="col-sm-8">
								<input type="text" class="v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="supervisor" placeholder="监理">
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="deployedBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="drawLineStatusModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="drawLineStatusDialog">状态确认</h4>
				</div>

				<div class="modal-body">

					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="status">状态</label>
							<div class="col-sm-9">
								<select id="status" class="col-xs-10 col-sm-5"></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="content">备注</label>
							<div class="col-sm-9">
								<textarea id="content" class="col-xs-10 col-sm-5"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="constructionInfoModal" tabindex="-1" >
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel">工程信息</h4>
				</div>
				<div class="modal-body" >
					<form class="form-horizontal">

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">工期</label>
							<div class="col-sm-9">
								<input type="text" id='timeLimit' class='col-xs-10 col-sm-6'></input>
							</div>
						</div>
						<div class="form-group">

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right ">铲大白</label>
							<div class="col-md-9">
								<select id='ishovel' class='col-xs-10 col-sm-6'></select>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right ">钥匙</label>
							<div class="col-sm-9">
								<select id='iskey' class='col-xs-10 col-sm-6'></select>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right ">开工仪式</label>
							<div class="col-sm-9">
								<select id='isCeremony' class='col-xs-10 col-sm-6'></select>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">预计放线时间</label>
							<div class="col-sm-9">
								<input type="text" id='drawlineTime' class='col-xs-10 col-sm-6' />
							</div>
						</div>
						<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right">预计完工时间</label>
								<div class="col-sm-9">
								<input type="text" id='finishTime' class='col-xs-10 col-sm-6' />
							</div>
						</div>
						<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right">预计领钥匙时间</label>
								<div class="col-sm-9">
								<input type="text" id='keyTime' class='col-xs-10 col-sm-6' />
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">预计设计完成时间</label>
							<div class="col-sm-9">
								<input type="text" id='designTime' class='col-xs-10 col-sm-6' />
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">备注说明</label>
							<div class="col-md-9">
								<textarea id="comment" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
                      </div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveInfoBtn" class="btn btn-primary">保存</button>
					<button type="button" id="canceInfoBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

</div>

<script type="text/javascript">
	$.loadScript(['js/construction/drawline4setup.js']);
</script>
