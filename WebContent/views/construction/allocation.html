<div id="workerAllocationPageContent">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div>
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
</div>

<div class="modal fade" id="constructionInfoModal" tabindex="-1" >
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title" id="myModalLabel">工程信息</h4>
			</div>
			<div class="modal-body" >
				<form class="form-horizontal">

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">工期</label>
						<div class="col-sm-9">
							<input type="text" id='timeLimit' class='col-xs-10 col-sm-6' />
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right ">铲大白</label>
						<div class="col-md-9">
							<select id='ishovel' class='col-xs-10 col-sm-6'></select>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right ">钥匙</label>
						<div class="col-sm-9">
							<select id='iskey' class='col-xs-10 col-sm-6'></select>
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right ">开工仪式</label>
						<div class="col-sm-9">
							<select id='isCeremony' class='col-xs-10 col-sm-6'></select>
						</div>
					</div>
					<div class="space-4"></div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">预计放线时间</label>
						<div class="col-sm-9">
							<input type="text" id='drawlineTime' class='col-xs-10 col-sm-6' />
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">预计完工时间</label>
						<div class="col-sm-9">
							<input type="text" id='finishTime' class='col-xs-10 col-sm-6' />
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">预计领钥匙时间</label>
						<div class="col-sm-9">
							<input type="text" id='keyTime' class='col-xs-10 col-sm-6' />
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">预计设计完成时间</label>
						<div class="col-sm-9">
							<input type="text" id='designTime' class='col-xs-10 col-sm-6' />
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right">备注说明</label>
						<div class="col-md-9">
							<textarea id="comment" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
						</div>
					</div>
					<div class="space-4"></div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>
<div id="stockRecordPopUp" style="z-index:9002" class="portlet box page-content"></div>
<script type="text/javascript">
	$.loadScript(['js/utils/constructionPageUtils.js', 'js/construction/allocation.js']);
</script>
