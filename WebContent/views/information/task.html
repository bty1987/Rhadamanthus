<div class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addtaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addItemDialog">任务信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="taskName">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskName" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                                <span class='star'></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="filepath">执行文件的地址</label>
                            <div class="col-sm-9">
                                <input type="text" id="filepath" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="64"/>
                                <span class='star'></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="tasktype">类型</label>
                            <div class="col-sm-9">
                                <select id="tasktype" class="col-xs-10 col-sm-5 v_required" data-toggle="popover"data-trigger='manual'>
                                    <option value="0">python</option>
                                    <option value="1">shell</option>
                                </select>
                                <span class='star'></span>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="addTaskBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelTaskBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/information/task.js']);
</script>
