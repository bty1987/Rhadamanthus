<style>
.uploadify-button-text{line-height: 0 !important;}
.lineheight0{line-height:15px !important;}
</style>
<!--通知页-->
<div>
	<div class="row">
		<div class="col-xs-12">
			<!-- 查询条件-->
			<div id="condList" class="fl_search clearfix"></div>
			<!--查询结果-->
			<div id="resultList" class="clearfix tab-pane active"></div>
			<!--分页-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div>
		</div>
	</div>
</div>
	<div class="modal fade" id="noticeModal" tabindex="-1">
		<div class="modal-dialog" style="width: 800px">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="myModalLabel">公告信息</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal" id="form">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="theme">主题</label>
							<div class="col-sm-9">
								<input type="text" id="theme" maxlength="64" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
								<span class='star'></span>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="typeSel">公告类型</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-7" id="typeSel">
									<option value="通知">通知</option>
									<option value="活动">活动</option>
								</select>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="prioritySel">优先级</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-7" id="prioritySel">
									<option value="普通">普通</option>
									<option value="重要">重要</option>
									<option value="紧急">紧急</option>
								</select>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="startTime">开始时间</label>
							<div class="col-sm-9">
								<div class="input-group col-xs-10 col-sm-7 no-padding" data-for="startTime" data-toggle="popover" data-trigger='manual'>
									<input class="form-control date-picker-date v_required" id="startTime" type="text" data-date-format="yyyy-mm-dd">
									<span class="input-group-addon">
										<i class="icon-calendar bigger-110"></i>
									</span>
								</div>
								<span class='star'></span>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="endTime">结束时间</label>
							<div class="col-sm-9">
								<div class="input-group col-xs-10 col-sm-7 no-padding" data-for="endTime" data-toggle="popover" data-trigger='manual'>
									<input class="form-control date-picker-date v_required" id="endTime" type="text" data-date-format="yyyy-mm-dd">
									<span class="input-group-addon">
										<i class="icon-calendar bigger-110"></i>
									</span>
								</div>
								<span class='star'></span>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="isPublic">公开</label>
							<div class="col-sm-9">
								<input type="checkbox" id="isPublic" class="ace ace-switch ace-switch-5"/>
								<span class="lbl isOrNot"></span>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="attachment">上传附件</label>
							<div class="col-sm-3 col-xs-4">
								<div id="attachment"></div>
								<input type="text" class="hidden" id="filePath"/>
							</div>
						</div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="contents">内容</label>
							<div class="col-sm-9">
								<textarea id="contents" maxlength="512" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' rows="5" cols="10" class="col-sm-12"></textarea>
								<span class='star'></span>
							</div>
						</div>

					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>


<div class="modal fade" id="managements" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title">管理部门是否可见</h4>
			</div>
			<div class="modal-body">

			</div>

			<div class="modal-footer ">
				<button type="button" id="manageBtn" class="btn btn-primary">保存</button>
				<button type="button" id="canceBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/information/noticeMng.js']);
</script>
