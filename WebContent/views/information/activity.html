<div id="activityPageContent">
	<div>
		<div class="row">
			<div class="col-xs-12">
				<!-- 查询条件-->
				<div id="condList" class="fl_search clearfix"></div>
				<!--查询结果-->
				<div id="resultList" class="clearfix tab-pane active"></div>
				<!--分页-->
				<div id="pagenation" class="fl-page-wrap clearfix"></div>
			</div>
		</div>
		
		<div class="modal fade" id="activityModal" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
	      			<div class="modal-header">
	        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
	        			<h4 class="modal-title" id="myModalLabel" data-i18n="page.information.label.activityInfo">活动信息</h4>
	      			</div>
	      			<div class="modal-body">
			      		<form class="form-horizontal">
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right orange" for="activityName">名称</label>
								<div class="col-sm-9">
									<input type="text" id="activityName" maxlength="32" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
								</div>
							</div>
							
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right orange" for="startTime">开始时间</label>
								<div class="col-sm-9">
									<div class="input-group col-xs-10 col-sm-7 no-padding" data-for="startTime" data-toggle="popover" data-trigger='manual'>
										<input class="form-control date-picker-date v_required" id="startTime" type="text" data-date-format="yyyy-mm-dd">
									</div>
								</div>
							</div>
							
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right orange" for="endTime">结束时间</label>
								<div class="col-sm-9">
									<div class="input-group col-xs-10 col-sm-7 no-padding" data-for="endTime" data-toggle="popover" data-trigger='manual'>
										<input class="form-control date-picker-date v_required" id="endTime" type="text" data-date-format="yyyy-mm-dd">
									</div>
								</div>
							</div>

							<div class="form-group" style="margin-left: -83px">
								<label class="col-md-4 control-label no-padding-right" data-i18n="page.information.label.paymentType">款项类型</label>

								<div class="col-md-8">
									<div>
										<label class="col-md-5">
											<input type="checkbox" name="activityPaytype" id="check1" class="ace" value= 1>
											<span class="lbl" data-i18n="page.information.label.combinedPrepay">合预款</span>
										</label>
									</div>
									<div>
										<label class="col-md-5">
											<input type="checkbox" name="activityPaytype" id="check2" class="ace" value= 2>
											<span class="lbl" data-i18n="page.information.label.mainPrepay">主预款</span>
										</label>
									</div>
									<div>
										<label class="col-md-5">
											<input type="checkbox" name="activityPaytype" id="check3" class="ace" value= 4>
											<span class="lbl" data-i18n="page.information.label.decorationPay">装修款</span>
										</label>
									</div>
									<div>
										<label class="col-md-5">
											<input type="checkbox" name="activityPaytype" id="check4" class="ace" value= 8>
											<span class="lbl" data-i18n="page.information.label.materialPay">主材款</span>
										</label>
									</div>
									<div>
										<label class="col-md-5">
											<input type="checkbox" name="activityPaytype" id="check5" class="ace" value= 16>
											<span class="lbl" data-i18n="page.information.label.salesPay">销售款</span>
										</label>
									</div>
									<div>
										<label class="col-md-5">
											<input type="checkbox" name="activityPaytype" id="check6" class="ace" value= 32>
											<span class="lbl" data-i18n="page.information.label.servicePay">服务款</span>
										</label>
									</div>
								</div>
							</div>

							<div class="form-group" style="margin-left: -83px">

								<label class="col-md-4 control-label no-padding-right">活动类型</label>

								<div class="col-md-8">
									<select class="col-xs-10 col-sm-5 v_required" id="type" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}" style="width: 235px">
									</select>
									<span class="required"></span>
								</div>
							</div>

							<div class="form-group" style="margin-left: -83px">

								<label class="col-md-4 control-label no-padding-right">类型</label>

								<div class="col-md-8">
									<select class="col-xs-10 col-sm-5 v_required" id="atttype" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}" style="width: 235px">
									</select>
									<span class="required"></span>
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right orange" for="multiple">倍数</label>
								<div class="col-sm-9">
									<input type="text" maxlength="64" id="multiple" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right orange" for="validays">有效天数</label>
								<div class="col-sm-9">
									<input type="text" maxlength="64" id="validays" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right orange" for="exchange">兑换率</label>
								<div class="col-sm-9">
									<input type="text" maxlength="64" id="exchange" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right orange" for="content">说明</label>
								<div class="col-sm-9">
									<textarea id="content" class="col-xs-10 col-sm-7 v_required" rows="3" cols="3"></textarea>
								</div>
							</div>

						</form>
	      			</div>
					<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>
</div>

</div>

<div id="activityItemPopUp" class="portlet box"></div>

<script type="text/javascript">
	$.loadScript(['js/information/activity.js']);
</script>
