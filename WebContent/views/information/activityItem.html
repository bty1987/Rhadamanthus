<div class="page-content" id="activityItem">
    <div class="page-header">
        <h1 id="activityName" class="inline"></h1>
        <div class="pull-right inline">
            <div class="btn btn-success" id="addBtn">添加</div>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12 col-sm-12 pricing-span-body" style="margin-left: 30px">
            <div id="activityItems"></div>
        </div>
    </div>

    <div class="modal fade" id="activityItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="myModalLabel">活动物品</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal" id="form">

                        <div class="form-group">

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right orange" for="awardStocksname">物品名称</label>
                                <div class="col-sm-9">
                                    <input type="text" id="name" class="col-sm-7 col-xs-10 v_typeahead" />
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right orange" for="money">金额</label>
                                <div class="col-sm-9">
                                    <input type="text" id="money" class="col-sm-7 col-xs-10 v_required v_float_3" />
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right orange" for="integral">积分</label>
                                <div class="col-sm-9">
                                    <input type="text" id="integral" class="col-sm-7 col-xs-10 v_number v_required" />
                                </div>
                            </div>

                        </div>
                    </form>
                </div>
                
                <div class="modal-footer">
                    <button type="button" id="saveActivityItemBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    $.loadScript(['js/information/activityItem.js']);
</script>
