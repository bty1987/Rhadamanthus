<div id="storehousePageContent" class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div class="clearfix tab-pane active" id="resultList"></div> <!--查询结果-->
            <div class="fl-page-wrap clearfix" id="pagenation"></div> <!--分页-->
        </div>
    </div>
</div>

<div id="layerAdd1" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="redact">
            <div class="widget-main">
                <div class="row" style="margin-right: 0px">
                    <div class="col-xs-12">

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="no">编号</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" maxlength="11" id="no" >
                                <span class="required"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="name">商品名称</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" maxlength="11" id="name" >
                                <span class="required"></span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="num" class="col-md-3 control-label no-padding-right orange">数量</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required v_positiveInteger" maxlength="11" id="num" >
                                <span class="required"></span>
                            </div>
                        </div>

                        <div class="form-group" id = "moneys">
                            <label class="col-md-3 control-label no-padding-right orange" for="price">商品价格</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_float_3" maxlength="11" id="price" >
                                <span class="required"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="content">说明</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap" maxlength="11" id="content" >
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right" for="format">规格</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap" maxlength="11" id="format" >
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">库房信息</label>
                            <div class="col-md-8">
                                <select class="col-xs-10 col-sm-8 v_required" id="storeroom"  data-required="1" data-toggle="popover" data-trigger='manual' ></select>
                                <span class="required"></span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">子类</label>
                            <div class="col-md-8">
                                <select class="col-xs-10 col-sm-8 v_required" id="subtype"  data-required="1" data-toggle="popover" data-trigger='manual' >
                                </select>
                                <span class="required"></span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">奖品类型</label>
                            <div class="col-md-8">
                                <select class="col-xs-10 col-sm-8 v_required" id="type"  data-required="1" data-toggle="popover" data-trigger='manual' >
                                </select>
                                <span class="required"></span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">是否加入业绩</label>
                            <div class="col-md-8">
                                <select class="col-xs-10 col-sm-8 v_required" id="isPrefor" data-required="1" data-toggle="popover" data-trigger='manual' ></select>
                                <span class="required"></span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">是否加入库存</label>
                            <div class="col-md-8">
                                <select class="col-xs-10 col-sm-8 v_required" id="isStock" data-required="1" data-toggle="popover" data-trigger='manual' >
                                </select>
                                <span class="required"></span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">是否计入金额</label>
                            <div class="col-md-8">
                                <select class="col-xs-10 col-sm-8 v_required" id="isPayment" data-required="1" data-toggle="popover" data-trigger='manual' ></select>
                                <span class="required"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-md-offset-3 col-md-9">
                                <a class="btn btn-success btn-sm" id="saveBtn">确定</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

                        <div class="form-group">

                        </div>

                        <div class="form-group">
                            <div class="col-md-offset-3 col-md-9">
