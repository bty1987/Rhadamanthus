<div id="workesheetPageContent">
    <div>
        <div class="row">
            <div class="col-xs-12">
                <div id="condList" class="fl_search clearfix"></div>
                <div id="resultList" class="clearfix tab-pane active"></div>
                <div id="pagenation" class="fl-page-wrap clearfix"></div>
            </div>
        </div>

        <div class="modal fade" id="addWorksheetModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                        <h4 class="modal-title" id="addModalLabel">添加工单</h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal">

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right orange" for="module">模块</label>
                                <div class="col-sm-9">
                                    <input type="text" id="module" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right orange" for="content">内容</label>
                                <div class="col-sm-9">
                                    <input type="text" id="content" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                        <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="handWorksheetModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                        <h4 class="modal-title" id="handModalLabel">处理工单</h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal">

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right orange" for="result">结果</label>
                                <div class="col-sm-9">
                                    <input type="text" id="result" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="handBtn" class="btn btn-primary">确定</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/information/worksheet.js']);
</script>
