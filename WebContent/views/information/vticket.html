
<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="vticketModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content" style="width:900px;margin-left:-30%">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel">活动票</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<div class="col-xs-12">
							<form class="form-horizontal" id="form">
								<div class="row">
									<div class="col-md-12">
										<div class="form-group" style="display: none">
											<label for="vtid" class="col-sm-3 control-label no-padding-right">活动票ID</label>
											<div class="col-md-9">
												<input type="text" id="vtid" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group">
											<label for="tno" class="col-sm-3 control-label no-padding-right">活动票号</label>
											<div class="col-md-9">
												<input type="text" id="tno" maxlength="15" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group">
											<label for="belonger" class="col-sm-3 control-label no-padding-right">归属人</label>
											<div class="col-sm-9">
												<input type="text" id="belonger" class="col-xs-10 col-sm-6 v_required v_typeahead" data-placeholder="请输入归属人" data-toggle="popover" data-trigger='manual' data-placement="bottom"/>
											</div>
										</div>

										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="orderId">装修单号</label>
											<div class="col-sm-9">
												<input type="text" id="orderId" class="col-xs-10 col-sm-6 v_number v_required" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="name">姓名</label>
											<div class="col-sm-9">
												<input type="text" id="name" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="phone">电话</label>
											<div class="col-sm-9">
												<input type="text" id="phone" class="col-xs-10 col-sm-6 v_phone" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="address">地址</label>
											<div class="col-sm-9">
												<input type="text" id="address" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="vaid">活动</label>
											<div class="col-sm-9">
												<select id="vaid" name="type" maxlength="256" class="col-xs-10 col-sm-6 v_required"></select>
											</div>
										</div>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
				<div class="modal-footer" style="text-align: center">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
				</div>
			</div>
		</div>
	</div>

</div>

<div id="vawardPopUp" class="portlet box"></div>

<script type="text/javascript">
	$.loadScript(['js/information/vticket.js']);
</script>
