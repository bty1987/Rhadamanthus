<div id="awardPurchase">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="awardPurchaseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">奖品采购</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right" for="awardStock">库存</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap" maxlength="11" id="awardStock" >
                                <span class="required"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="num" class="col-md-3 control-label no-padding-right">数量</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_number v_positiveInteger" maxlength="11" id="num" >
                                <span class="required"></span>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="purchaseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">奖品采购</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right" for="inprice">入库价</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_float_3" maxlength="11" id="inprice" value="0">
                                <span class="required"></span>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveInw" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="bapriceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">奖品采购</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right" for="baprice">结算价</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_float_3" maxlength="11" id="baprice" value="0">
                                <span class="required"></span>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBap" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>

</div>


<script type="text/javascript">
    $.loadScript(['js/information/awardPurchase.js']);
</script>
