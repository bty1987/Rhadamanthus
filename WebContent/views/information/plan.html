<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addplanModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addItemDialog">计划信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="task">任务选择</label>
                            <div class="col-sm-9">
                                <select id="task" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'>
                                </select>
                                <span class='star'></span>
                            </div>
                        </div>

                        <div id="pluginss">
                        </div>

                        <div class="hide" id="timediv">
                            <div class="form-group ">
                                <label class="col-sm-3 control-label no-padding-right" for="executeDate">执行日期</label>
                                <!--X-->
                                <div class="col-sm-9">
                                    <input class="date-picker col-xs-10 col-sm-5 v_required " id="executeDate" type="text" readonly="readonly" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="executeTime">执行时间</label>
                                <!--Y-->
                                <div class="col-sm-9">
                                    <div class="bootstrap-timepicker">
                                        <input id="executeTime" type="text" class="v_required col-xs-10 col-sm-5 "/>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="addplanBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelplanBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/planUtils.js', 'js/information/plan.js']);
</script>
