<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addplanModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">计划信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                    
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="task">系统时间</label>
                            <div class="col-sm-9">
                                <input id="current" type="text" class="planitem col-xs-12 col-sm-7" readonly="readonly"/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="task" data-i18n="page.information.label.taskSelect">任务选择</label>
                            <div class="col-sm-9">
                                <input id="task" type="text" class="planitem col-xs-12 col-sm-7 v_required v_typeahead"/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="task"></label>
                            <div class="col-sm-9">
                                <div id="tasklist" class="col-xs-12 col-sm-7" style="height: 100px; overflow-y: overlay; border: 1px solid #DDD;"></div>
                            </div>
                        </div>
                        
                        <div id="pluginss"></div>

                        <div class="hide" id="timediv">
                            <div class="form-group ">
                                <label class="col-sm-3 control-label no-padding-right" for="executeDate">执行日期</label>
                                <div class="col-sm-9">
                                    <input class="planitem date-picker-date col-xs-12 col-sm-7 v_required" id="executeDate" type="text" readonly="readonly" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="executeTime">执行时间</label>
                                <div class="col-sm-9">
                                    <div class="bootstrap-timepicker">
                                        <input id="executeTime" type="text" class="planitem v_required col-xs-12 col-sm-7"/>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="addplanBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="planPopUp" class="portlet box page-content"></div>

<script type="text/javascript">
    $.loadScript(['js/utils/planUtils.js', 'js/information/plan.js']);
</script>
