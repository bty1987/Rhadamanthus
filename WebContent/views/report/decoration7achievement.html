<div id="storehousePageContent">
    <div class="row">
        <div class="col-xs-12">
            <div class="fl_search clearfix" id="condList"></div> <!-- 查询条件-->
            <div class="clearfix tab-pane active" id="resultList"></div> <!--查询结果-->
            <div class="fl-page-wrap clearfix" id="decoration7Achievement"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="updateDataModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">更新业绩</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group ">
                            <label class="col-sm-3 control-label no-padding-right" for="executeDate">年份</label>
                            <div class="col-sm-9">
                                <input id="yearDate" type="text"  class="planitem date-picker-date col-xs-12 col-sm-7 v_required"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="executeTime">月份</label>
                            <div class="col-sm-9">
                                <div class="bootstrap-timepicker">
                                    <input id="monthDate" type="text" class="planitem v_required col-xs-12 col-sm-7"/>
                                </div>
                            </div>
                        </div>


                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="updateDataBtn" class="btn btn-primary">保存</button>
                    <button type="button" data-dismiss="modal" class="btn btn-default" >取消</button>
                </div>
            </div>
        </div>
    </div>

</div>
