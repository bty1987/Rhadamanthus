<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

    <title>地图</title>
    <style type="text/css">
        html, body, #dituContent {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
        }
        .pop-up{
            box-sizing: border-box;
            border-radius: 5px;
            border:2px solid #00564E;
            padding: 8px;
            width: 256px;
            background: #fff;
        }
        .data{
            display: flex;
            color: #666;
            font-size: 14px;
            font-family: '微软雅黑';
        }
        .data strong{
            font-weight: 500;
            color: #569A4D;
        }
        .data dl{
            box-sizing: border-box;
            margin:0;
            padding: 7px 5px;
            width: 33.333%;
            text-align: center;
        }
        .data dl:nth-of-type(1){
            background: #DBF5DE;
        }
        .data dl:nth-of-type(2){
            background: #E5EFFF;
        }
        .data dl:nth-of-type(3){
            background: #FFF7E7;
        }
        .info{
            background: #FAFAFA;
            padding: 10px 8px 4px 8px;
        }

        .info h3{
            margin:0;
            font-size: 15px;
            line-height: 21px;
            color: #333;
        }
        .info h4{
            margin: 0;
            font-size: 13px;
            line-height: 20px;
            color: #999;
            font-family: '微软雅黑';
            font-weight: 500;
        }
        .back {
            position: absolute;
            bottom: 5%;
            left: 85%;
            width: 83px;
            height: 83px;
            font-size: 15px;
            font-weight: 900;
            text-align: center;
        }

        .home{
            position: absolute;
            bottom: 5%;
            left: 92%;
            width: 83px;
            height: 83px;
            font-size: 15px;
            font-weight: 900;
            text-align: center;
        }
        .logo{
            position: absolute;
            bottom: 0%;
            left:0%;
            width: 10px;
            height: 45px;
            font-size: 15px;
            font-weight: 900;
            text-align: center;
        }
        .anchorBL{
            display:none;
        }
        #dvMsgBox{display:none;position:absolute;font-size:12px;width:300px;overflow:hidden;z-index:999; border-radius:3px; font-family:微软雅黑;}
        #dvMsgBox .top{height:40px; background-color:#72D1FF;padding-left:16px; float:left; width:100%;}
        #dvMsgBox .top .right{height:100%;padding-right:6px;}
        #dvMsgBox .top .right .title{height:100%;line-height:40px;color:#fff;vertical-align:middle;font-size:14px;overflow:hidden;}
        #dvMsgBox .body{background:#fff;padding-left:10px;}
        #dvMsgBox .body .right{background:#fff;padding-right:2px;}
        #dvMsgBox .body .right .ct{  line-height:130px;
            vertical-align: middle;
            width: 100%;
            text-align: center;
            color:#2b9bc5;
            font-size: 16px;}
        #dvMsgBox .body .right .ct .pro{width:280px;border:solid 1px #6593cf;height:25px;background:#ffffff;line-height:23px;overflow:hidden;}
        #dvMsgBox .body .right .ct .pro .bg{width:0%;height:100%;background:#c9dffc;}
        #dvMsgBox .bottom{background:#fff;padding-left:6px;}
        #dvMsgBox .bottom .right{height:100%;/*background:transparent url(right-corners.png) no-repeat right bottom;*/padding-right:6px;}
        input.btn{width:65px;   border-radius: 3px; font-family:微软雅黑; cursor:pointer; color:#fff; border:none; height:35px; text-align:center;  background-color:#72D1FF;text-align:center; margin:-10px auto;}
        input.btnfocus{ background-color:#EC6D51; font-family:微软雅黑;   border-radius: 3px;width:65px;margin:-10px auto; border:none; height:35px; cursor:pointer; color:#fff;}
        #dvMsgBox .icon{width:32px;height:32px;float:left;margin-right:10px;}
        #dvMsgBox .error{background:url(icon-error.gif) no-repeat;}
        #dvMsgBox .info{background:url(icon-info.gif) no-repeat;}
        #dvMsgBox .warning{background:url(icon-warning.gif) no-repeat;}
        #dvMsgBox .clear{clear:both;}
        #dvMsgBox .height{height:10px;line-height:10px;}
        #ShowBolightBox{display:none;-moz-opacity:0.5;filter:alpha(opacity=50);opacity:0.5;background-color:#000000;z-index:100;position:absolute;left:0px;top:0px;}
        #dvMsgBtns{ text-align:center; width:100%;}
        #time{
            background-image: url('img/logo.gif');
            background-repeat: no-repeat;
            background-position: center;
            background-size:1% 1%;
            height: 100%;
            width: 100%;
            display: none;
        }
    </style>
    <script type="text/javascript" src="http://api.map.baidu.com/api?key=&v=1.1&services=true"></script>
    <script type="text/javascript" src="http://api.map.baidu.com/api?v=2.0&ak=YRZ8VtGFH30OjHaHpOXhcF3ehgGiCe1E"></script>
    <script type="text/javascript" src="http://api.map.baidu.com/library/TextIconOverlay/1.2/src/TextIconOverlay_min.js"></script>
    <script type="text/javascript" src="http://api.map.baidu.com/library/MarkerClusterer/1.2/src/MarkerClusterer_min.js"></script>
    <script type="text/javascript" src="http://api.map.baidu.com/library/AreaRestriction/1.2/src/AreaRestriction_min.js"></script>
    <script type="text/javascript" src="../../assets/altogether/js/jquery-2.0.3.min.js"></script>
    <script type="text/javascript" src="../../js/showBo.js"></script>

</head>

<body>
<!--百度地图容器-->
<div id="time"></div>
<div id="dituContent"></div>
<input type="image" src="img/home2.png" id="home" class="home" style="display: none"/>
<input type="image" src="img/back2.png" id="back" class="back" style="display: none"/>
<span class="logo"><img src="img/logo2.png"/></span>
</body>
<script type="text/javascript">

    //创建和初始化地图函数：
    function initMap() {
        createMap();//创建地图
        display();
        addMarkerCity();
        toHome();
        goBack();
        setMapEvent();//设置地图事件
    }
    //创建地图函数：
    function createMap() {
        var map = new BMap.Map("dituContent", {enableMapClick: false});//在百度地图容器中创建一个地图
        var point = new BMap.Point(123.438973, 41.811339);//定义一个中心点坐标
        map.centerAndZoom(point, 9);//设定地图的中心点和坐标并将地图显示在地图容器中
        map.setMinZoom(9);
        map.setMaxZoom(18);
        map.setMapStyle({//去掉地图内多余样式
            styleJson:[
                {
                    "featureType": "land",
                    "elementType": "all",
                    "stylers": {
                        "visibility": "on"
                    }
                },
                {
                    "featureType": "poi",
                    "elementType": "all",
                    "stylers": {
                        "visibility": "off"
                    }
                },
                {
                    "featureType": "railway",
                    "elementType": "all",
                    "stylers": {
                        "visibility": "off"
                    }
                },
                {
                    "featureType": "green",
                    "elementType": "all",
                    "stylers": {
                        "color": "red"
                    }
                },
                {
                    "featureType": "building",
                    "elementType": "all",
                    "stylers": {
                        "visibility": "off"
                    }
                },
                {
                    "featureType": "local",
                    "elementType": "all",
                    "stylers": {
                        "visibility": "off"
                    }
                },
                {
                    "featureType": "arterial",
                    "elementType": "all",
                    "stylers": {
                        "visibility": "off"
                    }
                },
                {
                    "featureType": "water",
                    "elementType": "all",
                    "stylers": {
                        "color": "#89c3eb"
                    }
                },
                {
                    "featureType": "manmade",
                    "elementType": "all",
                    "stylers": {
                        "visibility": "off"
                    }
                },
                {
                    "featureType": "highway",
                    "elementType": "labels.icon",
                    "stylers": {
                        "visibility": "on"
                    }
                },
                {
                    "featureType": "highway",
                    "elementType": "geometry.fill",
                    "stylers": {
                        "color": "#ffffff"
                    }
                }
            ]
        });
        window.map = map;//将map变量存储在全局
        map.addEventListener('dragend', function () {
            var zoom = map.getZoom();
            var center = map.getCenter();
            if(zoom==15){
                addMarkerStreet(center.lng,center.lat);
            }
        })
        map.addEventListener('moveend',function(){
            var zoom = map.getZoom();
            if(zoom==9){
                addMarkerCity();
            }
        })
    }
    //地图事件设置函数：
    function setMapEvent(){
        map.enableDragging();//启用地图拖拽事件，默认启用(可不写)
        map.disableScrollWheelZoom();//禁止地图滚轮放大缩小
        map.disableDoubleClickZoom();//禁止鼠标双击放大，默认启用(可不写)
        map.disablePinchToZoom();//禁用双指操作缩放。
        map.enableKeyboard();//启用键盘上下左右键移动地图
    }
    function addMarkerCity(){
        map.clearOverlays();
        $.ajax({
            url : "http://192.168.5.21/reportCityCountForCurrent.do",
            data: {},
            type: "post",
            dataType: "json",
            async: false, //设为false就是同步请求
            success: function(res) {
                $.each(res.cityCounts,function(i,v){
                    var point = new BMap.Point(v.city.x,v.city.y);
                    var myLabel = createMyLabel(point,v.city.cityName, v.consult);//);
                    map.addOverlay(myLabel);
                    (function(){
                        var _myLabel = myLabel;
                        _myLabel.addEventListener("click",function(e){
                        map.setZoom(13);
                        map.panTo(new BMap.Point(e.point.lng,e.point.lat),{noAnimation:true});
                        addMarkerPlot()
                        })
                    })()

                })
            },
            error : function(XMLHttpRequest, textStatus, errorThrown) {
                //这个error函数调试时非常有用，如果解析不正确，将会弹出错误框
                alert(XMLHttpRequest.responseText);
                alert(XMLHttpRequest.status);
                alert(XMLHttpRequest.readyState);
                alert(textStatus); // parser error;
            }
        });
    }
    //添加区标记
    function addMarkerPlot(){
        map.clearOverlays();
        $.ajax({
            url : "http://192.168.5.21/reportCityProperCountForCurrent.do",
            data: {},
            type: "post",
            dataType: "json",
            async: false, //设为false就是同步请求
            success: function(res) {
                $.each(res.cityProperCounts,function(i,v){
                    var point = new BMap.Point(v.cityProper.x,v.cityProper.y);
                    var myLabel = createMyLabel(point,v.cityProper.cityProperName, v.consult);//);
                        map.addOverlay(myLabel);
                        (function(){
                            var _myLabel = myLabel;
                            _myLabel.addEventListener("click",function(e){
                                map.setZoom(15);
                                map.panTo(new BMap.Point(e.point.lng,e.point.lat),{noAnimation:true});
                                var center = map.getCenter();
                                addMarkerStreet(center.lng,center.lat);
                            })
                        })()

                })
            },
            error : function(XMLHttpRequest, textStatus, errorThrown) {
                //这个error函数调试时非常有用，如果解析不正确，将会弹出错误框
                alert(XMLHttpRequest.responseText);
                alert(XMLHttpRequest.status);
                alert(XMLHttpRequest.readyState);
                alert(textStatus); // parser error;
            }
        });
    }
    //添加街道标记
    function addMarkerStreet(x,y){
        map.clearOverlays();
        var bound=map.getBounds();
        var geoc = new BMap.Geocoder();
        $.ajax({
            url : "http://192.168.5.21/reportVillageCount.do?village.x="+x+"&village.y="+y+"&range=0.03",
            data: {},
            type: "post",
            dataType: "json",
            async: false,
            success: function(res) {
                $.each(res.villageCounts,function(i,v){
                    var point = new BMap.Point(v.village.x,v.village.y);
                    var iconImg = createIcon();
                    var marker = new BMap.Marker(point,{icon:iconImg});
                    var redLabel = createRedLabel(v.village.villageName);
                    marker.setLabel(redLabel);
                    if(bound.containsPoint(point)==true){
                        map.addOverlay(marker);
                    }else{
                        map.removeOverlay(marker);
                    }
                    geoc.getLocation(point, function(rs){
                        var addComp = rs.addressComponents;
                        var address = addComp.district + addComp.street + addComp.streetNumber;
                        (function(){
                            var _marker = marker;
                            var greenLabel = createGreenLabel(v.village.villageName, v.village.count,address);
                            _marker.addEventListener("onmouseover",function(){
                                showMarker(_marker,greenLabel);
                            });
                            _marker.addEventListener("onmouseout",function(){
                                removeMarker(_marker,greenLabel)
                            })
                            redLabel.addEventListener("onmouseover",function(e){
                                showMarker(_marker,greenLabel);
                            })
                            greenLabel.addEventListener('mouseout',function(){
                                removeMarker(_marker,greenLabel)
                            })
                        })()
                    });

                })
            },
            error : function(XMLHttpRequest, textStatus, errorThrown) {
                //这个error函数调试时非常有用，如果解析不正确，将会弹出错误框
                alert(XMLHttpRequest.responseText);
                alert(XMLHttpRequest.status);
                alert(XMLHttpRequest.readyState);
                alert(textStatus); // parser error;
            }
        });
    }
    //创建一个Icon
    function createIcon(){
        var icon = new BMap.Icon("img/red.png", new BMap.Size(32,34));
        return icon;
    }

    function createMyLabel(point,title,count){
        var myLabel = new BMap.Label('<div style="color: white;margin-top: 50px;"><dl style="margin-top: 15px"><dt>'+title+'</dt><dt style="margin-top: 7px"><strong>'+count+'</strong>套</dt></dl></div>',{ offset:new BMap.Size(-60,-80), position: point});
        myLabel.setStyle({
            textShadow: "0px 0px 5px #474a4d",
            mozBorderRadius: "50px",
            webkitBorderRadius: "50px",
            borderRadius: "50px",
            fontSize: "14px",               //字号
            fontFamily: "微软雅黑",               //字号
            border: "0",                    //边
            height:"132px",                //高度
            width:"136px",                 //宽
            textAlign:"center",            //文字水平居中显示
            lineHeight:"13px",            //行高，文字垂直居中显示
            background:"url(img/redring.png)no-repeat",
            cursor: "pointer"
        });
        return myLabel;
    }
    function createRedLabel(title){
        var redLabel = new BMap.Label('&nbsp&nbsp&nbsp'+title,{"offset":new BMap.Size(15,0)});
        redLabel.setStyle({
            border:'red 2px solid',
            color:"#333",
            cursor:"pointer",
            borderRadius:"5px",
            fontSize: '15px',
            fontFamily : "微软雅黑",
            fontWeight:900,
            zIndex: -10
        });
        return redLabel;
    }
    function createGreenLabel(title,count,address){
        var greenLabel = new BMap.Label("<div class='pop-up'><div class='info'><h3>"+title+"</h3><h4>"+address+"</h4></div><div class='data'><dl><dt>二手房</dt><dt><strong>"+count+"</strong>套</dt></dl><dl><dt>租房</dt><dt><strong>33</strong>套</dt></dl><dl><dt>小区详情</dt><dt></dt></dl></div></div>",{"offset":new BMap.Size(15,0)})
        greenLabel.setStyle({
            zIndex:-1,
            borderRadius: '5px',
            border:''
        })
        return greenLabel;
    }
    function display(){
        map.enableScrollWheelZoom();
        var b = new BMap.Bounds(new BMap.Point(116.405169,36.841008),new BMap.Point(131.638131,47.489826));
        try{
            BMapLib.AreaRestriction.setBounds(map,b);
        }catch (e){
            alert(e)
        }
    }
    function toHome(){
        var homeBtn = $('#home')
        var backBtn = $('#back')
        homeBtn.css('display','block');
        homeBtn.click(function(){
            if(map.getZoom()==9){
                Showbo.Msg.alert('已经在首页啦!')
            }else{
                map.setZoom(9);
                addMarkerCity();
            }
        })
    }
    function goBack(){
        var backBtn = $('#back')
        backBtn.css('display','block');
        backBtn.click(function(){
            if(map.getZoom()==15){
                map.setZoom(13);
                addMarkerPlot();
                //backBtn.css('display','none');
            }
            else if(map.getZoom()==13){
                map.setZoom(9);
                addMarkerCity();
            }else{
                Showbo.Msg.alert('已经在首页啦!');
            }
        })
    }
    function showMarker(_marker,label){
        _marker.setIcon(new BMap.Icon("img/green.png", new BMap.Size(32,34)));
        _marker.setLabel(label);
        _marker.setTop(true)
    }
    function removeMarker(_marker,label){
        _marker.setIcon(new BMap.Icon("img/red.png", new BMap.Size(32,34)));
        map.removeOverlay(label);
        _marker.setTop(false);
    }

    var timer;
    var wall = {
        w: document.getElementById('time'),
        show: function(){
            this.w.style.display = "block";
            $('#dituContent').css('display','none')
            $('#time').animate({
                backgroundSize:"70%",
            },1000)
            $('#home').css('display','none');
            $('#back').css('display','none');
        },
        hide: function(){
            this.w.style.display = "none";
            this.w.style.backgroundSize = "1% 1%";
            $('#dituContent').css('display','block')
            $('#home').css('display','block');
            $('#back').css('display','block');
        }
    };

    $('#dituContent').mousemove(function(){
        if ($(this).data("x") === event.pageX && $(this).data("y") === event.pageY) {
            return false;
        }
        $(this).data({"x":event.pageX, "y":event.pageY});
        clearTimeout(timer);
        wall.hide();
        timer = setTimeout(function () {
            wall.show();
        }, 5000);
    })
    document.onclick=function() {
         clearTimeout(timer);
         wall.hide();
         timer = setTimeout(function () {
         wall.show();
         }, 5000);
    }
    //5秒不动鼠标后，进入屏保模式
    window.onload=function(){
        clearTimeout(timer);
        wall.hide();
        timer = setTimeout(function(){
            wall.show();
        },5000);
        //5秒不动鼠标后，进入屏保模式
    }

    initMap();//创建和初始化地图
</script>
</html>
