<div class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="morderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" >订单</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group" id="ndeptId">
                            <label class="col-sm-3 control-label no-padding-right" for="no">装修单号</label>
                            <div class="col-sm-9">
                                <input type="text" maxlength="10" id="no" class="col-xs-10 col-sm-6 " readonly="readonly"/>
                                <span class='star'></span>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="user">用户</label>
                            <div class="col-sm-9">
                                <input type="text" maxlength="64" id="user" class="col-xs-10 col-sm-6 v_name v_required" data-toggle="popover" data-trigger='manual' readonly="readonly"/>
                                <span class='star'></span>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="address">地址</label>
                            <div class="col-sm-9">
                                <input type="text" maxlength="64" id="address" readonly="readonly" class="col-xs-10 col-sm-6 v_name v_required" data-toggle="popover" data-trigger='manual'/>
                                <span class='star'></span>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="total">总价</label>
                            <div class="col-sm-9">
                                <input type="text" maxlength="64" id="total"  readonly="readonly" class="col-xs-10 col-sm-6 v_name v_required" data-toggle="popover" data-trigger='manual'/>
                                <span class='star'></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="status">状态</label>
                            <div class="col-sm-9">
                                <select id="status" name="status" maxlength="256" class="col-xs-10 col-sm-6 v_required"></select>
                                <span class='star'></span>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/store/morder.js']);
</script>
