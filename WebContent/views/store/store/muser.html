<div id="layerAdd" style="padding: 40px 0;display: none;">
    <div class="row-fluid">

        <form class="form-horizontal" novalidate="novalidate" id="form1">
            <div class="widget-main">
                <div class="row" style="margin-right: 0px">
                    <div class="col-xs-12">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right ">姓名</label>
                            <div class="col-sm-8">
                                <input type="text" class=" m-wrap col-xs-8 v_required"  maxlength="16" id="name">
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>
                        </div>
                        <div class="space5"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">电话</label>

                                <input type="text" class="m-wrap col-xs-8 v_phone v_required"  maxlength="11" id="phone">
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">生日</label>
                            <div class="col-sm-8">
                                <input type="text" class="date-picker m-wrap col-xs-8 v_date v_required" data-date-format="yyyy-mm-dd" maxlength="11" id="birthday">
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>
                        </div>


                        <div class="form-group col-sm-5"  style=" clear: inherit">
                            <label class="col-sm-3 control-label no-padding-right" for="gender"style="margin-left: 85px ">性别</label>
                            <div style="margin-top:-50px">
                                <select id="gender" style="margin-left: 150px ; width: 258px ; margin-top: 50px ">
                                    <option value ="0">男</option>
                                    <option value ="1">女</option>
                                </select>
              
                            </div>
                        </div >
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
