<div class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <div id="resultList" class="clearfix tab-pane active"></div>
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
        </div>
    </div>
</div>

<div id="layerAdd" class="page-content" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form1">

            <div class="form-group">
                <label class="col-md-4 control-label no-padding-right orange" data-i18n="page.store.label.goodsBrand">商品品牌</label>
                <div class="col-md-8">
                    <input type="text" class="col-xs-10 col-sm-5 v_required" id="mbrand" name="mbrand" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">
                </div>
            </div>

            <div class="form-group">
                <label class="col-md-4 control-label no-padding-right orange">商品编号</label>
                <div class="col-md-8">
                    <input type="text" class="col-xs-10 col-sm-5 v_required" id="no" name="no" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">
                </div>
            </div>

            <div class="form-group">
                <label class="col-md-4 control-label no-padding-right orange" data-i18n="page.store.label.goodsBarcode">商品条形码</label>
                <div class="col-md-8">
                    <input type="text" class="col-xs-10 col-sm-5 v_required" id="barcode" name="barcode" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">
                </div>
            </div>

            <div class="form-group">
                <label class="col-md-4 control-label no-padding-right orange">商品名称</label>
                <div class="col-md-8">
                    <input type="text" class="col-xs-10 col-sm-5 v_required" id="name" name="name" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">
                </div>
            </div>

            <div class="form-group">
                <label class="col-md-4 control-label no-padding-right orange" data-i18n="page.store.label.goodsTitle">商品标题</label>
                <div class="col-md-8">
                    <input type="text" class="col-xs-10 col-sm-5 v_required" id="title" name="title" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}" maxlength="64">
                </div>
            </div>

            <div class="form-group">
                <label class="col-md-4 control-label no-padding-right orange">价格</label>
                <div class="col-md-8">
                    <input type="text" class="col-xs-10 col-sm-5 v_required v_price" id="price" name="price" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">
                </div>
            </div>
            
            <div class="form-group col-xs-12">
			    <button type="button" id="saveBtn" class="btn btn-primary pull-right" data-i18n="msg.ok">确定</button>
			</div>
        </form>
    </div>
</div>

<div id="goodsColorPopUp" class="portlet box"></div>
<div id="goodsFormatPopUp" class="portlet box"></div>
<div id="goodsPicturePopUp" class="portlet box"></div>
<div id="goodsPricePopUp" class="portlet box"></div>

<script type="text/javascript">
    $.loadScript(['js/store/mgoods.js']);
</script>
