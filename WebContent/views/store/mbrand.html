<div id="storehousePageContent" class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div class="clearfix tab-pane active" id="resultList"></div> <!--查询结果-->
            <div class="fl-page-wrap clearfix" id="pagenation"></div> <!--分页-->
        </div>
    </div>
</div>

<div id="layerAdd" style="padding: 40px 0;display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form1">
            <div class="widget-main">
                <div class="row" style="margin-right: 0px">
                    <div class="col-xs-12">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="categoryId">品类</label>
                            <div class="col-sm-8">
                                <select type="text" class="col-xs-8 m-wrap" id="categoryId"
                                        rules="{required:true}">
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="name" class="col-sm-3 control-label no-padding-right">品牌</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" maxlength="11" id="name">
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>
                        </div>

                        <div class="form-group" style="display: none">
                            <label class="col-sm-3 control-label no-padding-right" for="path">图片路径</label>
                            <div class="col-sm-9">
                                <input type="text" id="path" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' readonly/>
                                <span class='star'></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right"></label>
                            <div class="col-sm-8" id="brandImg">

                            </div>
                        </div>
                        <div class="col-md-12" id="upload" style="padding-left: 160px">
                            <div id="pictureUpload" style="width: 120px ; height: 20px  ; margin-left: -10px"></div>
                            <input type="text" class="hidden" id="picture"/>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/store/mbrand.js']);
</script>
