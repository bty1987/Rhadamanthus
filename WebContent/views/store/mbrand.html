<div id="storehousePageContent" class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div class="clearfix tab-pane active" id="resultList"></div> <!--查询结果-->
            <div class="fl-page-wrap clearfix" id="pagenation"></div> <!--分页-->
        </div>
    </div>
</div>

<div id="layerAdd" class="page-content"  style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form1">
            <div class="form-group">
                 <label class="col-sm-3 control-label no-padding-right orange" for="categoryId">品类</label>
                 <div class="col-sm-8">
                     <select type="text" class="col-xs-8 m-wrap" id="categoryId"></select>
                 </div>
           </div>
            <div class="form-group">
                 <label for="name" class="col-sm-3 control-label no-padding-right orange">品牌</label>
                 <div class="col-sm-8">
                     <input type="text" class="col-xs-8 m-wrap v_required" maxlength="11" id="name">
                 </div>
            </div>

			<div class="form-group">
			    <label class="col-sm-3 control-label no-padding-right orange" for="path">图片路径</label>
			    <div class="col-sm-9">
			        <input type="text" id="path" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' readonly/>
			    </div>
			</div>

            <div class="form-group">
                 <label class="col-sm-3 control-label no-padding-right"></label>
                 <div class="col-sm-5">
                     <div style="height: 150px;">
                           <img id="brandImg"/>
                       </div>
                 </div>
               
				<div class="col-sm-4" id="upload">
				    <div id="pictureUpload"></div>
				    <input type="text" class="hidden" id="picture"/>
				</div>
            </div>
               
            <div class="form-group col-xs-12">
                <button type="button" id="saveBtn" class="btn btn-primary pull-right" data-i18n="msg.ok">确定</button>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/store/mbrand.js']);
</script>
