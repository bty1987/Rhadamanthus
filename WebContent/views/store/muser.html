<div id="storehousePageContent" class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div class="clearfix tab-pane active" id="resultList"></div> <!--查询结果-->
            <div class="fl-page-wrap clearfix" id="pagenation"></div> <!--分页-->
        </div>
    </div>
</div>

<div id="layerAdd" class="page-content" style="display: none;">
    <div class="row-fluid">

        <form class="form-horizontal" novalidate="novalidate" id="form1">
             <div class="form-group">
                 <label class="col-sm-3 control-label no-padding-right orange">姓名</label>
                 <div class="col-sm-8">
                     <input type="text" class=" m-wrap col-xs-8 v_required"  maxlength="16" id="name">
                 </div>
             </div>
             <div class="space5"></div>

             <div class="form-group">
                 <label class="col-sm-3 control-label no-padding-right orange">电话</label>
                 <div class="col-sm-8">
                     <input type="text" class="m-wrap col-xs-8 v_phone v_required"  maxlength="11" id="phone">
                 </div>
             </div>

             <div class="form-group">
                 <label class="col-sm-3 control-label no-padding-right orange" data-i18n="page.store.label.birthday">生日</label>
                 <div class="col-sm-8">
                     <input type="text" class="date-picker m-wrap col-xs-8 v_date v_required" data-date-format="yyyy-mm-dd" maxlength="11" id="birthday">
                 </div>
             </div>


             <div class="form-group">
                 <label class="col-sm-3 control-label no-padding-right" for="gender" >性别</label>
                 <div class="col-sm-8">
                     <select id="gender" class="v_required">
                         <option value ="0" data-i18n="page.store.label.male">男</option>
                         <option value ="1" data-i18n="page.store.label.female">女</option>
                     </select>
                 </div>
             </div >
             
             <div class="form-group col-xs-12">
                <button type="button" id="saveBtn" class="btn btn-primary pull-right" data-i18n="msg.ok">确定</button>
            </div>
        </form>
    </div>
</div>

<div id="layerAdd2" class="page-content" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form2">
            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right orange">姓名</label>
                <div class="col-sm-8">
                    <input type="text" class=" m-wrap col-xs-8 v_required" maxlength="16" id="name1">
                </div>
            </div>

            <div class="space5"></div>
            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right">省份</label>
                <div class="col-sm-8">
                    <input type="text" class=" m-wrap col-xs-8" maxlength="32" id="province">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right">城市</label>
                <div class="col-sm-8">
                    <input type="text" class=" m-wrap col-xs-8" maxlength="64" id="city">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right">地区</label>
                <div class="col-sm-8">
                    <input type="text" class=" m-wrap col-xs-8" maxlength="64" id="proper">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right orange">地址</label>
                <div class="col-sm-8">
                    <input type="text" class=" m-wrap col-xs-8 v_required" maxlength="256" id="address">
                </div>
            </div>
            
            <div class="form-group col-xs-12">
                <button type="button" id="updateAddressBtn" class="btn btn-primary pull-right" data-i18n="msg.ok">确定</button>
            </div>
        </form>
    </div>
</div>

<div id="userAddressPopUp" class="portlet box"></div>

<script type="text/javascript">
    $.loadScript(['js/store/muser.js']);
</script>
