<div id="building">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div>
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="buildingModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel" data-i18n="page.building.label.estateOrder">房产单</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="row">
							<div class="col-md-12">
								<div class="col-md-6">
									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right orange" for="hsNo" data-i18n="page.building.label.houseSourceNo">房源编号</label>
										<div class="col-sm-8">
											<input type="text" id="hsNo" maxlength="15" class="v_required" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right orange" for="csNo" data-i18n="page.building.label.customerSourceNo">客源编号</label>
										<div class="col-sm-8">
											<input type="text" id="csNo" maxlength="15" class="v_required" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label for="hsAUser" class="col-sm-4 control-label no-padding-right" data-i18n="page.building.label.houseAgent">房源代理人</label>
										<div class="col-md-8">
											<input type="text" class="" id="hsAUser" data-placeholder="房源代理人" data-toggle="popover" />
										</div>
									</div>

									<div class="form-group">
										<label for="csAUser" class="col-sm-4 control-label no-padding-right" data-i18n="page.building.label.customerAgent">客源代理人</label>
										<div class="col-md-8">
											<input type="text" class="" id="csAUser" data-placeholder="客源代理人" data-toggle="popover" />
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right" for="signingTime" data-i18n="page.building.label.signTime">签约时间</label>
										<div class="col-sm-8">
											<div class="input-group no-padding">
												<input class="form-control date-picker-date v_required" id="signingTime" type="text" data-date-format="yyyy-mm-dd">
											</div>
										</div>
									</div>
								</div>

								<div class="col-md-6">
									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right" for="tradePrice" data-i18n="page.building.label.dealPrice">成交价格</label>
										<div class="col-sm-8">
											<input type="text" id="tradePrice" maxlength="18" class="v_required v_float_3" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right" for="downpayment" data-i18n="page.building.label.firstPay">首付款</label>
										<div class="col-sm-8">
											<input type="text" id="downpayment" maxlength="18" class="v_float_3" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right" for="loanPrice" data-i18n="page.building.label.loanAmount">贷款金额</label>
										<div class="col-sm-8">
											<input type="text" id="loanPrice" maxlength="18" class="v_float_3" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label for="payType" class="col-sm-4 control-label no-padding-right" data-i18n="page.building.label.payMethod">支付方式</label>
										<div class="col-sm-8">
											<select class='col-xs-12' id='payType' data-toggle="popover"></select>
										</div>
									</div>

									<div class="form-group">
										<label for="balanceStatus" class="col-sm-4 control-label no-padding-right" data-i18n="page.building.label.balanceStatus">结算状态</label>
										<div class="col-sm-8">
											<select class='col-xs-12' id='balanceStatus' data-toggle="popover"></select>
										</div>
									</div>

								</div>
							</div>
						</div>
					</form>
				</div>
				<div class="modal-footer" style="text-align: center">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default"  data-i18n="msg.reset">重置</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="buildingPayTypeModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="buildingPayTypeDialog">更改款项支付方式</h4>
				</div>

				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label for="payTypes" class="col-sm-3 control-label no-padding-right" data-i18n="page.building.label.payMethod">支付方式</label>
							<div class="col-sm-9">
								<select class='col-xs-10 col-sm-6' id='payTypes' data-toggle="popover" ></select>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>

				<div class="modal-footer">
					<button type="button" id="deployedBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="paymentCancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="customerModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="customerDialog">客户</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="customerName">姓名</label>
							<div class="col-sm-9">
								<input type="text" id="customerName" maxlength="32" class="col-xs-10 col-sm-6 v_required v_name" data-toggle="popover" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="gender">性别</label>
							<div class="col-sm-9">
								<input type="checkbox" id="gender" class="ace ace-switch ace-switch-5"/>
								<span class="lbl gender"></span>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="phone">联系方式</label>
							<div class="col-sm-9">
								<input type="text" id="phone" maxlength="64" class="col-xs-10 col-sm-6 v_required v_phones2" data-toggle="popover" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="cardType" data-i18n="page.building.label.credentialType">证件类型</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-6 v_required" id="cardType"></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="cardNum" data-i18n="page.building.label.credentialNo">证件号</label>
							<div class="col-sm-9">
								<input type="text" id="cardNum" maxlength="18" class="col-xs-10 col-sm-6 v_card" data-toggle="popover" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="qq">QQ</label>
							<div class="col-sm-9">
								<input type="text" id="qq" maxlength="15" class="col-xs-10 col-sm-6 v_number" data-toggle="popover" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="wechat">微信</label>
							<div class="col-sm-9">
								<input type="text" id="wechat" maxlength="15" class="col-xs-10 col-sm-6 v_name_en" data-toggle="popover" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="email">邮箱</label>
							<div class="col-sm-9">
								<input type="text" id="email" maxlength="32" class="col-xs-10 col-sm-6 v_email" data-toggle="popover" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="relationshipType">客户类型</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-6 v_required" id="relationshipType"></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="address">通讯地址</label>
							<div class="col-sm-9">
								<textarea id="address" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="createCustomerSaveBtn" class="btn btn-primary" data-loading-text="提交中..." data-i18n="msg.save">保存</button>
					<button type="button" id="createCustomerCancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
<div id="stockRecordPopUp" style="z-index:9002" class="portlet box page-content"></div>
<script type="text/javascript">
	$.loadScript(['js/building/building.js']);
</script>
