<div id="buildingRecordPageContent">
	<div id="fl-statement">
		<div class="page-header"></div>
	</div>

	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div>
			<div id="resultList" class="clearfix tab-pane active"></div>
			<div id="pagenation" class="fl-page-wrap clearfix">
				<a class="btn btn-minier btn-primary pull-left" id="addBuildingRecord" style="margin: 0px 3px;">
					<i class="icon-plus bigger-110"></i>
					<span>添加</span>
				</a>
			</div>
		</div>
	</div>

	<div class="modal fade" id="buildingRecordModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content" style="width:900px;margin-left:-30%">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel">跟进记录</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<div class="col-xs-12">
							<form class="form-horizontal">
								<div class="row">
									<div class="col-md-12">
										<div class="form-group">
											<label for="hsNo" class="col-sm-3 control-label no-padding-right" data-i18n="page.building.label.houseSourceNo">房源编号</label>
											<div class="col-md-9">
												<input type="text" id="hsNo" maxlength="15" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group">
											<label for="csNo" class="col-sm-3 control-label no-padding-right" data-i18n="page.building.label.customerSourceNo">客源编号</label>
											<div class="col-md-9">
												<input type="text" id="csNo" maxlength="15" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group">
											<label for="brType" class="col-sm-3 control-label no-padding-right">记录类型</label>
											<div class="col-sm-9">
												<select class='col-xs-10 col-sm-6' id='brType' data-toggle="popover" data-trigger='manual' ></select>
											</div>
										</div>

										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="pattern">沟通方式</label>
											<div class="col-sm-9">
												<select class='col-xs-10 col-sm-6' id='pattern' data-toggle="popover" data-trigger='manual' ></select>
											</div>
										</div>

										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="comment">记录信息</label>
											<div class="col-sm-9">
												<textarea id="comment" maxlength="256" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'></textarea>
											</div>
										</div>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
				<div class="modal-footer" style="text-align: center">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
				</div>
			</div>
		</div>
	</div>
</div>
<script type="text/javascript">
	$.loadScript(['js/building/buildingRecord.js']);
</script>
