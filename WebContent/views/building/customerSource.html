<div id="customerSource">
	<div class="row">
		<div class="col-xs-12">
			<div id="CondList" class="fl_search clearfix"></div>
			<div id="ResultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="Pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="customerSourceModal" tabindex="-1">
		<div class="modal-dialog" style="width:60%">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel">客源</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="row" style="padding-top:10px">
							<div class="col-md-12">
								<div class="col-md-6">
									<div class="form-group">
										<label for="csType" class="col-sm-3 control-label no-padding-right">客源类型</label>
										<div class="col-sm-9">
											<select class='col-xs-10 col-sm-6' id='csType' data-toggle="popover" data-trigger='manual'></select>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right orange" for="customerName">客户姓名</label>
										<div class="col-sm-9">
											<input type="text" id="customerName" maxlength="32" class="col-xs-10 col-sm-6 v_required v_name" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="gender">性别</label>
										<div class="col-sm-9">
											<input type="checkbox" class="ace ace-switch ace-switch-5" id="gender"/>
											<span class="lbl gender"></span>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right orange" for="phone">联系方式</label>
										<div class="col-sm-9">
											<input type="text" id="phone" maxlength="64" class="col-xs-10 col-sm-6 v_required v_phones2" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="cardType">证件类型</label>
										<div class="col-sm-9">
											<select class="col-xs-10 col-sm-6 v_required" id="cardType"></select>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="cardNum">证件号</label>
										<div class="col-sm-9">
											<input type="text" id="cardNum" maxlength="18" class="col-xs-10 col-sm-6 v_card" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="qq">QQ</label>
										<div class="col-sm-9">
											<input type="text" id="qq" maxlength="15" class="col-xs-10 col-sm-6 v_number" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="wechat">微信</label>
										<div class="col-sm-9">
											<input type="text" id="wechat" maxlength="15" class="col-xs-10 col-sm-6 v_name_en" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="email">邮箱</label>
										<div class="col-sm-9">
											<input type="text" id="email" maxlength="32" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="address">通讯地址</label>
										<div class="col-sm-9">
											<textarea id="address" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
										</div>
									</div>
								</div>

								<div class="col-sm-6">
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="relationshipType">客户类型</label>
										<div class="col-sm-9">
											<select class="col-xs-10 col-sm-6 v_required" id="relationshipType"></select>
										</div>
									</div>

									<div class="form-group">
										<label for="purpose" class="col-sm-3 control-label no-padding-right">目的</label>
										<div class="col-sm-9">
											<input type="text" class="col-xs-10 col-sm-6 v_name" data-toggle="popover" data-trigger='manual' maxlength="256" id="purpose">
										</div>
									</div>

									<div class="form-group">
										<label for="intention" class="col-sm-3 control-label no-padding-right">意向</label>
										<div class="col-sm-9">
											<input type="text" class="col-xs-10 col-sm-6 v_name" data-toggle="popover" data-trigger='manual' maxlength="256" id="intention">
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right ">需求价格</label>
										<div class="col-sm-9">
											<input type="text" class="v_required v_float" style="width:60px" data-toggle="popover" data-trigger='manual' id="priceLow" />
											<span> - </span>
											<input type="text" class="v_required v_float" style="width:60px" data-toggle="popover" data-trigger='manual' id="priceHigh" />
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right ">需求面积</label>
										<div class="col-sm-9">
											<input type="text" class="v_required v_float" style="width:60px" data-toggle="popover" data-trigger='manual' id="areaLow" />
											<span> - </span>
											<input type="text" class="v_required v_float" style="width:60px" data-toggle="popover" data-trigger='manual' id="areaHigh" />
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right ">需求户型</label>
										<div class="col-sm-9">
											<input type="text"class="v_required v_float" style="width:60px"  data-toggle="popover" data-trigger='manual' id="familyType" />  室
										</div>
									</div>

									<div class="form-group">
										<label for="orientation" class="col-sm-3 control-label no-padding-right">朝向</label>
										<div class="col-sm-9">
											<select class='col-xs-10 col-sm-6' id='orientation' data-toggle="popover" data-trigger='manual' ></select>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="conditions">意向备注</label>
										<div class="col-sm-9">
											<input type="text" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' maxlength="256" id="conditions" placeholder="如:三楼,不把山" />
										</div>
									</div>

									<div class="form-group">
										<label for="grade" class="col-sm-3 control-label no-padding-right">客户等级</label>
										<div class="col-sm-9">
											<select class='col-xs-10 col-sm-6' id='grade' data-toggle="popover" data-trigger='manual' ></select>
										</div>
									</div>

									<div class="form-group">
										<label for="comment" class="col-sm-3 control-label no-padding-right">备注</label>
										<div class="col-sm-9">
											<textarea class="col-xs-10 col-sm-6 v_name" rows="3" data-toggle="popover" data-trigger='manual' maxlength="50" id="comment"></textarea>
										</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
				<div class="modal-footer" style="text-align: center">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" >重置</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="buildingModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabelTwo">房产单</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="row">
							<div class="col-md-12">
								<div class="col-md-6">
									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right orange" for="hsNo">房源编号</label>
										<div class="col-sm-8">
											<input type="text" id="hsNo" maxlength="15" class="v_required" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right orange" for="csNo">客源编号</label>
										<div class="col-sm-8">
											<input type="text" id="csNo" maxlength="15" class="v_required" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label for="hsAUser" class="col-sm-4 control-label no-padding-right">房源代理人</label>
										<div class="col-md-8">
											<input type="text" class="" id="hsAUser" data-placeholder="房源代理人" data-toggle="popover" />
										</div>
									</div>

									<div class="form-group">
										<label for="csAUser" class="col-sm-4 control-label no-padding-right">客源代理人</label>
										<div class="col-md-8">
											<input type="text" class="" id="csAUser" data-placeholder="客源代理人" data-toggle="popover" />
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right" for="signingTime">签约时间</label>
										<div class="col-sm-8">
											<div class="input-group no-padding">
												<input class="form-control date-picker-date v_required" id="signingTime" type="text" data-date-format="yyyy-mm-dd">
											</div>
										</div>
									</div>
								</div>

								<div class="col-md-6">
									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right" for="tradePrice">成交价格</label>
										<div class="col-sm-8">
											<input type="text" id="tradePrice" maxlength="18" class="v_required v_float_3" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right" for="downpayment">首付款</label>
										<div class="col-sm-8">
											<input type="text" id="downpayment" maxlength="18" class="v_float_3" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-4 control-label no-padding-right" for="loanPrice">贷款金额</label>
										<div class="col-sm-8">
											<input type="text" id="loanPrice" maxlength="18" class="v_float_3" data-toggle="popover" data-trigger='manual'/>
										</div>
									</div>


									<div class="form-group">
										<label for="payType" class="col-sm-4 control-label no-padding-right">支付方式</label>
										<div class="col-sm-8">
											<select class='' id='payType' data-toggle="popover"></select>
										</div>
									</div>

									<div class="form-group">
										<label for="balanceStatus" class="col-sm-4 control-label no-padding-right">结算状态</label>
										<div class="col-sm-8">
											<select class='' id='balanceStatus' data-toggle="popover"></select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
				<div class="modal-footer" style="text-align: center">
					<button type="button" id="bsaveBtn" class="btn btn-primary">保存</button>
				</div>
			</div>
		</div>
	</div>
</div>
<div id="stockRecordPopUp" style="z-index:9002" class="portlet box page-content"></div>
<script type="text/javascript">
	$.loadScript(['js/building/customerSource.js']);
</script>
