
<div>
    <div id="condList" class="fl_search clearfix"></div>
    <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
    <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
</div>

<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myModalLabel">口碑</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="row">
                        <div class="col-md-12">

                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="title">名称</label>
                                <div class="col-sm-8">
                                    <input type="text" id="title" class="v_required" data-toggle="popover"/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="type" class="col-sm-4 control-label no-padding-right orange">类型</label>
                                <div class="col-sm-8">
                                    <select class="" id="type"  data-toggle="popover" data-toggle="popover">
                                        <option value="0">朋友圈</option>
                                        <option value="1">锦旗</option>
                                        <option value="2">其他</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="content">说明</label>
                                <div class="col-sm-8">
                                    <textarea rows="5" id="content" data-toggle="popover"></textarea>
                                </div>
                            </div>

                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="text-align: center">
                <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="epicturePage"  tabindex="-1">
    <div class="modal-dialog" style="width: 50%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" data-i18n="page.market.label.imgInfo">图片信息</h4>
            </div>
            <div class="modal-body">
                <div class="row" style="padding-top: 10px;">
                    <div class="col-xs-12">
                        <div class="row-fluid">
                            <ul class="ace-thumbnails" id="epicture">

                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer" style="text-align: center">
                <a class="form-group" id = "epictureUpload"></a>
            </div>
        </div>
    </div>
</div>
