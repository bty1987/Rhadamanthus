<div>
    <div id="condList" class="fl_search clearfix"></div>
    <div id="resultList" class="clearfix tab-pane active"></div>
    <div id="pagenation" class="fl-page-wrap clearfix"></div>
</div>

<div class="modal fade" id="marketChannelModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="width:900px;margin-left:-30%">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title">营销渠道</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="name">渠道名称</label>
                                    <div class="col-sm-9">
                                        <input type="text" id="name" class="col-xs-10 col-sm-6 v_required" maxlength="64" data-rel="popover"/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="type">渠道类型</label>
                                    <div class="col-sm-9">
                                        <select id="type" class="col-xs-10 col-sm-6 v_required" data-rel="popover">
                                            <option value="0">未知</option>
                                            <option value="1">搜索</option>
                                            <option value="2">社媒</option>
                                            <option value="3">信息流</option>
                                            <option value="4">线下</option>
                                            <option value="5">合作</option>
                                            <option value="6">转介绍</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="platform">平台</label>
                                    <div class="col-sm-9">
                                        <input type="text" id="platform" class="col-xs-10 col-sm-6" maxlength="64" data-rel="popover"/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="ownerId">负责人ID</label>
                                    <div class="col-sm-9">
                                        <input type="text" id="ownerId" class="col-xs-10 col-sm-6 v_number" maxlength="11" data-rel="popover"/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label no-padding-right orange" for="comment">备注</label>
                                    <div class="col-sm-9">
                                        <textarea rows="4" id="comment" class="col-xs-10 col-sm-6" maxlength="255" data-rel="popover"></textarea>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="text-align: center">
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/market/marketChannel.js']);
</script>
