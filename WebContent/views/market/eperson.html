<div>
    <div id="condList" class="fl_search clearfix"></div>
    <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
    <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
</div>

<div class="modal fade" id="epersonModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myModalLabel">人员</h4>
            </div>
            <div class="modal-body">
                 <form class="form-horizontal">
                     <div class="row">
                         <div class="col-md-12">
                             <div class="form-group">
                                 <label for="city" class="col-sm-4 control-label no-padding-right orange">城市</label>
                                 <div class="col-sm-8">
                                     <input type="text" class="v_required" id="city" data-placeholder="城市" data-toggle="popover">
                                 </div>
                             </div>

                             <div class="form-group">
                                 <label class="col-sm-4 control-label no-padding-right orange" for="name">姓名</label>
                                 <div class="col-sm-8">
                                     <input type="text" id="name" class="v_required"  data-rel="popover"/>
                                 </div>
                             </div>

                             <div class="form-group">
                                 <label class="col-sm-4 control-label no-padding-right orange" for="phone">电话</label>
                                 <div class="col-sm-8">
                                     <input type="text" id="phone" maxlength="11" class="v_phone v_required"  data-rel="popover"/>
                                 </div>
                             </div>

                             <div class="form-group">
                                 <label class="col-sm-4 control-label no-padding-right orange" for="experience">经验</label>
                                 <div class="col-sm-8">
                                     <input type="text" id="experience" maxlength="2" class="v_required v_number"  data-rel="popover"/>
                                 </div>
                             </div>

                             <div class="form-group">
                                 <label for="type" class="col-sm-4 control-label no-padding-right orange">职位</label>
                                 <div class="col-sm-8">
                                     <select class="col-sm-10" id="type"  data-toggle="popover">
                                         <option value="0">设计师</option>
                                         <option value="1">监理</option>
                                     </select>
                                 </div>
                             </div>

                             <div class="form-group">
                                 <label class="col-sm-4 control-label no-padding-right orange" for="info">简介</label>
                                 <div class="col-sm-8">
                                     <textarea rows="6" id="info" class="v_required" data-toggle="popover"></textarea>
                                 </div>
                             </div>

                             <div class="form-group" style="display: none">
                                 <label class="col-sm-4 control-label no-padding-right" for="path">图片路径</label>
                                 <div class="col-sm-8">
                                     <input type="text" id="path" class="v_required" data-toggle="popover"/>
                                 </div>
                             </div>

                             <div class="form-group">
                                 <label class="col-sm-4 control-label no-padding-right orange" for="imgUrl"></label>
                                 <div class="col-sm-8">
                                     <div id="imgUrl" class="col-xs-10 col-sm-6" data-toggle="popover">

                                     </div>
                                 </div>
                             </div>

                             <div class="col-sm-12">
                                 <label class="col-sm-4"></label>
                                 <div class="col-sm-8">
                                     <a class="form-group" id = "epersonUpload"></a>
                                 </div>
                             </div>
                         </div>
                     </div>
                 </form>
            </div>
            <div class="modal-footer" style="text-align: center">
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/market/eperson.js']);
</script>
