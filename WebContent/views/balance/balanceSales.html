<div id="balanceSales">
    <div class="row">
        <div class="col-xs-12">
            <div id="bscondList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="bsresultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="bspagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="createBalanceSalesModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addItemDialog" data-i18n="page.balance.label.balanceSales">结算销售</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="BalanceSalesName" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">品牌</label>
                            <div class="col-sm-9">
                                <input type="text" id="brand" class="col-xs-10 col-sm-5 v_required v_typeahead" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <div>
                                <label for="supplier" class="col-sm-3 control-label no-padding-right orange">厂商</label>
                                <div class="col-xs-12 col-sm-9">
                                    <select class="col-xs-10 col-sm-5 v_required" id="supplier"></select>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="no" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.balance.label.level">等级</label>
                            <div class="col-md-9">

                                <label class="inline">
                                    <input type="radio" class="ace" value="A" name="grade" checked>
                                    <span class="lbl">A</span>&nbsp;
                                </label>

                                <label class="inline">
                                    <input type="radio" class="ace" value="B" name="grade">
                                    <span class="lbl">B</span>&nbsp;
                                </label>

                                <label class="inline">
                                    <input type="radio" class="ace" value="C" name="grade">
                                    <span class="lbl">C</span>
                                </label>

                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="createBalanceSalesBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelcreateBalanceSalesBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="renewal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="myModalLabe2">更新</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="updata" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="withdrawBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="drawingModal" tabindex="-1">
        <div class="modal-dialog" style="width:60%">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" data-i18n="page.balance.label.balanceImg">结算图片</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="row-fluid">
                                <ul class="ace-thumbnails" id="balanceDrawing"></ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class=" col-sm-1" style="padding-top:2px;float: right; padding-right: 100px">
                        <a class="form-group" id="balanceUpload"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<div id="stockRecordPopUp" class="portlet box page-content"></div>

<script type="text/javascript">
    $.loadScript(['js/balance/balanceSales.js', 'js/utils/kingdeeUtils.js']);
</script>
