<div>
    <div id="fl-statement"><div class="page-header"><h1>生产单<small><i class="icon-double-angle-right"></i>五金单</small></h1></div></div>
    <div class="row">
        <div class="col-xs-12">
            <div>
                <div id="condList" class="fl_search clearfix"></div>
                <div class="clearfix" id="resultList"></div>
                <div class="fl-page-wrap clearfix pagination" id="pagenation" style="display: block;"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addHardwareModel" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title" id="appHardwareModalLabel">五金单</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="comment">说明</label>
                        <div class="col-sm-9">
                            <input type="text" id="comment" maxlength="12" class="col-xs-10 col-sm-7 v_required"
                                   data-toggle="popover" data-trigger='manual'  />
                        </div>
                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary">确认</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="layerImportModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myTitleLabel">导入excel</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" novalidate="novalidate">
                    <div class="widget-main">
                        <div class="row" style="margin-right:0px">
                            <div class="col-xs-12">

                                <div class="form-group">

                                    <div class="row-fluid">
                                        <div class="col-sm-5 infobox-container no-padding-right" style="margin-left: 10%"
                                             id="download">

                                        </div>
                                    </div>

                                </div>
                                <div class="space5"></div>

                                <div class="form-group">
                                    <div class="control-label col-xs-8 no-padding-right" style="margin-left: 10%"
                                         id="importHardwareExcel"></div>
                                </div>
                                <div class="space5"></div>

                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="confirmBtn" class="btn btn-default">确定</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
	$.loadScript(['js/production/hardware.js']);
</script>
