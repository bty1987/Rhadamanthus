<div>
    <div class="row">
        <div class="col-xs-12">
            <div>
                <div id="hardwareCondList" class="fl_search clearfix"></div>
                <div class="clearfix tab-pane active" id="hardwareResultList"></div>
                <div class="fl-page-wrap clearfix" id="hardwarePagenation"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addHardwareModel" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title" id="appHardwareModalLabel">修改五金单</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">


                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="comment">说明</label>
                        <div class="col-sm-9">
                            <input type="text" id="comment" maxlength="12" class="col-xs-10 col-sm-7 v_required"
                                   data-toggle="popover" data-trigger='manual'  />
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary">确认</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="finishModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title" id="finishModelLabel">完结五金单</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="num">生成物流包数量</label>
                        <div class="col-sm-9">
                            <input type="text" id="num" maxlength="12" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveFinishBtn" class="btn btn-primary">确定</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="layerImportModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myModalLabel-1">导入excel</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">

                    <div class="form-group">
                        <div class="col-sm-5 infobox-container no-padding-right" style="margin-left: 10%" id="download"></div>
                    </div>
                    <div class="space5"></div>

                    <div class="form-group">
                        <div class="control-label col-xs-3 no-padding-right" style="margin-left: 10%" id="importHardwareExcel"></div>
                    </div>
                    <div class="space5"></div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">确定</button>
            </div>
        </div>
    </div>
</div>
