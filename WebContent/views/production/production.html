<div id="materialSubOrderPageContent">

    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>

            <div class="clearfix" id="resultList"></div>

            <div class="fl-page-wrap clearfix pagination" id="pagenation" style="display: block;"></div>
        </div>
    </div>

</div>

<div id="layerAdd" style="padding: 40px 0; display: none;">
        <div class="row-fluid">
            <form class="form-horizontal" novalidate="novalidate" id="form1">

                <div class="widget-main">
                    <div class="row" style="margin-right:0px">
                        <div class="col-xs-12">

                            <div class="form-group">
                                <label class="control-label col-xs-4">装修单号</label>
                                <div class="controls col-xs-8">
                                    <input type="text" class="span6 m-wrap col-xs-8 v_required" name="orderId"  rules="{required:true}" >
                                </div>
                            </div>
                            <div class="space5"></div>

                            <div class="form-group">
                                <label class="control-label col-xs-4">楼盘地址</label>
                                <div class="controls col-xs-8">
                                    <input type="text" class="span6 m-wrap col-xs-8" name="orderAddr"  rules="{required:true}" readonly>
                                </div>
                            </div>
                            <div class="space5"></div>

                            <div class="form-group">
                                <label class="control-label col-xs-4">设计师</label>
                                <div class="controls col-xs-8">
                                    <input type="text" class="span6 m-wrap col-xs-8 v_required" name="designer"  rules="{required:true}" >
                                </div>
                            </div>
                            <div class="space5"></div>

                            <div class="form-group">
                                <label class="control-label col-xs-4">工期</label>
                                <div class="controls col-xs-8">
                                    <input type="text" class="span6 m-wrap col-xs-8 v_required v_number" name="timeLimit"  rules="{required:true}" >
                                </div>
                            </div>
                            <div class="space5"></div>

                        </div>
                    </div>
                </div>

            </form>
        </div>
    </div>

<script type="text/javascript">
	$.loadScript(['js/production/production.js','js/production/productionUtils.js']);
</script>
