<div id="productionPageContent">
    <div>
        <div class="row">
            <div class="col-xs-12">
                <!-- 查询条件-->
                <div id="condList" class="fl_search clearfix"></div>
                <!--查询结果-->
                <div id="resultList" class="clearfix tab-pane active"></div>
                <!--分页-->
                <div id="pagenation" class="fl-page-wrap clearfix"></div>
            </div>
        </div>

        <div class="modal fade" id="productionModal" tabindex="-1">
            <div class="modal-dialog" style="margin-top: 10%;">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                        <h4 class="modal-title" id="myModalLabel">添加生产单</h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal">
                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right " for="orderId">装修单号</label>
                                <div class="col-sm-9">
                                    <input type="text" id="orderId" maxlength="12" class="col-xs-10 col-sm-7 v_required"  data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right " for="orderAddr">楼盘地址</label>
                                <div class="col-sm-9">
                                    <input type="text" id="orderAddr" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover"  readonly/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right " for="brand">品牌</label>
                                <div class="col-sm-9">
                                    <input type="text" id="brand" maxlength="12" class="col-xs-10 col-sm-7 v_required"  data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right " for="category">品类</label>
                                <div class="col-sm-9">
                                    <input type="text" id="category" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" readonly/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="designer">设计师</label>
                                <div class="col-sm-9">
                                    <input type="text" id="designer" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="salesman">销售员</label>
                                <div class="col-sm-9">
                                    <input type="text" id="salesman" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="spliter" data-i18n="page.production.label.splitter">拆单员</label>
                                <div class="col-sm-9">
                                    <input type="text" id="spliter" maxlength="12" class="col-xs-10 col-sm-7" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="total" data-i18n="page.production.label.totalPrice">总价</label>
                                <div class="col-sm-9">
                                    <input type="text" id="total" maxlength="12" class="col-xs-10 col-sm-7 v_required v_float" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="timeLimit">工期</label>
                                <div class="col-sm-9">
                                    <input type="text" id="timeLimit" maxlength="12" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                        </form>

                    </div>
                    <div class="modal-footer">
                        <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                        <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="upholdProductionModal" tabindex="-1">
            <div class="modal-dialog" style="margin-top: 10%;">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                        <h4 class="modal-title" id="myModalLabels">添加售后单</h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal">

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right " for="spid">父级生产单号</label>
                                <div class="col-sm-9">
                                    <input type="text" id="spid" maxlength="12" class="col-xs-10 col-sm-7 v_required"  data-toggle="popover" data-trigger='manual' placeholder="请输入父级生产单号"/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right " for="mbrand">品牌</label>
                                <div class="col-sm-9">
                                    <input type="text" id="mbrand" maxlength="12" class="col-xs-10 col-sm-7 v_required"  data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right " for="mcategory">品类</label>
                                <div class="col-sm-9">
                                    <input type="text" id="mcategory" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" readonly/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="upholdDesigner">设计师</label>
                                <div class="col-sm-9">
                                    <input type="text" id="upholdDesigner" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="upholdSalesman">销售员</label>
                                <div class="col-sm-9">
                                    <input type="text" id="upholdSalesman" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="upholdSpliter" data-i18n="page.production.label.splitter">拆单员</label>
                                <div class="col-sm-9">
                                    <input type="text" id="upholdSpliter" maxlength="12" class="col-xs-10 col-sm-7" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="upholdTotal" data-i18n="page.production.label.totalPrice">总价</label>
                                <div class="col-sm-9">
                                    <input type="text" id="upholdTotal" maxlength="12" class="col-xs-10 col-sm-7 v_required v_float" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="upholdTimeLimit">工期</label>
                                <div class="col-sm-9">
                                    <input type="text" id="upholdTimeLimit" maxlength="12" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                        </form>

                    </div>
                    <div class="modal-footer">
                        <button type="button" id="saveUpholdBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                        <button type="button" id="cancelUpholdBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                    </div>
                </div>
            </div>
        </div>


        <div class="modal fade" id="productionUpdateModal" tabindex="-1">
            <div class="modal-dialog" style="margin-top: 10%;">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                        <h4 class="modal-title" id="UpdateModal">更新生产单</h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal">

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="uDesigner">设计师</label>
                                <div class="col-sm-9">
                                    <input type="text" id="uDesigner" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="uSalesman">销售员</label>
                                <div class="col-sm-9">
                                    <input type="text" id="uSalesman" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="uSpliter" data-i18n="page.production.label.splitter">拆单员</label>
                                <div class="col-sm-9">
                                    <input type="text" id="uSpliter" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label no-padding-right" for="uTimeLimit">工期</label>
                                <div class="col-sm-9">
                                    <input type="text" id="uTimeLimit" maxlength="12" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                                </div>
                            </div>

                        </form>

                    </div>
                    <div class="modal-footer">
                        <button type="button" id="updateSaveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                        <button type="button" id="updateCancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="layerPopUp" class="portlet box"></div>
<div id="productionDataViewPopUp" class="portlet box"></div>

<script type="text/javascript">
   $.loadScript(['js/utils/productionPageUtils.js', 'js/utils/productionUtils.js', 'js/production/production.js']);
</script>
