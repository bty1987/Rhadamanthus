<div class="page-content">
    <div id="fl-statement"><div class="page-header"><h1>生产单<small><i class="icon-double-angle-right"></i>生产图纸</small></h1></div></div>
    <div class="row">
        <div class="col-xs-12">

            <!--显示部分-->
            <div class="clearfix" id="resultList">
                <div class="col-sm-7 infobox-container" id="uploadCAD">

                </div>

            </div>

            <div>
                <h3 class="clearfix">
                    <a class="btn btn-xs btn-info pull-left" id="uploadBtn" style="margin:0px 3px"><i class="icon-upload-alt"></i>上传</a>
                    <a class="btn btn-xs pull-left" id="backBtn" style="margin:0px 3px"><i class="icon-mail-forward "></i>返回</a>
                </h3>
            </div>

        </div>
    </div>
</div>



<div id="layerProductionImport" style="padding: 40px 0; display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form1">
            <div class="widget-main">
                <div class="row" style="margin-right:0px">
                    <div class="col-xs-12">

                        <div class="form-group">
                            <label class="control-label col-xs-4 no-padding-right">图纸说明</label>
                            <div class="controls col-xs-8">
                                <input type="text" class="span6 m-wrap col-xs-8 v_required" name="pictureComment"
                                       rules="{required:true}">
                            </div>
                        </div>
                        <div class="space5"></div>

                        <div class="form-group">
                            <div class="control-label col-xs-8 no-padding-right" style="margin-left: 10%" id="importProductionPicture"></div>
                        </div>
                        <div class="space5"></div>

                    </div>
                </div>
            </div>
        </form>
    </div>
</div>



<script src="js/production/productionPicture.js"></script>
<script src="js/production/productionUtils.js"></script>
