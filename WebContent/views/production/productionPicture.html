<div>
    <div id="fl-statement"><div class="page-header"><h1>生产单<small><i class="icon-double-angle-right"></i>生产图纸</small></h1></div></div>
    <div class="row">
        <div class="col-xs-12">

            <!--显示部分-->
            <div class="clearfix" id="resultList">
                <div class="col-sm-7 infobox-container" id="uploadCAD">

                </div>

            </div>

            <div>
                <h3 class="clearfix">
                    <a class="btn btn-xs btn-info pull-left" id="uploadBtn" style="margin:0px 3px"><i class="icon-upload-alt"></i>上传</a>
                    <a class="btn btn-xs pull-left" id="backBtn" style="margin:0px 3px"><i class="icon-mail-forward "></i>返回</a>
                </h3>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="layerProductionImport" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myTitleLabel">导入图纸</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" novalidate="novalidate">
                    <div class="widget-main">
                        <div class="row" style="margin-right:0px">
                            <div class="col-xs-12">

                                <div class="form-group">

                                    <label class="control-label col-xs-3 no-padding-right" for="comment">图纸说明</label>
                                    <div class="controls col-xs-8">
                                        <input type="text" id="comment" maxlength="12" class="span6 m-wrap col-xs-6 v_required"
                                               data-toggle="popover" data-trigger='manual'/>
                                    </div>

                                </div>
                                <div class="space5"></div>

                                <div class="form-group">
                                    <div class="control-label col-xs-3 no-padding-right" style="margin-left: 10%"
                                         id="importProductionPicture"></div>
                                </div>
                                <div class="space5"></div>

                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="confirmBtn" class="btn btn-default">确定</button>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
	$.loadScript(['js/production/productionPicture.js']);
</script>
