<div id="materialSubOrderPageContent">
		<div>
			<div class="row">
				<div class="col-xs-12">
					<!-- 查询条件-->
					<div id="condList" class="fl_search clearfix"></div>
					<!--查询结果-->
					<div id="resultList" class="clearfix tab-pane active"></div>
					<!--分页-->
					<div id="pagenation" class="fl-page-wrap clearfix"></div>
				</div>
			</div>

			<!--查看 工序组--工序 弹窗-->
			<div id="checkWorkflow" class="portlet box"></div>

			<div class="modal fade" id="workplanModal" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
							<h4 class="modal-title" id="myModalLabel">工序组</h4>
						</div>
						<div class="modal-body">
							<form class="form-horizontal">

								<div class="form-group">
									<label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
									<div class="col-sm-9">
										<input type="text" id="name" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-3 control-label no-padding-right" for="workshop">车间</label>
									<div class="col-sm-9">
										<select id="workshop" name="workshop" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}" style="width: 232px"></select>
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-3 control-label no-padding-right" for="comment">备注</label>
									<div class="col-sm-9">
										<input type="text" id="comment" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
									</div>
								</div>

							</form>

						</div>
						<div class="modal-footer">
							<button type="button" id="saveBtn" class="btn btn-primary">确定</button>
							<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

<script type="text/javascript">
	$.loadScript(['js/production/workplan.js']);
</script>
