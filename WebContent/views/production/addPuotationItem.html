<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div class="col-xs-3 form-horizontal">
				<div>
					<div class="portlet-title">
						<div class="caption">
						</div>
					</div>
				</div>

				<div class="" id="left">
					<div class="widget-main" style="border-right: 1px solid #c5d0dc;">

						<div class="form-group">
							<label for="name" class="col-sm-3 control-label no-padding-right">报价名</label>
							<div class="col-sm-9">
								<input type="text" class="col-xs-10 col-sm-10 v_required" data-toggle="popover"

							</div>
						</div>
						<div class="form-group">
							<label for="brand" class="col-sm-3 control-label no-padding-right">类型</label>
							<div class="col-sm-9">
								<input type="text" class="col-xs-10 col-sm-10" data-toggle="popover"
									    data-trigger="click" id="brand"  readonly>

							</div>
						</div>
						<div class="form-group">
							<label for="measurementunit" class="col-sm-3 control-label no-padding-right">单位</label>
							<div class="col-sm-9">
								<input type="text" class="col-xs-10 col-sm-10" data-toggle="popover"
									    data-trigger="click" id="measurementunit"  readonly>

							</div>
						</div>
						<div class="form-group">
							<label for="format1" class="col-sm-3 control-label no-padding-right">规格</label>
							<div class="col-sm-9">

							</div>
						</div>
						<div class="form-group">
							<label for="height" class="col-sm-3 control-label no-padding-right">长度</label>
							<div class="col-sm-9">

									    data-trigger="click" id="height" placeholder="米" >
								<i class="icon-asterisk"></i>
							</div>
						</div>
						<div class="form-group">
							<label for="width" class="col-sm-3 control-label no-padding-right">宽度</label>
							<div class="col-sm-9">
								<input type="text" class="col-xs-10 col-sm-10 v_required v_float" data-toggle="popover"
									    data-trigger="click" id="width" placeholder="米" >
								<i class="icon-asterisk"></i>
							</div>
						</div>
						<div class="form-group">
							<label for="thick" class="col-sm-3 control-label no-padding-right">厚度</label>

								<i class="icon-asterisk"></i>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">面积</label>
							<div class="col-sm-9">

						</div>
						<div class="form-group">
							<label for="unitprice" class="col-sm-3 control-label no-padding-right">售价</label>

								<input type="text" class="col-xs-10 col-sm-10 v_required v_price" data-toggle="popover"

								<i class="icon-asterisk"></i>
							</div>
						</div>
						<div class="form-group">
							<label for="num" class="col-sm-3 control-label no-padding-right">数量</label>

							</div>
						</div>
						<div class="form-group">
							<label for="total" class="col-sm-3 control-label no-padding-right">总价</label>
							<div class="col-sm-9">
								<input type="text" class="col-xs-10 col-sm-10" data-toggle="popover"
									    data-trigger="click" id="total"  readonly>

							</div>
						</div>
						<div class="form-group">
							<label for="remark" class="col-sm-3 control-label no-padding-right">备注</label>
							<div class="col-sm-9">
								<input type="text" class="col-xs-10 col-sm-10" data-toggle="popover"
									    data-trigger="click" id="remark"  >

							</div>

						<div class="form-group">
							<label for="specil" class="col-sm-3 control-label no-padding-right">特型</label>

							</div>

							<button id="submit" type="button" class="btn btn-success pull-left col-xs-3">

								<span>提交</span>
							</button>
							<button id="refresh" type="button" class="btn btn-danger pull-left col-xs-3">

								<span>重置</span>
							</button>
							<button id="returnBtn" type="button" class="btn btn-grey pull-left col-xs-3">

								<span>返回</span>
							</button>
						</div>
					</div>
				</div>

				<!--补充内容-->
				<div class="tab-content col-xs-9"  style="border: 0;">

							</div>
						</div>
						<div class="widget-body"  style="border: 0px;">

									<div class="lable_input col-xs-6">

										<div class="col-sm-9">

									</div>
									<div class="lable_input col-xs-6">
										<label for="comment" class="col-sm-3 control-label no-padding-right">备注</label>
										<div class="col-sm-9">
											<input id="comment" type="text" class="order_inputinfo col-xs-10 col-sm-10" readonly>

										</div>
									</div>
								</div>

								<div class="form-group">
									<div class="lable_input col-xs-6">
										<label for="discount" class="col-sm-3 control-label no-padding-right">折让</label>
										<div class="col-sm-9">
											<input id="discount" type="text" class="col-xs-10 col-sm-10" readonly>

										</div>
									</div>
									<div class="lable_input col-xs-6">
										<label for="totals" class="col-sm-3 control-label no-padding-right">总额</label>
										<div class="col-sm-9">
											<input id="totals" type="text" class="col-xs-10 col-sm-10" readonly>

										</div>
									</div>
								</div>

								<div class="form-group">
									<div class="lable_input col-xs-6">
										<label for="orderAddr"
											   class="col-sm-3 control-label no-padding-right">楼盘地址</label>
										<div class="col-sm-9">
											<input id="orderAddr" type="text" class="col-xs-10 col-sm-10" readonly>

										</div>
									</div>
								</div>

							</div>
						</div>

					<div class="form-horizontal">

						<ul id="puotationItemList" class="widget-main col-xs-11"

						</ul>

				</div>

</div>
