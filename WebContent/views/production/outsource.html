<div id="fl-statement"><div class="page-header"><h1 data-i18n="page.production.label.productionOrder">生产单<small><i class="icon-double-angle-right"></i>外协单</small></h1></div></div>
<div class="row">
    <div class="col-xs-12">
        <!--查询结果-->
        <div id="outsourceResultList" name="resultList" class="clearfix tab-pane active"></div>
        <div>
            <a class="btn btn-minier btn-primary pull-left" id="addOutsource" style="margin-top: 7px;margin-left: 2px"><i class="icon-plus bigger-110"></i>添加</a>
        </div>
        <div>
            <a id="backs" class="btn btn-minier pull-left" style="margin-top: 7px;margin-left: 10px"><i class="icon-mail-forward bigger-110"></i>返回</a>
        </div>
    </div>
</div>

<!-- 查看 外协单--外协项 窗口 -->
<div id="outsourceViewPopUp" class="portlet box"></div>

<div class="modal fade" id="outsourceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myModalLabel">说明</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="userId">厂商</label>
                        <div class="col-sm-9">
                            <input type="text" id="userId" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="timeLimit">工期</label>
                        <div class="col-sm-9">
                            <input type="text" id="timeLimit" maxlength="12" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="comment">内容</label>
                        <div class="col-sm-9">
                            <input type="text" id="comment" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>

                        </div>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="layerImportModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myModalLabel-1" data-i18n="page.production.label.chart">图表</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">

                    <div class="form-group">
                        <div class="col-sm-5 infobox-container no-padding-right" style="margin-left: 10%" id="download"></div>
                    </div>
                    <div class="space5"></div>

                    <div class="form-group">
                        <div class="control-label col-xs-3 no-padding-right" style="margin-left: 10%" id="importProductionPicture"></div>
                    </div>
                    <div class="space5"></div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.ok">确定</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="tranpackModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myModalLabel-2">信息</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="num" data-i18n="page.production.label.logisticsNum">物流包数量</label>
                        <div class="col-sm-9">
                            <input type="text" id="num" maxlength="12" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>

                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="tranpackBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/production/outsource.js']);
</script>
