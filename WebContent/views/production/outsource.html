<div id="layerImport" style="padding: 40px 0; display: none;">

                    <div class="col-xs-12">

                        <div class="form-group">

                                <div class="col-sm-5 infobox-container no-padding-right" style="margin-left: 10%" id="download">

                        </div>

                            <div class="control-label col-xs-3 no-padding-right" style="margin-left: 10%" id="importProductionPicture"></div>

                        <div class="space5"></div>

                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
