<div class="row">
    <div class="col-xs-12">
        <div class="page-content">
            <div class="page-header">
                <h1>
                    <span>计划单<small><i class="icon-double-angle-right"></i>计划项</small></span>
                </h1>
            </div>
            <!--查询结果-->
            <div id="itemResultList" class="clearfix tab-pane active"></div>
            <!--分页-->
            <div id="itemPagenation" class="fl-page-wrap clearfix"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="productionPlanItemModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 5%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myModalLabel">添加计划项</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="control-label col-xs-4 no-padding-center" for="itemName" >名称</label>
                        <div class="controls col-xs-8">
                            <input class="m-wrap m-ctrl-medium col-xs-7 v_required" size="16" type="text" value="" id="itemName"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-xs-4 no-padding-center " for="typeno" >型号</label>
                        <div class="controls col-xs-8">
                            <input class="m-wrap m-ctrl-medium col-xs-7 v_required"  size="16" type="text" value="" id="typeno" readonly/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-xs-4 no-padding-center" for="height" >高度</label>
                        <div class="controls col-xs-8">
                            <input class="m-wrap m-ctrl-medium col-xs-7 v_required v_float" size="16" type="text" value="" id="height"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-xs-4 no-padding-center" for="width" >宽度</label>
                        <div class="controls col-xs-8">
                            <input class="m-wrap m-ctrl-medium col-xs-7 v_required v_float" size="16" type="text" value="" id="width"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-xs-4 no-padding-center" for="thick" >厚度</label>
                        <div class="controls col-xs-8">
                            <input class="m-wrap m-ctrl-medium col-xs-7 v_required v_float" size="16" type="text" value="" id="thick"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-xs-4 no-padding-center" for="measurementUnit" >单位</label>
                        <div class="controls col-xs-8">
                            <input class="m-wrap m-ctrl-medium col-xs-7 v_required" size="16" type="text" value="" id="measurementUnit" readonly/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-xs-4 no-padding-center" for="itemNum" >数量</label>
                        <div class="controls col-xs-8">
                            <input class="m-wrap m-ctrl-medium col-xs-7 v_required v_number" size="16" type="text" value="" id="itemNum"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-xs-4 no-padding-center" for="color" >颜色</label>
                        <div class="controls col-xs-8">
                            <input class="m-wrap m-ctrl-medium col-xs-7" size="16" type="text" value="" id="color"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label col-xs-4 no-padding-center" for="comment" >备注</label>
                        <div class="controls col-xs-8">
                            <input class="m-wrap m-ctrl-medium col-xs-7" size="16" type="text" value="" id="comment"/>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="planItemSaveBtn" class="btn btn-primary">保存</button>
                <button type="button" id="planItemCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/production/productionPlanItem.js']);
</script>
