<div id="materialSubOrderPageContent">
<div>
    <div id="fl-statement"><div class="page-header">
          <h1>生产单
        <small><i class="icon-double-angle-right"></i>五金单</small>
          </h1>
       </div>
    </div>

    <div class="row">
        <div class="col-xs-12">

            <div id="condList" class="fl_search clearfix"></div>

            <div class="clearfix" id="resultList"></div>

            <div class="fl-page-wrap clearfix pagination" id="pagenation" style="display: block;"></div>
        </div>
    </div>

</div>


    <div class="modal fade" id="addHardwareItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="myModalLabel">添加五金项</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="name">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="name" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="unitPrice">单价</label>
                            <div class="col-sm-9">
                                <input type="text" id="unitPrice" size="16" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" readonly/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="itemNum">数量</label>
                            <div class="col-sm-9">
                                <input type="text" id="itemNum" size="16" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>


                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="measurementUnit">单位</label>
                            <div class="col-sm-9">
                                <input type="text" id="measurementUnit" size="16" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" readonly/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="total">总价</label>
                            <div class="col-sm-9">
                                <input type="text" id="total" size="16" class="col-xs-10 col-sm-7 v_required" data-toggle="popover"  readonly/>
                            </div>
                        </div>


                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="comment">备注</label>
                            <div class="col-sm-9">
                                <input type="text" id="comment" size="16" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>

                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
	$.loadScript(['js/production/hardwareItem.js']);
</script>
