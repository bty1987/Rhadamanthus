<div>
    <div class="row">
        <div class="col-xs-12">
            <div class="clearfix relative" id="form">

                <div class="inline">
                    <button id="addManifestItem" class="btn btn-yellow" data-i18n="page.manifest.btn.addGoodsItem">添加货单项</button>
                    <button id="submitManifest" class="btn btn-info" data-loading-text="提交中..." type="submit">
                        <i class="icon-ok"></i>
                        <span data-i18n="msg.save">保存</span>
                    </button>
                </div>

                <div class="pull-right" id="timelement">
                    <div class="inline">
                        <label>单据类型</label>
                        <div class="inline">
                            <select class="m-ctrl-medium" id="manifestType"></select>
                        </div>
                    </div>

                    <div class="inline">
                        <label data-i18n="page.manifest.label.docDate">单据日期</label>
                        <div class="inline">
                            <input id="manifestTime" class="m-wrap m-ctrl-medium v_required" placement="top" readonly size="16" type="text" value=""/>
                        </div>

                    </div>
                    <div class="inline">
                        <label>选择模板</label>
                        <div class="inline">
                            <select class="m-ctrl-medium" id="manifestTemplate"></select>
                        </div>
                        
                        <div class="inline" id="addManifestStyle">
                            <a class="btn btn-xs pull-left">添加</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <ul class="flex-table">
                <li class="line table-title">
                    <div class="line-wrap order">
                        <div class="cell index"></div>
                    </div>
                    <div class="line-wrap content col10">
                        <div class="cell">商品编号</div>
                        <div class="cell">名称</div>
                        <div class="cell">条形码</div>
                        <div class="cell">颜色</div>
                        <div class="cell">规格</div>
                        <div class="cell">单位</div>
                        <div class="cell" data-i18n="page.manifest.label.warehouse">仓库</div>
                        <div class="cell">数量</div>
                        <div class="cell">金额</div>
                        <div class="cell">备注</div>
                    </div>
                    <div class="line-wrap action">
                        <div class="cell option">操作</div>
                    </div>
                </li>
            </ul>

            <ul class="flex-table" id="list"></ul>

            <div style="margin-top: 15px;">
                <div class="inline-group">
                    <label>备注</label>
                    <div class="item long">
                        <input type="text" id="comment" maxlength="64">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/manifest/manifest2create.js']);
</script>
