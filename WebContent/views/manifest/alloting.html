<div class="row">
    <div class="col-xs-12">
        <div class="clearfix relative" id="form">
            <div class="inline">
                <button id="addManifestItem" class="btn btn-yellow">添加商品</button>
                <button id="submitManifest" class="btn btn-info" data-loading-text="提交中..." type="submit">
                    <i class="icon-ok"></i>
                    <span data-i18n="msg.submit">提交</span>
                </button>
            </div>

            <div class="pull-right" id="timelement">
                <div class="inline">
                    <label data-i18n="page.manifest.label.docDate">单据日期</label>
                    <div class="inline">
                        <input id="manifestTime" class="m-wrap m-ctrl-medium v_required" placement="top"
                               readonly size="16" type="text" value=""/>
                    </div>
                </div>
            </div>
        </div>

        <ul class="flex-table">
            <li class="line table-title">
                <div class="line-wrap order">
                    <div></div>
                </div>
                <div class="line-wrap content col10">
                    <div class="cell">商品编号</div>
                    <div class="cell">名称</div>
                    <div class="cell">颜色</div>
                    <div class="cell">规格</div>
                    <div class="cell">单位</div>
                    <div class="cell">进货仓库</div>
                    <div class="cell" data-i18n="page.manifest.label.outWarehouse">出货仓库</div>
                    <div class="cell">数量</div>
                    <div class="cell">件数</div>
                    <div class="cell">备注</div>
                </div>
                <div class="line-wrap action">
                    <div class="cell option">操作</div>
                </div>
            </li>
        </ul>

        <ul class="flex-table" id="list"></ul>

        <div style="margin-top: 15px;">
            <div class="inline-group">
                <label>备注</label>
                <div class="item long">
                    <input type="text" id="comment" maxlength="64">
                </div>
            </div>
        </div>

        <!--审批调拨提交弹窗-->
        <div id="approvalSubmit" style="display: none" class="portlet box page-content">
            <div class="row-fluid">
                <form class="form-horizontal">
                    <div class="form-group" style="margin-right: 0">
                        <label class="col-xs-3 control-label " for="approver">审批人</label>
                        <div class="col-xs-9 controls" id="approver"></div>
                    </div>
                    <div class="form-group">
                        <div class="col-md-offset-3 col-md-9">
                            <a class="btn btn-success btn-sm" id="submitBtn" data-i18n="msg.submit">提交</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/manifest/alloting.js', 'js/utils/approvalUtils.js']);
</script>
