<div id="accessoriesTypePageContent">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <div class="clearfix" id="resultList"></div>
            <div class="fl-page-wrap clearfix pagination" id="pagenation" style="display: block;"></div>
        </div>
    </div>
</div>

<div id="layerAdd" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form1">

            <div class="widget-main">
                <div class="row" style="margin:0px;">
                    <div class="col-md-11">
                        <div class="form-group">
                            <label class="col-md-4 control-label no-padding-right orange">名称</label>
                            <div class="col-md-8">
                                <input type="hidden" id="atid">
                                <input type="text" class="v_required" id="name" name="name" data-required="1" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-4 control-label no-padding-right orange">工种</label>
                            <div class="col-md-8">
                                <select class="v_required" id="workType" name="workType" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-4 control-label no-padding-right orange">说明</label>
                            <div class="col-md-8">
                                <input type="text" class="v_required" id="comment" name="comment" data-required="1" data-toggle="popover" data-trigger='manual'>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-md-offset-11">
                                <a class="btn btn-success btn-sm" id="submitBtn">确定</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<div id="importLayer" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form2">

            <div class="form-group" style="margin:0px;">
                <div style="margin-left : 10%;font-size : 16px;color : red;font-family : 微软雅黑">上传字段均为文本类型</div>
            </div>
            <div class="form-group" style="margin:0px;">
                <div style="margin-left : 10%;font-size : 16px;color : red;font-family : 微软雅黑">上传格式 : 名称 工种ID 说明</div>
            </div>
            <div class="form-group" style="margin:0px;">
                <div style="margin-left : 10%;font-size : 16px;color : red;font-family : 微软雅黑">注意 : 上传文件中请填写具体内容，不显示表头</div>
            </div>
            <div class="form-group" style="margin:0px;">
                <div style="margin-left : 10%;font-size : 16px;color : red;font-family : 微软雅黑">例 : </div>
            </div>

            <div class="form-group" style="margin : 10px;">
                <ul class="flex-table">
                    <li class="">
                        <div class="line-wrap content col3" style="width : 100%;">
                            <div class="cell">名称</div>
                            <div class="cell">工种ID</div>
                            <div class="cell">说明</div>
                        </div>
                    </li>
                    <li class="">
                        <div class="line-wrap content col3" style="width : 100%;">
                            <div class="cell">油工</div>
                            <div class="cell">7</div>
                            <div class="cell">油工说明</div>
                        </div>
                    </li>
                </ul>
            </div>

            <div class="form-group" style="margin:0px;">
	            <div class="form-group" style="margin:0px;">
	                <div style="margin-left: 9%" id="importSelectAccessoriesType"></div>
	            </div>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/manifest/accessoriesType.js']);
</script>
