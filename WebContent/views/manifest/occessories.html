<div class="row">
    <div class="col-xs-12">
        <div id="condList" class="fl_search clearfix"></div>
        <div class="clearfix" id="resultList"></div>
        <div class="fl-page-wrap clearfix pagination" id="pagenation" style="display: block;"></div>
    </div>
</div>

<div class="modal fade" id="bindOccessoriesModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="SaveBind">绑定厂商</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="supplier">厂商</label>
                        <div class="col-sm-9">
                            <input type="text" id="supplier" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"/>
                        </div>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div id="miniPopUp"></div>
<div id="layerPopUp" class="portlet box page-content"></div>

    $.loadScript(['js/manifest/occessories.js']);
