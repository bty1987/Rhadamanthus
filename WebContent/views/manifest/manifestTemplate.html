
<div class="page-content">

    <div class="row">
        <div class="col-xs-12">

    <div class="row-fluid">

                <div class="row" style="margin: 0px;">
                    <div class="col-md-11">

                        <div class="form-group">
                            <label class="col-md-4 control-label no-padding-right orange">名称</label>
                            <div class="col-md-8">

                        </div>

                        <div class="form-group">
                            <label class="col-md-4 control-label no-padding-right orange">说明</label>
                            <div class="col-md-8">

                        </div>
                    </div>
                </div>
            </div>
        </form>
