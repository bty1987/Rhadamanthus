<div class="page-content">
    <div class="row" style="margin-right: 0px;">
        <div class="col-xs-12">
            <div class="flex-wrap" id="form" style="margin-bottom: 10px;">

                <div class="stay-bottom inline">

                    <button class="btn btn-yellow" id="addPurchase" >添加一条采购项</button>

                </div>

                <div class="inline pull-right">

                    <div class="inline">

                        <label>单据日期</label>
                        <div class="inline">
                            <input name="date" class="m-wrap m-ctrl-medium date-picker" readonly size="16" type="text" value="" />
                        </div>

                    </div>

                    <div class="devide-line"></div>

                </div>
            </div>

            <ul class="flex-table" id="title"></ul>

            <ul class="flex-table" id="list"></ul>

            <div style="margin-top: 15px;">


                <div class="inline">

                    <label>说明</label>
                    <div class="inline long">
                        <input type="text" id="comment" maxlength="64">
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

    $.loadScript(['js/manifest/editPurchase.js']);
