
<div id="goodsPageContent" class="page-content">

    <div class="row">

        <div class="col-xs-12">

            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->

            <div class="clearfix" id="resultList"></div> <!--查询结果-->

            <div class="fl-page-wrap clearfix pagination" id="pagenation" style="display: block;"></div> <!--分页-->

        </div>

    </div>

</div>



<div id="layerAdd"  style="padding: 40px 0;display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form1">

            <div class="widget-main">
                <div class="row" style="margin: 0px;">
                    <div class="col-md-11">

                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">商品编号</label>

                            <div class="col-md-8">

                                <input type="text" class="col-xs-10 col-sm-5 v_required" id="no" name="no" >
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>

                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">添加类型</label>

                            <div class="col-md-8">
                                <select id="type" name="type" class="col-xs-10 col-sm-5 v_required" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">

                                </select>
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>

                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">名称</label>

                            <div class="col-md-8">

                                <input type="text" class="col-xs-10 col-sm-5 v_required" id="name" name="name" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}" >
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>

                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">条形码</label>

                            <div class="col-md-8">

                                <input type="text" class="col-xs-10 col-sm-5" id="barcode" name="barcode" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:false}">
                                <span class="required"></span>
                            </div>

                        </div>
                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">品类</label>

                            <div class="col-md-8">
                                <select id="category" name="category" class="col-xs-10 col-sm-5 v_required" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">

                                </select>
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>
                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">品牌</label>

                            <div class="col-md-8">

                                <input type="text" class="col-xs-10 col-sm-5 v_required" id="brand" name="brand" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>
                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">单位</label>

                            <div class="col-md-8">

                                <select class="col-xs-10 col-sm-5 v_required" id="measurementUnit" name="measurementUnit" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">

                                </select>
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>
                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">件数</label>

                            <div class="col-md-8">

                                <input type="text" class="col-xs-10 col-sm-5 v_goods" id="pieceNum" name="pieceNum" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>
                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">辅类</label>

                            <div class="col-md-8">

                                <select class="col-xs-10 col-sm-5 " id="atid" name="atid" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}">

                                </select>
                                <span class="required"></span>
                            </div>

                        </div>

                    </div>
                </div>
            </div>


        </form>
    </div>

</div>

<div id="goodsSuitPopUp" class="portlet box"></div>

<div id="goodsColorPopUp" class="portlet box"></div>

<div id="goodsFormatPopUp" class="portlet box"></div>

<div id="goodsPricePopUp" class="portlet box"></div>




<script type="text/javascript">
    $.loadScript(['js/manifest/goods.js']);
</script>
