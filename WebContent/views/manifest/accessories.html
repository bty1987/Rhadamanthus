
<div class="row">
    <div class="col-xs-12">
        <div id="condList" class="fl_search clearfix"></div>
        <div class="clearfix" id="resultList"></div>
        <div class="fl-page-wrap clearfix pagination" id="pagenation" style="display: block;"></div>
    </div>
</div>

<div id="layerPopUp" class="portlet box page-content"></div>

<div class="modal fade" id="bindAccessoriesModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">分配厂商</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="supplier">厂商</label>
                        <div class="col-sm-9">
                            <input type="text" id="supplier" class="col-xs-10 col-sm-5 v_required"
                                   data-toggle="popover" data-trigger='manual' maxlength="15"/>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBindAccessoriesBtn" class="btn btn-primary">保存</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="balanceAccessoriesModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%; width: 500px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">辅料单结算</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-4 control-label no-padding-right" for="balanceInput">结算额（元）</label>
                        <div class="col-sm-7">
                            <!-- 结算额公式化: 服务端Σ(辅材结算价×数量)计算, 此处只读预览 -->
                            <input type="text" id="balanceInput" class="form-control input-sm" readonly="readonly"
                                   placeholder="打开弹窗自动计算" />
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBalanceAccessoriesBtn" class="btn btn-primary">保存</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="accessoriesChargeViewModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%; width: 720px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">辅料费用明细</h4>
            </div>
            <div class="modal-body">
                <table class="table table-striped table-bordered table-hover">
                    <thead>
                        <tr>
                            <th width="24%">辅料项</th>
                            <th width="22%">费用名称</th>
                            <th width="14%">单价（元）</th>
                            <th width="12%">浮动额（元）</th>
                            <th width="10%">数量</th>
                            <th width="18%">小计（元）</th>
                        </tr>
                    </thead>
                    <tbody id="accessoriesChargeViewBody"></tbody>
                    <tfoot>
                        <tr id="accessoriesChargeTotalRow" class="warning">
                            <td colspan="5" class="text-right"><strong>合计（元）</strong></td>
                            <td><strong id="accessoriesChargeTotalAmount">0.000</strong></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/kingdeeUtils.js', 'js/manifest/accessories.js']);
</script>
