<div class="row">
    <div class="col-xs-12">
        <div class="col-xs-3 form-horizontal">
            <div>
                <div class="portlet-title">
                    <div class="caption"></div>
                </div>
            </div>

            <div class="widget-body" id="left">
                <div class="widget-main" style="border-right: 1px solid #c5d0dc;">

                    <div class="hide">
                        <input type="hidden" id="goodsHidden"/>
                    </div>

                    <div class="form-group">
                        <label for="goodsName" class="col-sm-3 control-label no-padding-right orange">商品名</label>
                        <div class="col-sm-9">
                            <input type="text" class="col-xs-10 col-sm-10 v_required" data-toggle="popover"
                                   data-placement="bottom" data-trigger="manual" id="goodsName" placeholder="请输入商品名">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="goodsNo" class="col-sm-3 control-label no-padding-right">编号</label>
                        <div class="col-sm-9">
                            <input type="text" class="col-xs-10 col-sm-10" data-toggle="popover" data-placement="bottom"
                                   data-trigger="manual" id="goodsNo" readonly>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category" class="col-sm-3 control-label no-padding-right">品类</label>
                        <div class="col-sm-9">
                            <input type="text" class="col-xs-10 col-sm-10" data-toggle="popover" data-trigger="manual"
                                   id="category" readonly>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="brand" class="col-sm-3 control-label no-padding-right">品牌</label>
                        <div class="col-sm-9">
                            <input type="text" class="col-xs-10 col-sm-10" data-toggle="popover" data-trigger="manual"
                                   id="brand" readonly>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="measurementUnit" class="col-sm-3 control-label no-padding-right">单位</label>
                        <div class="col-sm-9">
                            <input type="text" class="col-xs-10 col-sm-10" data-toggle="popover" data-trigger="manual"
                                   id="measurementUnit" readonly>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="num" class="col-sm-3 control-label no-padding-right orange">数量</label>
                        <div class="col-sm-9">
                            <input type="text" class="col-xs-10 col-sm-10 v_required v_float_3" maxlength="10"
                                   data-toggle="popover" data-placement="bottom" data-trigger="manual" id="num">
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="col-sm-9">
                            <input type="text" class="col-xs-10 col-sm-10 hide" data-toggle="popover"
                                   data-trigger="manual" id="bid">
                        </div>
                    </div>

                    <div class="form-group buttons row-fluid col-xs-12">
                        <button id="add" type="button" class="btn btn-primary pull-left col-xs-4">
                            <span>添加</span>
                        </button>
                        <button id="submit" type="button" class="btn btn-success pull-left col-xs-4">
                            <span>提交</span>
                        </button>
                        <button id="refresh" type="button" class="btn btn-danger pull-left col-xs-4">
                            <span>重置</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!--补充内容-->
        <div class="tab-content col-xs-9" style="border: 0;">
            <div class="form-horizontal">
                <div>
                    <div class="caption"></div>
                </div>
                <div class="widget-body" style="border: 0px;">
                    <div class="widget-main" id="searchInfo" style="border-bottom: 1px solid #c5d0dc">

                        <div class="form-group">
                            <div class="lable_input col-xs-4">
                                <label for="orderId" class="col-sm-3 control-label no-padding-right orange">装修单号 </label>
                                <div class="col-sm-9">
                                    <input id="orderId"  class="col-xs-10 col-sm-7 v_required" type="text" class="order_inputinfo v_required" placeholder="请输入装修单号"/>
                                </div>
                            </div>
                            <div class="lable_input col-xs-4">
                                <label for="supervisorName" class="col-sm-3 control-label no-padding-right">监理姓名</label>
                                <div class="col-sm-9">
                                    <input id="supervisorName" class="col-xs-10 col-sm-7 v_required" type="text" class="order_inputinfo" readonly="readonly"/>
                                </div>
                            </div>
                        
                            <div class="lable_input col-xs-4">
                                <label for="orderAddr" class="col-sm-3 control-label no-padding-right">楼盘地址</label>
                                <div class="col-sm-9">
                                    <input id="orderAddr" class="col-xs-10 col-sm-7 v_required"  type="text" class="order_inputinfo" readonly="readonly"/>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <div class="lable_input col-xs-4">
                                <label class="col-sm-3 control-label no-padding-right">可进园区</label>
                                <div class="col-sm-9">
                                    <select id="isEnter" class="col-xs-10 col-sm-7 v_required" name="isEnter" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                                </div>
                            </div>

                            <div class="lable_input col-xs-4">
                                <label class="col-sm-3 control-label no-padding-right">有无电梯</label>
                                <div class="col-sm-9">
                                    <select id="isLift" class="col-xs-10 col-sm-7 v_required" name="isLift" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                                </div>
                            </div>

                            <div class="lable_input col-xs-4">
                                <label class="col-sm-3 control-label no-padding-right">有无超阶</label>
                                <div class="col-sm-9">
                                    <select  id="isExceed" class="col-xs-10 col-sm-7 v_required"  name="isExceed" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                                </div>
                            </div>
                         </div>
                        
                        <div class="form-group">
                            <div class="lable_input col-xs-4">
                                <label class="col-sm-3 control-label no-padding-right">有无阁楼</label>
                                <div class="col-sm-9">
                                    <select id="isAttic" class="col-xs-10 col-sm-7 v_required"  name="isAttic" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                                </div>
                            </div>

                            <div class="lable_input col-xs-4">
                                <label class="col-md-3 control-label no-padding-right" for="comment">备注</label>
                                <div class="col-sm-8">
                                    <input type="text" class="col-xs-8 m-wrap" id="comment">
                                </div>
                            </div>
                        </div>

                        
                    </div>
                </div>
            </div>

            <div class="form-horizontal">
                <ul id="accessoriesItemList" class="widget-main col-xs-12" style="margin: 0px"></ul>
            </div>
        </div>
    </div>
</div>

<!-- 费用弹窗 -->
<div id="chargeModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog" style="width: 800px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">外辅费用管理</h4>
            </div>
            <div class="modal-body">
                <form id="chargeForm">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="chargeTable" class="table table-striped table-bordered table-hover">
                                <thead>
                                    <tr>
                                        <th width="40%">费用名称</th>
                                        <th width="25%">价格（元）</th>
                                        <th width="20%">数量</th>
                                        <th width="15%">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="chargeTableBody">
                                    <!-- 费用列表动态生成 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="row" style="margin-top: 10px;">
                        <div class="col-xs-12">
                            <button type="button" class="btn btn-sm btn-success" id="addChargeBtn">
                                <i class="icon-plus"></i> 添加费用
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-sm btn-primary" id="saveChargeBtn">确定</button>
            </div>
        </div>
    </div>
</div>

<div id="viewPopUp" class="portlet box"></div>

<script type="text/javascript">
    $.loadScript(['js/manifest/occessories2create.js']);
</script>
