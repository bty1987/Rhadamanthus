<div>

	<div class="widget-box transparent">
		<div class="widget-header">
			<h4>添加价格</h4>
		</div>
	</div>

	<div id="addPrice">

		<ul class="flex-table" id="list">
			<li class="line current">
				<div class="line-wrap content col7">
					<div class="cell name">
						<input id="name" type="text" placeholder="名称" data-toggle="popover" data-placement="bottom" class="editable v_required">
					</div>
					<div class="cell purchase">
						<input id="purchase" type="text" placeholder="进价" data-toggle="popover" data-placement="bottom" class="editable v_float_3">
					</div>
					<div class="cell selling">
						<input id="selling" type="text" placeholder="售价" data-toggle="popover" data-placement="bottom" class="editable v_float_3">
					</div>
					<div class="cell ctype">
						<select id="ctype">
                            <option value="0">底价</option>
							<option value="1">点位</option>
						</select>
					</div>
					<div class="cell cvalue">
						<input id="cvalue" type="text" placeholder="结算值" data-toggle="popover" data-placement="bottom" class="editable v_float_3">
					</div>
					<div class="cell type">
						<select id="type">
							<option value="0">正价</option>
							<option value="1">特价</option>
						</select>
					</div>
				</div>
				<div class="line-wrap action">
					<div class="cell option">
						<a class="color-green green" style="font-size: 18px" id="addBtn"><i class="icon-ok"></i></a>
                        <a class="color-red red" style="font-size: 18px" id="delBtn"><i class=" icon-remove"></i></a>
					</div>
				</div>
			</li>
		</ul>
	</div>
	
	<div class="widget-box transparent">
        <div class="widget-header">
            <h4>列表</h4>
        </div>
    </div>
	
	<div id="showPrice">
		<div class="clearfix" id="resultListPrice"></div>
	</div>

</div>


<script type="text/javascript">
	$.loadScript([ 'js/manifest/price4advance.js' ]);
</script>
