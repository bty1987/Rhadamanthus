
<div id="goodsPageContent">

    <div class="row" style="margin-left:30px;margin-right:30px">
        <div id="list" style="margin-left:10px"></div>
        <div>
            <h3 class="clearfix" >
                <a  class="btn btn-minier btn-warning pull-left" id="importBtn" style="margin-top: -2px;">
                    <i class="icon-download-alt bigger-110 "></i>
                    <span data-i18n="msg.export">导出</span>
                </a>
                <a  class="btn btn-mini pull-left hide" id="confirmBtn">
                    <i class="icon-ok "></i>
                    <span data-i18n="msg.confirm">确认</span>
                </a>
                <a  class="btn btn-mini pull-left hide" id="cancelBtn">
                    <i class="icon-remove  "></i>
                    <span data-i18n="msg.cancel">取消</span>
                </a>
                <a class="btn btn-minier btn-success pull-left" id="addBtn" style="margin-top: -2px; margin-left: 4px;">
                    <i class="icon-plus bigger-110"></i>
                    <span>添加</span>
                </a>
                <a class="btn btn-minier btn-primary pull-left" id="backBtn" style="margin-top: -2px; margin-left: 4px;">
                    <i class="icon-mail-forward "></i>
                    <span data-i18n="msg.back">返回</span>
                </a>
            </h3>
        </div>
    </div>
</div>

<div id="layerEdit" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal">

            <div class="widget-main">
                <div class="row" style="margin-right: 0px;">
                    <div class="col-md-11">

                        <div class="form-group">
                            <label class="col-md-4 control-label no-padding-right" for="balance">结算值</label>
                            <div class="col-md-8">
                                <input type="text" id="balance" class="col-xs-10 col-sm-5 v_num" />
                            </div>
                        </div>
                        <div class="space5"></div>

                        <div class="form-group">
                            <label class="col-md-4 control-label no-padding-right" for="comment">说明</label>
                            <div class="col-md-8">
                                <textarea maxlength="64" id="comment" class="col-xs-10 col-sm-5" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="space5"></div>
                        <div class="form-group">
                            <div class="col-md-offset-4 col-md-9">
                                <a class="btn btn-success btn-sm" id="submitBtn" data-i18n="msg.ok">确定</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

    $.loadScript(['js/manifest/purchaseBalance2balance.js']);
