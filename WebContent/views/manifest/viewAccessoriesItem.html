<div class="">
    <div class="row" style="margin: 20px;margin-right: 0px">
        <div class="col-xs-12">
            <!--style="margin: 0 auto;border-right:1px solid orange;height: 520px;max-height: 520px;margin-right: 20px"-->
            <div id="accessoriesOrderId" class="table-responsive col-xs-12" >

                <div id="orderInfo" class="clearfix tab-pane active">

                </div>

            </div>
            <!-- style="max-height: 510px;overflow: hidden;overflow-y: scroll;width: 64%"-->
            <div id="accessoriesItem" class="col-xs-12 column">

                <div class="flex-wrap" id="form">

                    <div>


                        <div class="inline">

                            <div class="inline">
                            </div>

                        </div>

                        <div class="devide-line"></div>

                    </div>
                </div>

                <ul class="flex-table">
                    <li class="line table-title">
                        <div class="line-wrap order">
                            <div class="cell index"></div>
                        </div>
                        <div class="line-wrap content col8">
                            <div class="cell">商品编号</div>
                            <div class="cell">名称</div>
                            <div class="cell">颜色</div>
                            <div class="cell">规格</div>
                            <div class="cell">单位</div>
                            <div class="cell">仓库</div>
                            <div class="cell">数量</div>
                            <div class="cell">备注</div>
                        </div>
                    </li>
                </ul>

                <ul class="flex-table" id="list"></ul>

                <div style="margin-top: 15px;">


                    <div class="inline">

                        <label>备注</label>
                        <div class="inline long">
                            <input type="text" id="comment" maxlength="64">
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
    $.loadScript(['js/manifest/viewAccessoriesItem.js']);
</script>
