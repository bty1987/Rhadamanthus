<div class="row">
    <div class="col-xs-12">
        <div class="clearfix relative" id="form">

            <div class="inline">
                <button class="btn btn-yellow" id="addPurchase">增加采购项</button>
                <button id="submitPurchase" class="btn btn-info" data-loading-text="提交中..." type="submit">
                    <i class="icon-ok"></i>
                    <span data-i18n="msg.save">保存</span>
                </button>
            </div>

            <div class="pull-right" id="timelement">
                <div class="inline">
                    <label data-i18n="page.manifest.label.docDateLabel">单据日期 : </label>
                    <div class="inline">
                        <input id="createTime" class="m-wrap m-ctrl-medium v_required" placement="top"
                               readonly="readonly" type="text" value=""/>
                    </div>
                </div>

                <div class="inline">
                    <label>交付日期 : </label>
                    <div class="inline">
                        <input id="deliveryTime" class="m-wrap m-ctrl-medium v_required" placement="top"
                               readonly="readonly" type="text" value=""/>
                    </div>
                </div>
            </div>
        </div>

        <ul class="flex-table">
            <li class="line table-title">
                <div class="line-wrap order">
                    <div class="cell index"></div>
                </div>
                <div class="line-wrap content col9">
                    <div class="cell">商品编号</div>
                    <div class="cell">商品名称</div>
                    <div class="cell">品类</div>
                    <div class="cell">品牌</div>
                    <div class="cell">颜色</div>
                    <div class="cell">规格</div>
                    <div class="cell">数量</div>
                    <div class="cell">件数</div>
                    <div class="cell">单价</div>
                </div>
                <div class="line-wrap action">
                    <div class="cell option">操作</div>
                </div>
            </li>
        </ul>

        <ul class="flex-table" id="list"></ul>

        <div style="margin-top: 15px;">

            <div class="inline-group">

                <label>备注 : </label>
                <div class="item long">
                    <input type="text" id="comment" maxlength="64">
                </div>
            </div>
            <div class="col-sm-1 pull-right inline">
                <span>总价:</span>
                <span id="totalSpan">0</span>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/manifest/purchase2create.js']);
</script>
