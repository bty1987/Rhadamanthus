<div class="row">
    <div class="col-xs-12">
        <div class="widget-box transparent">
            <div class="widget-header">
                <h4>装修单</h4>
            </div>
            <div id="orderInfo" class="clearfix"></div>
        </div>
        
        <hr />
        
        <div id="accessoriesItem">
            <ul class="flex-table">
                <li class="line table-title">
                    <div class="line-wrap order">
                        <div class="cell index"></div>
                    </div>
                    <div class="line-wrap content col8">
                        <div class="cell">商品编号</div>
                        <div class="cell">名称</div>
                        <div class="cell">颜色</div>
                        <div class="cell">规格</div>
                        <div class="cell">单位</div>
                        <div class="cell">仓库</div>
                        <div class="cell">数量</div>
                        <div class="cell">备注</div>
                    </div>
                </li>
            </ul>

            <ul class="flex-table" id="list"></ul>

            <div style="margin-top: 15px;">
                <div class="inline">
                    <label>备注</label>
                    <div class="inline long">
                        <input type="text" id="comment" maxlength="64">
                    </div>
                </div>
            </div>
            
            <div class="pull-right">
                <a class="btn btn-success btn-sm" id="outBtn">出货</a>
                <a class="btn btn-danger btn-sm" id="refuseBtn">拒绝</a>
                <a class="btn btn-sm" id="cancelBtn">取消</a>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/manifest/accessories2out.js']);
</script>
