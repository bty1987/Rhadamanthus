<div id="goodsStorehouseStockPageContent" class="page-content">

    <div class="row">

        <div class="col-xs-12">

            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->

            <div class="clearfix" id="resultList"></div> <!--查询结果-->

            <div class="fl-page-wrap clearfix pagination" id="pagenation" style="display: block;"></div> <!--分页-->

        </div>

    </div>

</div>

<div id="layerAdd" style="padding: 40px 0;display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form1">

            <div class="widget-main">
                <div class="row" style="margin: 0px;">
                    <div class="col-md-11">

                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">库存</label>

                            <div class="col-md-8">

                                <input type="text" class="col-xs-10 col-sm-5 v_required" id="num" name="num" readonly="readonly" data-required="1" data-toggle="popover" data-trigger='manual'>
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>


                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">新库存</label>

                            <div class="col-md-8">

                                <input type="text" class="col-xs-10 col-sm-5 v_required v_number" id="newNum" name="newNum" data-required="1" data-toggle="popover" data-trigger='manual' rules="{isAllDigit:true}" >
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>

                    </div>
                </div>
            </div>




        </form>
    </div>

</div>

<div id="layerAddGoodsStorehouseStock" style="padding: 40px 0;display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form2">

            <div class="widget-main">
                <div class="row" style="margin: 0px;">
                    <div class="col-md-11">
                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">商品名</label>

                            <div class="col-md-8">

                                <input type="text" class="col-xs-10 col-sm-5 v_required" id="name" name="name" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}" >
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>
                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">颜色</label>

                            <div class="col-md-8">

                                <select class="col-xs-10 col-sm-5 v_required" id="color" name="color" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}"></select>
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>
                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">规格</label>

                            <div class="col-md-8">

                                <select class="col-xs-10 col-sm-5 v_required" id="format" name="format" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}"></select>
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>

                        </div>
                        <div class="form-group">

                            <label class="col-md-4 control-label no-padding-right">仓库</label>

                            <div class="col-md-8">
                                <select class="col-xs-10 col-sm-5 v_required" id="storehouse" name="storehouse" data-required="1" data-toggle="popover" data-trigger='manual' rules="{required:true}"></select>
                                <span class="required"><i class='icon-asterisk'></i></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>

<div id="splitAndMergePopUp" class="portlet box"></div>

<script type="text/javascript">
    $.loadScript(['js/manifest/goodsStorehouseStock.js']);
</script>
