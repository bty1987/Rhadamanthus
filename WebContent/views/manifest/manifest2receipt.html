<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>
    <title>小票打印</title>


    <script type="text/javascript" src="../../assets/js/jquery-1.10.1.min.js"></script>
    
    <style type="text/css">
        *{padding:0;margin: 0;}
        h1{font-size: 20px;}
        h3{font-size: 16px;}
        .left{
            float: left;
        }
        .right{
            float:right;
        }
        .clearfix{
            clear: both;
        }
        ul{list-style: none;}
        .print_container{
            box-sizing: border-box;
            padding: 8px;
            width: 188px;
        }
        .section1{
        }
        td{
            word-break: break-all;
        }
        .section2 label{
            display: block;
        }
        .section3 label{
            display: block;
        }
        .section4{
        }
        .section4 .total label{
            display: block;
        }
        .section4 .other_fee{
            border-bottom: 1px solid #DADADA;
        }
        .section5 label{
            display: block;
        }

        .line{
            overflow: hidden;
        }
        .line div{
            float: left;
        }
        .line div:nth-of-type(1){
            width: 55%;
        }

        .line div:nth-of-type(2){
            width: 20%;
        }
        .line div:nth-of-type(3){
            width: 25%;
        }
    </style>

</head>
<body style="background-color:#fff;">

<script src="../../assets/js/LodopFuncs.js"></script>
<object  id="LODOP_OB" classid="clsid:2105C259-1E0C-4534-8141-A753534CB4CA" width=0 height=0>
    <embed id="LODOP_EM" type="application/x-print-lodop" width=0 height=0></embed>
</object>

<div id="print-wrap">
    
    <div class="print_container" style="display: none;" id="print_container">
        <h1>货单 <span id="mcode"></span></h1>
        <span>**************************</span>
        <div class="section1">
            <h3>单据类型：<span id="mtype"></span></h3>
        </div>
        <span>**************************</span>
        <div class="section2">
            <label>单据日期：<span id="createDate">2016-10-30</span></label>
        </div>
        <span>**************************</span>
        <div class="section3">
            <label>创建人：<span id="creator"></span></label>
        </div>
        <span>**************************</span>
        <div class="section4">
            <div style="border-bottom: 1px solid #DADADA;">

                <table style="width: 100%;">
                    <thead>
                    <tr>
                        <td width="50%">菜单名称</td>
                        <td width="25%">数量</td>
                        <td width="25%">金额</td>
                    </tr>
                    </thead>
                    <tbody id="items"></tbody>
                </table>

            </div>

            <div class="total">
                <label class="left">总计</label>
                <label class="right" id="total"></label>
                <div class="clearfix"></div>
            </div>
            <!--<div style="text-align: right;">
                <label>顾客已付款</label>
            </div>
            <span>**************************</span>-->
        </div>
        <!--<div class="section5">
            <label>姓名：小花</label>
            <label>地址：北京</label>
            <label>电话：67890</label>
        </div>
        <span>**************************</span>-->
    </div>
</div>

<script src="../../assets/js/fl.jquery.validate.min.js" type="text/javascript"></script> <!--表单校验插件-->
<script src="../../js/core/params.js"></script>
<script src="../../js/core/config.js"></script>
<script src="../../js/core/core.js"></script>
<script src="../../js/core/api.js"></script>
<script src="../../js/manifest/manifest2receipt.js"></script>

</body>
</html>
