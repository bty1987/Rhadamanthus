<div class="row">
    <div class="clearfix" id="resultList1"></div>
</div>

<ul class="flex-table">
    <li class="line table-title">
        <div class="line-wrap order">
            <div class="cell index"></div>
        </div>
        <div class="line-wrap content col11">
            <div class="cell">商品编号</div>
            <div class="cell">名称</div>
            <div class="cell">品类</div>
            <div class="cell">品牌</div>
            <div class="cell">单位</div>
            <div class="cell">数量</div>
            <div class="cell">件数</div>
            <div class="cell">送货数量</div>
            <div class="cell">原结算价</div>
            <div class="cell">结算价</div>
            <div class="cell">费用</div>
        </div>
    </li>
</ul>
<ul class="flex-table" id="list"></ul>

<div class="pull-right" style="margin-top: 15px;">
    <a class="btn btn-sm" id="submitBtn">确定</a>
    <a class="btn btn-sm" id="occessoriesCancelBtn">取消</a>
</div>

<div id="layerEdit" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal">

            <div class="widget-main">
                <div class="row" style="margin-right: 0px;">
                    <div class="col-md-11">
                        <div class="form-group">
                            <label class="col-md-4 control-label no-padding-right" for="content">说明</label>
                            <div class="col-md-8">
                                <textarea maxlength="128" id="content" class="col-xs-10 col-sm-8" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="space5"></div>
                        <div class="form-group">
                            <div class="col-md-offset-4 col-md-9">
                                <a class="btn btn-success btn-sm" id="saveContent">保存</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<div id="stockRecordPopUp" class="portlet box page-content"></div>

<!-- 费用查看弹窗 -->
<div id="chargeViewModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog" style="width: 700px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">外辅费用查看</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <table id="chargeViewTable" class="table table-striped table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th width="10%">序号</th>
                                    <th width="40%">费用名称</th>
                                    <th width="25%">价格（元）</th>
                                    <th width="15%">数量</th>
                                    <th width="10%">小计（元）</th>
                                </tr>
                            </thead>
                            <tbody id="chargeViewTableBody">
                                <!-- 费用列表动态生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row" style="margin-top: 10px;" id="chargeTotalRow">
                    <div class="col-xs-12 text-right">
                        <strong>费用合计：</strong>
                        <span id="chargeTotalAmount" class="red">0.00</span> 元
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-default" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/manifest/occessories4view.js']);
</script>
