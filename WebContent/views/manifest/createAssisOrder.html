<div>
    <div class="clearfix relative" id="form">

        <div class="stay-bottom">

            <button class="btn yellow" id="addSaleOrder" >添加一条辅料订单</button>

            <button id="submitSaleOrder" class="btn blue" data-loading-text="提交中..." type="submit"><i class="icon-ok"></i>保存</button>

        </div>

    </div>

    <ul class="flex-table">
        <li class="line table-title">
            <div class="line-wrap order">
                <div class="cell index"></div>
            </div>
            <div class="line-wrap content col8">
                <div class="cell">辅料项目</div>
                <div class="cell">品类</div>
                <div class="cell">品牌</div>
                <div class="cell">单位</div>
                <div class="cell">辅类</div>
                <div class="cell">工总</div>
                <div class="cell">价格</div>
                <div class="cell">数量</div>
            </div>
            <div class="line-wrap action">
                <div class="cell option">操作</div>
            </div>
        </li>
    </ul>

    <ul class="flex-table" id="list"></ul>

    <div style="margin-top: 15px;">


        <div class="inline-group">

            <label>备注</label>
            <div class="item long">
                <input type="text" id="comment">
            </div>
        </div>



        <div style="margin-top: 10px" class="col-sm-1 pull-right inline">
            <span>总价:</span><span id="totalSpan">0</span>
        </div>
    </div>




</div>


<script type="text/javascript">
    $.loadScript(['js/manifest/createAssisOrder.js']);
</script>
