<div>

    <div class="widget-box transparent">
        <div class="widget-header">
            <h4>添加规格</h4>
        </div>
    </div>

    <div id="addFormat">

        <ul class="flex-table" id="list">
            <li class="line current">
                <div class="line-wrap content col1">
                    <div class="cell name">
                        <input type="text" placeholder="名称" autocomplete="off" class="editable v_required" id="formatInfo">
                    </div>
                </div>
                <div class="line-wrap action">
                    <div class="cell option">
                        <a class="color-green green" style="font-size: 18px" id="addBtn"><i class="icon-ok"></i></a>
                        <a class="color-red red" style="font-size: 18px" id="delBtn"><i class=" icon-remove"></i></a>
                    </div>
                </div>
            </li>
        </ul>
    </div>
    
    <div class="widget-box transparent">
        <div class="widget-header">
            <h4>列表</h4>
        </div>
    </div>
    
    <div id="showFormat">
        <div class="clearfix" id="resultListFormat"></div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/manifest/format.js']);
</script>
