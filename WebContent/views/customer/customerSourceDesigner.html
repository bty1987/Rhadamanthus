<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div><!---c查询条件有就写没有 也写上 在js 里面不传参就行--->
            <div id="resultList" class="clearfix tab-pane action"></div><!-- c查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div><!--分页-->
        </div>
    </div>

    <div class="modal fade" id="sustomersourceDesigner" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="sustomersourceDesignerDialog"></h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="villageNoDesiger">楼盘信息</label>
                            <div class="col-sm-9">
                                <input type="text" class="col-sm-6 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="villageNoDesiger"  style="margin-right: 35px;"/>
                            </div>
                        </div>

                        <div class="form-group" id="houseNumberGroup">
                            <label for="houseNumber" class="col-sm-3 control-label no-padding-right">楼牌号</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6 v_required" id="houseNumber" maxlength="30">
                                <div class="col-md-12" style="padding: 0px;" >
                                    <span id="rule" class="red"></span>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">姓名</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6 v_required" maxlength="32" id="name" style="margin-right: 35px;">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">电话</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6 v_phone v_required" id="phone">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="salesman">业务员</label>
                            <div class="col-sm-9">
                                <input type="text" class="col-sm-6 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="salesman">
                            </div>
                        </div>

                        <div class="form-group" id="salesmanTypeGroup">
                            <label class="col-sm-3 control-label no-padding-right">业务员类型</label>
                            <div class="col-sm-9">
                                <select type="text" class="col-xs-6 m-wrap" id="salesmanType"></select>
                            </div>
                        </div>

                        <div class="form-group" id="houseTypeGroup">
                            <label class="col-sm-3 control-label no-padding-right">房屋类别</label>
                            <div class="col-sm-9">
                                <select type="text" class="col-xs-6 m-wrap" id="houseType">
                                    <option value="期房">期房</option>
                                    <option value="现房">现房</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="houseClass" class="col-sm-3 control-label no-padding-right">房屋类型</label>
                            <div class="col-sm-9">
                                <select class='col-sm-6 m-wrap' id='houseClass'></select>
                            </div>
                        </div>

                        <div class="form-group" id="orderTypeGroup">
                            <label for="orderType" class="col-sm-3 control-label no-padding-right">订单类型</label>
                            <div class="col-sm-9">
                                <select class='col-xs-6 m-wrap' id='orderType'></select>
                            </div>
                        </div>

                        <div class="form-group" id="resourceTypeGroup">
                            <label for="resourceType" class="col-sm-3 control-label no-padding-right">订单状态</label>
                            <div class="col-sm-9">
                                <select class='col-xs-6 m-wrap' id='resourceType'></select>
                            </div>
                        </div>

                        <div class="form-group"  id="approveManGroup">
                            <label for="approveMan" class="col-sm-3 control-label no-padding-right">审批人</label>
                            <div class="col-sm-9">
                                <div id="approveMan" class="col-xs-6 m-wrap"></div>
                            </div>
                        </div>

                        <div class="form-group" id="approveCommentGroup">
                            <label class="col-sm-3 control-label no-padding-right">审批备注</label>
                            <div class="col-sm-9">
                                <textarea id="approveComment" class=" m-wrap col-xs-6" maxlength="128" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="updateAndApprovalBtn" class="btn btn-primary" data-loading-text="提交中...">保存</button>
                    <button type="button" id="createSustomersourceCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/customer/customerSourceDesigner.js', 'js/utils/houseUtils.js']);
</script>
