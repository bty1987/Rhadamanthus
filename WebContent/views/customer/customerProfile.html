<div class="row">
    <div class="col-xs-12">
        <div id="profilecondList" class="fl_search clearfix"></div>
        <!-- 查询条件-->
        <div id="profileresultList" class="clearfix tab-pane active"></div>
        <!--查询结果-->
        <div id="profilepagenation" class="fl-page-wrap clearfix"></div>
        <!--分页-->
    </div>
</div>

<div class="modal fade" id="customerProfileModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" id="particulars">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">调研</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <div class="col-md-12">
                            <h3 class="blue center" id="name"></h3>
                            <p id="title" style="text-indent: 20px;"></p>
                        </div>
                    </div>
                    <div class="form-group" id="itemlist"></div>

                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="makeProfileModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">调研</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right" for="orderId">装修单号</label>
                        <div class="col-sm-8">
                            <input type="text" class="col-xs-8 m-wrap v_required" id="orderId"> <span class="required"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right" for="surveyTemplate">调研模板</label>
                        <div class="col-sm-8">
                            <input type="text" class="col-xs-8 m-wrap" maxlength="11" id="surveyTemplate"> <span class="required"></span>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveSurvey" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>
</div>
    

<div id="layerPopUp" class="portlet box page-content"></div>
