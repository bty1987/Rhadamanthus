<div id="customerUserRule">

    <div class="row" id="infolist" ></div>
    
    <hr>

    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <div id="resultList" class="clearfix tab-pane active"></div>
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
        </div>
    </div>

    <div class="modal fade" id="addCustomerUserRuleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="customerUserRuleDialog">人员规则</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="user">人员</label>
                            <div class="col-sm-9">
                                <input type="text" id="user" class="col-xs-10 col-sm-7 v_typeahead" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="period">周期</label>
                            <div class="col-sm-9">
                                <input type="text" id="period" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="measureNum">量尺数</label>
                            <div class="col-sm-9">
                                <input type="text" id="measureNum" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="contractNum">签单数</label>
                            <div class="col-sm-9">
                                <input type="text" id="contractNum" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="contractPrice">签单额</label>
                            <div class="col-sm-9">
                                <input type="text" id="contractPrice" class="col-xs-10 col-sm-7 v_required v_float_3" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="materialPrice">主材额</label>
                            <div class="col-sm-9">
                                <input type="text" id="materialPrice" class="col-xs-10 col-sm-7 v_required v_float_3" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="designPrice">设计费</label>
                            <div class="col-sm-9">
                                <input type="text" id="designPrice" class="col-xs-10 col-sm-7 v_required v_float_3" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/customer/customerUserRule.js']);
</script>
