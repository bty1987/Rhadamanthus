<div id="customerSource">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div><!---c查询条件有就写没有 也写上 在js 里面不传参就行--->
            <div id="resultList" class="clearfix tab-pane action"></div><!-- c查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div><!--分页-->
        </div>
    </div>

    <div class="modal fade" id="codeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content col-md-12">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" >客源二维码</h4>
                </div>
                <div class="modal-body">
                    <div class="qrcode" id="code" style="border: 0px;">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button"  class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="sustomersource" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="sustomersourceDialog">编辑客源</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal" id="from">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="villageNo">楼盘信息</label>
                            <div class="col-sm-9">
                                <input type="text" class="col-sm-6 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="villageNo"  style="margin-right: 35px;">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="houseNumber" class="col-sm-3 control-label no-padding-right">楼牌号</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6" id="houseNumber" maxlength="30">
                            </div>
                        </div>

                        <div class="form-group" id="buildAreaGroup">
                            <label class="col-sm-3 control-label no-padding-right" for="buildArea">建筑面积</label>
                            <div class="col-sm-9">
                                <input type="text" id="buildArea" maxlength="7" class="col-xs-6 col-sm-6 v_float_3 v_required" />
                                <span style = "margin-left: 10px; line-height: 34px">平</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="freeArea">赠送面积</label>
                            <div class="col-sm-9">
                                <input type="text" id="freeArea" maxlength="7" class="col-xs-6 col-sm-6 v_float_3 v_required" />
                                <span style = "margin-left: 10px; line-height: 34px">平</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="totalArea">总面积</label>
                            <div class="col-sm-9">
                                <input type="text" id="totalArea" maxlength="7" class="col-xs-6 col-sm-6 v_float_3 v_required"/>
                                <span style = "margin-left: 10px; line-height: 34px">平</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="innerArea">套内面积</label>
                            <div class="col-sm-9">
                                <input type="text" id="innerArea" maxlength="7" class="col-xs-6 col-sm-6 v_float_3 v_required" />
                                <span style = "margin-left: 10px; line-height: 34px">平</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">姓名</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6 v_required" maxlength="32" id="name" style="margin-right: 35px;">
                            </div>
                        </div>

                        <div class="form-group" id="genderGroup">
                            <label class="col-sm-3 control-label no-padding-right" for="gender">性别</label>
                            <div class="col-sm-9">
                                <input type="checkbox" id="gender" class="ace ace-switch ace-switch-5"/>
                                <span class="lbl gender"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">电话</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6 v_phone v_required" id="phone">
                            </div>
                        </div>

                        <div class="form-group" id="purposeGroup">
                            <label class="col-sm-3 control-label no-padding-right">目的</label>
                            <div class="col-sm-9">
                                <input type="text" class=" m-wrap col-xs-6" id="purpose">
                            </div>
                        </div>

                        <div class="form-group" id="intentionGroup">
                            <label class="col-sm-3 control-label no-padding-right">风格意向</label>
                            <div class="col-sm-9">
                                <input type="text" class=" m-wrap col-xs-6" id="intention">
                            </div>
                        </div>

                        <div class="form-group" id="priceGroup">
                            <label class="col-sm-3 control-label no-padding-right">预计装修价格</label>
                            <div class="col-sm-9">
                                <input type="text" class=" m-wrap col-xs-6 v_float_3 v_required" id="price">
                            </div>
                        </div>

                        <div class="form-group" id="gradeGroup">
                            <label class="col-sm-3 control-label no-padding-right">客户等级</label>
                            <div class="col-sm-9">
                                <select type="text" class="col-xs-6 m-wrap v_required" id="grade"></select>
                            </div>
                        </div>

                        <div class="form-group" id="commentGroup">
                            <label class="col-sm-3 control-label no-padding-right">备注</label>
                            <div class="col-sm-9">
                                <textarea id="comment" class=" m-wrap col-xs-6" maxlength="128" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="updateAndApprovalBtn" class="btn btn-primary" data-loading-text="提交中...">保存</button>
                    <button type="button" id="createSustomersourceCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="bindAllInfo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">绑定信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="villageNoBind">楼盘信息</label>
                            <div class="col-sm-9">
                                <input type="text" class="col-sm-8 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="villageNoBind"  style="margin-right: 35px;">
                            </div>
                        </div>

                        <div class="form-group hide">
                            <label for="houseNumberBind" class="col-sm-3 control-label no-padding-right">已绑楼牌号</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-8" id="houseNumberBind" maxlength="30" readonly="readonly">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="built" class="col-sm-3 control-label no-padding-right orange">楼牌号</label>
                            <div class="col-sm-9">
                                <input type="text" maxlength="7" class="v_required" style="width: 10%;"  id="built">
                                <select id="builtrule" style="padding: 0px;font-size: 1px; width: 10%!important; height: 25px; vertical-align: bottom"></select>
                                <input type="text" maxlength="3" class="v_required" style="float: none; width: 10%;"  id="unit">
                                <select  id="unitrule" style="padding: 0px;font-size: 1px; width: 10%!important; height: 25px; vertical-align: bottom"></select>
                                <input type="text" maxlength="3" class="v_required" style="float: none; width: 10%;" id="floor">
                                <select id="floorrule" style="padding: 0px;font-size: 1px; width: 10%!important; height: 25px; vertical-align: bottom"></select>
                                <input type="text" maxlength="3" class="v_required" style="float: none; width: 10%;"  id="door">
                                <select id="doorrule" style="padding: 0px;font-size: 1px; width: 10%!important; height: 25px; vertical-align: bottom"></select>
                                <span id="errMsg"></span>
                                <div class="col-md-12" style="padding: 0px;" >
                                    <span id="rule" class="red"></span>
                                </div>
                            </div>
                        </div>

                        <div class="form-group hide">
                            <label class="col-sm-3 control-label no-padding-right">户型</label>
                            <div class="col-sm-9">
                                <input type="text" class="v_required v_number" style="float: none; width: 10%;" id="houseTypeOne" /> 室
                                <input type="text" class="v_required v_number" style="float: none; width: 10%;" id="houseTypeTwo" /> 厅
                                <input type="text" class="v_required v_number" style="float: none; width: 10%;" id="houseTypeThr" /> 厨
                                <input type="text" class="v_required v_number" style="float: none; width: 10%;" id="houseTypeFour" /> 卫
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">姓名</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-8 v_required" maxlength="32" id="nameBind" style="margin-right: 35px;">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">电话</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-8 v_phone v_required" id="phoneBind">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="designer">设计师</label>
                            <div class="col-sm-9">
                                <input type="text" class="col-sm-8 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="designer">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="salesmanBind">业务员</label>
                            <div class="col-sm-9">
                                <input type="text" class="col-sm-8 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="salesmanBind">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="decorationBusitype" class="col-sm-3 control-label no-padding-right orange">业务类型</label>
                            <div class="col-sm-9">
                                <select class='col-sm-8 v_required' id='decorationBusitype'></select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="saveDesignerBtn" class="btn btn-primary" data-loading-text="提交中...">保存</button>
                    <button type="button" id="cancelDesignerBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="commitApprove" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="commitApproveDialog">提交审批</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="villageNoDesiger">楼盘信息</label>
                            <div class="col-sm-9">
                                <input type="text" class="col-sm-6 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="villageNoDesiger"  style="margin-right: 35px;"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="houseNumberApprove" class="col-sm-3 control-label no-padding-right">楼牌号</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6 v_required" id="houseNumberApprove" maxlength="30">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">姓名</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6 v_required" maxlength="32" id="nameApprove" style="margin-right: 35px;">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">电话</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6 v_phone v_required" id="phoneApprove">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="salesman">业务员</label>
                            <div class="col-sm-9">
                                <input type="text" class="col-sm-6 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="salesman">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">业务类型</label>
                            <div class="col-sm-9">
                                <select type="text" class="col-xs-6 m-wrap v_required" id="salesmanType"></select>
                            </div>
                        </div>

                        <div class="form-group" id="houseTypeGroup">
                            <label class="col-sm-3 control-label no-padding-right">房屋类别</label>
                            <div class="col-sm-9">
                                <select type="text" class="col-xs-6 m-wrap" id="houseType">
                                    <option value="期房">期房</option>
                                    <option value="现房">现房</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="houseClass" class="col-sm-3 control-label no-padding-right">房屋类型</label>
                            <div class="col-sm-9">
                                <select class='col-sm-6 m-wrap' id='houseClass'></select>
                            </div>
                        </div>

                        <div class="form-group" id="orderTypeGroup">
                            <label for="orderType" class="col-sm-3 control-label no-padding-right">订单类型</label>
                            <div class="col-sm-9">
                                <select class='col-xs-6 m-wrap' id='orderType'></select>
                            </div>
                        </div>

                        <div class="form-group" id="resourceTypeGroup">
                            <label for="resourceType" class="col-sm-3 control-label no-padding-right">订单状态</label>
                            <div class="col-sm-9">
                                <select class='col-xs-6 m-wrap' id='resourceType'></select>
                            </div>
                        </div>

                        <div class="form-group"  id="approveManGroup">
                            <label for="approveMan" class="col-sm-3 control-label no-padding-right">审批人</label>
                            <div class="col-sm-9">
                                <div id="approveMan" class="col-xs-6 m-wrap"></div>
                            </div>
                        </div>

                        <div class="form-group" id="approveCommentGroup">
                            <label class="col-sm-3 control-label no-padding-right">审批备注</label>
                            <div class="col-sm-9">
                                <textarea id="approveComment" class=" m-wrap col-xs-6" maxlength="128" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="approvalBtn" class="btn btn-primary" data-loading-text="提交中...">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--客源初审-->
    <div class="modal fade" id="commitFirstApprove" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="commitFirstApproveDialog">提交审批</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group"  id="firstApproveManGroup">
                            <label for="firstApproveMan" class="col-sm-3 control-label no-padding-right">审批人</label>
                            <div class="col-sm-9">
                                <div id="firstApproveMan" class="col-xs-6 m-wrap"></div>
                            </div>
                        </div>

                        <div class="form-group" id="firstApproveCommentGroup">
                            <label class="col-sm-3 control-label no-padding-right">审批备注</label>
                            <div class="col-sm-9">
                                <textarea id="firstApproveComment" class=" m-wrap col-xs-6" maxlength="128" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="firstApprovalBtn" class="btn btn-primary" data-loading-text="提交中...">保存</button>
                    <button type="button" id="firstCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!--查看信息弹窗-->
    <div id="customerRecordPopup" class="portlet box"></div>

    <!--编辑归属人-->
    <div class="modal fade" id="customersourceforbelonger" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="commitBelongerDialog">编辑归属人</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="belonger">归属人</label>
                            <div class="col-sm-9">
                                <input type="text" class="col-sm-6 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="belonger">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="belongerBtn" class="btn btn-primary" data-loading-text="提交中...">保存</button>
                    <button type="button"  class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/customer/customerSource.js', 'js/utils/houseUtils.js']);
</script>
