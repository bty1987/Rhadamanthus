<div id="customerSource">

    <div class="row" id="infolist"></div>
    
    <hr>
    
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div><!---c查询条件有就写没有 也写上 在js 里面不传参就行--->
            <div id="resultList" class="clearfix tab-pane action"></div><!-- c查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div><!--分页-->
        </div>
    </div>

    <!--创建资源-->
    <div class="modal fade" id="createsource" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="crstomersourceDialog">创建资源</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal" id="from1">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange">姓名</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6 v_required" maxlength="32" id="name" style="margin-right: 35px;">
                            </div>
                        </div>

                        <div class="form-group" >
                            <label class="col-sm-3 control-label no-padding-right orange" for="gender">性别</label>
                            <div class="col-sm-9">
                                <input type="checkbox" id="gender" class="ace ace-switch ace-switch-5"/>
                                <span class="lbl gender"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange">电话</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6 v_phone v_required" id="phone">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="purpose" class="col-sm-3 control-label no-padding-right">目的</label>
                            <div class="col-sm-9">
                                <input type="text" class="m-wrap col-xs-6" maxlength="32" id="purpose" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">意向</label>
                            <div class="col-sm-9">
                                <input type="text" class=" m-wrap col-xs-6" id="intention">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="price" class="col-sm-3 control-label no-padding-right">需求价格</label>
                            <div class="col-sm-9">
                                <input type="text" class=" m-wrap col-xs-6" maxlength="12" id="price"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">客户等级</label>
                            <div class="col-sm-9">
                                <select type="text" class="col-xs-6 m-wrap v_required" id="grade"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">楼盘名</label>
                            <div class="col-sm-9">
                                <input type="text" class=" m-wrap col-xs-6" id="villageName">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="built" class="col-sm-3 control-label no-padding-right orange">楼牌号</label>
                            <div class="col-sm-9">
                                <input type="text" maxlength="7" class="v_required" style="width: 10%;" id="built">
                                <select id="builtrule" style="padding: 0px;font-size: 1px; width: 10%!important; height: 25px; vertical-align: bottom"></select>
                                <input type="text" maxlength="3" class="v_required" style="float: none; width: 10%;" id="unit">
                                <select id="unitrule" style="padding: 0px;font-size: 1px; width: 10%!important; height: 25px; vertical-align: bottom"></select>
                                <input type="text" maxlength="3" class="v_required" style="float: none; width: 10%;" id="floor">
                                <select id="floorrule" style="padding: 0px;font-size: 1px; width: 10%!important; height: 25px; vertical-align: bottom"></select>
                                <input type="text" maxlength="3" class="v_required" style="float: none; width: 10%;" id="door">
                                <select id="doorrule" style="padding: 0px;font-size: 1px; width: 10%!important; height: 25px; vertical-align: bottom"></select>
                                <span id="errMsg"></span>
                                <div class="col-md-12" style="padding: 0px;">
                                    <span id="rule" class="red"></span>
                                </div>
                            </div>
                        </div>

                        <div class="form-group" id="buildAreaGroup1">
                            <label class="col-sm-3 control-label no-padding-right" for="buildArea">建筑面积</label>
                            <div class="col-sm-9">
                                <input type="text" id="buildArea" maxlength="7" class="col-xs-6 col-sm-6 v_float_3 v_required"/>
                                <span style="margin-left: 10px; line-height: 34px">平</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="freeArea">赠送面积</label>
                            <div class="col-sm-9">
                                <input type="text" id="freeArea" maxlength="7" class="col-xs-6 col-sm-6 v_float_3 v_required"/>
                                <span style="margin-left: 10px; line-height: 34px">平</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="totalArea">总面积</label>
                            <div class="col-sm-9">
                                <input type="text" id="totalArea" maxlength="7" class="col-xs-6 col-sm-6 v_float_3 v_required"/>
                                <span style="margin-left: 10px; line-height: 34px">平</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="innerArea">套内面积</label>
                            <div class="col-sm-9">
                                <input type="text" id="innerArea" maxlength="7" class="col-xs-6 col-sm-6 v_float_3 v_required"/>
                                <span style="margin-left: 10px; line-height: 34px">平</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">备注</label>
                            <div class="col-sm-9">
                                <textarea id="comment" class=" m-wrap col-xs-6" maxlength="128" rows="3"></textarea>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="issueCustomerChanceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="issueCustomer">分配</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                             <label class="col-sm-3 control-label no-padding-right orange" for="company">公司</label>
                             <div class="col-sm-9">
                                  <select class="col-xs-10 col-sm-6 v_required" id="company"></select>
                             </div>
                        </div>

                        <div class="form-group region">
                            <label class="col-sm-3 control-label no-padding-right orange">分区</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-6 v_required" id="region"></select>
                            </div>
                        </div>

                        <div class="form-group department">
                            <label for="department" class="col-sm-3 control-label no-padding-right orange">部门</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-6 v_required" id="department"></select>
                            </div>
                        </div>

                        <div class="form-group belonger">
                            <label class="col-sm-3 control-label no-padding-right orange">归属人</label>
                            <div class="col-sm-9">
                                <input type="text" class=" m-wrap col-xs-6" id="belonger">
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="issueBtn" class="btn btn-primary pull-right">确定</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    $.loadScript(['js/customer/customerSource.js', 'js/utils/houseUtils.js']);
</script>
