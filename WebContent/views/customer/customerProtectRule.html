<div id="customerProtectRule">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <div id="resultList" class="clearfix tab-pane active"></div>
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
        </div>
    </div>

    <div class="modal fade" id="addCustomerProtectRuleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="customerProtectRuleDialog">保护规则</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="title">标题</label>
                            <div class="col-sm-9">
                                <input type="text" id="title" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="type">类型</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-7" id="type" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group" id="uppvalDiv">
                            <label class="col-sm-3 control-label no-padding-right orange" for="uppval" data-i18n="page.customer.label.startValue">起始值</label>
                            <div class="col-sm-9">
                                <input type="text" id="uppval" class="col-xs-10 col-sm-7 v_required v_float" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group" id="lowvalDiv">
                            <label class="col-sm-3 control-label no-padding-right orange" for="lowval" data-i18n="page.customer.label.endValue">终止值</label>
                            <div class="col-sm-9">
                                <input type="text" id="lowval" class="col-xs-10 col-sm-7 v_required v_float" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group" id="dutyDiv">
                            <label class="col-sm-3 control-label no-padding-right" for="duty">岗位</label>
                            <div class="col-sm-9">
                                <select id="duty" class="col-xs-10 col-sm-7" data-placeholder="请选择岗位" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="days">天数</label>
                            <div class="col-sm-9">
                                <input type="text" id="days" class="col-xs-10 col-sm-7 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/customerPageUtils.js', 'js/customer/customerProtectRule.js']);
</script>
