<div>

	<div id="infolist" class="row"></div>
	
	<hr>

    <div class="row">
        
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <div id="resultList" class="clearfix tab-pane active"></div>
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
        </div>
    </div>
    
    <div class="modal fade" id="issueModal" tabindex="-1">
        <div class="modal-dialog"  >
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="customerChanceIssue">分配</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal">
                                <div class="col-md-12">

                                    <div class="form-group">
                                        <label for="region" class="col-sm-3 control-label no-padding-right orange">分区</label>
                                        <div class="col-sm-9">
                                            <select class="col-xs-10 col-sm-6 v_required" id="region"></select>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="department" class="col-sm-3 control-label no-padding-right orange">部门</label>
                                        <div class="col-sm-9">
                                            <select class="col-xs-10 col-sm-6 v_required" id="department"></select>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="belonger" class="col-sm-3 control-label no-padding-right orange">人员</label>
                                        <div class="col-sm-9">
                                            <input type="text" class="col-xs-10 col-sm-6 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger='manual' id="belonger" placeholder="请输入人员"/>

                                    </div>

                                    <div class="form-group">
                                        <label for="busitype" class="col-sm-3 control-label no-padding-right orange" >业务类型</label>
                                        <div class="col-sm-9">
                                            <select class="col-xs-10 col-sm-6 v_required" id="busitype"></select>
                                        </div>
                                    </div>

                                </div>
                            </form>
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>

            </div>
        </div>
    </div>
    
    <div class="modal fade" id="changeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="changeDialog">提交审批</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">房屋类别</label>
                            <div class="col-sm-9">
                                <select class="col-xs-6 m-wrap" id="houseType"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="houseClass" class="col-sm-3 control-label no-padding-right">房屋类型</label>
                            <div class="col-sm-9">
                                <select class='col-sm-6 m-wrap' id='houseClass'></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="orderType" class="col-sm-3 control-label no-padding-right">订单类型</label>
                            <div class="col-sm-9">
                                <select class='col-xs-6 m-wrap' id='orderType'></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="resourceType" class="col-sm-3 control-label no-padding-right">订单状态</label>
                            <div class="col-sm-9">
                                <select class='col-xs-6 m-wrap' id='resourceType'></select>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer" style="text-align: center">
                    <button type="button" id="changeBtn" class="btn btn-primary" data-loading-text="提交中...">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

</div>
