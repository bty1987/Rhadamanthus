<div>
    <div id="condList" class="fl_search clearfix"></div>
    <div id="resultList" class="clearfix tab-pane active"></div>
    <div id="pagenation" class="fl-page-wrap clearfix"></div>
</div>

<div class="modal fade" id="customerAfterSalesModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="width:900px;margin-left:-30%">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title">客户售后</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="customerAfterSalesForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="type">类型</label>
                                <div class="col-sm-8">
                                    <select id="type" class="col-xs-10 col-sm-8 v_required" data-rel="popover"></select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="priority">优先级</label>
                                <div class="col-sm-8">
                                    <select id="priority" class="col-xs-10 col-sm-8 v_required" data-rel="popover"></select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right" for="orderId">装修单号</label>
                                <div class="col-sm-8">
                                    <input type="text" id="orderId" class="col-xs-10 col-sm-8" maxlength="32" data-rel="popover" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right" for="csid">客源ID</label>
                                <div class="col-sm-8">
                                    <input type="text" id="csid" class="col-xs-10 col-sm-8 v_number" maxlength="11" data-rel="popover" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right" for="cid">客户ID</label>
                                <div class="col-sm-8">
                                    <input type="text" id="cid" class="col-xs-10 col-sm-8 v_number" maxlength="11" data-rel="popover" />
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="contactName">联系人</label>
                                <div class="col-sm-8">
                                    <input type="text" id="contactName" class="col-xs-10 col-sm-8 v_required" maxlength="64" data-rel="popover" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right orange" for="phone">电话</label>
                                <div class="col-sm-8">
                                    <input type="text" id="phone" class="col-xs-10 col-sm-8 v_phone" maxlength="32" data-rel="popover" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right" for="owner">负责人</label>
                                <div class="col-sm-8">
                                    <input type="text" id="owner" class="col-xs-10 col-sm-8" autocomplete="off" data-rel="popover" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label no-padding-right" for="did">责任部门ID</label>
                                <div class="col-sm-8">
                                    <input type="text" id="did" class="col-xs-10 col-sm-8 v_number" maxlength="11" data-rel="popover" />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right orange" for="content">问题描述</label>
                        <div class="col-sm-10">
                            <textarea id="content" class="col-xs-10 col-sm-10 v_required" rows="4" maxlength="512" data-rel="popover"></textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right" for="comment">备注</label>
                        <div class="col-sm-10">
                            <textarea id="comment" class="col-xs-10 col-sm-10" rows="3" maxlength="512" data-rel="popover"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="text-align:center">
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="operationModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="operationTitle">售后操作</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="operationForm">
                    <div class="form-group" id="operationOwnerGroup">
                        <label class="col-sm-3 control-label no-padding-right" for="operationOwner">负责人</label>
                        <div class="col-sm-9">
                            <input type="text" id="operationOwner" class="col-xs-10 col-sm-8" autocomplete="off" data-rel="popover" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="operationComment">说明</label>
                        <div class="col-sm-9">
                            <textarea id="operationComment" class="col-xs-10 col-sm-8" rows="4" maxlength="512" data-rel="popover"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="text-align:center">
                <button type="button" id="operationBtn" class="btn btn-primary">确定</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="refModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title">关联旧单</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="refForm">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="refType">引用类型</label>
                        <div class="col-sm-9">
                            <select id="refType" class="col-xs-10 col-sm-8 v_required" data-rel="popover"></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="refId">引用ID</label>
                        <div class="col-sm-9">
                            <input type="text" id="refId" class="col-xs-10 col-sm-8 v_required v_number" maxlength="11" data-rel="popover" />
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="text-align:center">
                <button type="button" id="refBtn" class="btn btn-primary">保存</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>
