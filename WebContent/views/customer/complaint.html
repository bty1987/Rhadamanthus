
<div >
    <div id="fl-statement"><div class="page-header"><h1>投诉单<small><i class="icon-double-angle-right"></i>投诉内容</small></h1></div></div>

    <div class="row">
        <div class="col-xs-12">
            <div class="row" style="margin-left:10px;margin-right:10px">
                <div id="complaintList"></div>
                <div>
                    <h3 class="clearfix" >
                        <a  class="btn btn-minier btn-primary pull-left icon-plus bigger-110" id="addComplaint" style="margin:0px 3px">添加</a>
                    </h3>
                </div>
            </div>
        </div>
    </div>

</div>


<div class="modal fade" id="addItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title" id="addModalLabel">添加投诉内容</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="addFrom">

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="type">类型</label>
                        <div class="col-md-9">
                            <select id='type' class='col-xs-10 col-sm-6'></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="deptName">部门</label>
                        <div class="col-sm-9">
                            <input type="text" id="deptName" maxlength="12" class="col-xs-10 col-sm-6 v_required"
                                   data-toggle="popover" data-trigger='manual' readonly >
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="staffName">姓名</label>
                        <div class="col-sm-9">
                            <input type="text" id="staffName" maxlength="12" class="col-xs-10 col-sm-6 v_required"
                                   data-toggle="popover" data-trigger='manual'  />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="brandName">品牌</label>
                        <div class="col-sm-9">
                            <input type="text" id="brandName" maxlength="12" class="col-xs-10 col-sm-6 v_required"
                                   data-toggle="popover" data-trigger='manual'  />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="content">内容</label>
                        <div class="col-sm-9">
                            <textarea id="content" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="addConfirmBtn" class="btn btn-primary" data-i18n="msg.confirm">确认</button>
                <button type="button" id="addCancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title" id="editModalLabel">跟踪</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="editFrom">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="comment">备注</label>
                        <div class="col-sm-9">
                            <input type="text" id="comment" maxlength="12" class="col-xs-10 col-sm-6 v_required"
                                   data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="editConfirmBtn" class="btn btn-primary" data-i18n="msg.confirm">确认</button>
                <button type="button" id="editCancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<div id = "layerSubmits" style="display: none; width: 500px; height: 300px" class="page-content">
    <div id="f-statement"><div class="page-header"><h1 data-i18n="page.customer.label.complaintContent">投诉内容<small><i class="icon-double-angle-right"></i>跟踪内容</small></h1></div></div>
    <div class="row" style="margin-left:10px;margin-right:10px">
        <div id="list"></div>
    </div>
 </div>
