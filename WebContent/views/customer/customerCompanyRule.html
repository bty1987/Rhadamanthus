<div class="row">
    <div class="col-xs-12">
        <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
        <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
        <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
    </div>
</div>

<div class="modal fade" id="customerCompanyRuleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myModalLabel">公司规则</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
   
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="customerCompanyRuleType">类型</label>
                        <div class="col-sm-9">
                            <select class="col-xs-10 col-sm-6 v_type v_required" id="customerCompanyRuleType"></select>
                        </div>
                    </div>
                    
                    <div class="space-4"></div>
                     <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="company">公司</label>
                         <div class="col-sm-9">
                              <select class="col-xs-10 col-sm-6 v_required" id="company"></select>
                         </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="deptTypeSel">部门类型</label>
                        <div class="col-sm-9">
                            <select class="col-sm-6 col-xs-10 v_required" id="deptTypeSel" data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="deptSel">部门</label>
                        <div class="col-sm-9">
                            <select class="col-sm-6 col-xs-10 v_required" id="deptSel" data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>
                                    
                    <div class="space-4"></div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="customerCompanyRuleUppval">起始值</label>
                        <div class="col-sm-9">
                            <input type="text" id="customerCompanyRuleUppval" maxlength="12" class="col-xs-10 col-sm-6 v_required v_float_3" data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>
                    
                    <div class="space-4"></div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="customerCompanyRuleLowval">终止值</label>
                        <div class="col-sm-9">
                            <input type="text" id="customerCompanyRuleLowval" maxlength="12" class="col-xs-10 col-sm-6 v_required v_float_3" data-toggle="popover" data-trigger='manual' />

                        </div>
                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/customerPageUtils.js', 'js/customer/customerCompanyRule.js']);
</script>
