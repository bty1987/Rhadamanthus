<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condListas" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultListas" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenationas" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
    <div class="modal fade" id="groupUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="myModalLabel" data-i18n="page.customer.label.groupPerson">群人员</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal" id="form">

                        <div class="form-group">
                            <label for="userSel" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.customer.label.groupPerson">群人员</label>
                            <div class="col-md-9">
                                <input type="text" class="col-md-4 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="userSel" placeholder="群人员" data-i18n-ph="page.customer.label.groupPerson">
                            </div>
                        </div>

                        <div class="space-4"></div>
                        <div class="form-group">
                            <label for="guType" class="col-sm-3 control-label no-padding-right">类型</label>
                            <div class="col-md-9">
                                <select class="col-md-2" id="guType">
                                    <option value="0">业务</option>
                                    <option value="1">装饰</option>
                                    <option value="2">服务</option>
                                    <option value="3">合同</option>
                                    <option value="4">销售</option>
                                    <option value="99" selected>其他</option>
                                </select>
                            </div>
                        </div>

                        <div class="space-4"></div>
                        <div class="form-group">
                            <label for="comment" class="col-sm-3 control-label no-padding-right">角色/说明</label>
                            <div class="col-md-9">
                                <input type="text" id="comment" maxlength="128" class="col-xs-10 col-sm-6" list="commentOptions" placeholder="角色或说明, 下拉为常用角色">
                                <datalist id="commentOptions"></datalist>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/customerPageUtils.js', 'js/customer/serviceTeam4user.js']);
</script>
