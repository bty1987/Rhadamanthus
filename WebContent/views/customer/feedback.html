<div class="row">
    <div class="col-xs-12">
        <div id="condList" class="fl_search clearfix"></div>
        <div id="resultList" class="clearfix tab-pane action"></div><!--查询的结果-->
        <div id="pagenation" class="fl-page-wrap clearfix"></div><!--分页-->
    </div>
</div>

<!--创建反馈-->
<div class="modal fade" id="creatFeedback" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="creatFeedbackDialog">反馈</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="from">

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange">装修单号</label>
                        <div class="col-sm-9">
                            <input type="text" class="m-wrap col-xs-6 v_required" maxlength="32" id="orderId" style="margin-right: 35px;">
                        </div>
                    </div>

                    <div class="form-group" >
                        <label class="col-sm-3 control-label no-padding-right orange" for="phone">电话</label>
                        <div class="col-sm-9">
                            <input type="text" class="col-xs-10 col-sm-6 v_phone" maxlength="32" id="phone" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right"for="feedbackType">类型</label>
                        <div class="col-sm-9">
                            <select id="feedbackType" class="col-xs-10 col-sm-6 v_required"data-toggle="popover" style="min-width: 50%; width: 180px;"data-trigger='manual'></select>
                        </div>
                    </div>

                    <div class="form-group content">
                        <label for="contact" class="col-sm-3 control-label no-padding-right orange">说明</label>
                        <div class="col-sm-9">
                            <textarea id="content" class=" col-xs-10 col-sm-6 v_required" maxlength="128" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="feedbackDrawingModal" tabindex="-1">
    <div class="modal-dialog" style="width:60%">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">客户反馈图片</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="row-fluid">
                            <ul class="ace-thumbnails" id="feedbackDrawing"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="feedBackRecordPopUp" class="portlet box"></div>

<script type="text/javascript">
    $.loadScript(['js/customer/feedback.js'])
</script>
