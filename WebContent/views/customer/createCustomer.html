<div id="addcustomersource" class="page-content">
    <div id="fl-statement">
        <div class="page-header"></div>
    </div>

<div class="row">
    <div class="col-xs-12">
        <form class="form-horizontal">
            <div class="row" style="padding-top: 10px; ">
                <div class="col-md-12">

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="customerId">客户姓名</label>
                        <div class="col-sm-5">
                            <select class="chosen-select col-md-3 v_required" id="customerId" data-placeholder="请输入客户" data-toggle="popover">
                                <option value="">&nbsp;</option>
                            </select> <i class='icon-asterisk'></i>
                            <button type="button" id="customer" class="btn btn-xs btn-info">创建客户</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone" class="col-sm-3 control-label no-padding-right">电话</label>
                        <div class="col-sm-7">
                            <input type="text" class="col-xs-10 col-sm-4 v_required v_phone"  maxlength="11" id="phone">
                            <i class="icon-asterisk"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="purpose" class="col-sm-3 control-label no-padding-right">目的</label>
                        <div class="col-sm-7">
                            <input type="text" class="col-xs-10 col-sm-4 " maxlength="32" id="purpose" placeholder="如:婚房">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="intention" class="col-sm-3 control-label no-padding-right">意向</label>
                        <div class="col-sm-7">
                            <input type="text" class="col-xs-10 col-sm-4 v_required" maxlength="32" id="intention" placeholder="如:铁西广场附近"/>
                            <i class="icon-asterisk"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="price" class="col-sm-3 control-label no-padding-right">需求价格</label>
                        <div class="col-sm-7">
                            <input type="text" class="col-xs-10 col-sm-4 v_required v_price" maxlength="12" id="price"/>
                            <i class="icon-asterisk"></i>
                        </div>
                    </div>


                    <div class="form-group">
                        <label for="grade" class="col-sm-3 control-label no-padding-right">客户等级</label>
                        <div class="col-sm-7">
                            <select class='col-xs-10 col-sm-4' id='grade' ></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="userId" class="col-sm-3 control-label no-padding-right">归属人</label>
                        <div class="col-sm-5">
                            <select class="chosen-select col-md-4 " id="userId" data-placeholder="请输归属人" data-toggle="popover">
                                <option value="">&nbsp;</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="comment" class="col-sm-3 control-label no-padding-right">备注</label>
                        <div class="col-sm-7">
                            <input type="text" class="col-xs-10 col-sm-4 " maxlength="64" id="comment"/>
                        </div>
                    </div>

                    <div class="modal-footer" style="text-align: center;margin-left: -240px ">
                        <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                        <button type="button" id="cancelBtn" class="btn btn-default" >重置</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

    <div class="modal fade" id="customerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="customerDialog">客户</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="customerName">姓名</label>
                            <div class="col-sm-9">
                                <input type="text" id="customerName" maxlength="32" class="col-xs-10 col-sm-6 v_required v_name" data-toggle="popover" /><span class='star'></span>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="gender">性别</label>
                            <div class="col-sm-9">
                                <input type="checkbox" id="gender" />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="phones">联系方式</label>
                            <div class="col-sm-9">
                                <input type="text" id="phones" maxlength="64" class="col-xs-10 col-sm-6 v_required v_phones2" data-toggle="popover" />
                                <span class='star'></span>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="cardType">证件类型</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-6 v_required" id="cardType"></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="cardNum">证件号</label>
                            <div class="col-sm-9">
                                <input type="text" id="cardNum" maxlength="18" class="col-xs-10 col-sm-6 v_card" data-toggle="popover" />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="qq">QQ</label>
                            <div class="col-sm-9">
                                <input type="text" id="qq" maxlength="15" class="col-xs-10 col-sm-6 v_number" data-toggle="popover" />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="wechat">微信</label>
                            <div class="col-sm-9">
                                <input type="text" id="wechat" maxlength="15" class="col-xs-10 col-sm-6 v_name_en" data-toggle="popover" />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="email">邮箱</label>
                            <div class="col-sm-9">
                                <input type="text" id="email" maxlength="32" class="col-xs-10 col-sm-6 v_email" data-toggle="popover" />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="relationshipType">客户类型</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-6 v_required" id="relationshipType"></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="address">通讯地址</label>
                            <div class="col-sm-9">
                                <textarea id="address" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="createCustomerSaveBtn" class="btn btn-primary" data-loading-text="提交中...">保存</button>
                    <button type="button" id="createCustomerCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>



<script type="text/javascript">
    $.loadScript(['js/customer/createCustomer.js'])
</script>
