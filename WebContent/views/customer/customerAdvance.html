<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div><!---c查询条件有就写没有 也写上 在js 里面不传参就行--->
            <div id="resultList" class="clearfix tab-pane action"></div><!-- c查询结果-->

<div id="sustomersource" style="padding: 40px 0; display: none">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="form1">
            <div class="widget-main">
                <div class="row" style="margin-right: 0px">
                    <div class="col-xs-12">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">电话</label>
                            <div class="col-sm-8">
                                <input type="text" class=" m-wrap col-xs-8 v_required v_phone" id="Phone">
                            </div>
                        </div>

                        <div class="space5"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">目的</label>
                            <div class="col-sm-8">
                                <input type="text" class=" m-wrap col-xs-8" id="purpose">
                            </div>
                        </div>


                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">意向</label>
                            <div class="col-sm-8">
                                <input type="text" class=" m-wrap col-xs-8 v_required" id="intention">
                            </div>
                        </div>


                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">需求价格</label>
                            <div class="col-sm-8">
                                <input type="text" class=" m-wrap col-xs-8 v_required v_float_3" id="price">
                            </div>
                        </div>


                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">客户等级</label>
                            <div class="col-sm-8">
                                <select type="text" class="col-xs-8 m-wrap" id="grade">
                                </select>
                            </div>
                        </div>


                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right">备注</label>
                            <div class="col-sm-8">
                                <input type="text" class=" m-wrap col-xs-8 " id="comment">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

                        </div>
                    </div>
                </div>
            </div>
        </form>

</div>
