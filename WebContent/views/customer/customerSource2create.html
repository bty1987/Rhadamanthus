<div id="addcustomersource">
    <div id="fl-statement">
        <div class="page-header"></div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <form class="form-horizontal" id="form">
                <div class="widget-box no-border">
                    <div class="widget-body">
                        <div class="widget-main" style="padding: 20px 40px;">
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label no-padding-right orange" for="name">客户姓名</label>
                                        <div class="col-sm-7">
                                            <input type="text" class="col-xs-10 col-sm-7 v_required"  maxlength="32" id="name">
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-4 control-label no-padding-right orange" for="gender">性别</label>
                                        <div class="col-sm-7">
                                            <input type="checkbox" id="gender" class="ace ace-switch ace-switch-5"/>
                                            <span class="lbl gender"></span>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="phone" class="col-sm-4 control-label no-padding-right orange">电话</label>
                                        <div class="col-sm-7">
                                            <input type="text" class="col-xs-10 col-sm-7 v_phone v_required"  maxlength="11" id="phone">
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="designer" class="col-sm-4 control-label no-padding-right orange">设计师</label>
                                        <div class="col-sm-7">
                                            <input type="text" class="col-sm-7 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="designer" />
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="salesman" class="col-sm-4 control-label no-padding-right orange">业务员</label>
                                        <div class="col-sm-7">
                                            <input type="text" class="col-sm-7 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="salesman" />
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="decorationBusitype" class="col-sm-4 control-label no-padding-right orange">业务类型</label>
                                        <div class="col-sm-7">
                                            <select class='col-xs-10 col-sm-7' id='decorationBusitype'></select>
                                        </div>
                                    </div>

                                    <div class="form-group hide">
                                        <label for="purpose" class="col-sm-4 control-label no-padding-right">目的</label>
                                        <div class="col-sm-7">
                                            <input type="text" class="col-xs-10 col-sm-7" maxlength="32" id="purpose" />
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="intention" class="col-sm-4 control-label no-padding-right">风格意向</label>
                                        <div class="col-sm-7">
                                            <input type="text" class="col-xs-10 col-sm-7" maxlength="32" id="intention" />
                                        </div>
                                    </div>

                                    <div class="form-group hide">
                                        <label for="price" class="col-sm-4 control-label no-padding-right orange">预计装修价格</label>
                                        <div class="col-sm-7">
                                            <input type="text" class="col-xs-10 col-sm-7 v_float_3 v_required" maxlength="12" id="price"/>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="grade" class="col-sm-4 control-label no-padding-right">客户等级</label>
                                        <div class="col-sm-7">
                                            <select class='col-xs-10 col-sm-7' id='grade' ></select>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="villageNoCreate" class="col-sm-4 control-label no-padding-right orange">楼盘名</label>
                                        <div class="col-sm-7">
                                            <input type="text" class="col-sm-7 v_typeahead" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="villageNoCreate" />
                                        </div>
                                    </div>

                                    <div class="form-group hide">
                                        <label for="houseNumber" class="col-sm-4 control-label no-padding-right orange">楼牌号</label>
                                        <div class="col-sm-7">
                                            <input type="text" class="col-xs-10 col-sm-7 v_required" id="houseNumber" maxlength="30">
                                            <div class="col-md-12" style="padding: 0px;" >
                                                <span id="rule" class="red"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-4 control-label no-padding-right" for="buildArea">建筑面积</label>
                                        <div class="col-sm-8">
                                            <input type="text" id="buildArea" maxlength="7" class="col-xs-10 col-sm-2 v_float" />
                                            <span style = "margin-left: 10px; line-height: 34px">平</span>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-4 control-label no-padding-right" for="freeArea">赠送面积</label>
                                        <div class="col-sm-8">
                                            <input type="text" id="freeArea" maxlength="7" class="col-xs-10 col-sm-2 v_float" />
                                            <span style = "margin-left: 10px; line-height: 34px">平</span>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-4 control-label no-padding-right" for="totalArea">总面积</label>
                                        <div class="col-sm-8">
                                            <input type="text" id="totalArea" maxlength="7" class="col-xs-10 col-sm-2 v_float" readonly="readonly" />
                                            <span style = "margin-left: 10px; line-height: 34px">平</span>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-4 control-label no-padding-right" for="innerArea">套内面积</label>
                                        <div class="col-sm-8">
                                            <input type="text" id="innerArea" maxlength="7" class="col-xs-10 col-sm-2 v_float_3" />
                                            <span style = "margin-left: 10px; line-height: 34px">平</span>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="comment" class="col-sm-4 control-label no-padding-right">备注</label>
                                        <div class="col-sm-7">
                                            <textarea class="col-xs-10 col-sm-7" maxlength="64" id="comment" rows="4"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="no-border widget-toolbox padding-8 clearfix span7 text-center" style="margin-top: 20px;">
                                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                                <button type="button" id="cancelBtn" class="btn btn-default" >重置</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>

<script type="text/javascript">
    $.loadScript(['js/customer/customerSource2create.js','js/utils/houseUtils.js'])
</script>
