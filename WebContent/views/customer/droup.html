<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->

        </div>
    </div>

    <div class="modal fade" id="droupModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">钉群</h4>
                </div>
                <div class="form-group" id="searchers"></div>

                <div class="modal-body">
                    <div class="form-group" id="itemlist"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="bindModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">钉群绑定</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label for="orderId" class="col-md-3 control-label no-padding-right orange">装修单号</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_positiveInteger v_required" maxlength="11"
                                       id="orderId">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="name">名称</label>
                            <div class="col-sm-8">
                                <input type="text" id="name" maxlength="32"
                                       class="col-xs-8 m-wrap v_positiveInteger v_required"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="chatId">群ID</label>
                            <div class="col-sm-8">
                                <input type="text" id="chatId" maxlength="32"
                                       class="col-xs-8 m-wrap v_positiveInteger v_required"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="type" class="col-md-3 control-label no-padding-right orange">类型</label>
                            <div class="col-sm-8">
                                <select class="col-xs-8 m-wrap v_required" id="type"></select>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">添加群人员</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label for="user" class="col-sm-3 control-label no-padding-right" data-i18n="page.customer.label.person">人员</label>
                            <div class="col-md-9">
                                <input type="text" class="col-xs-10 col-sm-6" id="user"/>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveUser" class="btn btn-primary" data-i18n="msg.save">保存</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/customerPageUtils.js', 'js/customer/droup.js']);
</script>

<style>
    .text {
        width: 290px;
        word-wrap: break-word;
        text-align: left;
        margin-left: 1px
    }

    .dialogs {
        justify-content: flex-start;
        flex-direction: column-reverse;
    }
</style>
