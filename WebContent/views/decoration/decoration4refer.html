<div class="row">
    <div class="col-xs-12">
        <div id="referCondLists" class="fl_search clearfix"></div>
        <div id="referResultLists" class="clearfix tab-pane active"></div>
        <div id="referPagenations" class="fl-page-wrap clearfix"></div>
    </div>
</div>

<div class="modal fade" id="addReferDecorationModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="villageDialog">补录推荐</h4>
            </div>

            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal">
                            <div class="form-group referCustomerInfo">
                                <label class="col-sm-3 control-label no-padding-right">推荐装修单号</label>
                                <div class="col-sm-9">
                                    <input type="text" class="m-wrap col-xs-6" id="referOrderId">
                                </div>
                            </div>

                            <div class="form-group referCustomerInfo">
                                <label class="col-sm-3 control-label no-padding-right">推荐手机号</label>
                                <div class="col-sm-9">
                                    <input type="text" class="m-wrap col-xs-6" id="referPhone">
                                </div>
                            </div>

                            <div class="form-group referCustomerInfo">
                                <label class="col-sm-3 control-label no-padding-right">推荐楼盘</label>
                                <div class="col-sm-9">
                                    <input type="text" class="m-wrap col-xs-6" id="referVillage">
                                </div>
                            </div>

                            <div class="form-group referCustomerInfo">
                                <label class="col-sm-3 control-label no-padding-right">推荐楼号</label>
                                <div class="col-sm-9">
                                    <input type="text" class="m-wrap col-xs-6" id="referHouseNumber">
                                </div>
                            </div>

                            <div class="form-group referCustomerInfo">
                                <label class="col-sm-3 control-label no-padding-right">推荐签单时间</label>
                                <div class="col-sm-9">
                                    <input type="text" class="m-wrap col-xs-6" id="referContractTime"
                                        readonly="readonly">
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="submitBtn" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>
</div>

    $.loadScript(['js/decoration/decoration4refer.js']);
