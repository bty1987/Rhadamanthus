<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="applyModal" tabindex="-1">
		<div class="modal-dialog" style="width:800px;">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="measureApplyDialog" data-i18n="page.decoration.title.deploy">部署信息</h4>
				</div>
				<div class="modal-body">
					<div id="calendar"></div>
				</div>
			</div>
		</div>
	</div>
	
    <div class="modal fade" id="updateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="measureDialog" data-i18n="page.decoration.title.measureConfirm">量尺确认信息</h4>
                </div>
                
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="applayTime" data-i18n="page.decoration.label.measureDate">量尺日期</label>
                            <div class="col-sm-9">
                                <input class=" date-picker-date col-xs-10 col-sm-5 v_required" id="applayTime" type="text" readonly="readonly" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                    </form>
                </div>
                
                <div class="modal-footer">
                    <button type="button" id="updateBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
	
	<div class="modal fade" id="editModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="measureDialog" data-i18n="page.decoration.title.measureConfirm">量尺确认信息</h4>
				</div>
				
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="actualDate" data-i18n="page.decoration.label.measureDate">量尺日期</label>
							<div class="col-sm-9">
								<input type="text" class="hide" id=dlid />
								<input class=" date-picker-date col-xs-10 col-sm-5 v_required" id="actualDate" type="text" readonly="readonly" data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
					
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="startTime" data-i18n="page.decoration.label.startTime">开始时间</label>
							<div class="col-sm-9">
								<div class="bootstrap-timepicker">
									<input id="startTime" type="text" class="timepicker v_required col-xs-10 col-sm-5"/>
								</div>
							</div>
						</div>
					
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="endTime" data-i18n="page.decoration.label.endTime">结束时间</label>
							<div class="col-sm-9">
								<div class="bootstrap-timepicker">
									<input id="endTime" type="text" class="timepicker v_required col-xs-10 col-sm-5"/>
								</div>
							</div>
						</div>
						
					</form>
				</div>
				
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="constructionInfoModal" tabindex="-1" >
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel" data-i18n="page.decoration.title.engineering">工程信息</h4>
				</div>
				<div class="modal-body" >
					<form class="form-horizontal">

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.timeLimit">工期</label>
							<div class="col-sm-9">
								<input type="text" id='timeLimit' class='col-xs-10 col-sm-6 v_number' />
							</div>
						</div>
						<div class="form-group">

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right " data-i18n="page.decoration.label.shovel">铲大白</label>
								<div class="col-md-9">
									<select id='ishovel' class='col-xs-10 col-sm-6'></select>
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right " data-i18n="page.decoration.label.key">钥匙</label>
								<div class="col-sm-9">
									<select id='iskey' class='col-xs-10 col-sm-6'></select>
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right " data-i18n="page.decoration.label.ceremony">开工仪式</label>
								<div class="col-sm-9">
									<select id='isCeremony' class='col-xs-10 col-sm-6'></select>
								</div>
							</div>
							<div class="space-4"></div>
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right">预计量尺时间</label>
								<div class="col-sm-9">
									<input type="text" id='measureTime' class='col-xs-10 col-sm-6' />
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.expectFinish">预计完工时间</label>
								<div class="col-sm-9">
									<input type="text" id='finishTime' class='col-xs-10 col-sm-6' />
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.expectKey">预计领钥匙时间</label>
								<div class="col-sm-9">
									<input type="text" id='keyTime' class='col-xs-10 col-sm-6' />
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.expectDesign">预计设计完成时间</label>
								<div class="col-sm-9">
									<input type="text" id='designTime' class='col-xs-10 col-sm-6' />
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.comment">备注说明</label>
								<div class="col-md-9">
									<textarea id="comment" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
								</div>
							</div>
							<div class="space-4"></div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveInfoBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="canceInfoBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>

</div>

<script type="text/javascript">
	$.loadScript(['js/decoration/decorationMeasure4setup.js']);
</script>
