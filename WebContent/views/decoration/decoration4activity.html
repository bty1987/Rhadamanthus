<div id="decorationActivityItemPageContent">

<!--参加活动-->
<div class="modal fade" id="joinDecorationActivityModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                    <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="activityDialog">参加活动</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label for="activity" class="col-sm-3 control-label no-padding-right">活动</label>
                        <div class="col-sm-9">
                            <select class='col-xs-10 col-sm-5 v_required' id='activityInfo' data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="submitDecorationActivityBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<!--申领活动物品-->
<div class="modal fade" id="applyDecorationActivityItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">

                    <span class="sr-only">Close</span>

            </div>

            <div class="modal-body">

                    <div class="form-group">
                        <label for="activity" class="col-sm-3 control-label no-padding-right">活动</label>
                        <div class="col-sm-9">
                            <select class='col-xs-10 col-sm-5 v_required' id='activity' data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-9">

                        <div class="col-sm-12">
                            <label for="things" class="col-sm-3 control-label">物品</label>

                                <button type="button" id="thingsAdd" class="btn btn-info btn-minier" style="width: 50px; line-height: 30px">添加</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-9">
                            <ul id="coupons" class="item-list list-inline"></ul>
                        </div>

                        <div class="col-sm-12">
                            <label for="coupons" class="col-sm-3 control-label">券</label>

                                <input type="text" id="couponsVal" class="col-xs-10 col-sm-4 v_float_3 v_required" placeholder="请输入劵数量" style="margin: 0 10px"> <select class='col-xs-10 col-sm-5 v_required' id='receiveTypes' data-trigger="manual" style="margin: 2px 0"></select>
                                <button type="button" id="couponsAdd" class="btn btn-info btn-minier" style="width: 50px; line-height: 30px">添加</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-9">
                            <ul id="papers" class="item-list list-inline"></ul>
                        </div>

                        <div class="col-sm-12">
                            <label for="papers" class="col-sm-3 control-label">红包</label>
                            <div class="col-sm-9" style="padding-left: 6px;" id="papersInputs">
                                <input type="text" id="papersType" class="col-xs-10 col-sm-5 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" placeholder="请选择劵" /> <input type="text" id="papersVal" class="col-xs-10 col-sm-4 v_float_3 v_required" placeholder="请输入劵数量" style="margin: 0 10px"> <select class='col-xs-10 col-sm-5 v_required' id='receiveTypess' data-trigger="manual" style="margin: 2px 0"></select>
                                <button type="button" id="papersAdd" class="btn btn-info btn-minier" style="width: 50px; line-height: 30px">添加</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="approveActivityItemManSel" class="col-sm-3 control-label no-padding-right">审批人</label>
                        <div class="col-sm-9">
                            <div id="approveActivityItemManSel" class="col-xs-10 col-sm-6 "></div>
                        </div>
                    </div>
                    <div class="space-4"></div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="submitDecorationActivityItemBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addDecorationActivityItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
