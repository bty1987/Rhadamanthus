<div class="row">
	<div class="col-xs-12 col-sm-11">
		<div class="timeline-container">
			<div class="timeline-label clearfix">
				<span class="label label-primary arrowed-in-right label-lg col-xs-2" id="add">
					<i class="icon-plus bigger-110"></i>
					<b>添加</b>
				</span>
			</div>
			<div class="timeline-items" id="backVisitList"></div>
		</div>
	</div>
</div>
<div class="text-right">
	<div class="hr"></div>
	<button class="btn btn-info" type="button" id="btnBack">
		<i class="icon-mail-forward bigger-110"></i>
		返回
	</button>
</div>
<div class="modal fade" id="backVisitModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span>&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="backVisitDialog">订单</h4>
			</div>

			<div class="modal-body">
				<form class="form-horizontal">
					<div>
						<label for="backVisitContent" data-i18n="page.decoration.label.content">内容</label>
						<div>
							<textarea id="backVisitContent" class="form-control v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="128"></textarea>
						</div>
					</div>
					<div>
						<label for="form-field-tags">提醒人员</label>
						<div>
							<input type="text" class="form-control" name="tags" id="form-field-tags" placeholder="请输入人名 ..." data-i18n-ph="page.decoration.ph.personName" />
						</div>
					</div>
				</form>
			</div>

			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/decoration/decorationBackVisit.js']);
</script>
