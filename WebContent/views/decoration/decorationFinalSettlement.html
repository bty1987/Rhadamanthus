
<div id="decorationFinalSettlementPageContent" class="page-content">
    <div class="row">
        <div class="col-xs-12">

            <div class="row-fluid">
                <div class="span12">
                    <div class="widget-box no-border">

                        <div class="widget-body">
                            <div class="widget-main">
                                <div id="fuelux-wizard" class="row-fluid" data-target="#step-container">
                                    <ul class="wizard-steps">

                                        <li data-target="#step1" class="complete">
                                            <span class="step">1</span>
                                            <span class="title">报价信息</span></li>

                                        <li data-target="#step2" class="complete">
                                            <span class="step">2</span>
                                            <span class="title">主材信息</span></li>

                                        <li data-target="#step3" class="complete">
                                            <span class="step">3</span>
                                            <span class="title">决算信息</span></li>


                                    </ul>
                                </div>

                                <hr/>
                                <div class="step-content row-fluid position-relative" id="step-container">

                                    <div class="step-pane active" id="step1">
                                        <div class="row">
                                            <div class="col-md-8">
                                                <div class="form-group">
                                                    <label class="col-md-2 control-label no-padding-right "
                                                           for="showWay">显示方式：</label>
                                                    <div class="col-md-6">
                                                        <select class="col-md-6" id="showWay">
                                                            <option value="0">功能区分组</option>
                                                            <option value="1">工种分组</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="col-md-12 space-6"></div>
                                            <div class="col-md-12" id="quotationItemListDiv">
                                                <div class="flloading" style="height: 100px"></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="step-pane active" id="step2">
                                        <div class="row">
                                            <div class="col-xs-6 col-md-6 widget-container-span ui-sortable " >
                                                <div class="tabbable">
                                                    <ul class="nav nav-tabs" id="myTab" style="margin-top: 7px;">
                                                        <li class="active">
                                                            <a data-toggle="tab" href="#fanglinMaterialPayment" style="color: #4383b4">
                                                                <strong>主材款项</strong>
                                                            </a>
                                                        </li>

                                                        <li>
                                                            <a data-toggle="tab" href="#salesMaterialPayment" style="color: #4383b4">
                                                                <strong>销售款项</strong>
                                                            </a>
                                                        </li>

                                                    </ul>

                                                    <div class="tab-content">
                                                        <div id="fanglinMaterialPayment" class="tab-pane in active" style="margin-left: -12px;">

                                                        </div>

                                                        <div id="salesMaterialPayment" class="tab-pane" style="margin-left: -12px;">

                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-xs-6 col-md-6 widget-container-span ui-sortable">
                                                <div class="widget-box transparent">
                                                    <div class="widget-header">
                                                        <h5>
                                                            <strong>品牌汇总</strong>
                                                        </h5>
                                                    </div>
                                                    <div class="widget-body">
                                                        <div class="widget-body-inner" id="materialPaymentBrand"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="step-pane active" id="step3">

                                    </div>

                                </div>

                                <hr/>
                                <div class="row-fluid wizard-actions">

                                    <button id="btnBack" class="btn btn-info" type="button">
                                        <i class="icon-mail-forward "></i>返回
                                    </button>
                                    <button class="btn btn-prev">
                                        <i class="icon-arrow-left"></i> 上一步
                                    </button>

                                    <button class="btn btn-success btn-next" data-last="完成">
                                        下一步 <i class="icon-arrow-right icon-on-right"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="applyDecorationAccount" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">生成决算信息</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label for="maching" class="col-sm-3 control-label no-padding-right">主材配比</label>
                            <div class="col-sm-9">
                                <input type="text" id="maching" maxlength="15" class="col-xs-10 col-sm-8 v_required v_float" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label for="discount" class="col-sm-3 control-label no-padding-right">折扣</label>
                            <div class="col-sm-9">
                                <input type="text" id="discount" maxlength="15" class="col-xs-10 col-sm-8 v_required v_float" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label for="projectPrice" class="col-sm-3 control-label no-padding-right">工程总额</label>
                            <div class="col-sm-9">
                                <input type="text" id="projectPrice" maxlength="15" class="col-xs-10 col-sm-8 v_required v_amount" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label for="serviceRate" class="col-sm-3 control-label no-padding-right">服务费配比</label>
                            <div class="col-sm-9">
                                <input type="text" id="serviceRate" maxlength="15" class="col-xs-10 col-sm-8 v_required v_discount" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="submitDecorationAccountBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/decorationUtils.js','js/utils/quotationUtils.js','js/utils/materialUtils.js','js/decoration/decorationFinalSettlement.js']);
