<div id="decorationPageContent">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
</div>

<div id="layerPopUp" class="portlet box page-content"></div>

<!-- 移交配置 modal(单条/批量共用) -->
<div class="modal fade" id="belongTranConfigModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">归属移交配置</h4>
            </div>
            <div class="modal-body">
                <div id="belongTranScopeInfo" class="well well-sm" style="font-size:12px"></div>
                <div class="panel panel-default no-margin-bottom">
                    <div class="panel-heading"><b>设计归属</b></div>
                    <div class="panel-body">
                        <div id="belongTranDesignCurrent" class="help-block" style="font-size:12px;margin:0 0 8px"></div>
                        <div class="form-group">
                            <label>接手设计师(限在职, 留空则不变更)</label>
                            <input type="text" id="belongTranDesignUserInput" class="form-control" autocomplete="off"/>
                        </div>
                        <div class="row">
                            <div class="col-xs-4 form-group"><label>姓名</label><input type="text" id="belongTranDesignUserName" class="form-control" readonly="readonly"/></div>
                            <div class="col-xs-4 form-group"><label>部门</label><input type="text" id="belongTranDesignUserDept" class="form-control" readonly="readonly"/></div>
                            <div class="col-xs-4 form-group"><label>分区</label><input type="text" id="belongTranDesignUserRegion" class="form-control" readonly="readonly"/></div>
                        </div>
                        <div class="row">
                            <div class="col-xs-6 form-group">
                                <label>归属比例(0~100, 可一位小数)</label>
                                <input type="number" id="belongTranDesignRate" class="form-control" min="0" max="100" step="0.1"/>
                            </div>
                            <div class="col-xs-6 form-group" style="padding-top:26px">
                                <label class="checkbox-inline"><input type="checkbox" id="belongTranDesignDefault"/> 设为默认归属人</label>
                            </div>
                        </div>
                        <div class="text-right"><a href="javascript:void(0)" id="belongTranDesignClear" style="display:none">清除该段已存配置</a></div>
                    </div>
                </div>
                <div class="panel panel-default no-margin-bottom" style="margin-top:10px">
                    <div class="panel-heading"><b>业务归属</b></div>
                    <div class="panel-body">
                        <div id="belongTranSalesCurrent" class="help-block" style="font-size:12px;margin:0 0 8px"></div>
                        <div class="form-group">
                            <label>接手业务员(限在职, 留空则不变更)</label>
                            <input type="text" id="belongTranSalesUserInput" class="form-control" autocomplete="off"/>
                        </div>
                        <div class="row">
                            <div class="col-xs-4 form-group"><label>姓名</label><input type="text" id="belongTranSalesUserName" class="form-control" readonly="readonly"/></div>
                            <div class="col-xs-4 form-group"><label>部门</label><input type="text" id="belongTranSalesUserDept" class="form-control" readonly="readonly"/></div>
                            <div class="col-xs-4 form-group"><label>分区</label><input type="text" id="belongTranSalesUserRegion" class="form-control" readonly="readonly"/></div>
                        </div>
                        <div class="row">
                            <div class="col-xs-6 form-group">
                                <label>归属比例(0~100, 可一位小数)</label>
                                <input type="number" id="belongTranSalesRate" class="form-control" min="0" max="100" step="0.1"/>
                            </div>
                            <div class="col-xs-6 form-group" style="padding-top:26px">
                                <label class="checkbox-inline"><input type="checkbox" id="belongTranSalesDefault"/> 设为默认归属人</label>
                            </div>
                        </div>
                        <div class="text-right"><a href="javascript:void(0)" id="belongTranSalesClear" style="display:none">清除该段已存配置</a></div>
                    </div>
                </div>
                <div class="help-block" style="font-size:12px;margin-top:8px">移交人取自装修单现归属: 设计段移交现设计师, 业务段移交现业务员。签约/重签单推荐比例0(业绩不随迁), 未签单推荐100。配置仅缓存, 发起审批通过后才生效。</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" id="belongTranConfigOkBtn" class="btn btn-primary">保存配置</button>
            </div>
        </div>
    </div>
</div>

<!-- 发起移交审批 modal -->
<div class="modal fade" id="belongTranSubmitModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">发起离职移交审批</h4>
            </div>
            <div class="modal-body">
                <div id="belongTranSubmitSummary" class="well well-sm" style="font-size:12px;max-height:260px;overflow:auto"></div>
                <div class="form-group">
                    <label>移交原因</label>
                    <textarea id="belongTranReasonInput" class="form-control" rows="2" placeholder="如: 张三 2026-11 离职,名下单据移交"></textarea>
                </div>
                <div class="form-group">
                    <label>审批人</label>
                    <div id="belongTranApproveManSel"></div>
                    <input type="text" id="belongTranApproverInput" class="form-control" placeholder="无预置审批人时输入姓名检索" autocomplete="off" style="margin-top:6px"/>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" id="belongTranSubmitOkBtn" class="btn btn-success">提交审批</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/decoration/decoration4belong.js']);
</script>
