									</div>

									<div class="form-group">
										<label for="deptId" class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.dept">部门</label>

									<div class="space-4"></div>

										<label for="regionId" class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.region">分区</label>

										</div>
									</div>
									<div class="space-4"></div>

									<div class="space-4"></div>
									<div class="form-group">

											<input type="checkbox" id="defaultFlag"  class="col-sm-7 col-xs-10 ace ace-switch ace-switch-5"/>

										</div>
									</div>
									<div class="space-4"></div>

							</div>

										</button>
										<button id="applyApprovalBtn" class="btn btn-minier btn-primary">
											<i class="icon-save"></i>

			</div>

				</div>

<div class="modal fade" id="approveModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
     			<div class="modal-header">
       			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
       			<h4 class="modal-title" id="myModalLabel" data-i18n="page.decoration.title.modifyApply">修改申请</h4>
     			</div>
     			<div class="modal-body">
	      		<form class="form-horizontal">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right orange" for="changeReason" data-i18n="page.decoration.label.changeReason">描述</label>
						<div class="col-sm-9">
							<textarea id="changeReason" maxlength="128" class="col-xs-10 col-sm-6 v_required" rows="3" data-toggle="popover" data-trigger='manual'></textarea>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group" id="approveGroup">
						<label for="approveManSel" class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.approver">审批人</label>
						<div class="col-sm-9">
							<div id="approveManSel" class="col-xs-10 col-sm-6 ">
							</div>
						</div>
					</div>
					<div class="space-4"></div>
                    
                    <div class="form-group">
                        <label for="dingApprove" class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.dingSync">钉钉同步</label>
                        <div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="dingApprove">
                            <span class="lbl status-lbl"></span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="wechatApprove" class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.wechatSync">企业微信同步</label>
                        <div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="wechatApprove" disabled="disabled">
                            <span class="lbl status-lbl"></span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="larkApprove" class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.larkSync">飞书同步</label>
                        <div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="larkApprove" disabled="disabled">
                            <span class="lbl status-lbl"></span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="fenxApprove" class="col-sm-3 control-label no-padding-right" data-i18n="page.decoration.label.fenxSync">纷享同步</label>
                        <div class="col-sm-9"><input class="ace ace-switch ace-switch-5" type="checkbox" id="fenxApprove" disabled="disabled">
                            <span class="lbl status-lbl"></span>
                        </div>
                    </div>
					
				</form>
     			</div>
			<div class="modal-footer">
				<button type="button" id="submitApproveBtn" class="btn btn-primary" data-i18n="page.decoration.title.modifyApply">修改申请</button>
	        	<button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
	      	</div>
   		</div>
 		</div>
 	</div>
 	
 	<div class="modal fade" id="updateModal" tabindex="-1">
       <div class="modal-dialog">
           <div class="modal-content">
               <div class="modal-header">
                   <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                   <h4 class="modal-title" id="myModalLabel" data-i18n="msg.modify">修改</h4>
               </div>
               <div class="modal-body">
                   <form class="form-horizontal">
                       <div class="form-group">
	                    <label class="col-sm-3 control-label no-padding-right" for="updateBelongRate" data-i18n="page.decoration.label.allocRate">分配比例</label>
	                    <div class="col-sm-9">
	                        <input type="text" id="updateBelongRate" class="col-xs-10 col-sm-6 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="5"/>
	                    </div>
	                </div>
	                <div class="space-4"></div>
	                <div class="form-group">
	                    <label class="col-sm-3 control-label no-padding-right" for="updateDefaultFlag" data-i18n="page.decoration.label.isDefault">是否默认</label>
	                    <div class="col-sm-9">
	                        <input type="checkbox" id="updateDefaultFlag" class="col-sm-7 col-xs-10 ace ace-switch ace-switch-5"/>
							<span class="lbl isOrNot"></span>
	                    </div>
	                </div>
	                <div class="space-4"></div>
                   </form>
               </div>
               <div class="modal-footer">
                   <button type="button" id="updateBelongBtn" class="btn btn-primary" data-i18n="msg.modify">修改</button>
                   <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
               </div>
           </div>
       </div>
   </div>
