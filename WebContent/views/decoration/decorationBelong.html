<div id="fl-statement"></div>

<div class="row">
	<div class="col-xs-12">

		<div class="col-xs-12 col-md-4">
			<div class="widget-box transparent">
				<div class="widget-header">
					<h4><strong>归属信息</strong></h4>
				</div>

				<div class="widget-body">
					<div class="widget-main">
						<div class="row">
							<div class="col-md-12">
								<form id="addUserModal" class="form-horizontal">
									<input type="text" id="belongDeptId" class="hide">
									<input type="text" id="belongRegionId" class="hide">
									<input type="text" id="belongDept" class="hide">
									<input type="text" id="belongRegion" class="hide">
									<input type="text" id="belongUser" class="hide">
										
									<div class="form-group">
										<label for="belongUserId" class="col-sm-3 control-label no-padding-right">人员姓名</label>
										<div class="col-md-9">
											<input type="text" class="col-xs-10 col-sm-7 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="belongUserId" placeholder="请输入人员">
										</div>
									</div>
									<div class="space-4"></div>
									
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="belongRate">分配比例</label>
										<div class="col-sm-9">
											<input type="text" class="col-xs-10 col-sm-7 v_required v_float_3" data-toggle="popover" data-trigger='manual' id="belongRate" maxlength="5"/>
										</div>
									</div>

									<div class="form-group">
										<label for="deptId" class="col-sm-3 control-label no-padding-right">部门</label>
										<div class="col-md-9">
											<input type="text" class="col-xs-10 col-sm-7 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="deptId" placeholder="请输入部门">
										</div>
									</div>
									<div class="space-4"></div>

									<div class="form-group">
										<label for="regionId" class="col-sm-3 control-label no-padding-right">分区</label>
										<div class="col-md-9">
											<input type="text" class="col-xs-10 col-sm-7 v_typeahead v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual" id="regionId" placeholder="请输入分区">
										</div>
									</div>
									<div class="space-4"></div>

									<div class="space-4"></div>
									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="isPresentGraduate">是否默认</label>
										<div class="col-sm-9">
											<input type="checkbox" id="defaultFlag"  class="col-sm-7 col-xs-10 ace ace-switch ace-switch-5"/>
											<span class="lbl isOrNot"></span>
										</div>
									</div>
									<div class="space-4"></div>
								</form>
							</div>

							<div class="col-md-12 hr hr-16"></div>
							<div class="col-md-12 center">
								<div class="col-md-12 ">
									<div class="ui-pg-div">
										<button id="addNewUserBtn" class="btn btn-minier btn-pink">
											<i class="icon-pencil"></i>添加
										</button>
										<button id="saveBelongInfoBtn" class="btn btn-minier btn-primary">
											<i class="icon-save"></i>提交申请
										</button>
										<button id="detailBckBtn" class="btn btn-minier btn-info">
											<i class="icon-mail-forward"></i>返回
										</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<div class="col-xs-12 col-md-8">
			<div class="well">
				<h4 class="green smaller lighter">描述</h4>
				<div>
					<p>分配归属信息时,所有分配人的分配比率的和必须是1,否则无法保存。</p>
					<p>分配归属信息时,必须有一个默认归属用户,否则无法保存。</p>
					<p>当订单的归属信息通过审批时,您的修改才会真的起作用,并以消息的方式通知相关人员。</p>
				</div>
			</div>
			<div class="hr hr-24"></div>
			<div class="" id="addOrReduceItemDiv1">
				<div class="widget-container-span ui-sortable"> 
					<div class="widget-box transparent">
						<div class="widget-header">
							<h3>
								<strong>归属信息</strong>
							</h3>
						</div>
						<div class="widget-body">
							<div class="widget-body-inner" id='belongInfoDiv' style="display: block;">
								<ul id="belongResultList" class="item-list fl-table-list ui-sortable"></ul>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="approveModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
     			<div class="modal-header">
       			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
       			<h4 class="modal-title" id="myModalLabel">修改申请</h4>
     			</div>
     			<div class="modal-body">
	      		<form class="form-horizontal">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right orange" for="changeReason">描述</label>
						<div class="col-sm-9">
							<textarea id="changeReason" maxlength="128" class="col-xs-10 col-sm-6 v_required" rows="3" data-toggle="popover" data-trigger='manual'></textarea>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label for="approveManSel" class="col-sm-3 control-label no-padding-right">审批人</label>
						<div class="col-sm-9">
							<div id="approveManSel" class="col-xs-10 col-sm-6 ">
							</div>
						</div>
					</div>
					<div class="space-4"></div>
					
				</form>
     			</div>
			<div class="modal-footer">
				<button type="button" id="cApproveSaveBtn" class="btn btn-primary">修改申请</button>
	        	<button type="button" id="cApproveCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
	      	</div>
   		</div>
 		</div>
 	</div>
 	
 	<div class="modal fade" id="updateModal" tabindex="-1">
       <div class="modal-dialog">
           <div class="modal-content">
               <div class="modal-header">
                   <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                   <h4 class="modal-title" id="myModalLabel">修改</h4>
               </div>
               <div class="modal-body">
                   <form class="form-horizontal">
                       <div class="form-group">
	                    <label class="col-sm-3 control-label no-padding-right" for="updateBelongRate">分配比例</label>
	                    <div class="col-sm-9">
	                        <input type="text" id="updateBelongRate" class="col-xs-10 col-sm-6 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="5"/>
	                    </div>
	                </div>
	                <div class="space-4"></div>
	                <div class="form-group">
	                    <label class="col-sm-3 control-label no-padding-right" for="updateDefaultFlag">是否默认</label>
	                    <div class="col-sm-9">
	                        <input type="checkbox" id="updateDefaultFlag" class="col-sm-7 col-xs-10 ace ace-switch ace-switch-5"/>
							<span class="lbl isOrNot"></span>
	                    </div>
	                </div>
	                <div class="space-4"></div>
                   </form>
               </div>
               <div class="modal-footer">
                   <button type="button" id="updateBtn" class="btn btn-primary">修改</button>
                   <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
               </div>
           </div>
       </div>
   </div>

<script type="text/javascript">
	$.loadScript(['js/utils/approvalUtils.js','js/decoration/decorationBelong.js']);
</script>
