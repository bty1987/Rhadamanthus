<div id="decorationBalanceContent">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <div id="resultList" class="clearfix tab-pane active"></div>
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="balanceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content col-md-12">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
                <h4 class="modal-title">装修结算</h4>
            </div>
            <div class="modal-body">
                <div class="form-horizontal" id="balanceForm">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">装修单号</label>
                        <div class="col-sm-9">
                            <input type="text" id="orderId" class="col-xs-10" readonly="readonly">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">结算金额</label>
                        <div class="col-sm-9">
                            <input type="text" id="balance" class="col-xs-10 v_required v_afloat_3" maxlength="11">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<div id="layerPopUp"></div>

<script type="text/javascript">
    $.loadScript(['js/decoration/decorationBalance.js']);
</script>
