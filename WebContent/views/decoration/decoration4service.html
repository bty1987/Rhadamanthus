<div id="decorationServicePageContent">

    <div id="fl-statement">
        <div class='page-header'><h1>服务信息</h1></div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <div id="serviceInfo" class="clearfix tab-pane active"></div> <!--查询结果-->

            <div class="row" style="margin-left: 0px;margin-right: 0px;margin-top: 14px;" id="select1">
                <!--<button class="btn  pull-left btn-sm" id="addService" data-i18n="page.decoration.btn.add">添加</button>-->

                <button class="btn btn-minier pull-right btn-info" type="button" id="btnBack">
                    <i class="icon-mail-forward bigger-110"></i>
                    <span data-i18n="msg.back">返回</span>
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="serviceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="myModalLabel">完成装修服务</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group" >
                            <label class="col-md-3 control-label no-padding-right" for="comment"  data-i18n="page.decoration.label.commentInfo">备注信息</label>
                            <div class="col-md-9">
                                <textarea id="comment" class="col-md-6 v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="40"></textarea>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group" >
                            <label class="col-md-3 control-label no-padding-right" for="planTime" >计划时间</label>
                            <div class="col-md-9">
                                <input type="text" id="planTime" class="form-control date-picker"
                                       data-date-format="yyyy-mm-dd hh:ii:ss" placeholder="请选择计划时间" data-i18n-ph="page.decoration.ph.planTime">
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group" >
                            <label class="col-md-3 control-label no-padding-right" for="finisher" >完成人</label>
                            <div class="col-md-9">
                                <select id="finisher" class="form-control" placeholder="请选择完成人" data-i18n-ph="page.decoration.ph.completer">
                                    <option value="" data-i18n="page.decoration.ph.completer">请选择完成人</option>
                                </select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="serviceSaveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    $.loadScript(['js/decoration/decoration4service.js']);
</script>
