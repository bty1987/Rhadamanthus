<div class="modal fade" id="apiModal" tabindex="-1" data-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="prosignDialog">配置</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <div style="font-size: 20px; padding: 0px 0px 15px 15px;">api配置</div>
                        <div class="col-sm-12" id="apiData"></div>
                    </div>
                    <div class="form-group">
                        <div style="font-size: 20px; padding: 0px 0px 15px 15px;">条件配置</div>
                        <div class="col-sm-12" id="condArrData"></div>
                    </div>
                    <div class="form-group">
                        <div style="font-size: 20px; padding: 0px 0px 15px 15px;">字段配置</div>
                        <div class="col-sm-12" id="fieldData"></div>
                    </div>
                    <div class="form-group">
                        <div style="font-size: 20px; padding: 0px 0px 15px 15px;">功能配置</div>
                        <div class="col-sm-12" id="functionData"></div>
                    </div>
                    <div class="form-group">
                        <div style="font-size: 20px; padding: 0px 0px 15px 15px;">节点配置</div>
                        <div class="col-sm-12" id="nodeData"></div>
                    </div>
                    <div class="form-group">
                        <div style="font-size: 20px; padding: 0px 0px 15px 15px;">状态功能配置</div>
                        <div class="col-sm-12" id="statusData"></div>
                    </div>
                    <div class="form-group">
                        <div style="font-size: 20px; padding: 0px 0px 15px 15px;">公司范围配置</div>
                        <div class="col-sm-12" id="companyData"></div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="apiBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<!-- 同步功能模态框 -->
<div class="modal fade" id="syncModal" tabindex="-1" data-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="syncDialog">同步装饰功能配置</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">功能名称:</label>
                        <div class="col-sm-9">
                            <p class="form-control-static" id="syncFunctionName"></p>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">公司信息:</label>
                        <div class="col-sm-9">
                            <div id="companyList" class="well" style="max-height: 300px; overflow-y: auto;">
                                <div class="text-center">
                                    <i class="icon-spinner icon-spin"></i> 正在加载公司信息...
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="syncConfirmBtn" class="btn btn-primary">确认同步</button>
                <button type="button" id="syncCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>
