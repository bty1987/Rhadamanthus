<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div id="workerBalance" style="padding: 10px 0;display: none">
        <div class="modal-header">
            <h4 class="modal-title" id="myModalLabel">工人质保金</h4>
        </div>
        <div class="modal-body">
            <form class="form-horizontal" id="form">
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="money">金额</label>
                    <div class="col-md-9">
                        <input type="text" id="money" class="col-xs-10 col-sm-5 v_required v_float"
                               data-toggle="popover" data-trigger='manual'/>
                    </div>
                </div>
                <div class="space-4"></div>
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="comment">备注</label>
                    <div class="col-md-9">
                        <textarea id="comment" class="col-md-6 v_name" rows="3" data-toggle="popover"
                                  data-trigger='manual' maxlength="40"></textarea>
                    </div>
                </div>
                <div class="space-4"></div>
                <div class="form-group col-xs-11 col-sm-11" style="text-align: right;top: -10px;">
                    <button type="button" id="depositBtn" class="btn btn-primary">确定</button>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <span id="paymentInfo" class="alert-danger pull-left inline"></span>
        </div>
    </div>

    <div id="workerGold" style="padding: 10px 0;display: none">

            <h4 class="modal-title" id="myModalLabelGold">工人质保金</h4>

                <div class="form-group">

                        <textarea id="commentGold" class="col-md-6 v_name" rows="3" data-toggle="popover"

                <div class="space-4"></div>
                <div class="form-group col-xs-11 col-sm-11" style="text-align: right;top: -10px;">

    <div id="updateBalance" style="padding: 10px 0;display: none">
        <div class="modal-header">
            <h4 class="modal-title" id="myWorkerLabel">工人质保金</h4>
        </div>
        <div class="modal-body">
            <form class="form-horizontal" id="balanceform">
                <div class="form-group" style="padding-top: 20px">
                    <label class="col-sm-3 control-label no-padding-right" for="toplimit">质保金上限</label>
                    <div class="col-md-9">
                        <input type="text" id="toplimit" class="col-xs-10 col-sm-6 v_required v_float"
                               data-toggle="popover" data-trigger='manual'/>

                </div>
                <div class="form-group col-xs-11 col-sm-11" style="text-align: right;top: -10px;">

                </div>
            </form>
        </div>

    <div id="workerSalary" style="padding: 10px 0;display: none">

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="workerUser">员工姓名</label>
                    <div class="col-md-9">
                        <input type="text" id="workerUser" class="col-xs-10 col-sm-5"
                               data-toggle="popover" data-trigger='manual'readonly="readonly"/>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="salaryMoney">金额</label>

                        <textarea id="salaryComment" class="col-md-6 v_name" rows="3" data-toggle="popover"
                                  data-trigger='manual' maxlength="40"></textarea>
                    </div>
                </div>
                <div class="space-4"></div>
                <div class="form-group col-xs-11 col-sm-11" style="text-align: right;top: -10px;">
                    <button type="button" id="workerBtn" class="btn btn-primary">确定</button>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <span id="salaryInfo" class="alert-danger pull-left inline"></span>
        </div>
    </div>

    <div id="workerLabor" style="padding: 10px 0;display: none">
        <div class="modal-header">
            <h4 class="modal-title" id="myModalLabor">工人工费</h4>
        </div>
        <div class="modal-body">
            <form class="form-horizontal" id="formsLabor">
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="workerUserLabor">员工姓名</label>
                    <div class="col-md-9">

                               data-toggle="popover" data-trigger='manual'readonly="readonly"/>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="moneyLabor">金额</label>

                        <input type="text" id="moneyLabor" class="col-xs-10 col-sm-5 v_required v_float"

                </div>
                <div class="space-4"></div>
                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="commentLabor">备注</label>

    <div class="modal fade" id="transferModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="mytransferModalLabel">转款工人工费</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal" id="workertransferId">
                        <div class="form-group " >
                            <label class="col-sm-3 control-label no-padding-right orange" for="workertransferuser">转款人</label>
                            <div class="col-md-9">
                                <input id="workertransferuser" class="col-xs-10 col-sm-6 v_typeahead v_required " type="text" data-toggle="popover" data-placement="bottom" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group " >
                            <label class="col-sm-3 control-label no-padding-right orange" for="workercollectuser">收款人</label>
                            <div class="col-md-9">
								 <input id="workercollectuser" class="col-xs-10 col-sm-6 v_typeahead v_required " type="text" data-toggle="popover" data-placement="bottom" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="workertransfermoney">转款金额</label>
                            <div class="col-md-9">
                                <input type="text" id="workertransfermoney" class="col-xs-10 col-sm-6 v_required v_float"
                                       data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="workercomment">备注</label>
                            <div class="col-sm-9">
                                <textarea id="workercomment" maxlength="128" class="col-xs-10 col-sm-6  "  rows="3"></textarea>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>
