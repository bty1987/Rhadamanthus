<div class="page-content">
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="salaryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="myModalLabelss">添加薪资</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal" id="workersalaryId">
                        <div class="form-group " >
                            <label class="col-sm-3 control-label no-padding-right " for="salaryuser">姓名</label>
                            <div class="col-md-9">
                             <!-- <select>
                                    <option value="">&nbsp;</option>
                                </select> -->
							<input id="salaryuser" class="col-xs-10 col-sm-6 v_typeahead v_required " type="text" data-toggle="popover" data-placement="bottom" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="type1">类型</label>
                            <div class="col-sm-9">
                                <select maxlength="64" id="type1" class="col-xs-10 col-sm-6  v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>

                        </div>
                        <div class="space-4" ></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="type2">一类</label>
                            <div class="col-sm-9">
                                <select  maxlength="64" id="type2" class="col-xs-10 col-sm-6  v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>

                        </div>
                        <div class="space-4" ></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="type3">二类</label>
                            <div class="col-sm-9">
                                <select  maxlength="64" id="type3" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>

                        </div>
                        <div class="space-4" ></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="type4">三类</label>
                            <div class="col-sm-9">
                                <select  maxlength="64" id="type4" class="col-xs-10 col-sm-6  v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>

                        </div>
                        <div class="space-4" ></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="money">金额</label>
                            <div class="col-sm-9">
                                <input type="text" maxlength="64" id="money" class="col-xs-10 col-sm-6 v_required v_float" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="salarycomment">备注</label>
                            <div class="col-sm-9">
                                <textarea id="salarycomment" maxlength="128" class="col-xs-10 col-sm-6  "  rows="3"></textarea>
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    $.loadScript(['js/salary/salary.js'])
</script>
