<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	

	<div class="modal fade" id="workersalaryModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h4 class="modal-title" id="myModalLabel">工人工费信息</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" id="workersalaryId">
						<div class="form-group " >
								<label class="col-sm-3 control-label no-padding-right orange" for="workersalaryuser">姓名</label>
								<div class="col-md-9">
									<input id="workersalaryuser" class="col-xs-10 col-sm-6 v_typeahead v_required " type="text" data-toggle="popover" data-placement="bottom" data-trigger='manual'/>
								</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="workersalary">工费</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="workersalary" class="col-xs-10 col-sm-6 v_afloat_3 v_required" data-toggle="popover" data-trigger='manual'/>

								<span style="color: red;padding: 10px" >
								<b>* 扣款项请输入负数，如：-123 !</b>
								</span>
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="workersalarySubtype">类型</label>
							<div class="col-sm-9">
								<select  maxlength="64" id="workersalarySubtype" class="col-xs-10 col-sm-6  v_required" data-toggle="popover" data-trigger='manual'></select>
							</div>

						</div>
						<div class="space-4" ></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="workersalarycomment">备注</label>
							<div class="col-sm-9">
								<textarea id="workersalarycomment" maxlength="128" class="col-xs-10 col-sm-6  "  rows="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="importModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title">导入</h4>
					<h6><span style="color: purple;padding: 10px">上传字段均为文本类型</span></h6>
					<h6><span style="color: purple;padding: 10px"> 上传格式： 用户id 姓名 操作金额 类型 一类 二类 备注</span></h6>
					<h6><span style="color: purple;padding: 10px">类型： 0(加，只支持类型为加的工费信息)</span></h6>
                    <h6><span style="color: purple;padding: 10px">一类： 0(工费), 1(扣/罚), 2(转额), 3(其他)</span></h6>
                    <h6><span style="color: purple;padding: 10px">二类： 1(工费), 2(增项), 3(油工一级奖励), 4(维修款), 5(罚款), 6(工程质保金), 7(工具押金), 8(借款), 9(工人家属保险)</span></h6>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" >
						<div class="form-group">
							<div class="col-sm-12" id="import"></div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>


</div>

<script type="text/javascript">
   $.loadScript(['js/salary/workerSalary.js']);
</script>
