
<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="customerModal" tabindex="-1">
		<div class="modal-dialog"  >
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="customerDialog">客户</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<div class="col-xs-12">
							<form class="form-horizontal">
								<div class="col-md-12">

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right orange" for="customerName">姓名</label>
										<div class="col-sm-9">
											<input type="text" id="customerName" maxlength="32" class="col-xs-10 col-sm-6 v_required v_name" data-toggle="popover" data-trigger='manual' />
										</div>
									</div>
									
									<div id="customerhide">
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="gender">性别</label>
											<div class="col-sm-9">
												<input type="checkbox" id="gender" class="ace ace-switch ace-switch-5"/>
												<span class="lbl gender"></span>
											</div>
										</div>
	
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="identity">身份证号</label>
											<div class="col-sm-9">
												<input type="text" maxlength="21" id="identity" class="col-xs-10 col-sm-6 v_identity" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>
	
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="officer">军官证</label>
											<div class="col-sm-9">
												<input type="text" maxlength="21" id="officer" class="col-xs-10 col-sm-6  v_officer" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>
	
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="passport">护照</label>
											<div class="col-sm-9">
												<input type="text" maxlength="21" id="passport" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="passhkm">港澳通行证</label>
											<div class="col-sm-9">
												<input type="text" maxlength="21" id="passhkm" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>

										<div class="form-group" id="phonehide">
											<label class="col-sm-3 control-label no-padding-right orange" for="phone">联系方式</label>
											<div class="col-sm-9">
												<input type="text" id="phone" maxlength="64" class="col-xs-10 col-sm-6 v_phone" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>
	
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="qq">QQ</label>
											<div class="col-sm-9">
												<input type="text" id="qq" maxlength="15" class="col-xs-10 col-sm-6 v_number" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>
	
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="wechat">微信</label>
											<div class="col-sm-9">
												<input type="text" id="wechat" maxlength="15" class="col-xs-10 col-sm-6 v_name_en" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>
	
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="email">邮箱</label>
											<div class="col-sm-9">
												<input type="text" id="email" maxlength="32" class="col-xs-10 col-sm-6 v_email" data-toggle="popover" data-trigger='manual'/>
											</div>
										</div>
										
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="career">职业</label>
											<div class="col-sm-9">
												<textarea id="career" maxlength="32" class="col-xs-10 col-sm-6" rows="3"></textarea>
											</div>
										</div>
	
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="relationshipType">客户类型</label>
											<div class="col-sm-9">
												<select class="col-xs-10 col-sm-6 v_required" id="relationshipType"></select>
											</div>
										</div>
	                                    
										<div class="form-group">
											<label class="col-sm-3 control-label no-padding-right" for="address">通讯地址</label>
											<div class="col-sm-9">
												<textarea id="address" maxlength="128" class="col-xs-10 col-sm-6" rows="3"></textarea>
											</div>
										</div>
                                   	</div>
                                   
                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right orange" for="type">客户类型</label>
                                        <div class="col-sm-9">
											<select class="col-xs-10 col-sm-6 v_required" id="type"></select>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group companyitem" id="comNo">
                                        <label class="col-sm-3 control-label no-padding-right orange" for="companyNo">公司编号</label>
                                        <div class="col-sm-9">
                                            <input type="text" id="companyNo" maxlength="32" class="col-xs-10 v_required col-sm-6" data-toggle="popover" data-trigger='manual'>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right orange" for="companyName" id="comName">个人姓名</label>
                                        <div class="col-sm-9">
                                            <input type="text" id="companyName" maxlength="32" class="col-xs-10 v_required col-sm-6" data-toggle="popover" data-trigger='manual'>
                                        </div>
                                    </div>

                                    <div class="form-group companyitem" id="companyAd">
                                        <label class="col-sm-3 control-label no-padding-right orange" for="companyAddr">公司地址</label>
                                        <div class="col-sm-9">
                                            <input type="text" id="companyAddr" maxlength="32" class="col-xs-10 v_required col-sm-6" data-toggle="popover" data-trigger='manual'>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right " for="companyPhone" id="comPhone">个人电话</label>
                                        <div class="col-sm-9">
                                            <input type="text" id="companyPhone" maxlength="32" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right orange" for="companyBank">开户行</label>
                                        <div class="col-sm-9">
                                            <input type="text" id="companyBank" maxlength="32" class="col-xs-10 v_required col-sm-6" data-toggle="popover" data-trigger='manual'>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right orange" for="companyBankno">开户账号</label>
                                        <div class="col-sm-9">
                                            <input type="text" id="companyBankno" maxlength="32" class="col-xs-10 v_required col-sm-6" data-toggle="popover" data-trigger='manual'>
                                        </div>
                                    </div>
                                    
                                </div>
							</form>
						</div>
					</div>

				</div>

				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>

			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="customerphoneModal" tabindex="-1"  >
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span>&times;</span>
					<span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="customerphoneInfo">客户电话</h4>
			</div>

			<div class="modal-body" >
				<div id="customerphoneList"></div>
				<div class="form-group row">
					<label class="col-sm-2 control-label" for="addphone"><b>添加电话:</b></label>
					<input type="text" class="col-sm-7" id="addphone" data-placement="bottom">
					<button class="col-sm-1 btn btn-sm btn-primary" style="margin-left: 20px" id="addPhoneBtn">保存</button>
				</div>

			</div>
			<div class="modal-footer" style="text-align: center;">
				<button class="btn btn-sm btn-default" data-dismiss="modal">关闭</button>
			</div>
		</div>
	</div>
</div>

<div id="customerRecordPopUp"></div> <!-- 记录 -->

	$.loadScript(['js/data/customer.js']);
</script>
