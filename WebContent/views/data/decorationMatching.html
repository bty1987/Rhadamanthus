<div class="row">
    <div class="col-xs-12">
        <div id="resultList" class="clearfix tab-pane active"></div>

        <div class="row">
            <div id="list" style="margin-left:10px"></div>

            <h3 class="clearfix">
                <a class="btn btn-minier btn-success" id="addBtn"><i
                        class="icon-plus"></i>添加</a>
            </h3>
        </div>
    </div>
</div>

<div class="modal fade" id="decorationMatchingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="">装修配比</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="decorationMatchingForm">

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
                    <div class="col-sm-9">
                        <input type="text" id="name" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' />
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="typeness">类型</label>
                    <div class="col-sm-9">
                        <select class="span6 m-wrap col-xs-7 v_required" id="typeness" maxlength="12" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="base">基数</label>
                    <div class="col-sm-9">
                        <input type="text" id="base" maxlength="12" class="col-xs-10 col-sm-7 v_required v_anumber" data-toggle="popover" data-trigger='manual' />
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="discount">折扣</label>
                    <div class="col-sm-9">
                        <input type="text" id="discount" maxlength="12" class="col-xs-10 col-sm-7 v_required v_float_3" data-toggle="popover" data-trigger='manual' />
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="material">主材配比</label>
                    <div class="col-sm-9">
                        <input type="text" id="material" maxlength="12" class="col-xs-10 col-sm-7 v_required v_float_3" data-toggle="popover" data-trigger='manual' />
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="service">服务配比</label>
                    <div class="col-sm-9">
                        <input type="text" id="service" maxlength="12" class="col-xs-10 col-sm-7 v_required v_discount" data-toggle="popover" data-trigger='manual' />
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="vision">显示配置</label>
                    <div class="col-sm-9">
                        <div class="col-sm-12" id="vision"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label no-padding-right" for="comment">说明</label>
                    <div class="col-sm-9">
                        <input type="text" id="comment" maxlength="12" class="col-xs-10 col-sm-7" data-toggle="popover" data-trigger='manual' />
                    </div>
                </div>

            </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
    $.loadScript(['js/data/decorationMatching.js']);
</script>
