
<div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

<div class="modal fade" id="decorationMatchingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                    <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="">装修配比</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="decorationMatchingForm">

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
                        <div class="col-sm-9">
                            <input type="text" id="name" maxlength="12" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="typeness">类型</label>
                        <div class="col-sm-9">
                            <select class="span6 m-wrap col-xs-7 v_required" id="typeness" maxlength="12" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="base">基数</label>
                        <div class="col-sm-9">
                            <input type="text" id="base" maxlength="12" class="col-xs-10 col-sm-7 v_required v_anumber" data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="discount">折扣</label>
                        <div class="col-sm-9">
                            <input type="text" id="discount" maxlength="12" class="col-xs-10 col-sm-7 v_required v_float_3" data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">折扣类型</label>
                        <div class="col-sm-9">
                            <input type="radio" name="discountType" value="0" class="ace" />
                            <span class="lbl"></span>
                            <label>固定</label>
                            <input type="radio" name="discountType" value="1" class="ace" />
                            <span class="lbl"></span>
                            <label>可改</label>
                            <input type="radio" name="discountType" value="2" class="ace" />
                            <span class="lbl"></span>
                            <label>最低</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="material">主材配比</label>
                        <div class="col-sm-9">
                            <input type="text" id="material" maxlength="12" class="col-xs-10 col-sm-7 v_required v_float_3" data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="service">服务配比</label>
                        <div class="col-sm-9">
                            <input type="text" id="service" maxlength="12" class="col-xs-10 col-sm-7 v_required v_float_3" data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="vision">显示配置</label>
                        <div class="col-sm-9">
                            <div class="col-sm-12" id="vision"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="vision">默认显示</label>
                        <div class="col-sm-9">
                            <input type="checkbox" id="isShow" class="col-sm-7 col-xs-10 ace ace-switch ace-switch-5" />
                            <span class="lbl isOrNot"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="vision">车运费是否打折</label>
                        <div class="col-sm-9">
                            <input type="checkbox" id="trafficDiscount" class="col-sm-7 col-xs-10 ace ace-switch ace-switch-5" />
                            <span class="lbl isOrNot"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="vision">管理费是否打折</label>
                        <div class="col-sm-9">
                            <input type="checkbox" id="manageDiscount" class="col-sm-7 col-xs-10 ace ace-switch ace-switch-5" />
                            <span class="lbl isOrNot"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right">税金折扣</label>
                        <div class="col-sm-9">
                            <input type="radio" id="noTaxDiscount" name="taxDiscount" value="0" class="ace" />
                            <span class="lbl"></span>
                            <label>无税金</label>
                            <input type="radio" id="manageTaxDiscount" name="taxDiscount" value="1" class="ace" />
                            <span class="lbl"></span>
                            <label>管理税金</label>
                            <input type="radio" id="totalTaxDiscount" name="taxDiscount" value="2" class="ace" />
                            <span class="lbl"></span>
                            <label>总额税金</label>
                        </div>
                    </div>

                    <div class="space-4"></div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="comment">说明</label>
                        <div class="col-sm-9">
                            <textarea id="comment" maxlength="12" class="col-xs-10 col-sm-7" rows="3"></textarea>
                        </div>
                    </div>

                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/decorationMatching.js']);
</script>
