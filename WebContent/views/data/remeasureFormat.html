
<div id="remeasureFormat">
	<div class="row">
		<div class="col-xs-12">
			<div id="condListRemeasureFormat" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultListRemeasureFormat" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenationRemeasureFormat" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="remeasureFormatModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="remeasureFormatDialog">回尺指标</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-7 v_required" maxlength="32" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="quotationItem">报价项</label>
							<div class="col-sm-9">
								<input type="text" id="quotationItem" class="col-xs-10 col-sm-7" data-toggle="popover" data-trigger='manual' disabled/>
								<button id="addQuotationItemBtn" class="btn btn-xs btn-info col-xs-2 col-sm-2" type="button" style="padding: 5px 4px;">关联</button>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="goods" data-i18n="page.data.label.goods">商品</label>
							<div class="col-sm-9">
								<input type="text" id="goods" class="col-xs-10 col-sm-7" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="type">类型</label>
							<div class="col-sm-9">
								<select id="type" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="value">数值</label>
							<div class="col-sm-9">
								<input type="text" id="value" class="col-xs-10 col-sm-7 v_required v_float" maxlength="32" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
		        	<button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>

	<div class="modal fade" id="quotationItemsModal" tabindex="-1" data-backdrop="static">
		<div class="modal-dialog" style="width:900px;">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="selectItemDialog">选择报价项目</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<div id="condListQuotationItem" class="fl_search clearfix"></div>
						<div id="resultListQuotationItem" class="clearfix tab-pane active"></div>
						<div id="pagenationQuotationItem" class="fl-page-wrap clearfix" style="text-align: center;max-width: 680px;"></div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/data/remeasureFormat.js']);
</script>
