<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div><!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div><!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div><!--分页-->
        </div>
    </div>

    <div class="modal fade" id="supplierModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="myModalLabel">厂商信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal" role="form">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="supplierName">厂商名</label>
                            <div class="col-sm-9">
                                <input type="text" id="supplierName"  class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="loginId">登陆名</label>
                            <div class="col-sm-9">
                                <input type="text" id="loginId" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="password">密码</label>
                            <div class="col-sm-9">
                                <input type="text" id="password" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="supplierRightModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="materialBrandDialog">导购人员信息列表</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="user">导购</label>
                            <div class="col-sm-9">
                                <!--<select id="brandright" multiple="multiple" class="col-sm-7 col-xs-10 chosen-select tag-input-style" data-placeholder="..." data-toggle="popover" data-trigger='manual'></select>-->
                                <input id="user" type="text" class="form-control" name="tags"  placeholder="请输入导购姓名 ..." />
                            </div>
                        </div>
                        <div class="space-4"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveUserBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelUserBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/supplier.js']);
</script>
