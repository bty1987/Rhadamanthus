<div id="quotationNamingRulePageContent">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div>
			<div class="clearfix" id="resultList"></div>
			<div class="fl-page-wrap clearfix pagination" id="pagenation" style="display: block;"></div>
		</div>
	</div>
</div>

<div class="modal fade" id="layerAdd" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title" id="layerAddLabel">报价命名规则</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal" novalidate="novalidate" id="form1">

					<div class="widget-main">
						<div class="row" style="margin:0px;">
							<div class="col-md-11">
								<div class="form-group">
									<label class="col-md-4 control-label no-padding-right orange">名称</label>
									<div class="col-md-8">
										<input type="text" class="v_required" id="name" name="name" data-required="1" data-toggle="popover" data-trigger='manual' placeholder="规则名称" />
									</div>
								</div>

								<div class="form-group">
									<label class="col-md-4 control-label no-padding-right orange">类型</label>
									<div class="col-md-8">
										<select class="v_required col-md-7" id="type" name="type" data-required="1" data-toggle="popover" data-trigger='manual'></select>
									</div>
								</div>

								<div class="form-group">
									<label class="col-md-4 control-label no-padding-right">排序</label>
									<div class="col-md-8">
										<input type="text" class="v_number" id="sort" name="sort" data-required="1" data-toggle="popover" data-trigger='manual' placeholder="排序号" />
									</div>
								</div>

								<div class="form-group">
									<label class="col-md-4 control-label no-padding-right">备注</label>
									<div class="col-md-8">
										<input type="text" id="comment" name="comment" data-toggle="popover" data-trigger='manual' placeholder="备注说明" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="submitBtn" class="btn btn-primary" data-i18n="msg.ok">确定</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/quotationNamingRule.js']);
</script>
