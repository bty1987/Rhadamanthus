<div class="modal fade" id="paymentScaleModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title" id="myModalLabel">添加款项</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal" id="form1">

							<!--<option value="">&nbsp;</option>-->
							<!--</select>-->
						<!--</div>-->
					<!--</div>-->

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right orange" for="names">款项名称</label>
						<div class="col-sm-9">
							<input type="text" maxlength="64" id="names" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual' />

					</div>

					<div class="form-group">

		</div>
	</div>
</div>

<div class="modal fade" id="itemModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content" style="width: 900px;margin-left: -30%">
			<div class="modal-header">
				<h4 class="modal-title" >添加款项比例</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal">
					<div class="form-group" id="itemlist"></div>

					<div class="form-group" id="inputInfo">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="paymentType">款项类型</label>
							<div class="col-sm-9">
								<select id="paymentType" class="col-xs-10 col-sm-5 v_required"></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="scale">比例</label>
							<div class="col-sm-9">
								<input type="text" class="col-xs-10  col-sm-5 v_required v_number" id="scale" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="sort">排序</label>
							<div class="col-sm-9">
								<input type="text" id="sort" class="col-xs-10 col-sm-5 v_required v_newNum" maxlength="2" data-toggle="popover" data-trigger='manual'>
							</div>
						</div>
						<div class="space-4"></div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="savePaymenScaleBtn" class="btn btn-primary">保存</button>
				<button type="button" id="canBtn" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>
