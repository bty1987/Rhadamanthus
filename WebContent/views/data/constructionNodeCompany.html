<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="constructionNodeModal" tabindex="-1"  >
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span>
						<span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="workerSalaryInfo">工程节点配置</h4>
				</div>

				<div class="modal-body" id="workerSalaryList" style="height:200px">
					<div class="form-group col-sm-10" >
						<label class="col-sm-3 control-label no-padding-left" for="companyName">公司名称</label>
						<div class="col-sm-9">
							<input class="col-xs-10 col-sm-9" id="companyName" style="width:216px;height: 29px">
						</div>
					</div>

					<div class="form-group col-sm-10">
						<label class="col-sm-3 control-label no-padding-left" for="nodeName">节点名称</label>
						<div class="col-sm-9">
							<select multiple="multiple"  class="col-sm-7 col-xs-10 chosen-select tag-input-style v_required" id="nodeName" data-placeholder="..." data-toggle="popover" data-trigger='manual'></select>
						</div>
					</div>

				</div>

				<div class="modal-footer" style="margin-top: 10px;">
					<button class="btn btn-sm btn-primary" id="saveBtn">保存</button>
					<button class="btn btn-sm btn-default" data-dismiss="modal" id="cancelBtn">取消</button>
				</div>
			</div>
		</div>
	</div>

</div>

<script type="text/javascript">
	$.loadScript(['js/data/constructionNodeCompany.js']);
</script>
