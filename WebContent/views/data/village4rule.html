
<div class="row">
    <div class="col-xs-12">
        <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
        <div id="resultLists" class="clearfix tab-pane active"></div> <!--查询结果-->

        <div class="row" style="margin-top: 20px">
            <div class="col-xs-12">
                 <a class="btn btn-minier btn-primary pull-left" id="bindRuleModalBtn" style="margin-right: 10px">
                     <i class="icon-link bigger-110"></i>
                     <span>绑定</span>
                 </a>
                 <a class="btn btn-minier btn-success pull-left" id="createRuleModalBtn" style="margin-right: 10px">
                     <i class="icon-plus bigger-110"></i>
                     <span>创建</span>
                 </a>
                 <a class="btn btn-minier" id="returnBtn">
                     <i class="icon-mail-forward bigger-110"></i>
                     <span data-i18n="msg.back">返回</span>
                 </a>
            </div>
       </div>
   </div>
</div>

<!-- 绑定规则弹窗 -->
<div class="modal fade" id="bindRuleModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title">绑定楼盘规则</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label for="rule" class="col-sm-3 control-label no-padding-right orange">规则</label>
                        <div class="col-md-9">
                            <select class="col-xs-10 col-sm-6 v_required" id="rule" ></select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBindBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="cancelBindBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<!-- 创建规则弹窗 -->
<div class="modal fade" id="createRuleModal" tabindex="-1">
    <div class="modal-dialog" style="width: 900px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="createRuleDialog">创建楼盘命名规则</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">

                    <!-- 规则编号 -->
                    <div class="form-group default">
                        <label class="col-sm-3 control-label no-padding-right" for="buildingNameRuleId">规则编号<span class="required">*</span></label>
                        <div class="col-sm-9">
                            <input type="text" id="buildingNameRuleId" class="col-xs-10 col-sm-5 v_required" maxlength="50" data-toggle="popover" data-trigger='manual' placeholder="请输入规则编号" data-i18n-ph="page.data.ph.ruleNo"/>
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <!-- 规则说明 -->
                    <div class="form-group default">
                        <label class="col-sm-3 control-label no-padding-right" for="ruleContent">规则说明<span class="required">*</span></label>
                        <div class="col-sm-9">
                            <input type="text" id="ruleContent" class="col-xs-10 col-sm-8 v_required" maxlength="200" data-toggle="popover" data-trigger='manual' placeholder="请输入规则说明" data-i18n-ph="page.data.ph.ruleExplain"/>
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <h5 class="header lighter blue">
                        <i class="icon-cog"></i>
                        规则构成（输入与连接符交替）
                    </h5>

                    <!-- 规则输入区域：5个下拉框并列显示 -->
                    <div class="form-group default">
                        <div class="col-sm-12">
                            <div style="display: table; width: 100%; table-layout: fixed;">
                                <div style="display: table-cell; padding: 0 3px 5px 0;">
                                    <select id="input1" class="rule-input form-control" style="width: 100%;"></select>
                                </div>
                                <div style="display: table-cell; padding: 0 3px 5px 0;">
                                    <select id="separator1" class="rule-separator form-control" style="width: 100%;"></select>
                                </div>
                                <div style="display: table-cell; padding: 0 3px 5px 0;">
                                    <select id="input2" class="rule-input form-control" style="width: 100%;"></select>
                                </div>
                                <div style="display: table-cell; padding: 0 3px 5px 0;">
                                    <select id="separator2" class="rule-separator form-control" style="width: 100%;"></select>
                                </div>
                                <div style="display: table-cell; padding: 0 3px 5px 0;">
                                    <select id="input3" class="rule-input form-control" style="width: 100%;"></select>
                                </div>
                                <div style="display: table-cell; padding: 0 3px 5px 0;">
                                    <select id="separator3" class="rule-separator form-control" style="width: 100%;"></select>
                                </div>
                                <div style="display: table-cell; padding: 0 3px 5px 0;">
                                    <select id="input4" class="rule-input form-control" style="width: 100%;"></select>
                                </div>
                                <div style="display: table-cell; padding: 0 3px 5px 0;">
                                    <select id="separator4" class="rule-separator form-control" style="width: 100%;"></select>
                                </div>
                                <div style="display: table-cell; padding: 0 3px 5px 0;">
                                    <select id="input5" class="rule-input form-control" style="width: 100%;"></select>
                                </div>
                                <div style="display: table-cell; padding: 0 3px 5px 0;">
                                    <select id="separator5" class="rule-separator form-control" style="width: 100%;"></select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <!-- 正则表达式（自动生成） -->
                    <div class="form-group default">
                        <label class="col-sm-3 control-label no-padding-right" for="ruleRegex">正则表达式</label>
                        <div class="col-sm-9">
                            <input type="text" id="ruleRegex" class="col-xs-10 col-sm-8" maxlength="500" data-toggle="popover" data-trigger='manual' placeholder="正则表达式自动生成" data-i18n-ph="page.data.ph.regexAuto" readonly style="background-color: #f5f5f5; font-family: monospace;"/>
                            <span class="help-inline col-sm-3" style="margin-left: 10px; color: #999;">自动生成</span>
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <!-- 规则示例（人类可读） -->
                    <div class="form-group default">
                        <label class="col-sm-3 control-label no-padding-right" for="ruleExample">示例说明</label>
                        <div class="col-sm-9">
                            <input type="text" id="ruleExample" class="col-xs-10 col-sm-8" maxlength="200" data-toggle="popover" data-trigger='manual' placeholder="例如：1A-门2座-3甲" data-i18n-ph="page.data.ph.exampleAddr" readonly style="background-color: #f5f5f5;"/>
                        </div>
                    </div>
                    <div class="space-4"></div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveCreateBtn" class="btn btn-primary">保存并绑定</button>
                <button type="button" id="cancelCreateBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/village4rule.js']);
</script>
