
<div >
    <div class="row">
        <div class="col-xs-12">
            <div id="taskParamCondList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="taskParamResultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="taskParamPagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

<div class="modal fade" id="addItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span
                        class="sr-only">Close</span></button>
                <h4 class="modal-title" id="editModalLabel">任务字段信息</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" id="from">

                    <div class="form-group">
                         <label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
                         <div class="col-sm-9">
                             <input type="text" id="name" maxlength="12" class="col-xs-10 col-sm-6 v_required"
                                    data-toggle="popover" data-trigger='manual'  />
                         </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="module">模块</label>
                        <div class="col-sm-9">
                            <select id="module" class='col-xs-10 col-sm-6'></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="type">类型</label>
                        <div class="col-md-9">
                            <select id="type" class='col-xs-10 col-sm-6'></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="oneType">一类</label>
                        <div class="col-md-9">
                            <select id="oneType" class='col-xs-10 col-sm-6'></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="unionField">关联</label>
                        <div class="col-sm-9">
                            <input type="text" id="unionField" class="col-xs-10 col-sm-6 v_required"
                                   data-toggle="popover" data-trigger='manual'  />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="unionParam">关联字段</label>
                        <div class="col-sm-9">
                            <select id="unionParam" class='col-xs-10 col-sm-6'></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="field">字段</label>
                        <div class="col-sm-9">
                            <input type="text" id="field" class="col-xs-10 col-sm-6 v_required"
                                   data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>

                     <div class="form-group">
                          <label class="col-sm-3 control-label no-padding-right" for="table">表名</label>
                          <div class="col-sm-9">
                              <input type="text" id="table" class="col-xs-10 col-sm-6 v_required"
                                      data-toggle="popover" data-trigger='manual'  />
                          </div>
                     </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="alias">别名</label>
                        <div class="col-sm-9">
                            <input type="text" id="alias" maxlength="12" class="col-xs-10 col-sm-6 v_required"
                                   data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="handle">处理过程</label>
                        <div class="col-sm-9">
                            <input type="text" id="handle" class="col-xs-10 col-sm-6 v_required"
                                   data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="sort">排序</label>
                        <div class="col-sm-9">
                            <input type="text" id="sort" maxlength="12" class="col-xs-10 col-sm-6 v_required v_number"
                                   data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="tableSort">表排序</label>
                        <div class="col-sm-9">
                            <input type="text" id="tableSort" maxlength="12" class="col-xs-10 col-sm-6 v_required v_number"
                                   data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="comment">说明</label>
                        <div class="col-sm-9">
                            <input type="text" id="comment" maxlength="12" class="col-xs-10 col-sm-6 v_required "
                                   data-toggle="popover" data-trigger='manual' />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="ismain">是否主要</label>
                        <div class="col-md-9">
                            <select id="ismain" class='col-xs-10 col-sm-6'></select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="editConfirmBtn" class="btn btn-primary">确认</button>
                <button type="button" id="editCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
  </div>
</div>

<div id="layerPopUp" class="portlet box"></div>
<script type="text/javascript">
    $.loadScript(['js/data/taskParam.js']);
</script>
