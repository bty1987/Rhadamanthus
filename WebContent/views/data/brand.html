
<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="brandModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="brandDialog">主材品牌</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_required" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="supplier">厂商</label>
							<div class="col-sm-9">
								<input type="text" id="supplier" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="category">品类</label>
							<div class="col-sm-9">
								<select id="category" class="col-xs-10 col-sm-5"></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="atttype" data-i18n="page.data.label.businessType">业务类型</label>
							<div class="col-sm-9">
								<select id="atttype" class="col-xs-10 col-sm-5"></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="numtype">选材量类型</label>
							<div class="col-sm-9">
								<select id="numtype" class="col-xs-10 col-sm-5"></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="agentName">代理</label>
							<div class="col-sm-9">
								<input type="text" id="agentName" class="col-xs-10 col-sm-5" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="agentPhone">电话</label>
							<div class="col-sm-9">
								<input type="text" id="agentPhone" class="col-xs-10 col-sm-5 v_phones" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group default finance hide">
							<label class="col-sm-3 control-label no-padding-right" for="kino" data-i18n="page.data.label.kingdeeNo">金蝶编号</label>
							<div class="col-sm-9">
								<input type="text" id="kino" class="col-xs-10 col-sm-5" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group default finance hide">
							<label class="col-sm-3 control-label no-padding-right" for="kiname" data-i18n="page.data.label.kingdeeName">金蝶名称</label>
							<div class="col-sm-9">
								<input type="text" id="kiname" class="col-xs-10 col-sm-5" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4 finance hide"></div>
						<div class="form-group">
							<label class="col-md-3 control-label no-padding-right" for="comment">说明</label>
							<div class="col-sm-9">
								<textarea class="col-xs-10 col-sm-5" id="comment" rows="3" cols="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
						
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="deliveryModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">销售配送-状态</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group" id="itemlist"></div>
					</form>
				</div>
				<div class="modal-footer ">
					<button type="button" id="saveDelivery" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>

		<div class="modal fade" id="selectionModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">销售材料-状态</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<div class="col-md-12">
								<p id="title" style="text-indent: 20px;"></p>
							</div>
						</div>
						<div class="form-group" id="selectionlist"></div>

					</form>
				</div>
				<div class="modal-footer ">
					<button type="button" id="saveSelection" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>
	
</div>

<div id="brandPopUp" class="portlet box page-content"></div>
<div id="supplierPopUp" class="portlet box"></div>
<div id="instorerPopUp" class="portlet box"></div>
<div id="remeasureformatPopUp" class="portlet box"></div>
<div id="brandProductPopUp" class="portlet box"></div>
<div id="brandDeliverPopUp" class="portlet box"></div>
<div id="brandInstallPopUp" class="portlet box"></div>
<div id="brandServerPopUp" class="portlet box"></div>

	$.loadScript(['js/utils/kingdeeUtils.js', 'js/data/brand.js']);
</script>
