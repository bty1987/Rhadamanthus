
<div id="paymentType">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="paymentTypeModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="paymentTypeDialog">款项类型</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal">
						<div class="col-md-12" id="saveInfo">
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right orange" for="name">名称</label>
								<div class="col-sm-9">
									<input type="text" id="name" class="col-xs-10 col-sm-5 v_required" maxlength="32" data-toggle="popover" data-trigger='manual'/>
								</div>
							</div>
							<div class="space-4"></div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="type">类型</label>
								<div class="col-sm-9">
									<select id="type" class="col-xs-10 col-sm-5"></select>
								</div>
							</div>
							<div class="space-4"></div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="paytype">付款类型</label>
								<div class="col-sm-9">
									<select id="paytype" class="col-xs-10 col-sm-5"></select>
								</div>
							</div>
							<div class="space-4"></div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="bustype">业务类型</label>
								<div class="col-sm-9">
									<select id="bustype" class="col-xs-10 col-sm-5"></select>
								</div>
							</div>
							<div class="space-4"></div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="atttype">属性类型</label>
								<div class="col-sm-9">
									<select id="atttype" class="col-xs-10 col-sm-5"></select>
								</div>
							</div>
							<div class="space-4"></div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="code">索引</label>
								<div class="col-sm-9">
									<select id="code" class="col-xs-10 col-sm-5"></select>
								</div>
							</div>
							<div class="space-4"></div>
						</div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="taxrate">税率</label>
								<div class="col-sm-9">
									<select id="taxrate" class="col-xs-10 col-sm-5"></select>
								</div>
							</div>
							<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kino">金蝶编号</label>
							<div class="col-sm-9">
								<input type="text" id="kino" class="col-xs-10 col-sm-5" maxlength="32" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kiname">金蝶名称</label>
							<div class="col-sm-9">
								<input type="text" id="kiname" class="col-xs-10 col-sm-5" maxlength="32" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kibalance">费用项目编码</label>
							<div class="col-sm-9">
								<input type="text" id="kibalance" class="col-xs-10 col-sm-5" maxlength="64" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/data/paymentType.js']);
</script>
