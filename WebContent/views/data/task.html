<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addtaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="addItemDialog">任务信息</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskName" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="filepath">执行文件的地址</label>
                            <div class="col-sm-9">
                                <input type="text" id="filepath" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="64"/>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="tasklevel">等级</label>
                            <div class="col-sm-9">
                                <select id="tasklevel" class="col-xs-10 col-sm-5 v_required" data-toggle="popover"data-trigger='manual'>
                                    <option value="0">功能级</option>
                                    <option value="1">模块级</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="tasktype">类型</label>
                            <div class="col-sm-9">
                                <select id="tasktype" class="col-xs-10 col-sm-5 v_required" data-toggle="popover"data-trigger='manual'>
                                    <option value="0">python</option>
                                    <option value="1">shell</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="handle">操作</label>
                            <div class="col-sm-9">
                                <select id="handle" class="col-xs-10 col-sm-5 v_required" data-toggle="popover"data-trigger='manual'>
                                    <option value="">全部</option>
                                    <option value="0">读</option>
                                    <option value="1">写</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="isShow">计划操作</label>
                            <div class="col-sm-9">
                                <select id="isShow" class="col-xs-10 col-sm-5 v_required" data-toggle="popover"data-trigger='manual'>
                                    <option value="0">允许手动执行计划</option>
                                    <option value="1">不允许手动执行计划</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group" >
                            <label class="col-sm-3 control-label no-padding-right orange" for="plugins" >配置</label>
                            <div class="col-sm-9">
                                <input type="text" id="plugins" class="col-xs-10 col-sm-5 v_required v_zhengze"data-toggle="popover" data-trigger='manual' maxlength="64" placeholder="例:A,B,C"/>
                            </div>
                        </div>

                        <div class="form-group" style="color:red">
                            <label  class="col-sm-3 control-label no-padding-right">配置选项:</label>
                        </div>

                        <div class="form-group" style="color:red">
                            <label  class="col-sm-4 control-label no-padding-right">A:时间区间</label>
                            <label  class="col-sm-2 control-label no-padding-right">B:月份区间</label>
                        </div>
                        <div class="form-group" style="color:red">
                            <label  class="col-sm-4 control-label no-padding-right">C:上传附件</label>
                            <label  class="col-sm-2 control-label " style="float: left">D:参数&nbsp;&nbsp;&nbsp;&nbsp;</label>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="addTaskBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelTaskBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="addtaskParamModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">参数</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">字段编号</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamtpid" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">任务编号</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamtid" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">编号</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamno" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">任务名</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamname" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">字段</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamparam" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">别名</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamalias" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">类型</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamtype" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>


                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">处理过程</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamhandle" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">状态</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamstatus" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">排序</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamsort" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="taskName">备注</label>
                            <div class="col-sm-9">
                                <input type="text" id="taskParamcomment" class="col-xs-10 col-sm-5 v_required"data-toggle="popover" data-trigger='manual' maxlength="32"/>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
<!--                    <button type="button" id="addTaskBtn" class="btn btn-default">保存</button>
                    <button type="button" id="cancelTaskBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                -->
                </div>
            </div>
        </div>
    </div>
</div>
<div id="stockRecordPopUp" class="portlet box page-content"></div>
<script type="text/javascript">
    $.loadScript(['js/data/task.js']);
</script>
