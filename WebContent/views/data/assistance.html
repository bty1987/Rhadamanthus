<div id="assistance">

    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
    
    <div class="modal fade" id="itemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"></button>
                    <h4 class="modal-title">帮助</h4>
                </div>
                <div class="modal-body">
                    <div class="form-group" id="itemlist"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="assistanceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">帮助</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="name">名称</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="name">
                            </div>
                        </div>
                        <div class="form-group serve">
                            <label class="col-md-3 control-label no-padding-right orange" for="keyword">关键字</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="keyword">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>

</div>

<div id="miniPopUp"></div>
<div id="layerPopUp" class="portlet box"></div>

<script type="text/javascript">
    $.loadScript(['js/data/assistance.js']);
</script>
