<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="soodsCondList" class="fl_search clearfix"></div>
            <div id="soodsResultList" class="clearfix tab-pane active col-xs-12"></div>
            <div id="soodsPagenation" class="fl-page-wrap clearfix col-xs-12">

                <div class="row" style="margin-top: 20px">
                    <div class="col-xs-12">
                        <a class="btn btn-minier btn-primary pull-left" id="addSoodsBtn" style="margin-right: 10px">
                            <i class="icon-plus bigger-110"></i>
                            <span>添加</span>
                        </a>
                        <a class="btn btn-minier" id="backQuoteItemBtn">
                            <i class="icon-mail-forward bigger-110"></i>
                            <span>返回</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="addSoodsModal" tabindex="-1">
        <div class="modal-dialog" style="margin-top: 10%;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="SaveModal">添加选材</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="goodsName">商品</label>
                            <div class="col-sm-9">
                                <input type="text" id="goodsName" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="num">数量</label>
                            <div class="col-sm-9">
                                <input type="text" id="num" class="col-xs-10 col-sm-5 v_required v_number" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="selling">售价</label>
                            <div class="col-sm-9">
                                <input type="text" id="selling" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                            </div>
                        </div>

                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" id="addSoodsItemBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="addCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="updateSoodsModal" tabindex="-1">
        <div class="modal-dialog" style="margin-top: 10%;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="updateModal">编辑选材</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="uSelling">售价</label>
                            <div class="col-sm-9">
                                <input type="text" id="uSelling" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                            </div>
                        </div>

                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" id="updateSoodsItemBtn" class="btn btn-primary">保存</button>
                    <button type="button" id="updateCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>

                </div>
            </div>
        </div>
    </div>

</div>


<script type="text/javascript">
    $.loadScript(['js/data/createSoods.js']);
</script>
