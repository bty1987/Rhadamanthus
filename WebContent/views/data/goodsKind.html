
<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="goodsKindModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="goodsKindDialog">类别信息</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="no">编号</label>
							<div class="col-sm-9">
								<input type="text" id="no" class="col-xs-10 col-sm-7 v_required" maxlength="16" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-7 v_required" maxlength="32" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="level">等级</label>
							<div class="col-sm-9">
								<select id="level" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
			
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="level">一级类别</label>
							<div class="col-sm-9">
								<select id="onekind" class="col-xs-10 col-sm-7 " data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="level">二级类别</label>
							<div class="col-sm-9">
								<select id="twokind" class="col-xs-10 col-sm-7 " data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
		        	<button type="button" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/data/goodsKind.js']);
</script>
