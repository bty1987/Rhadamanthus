<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="packageCondList" class="fl_search clearfix"></div>
            <div id="packageResultList" class="clearfix tab-pane active col-xs-12"></div>
            <div id="packagePagenation" class="fl-page-wrap clearfix col-xs-12"></div>
        </div>
    </div>
</div>

<!-- 添加/编辑套餐明细弹窗 -->
<div class="modal fade" id="addPackageModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 8%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title">
                    <i class="fa fa-cube orange"></i>
                    <span id="modalTitle">添加套餐商品</span>
                </h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                
                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right orange" for="companySelect">所属公司</label>
                        <div class="col-md-9">
                            <select id="companySelect" class="col-xs-10 col-sm-8 v_required" data-toggle="popover" data-trigger='manual'>
                                <option value="">请选择公司</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right orange" for="goodsName" data-i18n="page.data.label.goodsNameAlt">商品名称</label>
                        <div class="col-md-9">
                            <input type="text" id="goodsName" class="col-xs-10 col-sm-8 v_required v_typeahead"
                                   data-toggle="popover" data-trigger='manual' maxlength="64" placeholder="输入商品名称搜索"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right" for="goodsNo" data-i18n="page.data.label.goodsNo">商品编号</label>
                        <div class="col-md-9">
                            <input type="text" id="goodsNo" class="col-xs-10 col-sm-8" readonly placeholder="自动填充" data-i18n-ph="page.data.ph.autoFill"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right" for="category">品类</label>
                        <div class="col-md-9">
                            <input type="text" id="category" class="col-xs-10 col-sm-8" readonly placeholder="自动填充" data-i18n-ph="page.data.ph.autoFill"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right" for="brand">品牌</label>
                        <div class="col-md-9">
                            <input type="text" id="brand" class="col-xs-10 col-sm-8" readonly placeholder="自动填充" data-i18n-ph="page.data.ph.autoFill"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="colorSelect">颜色</label>
                        <div class="col-sm-9">
                            <select id="colorSelect" class="col-xs-10 col-sm-8 v_required" data-toggle="popover" data-trigger='manual'>
                                <option value="">请选择颜色</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="formatSelect">规格</label>
                        <div class="col-sm-9">
                            <select id="formatSelect" class="col-xs-10 col-sm-8 v_required" data-toggle="popover" data-trigger='manual'>
                                <option value="">请选择规格</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right orange">数量</label>
                        <div class="col-md-9">
                            <input type="text" class="col-xs-10 col-sm-8 v_float_3 v_required" id="num" data-toggle="popover" data-trigger='manual' placeholder="请输入数量">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right" data-i18n="page.data.label.sellPrice">售价</label>
                        <div class="col-md-9">
                            <input type="text" class="col-xs-10 col-sm-8 v_float_2" id="selling"
                                   placeholder="选填，单位：分">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" data-i18n="page.data.label.balanceType">结算类型</label>
                        <div class="col-sm-9">
                            <select id="ctypeSelect" class="col-xs-10 col-sm-8 v_required">
                                <option value="0">底价</option>
                                <option value="1">点位</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right" data-i18n="page.data.label.balanceValue">结算值</label>
                        <div class="col-md-9">
                            <input type="text" class="col-xs-10 col-sm-8 v_float_3 v_required" id="cvalue" placeholder="选填，根据结算类型填写对应的值">
                        </div>
                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="savePackageBtn" class="btn btn-primary">
                    <i class="fa fa-save"></i> 保存
                </button>
                <button type="button" class="btn btn-default" data-dismiss="modal">
                    <i class="fa fa-times"></i> 取消
                </button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/goods4package.js']);
</script>
