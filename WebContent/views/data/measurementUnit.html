<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="groupDialog">添加单位</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="measurement" >单位</label>
                            <div class="col-sm-9 controls">
                                <input type="text" class="hide" id="id" />
                                <input class='col-xs-10 col-sm-6 v_required' id='measurement'>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="unitDes">说明</label>
                            <div class="col-sm-9">
                                <textarea id="unitDes" maxlength="25" class="col-xs-10 col-sm-6" rows="2" style="resize: none"></textarea>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="measurementadd" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default"
                            data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
   $.loadScript(['js/data/measurementUnit.js']);
</script>
