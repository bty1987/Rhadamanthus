<div class="page-content">
	<div class="row">
		<div class="col-md-12">

			<div id="accountList"></div>

			<div class="hr hr-double" style="margin: 10px 0;"></div>

			<div id="accountForm" style="display: none;">
				<form class="form-horizontal">
					<input type="hidden" id="accountCaid">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right orange" for="accountType">账户类型</label>
						<div class="col-sm-9">
							<select class="col-xs-10 col-sm-6" id="accountType">
								<option value="0">对私(个人)</option>
								<option value="1" selected>对公(企业)</option>
							</select>
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="accountNo">证件号/信用代码</label>
						<div class="col-sm-9">
							<input type="text" id="accountNo" maxlength="64" class="col-xs-10 col-sm-6">
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right orange" for="accountName">户名</label>
						<div class="col-sm-9">
							<input type="text" id="accountName" maxlength="128" class="col-xs-10 col-sm-6 v_required">
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="accountPhone">联系电话</label>
						<div class="col-sm-9">
							<input type="text" id="accountPhone" maxlength="64" class="col-xs-10 col-sm-6">
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="accountAddress">地址</label>
						<div class="col-sm-9">
							<input type="text" id="accountAddress" maxlength="256" class="col-xs-10 col-sm-6">
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right orange" for="accountBank">开户银行</label>
						<div class="col-sm-9">
							<input type="text" id="accountBank" maxlength="128" class="col-xs-10 col-sm-6 v_required">
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right orange" for="accountBankno">银行账号</label>
						<div class="col-sm-9">
							<input type="text" id="accountBankno" maxlength="64" class="col-xs-10 col-sm-6 v_required">
						</div>
					</div>
					<div class="form-group">
						<div class="col-md-offset-3 col-md-9">
							<a class="btn btn-success btn-sm" id="accountSaveBtn">保存</a>
							<a class="btn btn-default btn-sm" id="accountCancelBtn">取消</a>
						</div>
					</div>
				</form>
			</div>

			<div class="form-group" id="accountAddBtnWrap" style="margin-top: 10px;">
				<a class="btn btn-primary btn-sm" id="accountAddBtn">添加账户</a>
			</div>

		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/data/customerAccount.js']);
</script>
