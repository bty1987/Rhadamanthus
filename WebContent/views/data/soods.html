<div class="row">
    <div class="col-xs-12">
        <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
        <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
        <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
    </div>
</div>

<div id="optPopUp" class="portlet box page-content"></div>

<div id="addLayer" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="formSoods">

            <div class="widget-main">
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">名称</label>
                            <div class="col-md-9">
                                <input type="text" class="col-xs-10 col-sm-7 v_required" id="name" name="name" data-required="1" data-toggle="popover" data-trigger='manual'>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">报价项</label>
                            <div class="col-md-9">
                                <select class="col-xs-10 col-sm-7 v_required" id="quote" name="quote" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">数量</label>
                            <div class="col-md-9">
                                <input type="text" class="col-xs-10 col-sm-7 v_required" id="num" name="num" data-required="1" data-toggle="popover" data-trigger='manual'>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-md-offset-3 col-md-9">
                                <a class="btn btn-success btn-sm" id="submitBtn" data-i18n="msg.submit">提交</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>

<div class="modal fade" id="addSoodsModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="SaveModal">添加选材</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right" for="soodsName">名称</label>
                        <div class="col-md-9">
                            <input type="text" id="soodsName" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="goodsName" data-i18n="page.data.label.goods">商品</label>
                        <div class="col-sm-9">
                            <input type="text" id="goodsName" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="format">规格</label>
                        <div class="col-sm-9">
                            <input type="text" id="format" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="num">数量</label>
                        <div class="col-sm-9">
                            <input type="text" id="soodsnum" class="col-xs-10 col-sm-5 v_required v_number" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>

                    <div class="form-group advance">
                        <label class="col-sm-3 control-label no-padding-right" for="selling" data-i18n="page.data.label.sellPrice">售价</label>
                        <div class="col-sm-9">
                            <input type="text" id="selling" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>

                    <div class="form-group advance">
                        <label class="col-sm-3 control-label no-padding-right" for="cost">成本</label>
                        <div class="col-sm-9">
                            <input type="text" id="cost" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>

                    <div class="form-group advance">
                        <label class="col-sm-3 control-label no-padding-right" for="balance" data-i18n="page.data.label.balancePrice">结算价</label>
                        <div class="col-sm-9">
                            <input type="text" id="balance" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>

                    <div class="form-group default">
                        <label class="col-sm-3 control-label no-padding-right" for="type">类型</label>
                        <div class="col-sm-9">
                            <select id="type" class="col-xs-10 col-sm-5"></select>
                        </div>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="withdrawBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="addCancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="updateSoodsModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="updateModal">编辑选材</h4>
            </div>
            
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right" for="uSoodsName">名称</label>

                            <input type="text" id="uSoodsName" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual' maxlength="32"/>

                    </div>
                    
                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right" for="uFormat">规格</label>
                        <div class="col-md-9">
                            <input type="text" id="uFormat" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual' maxlength="64"/>
                        </div>
                    </div>

                    <div class="form-group advance">
                        <label class="col-sm-3 control-label no-padding-right" for="uSelling" data-i18n="page.data.label.sellPrice">售价</label>
                        <div class="col-sm-9">
                            <input type="text" id="uSelling" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>

                    <div class="form-group advance">
                        <label class="col-sm-3 control-label no-padding-right" for="uCost">成本</label>
                        <div class="col-sm-9">
                            <input type="text" id="uCost" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>

                    <div class="form-group advance">
                        <label class="col-sm-3 control-label no-padding-right" for="uBalance" data-i18n="page.data.label.balancePrice">结算价</label>
                        <div class="col-sm-9">
                            <input type="text" id="uBalance" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>

                    <div class="form-group default">
                        <label class="col-sm-3 control-label no-padding-right" for="uType">类型</label>
                        <div class="col-sm-9">
                            <select id="uType" class="col-xs-10 col-sm-5"></select>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" id="updateSoodsItemBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="updateCancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="drawingModal"  tabindex="-1">
    <div class="modal-dialog" style="width:60%" >
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>

                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class=" col-sm-1" style="padding-top:2px;float: right; padding-right: 100px">

                </div>
            </div>
        </div>
    </div>
</div>

</div>

<div class="form-group hide" style="margin: 0px;" id="uploaddiv">
    <div id="fileUpload" class="hide">
        <label class="col-sm-3 control-label no-padding-right" for="attachment"></label>
        <div class="col-sm-9">
            <div id="attachment"></div>
            <input type="text" class="hidden" id="filePath"/>
        </div>
    </div>

    <label class="col-sm-3 control-label no-padding-right" for="executeDates"><strong data-i18n="page.data.label.executeDate">执行日期</strong></label>
    <div class="col-sm-9">
        <input class="date-picker v_required " id="executeDates" type="text" readonly="readonly"
               data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
    </div>

    <label class="col-sm-3 control-label no-padding-right" for="executeTimes"><strong data-i18n="page.data.label.executeTime">执行时间</strong></label>
    <div class="col-sm-9">
        <div class="bootstrap-timepicker">
            <input id="executeTimes" type="text" class="v_required"/>
        </div>
    </div>

    <label class="col-sm-3 control-label no-padding-right"></label>
    <div class="col-sm-9">
        <a class="btn btn-success btn-sm" id="importBtn" data-i18n="msg.import">导入</a>
        <a class="btn btn-sm" id="exportBtn" data-i18n="msg.export">导出</a>
    </div>
</div>
