<div class="row">
    <div class="col-xs-12">
        <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
        <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
        <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
    </div>
</div>

<div id="optPopUp" class="portlet box page-content"></div>

<div id="addLayer" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="formSoods">

            <div class="widget-main">
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">名称</label>
                            <div class="col-md-9">
                                <input type="text" class="col-xs-10 col-sm-7 v_required" id="name" name="name"
                                       data-required="1"
                                       data-toggle="popover" data-trigger='manual'>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">报价项</label>
                            <div class="col-md-9">
                                <select class="col-xs-10 col-sm-7 v_required" id="quote" name="quote" data-required="1"
                                        data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">数量</label>
                            <div class="col-md-9">
                                <input type="text" class="col-xs-10 col-sm-7 v_required" id="num" name="num"
                                       data-required="1" data-toggle="popover" data-trigger='manual'>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-md-offset-3 col-md-9">
                                <a class="btn btn-success btn-sm" id="submitBtn">提交</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>

<div class="modal fade" id="addSoodsModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="SaveModal">添加选材</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="goodsName">商品</label>
                        <div class="col-sm-9">
                            <input type="text" id="goodsName" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="num">数量</label>
                        <div class="col-sm-9">
                            <input type="text" id="soodsnum" class="col-xs-10 col-sm-5 v_required v_number" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="selling">售价</label>
                        <div class="col-sm-9">
                            <input type="text" id="selling" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>

                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="withdrawBtn" class="btn btn-primary">保存</button>
                <button type="button" id="addCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="updateSoodsModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="updateModal">编辑选材</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="uSelling">售价</label>
                        <div class="col-sm-9">
                            <input type="text" id="uSelling" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>

                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="updateSoodsItemBtn" class="btn btn-primary">保存</button>
                <button type="button" id="updateCancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>

            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="drawingModal"  tabindex="-1">
    <div class="modal-dialog" style="width:60%" >
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">选材图片信息</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="row-fluid">
                            <ul class="ace-thumbnails" id="soodsDrawing"></ul>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class=" col-sm-1" style="padding-top:2px;float: right; padding-right: 100px">
                    <a class="form-group" id = "soodsUpload"></a>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="quotationItemPopUp" class="portlet box"></div>
<script type="text/javascript">
            $.loadScript(['js/data/soods.js']);
</script>
