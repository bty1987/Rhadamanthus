<div id="constructionPaceNode">
    <div class="row">
        <div class="col-xs-12">
            <div id="nodeCondList" class="fl_search clearfix"></div>
            <!-- 查询条件-->
            <div id="nodeResultList" class="clearfix tab-pane active"></div>
            <!--查询结果-->
            <div id="nodePagenation" class="fl-page-wrap clearfix"></div>
            <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addConstructionPaceNodeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="constructionPaceNodeDialog">施工计划</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="name">名称</label>
                            <div class="col-sm-9">
                                <input type="text" id="name" class="col-xs-10 col-sm-7 v_required" maxlength="32" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>
                        
                        <div class="form-group">
	                        <label for="no" class="col-sm-3 control-label no-padding-right orange">施工节点</label>
	                        <div class="col-md-9">
	                            <select id="nodes" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual"></select>
	                        </div>
	                    </div>
	                    <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="connum">工程天数</label>
                            <div class="col-sm-9">
                                <input type="text" id="connum" class="col-xs-10 col-sm-7 v_required v_afloat_3" maxlength="12" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="comnum">主材天数</label>
                            <div class="col-sm-9">
                                <input type="text" id="comnum" class="col-xs-10 col-sm-7 v_required v_afloat_3" maxlength="12" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="prenum">前置间隔天数</label>
                            <div class="col-sm-9">
                                <input type="text" id="prenum" class="col-xs-10 col-sm-7 v_required v_afloat_3" maxlength="12" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="postnum">后置间隔天数</label>
                            <div class="col-sm-9">
                                <input type="text" id="postnum" class="col-xs-10 col-sm-7 v_required v_afloat_3" maxlength="12" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="phase">施工节点</label>
                            <div class="col-sm-9">
                                <input type="text" id="phase" class="col-xs-10 col-sm-7" maxlength="32" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="material">配套主材</label>
                            <div class="col-sm-9">
                                <input type="text" id="material" class="col-xs-10 col-sm-7" maxlength="32" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right " for="period">进场周期</label>
                            <div class="col-sm-9">
                                <input type="text" id="period" class="col-xs-10 col-sm-7" maxlength="32" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="content">说明</label>
                            <div class="col-sm-9">
                                <textarea type="text" id="content" class="col-xs-10 col-sm-7 v_required" maxlength="512" data-toggle="popover" data-trigger='manual'></textarea>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="comment">注释</label>
                            <div class="col-sm-9">
                                <textarea type="text" id="comment" class="col-xs-10 col-sm-7 v_required" maxlength="512" data-toggle="popover" data-trigger='manual'></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/constructionPaceNode.js']);
</script>
