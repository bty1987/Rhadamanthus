<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="receiptTypeModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="rtId">收据类型</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" id="form1">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="name">收据类型名称</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="name" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="no">键值</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="no" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="type">类型</label>
							<div class="col-sm-9">
								<select  maxlength="64" id="type" class="col-xs-10 col-sm-6  v_required" data-toggle="popover" data-trigger='manual'>
									<option value="1">现金</option>
									<option value="2">刷卡</option>
									<option value="3">银行</option>
									<option value="4">对公账户</option>
									<option value="5">券</option>
								</select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="grade">等级</label>
							<div class="col-sm-9">
								<select class="col-sm-6 col-xs-10" id="grade" data-toggle="popover" data-trigger='manual'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kino">金蝶编号</label>
							<div class="col-sm-9">
								<input type="text" id="kino" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kiname">金蝶名称</label>
							<div class="col-sm-9">
								<input type="text" id="kiname" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="assistant">辅核项</label>
							<div class="col-sm-9">
								<input type="text" id="assistant" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="assistant">POS值</label>
							<div class="col-sm-9">
								<input type="text" id="value" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="space-4"></div>

					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelreceiptTypeBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>


</div>

<script type="text/javascript">
   $.loadScript(['js/data/receiptType.js']);
</script>
