
<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="addModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="myModalLabel" data-i18n="page.data.label.projectNode">工程节点</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="name">工程节点名称</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="name" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="updateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="myModalLabel">更新</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="name">工程节点名称</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="name" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="precheck">开工验证款比例</label>
                            <div class="col-sm-9">
                                <input type="text" maxlength="64" id="precheck" class="col-xs-10 col-sm-6 v_float_3" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>
                        
                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="postcheck">完工验证款比例</label>
                            <div class="col-sm-9">
                                <input type="text" maxlength="64" id="postcheck" class="col-xs-10 col-sm-6 v_float_3" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="precheck">开工销售比例</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="stacheck" class="col-xs-10 col-sm-6 v_float_3" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="postcheck">完工销售比例</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="fincheck" class="col-xs-10 col-sm-6 v_float_3" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="postcheck">辅料总额限制</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="accessoryLimit" class="col-xs-10 col-sm-6 v_float_3" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="postcheck">工费总额限制</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="salaryLimit" class="col-xs-10 col-sm-6 v_float_3" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="startalk">开工话术</label>
							<div class="col-sm-9">
								<textarea maxlength="64" id="startalk" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="endtalk">完工话术</label>
							<div class="col-sm-9">
								<textarea maxlength="64" id="endtalk" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>
						<div class="space-4"></div>


						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="cityProperSel">开工调研模版</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-6" id="startSurvey" ></select>
							</div>
						</div>
						<div class="space-4"></div>


						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="cityProperSel">完工调研模版</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-6" id="endSurvey" ></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="process">进度</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-6" id="process" ></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="proset">预派</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-6" id="proset" ></select>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="timeLimit" data-i18n="page.data.label.workDay">工期</label>
							<div class="col-sm-9">
								<input type="text" maxlength="64" id="timeLimit" class="col-xs-10 col-sm-6 v_float_3" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kino" data-i18n="page.data.label.kingdeeNo">金蝶编号</label>
							<div class="col-sm-9">
								<input type="text" id="kino" maxlength="32" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kiname" data-i18n="page.data.label.kingdeeName">金蝶名称</label>
							<div class="col-sm-9">
								<input type="text" id="kiname" maxlength="32" class="col-xs-10 col-sm-6" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="space-4"></div>
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="cityProperSel">工程标识</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-6" id="mark" ></select>
							</div>
						</div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="updateBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
	$.loadScript(['js/data/constructionNode.js']);
</script>
