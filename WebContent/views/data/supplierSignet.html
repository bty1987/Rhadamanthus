<div class="modal fade" id="layerAdd" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span>&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="aid">添加签章</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal" novalidate="novalidate" id="signetModal">

					<div class="form-group">
						<label for="name" class="col-sm-3 control-label no-padding-right orange">编号</label>
						<div class="col-sm-8">
							<input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="no">
						</div>
					</div>

					<div class="form-group">
						<label for="name" class="col-sm-3 control-label no-padding-right orange">名称</label>
						<div class="col-sm-8">
							<input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="name">
						</div>
					</div>
					<div class="form-group">
						<label for="name" class="col-sm-3 control-label no-padding-right orange">法人</label>
						<div class="col-sm-8">
							<input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="corporation">
						</div>
					</div>
					<div class="form-group">
						<label for="name" class="col-sm-3 control-label no-padding-right orange">税号</label>
						<div class="col-sm-8">
							<input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="taxNo">
						</div>
					</div>
					<div class="form-group">
						<label for="name" class="col-sm-3 control-label no-padding-right orange">地址</label>
						<div class="col-sm-8">
							<input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="address">
						</div>
					</div>
					<div class="form-group">
						<label for="name" class="col-sm-3 control-label no-padding-right orange">电话</label>
						<div class="col-sm-8">
							<input type="text" class="col-xs-8 m-wrap v_required v_phone" maxlength="32" id="phone">
						</div>
					</div>
					<div class="form-group">
						<label for="name" class="col-sm-3 control-label no-padding-right orange">开户行</label>
						<div class="col-sm-8">
							<input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="bankName">
						</div>
					</div>
					<div class="form-group">
						<label for="name" class="col-sm-3 control-label no-padding-right orange">账号</label>
						<div class="col-sm-8">
							<input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="bankNo">
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right orange" for="relationshipType">类型</label>
						<div class="col-sm-8">
							<select class="col-xs-8 m-wrap v_required" id="type"></select>
						</div>
					</div>

					<div class="form-group">
						<label for="name" class="col-sm-3 control-label no-padding-right orange">关键字</label>
						<div class="col-sm-8">
							<input type="text" class="col-xs-8 m-wrap v_required" maxlength="64" id="keyword">
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right orange" for="path">图片路径</label>
						<div class="col-sm-9">
							<input type="text" id="path" class="col-xs-10 col-sm-7" data-toggle="popover" data-trigger='manual' readonly />
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right"></label>
						<div class="col-sm-9">
							<div style="height: 150px;">
								<img id="signetImg" />
							</div>
						</div>
					</div>

					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right"></label>
						<div class="col-sm-9" id="upload">
							<div id="pictureUpload"></div>
						</div>
					</div>

					<div class="form-group" style="text-align: center">
						<button type="button" id="submitBtn" class="btn btn-primary pull-right">确定</button>
					</div>
				</form>
			</div>
		</div>
	</div>

</div>
