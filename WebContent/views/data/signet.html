<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
</div>

<div id="layerAdd" class="page-content"  style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="signetModal">
        
            <div class="form-group">
                 <label for="name" class="col-sm-3 control-label no-padding-right orange">编号</label>
                 <div class="col-sm-8">
                     <input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="no">
                 </div>
            </div>
            
            <div class="form-group">
                 <label for="name" class="col-sm-3 control-label no-padding-right orange">名称</label>
                 <div class="col-sm-8">
                     <input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="name">
                 </div>
            </div>
            
            <div class="form-group">
				 <label class="col-sm-3 control-label no-padding-right orange" for="relationshipType">类型</label>
				 <div class="col-sm-9">
					  <select class="col-xs-10 col-sm-6 v_required" id="type"></select>
				 </div>
			</div>
            
            <div class="form-group">
                 <label for="name" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.data.label.keyword">关键字</label>
                 <div class="col-sm-8">
                     <input type="text" class="col-xs-8 m-wrap v_required" maxlength="64" id="keyword">
                 </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right orange" for="path">图片路径</label>
                <div class="col-sm-9">
                    <input type="text" id="path" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' readonly/>
                </div>
            </div>

            <div class="form-group">
                 <label class="col-sm-3 control-label no-padding-right"></label>
                 <div class="col-sm-9">
                     <div style="height: 150px;">
                           <img id="signetImg"/>
                       </div>
                 </div>
            </div>
            
            <div class="form-group">
                 <label class="col-sm-3 control-label no-padding-right"></label>
                <div class="col-sm-9" id="upload">
                    <div id="pictureUpload"></div>
                </div>
            </div>
               
            <div class="form-group col-xs-12">
                <button type="button" id="saveBtn" class="btn btn-primary pull-right" data-i18n="msg.ok">确定</button>
            </div>
        </form>
    </div>
</div>
