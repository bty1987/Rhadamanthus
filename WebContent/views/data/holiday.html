<div id="holiday">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="holidayModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="holidayDialog">假期</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal">
						<div class="col-md-12" id="saveInfo">
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right orange" for="startTime">开始时间</label>
								<div class="col-sm-9">
									<input class="date-picker-date col-xs-10 col-sm-8 v_required" id="startTime" type="text" readonly="readonly" data-date-format="yyyy-mm-dd" data-type="datePicker" data-toggle="popover" data-trigger='manual'/>
								</div>
							</div>
							<div class="space-4"></div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right orange" for="endTime">结束时间</label>
								<div class="col-sm-9">
									<input class="date-picker-date col-xs-10 col-sm-8 v_required" id="endTime" type="text" readonly="readonly" data-date-format="yyyy-mm-dd" data-type="datePicker" data-toggle="popover" data-trigger='manual'/>
								</div>
							</div>
							<div class="space-4"></div>
							
							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="atttype">业务类型</label>
								<div class="col-sm-9">
									<select class="col-xs-10 col-sm-6" id="atttype" ></select>
								</div>
							</div>
							<div class="space-4"></div>
						</div>
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/data/holiday.js']);
</script>
