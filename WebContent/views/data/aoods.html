                            <div class="col-md-9">
                                <input type="text" class="col-xs-10 col-sm-7 v_float_3 v_required" id="balance" name="balance" data-required="1" data-toggle="popover" data-trigger='manual'>

                            <label class="col-md-3 control-label no-padding-right orange">售价</label>
                            <div class="col-md-9">
                                <input type="text" class="col-xs-10 col-sm-7 v_float_3 v_required" id="selling" name="balance" data-required="1" data-toggle="popover" data-trigger='manual'>

                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="constructionNode">工程节点</label>
                            <div class="col-sm-9">
                                <select id="constructionNode" class="col-xs-10 col-sm-7" data-toggle="popover" data-trigger='manual'></select>

                        <div class="col-sm-9">
                            <select  id="storeunit" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>
         
                    <div class="form-group">
                    	<label class="col-md-3 control-label no-padding-right orange">库房数量</label>
                    	<div class="col-md-9">
                        	<input type="text" class="col-xs-10 col-sm-6 v_float_3 v_required" id="storenum" name="storenum" data-required="1" data-toggle="popover" data-trigger='manual'>
                    	</div>
                	</div>

                            <div class="col-md-offset-3 col-md-9">
                                <a class="btn btn-success btn-sm" id="submitBtn">提交</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
