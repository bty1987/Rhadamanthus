<div class="row">
    <div class="col-xs-12">
        <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
        <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
        <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
    </div>
</div>

<div id="addLayer" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="formAoods">
            <div class="widget-main">
                <div class="row" style="margin: 0px;">
                    <div class="col-md-11">

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">名称</label>
                            <div class="col-md-9">
                                <input type="text" class="col-xs-10 col-sm-7 v_required" id="name" name="name" data-required="1" data-toggle="popover" data-trigger='manual'>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">辅类</label>
                            <div class="col-md-9">
                                <select class="col-xs-10 col-sm-7 v_required" id="accessoriesType" name="accessoriesType" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange">归属公司</label>
                            <div class="col-md-9">
                                <select class="col-xs-10 col-sm-7 v_required" id="bcompany" name="bcompany" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-md-offset-3 col-md-9">
                                <a class="btn btn-success btn-sm" id="submitBtn">提交</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<div id="editLayer" class="page-content" style="display: none;">
    <div class="row">
        <form class="form-horizontal" novalidate="novalidate" id="editAoods">

            <div class="widget-main">

                <div class="form-group">
                    <label class="col-md-3 control-label no-padding-right">辅类</label>
                    <div class="col-md-9">
                        <select class="col-xs-10 col-sm-7" id="editAccessoriesType" name="editAccessoriesType" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                    </div>
                </div>

<!--                <div class="form-group">-->
<!--                    <label class="col-md-3 control-label no-padding-right">验证标识</label>-->
<!--                    <div class="col-md-9">-->

<!--                    </div>-->
<!--                </div>-->

                <div class="form-group">
                    <label class="col-md-3 control-label no-padding-right">归属公司</label>
                    <div class="col-md-9">
                        <input type="text" class="col-xs-10 col-sm-7" id="old" name="old" data-required="1" readonly="readonly" data-toggle="popover" data-trigger='manual'>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-md-3 control-label no-padding-right">修改归属公司</label>
                    <div class="col-md-9">
                        <select class="col-xs-10 col-sm-7" id="editBcompany" name="editBcompany" data-required="1" data-toggle="popover" data-trigger='manual'></select>
                    </div>
                </div>

                <div class="form-group">
                    <div class="col-md-offset-3 col-md-9">
                        <a class="btn btn-success btn-sm" id="editBtn">提交</a>
                    </div>
