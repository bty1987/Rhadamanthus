<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div>
            <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div>
            <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div>
            <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="chatingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                        <span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">话术</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="title">标题</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap v_required" maxlength="32" id="title">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right" for="content">内容</label>
                            <div class="col-sm-8">
                                <textarea  class="col-xs-8" id="content" rows="3" cols="3"></textarea>

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="type">类型</label>
                            <div class="col-sm-8">
                                <select class="col-xs-8 m-wrap v_required" id="type"></select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right orange" for="atttype">业务类型</label>
                            <div class="col-sm-8">
                                <select class="col-xs-8 m-wrap v_required" id="atttype"></select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-3 control-label no-padding-right" for="path">路径</label>
                            <div class="col-sm-8">
                                <input type="text" class="col-xs-8 m-wrap" id="path">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
    $.loadScript(['js/data/chating.js']);
</script>
