<div id="brandPoolPageContent">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div>
			<div id="resultList" class="clearfix tab-pane active"></div>
			<div id="pagenation" class="fl-page-wrap clearfix"></div>
		</div>
	</div>

	<div class="modal fade" id="brandPoolModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="brandPoolDialog">品牌池</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_required" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="category">品类</label>
							<div class="col-sm-9">
								<select id="category" class="col-xs-10 col-sm-5"></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-md-3 control-label no-padding-right" for="comment">说明</label>
							<div class="col-sm-9">
								<textarea class="col-xs-10 col-sm-5" id="comment" rows="3" cols="3"></textarea>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
<script type="text/javascript">
	$.loadScript(['js/data/brandPool.js']);
</script>
