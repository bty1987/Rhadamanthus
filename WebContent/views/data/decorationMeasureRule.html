<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div id="layerPopUp" class="portlet box page-content"></div> <!-- 明细弹窗 -->

	<div class="modal fade" id="addModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="modalTitle">装修区域分支规则</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" id="form1">

						<input type="hidden" id="dmrid" />

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" maxlength="32" id="name" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="comment">说明</label>
							<div class="col-sm-9">
								<textarea maxlength="128" id="comment" class="col-xs-10 col-sm-6" rows="3" data-toggle="popover" data-trigger='manual'></textarea>
							</div>
						</div>

					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>

</div>
