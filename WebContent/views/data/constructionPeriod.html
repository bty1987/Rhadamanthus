<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="periodCondList" class="fl_search clearfix"></div>
            <div id="periodResultList" class="clearfix tab-pane active"></div>
            <div id="periodPagenation" class="fl-page-wrap clearfix"></div>
        </div>
    </div>

    <div class="modal fade" id="updatePeriodModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title">工程周期</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="name">名称</label>
                            <div class="col-sm-9">
                                <input id="name" type="text" class="col-xs-12 col-sm-7" />
                            </div>
                        </div>

                        <div class="form-group hide">
                            <label class="col-sm-3 control-label no-padding-right" for="typeness">类型</label>
                            <div class="col-sm-9">
                                <select id="typeness" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" style="min-width: 50%; width: 230px;" data-trigger='manual'></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="upperArea">上面积</label>
                            <div class="col-sm-9">
                                <input id="upperArea" type="text" class="col-xs-12 col-sm-7 v_required " />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="lowerArea">下面积</label>
                            <div class="col-sm-9">
                                <input id="lowerArea" type="text" class="col-xs-12 col-sm-7 v_required " />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="period">周期</label>
                            <div class="col-sm-9">
                                <input id="period" type="text" class="v_required col-xs-12 col-sm-7 v_required" />
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id=saveBtn class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="periodPopUp" class="portlet box page-content"></div>

<script type="text/javascript">
    $.loadScript(['js/data/constructionPeriod.js']);
</script>
