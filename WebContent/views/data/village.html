
<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="villageModal" tabindex="-1">
		<div class="modal-dialog"  >
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="villageDialog">楼盘</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<div class="col-xs-12">
							<form class="form-horizontal">
								<div class="col-md-12">
									<div class="form-group" id="parentVillageDiv">
										<label class="col-sm-3 control-label no-padding-right" for="parentVillage">上级楼盘</label>
										<div class="col-sm-9">
											<input class="col-xs-10 col-sm-6 v_name" maxlength="20" type="text" id="parentVillage" />
										</div>
									</div>

									<div class="form-group" id ="nodiv">
										<label class="col-sm-3 control-label no-padding-right" for="no">楼盘编号</label>
										<div class="col-sm-9">
											<input type="text" id="no" maxlength="10" class="col-xs-10 col-sm-6 v_required v_no" />
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right orange" for="villagename">楼盘名称</label>
										<div class="col-sm-9">
											<input class="col-xs-10 col-sm-6 v_required v_name" maxlength="20" type="text" id="villagename" />
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right orange" for="nameRuleSel">楼号规则</label>
										<div class="col-sm-9">
											<select class="col-xs-10 col-sm-6 v_required" id="nameRuleSel" ></select>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right orange" for="citySel">所在城市</label>
										<div class="col-sm-9">
											<select class="col-xs-10 col-sm-6 v_required" id="citySel" ></select>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right orange" for="cityProperSel">所在城区</label>
										<div class="col-sm-9">
											<select class="col-xs-10 col-sm-6 v_required" id="cityProperSel" ></select>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="developer">开发商</label>
										<div class="col-sm-9">
											<input type="text" id="developer" maxlength="20" class="col-xs-10 col-sm-6" />
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="salesPhone">售楼电话</label>
										<div class="col-sm-9">
											<input type="text" id="salesPhone" maxlength="15" class="col-xs-10 col-sm-6 v_number" />
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="deliveryTime">交付时间</label>
										<div class="col-sm-9">
											<div class="input-group col-xs-10 col-sm-6 no-padding">
												<input class="col-sm-12" id="deliveryTime" type="text" data-date-format="yyyy-mm-dd"  />
											</div>
										</div>
									</div>

									<div class="form-group">
										<label class="col-md-3 control-label no-padding-right">公里数</label>
										<div class="col-md-9">
											<input type="text" class="col-xs-10 col-sm-6 v_float_3" id="mileage" name="mileage" data-required="1" data-toggle="popover" data-trigger='manual'>
										</div>
									</div>

									<div class="form-group">
										<label class="col-sm-3 control-label no-padding-right" for="content">说明</label>
										<div class="col-sm-9">
											<textarea id="content" maxlength="512" class="col-xs-10 col-sm-6" rows="3" ></textarea>
										</div>
									</div>

								</div>
							</form>
						</div>
					</div>
				</div>

				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>

			</div>
		</div>
	</div>


	<div class="modal fade" id="mapModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">楼盘地址</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" id="mapForm">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="no">楼盘编号</label>
							<div class="col-sm-9">
								<input disabled type="text" name="no" maxlength="10" class="col-xs-10 col-sm-6 v_required v_no" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right orange" for="name">楼盘名称</label>
							<div class="col-sm-9">
								<input disabled class="col-xs-10 col-sm-6 v_required v_name" maxlength="20" type="text" name="name" id="name" data-toggle="popover" data-trigger='manual'/>
								<button type="button" id="placeBtn" class="btn btn-success" style="padding: 2px 12px;">确定位置</button>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group" style="display: none">
							<label class="col-sm-3 control-label no-padding-right" for="city">城市名称</label>
							<div class="col-sm-9">
								<input disabled class="col-xs-10 col-sm-6 v_required v_name" id="city" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group" id="mapContainer"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" name="resetPositionBtn" class="btn btn-warning">重选位置</button>
					<button type="button" name="resetMapBtn" class="btn btn-success">重新加载地图</button>
					<button type="button" id="saveMapBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="cancelMapBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="drawingModal"  tabindex="-1">
		<div class="modal-dialog" style="width:60%" >
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title">楼盘图片信息</h4>
				</div>
				<div class="modal-body">
					<div class="row">
							<div class="col-xs-12">
								<div class="row-fluid">
									<ul class="ace-thumbnails" id="villageDrawing"></ul>
								</div>
							</div>
					</div>
				</div>
				<div class="modal-footer">
					<div class=" col-sm-1" style="padding-top:2px;float: right; padding-right: 100px">
						<a class="form-group" id = "villageUpload"></a>
					</div>
				</div>
			</div>
		</div>
	</div>

</div>

<div id="villagePopUp1" class="portlet box page-content"></div>
<div id="villagePopUp" class="portlet box page-content"></div>
