<div class="row">
    <div id="condListCharge" class="fl_search clearfix"></div> <!-- 查询条件-->
    <div id="resultListCharge" class="clearfix tab-pane active"></div> <!--查询结果-->
    <div id="pagenationCharge" class="fl-page-wrap clearfix" style="text-align: center;max-width: 680px;"></div><!--分页-->
</div>


<div style="margin-top: -6.7%">
    <a class="btn btn-minier btn-success pull-left" id="addBtn" style="margin-top: -2px; margin-left: 4px;">
        <i class="icon-plus bigger-110"></i>
        <span>添加</span>
    </a>
    <a class="btn btn-minier btn-warning pull-left" id="importChargeBtn" style="margin-top: -2px; margin-left: 4px;">
        <i class="icon-cloud-upload bigger-110"></i>
        <span data-i18n="msg.import">导入</span>
    </a>
    <a class="btn btn-minier btn-primary pull-left" id="backBtn" style="margin-top: -2px; margin-left: 4px;">
        <i class="icon-mail-forward "></i>
        <span data-i18n="msg.back">返回</span>
    </a>
</div>

<div id="addAoodsCharge" class="page-content" style="display: none;">
    <form class="form-horizontal" novalidate="novalidate" id="formAoodsCharge">

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange">费用名称</label>
            <div class="col-md-9">
                <input type="text" class="col-xs-10 col-sm-7 v_required" id="name" name="name" maxlength="100"
                       data-required="1" data-toggle="popover" data-trigger='manual' placeholder="请输入费用名称" data-i18n-ph="page.data.ph.feeName"/>
            </div>
        </div>

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange">价格</label>
            <div class="col-md-9">
                <input type="text" class="col-xs-10 col-sm-7 v_float_3 v_required" id="price" name="price" data-required="1"
                       data-toggle="popover" data-trigger='manual' placeholder="请输入价格（元）" data-i18n-ph="page.data.ph.priceYuan"/>
            </div>
        </div>

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right">浮动额</label>
            <div class="col-md-9">
                <input type="text" class="col-xs-10 col-sm-7 v_float_3" id="surplus" name="surplus"
                       data-toggle="popover" data-trigger='manual' placeholder="请输入浮动额（元）" data-i18n-ph="page.data.ph.floatYuan"/>
            </div>
        </div>

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange">费用类型</label>
            <div class="col-md-9">
                <select class="col-xs-10 col-sm-7 v_required" id="type" name="type" data-required="1"
                        data-toggle="popover" data-trigger='manual'>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange">状态</label>
            <div class="col-md-9">
                <select class="col-xs-10 col-sm-7 v_required" id="status" name="status" data-required="1"
                        data-toggle="popover" data-trigger='manual'>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right">排序</label>
            <div class="col-md-9">
                <input type="text" class="col-xs-10 col-sm-7 v_int" id="sort" name="sort"
                       data-toggle="popover" data-trigger='manual' placeholder="请输入排序号" data-i18n-ph="page.data.ph.sortNum"/>
            </div>
        </div>

        <div class="form-group">
            <div class="col-md-offset-3 col-md-9">
                <a class="btn btn-success btn-sm" id="confirmBtn" data-i18n="msg.ok">确定</a>
            </div>
        </div>

    </form>
</div>

<div id="importChargeModal" class="page-content" style="display: none;">
    <form class="form-horizontal" novalidate="novalidate" id="importChargeForm">
        <div class="form-group alert alert-danger">
            <p>上传字段: 费用名称, 价格(元), 浮动额(元), 费用类型(通用/超阶), 状态(启用/禁用), 排序</p>
            <p>第一行为表头, 将被跳过</p>
        </div>
        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange" data-i18n="page.data.label.executeDate">执行日期</label>
            <div class="col-md-9">
                <input type="text" class="col-xs-10 col-sm-7" id="executeDateCharge" name="executeDateCharge" readonly="readonly" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange" data-i18n="page.data.label.executeTime">执行时间</label>
            <div class="col-md-9">
                <input type="text" class="col-xs-10 col-sm-7" id="executeTimeCharge" name="executeTimeCharge" readonly="readonly" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange">导入文件</label>
            <div class="col-md-9">
                <input type="file" id="chargeFileUpload" name="chargeFileUpload" />
                <input type="hidden" id="chargeFilePath" name="chargeFilePath" />
            </div>
        </div>
        <div class="form-group">
            <div class="col-md-offset-3 col-md-9">
                <a class="btn btn-success btn-sm" id="importChargeConfirmBtn">确定导入</a>
            </div>
        </div>
    </form>
</div>
