<div style="margin-top: -6.7%">

<div id="addAoodsCharge" class="page-content" style="display: none;">
    <form class="form-horizontal" novalidate="novalidate" id="formAoodsCharge">

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange">费用名称</label>

                <input type="text" class="col-xs-10 col-sm-7 v_required" id="name" name="name" maxlength="100"
                       data-required="1" data-toggle="popover" data-trigger='manual' placeholder="请输入费用名称"/>
            </div>
        </div>

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange">价格</label>

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right">浮动额</label>

                <input type="text" class="col-xs-10 col-sm-7 v_float_3" id="surplus" name="surplus"

        </div>

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange">费用类型</label>
            <div class="col-md-9">
                <select class="col-xs-10 col-sm-7 v_required" id="type" name="type" data-required="1"
                        data-toggle="popover" data-trigger='manual'>
                </select>

        </div>

        <div class="form-group">
            <label class="col-md-3 control-label no-padding-right orange">状态</label>
            <div class="col-md-9">
                <select class="col-xs-10 col-sm-7 v_required" id="status" name="status" data-required="1"
                        data-toggle="popover" data-trigger='manual'>

        <div class="form-group">

            <div class="col-md-9">
                <input type="text" class="col-xs-10 col-sm-7 v_int" id="sort" name="sort"

            <div class="col-md-offset-3 col-md-9">
