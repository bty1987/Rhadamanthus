<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="constant" tabindex="-1" role="dialog" aria-labelledby="moduleDialog" aria-hidden="true" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content col-md-12">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span>
						<span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="constantDialog">常量</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal" role="form">

						<div class="form-group hide">
							<label class="col-sm-3 control-label no-padding-right" for="cid">常量</label>
							<div class="col-sm-9">
								<input type="text" id="cid" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_required " data-toggle="popover" data-trigger='manual' maxlength='64' />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">模块</label>
							<div class="col-sm-9">
								<input type="text" class="m-wrap col-xs-10 col-sm-5" maxlength="32" id="module" />
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right">对象</label>
							<div class="col-sm-9">
								<input type="text" class="m-wrap col-xs-10 col-sm-5" maxlength="32" id="clazz" />
							</div>
						</div>

						<div class="form-group">
							<label for="type" class="col-sm-3 control-label no-padding-right">类型</label>
							<div class="col-sm-9">
								<input type="text" class="m-wrap col-xs-10 col-sm-5" maxlength="32" id="type" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label for="field" class="col-sm-3 control-label no-padding-right">字段名</label>
							<div class="col-sm-9">
								<input type="text" class="m-wrap col-xs-10 col-sm-5" maxlength="32" id="field" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label for="key" class="col-sm-3 control-label no-padding-right">键</label>
							<div class="col-sm-9">
								<input type="text" class="m-wrap col-xs-10 col-sm-5" maxlength="32" id="key" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label for="value" class="col-sm-3 control-label no-padding-right">值</label>
							<div class="col-sm-9">
								<input type="text" class="m-wrap col-xs-10 col-sm-5" maxlength="32" id="value" />
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="status">状态</label>
							<div class="col-sm-9">
								<select class="col-xs-10 col-sm-5 v_required" id="status"></select>
							</div>
						</div>
						<div class="space-4"></div>

					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
				</div>
			</div>
		</div>
	</div>
	
</div>

<script type="text/javascript">
	$.loadScript(['js/data/constant.js']);
</script>
