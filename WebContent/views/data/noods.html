<div>
	<div class="row">
		<div class="col-xs-12">
	        <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
	        <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
	        <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
	    </div>
	</div>

	<div class="modal fade" id=updateNoodsModal tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span><span class="sr-only">Close</span>
					</button>
					<h4 class="modal-title" id="noodsDialog">编辑定材</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right " for="name">名称</label>
							<div class="col-sm-9">
								<input type="text" id="name" class="col-xs-10 col-sm-5 v_name v_required" data-toggle="popover" data-trigger='manual' maxlength="30"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right " for="selling">售价</label>
							<div class="col-sm-9">
								<input type="text" id="selling" class="col-xs-10 col-sm-5 v_name v_required" data-toggle="popover" data-trigger='manual' maxlength="30"/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right " for="balance">结算价</label>
							<div class="col-sm-9">
								<input type="text" id="balance" class="col-xs-10 col-sm-5 v_name v_required" data-toggle="popover" data-trigger='manual' maxlength="30"/>
							</div>
						</div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right " for="balance">浮动量</label>
							<div class="col-sm-9">
								<input type="text" id="surplus" class="col-xs-10 col-sm-5 v_name v_required" data-toggle="popover" data-trigger='manual' maxlength="30"/>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
<script type="text/javascript">
	$.loadScript(['js/data/noods.js']);
</script>
