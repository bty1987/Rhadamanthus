<div id="materialSubOrderPageContent">
	<div>
		<div class="row">
			<div class="col-xs-12">
				<!-- 查询条件-->
				<div id="creatLine" class="fl_search clearfix"></div>
				<!--查询结果-->
				<div id="resultList" class="clearfix tab-pane active"></div>
				<!--分页-->
				<div id="pageTalking" class="fl-page-wrap clearfix"></div>
			</div>
		</div>

		<div class="modal fade" id="talkingModal" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal">
							<span>&times;</span><span class="sr-only">Close</span>
						</button>
						<h4 class="modal-title" id="myModalLabel">话术</h4>
					</div>
					<div class="modal-body"> 
					
						<form class="form-horizontal">

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
								<div class="col-sm-9">
									<input type="text" id="name" maxlength="32" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' />
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-3 control-label no-padding-right" for="type">类型</label>
								<div class="col-sm-9">
									<select class="span6 m-wrap col-xs-7 v_required" id="type" data-required="1" data-toggle="popover" data-trigger='manual'></select>
								</div>
							</div>

							<div class="form-group">
								<label for="backOrderContent" class="col-sm-3 control-label no-padding-right">内容</label>
								<div class="col-sm-9">
									<textarea class="span6 m-wrap col-xs-7 v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="128" id="content"></textarea>
								</div>
							</div>

						</form>

					</div>
					<div class="modal-footer">
						<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.ok">确定</button>
						<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript([ 'js/data/talking.js' ]);
</script>
