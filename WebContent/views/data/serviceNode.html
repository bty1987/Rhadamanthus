<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="serviceNodeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="myModalLabel">服务节点</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal">

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="serviceNodeName">节点名称</label>
                            <div class="col-sm-9">
                                <input type="text" maxlength="64" id="serviceNodeName" class="col-xs-10 col-sm-6 v_name v_required" data-toggle="popover" data-trigger='manual'/>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="serviceNodeType">节点类型</label>
                            <div class="col-sm-9">
                                <select class="col-xs-10 col-sm-6 v_type v_required" id="serviceNodeType"></select>
                            </div>
                        </div>
                        <div class="space-4"></div>
                         <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="serviceNodePsnid">上级节点</label>
                            <div class="col-sm-9">
                              <!--   <select class="col-xs-10 col-sm-6 v_type v_required" id="serviceNodePsnid"></select> --> 
                               <input type="text" id="serviceNodePsnid" maxlength="12" class="col-xs-10 col-sm-6 v_required v_anumber" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="serviceNodeAttnode">业务节点</label>
                            <div class="col-sm-9">
                                   <select class="col-xs-10 col-sm-6 v_type v_required" id="serviceNodeAttnode"></select>
                            </div>
                        </div>
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="serviceNodeUserType">人员类型</label>
                            <div class="col-sm-9">
                               <!-- <select class="col-xs-10 col-sm-6 v_type v_required" id="serviceNodeUserType"></select> --> 
                                <input type="text" id="serviceNodeUserType" maxlength="12" class="col-xs-10 col-sm-6 v_required v_anumber" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="serviceNodeBlankNum">间隔天数</label>
                            <div class="col-sm-9">
                                <input type="text" id="serviceNodeBlankNum" maxlength="12" class="col-xs-10 col-sm-6 v_required v_anumber" data-toggle="popover" data-trigger='manual' />
                            </div>
                        </div>
                        
                        <div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="serviceNodeWorkNum">工期天数</label>
                            <div class="col-sm-9">
                                <input type="text" id="serviceNodeWorkNum" maxlength="12" class="col-xs-10 col-sm-6 v_required v_anumber" data-toggle="popover" data-trigger='manual' />

                            </div>
                        </div>

                       <div class="space-4"></div>


                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right orange" for="serviceNodeLoop">是否循环</label>               
                            <div class="col-sm-9">
                               <input type="radio" name="serviceNodeLoop" value="1" class="ace" />
                                <span class="lbl"></span>
                                <label data-i18n="msg.yes">是</label>
                               <input type="radio" name="serviceNodeLoop" value="0" class="ace" />
                                <span class="lbl"></span>
                                <label data-i18n="msg.no">否</label>
                           </div>
                        </div>
                        
                        <div class="space-4"></div>

                        <div class="form-group" >
                            <label class="col-md-3 control-label no-padding-right" for="serviceNodeDetail" >详述</label>
                            <div class="col-md-9">
                                <textarea id="serviceNodeDetail" class="col-md-6 v_name v_required" rows="3" data-toggle="popover" data-trigger='manual' maxlength="40"></textarea>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/serviceNode.js']);
</script>
