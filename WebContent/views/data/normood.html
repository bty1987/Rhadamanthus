<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="normoodCondList" class="fl_search clearfix"></div>
            <div id="normoodResultList" class="clearfix tab-pane active col-xs-12"></div>
            <div id="normoodPagenation" class="fl-page-wrap clearfix col-xs-12"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="addNormoodModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="SaveModal">添加定额材料</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    
                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right orange" for="noodsName">名称</label>
                        <div class="col-md-9">
                            <input type="text" id="noodsName" class="col-xs-10 col-sm-6 v_required v_typeahead" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="normunit">定额单位</label>
                        <div class="col-sm-9">
                            <select  id="normunit" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"></select>
                        </div>
                    </div>
      
                    <div class="form-group">
                    	<label class="col-md-3 control-label no-padding-right orange">定额数量</label>
                    	<div class="col-md-9">
                        	<input type="text" class="col-xs-10 col-sm-6 v_float_3 v_required" id="normnum" name="normnum" data-required="1" data-toggle="popover" data-trigger='manual'>
                    	</div>
                	</div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="storeunit">库房单位</label>
                        <div class="col-sm-9">
                            <select  id="storeunit" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"></select>
                        </div>
                    </div>
         
                    <div class="form-group">
                    	<label class="col-md-3 control-label no-padding-right orange">库房数量</label>
                    	<div class="col-md-9">
                        	<input type="text" class="col-xs-10 col-sm-6 v_float_3 v_required" id="storenum" name="storenum" data-required="1" data-toggle="popover" data-trigger='manual'>
                    	</div>
                	</div>
                	
                	<div class="form-group">
                    	<label class="col-md-3 control-label no-padding-right orange">价格</label>
                    	<div class="col-md-9">
                        	<input type="text" class="col-xs-10 col-sm-6 v_float_3 v_required" id="price" name="price" data-required="1" data-toggle="popover" data-trigger='manual'>
                    	</div>
                	</div>
                    
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="addNormoodItemBtn" class="btn btn-primary">保存</button>
                <button type="button" id="CancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/normood.js']);
</script>
