<div class="col-xs-12">
    <div id="normoodCondList" class="fl_search clearfix"></div>
    <div id="normoodResultList" class="clearfix"></div>
    <div id="normoodPagenation" class="fl-page-wrap clearfix">
        <a class="btn btn-minier btn-primary pull-left" id="addNormoodBtn" style="margin-right: 10px">
            <i class="icon-plus bigger-110"></i>
            <span>添加</span>
        </a>
        <a class="btn btn-minier" id="normoodBackBtn">
            <i class="icon-mail-forward bigger-110"></i>
            <span>返回</span>
        </a>
    </div>
</div>

<div class="modal fade" id="addNormoodModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="SaveModal">添加定额材料</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="goodsName">商品</label>
                        <div class="col-sm-9">
                            <input type="text" id="goodsName" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"/>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="unit">定额单位</label>
                        <div class="col-sm-9">
                            <select  id="unit" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="num">使用数量</label>
                        <div class="col-sm-9">
                            <input type="text" id="num" class="col-xs-10 col-sm-5 v_required v_number" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="addNormoodItemBtn" class="btn btn-primary">保存</button>
                <button type="button" id="CancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/normood.js']);
</script>
