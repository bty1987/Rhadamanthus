<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="normoodCondList" class="fl_search clearfix"></div>
            <div id="normoodResultList" class="clearfix tab-pane active col-xs-12"></div>
            <div id="normoodPagenation" class="fl-page-wrap clearfix col-xs-12"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="addNormoodModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="SaveModal">添加定额材料</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    
                    <div class="form-group">
                        <label class="col-md-3 control-label no-padding-right orange" for="noodsName">名称</label>
                        <div class="col-md-9">
                            <input type="text" id="noodsName" class="col-xs-10 col-sm-6 v_required v_typeahead" data-toggle="popover" data-trigger='manual' maxlength="32"/>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="normunit" data-i18n="page.data.label.quotaUnit">定额单位</label>
                        <div class="col-sm-9">
                            <select  id="normunit" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>
      
                    <div class="form-group">
                    	<label class="col-md-3 control-label no-padding-right orange" data-i18n="page.data.label.quotaNum">定额数量</label>
                    	<div class="col-md-9">
                        	<input type="text" class="col-xs-10 col-sm-6 v_float_3 v_required" id="normnum" name="normnum" data-required="1" data-toggle="popover" data-trigger='manual'>
                    	</div>
                	</div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="storeunit" data-i18n="page.data.label.storeUnit">库房单位</label>
                        <div class="col-sm-9">
                            <select  id="storeunit" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>
         
                    <div class="form-group">
                    	<label class="col-md-3 control-label no-padding-right orange" data-i18n="page.data.label.storeNum">库房数量</label>
                    	<div class="col-md-9">
                        	<input type="text" class="col-xs-10 col-sm-6 v_float_3 v_required" id="storenum" name="storenum" data-required="1" data-toggle="popover" data-trigger='manual'>
                    	</div>
                	</div>
                	
                	<div class="form-group">
                    	<label class="col-md-3 control-label no-padding-right orange">价格</label>
                    	<div class="col-md-9">
                        	<input type="text" class="col-xs-10 col-sm-6 v_float_3 v_required" id="price" name="price" data-required="1" data-toggle="popover" data-trigger='manual'>
                    	</div>
                	</div>
                    
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="addNormoodItemBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="CancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<!-- 导入定额材料模态框 -->
<div class="modal fade" id="importNormoodModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title">导入定额材料</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">

                    <!-- 导入格式说明 -->
                    <div class="form-group alert alert-info">
                        <p><strong>导入格式说明:</strong></p>
                        <p>名称/报价项ID/定材ID/定额单位/定额量/库房单位/库房量/价格</p>
                        <p style="color: #999;" data-i18n="page.data.hint.uploadFormat">注意: 上传文件中请填写具体内容, 不显示表头</p>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="quotationVersion" data-i18n="page.data.label.quotationVersion">报价版本</label>
                        <div class="col-sm-9">
                            <select id="quotationVersion" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="attachment">上传文件</label>
                        <div class="col-sm-9">
                            <div id="attachment"></div>
                            <input type="text" class="hidden" id="filePath"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="executeDates" data-i18n="page.data.label.executeDate">执行日期</label>
                        <div class="col-sm-9">
                            <input class="date-picker v_required" id="executeDates" type="text" readonly="readonly"
                                   data-date-format="yyyy-mm-dd" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="executeTimes" data-i18n="page.data.label.executeTime">执行时间</label>
                        <div class="col-sm-9">
                            <div class="bootstrap-timepicker">
                                <input id="executeTimes" type="text" class="v_required"/>
                            </div>
                        </div>
                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="confirmImportBtn" class="btn btn-success" data-i18n="msg.import">导入</button>
                <button type="button" id="cancelImportBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/utils/planUtils.js','js/data/normood.js']);
</script>
