<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>

	<div class="modal fade" id="buildingNameRuleModal" tabindex="-1">
		<div class="modal-dialog" style="width: 800px;">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title" id="buildingNameRuleDialog">楼盘命名规则</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="buildingNameRuleId">规则编号<span class="required">*</span></label>
							<div class="col-sm-9">
								<input type="text" id="buildingNameRuleId" class="col-xs-10 col-sm-5 v_required" maxlength="50" data-toggle="popover" data-trigger='manual' placeholder="请输入规则编号"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="rule">规则<span class="required">*</span></label>
							<div class="col-sm-9">
								<input type="text" id="rule" class="col-xs-10 col-sm-5 v_required" maxlength="100" data-toggle="popover" data-trigger='manual' placeholder="请输入规则"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="ruleExample">规则示例</label>
							<div class="col-sm-9">
								<input type="text" id="ruleExample" class="col-xs-10 col-sm-5" maxlength="100" data-toggle="popover" data-trigger='manual' placeholder="请输入规则示例"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="ruleContent">规则内容<span class="required">*</span></label>
							<div class="col-sm-9">
								<input type="text" id="ruleContent" class="col-xs-10 col-sm-5 v_required" maxlength="200" data-toggle="popover" data-trigger='manual' placeholder="请输入规则内容"/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group default">
							<label class="col-sm-3 control-label no-padding-right" for="rulefill">规则填充</label>
							<div class="col-sm-9">
								<input type="text" id="rulefill" class="col-xs-10 col-sm-5" maxlength="200" data-toggle="popover" data-trigger='manual' placeholder="请输入规则填充"/>
							</div>
						</div>
						<div class="space-4"></div>

					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/buildingNameRule.js']);
</script>
