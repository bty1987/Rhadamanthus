
<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span><span class="sr-only">Close</span>
                    </button>
                    <h4 class="modal-title" id="groupDialog">添加放线小组</h4>
                </div>

                <div class="modal-body">
                    <form class="form-horizontal">
                      
                        <div class="form-group">
                        
                            <label class="col-sm-3 control-label no-padding-right" for="drawLineGroup" >放线小组</label>
                            <div class="col-sm-9 controls" id="gid">                              
                                <input  type="text" class='col-xs-10 col-sm-6 span6 m-wrap popovers v_drawlingroup' id='drawLineGroup' placeholder="请输入放线小组" data-toggle="popover"/> 	                                                                           
                            </div>
                        </div>

                        <div class="form-group">
                        
                            <label class="col-sm-3 control-label no-padding-right" for="contentadd">说明</label>
                            <div class="col-sm-9">
                                <textarea id="contentadd" maxlength="125" class="col-xs-10 col-sm-6" rows="3" style="resize: none"></textarea>
                            </div>
                        </div>
                        <div class="form-group" id="status"></div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" id="groupadd" class="btn btn-primary">保存</button>
                    <button type="button" id="cancelBtn" class="btn btn-default"
                            data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
   $.loadScript(['js/data/drawlineGroup.js']);
</script>
