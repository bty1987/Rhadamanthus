<div>
	<div class="row">
		<div class="col-xs-12">

			<div id="resultList" class="clearfix tab-pane active"></div>
			
			<div class="row" style="margin-left:30px;margin-right:30px">
				<div id="list" style="margin-left:10px"></div>

				<h3 class="clearfix">
					<a class="btn btn-minier btn-primary pull-left" id="addBtn"><i
						class=" icon-plus"></i>添加</a>
				</h3>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="chainPageModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title" id="myModalLabel">添加外链</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal">
					<div class="form-group">
						<label class="col-sm-4 control-label no-padding-right orange" for="names">外链名称:</label>
						<div class="col-sm-8">
							<input type="text" id="names" class="col-xs-10 col-sm-6 v_required"  maxlength="64" data-toggle="popover" data-trigger='manual' />
						</div>
					</div>

					<div class="space-4"></div>

					<div class="form-group">
						<label class="col-sm-4 control-label no-padding-right" for="url">外链地址:</label>
						<div class="col-sm-8">
							<input type="text" id="url" class="col-xs-10 col-sm-6 v_required"  data-toggle="popover" data-trigger='manual' maxlength="512"/>
						</div>
					</div>
					<div class="space-4"></div>

					<div class="form-group">
					<label class="col-sm-4 control-label no-padding-right" for="comment">外链说明:</label>
					<div class="col-sm-8">
						<textarea id="comment" maxlength="256" class="col-xs-10 col-sm-6" rows="3"></textarea>
					</div>
				</div>
					<div class="space-4"></div>
					<div class="form-group">
					<label class="col-sm-4 control-label no-padding-right" for="comment">公司标识:</label>
					<div class="col-sm-8">
						<input type="checkbox" id="companymark" class="ace ace-switch ace-switch-5"/>
						<span class="lbl status-lbl"></span>
					</div>
				</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
   $.loadScript(['js/data/chainpage.js']);
</script>
