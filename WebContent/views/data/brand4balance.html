<div id="fl-statement">
    <div class="page-header">
        <h1>品牌<small><i class="icon-double-angle-right"></i>结算</small></h1>
    </div>
</div>
    
<div class="row">
    <div class="col-xs-12">
        <div class="row" style="margin-left:10px;margin-right:10px">
            <div id="list"></div>
            <div>
                <div>
                    <a class="btn btn-minier btn-primary pull-left" id="addBrandBalanceBtn" style="margin-top: 7px;margin-left: 2px"><i class="icon-plus bigger-110"></i>添加</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addbrandBalanceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="aid">结算</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal">
                            <div class="row">
                                <div class="col-md-12">

                                    <div class="form-group">
                                        <label for="name" class="col-sm-3 control-label no-padding-right orange">名称</label>
                                        <div class="col-md-9">
                                            <input type="text" id="name" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-3 control-label no-padding-right orange">类型</label>
                                        <div class="col-md-9">
                                            <select id='ctype' class='col-xs-10 col-sm-6 v_required'></select>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="cvalue" class="col-sm-3 control-label no-padding-right orange" data-i18n="page.data.label.balanceValue">结算值</label>
                                        <div class="col-md-9">
                                            <input type="text" id="cvalue" class="col-xs-10 col-sm-6 v_float v_required" data-toggle="popover" data-trigger='manual'/>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="comment" class="col-sm-3 control-label no-padding-right">说明</label>
                                        <div class="col-md-9">
                                            <textarea id="comment" class="col-xs-10 col-sm-6" rows="6" cols="6" data-toggle="popover" data-trigger='manual'></textarea>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtns" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/brand4balance.js']);
</script>
