<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
</div>

<div id="layerAdd" class="page-content" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="addContract">
        
            <div class="form-group">
                 <label for="name" class="col-sm-3 control-label no-padding-right orange">编号</label>
                 <div class="col-sm-8">
                     <input type="text" id="no" class="col-xs-8 m-wrap v_required" maxlength="32">
                 </div>
            </div>
            
            <div class="form-group">
                 <label for="name" class="col-sm-3 control-label no-padding-right orange">名称</label>
                 <div class="col-sm-8">
                     <input type="text" id="name" class="col-xs-8 m-wrap v_required" maxlength="32">
                 </div>
            </div>
            
            <div class="form-group">
                 <label for="name" class="col-sm-3 control-label no-padding-right orange">标题</label>
                 <div class="col-sm-8">
                     <input type="text" id="title" class="col-xs-8 m-wrap v_required" maxlength="64">
                 </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right orange" for="path">页面</label>
                <div class="col-sm-9">
                    <select id='page'  class="col-xs-10 col-sm-7"></select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right orange" for="path">文件路径</label>
                <div class="col-sm-9">
                    <input type="text" id="path" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' readonly/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right orange" for="videopath">视频路径</label>
                <div class="col-sm-9">
                    <input type="text" id="videopath" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' readonly/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right" for="noticePath">须知文件</label>
                <div class="col-sm-9">
                    <input type="text" id="noticePath" class="col-xs-10 col-sm-7" data-toggle="popover" data-trigger='manual' readonly/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right"></label>
                <div class="col-sm-9" id="uploadNotice">
                    <div id="noticeUpload"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right orange" for="path">业务类型</label>
                <div class="col-sm-9">
                    <select id='atttype'  class="col-xs-10 col-sm-7"></select>
                </div>
            </div>

            <div class="form-group">
                 <label class="col-sm-3 control-label no-padding-right"></label>
                <div class="col-sm-9" id="upload">
                    <div id="fileUpload"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right"></label>
                <div class="col-sm-9" id="uploadVideo">
                    <div id="videoUpload"></div>
                </div>
            </div>
               
            <div class="form-group col-xs-12">
                <button type="button" id="saveBtn" class="btn btn-primary pull-right">确定</button>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/contract.js']);
</script>
