<style>
    /* 厂商单选: 药丸按钮式(原生radio隐藏保留选中语义, label原生toggle); 禁用态=编辑锁定 */
    .provider-radio { display: inline-block; margin: 0 10px 0 0; cursor: pointer; }
    .provider-radio input { display: none; }
    .provider-radio span {
        display: inline-block; padding: 5px 18px; border-radius: 16px;
        border: 1px solid #d5d5d5; background: #fff; color: #555;
        font-size: 13px; line-height: 18px; user-select: none;
        transition: all .15s ease;
    }
    .provider-radio:hover span { border-color: #2679b5; color: #2679b5; }
    .provider-radio input:checked + span {
        background: #2679b5; border-color: #2679b5; color: #fff;
        box-shadow: 0 1px 3px rgba(38, 121, 181, .35);
    }
    .provider-radio input:disabled + span { opacity: .55; border-color: #d5d5d5; color: #555; background: #f5f5f5; cursor: not-allowed; }
    .provider-radio input:disabled + span:hover { border-color: #d5d5d5; color: #555; }
</style>

<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
            <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
            <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
        </div>
    </div>
</div>

<div id="layerAdd" class="page-content" style="display: none;">
    <div class="row-fluid">
        <form class="form-horizontal" novalidate="novalidate" id="addContract">
        
            <div class="form-group">
                 <label for="name" class="col-sm-3 control-label no-padding-right orange">编号</label>
                 <div class="col-sm-8">
                     <input type="text" id="no" class="col-xs-8 m-wrap v_required" maxlength="32">
                 </div>
            </div>
            
            <div class="form-group">
                 <label for="name" class="col-sm-3 control-label no-padding-right orange">名称</label>
                 <div class="col-sm-8">
                     <input type="text" id="name" class="col-xs-8 m-wrap v_required" maxlength="32">
                 </div>
            </div>
            
            <div class="form-group">
                 <label for="name" class="col-sm-3 control-label no-padding-right orange">标题</label>
                 <div class="col-sm-8">
                     <input type="text" id="title" class="col-xs-8 m-wrap v_required" maxlength="64">
                 </div>
            </div>

            <div class="form-group">
                 <label class="col-sm-3 control-label no-padding-right orange">厂商</label>
                 <div class="col-sm-8" style="padding-top: 4px;" id="vendor">
                     <label class="provider-radio"><input type="radio" name="vendor" value="1" checked><span>法大大(文件上传)</span></label>
                     <label class="provider-radio"><input type="radio" name="vendor" value="2"><span>e签宝(流程模板)</span></label>
                 </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right orange" for="path">页面</label>
                <div class="col-sm-9">
                    <select id='page'  class="col-xs-10 col-sm-7"></select>
                </div>
            </div>

            <div class="form-group" id="esignTipRow" style="display: none;">
                <label class="col-sm-3 control-label no-padding-right"></label>
                <div class="col-sm-9" style="padding-top: 5px;">
                    <div style="margin-bottom: 6px;">
                        流程模板通过e签宝<b style="color: orange;">免登页面</b>创建/维护(无需e签宝账号登录, 链接30分钟内有效):
                        上传底稿PDF → 添加填写控件与签章区 → 保存后自动跳回落点页完成建档。
                        也可在e签宝官网控制台创建后, 将<b style="color: orange;">流程模板ID</b>填入上方<b style="color: orange;">编号</b>栏保存。
                    </div>
                    <button type="button" id="esignConsoleBtn" class="btn btn-primary btn-minier">
                        <i class="icon-external-link"></i> 创建流程模板(免登)
                    </button>
                    <button type="button" id="esignEditBtn" class="btn btn-yellow btn-minier" style="display: none;">
                        <i class="icon-edit"></i> 编辑流程模板(免登)
                    </button>
                    <span style="color: #999; margin-left: 8px;">模板定稿后勿再修改(跨企业自动签署授权随模板修改失效, 需重新发起授权)</span>
                </div>
            </div>

            <div class="form-group" id="pathRow">
                <label class="col-sm-3 control-label no-padding-right orange" for="path">文件路径</label>
                <div class="col-sm-9">
                    <input type="text" id="path" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' readonly/>
                </div>
            </div>

            <div class="form-group" id="videoRow">
                <label class="col-sm-3 control-label no-padding-right orange" for="videopath">视频路径</label>
                <div class="col-sm-9">
                    <input type="text" id="videopath" class="col-xs-10 col-sm-7 v_required" data-toggle="popover" data-trigger='manual' readonly/>
                </div>
            </div>

            <div class="form-group" id="noticePathRow">
                <label class="col-sm-3 control-label no-padding-right" for="noticePath">须知文件</label>
                <div class="col-sm-9">
                    <input type="text" id="noticePath" class="col-xs-10 col-sm-7" data-toggle="popover" data-trigger='manual' readonly/>
                </div>
            </div>

            <div class="form-group" id="uploadNoticeRow">
                <label class="col-sm-3 control-label no-padding-right"></label>
                <div class="col-sm-9" id="uploadNotice">
                    <div id="noticeUpload"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label no-padding-right orange" for="path" data-i18n="page.data.label.businessType">业务类型</label>
                <div class="col-sm-9">
                    <select id='atttype'  class="col-xs-10 col-sm-7"></select>
                </div>
            </div>

            <div class="form-group" id="uploadRow">
                <label class="col-sm-3 control-label no-padding-right"></label>
                <div class="col-sm-9" id="upload">
                    <div id="fileUpload"></div>
                </div>
            </div>

            <div class="form-group" id="uploadVideoRow">
                <label class="col-sm-3 control-label no-padding-right"></label>
                <div class="col-sm-9" id="uploadVideo">
                    <div id="videoUpload"></div>
                </div>
            </div>
               
            <div class="form-group col-xs-12">
                <button type="button" id="saveBtn" class="btn btn-primary pull-right" data-i18n="msg.ok">确定</button>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/contract.js']);
</script>
