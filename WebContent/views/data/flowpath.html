<div class="row">
    <div class="col-xs-12">
        <div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
        <div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
        <div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
    </div>
</div>

<div class="modal fade" id="addFlowpath" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="SaveModal">添加流程</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="name">名称</label>
                        <div class="col-sm-9">
                            <input type="text" id="name" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="no">编号</label>
                        <div class="col-sm-9">
                            <input type="text" id="no" class="col-xs-10 col-sm-5 v_required v_number" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="keyword" data-i18n="page.data.label.keyword">关键字</label>
                        <div class="col-sm-9">
                            <input type="text" id="keyword" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="type">类型</label>
                        <div class="col-sm-9">
                            <input type="text" id="type" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>

                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="withdrawBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="addCancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="updateFlowpath" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="updateModal">编辑流程</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="fpid">流程ID</label>
                        <div class="col-sm-9">
                            <input type="text" id="fpid" class="col-xs-10 col-sm-5  v_float_3" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="fname">名称</label>
                        <div class="col-sm-9">
                            <input type="text" id="fname" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>


                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="fno">编号</label>
                        <div class="col-sm-9">
                            <input type="text" id="fno" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="fkeyword" data-i18n="page.data.label.keyword">关键字</label>
                        <div class="col-sm-9">
                            <input type="text" id="fkeyword" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right" for="ftype">类型</label>
                        <div class="col-sm-9">
                            <input type="text" id="ftype" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual' maxlength="5"/>
                        </div>
                    </div>

                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="updateBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="updateCancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>

            </div>
        </div>
    </div>
</div>
<div id="flowpathPopUp" class="portlet box page-content"></div>
<script type="text/javascript">
    $.loadScript(['js/data/flowpath.js']);
</script>
