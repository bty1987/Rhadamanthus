<div class="col-xs-12">
    <div id="normriceCondList" class="fl_search clearfix"></div>
    <div id="normriceResultList" class="clearfix"></div>
    <div id="normricePagenation" class="fl-page-wrap clearfix">
        <a class="btn btn-minier btn-primary pull-left" id="addNormriceBtn" style="margin-right: 3px">
            <i class="icon-plus bigger-110"></i>
            <span>添加</span>
        </a>
        <a class="btn btn-minier" id="normriceBackBtn">
            <i class="icon-mail-forward bigger-110"></i>
            <span>返回</span>
        </a>
    </div>
</div>

<div class="modal fade" id="addNormriceModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="SaveModal">添加定额工费</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="constructionNode">工程节点</label>
                        <div class="col-sm-9">
                            <select id="constructionNode" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"></select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="unit">定额单位</label>
                        <div class="col-sm-9">
                            <select  id="unit" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"></select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="trannum">转换量</label>
                        <div class="col-sm-9">
                            <input type="text" id="trannum" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="salary">工费</label>
                        <div class="col-sm-9">
                            <input type="text" id="salary" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="addNormriceItemBtn" class="btn btn-primary">保存</button>
                <button type="button" id="CancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/normrice.js']);
</script>
