<div>
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="categoryModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title" id="categoryDialog">主材品类</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal">
		      			<div class="form-group" hidden="true">
							<label class="col-sm-3 control-label no-padding-right" for="cId">ID</label>
							<div class="col-sm-9">
								<input type="text" id="cId" class="col-xs-10 col-sm-5" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
		      		
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="no">编号</label>
							<div class="col-sm-9">
								<input type="text" id="no" class="col-xs-10 col-sm-5 v_required v_categoryId" maxlength="10" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
						
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="categoryName">名称</label>
							<div class="col-sm-9">
								<input type="text" id="categoryName" class="col-xs-10 col-sm-5 v_required v_name" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label no-padding-right" for="type">类型</label>
                            <div class="col-sm-9">
                                <select id='type' class='col-xs-10 col-sm-5'></select>
                            </div>
                        </div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="isCoupon">券标识</label>
							<div class="col-sm-9">
								<select id='isCoupon' class='col-xs-10 col-sm-5'></select>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="isCount">统计标识</label>
							<div class="col-sm-9">
								<select id='isCount' class='col-xs-10 col-sm-5'></select>
							</div>
						</div>
                        <div class="space-4"></div>
                        
                        <div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="isLimit">选材控制</label>
							<div class="col-sm-9">
								<select id='isLimit' class='col-xs-10 col-sm-5'></select>
							</div>
						</div>
                        <div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kino" data-i18n="page.data.label.kingdeeNo">金蝶编号</label>
							<div class="col-sm-9">
								<input type="text" id="kino" class="col-xs-10 col-sm-5" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>

						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="kiname" data-i18n="page.data.label.kingdeeName">金蝶名称</label>
							<div class="col-sm-9">
								<input type="text" id="kiname" class="col-xs-10 col-sm-5" maxlength="30" data-toggle="popover" data-trigger='manual'/>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
		        	<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>

<!-- 品类规格维护弹窗:规格为该品类的规格可选范围(约束商品-整装创建与功能区品类规格) -->
<style>
	#categoryFormatList .cell-input {
		width: 100%; height: auto; padding: 0; margin: 0;
		border: none; background: transparent; box-shadow: none; outline: none;
	}
	#categoryFormatList .cell-input:focus {
		background: #f4f9fd; box-shadow: 0 1px 0 #6fb3e0;
	}
	#categoryFormatList .add-row td {
		background: #fcfcfc;
	}
	#categoryFormatList .add-row td:first-child {
		border-top: 1px dashed #ddd;
	}
</style>
<div class="modal fade" id="categoryFormatModal" tabindex="-1">
	<div class="modal-dialog" style="width: 600px;">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
				<h4 class="modal-title">规格范围维护 - <span id="categoryFormatName" class="blue"></span></h4>
			</div>
			<div class="modal-body">
				<div class="alert alert-info" style="padding: 6px 12px; margin-bottom: 8px;">
					此处维护的规格为该品类的可选范围:商品-整装创建与功能区品类规格均受此范围约束。
				</div>
				<table class="table table-striped table-bordered table-hover" id="categoryFormatList" style="margin-bottom: 6px;">
					<thead>
						<tr>
							<th style="width: 40%;">规格</th>
							<th>备注</th>
							<th style="width: 130px;">操作</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>
		</div>
	</div>
</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/utils/kingdeeUtils.js', 'js/data/category.js']);
</script>
