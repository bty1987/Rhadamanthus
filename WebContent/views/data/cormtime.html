<div>
    <div class="row">
        <div class="col-xs-12">
            <div id="cormtimeCondList" class="fl_search clearfix"></div>
            <div id="cormtimeResultList" class="clearfix tab-pane active col-xs-12"></div>
            <div id="cormtimePagenation" class="fl-page-wrap clearfix col-xs-12">

                <div class="row" style="margin-top: 20px">
                    <div class="col-xs-12">
                        <a class="btn btn-minier btn-primary pull-left" id="addCormtimeBtn" style="margin-right: 10px">
                            <i class="icon-plus bigger-110"></i>
                            <span>添加</span>
                        </a>
                        <a class="btn btn-minier" id="cormtimeBackBtn">
                            <i class="icon-mail-forward bigger-110"></i>
                            <span data-i18n="msg.back">返回</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addCormtimeModal" tabindex="-1">
    <div class="modal-dialog" style="margin-top: 10%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="SaveModal">添加工时</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="constructionNode" data-i18n="page.data.label.projectNode">工程节点</label>
                        <div class="col-sm-9">
                            <select id="constructionNode" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="unit" data-i18n="page.data.label.quotaUnit">定额单位</label>
                        <div class="col-sm-9">
                            <select  id="unit" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' maxlength="15"></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="trannum" data-i18n="page.data.label.transNum">转换量</label>
                        <div class="col-sm-9">
                            <input type="text" id="trannum" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="workdays">工时(天)</label>
                        <div class="col-sm-9">
                            <input type="text" id="workdays" class="col-xs-10 col-sm-5 v_required v_float_3" data-toggle="popover" data-trigger='manual' maxlength="8"/>
                        </div>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" id="addCormtimeItemBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="CancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/cormtime.js']);
</script>
