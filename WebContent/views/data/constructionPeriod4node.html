<div class="row">
    <div class="col-xs-12">
        <div id="periodnodeResultLists" class="clearfix tab-pane active"></div>
        <div id="periodnodePagenations" class="fl-page-wrap clearfix"></div>
    </div>
    
</div>

<div class="modal fade" id="addPeriodNodeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title" id="myModalLabel">工程成本</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal">

                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="dname">名称</label>
                        <div class="col-sm-9">
                            <input type="text" maxlength="64" id="dname" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>
                    <div class="space-4"></div>

                    <div class="form-group">
                        <label for="no" class="col-sm-3 control-label no-padding-right orange">施工节点</label>
                        <div class="col-md-9">
                            <select id="nodes" class="col-xs-10 col-sm-6 v_required" data-toggle="popover" data-placement="bottom" data-trigger="manual"></select>
                        </div>
                    </div>
                    <div class="space-4"></div>
                    
                    <div class="form-group">
                        <label class="col-sm-3 control-label no-padding-right orange" for="period" data-i18n="page.data.label.workDay">工期</label>
                        <div class="col-sm-9">
                            <input type="text" maxlength="64" id="period" class="col-xs-10 col-sm-6 v_float_3 v_number" data-toggle="popover" data-trigger='manual'/>
                        </div>
                    </div>
                    <div class="space-4"></div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/data/constructionPeriod4node.js']);
</script>
