<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>合同信息</title>

    <link rel="shortcut icon" href="fanglin.ico" type="image/x-icon">

    <style></style>

</head>
<body>

<div></div>

<script src="/platform/assets/altogether/js/jquery-2.0.3.min.js"></script>
<script type="text/javascript">


    //获取url属性值
    function getQueryString(name) {
        var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
        var r = window.location.search.substr(1).match(reg);
        if (r != null) return unescape(r[2]); return null;
    }
    
    var url = "../../redirectDecorationContract.do";
    var dcid = getQueryString('dcid');
    var type = getQueryString('type');
    var module = getQueryString('module');
    
    var args = {
        "decorationContract.dcid": dcid,
        "decorationContract.type": type,
        "authentication": "++YNaQ7ZF7b43ZN5CNiKGQ=="
    }
    
    if(module && module == "payment"){
    
        url = "../../rediretPaymentContract.do";
        
        args = {
            "paymentContract.pcid": dcid,
            "paymentContract.type": type,
            "authentication": "++YNaQ7ZF7b43ZN5CNiKGQ=="
        }
    }
    
    if(module && module == "personel"){
    
        url = "../../redirectUserContract.do";
        
        args = {
            "userContract.ucid": dcid,
            "userContract.type": type,
            "authentication": "++YNaQ7ZF7b43ZN5CNiKGQ=="
        }
    }

    $.ajax({
        type: "POST",
        dataType: "json",
        url: url,
        data: args,
        cache: false,
        success: function (msg) {
            if (msg.errorCode == 0) {
                //window.location.href = msg.redirect;
                window.location.replace(msg.redirect);
                return true;
            } else {
                alert(msg.errorMsg);
            }
        }
    });

</script>
</body>
</html>
