<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>在线签名</title>

	<link rel="shortcut icon" href="fanglin.ico" type="image/x-icon">

    <style>
		.zx11{
        border: 1px;
        border-color: red;
		}
		#signature {
			border: 2px dotted black;
		}
		#signatureparent {
        color:black;
        background-color:darkgrey;
		}
        #saveBtnBalance, #deleteSeal {
            width:280px;
            height:50px;
            border-radius: 20px;
            line-height: 1.5;
            margin-right: 16px;
            background-color: #5bc0de;
        }
        #button {
            float: right;
            margin-top: 8px;;
        }
        span {
            color: #FFF;
            font-size: 20px;
        }
		body{
            background: #FFF;
        }
    </style>

</head>
<body>

    <div class="container">
        <div id="signatureparent">
            <div id="signature"></div>
        </div>
        <div id="button">
            <button type="button" id="saveBtnBalance"><span>提交</span></button>
            <button type="button" id="deleteSeal"><span>清除</span></button>
        </div>
    </div>

<script src="/assets/altogether/js/jquery-2.0.3.min.js"></script>
<script src="/assets/altogether/js/jSignature.min.js"></script>
<script type="text/javascript">

   	var arguments = {
		width: '100%',
		height: '845px',
		cssclass: 'zx11',
		color:  'darkblue',
		signatureLine: false,//去除默认画布上那条横线
		lineWidth: '16'
	};

   $("#signature").jSignature(arguments);

    //印章按钮
   $("#saveBtnBalance").click(function () {

	   var datapair =  $("#signature").jSignature("getData", "image");

	   var i = new Image();
       i.src = "data:" + datapair[0] + "," + datapair[1];
       i.image = datapair[1];

       //使用压缩
       dealImage(i.src, 150, printing)

   });

    //清除印章按钮
   $("#deleteSeal").click(function () {
   	$("#signature").jSignature("reset");
   });

   //获取url属性值
   function getQueryString(name) {
	   var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
	   var r = window.location.search.substr(1).match(reg);
	   if (r != null) return unescape(r[2]); return null;
   }

   //压缩图片
    function dealImage(base64, w, callback) {
        var newImage = new Image();
        var quality = 0.98;    //压缩系数0-1之间
        newImage.src = base64;
        newImage.setAttribute("crossOrigin", 'Anonymous');	//url为外域时需要
        var imgWidth, imgHeight;
        newImage.onload = function () {
            imgWidth = this.width;
            imgHeight = this.height;
            var canvas = document.createElement("canvas");
            var ctx = canvas.getContext("2d");
            if (Math.max(imgWidth, imgHeight) > w) {
                if (imgWidth > imgHeight) {
                    canvas.width = w;
                    canvas.height = w * imgHeight / imgWidth;
                } else {
                    canvas.height = w;
                    canvas.width = w * imgWidth / imgHeight;
                }
            } else {
                canvas.width = imgWidth;
                canvas.height = imgHeight;
                quality = 0.98;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(this, 0, 0, canvas.width, canvas.height);
            var base64 = canvas.toDataURL("image/png", quality); //压缩语句

            callback(base64);//必须通过回调函数返回，否则无法及时拿到该值
        }
    };

    function printing(base64) {

        $.ajax({
            type: "POST",
            dataType: "json",
            // contentType: "application/json; charset=utf-8",
            url: "../../signateCustomer.do",
            data: {
                "customer.cid": getQueryString('cid'),
				"imgbase": base64.replace("data:image/png;base64,", ""),
				"authentication": "eX3o2SZdrpVOV9HC4UYTRA=="
			},//避免base64长度过大，json传输
			cache: false,
            success: function (msg) {
				if (msg.errorCode == 0) {
					alert('上传成功');
                    $("#signature").jSignature("reset");
				} else {
					alert(msg.errorMsg);
				}
			}
        });
    };

</script>
</body>
</html>
