<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>在线签名</title>

    <link rel="shortcut icon" href="fanglin.ico" type="image/x-icon">

    <style>
        .zx11{
            border: 1px;
            border-color: red;
        }
        #signature {
            border: 2px dotted black;
        }
        #signatureparent {
            color:black;
            background-color:darkgrey;
        }
        #uploadBtn, #clearBtn {
            width:280px;
            height:50px;
            border-radius: 20px;
            line-height: 1.5;
            margin-right: 16px;
            background-color: #5bc0de;
        }
        #button {
            float: right;
            margin-top: 8px;;
        }
        span {
            color: #FFF;
            font-size: 20px;
        }
        body{
            background: #FFF;
        }
    </style>

</head>
<body>

    <div class="container">
        <div id="signatureparent">
            <div id="signature"></div>
        </div>
        <div id="button">
            <button type="button" id="uploadBtn"><span>提交</span></button>
            <button type="button" id="clearBtn"><span>清除</span></button>
        </div>
    </div>

<script src="/assets/altogether/js/jquery-2.0.3.min.js"></script>
<script src="/assets/altogether/js/jSignature.min.js"></script>
<script type="text/javascript">

    var arguments = {
        width: '100%',
        height: '845px',
        cssclass: 'zx11',
        color: 'darkblue',
        signatureLine: false,//去除默认画布上那条横线
        lineWidth: '16'
    };

    $("#signature").jSignature(arguments);

    //印章按钮
    $("#uploadBtn").click(function () {

        var datapair =  $("#signature").jSignature("getData", "image");

        var i = new Image();
        i.src = "data:" + datapair[0] + "," + datapair[1];
        i.image = datapair[1];

        //使用压缩
        zipimg(i.src, 150, uploadimg1)
    });

    //清除印章按钮
    $("#clearBtn").click(function () {
        $("#signature").jSignature("reset");
    });

    //获取url属性值
    function getQueryString(name) {
       var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
       var r = window.location.search.substr(1).match(reg);
       if (r != null) return unescape(r[2]); return null;
    }

    //压缩图片
    function zipimg(base64, width, callback) {
    
        var newImage = new Image();
        var quality = 0.5; // 压缩系数0-1之间
        
        newImage.src = base64;
        newImage.setAttribute("crossOrigin", 'Anonymous');
        
        var imgWidth, imgHeight;
        
        newImage.onload = function () {
            imgWidth = this.width;
            imgHeight = this.height;
            var canvas = document.createElement("canvas");
            var ctx = canvas.getContext("2d");
            if (Math.max(imgWidth, imgHeight) > width) {
                if (imgWidth > imgHeight) {
                    canvas.width = width;
                    canvas.height = width * imgHeight / imgWidth;
                } else {
                    canvas.height = width;
                    canvas.width = width * imgWidth / imgHeight;
                }
            } else {
                canvas.width = imgWidth;
                canvas.height = imgHeight;
                quality = 0.98;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(this, 0, 0, canvas.width, canvas.height);
            var base64 = canvas.toDataURL("image/png", quality); //压缩语句
            
            callback(base64);//必须通过回调函数返回，否则无法及时拿到该值
        }
    };

    function uploadimg(base64) {

        $.ajax({
            type: "POST",
            dataType: "json",
            // contentType: "application/json; charset=utf-8",
            url: "../../signateCustomer.do",
            data: {
                "customer.cid": getQueryString('cid'),
                "imgbase": base64.replace("data:image/png;base64,", ""),
                "authentication": "eX3o2SZdrpVOV9HC4UYTRA=="
            },
            cache: false,
            success: function (msg) {
                if (msg.errorCode == 0) {
                    alert('上传成功');
                    $("#signature").jSignature("reset");
                } else {
                    alert(msg.errorMsg);
                }
            }
        });
    };
    
    function uploadimg1(base64) {
    
        var imgpath = null;
        var form = new FormData();
        
        form.append("strutsUploads", dataURLtoBlob(base64), "strutsUploads.png");

        $.ajax({
            type: "POST",
            contentType:false,
            processData:false,
            url: "../../Demeter/uploadImg.do",
            data: form,
            cache: false,
            async: false,
            success: function (msg) {
                if (msg.errorCode == 0) {
                    imgpath = msg.resUrl;
                } else {
                    alert(msg.errorMsg);
                }
            }
        });
        
        console.log(imgpath);
        
        $.ajax({
            type: "POST",
            dataType: "json",
            url: "../../signateCustomer.do",
            data: {
                "customer.cid": getQueryString('cid'),
                "customer.signPath": imgpath,
                "imgbase": "http://www.fanglinserver.com/" + imgpath,
                "authentication": "eX3o2SZdrpVOV9HC4UYTRA=="
            },
            success: function(msg){
                if(msg.errorCode == 0){
                    alert('上传成功');
                    $("#signature").jSignature("reset");
                } else {
                    alert(msg.errorMsg);
                }
            }
        })
    };
    
    function dataURLtoBlob(dataurl) {
        var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
            bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
        while(n--){
            u8arr[n] = bstr.charCodeAt(n);
        }
        return new Blob([u8arr], {type:mime});
    }

</script>
</body>
</html>
