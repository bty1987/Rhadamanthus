<div id="materialOrderPreBalancePageContent">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
</div>

<div class="modal fade" id="materialOrderPreBalanceCalModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span>&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="materialOrderPreBalanceCalModalDialog" data-i18n="page.material.label.materialPointCount">主材单点数</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="oldBase" data-i18n="page.material.label.originalBasePrice">原底价</label>
						<div class="col-sm-9">
							<input type="text" id="oldBase" class="col-xs-10 col-sm-4 v_required" readonly="readonly" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					<div class="space-4"></div>
				
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="oldPoint" data-i18n="page.material.label.originalPoint">原点数</label>
						<div class="col-sm-9">
							<input type="text" id="oldPoint" class="col-xs-10 col-sm-4 v_required" readonly="readonly" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="caclType">修改点数</label>
						<div class="col-sm-9">
							<select id="caclType" class="col-xs-10 col-sm-4 v_required" data-toggle="popover" data-trigger='manual'></select>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="value" data-i18n="page.material.label.modifyValue">修改值</label>
						<div class="col-sm-9">
							<input type="text" id="value" class="col-xs-10 col-sm-4 v_required" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					<div class="space-4"></div>
					
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="saveBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
				<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="materialOrderMalingModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">
					<span>&times;</span><span class="sr-only">Close</span>
				</button>
				<h4 class="modal-title" id="materialOrderMalingDialog" data-i18n="page.material.label.materialPointCount">主材单点数</h4>
			</div>
			<div class="modal-body">
				<form class="form-horizontal">
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="malingTotal">抹零总数</label>
						<div class="col-sm-9">
							<input type="text" id="malingTotal" class="col-xs-10 col-sm-4 v_required" readonly="readonly" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					<div class="space-4"></div>
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="oldMaling">原抹零</label>
						<div class="col-sm-9">
							<input type="text" id="oldMaling" class="col-xs-10 col-sm-4 v_required" readonly="readonly" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					<div class="space-4"></div>
				
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="oldVenderMaling">原厂商抹零</label>
						<div class="col-sm-9">
							<input type="text" id="oldVenderMaling" class="col-xs-10 col-sm-4 v_required" readonly="readonly" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					<div class="space-4"></div>
					
					<div class="form-group">
						<label class="col-sm-3 control-label no-padding-right" for="venderMaling">修改厂商抹零</label>
						<div class="col-sm-9">
							<input type="text" id="venderMaling" class="col-xs-10 col-sm-4 v_required" data-toggle="popover" data-trigger='manual'/>
						</div>
					</div>
					<div class="space-4"></div>
					
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" id="saveMalingBtn" class="btn btn-primary" data-i18n="msg.save">保存</button>
				<button type="button" id="cancelMalingBtn" class="btn btn-default" data-dismiss="modal" data-i18n="msg.cancel">取消</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/material/materialPreBalance.js']);
</script>
