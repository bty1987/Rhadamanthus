<div id="materialSaleOrderPageContent">

	<div class="row">
		<div class="col-xs-12">

			<div class="widget-box transparent">
				<div class="widget-body">
					<div class="widget-main">
						<form class="form-horizontal">
							<div class="form-group">
								<label class="col-sm-1 control-label no-padding-right" for="msoType">类型</label>
								<div class="col-sm-2">
									<select id="msoType" class="form-control" data-toggle="popover" data-trigger='manual'></select>
								</div>
								<label class="col-sm-1 control-label no-padding-right" for="salesmanName">业务员</label>
								<div class="col-sm-3">
									<input id="salesmanName" type="text" class="order_inputinfo col-xs-10 col-sm-10 v_required"/>
								</div>
								<label class="col-sm-1 control-label no-padding-right" for="materialerName">主材导购</label>
								<div class="col-sm-3">
									<input id="materialerName" type="text" class="order_inputinfo col-xs-10 col-sm-10 v_required"/>
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-1 control-label no-padding-right" for="orderId">装修单号</label>
								<div class="col-sm-2">
									<input id="orderId" type="text" class="col-sm-12 " readonly="readonly" data-toggle="popover" data-trigger='manual'/>
								</div>
								<label class="col-sm-1 control-label no-padding-right" for="customerName">客户姓名</label>
								<div class="col-sm-3">
									<input id="customerName" type="text" class="col-sm-12" readonly="readonly" data-toggle="popover" data-trigger='manual'/>
								</div>

								<label class="col-sm-1 control-label no-padding-right" for="instoreName">主材驻店</label>
								<div class="col-sm-3">
									<input id="instoreName" type="text" class="order_inputinfo col-xs-10 col-sm-10 v_required"/>
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-1 control-label no-padding-right" for="orderAddr">楼盘地址</label>
								<div class="col-sm-6">
									<input id="orderAddr" type="text" class="col-sm-12" readonly="readonly" data-toggle="popover" data-trigger='manual'/>
								</div>

								<label class="col-sm-1 control-label no-padding-right" for="materialBrand">主材品牌</label>
								<div class="col-sm-3">
									<input id="materialBrand" type="text" class="order_inputinfo col-xs-10 col-sm-10 v_required"/>
								</div>
							</div>

							<div class="form-group">
								<label class="col-sm-1 control-label no-padding-right" for="des">备注</label>
								<div class="col-sm-6">
									<input id="des" type="text" class="col-sm-12" data-toggle="popover" data-trigger='manual'/>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>

			<ul class="flex-table">
				<li class="line  table-title">
					<div class="line-wrap order">
						<div class="cell index"></div>
					</div>
					<div class="line-wrap content">
						<div class="cell name">名称</div>
						<div class="cell type">品类</div>
						<div class="cell brand">品牌</div>
						<div class="cell unit">单位</div>
						<div class="cell money">单价</div>
						<div class="cell decimal">折扣</div>
						<div class="cell money">折扣价</div>
						<div class="cell decimal">折让</div>
						<div class="cell money">售价</div>
						<div class="cell num">数量</div>
						<div class="cell money">总价</div>
						<div class="cell package">套餐</div>
						<div class="cell remark">备注</div>
					</div>
					<div class="line-wrap action">
						<div class="cell option">操作</div>
					</div>
				</li>
			</ul>

			<ul class="flex-table" id="list"></ul>

			<div style="margin-top: 15px;">
				<button id="addSaleOrder" class="btn btn-success inline col-xs-1">添加</button>
				<button id="submitSaleOrder" class="btn btn-default inline col-xs-1" data-loading-text="提交中...">提交</button>
				<button id="backBtn" class="btn btn-danger inline col-xs-1 pull-right inline">返回</button>
				<div class="col-sm-1 pull-right inline" style="margin-top: 10px">
					<span>总价:</span><span id="totalSpan">0</span>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$.loadScript(['js/material/materialSale.js']);
</script>
