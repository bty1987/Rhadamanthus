<div class="page-content">
	<div class="row">
		<div class="col-xs-12">
			<div id="condList" class="fl_search clearfix"></div> <!-- 查询条件-->
			<div id="resultList" class="clearfix tab-pane active"></div> <!--查询结果-->
			<div id="pagenation" class="fl-page-wrap clearfix"></div> <!--分页-->
		</div>
	</div>
	
	<div class="modal fade" id="smodal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
      			<div class="modal-header">
        			<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
        			<h4 class="modal-title">厂商结算值</h4>
      			</div>
      			<div class="modal-body">
		      		<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="vbalance" style="display: inline-block">厂商结算值</label>
							<div class="col-sm-9">
								<input type="text" id="vbalance" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
							<label class="col-sm-3 control-label no-padding-right" for="vbalancets_total" style="display: inline-block;margin-top: 10px">总价</label>
							<div class="col-sm-9" style="margin-top: 10px">
								<input type="text" id="vbalancets_total" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' readonly/>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
      			</div>
				<div class="modal-footer">
					<button type="button" id="vsaveBtn" class="btn btn-primary">保存</button>
		        	<button type="button" id="vcancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
		      	</div>
    		</div>
  		</div>
  	</div>

	<div class="modal fade" id="modal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span>&times;</span><span class="sr-only">Close</span></button>
					<h4 class="modal-title">结算值</h4>
				</div>
				<div class="modal-body">
					<form class="form-horizontal">
						<div class="form-group">
							<label class="col-sm-3 control-label no-padding-right" for="balance">结算值</label>
							<div class="col-sm-9">
								<input type="text" id="balance" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual'/>
							</div>
							<label class="col-sm-3 control-label no-padding-right" for="balance_prebalance" style="display: inline-block;margin-top: 10px">预结算成本额</label>
							<div class="col-sm-9" style="margin-top: 10px">
								<input type="text" id="balance_prebalance" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' readonly/>
							</div>
							<label class="col-sm-3 control-label no-padding-right" for="balance_vbalance" style="display: inline-block;margin-top: 10px">厂商结算额</label>
							<div class="col-sm-9" style="margin-top: 10px">
								<input type="text" id="balance_vbalance" class="col-xs-10 col-sm-5 v_required" data-toggle="popover" data-trigger='manual' readonly/>
							</div>
						</div>
						<div class="space-4"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" id="saveBtn" class="btn btn-primary">保存</button>
					<button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
				</div>
			</div>
		</div>
	</div>
</div>
