            <div class="widget-box transparent">
                <div class="widget-header">
                    <h2 class="lighter">活动信息</h2>
                </div>
                <div class="widget-header">
                    <div id="paramsNo"></div>
                </div>

            </div>
            <div class="row">
                <div class="col-xs-12 col-sm-12 pricing-span-body" style="padding: 30px;">
                    <div id="materialActivityItem"></div>
                </div>
                <hr/>
            </div>
        </div>

        <div class="col-sm-8 widget-container-span">
            <div class="widget-box transparent">
                <div class="widget-header">
                    <h2 class="lighter">活动物品</h2>
                </div>

                <div class="widget-header">
                    <div id="paramsOrder"></div>
                </div>

            </div>
            <div class="row">

                    <div id="materialActivityItems"></div>

        </div>
    </div>

    <div class="text-right col-md-12">

            返回

<!--参加活动-->
<div class="modal fade" id="materialActivityModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="activityDialog">活动名称</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label for="activity" class="col-sm-3 control-label no-padding-right">修改活动</label>
                        <div class="col-sm-9">
                            <select class='col-xs-10 col-sm-5 v_required' id='activityInfo' data-toggle="popover"
                                    data-trigger='manual'></select>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="submitMaterialActivityBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<!--领取活动物品-->
<div class="modal fade" id="materialActivityItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="agreementDialog">领取活动物品</h4>
            </div>

            <div class="modal-body">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label for="activity" class="col-sm-3 control-label no-padding-right">活动</label>
                        <div class="col-sm-9">
                            <select class='col-xs-10 col-sm-5 v_required' id='activity' data-toggle="popover"
                                    data-trigger='manual'></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="things" class="col-sm-3 control-label no-padding-right">物品</label>
                        <div class="col-sm-9">
                            <select id="things" multiple="multiple"
                                    class="col-sm-7 col-xs-10 chosen-select tag-input-style" data-placeholder="..."
                                    data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="coupons" class="col-sm-3 control-label no-padding-right">券</label>
                        <div class="col-sm-9">
                            <select id="coupons" multiple="multiple"
                                    class="col-sm-7 col-xs-10 chosen-select tag-input-style" data-placeholder="..."
                                    data-toggle="popover" data-trigger='manual'></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="approveActivityItemContent"
                               class="col-sm-3 control-label no-padding-right">说明</label>
                        <div class="col-sm-9">
                            <textarea id="approveActivityItemContent" class="col-xs-10 col-sm-6 "
                                      style="height: 100px"></textarea>
                        </div>
                    </div>
                    <div class="space-4"></div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" id="submitMaterialActivityItemBtn" class="btn btn-primary">保存</button>
                <button type="button" id="cancelBtn" class="btn btn-default" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $.loadScript(['js/material/materialActivity.js']);
</script>
