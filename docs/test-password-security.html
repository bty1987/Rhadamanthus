<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码安全升级验证工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .test-section h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .test-item {
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
        }
        .test-item label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 8px;
        }
        .test-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .test-item button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .test-item button:hover {
            background: #5568d3;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .result.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .checklist {
            list-style: none;
        }
        .checklist li {
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #ddd;
        }
        .checklist li.pass {
            border-left-color: #28a745;
            background: #d4edda;
        }
        .checklist li.fail {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        .code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            margin-top: 10px;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 8px;
        }
        .badge.success {
            background: #28a745;
            color: white;
        }
        .badge.error {
            background: #dc3545;
            color: white;
        }
        .badge.warning {
            background: #ffc107;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 密码安全升级验证工具</h1>
        <p class="subtitle">验证挑战-响应认证（Challenge-Response）是否正确实施</p>

        <!-- 测试1：nonce 生成测试 -->
        <div class="test-section">
            <h2>测试1：Nonce 生成测试</h2>
            <div class="test-item">
                <label>输入用户名：</label>
                <input type="text" id="userId1" placeholder="例如：admin" value="admin">
                <button onclick="testNonce()">测试 Nonce 生成</button>
                <div id="result1"></div>
            </div>
        </div>

        <!-- 测试2：完整登录流程测试 -->
        <div class="test-section">
            <h2>测试2：完整登录流程测试</h2>
            <div class="test-item">
                <label>用户名：</label>
                <input type="text" id="userId2" placeholder="输入用户名" value="admin">
                <label>密码：</label>
                <input type="password" id="password2" placeholder="输入密码">
                <label>验证码：</label>
                <input type="text" id="verifyCode2" placeholder="输入验证码（如果需要）">
                <button onclick="testFullLogin()">测试完整登录</button>
                <div id="result2"></div>
            </div>
        </div>

        <!-- 测试3：哈希计算验证 -->
        <div class="test-section">
            <h2>测试3：哈希计算验证</h2>
            <div class="test-item">
                <label>密码：</label>
                <input type="password" id="password3" placeholder="输入测试密码" value="123456">
                <label>Nonce：</label>
                <input type="text" id="nonce3" placeholder="输入 nonce" value="abc123def456">
                <button onclick="testHashCalculation()">计算响应哈希</button>
                <div id="result3"></div>
            </div>
        </div>

        <!-- 测试4：检查清单 -->
        <div class="test-section">
            <h2>测试4：部署检查清单</h2>
            <ul class="checklist" id="checklist">
                <li>⏳ 检查后端文件编译是否成功</li>
                <li>⏳ 检查应用服务器是否重启</li>
                <li>⏳ 检查浏览器缓存是否清除</li>
                <li>⏳ 验证 requestLoginChallenge.do 接口可访问</li>
                <li>⏳ 验证 doLogin.do 接口可访问</li>
                <li>⏳ 验证前端 login.js 已更新</li>
            </ul>
            <button style="width: 100%; margin-top: 15px;" onclick="runChecklist()">运行自动检查</button>
        </div>
    </div>

    <script>
        // MD5 实现（简化版，实际应使用完整的 MD5 库）
        // 这里使用浏览器内置的 crypto API 作为替代
        async function md5(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('MD5', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 简单的 MD5 模拟（用于演示，实际生产应使用真实的 MD5）
        function simpleMD5(str) {
            // 注意：这不是真正的 MD5，仅用于演示
            // 实际使用时应该加载真正的 MD5 库（如 crypto-js）
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(16).padStart(32, '0');
        }

        // 加载真实的 MD5 函数（如果页面已包含 MD5 库）
        function getMD5Function() {
            if (typeof hex_md5 !== 'undefined') {
                return hex_md5;
            } else if (typeof CryptoJS !== 'undefined' && CryptoJS.MD5) {
                return function(str) {
                    return CryptoJS.MD5(str).toString();
                };
            } else {
                return simpleMD5;
            }
        }

        // 测试1：Nonce 生成
        async function testNonce() {
            const userId = document.getElementById('userId1').value;
            const resultDiv = document.getElementById('result1');

            if (!userId) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ 请输入用户名';
                return;
            }

            resultDiv.className = 'result info';
            resultDiv.textContent = '⏳ 正在请求 nonce...';

            try {
                const response = await fetch('requestLoginChallenge.do', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'userId=' + encodeURIComponent(userId)
                });

                const data = await response.json();

                if (data.errorCode === 0 && data.nonce) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ Nonce 生成成功！

<strong>返回数据：</strong>
${JSON.stringify(data, null, 2)}

<strong>Nonce 值：</strong> ${data.nonce}
<strong>Nonce 长度：</strong> ${data.nonce.length} 字符

<span class="badge success">测试通过</span>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ Nonce 生成失败

<strong>错误码：</strong> ${data.errorCode}
<strong>错误信息：</strong> ${data.errorMsg || '未知错误'}

<span class="badge error">测试失败</span>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ 请求失败

<strong>错误信息：</strong> ${error.message}

<strong>可能原因：</strong>
1. 服务器未启动或接口不可访问
2. 接口路径错误
3. 网络连接问题

<span class="badge error">测试失败</span>`;
            }
        }

        // 测试2：完整登录流程
        async function testFullLogin() {
            const userId = document.getElementById('userId2').value;
            const password = document.getElementById('password2').value;
            const verifyCode = document.getElementById('verifyCode2').value;
            const resultDiv = document.getElementById('result2');

            if (!userId || !password) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ 请输入用户名和密码';
                return;
            }

            resultDiv.className = 'result info';
            resultDiv.textContent = '⏳ 正在执行登录流程...\n\n步骤1/3：请求 nonce...';

            try {
                // 步骤1：请求 nonce
                const nonceResponse = await fetch('requestLoginChallenge.do', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'userId=' + encodeURIComponent(userId)
                });

                const nonceData = await nonceResponse.json();

                if (nonceData.errorCode !== 0 || !nonceData.nonce) {
                    throw new Error('Nonce 获取失败: ' + (nonceData.errorMsg || '未知错误'));
                }

                const nonce = nonceData.nonce;
                resultDiv.textContent += `\n✅ Nonce 获取成功: ${nonce}\n\n步骤2/3：计算响应哈希...`;

                // 步骤2：计算响应哈希
                const md5 = getMD5Function();
                const passwordMD5 = md5(password);
                const responseHash = md5(passwordMD5 + nonce);

                resultDiv.textContent += `\n✅ 响应哈希计算完成\n  - passwordMD5: ${passwordMD5}\n  - responseHash: ${responseHash}\n\n步骤3/3：发送登录请求...`;

                // 步骤3：发送登录请求
                const loginResponse = await fetch('doLogin.do', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        userId: userId,
                        responseHash: responseHash,
                        verifyCode: verifyCode || '',
                        securityCode: window.securityCode || ''
                    }).toString()
                });

                const loginData = await loginResponse.json();

                if (loginData.errorCode === 0) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML += `\n\n✅ 登录成功！

<strong>完整流程：</strong>
1️⃣ 获取 nonce: ${nonce}
2️⃣ 计算 MD5(password): ${passwordMD5}
3️⃣ 计算 MD5(MD5(password) + nonce): ${responseHash}
4️⃣ 发送 responseHash 进行验证

<strong>返回数据：</strong>
${JSON.stringify(loginData, null, 2)}

<span class="badge success">全部测试通过 ✓</span>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML += `\n\n❌ 登录失败

<strong>错误码：</strong> ${loginData.errorCode}
<strong>错误信息：</strong> ${loginData.errorMsg}

<strong>调试信息：</strong>
- Nonce: ${nonce}
- PasswordMD5: ${passwordMD5}
- ResponseHash: ${responseHash}

<span class="badge error">测试失败</span>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ 流程执行失败

<strong>错误信息：</strong> ${error.message}

<span class="badge error">测试失败</span>`;
            }
        }

        // 测试3：哈希计算验证
        function testHashCalculation() {
            const password = document.getElementById('password3').value;
            const nonce = document.getElementById('nonce3').value;
            const resultDiv = document.getElementById('result3');

            if (!password || !nonce) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ 请输入密码和 nonce';
                return;
            }

            const md5 = getMD5Function();
            const passwordMD5 = md5(password);
            const responseHash = md5(passwordMD5 + nonce);

            resultDiv.className = 'result success';
            resultDiv.innerHTML = `✅ 哈希计算完成

<strong>输入：</strong>
- 密码: ${password}
- Nonce: ${nonce}

<strong>计算过程：</strong>
步骤1: MD5(${password}) = ${passwordMD5}
步骤2: MD5(${passwordMD5} + ${nonce})
     = MD5("${passwordMD5 + nonce}")
     = ${responseHash}

<strong>最终结果：</strong>
<div class="code">responseHash = "${responseHash}"</div>

<strong>说明：</strong>
这个 responseHash 就是客户端发送给服务器的值。
服务器端会用数据库中的 MD5 密码 + nonce 计算出相同的值进行对比。

<span class="badge success">计算正确 ✓</span>`;
        }

        // 测试4：运行检查清单
        async function runChecklist() {
            const items = [
                { text: '检查 requestLoginChallenge.do 接口', test: testEndpoint('requestLoginChallenge.do') },
                { text: '检查 doLogin.do 接口', test: testEndpoint('doLogin.do') },
                { text: '验证前端 login.js 已更新', test: testLoginJS() },
                { text: '验证 MD5 函数可用', test: testMD5Available() },
            ];

            const checklist = document.getElementById('checklist');
            checklist.innerHTML = '<li>⏳ 正在运行自动检查...</li>';

            const results = [];
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const result = await item.test;
                results.push(result);

                checklist.innerHTML = results.map((r, idx) => {
                    const icon = r.pass ? '✅' : '❌';
                    const className = r.pass ? 'pass' : 'fail';
                    return `<li class="${className}">${icon} ${items[idx].text}: ${r.message}</li>`;
                }).join('');
            }

            const allPass = results.every(r => r.pass);
            if (allPass) {
                checklist.innerHTML += '<li class="pass" style="margin-top: 15px; font-weight: bold;">🎉 所有检查项通过！可以进行功能测试了。</li>';
            } else {
                checklist.innerHTML += '<li class="fail" style="margin-top: 15px; font-weight: bold;">⚠️ 部分检查项失败，请检查服务器配置和文件部署。</li>';
            }
        }

        async function testEndpoint(endpoint) {
            try {
                const response = await fetch(endpoint, { method: 'POST' });
                if (response.status === 200) {
                    return { pass: true, message: '接口可访问' };
                } else {
                    return { pass: false, message: `HTTP ${response.status}` };
                }
            } catch (error) {
                return { pass: false, message: '接口不可访问' };
            }
        }

        async function testLoginJS() {
            try {
                const response = await fetch('js/login.js');
                const content = await response.text();
                if (content.includes('requestLoginChallenge') && content.includes('responseHash')) {
                    return { pass: true, message: '包含新代码' };
                } else {
                    return { pass: false, message: '未找到新代码，可能是缓存问题' };
                }
            } catch (error) {
                return { pass: false, message: '无法读取文件' };
            }
        }

        async function testMD5Available() {
            if (typeof hex_md5 !== 'undefined') {
                return { pass: true, message: 'hex_md5 函数可用' };
            } else if (typeof CryptoJS !== 'undefined' && CryptoJS.MD5) {
                return { pass: true, message: 'CryptoJS.MD5 可用' };
            } else {
                return { pass: false, message: 'MD5 函数未找到，需要加载 MD5 库' };
            }
        }

        // 页面加载时显示提示
        window.onload = function() {
            console.log('🔐 密码安全升级验证工具已加载');
            console.log('💡 提示：如果 MD5 函数不可用，请确保页面加载了 utils.js 或 crypto-js');
        };
    </script>
</body>
</html>
