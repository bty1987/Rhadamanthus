<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>人员需求</title>
<link rel="stylesheet" href="../../layui/css/layui.css">
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
<div class="app-search">
<form class="layui-form" id="searchForm" lay-filter="searchForm"><div class="layui-form-item">
<div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
</div></form>
</div>
<div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
<div id="pagenation" class="app-pagenation"></div><div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm"><div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-block"><select name="type"><option value="0">招聘</option><option value="1">培训</option></select></div></div><div class="layui-form-item"><label class="layui-form-label">需求内容<span class="app-req">*</span></label><div class="layui-input-block"><textarea name="content" placeholder="" class="layui-textarea v_required" lay-verify="required"></textarea></div></div>
<div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div></form></div><script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-normal layui-btn-xs" lay-event="approve">通过</button><button class="layui-btn layui-btn-danger layui-btn-xs" lay-event="refuse">拒绝</button><button class="layui-btn layui-btn-warm layui-btn-xs" lay-event="complete">完成</button></script>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/personnel/userRequire.js"></script>
</body>
</html>
