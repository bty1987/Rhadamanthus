<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>定岗信息</title>
<link rel="stylesheet" href="../../layui/css/layui.css">
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
<div style="padding:10px 20px;"><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div><div id="list"></div><div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm"><input type="hidden" name="did"><div class="layui-form-item"><label class="layui-form-label">职位</label><div class="layui-input-block"><input type="text" id="dutyName" class="layui-input" placeholder="输入职位拼音搜索" disabled><input type="hidden" name="duty.did"></div></div><div class="layui-form-item"><label class="layui-form-label">部门</label><div class="layui-input-block"><input type="text" id="deptName" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">人员上限<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="limit" placeholder="" class="layui-input v_required" lay-verify="required"></div></div>
<div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div></form></div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/personnel/dutment.js"></script>
</body>
</html>
