<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>职位管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css">
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
<div class="app-search">
<form class="layui-form" id="searchForm" lay-filter="searchForm"><div class="layui-form-item">
<div class="layui-inline"><label class="layui-form-label">职位名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="职位名称" class="layui-input" autocomplete="off"></div></div>
<div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
</div></form>
</div>
<div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
<div id="pagenation" class="app-pagenation"></div><div id="editBox" style="display:none; padding:20px;">
<form class="layui-form" id="editForm" lay-filter="editForm">
<input type="hidden" name="did">
<div class="layui-form-item"><label class="layui-form-label">职位名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="" class="layui-input v_required" lay-verify="required"></div></div>
<div class="layui-form-item"><label class="layui-form-label">职位编码</label><div class="layui-input-block"><input type="text" name="code" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">部门类型<span class="app-req">*</span></label><div class="layui-input-block"><select name="departmentType.dtid" lay-search=""></select></div></div>
<div class="layui-form-item"><label class="layui-form-label">主管</label><div class="layui-input-block"><select name="lead"><option value="0">否</option><option value="1">是</option></select></div></div>
<div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
</form>
</div><script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</button><button class="layui-btn layui-btn-primary layui-btn-xs" lay-event="dutment">定岗信息</button><button class="layui-btn layui-btn-warm layui-btn-xs" lay-event="status">启用/禁用</button></script>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/personnel/duty.js"></script>
</body>
</html>
