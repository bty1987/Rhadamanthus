<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>员工合同</title>
<link rel="stylesheet" href="../../layui/css/layui.css">
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
<div style="padding:10px 20px;"><button type="button" class="layui-btn layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button> <button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>创建合同</button> <button type="button" class="layui-btn" id="btnRegist">注册</button> <button type="button" class="layui-btn" id="btnAuth">认证</button> <button type="button" class="layui-btn" id="btnSignate">签名</button> <button type="button" class="layui-btn" id="btnConfirm">确认</button> <button type="button" class="layui-btn layui-btn-warm" id="btnReset">重置</button></div><div id="userInfo" class="layui-card"><div class="layui-card-body"></div></div>
<div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
<div id="pagenation" class="app-pagenation"></div><div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm"><input type="hidden" name="ucid"><div class="layui-form-item"><label class="layui-form-label">合同名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="" class="layui-input v_required" lay-verify="required"></div></div>
<div class="layui-form-item"><label class="layui-form-label">签订时间</label><div class="layui-input-block"><input type="text" name="signTime" class="layui-input" placeholder="yyyy-MM-dd"></div></div><div class="layui-form-item"><label class="layui-form-label">开始时间</label><div class="layui-input-block"><input type="text" name="startTime" class="layui-input" placeholder="yyyy-MM-dd"></div></div><div class="layui-form-item"><label class="layui-form-label">结束时间</label><div class="layui-input-block"><input type="text" name="endTime" class="layui-input" placeholder="yyyy-MM-dd"></div></div><div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><select name="status"><option value="0">初始</option><option value="1">有效</option><option value="2">失效</option><option value="3">归档</option><option value="4">已签</option></select></div></div><div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-block"><textarea name="comment" placeholder="" class="layui-textarea"></textarea></div></div>
<div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div></form></div><div id="signetBox" style="display:none; padding:20px;"><form class="layui-form"><div class="layui-form-item"><label class="layui-form-label">签章</label><div class="layui-input-block"><select id="signet"></select></div></div><div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSignet">提交</button><button type="button" class="layui-btn layui-btn-primary" id="btnSignetCancel">取消</button></div></form></div><script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>修改</button><button class="layui-btn layui-btn-primary layui-btn-xs" lay-event="view">查看</button><button class="layui-btn layui-btn-danger layui-btn-xs" lay-event="sign">已签</button><button class="layui-btn layui-btn-warm layui-btn-xs" lay-event="expire">失效</button><button class="layui-btn layui-btn-normal layui-btn-xs" lay-event="companySign">公司签</button><button class="layui-btn layui-btn-normal layui-btn-xs" lay-event="userSign">员工签</button><button class="layui-btn layui-btn-normal layui-btn-xs" lay-event="filing">归档</button></script>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/personnel/userContract.js"></script>
</body>
</html>
