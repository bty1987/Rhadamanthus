<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>厂商服务费</title>
<link rel="stylesheet" href="../../layui/css/layui.css">
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
<div style="padding:10px 20px;"><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>创建</button></div><div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
<div id="pagenation" class="app-pagenation"></div><div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm"><div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="" class="layui-input v_required" lay-verify="required"></div></div>
<div class="layui-form-item"><label class="layui-form-label">开始日期</label><div class="layui-input-block"><input type="text" name="startDate" class="layui-input" placeholder="yyyy-MM-dd"></div></div><div class="layui-form-item"><label class="layui-form-label">上报日期</label><div class="layui-input-block"><input type="text" name="reportedDate" class="layui-input" placeholder="yyyy-MM-dd"></div></div><div class="layui-form-item"><label class="layui-form-label">销售上限</label><div class="layui-input-block"><input type="text" name="maxAmount" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">销售下限</label><div class="layui-input-block"><input type="text" name="minAmount" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">超额服务费(%)</label><div class="layui-input-block"><input type="text" name="serviceCharge" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div></form></div><script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</button></script>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/personnel/supplierContractService.js"></script>
</body>
</html>
