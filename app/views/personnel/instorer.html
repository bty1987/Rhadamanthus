<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>驻店人员管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css">
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
<div class="app-search">
<form class="layui-form" id="searchForm" lay-filter="searchForm"><div class="layui-form-item">
<div class="layui-inline"><label class="layui-form-label">员工编号</label><div class="layui-input-inline"><input type="text" name="userId" data-op="cn" placeholder="员工编号" class="layui-input" autocomplete="off"></div></div>
<div class="layui-inline"><label class="layui-form-label">用户名</label><div class="layui-input-inline"><input type="text" name="userName" data-op="cn" placeholder="用户名" class="layui-input" autocomplete="off"></div></div>
<div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">在职</option><option value="1">离职</option><option value="2">停薪留职</option></select></div></div>
<div class="layui-inline"><label class="layui-form-label">电话</label><div class="layui-input-inline"><input type="text" name="phone" data-op="cn" placeholder="电话" class="layui-input" autocomplete="off"></div></div>
<div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
</div></form>
</div>
<div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
<div id="pagenation" class="app-pagenation"></div><div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm"><input type="hidden" name="uid"><div class="layui-form-item add-only"><label class="layui-form-label">用户名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="loginId" class="layui-input v_required" lay-verify="required"></div></div><div class="layui-form-item"><label class="layui-form-label">姓名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="userName" class="layui-input v_required" lay-verify="required"></div></div><div class="layui-form-item"><label class="layui-form-label">手机号</label><div class="layui-input-block"><input type="text" name="phone" class="layui-input"></div></div><div class="layui-form-item add-only"><label class="layui-form-label">部门类型<span class="app-req">*</span></label><div class="layui-input-block"><select name="dtid"></select></div></div><div class="layui-form-item add-only"><label class="layui-form-label">部门<span class="app-req">*</span></label><div class="layui-input-block"><select name="dept.did"></select></div></div><div class="layui-form-item add-only"><label class="layui-form-label">职位<span class="app-req">*</span></label><div class="layui-input-block"><select name="duty.did"></select></div></div><div class="layui-form-item add-only"><label class="layui-form-label">状态</label><div class="layui-input-block"><select name="status"></select></div></div><div class="layui-form-item"><label class="layui-form-label">原工号</label><div class="layui-input-block"><input type="text" name="oldUserId" class="layui-input"></div></div><div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div></form></div><div id="viewBox" style="display:none; padding:20px;"><div id="viewInfo"></div></div><script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-primary layui-btn-xs" lay-event="view">查看</button><button class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</button><button class="layui-btn layui-btn-danger layui-btn-xs" lay-event="resetPassword">重置密码</button><button class="layui-btn layui-btn-warm layui-btn-xs" lay-event="defaultPassword">默认密码</button></script>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/personnel/instorer.js"></script>
</body>
</html>
