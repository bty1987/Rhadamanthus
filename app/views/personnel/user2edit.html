<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>员工编辑</title>
<link rel="stylesheet" href="../../layui/css/layui.css">
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
<div class="app-page"><div id="userinfo" style="padding:20px;"><form class="layui-form" id="userForm" lay-filter="userForm"><input type="hidden" name="userId"><input type="hidden" name="user.userId"><div class="layui-form-item"><label class="layui-form-label">原工号</label><div class="layui-input-block"><input type="text" name="oldUserId" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">用户名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="loginId" placeholder="" class="layui-input v_required" lay-verify="required"></div></div>
<div class="layui-form-item"><label class="layui-form-label">姓名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="userName" placeholder="" class="layui-input v_required" lay-verify="required"></div></div>
<div class="layui-form-item"><label class="layui-form-label">现用名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="currentName" placeholder="" class="layui-input v_required" lay-verify="required"></div></div>
<div class="layui-form-item"><label class="layui-form-label">性别</label><div class="layui-input-block"><select name="gender"><option value="1">男</option><option value="0">女</option></select></div></div><div class="layui-form-item"><label class="layui-form-label">身份证号</label><div class="layui-input-block"><input type="text" name="identity" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">手机号</label><div class="layui-input-block"><input type="text" name="phone" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">入职时间</label><div class="layui-input-block"><input type="text" name="entryTime" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">角色</label><div class="layui-input-block"><select name="role.rid" lay-search=""></select></div></div><div class="layui-form-item"><label class="layui-form-label">部门</label><div class="layui-input-block"><select name="dept.did" lay-search=""></select></div></div><div class="layui-form-item"><label class="layui-form-label">职位</label><div class="layui-input-block"><select name="duty.did" lay-search=""></select></div></div><div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><select name="status"></select></div></div><div class="layui-form-item"><label class="layui-form-label">职级</label><div class="layui-input-block"><select name="rank_sequence"></select></div></div><div class="layui-form-item"><label class="layui-form-label">职级序</label><div class="layui-input-block"><select name="rank_level"></select></div></div><div class="layui-form-item"><label class="layui-form-label">产值类型</label><div class="layui-input-block"><select name="form"></select></div></div><div class="layui-form-item"><label class="layui-form-label">推荐人</label><div class="layui-input-block"><input type="text" name="fangliner.userId" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">身高</label><div class="layui-input-block"><input type="text" name="height" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">体重</label><div class="layui-input-block"><input type="text" name="weight" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">民族</label><div class="layui-input-block"><input type="text" name="nation" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">政治面貌</label><div class="layui-input-block"><select name="political"></select></div></div><div class="layui-form-item"><label class="layui-form-label">工龄</label><div class="layui-input-block"><input type="text" name="jobYears" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">现住址</label><div class="layui-input-block"><input type="text" name="address" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">籍贯</label><div class="layui-input-block"><input type="text" name="hometownAddress" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">户口类型</label><div class="layui-input-block"><select name="householdType"></select></div></div><div class="layui-form-item"><label class="layui-form-label">紧急联系人</label><div class="layui-input-block"><input type="text" name="emergencyMan" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">紧急联系电话</label><div class="layui-input-block"><input type="text" name="emergencyPhone" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">QQ</label><div class="layui-input-block"><input type="text" name="qq" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">微信</label><div class="layui-input-block"><input type="text" name="wechat" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">邮箱</label><div class="layui-input-block"><input type="text" name="email" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">配偶</label><div class="layui-input-block"><input type="text" name="lover" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">户籍所在地</label><div class="layui-input-block"><input type="text" name="hometownPlace" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">基本薪资</label><div class="layui-input-block"><input type="text" name="salary" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">岗位薪资</label><div class="layui-input-block"><input type="text" name="palary" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">开户行</label><div class="layui-input-block"><input type="text" name="bank" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">银行卡号</label><div class="layui-input-block"><input type="text" name="bankCardNum" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea name="comment" placeholder="" class="layui-textarea"></textarea></div></div>
<div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div></form></div></div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/upload.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/personnel/user2edit.js"></script>
</body>
</html>
