<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>部门管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css">
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
<div class="app-search">
<form class="layui-form" id="searchForm" lay-filter="searchForm"><div class="layui-form-item">
<div class="layui-inline"><label class="layui-form-label">部门名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="部门名称" class="layui-input" autocomplete="off"></div></div>
<div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">启用</option><option value="1">禁用</option></select></div></div>
<div class="layui-inline"><label class="layui-form-label">部门类型</label><div class="layui-input-inline"><select name="type" data-op="eq"><option value="">全部</option></select></div></div>
<div class="layui-inline"><label class="layui-form-label">是否定岗</label><div class="layui-input-inline"><select name="isdet" data-op="eq"><option value="">全部</option><option value="0">开放</option><option value="1">定岗</option></select></div></div>
<div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
</div></form>
</div>
<div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
<div id="pagenation" class="app-pagenation"></div><div id="editBox" style="display:none; padding:20px;">
<form class="layui-form" id="editForm" lay-filter="editForm">
<input type="hidden" name="did">
<div class="layui-form-item"><label class="layui-form-label">部门编号</label><div class="layui-input-block"><input type="text" name="no" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">部门名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="" class="layui-input v_required" lay-verify="required"></div></div>
<div class="layui-form-item"><label class="layui-form-label">部门类型<span class="app-req">*</span></label><div class="layui-input-block"><select name="type.dtid" lay-search=""></select></div></div>
<div class="layui-form-item"><label class="layui-form-label">业务类型</label><div class="layui-input-block"><select name="busitype.dbid"></select></div></div>
<div class="layui-form-item"><label class="layui-form-label">所属分区</label><div class="layui-input-block"><select name="fatherDept.did"></select></div></div>
<div class="layui-form-item"><label class="layui-form-label">金蝶编号</label><div class="layui-input-block"><input type="text" name="kino" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">金蝶名称</label><div class="layui-input-block"><input type="text" name="kiname" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">管理人员</label><div class="layui-input-block"><input type="text" name="manager.userId" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">是否定岗</label><div class="layui-input-block"><select name="isdet"><option value="0">开放</option><option value="1">定岗</option></select></div></div>
<div class="layui-form-item"><label class="layui-form-label">人员上限</label><div class="layui-input-block"><input type="text" name="limit" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">code</label><div class="layui-input-block"><input type="text" name="code" placeholder="" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">描述</label><div class="layui-input-block"><textarea name="comment" placeholder="" class="layui-textarea"></textarea></div></div>
<div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
</form>
</div><script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-warm layui-btn-xs" lay-event="partner">合作</button><button class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</button><button class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</button></script>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/personnel/department.js"></script>
</body>
</html>
