<!DOCTYPE html>
<!-- app/views/payment/paymentContract.html —— 款项支付签约合同（按订单号/款项类型/创建人/创建时间筛选）
  列：款项类型/创建人/签署人/创建时间/公司签时间/客户签时间/状态。
  操作：查看/公司签/客户签/已签/失效/归档/下载/签名通知/客签通知/查看通知/下载通知。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>款项支付签约</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">订单号</label><div class="layui-input-inline"><input class="layui-input" name="orderId" data-op="cn"></div></div>
        <div class="layui-inline"><label class="layui-form-label">款项类型</label><div class="layui-input-inline"><select name="paymentType"><option value="">全部</option><option value="0">合同预付款</option><option value="1">主材预付款</option><option value="2">装修款</option><option value="3">销售款</option><option value="4">服务款</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">创建时间</label><div class="layui-input-inline"><input class="layui-input" name="createTime" id="createTime" placeholder="YYYY-MM-DD" data-op="eq"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="view">查看</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="comsign">公司签</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="cussign">客户签</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="notify">签名通知</button>
        <button class="layui-btn layui-btn-xs" lay-event="download">下载</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/payment/paymentContract.js"></script>
</body></html>
