<!DOCTYPE html>
<!-- app/views/payment/statement.html —— 对账单（第三方支付对账流水，按订单号/类型/状态/付款时间筛选）
  列：订单号/金额/手续费/费率/创建时间/付款时间/类型/状态。只读列表，无操作。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>对账单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">客户号</label><div class="layui-input-inline"><input class="layui-input" name="custNo" data-op="cn"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="">全部</option><option value="0">支付宝</option><option value="1">微信</option><option value="2">银联</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status"><option value="">全部</option><option value="0">待处理</option><option value="1">成功</option><option value="2">失败</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">付款时间</label><div class="layui-input-inline"><input class="layui-input" name="payTime" id="payTime" placeholder="YYYY-MM-DD" data-op="eq"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/payment/statement.js"></script>
</body></html>
