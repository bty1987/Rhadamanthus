<!DOCTYPE html>
<!-- app/views/payment/customer.html —— 客户款项汇总（按装修单号查询该客户下装修款/销售款/预付款三类待收款信息）
  数据源：queryDecorationPaymentByOrderId(待收装修款) + querySalesPaymentByOrderId(待收销售款) + pageAdvancePayment(预付款账户)。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>客户款项</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input class="layui-input" name="orderId" id="orderId" data-rule="required"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button></div>
    </div></form></div>
    <fieldset class="layui-elem-field"><legend>装修款</legend><div class="app-table"><table id="decorationTable" lay-filter="decorationTable"></table></div></fieldset>
    <fieldset class="layui-elem-field"><legend>销售款</legend><div class="app-table"><table id="salesTable" lay-filter="salesTable"></table></div></fieldset>
    <fieldset class="layui-elem-field"><legend>预付款账户</legend><div class="app-table"><table id="advanceTable" lay-filter="advanceTable"></table></div></fieldset>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/payment/customer.js"></script>
</body></html>
