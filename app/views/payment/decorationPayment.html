<!DOCTYPE html>
<!-- app/views/payment/decorationPayment.html —— 装修款（合同款项的收款/退款/落款/撤款/确认/打印等）
  上下文：app.params.decorationPayment = { paytype }。
  列：装修单号/客户/款项/应收/现金/刷卡/银行/分期/对公/预付/券/状态/备注。
  操作：收款/落款(settle)/撤款(withdraw)/退款(refund)/更新/确认/打印/微信推送/客户推送。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>装修款</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input class="layui-input" name="decoration.orderId" data-op="cn"></div></div>
        <div class="layui-inline"><label class="layui-form-label">客户</label><div class="layui-input-inline"><input class="layui-input" name="decoration.customer.name" data-op="cn"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="paymentStatus"><option value="">全部</option><option value="0">初始</option><option value="1">已付款</option><option value="2">已确认</option><option value="3">落款</option><option value="4">已结算</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="collect">收款</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="settle">落款</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="withdraw">撤款</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refund">退款</button>
        <button class="layui-btn layui-btn-xs" lay-event="update">更新</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="print">打印</button>
        <button class="layui-btn layui-btn-xs layui-btn-disabled" lay-event="wechat">微信推送</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/payment/decorationPayment.js"></script>
</body></html>
