<!DOCTYPE html>
<!-- app/views/payment/salesPayment.html —— 销售款（销售单款项的收款/退款/结算/确认/推送/打印）
  上下文：app.params.salesPayment = { paytype }。
  列：销售单号/装修单号/品牌/类型/应收/实收/抹零/券/状态/备注。
  操作：定金/补款、收款、退款、退款定金、退款券、确认、affirm、cancel、settle、撤款、更新、推送、打印。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>销售款</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">销售单号</label><div class="layui-input-inline"><input class="layui-input" name="sales.no" data-op="cn"></div></div>
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input class="layui-input" name="sales.orderId" data-op="cn"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status"><option value="">全部</option><option value="0">初始</option><option value="1">已付款</option><option value="3">已确认</option><option value="4">已结算</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="collect">收款</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refund">退款</button>
        <button class="layui-btn layui-btn-xs" lay-event="update">更新</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="settle">结算</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="withdraw">撤款</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="print">打印</button>
        <button class="layui-btn layui-btn-xs layui-btn-disabled" lay-event="wechat">微信推送</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/payment/salesPayment.js"></script>
</body></html>
