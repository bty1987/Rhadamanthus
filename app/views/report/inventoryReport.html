<!DOCTYPE html>
<!-- app/views/report/inventoryReport.html —— 仓储物流报表（echarts）：出入库月度趋势(入库+出库 双线) / 出入库类型结构。数据源 metric_inventory_monthly。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>仓储物流报表</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm" onsubmit="return false;"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">日期范围</label><div class="layui-input-inline" style="width:240px;"><input type="text" name="dateRange" id="dateRange" placeholder="开始 - 结束" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-warm" id="btnRefresh"><i class="layui-icon layui-icon-refresh"></i>刷新数据</button></div>
    </div></form></div>
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12"><div id="inOutTrendChart" style="height:380px;"></div></div>
        <div class="layui-col-md12"><div id="typePie" style="height:380px;"></div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../lib/echarts.min.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/report/inventoryReport.js"></script>
</body></html>
