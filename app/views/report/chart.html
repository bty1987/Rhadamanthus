<!DOCTYPE html>
<!-- app/views/report/chart.html —— 自定义图表大屏（queryChart 按 type/level 取图表配置 → library/业务接口取数 → echarts 渲染）。
  urlLoadParams.type / urlLoadParams.level 决定图表集。支持 number/table/echarts 三种渲染模式。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>自定义图表</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm" onsubmit="return false;"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><input type="text" name="type" id="chartType" placeholder="chart.type" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">层级</label><div class="layui-input-inline"><input type="text" name="level" id="chartLevel" placeholder="chart.level" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
    </div></form></div>
    <div id="customize" class="layui-row layui-col-space15"></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../lib/echarts.min.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/report/chart.js"></script>
</body></html>
