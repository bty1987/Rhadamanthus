<!DOCTYPE html>
<!-- app/views/report/rank.html —— 业绩排行榜（类型 × 范围 组合查询，编号列表展示）。
  类型 Decoration=装修 / MaterialDesigner=主材设计师；范围 Designer=全员 / Department=部门 / Region=分区。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>业绩排行榜</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm" onsubmit="return false;"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline">
            <select name="rankType" id="rankType">
                <option value="Decoration">装修</option>
                <option value="MaterialDesigner">主材设计师</option>
                <option value="Zaterial">总业绩</option>
            </select>
        </div></div>
        <div class="layui-inline"><label class="layui-form-label">范围</label><div class="layui-input-inline">
            <select name="rankRegion" id="rankRegion">
                <option value="Designer">全员</option>
                <option value="Department">部门</option>
                <option value="Region">分区</option>
            </select>
        </div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
    </div></form></div>
    <div id="rankInfo" class="layui-row layui-col-space15" style="margin-top:10px;"></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/report/rank.js"></script>
</body></html>
