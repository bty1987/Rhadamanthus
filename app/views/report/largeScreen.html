<!DOCTYPE html>
<!-- app/views/report/largeScreen.html —— 系统监控大屏（Elasticsearch → echarts）：天级请求走势/请求总数/当日数/服务器分布/人员TOP/API TOP/温度走势 + 地图(需 G2 地理数据，简化占位)。全屏切换，1 分钟刷新。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>系统监控大屏</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page" id="lsPage">
    <div class="app-toolbar" style="margin:0 0 10px;"><button type="button" class="layui-btn layui-btn-normal" id="fullScreen"><i class="layui-icon layui-icon-screen-full"></i>全屏</button></div>
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md3"><div class="layui-card"><div class="layui-card-body" style="text-align:center;padding:50px 0;"><div style="font-size:40px;font-weight:bold;color:#01AAED;" id="InterfaceRequestsAll">-</div><h5>请求总数</h5></div></div></div>
        <div class="layui-col-md3"><div class="layui-card"><div class="layui-card-body" style="text-align:center;padding:50px 0;"><div style="font-size:40px;font-weight:bold;color:#01AAED;" id="InterfaceRequestsDay">-</div><h5>当日请求</h5></div></div></div>
        <div class="layui-col-md6"><div id="InterfaceRequestsForMouth" style="height:220px;"></div></div>
        <div class="layui-col-md6"><div id="InterfaceRequestsForDayAll" style="height:220px;"></div></div>
        <div class="layui-col-md6"><div id="InterfaceRequestsForDayByUserId" style="height:420px;"></div></div>
        <div class="layui-col-md6"><div id="ApiInterfaceRequestsForDay" style="height:420px;"></div></div>
        <div class="layui-col-md12"><div id="TemperatureTrend" style="height:420px;"></div></div>
        <div class="layui-col-md12"><div id="map" class="layui-card"><div class="layui-card-body" style="height:450px;color:#999;text-align:center;padding-top:200px;">地图视图依赖 G2 地理组件与 /ds/largeScreen.json（旧版专属），新版暂未迁移</div></div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../lib/echarts.min.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/report/largeScreen.js"></script>
</body></html>
