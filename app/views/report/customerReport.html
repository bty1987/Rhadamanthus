<!DOCTYPE html>
<!-- app/views/report/customerReport.html —— 客户获客报表（echarts）：获客漏斗趋势(报备→确认) / 来源渠道结构 / 转单趋势。数据源 metric_customer_monthly。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>客户获客报表</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm" onsubmit="return false;"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">日期范围</label><div class="layui-input-inline" style="width:240px;"><input type="text" name="dateRange" id="dateRange" placeholder="开始 - 结束" class="layui-input" autocomplete="off"></div></div>

    </div></form></div>
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12"><div id="funnelTrendChart" style="height:360px;"></div></div>
        <div class="layui-col-md6"><div id="sourcePie" style="height:360px;"></div></div>
        <div class="layui-col-md6"><div id="convertChart" style="height:360px;"></div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../lib/echarts.min.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/report/customerReport.js"></script>
</body></html>
