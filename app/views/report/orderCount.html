<!DOCTYPE html>
<!-- app/views/report/orderCount.html —— 大屏订单计数报表（echarts）：状态汇总饼图 + 签单总额/订单总数 + 各状态订单数趋势折线。按城市过滤。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>订单计数报表</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm" onsubmit="return false;"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">城市</label><div class="layui-input-inline"><input type="text" name="cityName" id="cityName" value="沈阳" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">日期范围</label><div class="layui-input-inline" style="width:240px;"><input type="text" name="dateRange" id="dateRange" placeholder="开始 - 结束" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
    </div></form></div>
    <div id="charts" class="layui-row layui-col-space15"></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../lib/echarts.min.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/report/orderCount.js"></script>
</body></html>
