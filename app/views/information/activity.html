<!DOCTYPE html>
<!-- app/views/information/activity.html —— 活动管理（列表 + 添加/编辑 + 启用/禁用 + 默认）
  字段：aid(活动ID) name(活动名) startTime endTime type(类型) atttype(类型) multiple(倍数) validays(有效天数) exchange(兑换率) defaults(默认) status(状态) content paytype -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>活动管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="活动名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type" data-op="eq"><option value="">全部</option><option value="0">满赠</option><option value="1">满返</option><option value="2">满抵</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">有效</option><option value="1">无效</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="aid">
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="活动名称" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">开始时间</label><div class="layui-input-inline"><input type="text" name="startTime" id="startTime" placeholder="yyyy-MM-dd" class="layui-input"></div>
            <label class="layui-form-label">结束时间</label><div class="layui-input-inline"><input type="text" name="endTime" id="endTime" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="0">满赠</option><option value="1">满返</option><option value="2">满抵</option></select></div>
            <label class="layui-form-label">活动类型</label><div class="layui-input-inline"><select name="atttype"><option value="0">活动</option><option value="1">奖品</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">倍数</label><div class="layui-input-inline"><input type="text" name="multiple" placeholder="倍数" class="layui-input v_float"></div>
            <label class="layui-form-label">有效天数</label><div class="layui-input-inline"><input type="text" name="validays" placeholder="天数" class="layui-input v_int"></div>
            <label class="layui-form-label">兑换率</label><div class="layui-input-inline"><input type="text" name="exchange" placeholder="兑换率" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-block"><textarea name="content" class="layui-textarea" placeholder="说明"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="default">设为默认</button><button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="enable">启用</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="disable">禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script>
<script src="../../js/information/activity.js"></script>
</body></html>
