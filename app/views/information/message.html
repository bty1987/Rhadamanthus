<!DOCTYPE html>
<!-- app/views/information/message.html —— 系统消息（列表 + 发送 + 标记已读）
  字段：mid(消息ID) contents(内容) type(类型) status(状态) sender(发送人) createTime -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>系统消息</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline">
            <select name="type" data-op="eq"><option value="">全部</option><option value="0">系统</option><option value="1">个人</option></select>
        </div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline">
            <select name="status" data-op="eq"><option value="">全部</option><option value="0">未读</option><option value="1">已读</option></select>
        </div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>发消息</button><button type="button" class="layui-btn layui-btn-warm" id="btnRead">标记已读</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">收信人ID<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="receiverUserId" placeholder="收信人userId" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">内容<span class="app-req">*</span></label><div class="layui-input-block"><textarea name="contents" maxlength="50" placeholder="消息内容" class="layui-textarea v_required" lay-verify="required"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">发送</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="read">标记已读</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script>
<script src="../../js/information/message.js"></script>
</body></html>
