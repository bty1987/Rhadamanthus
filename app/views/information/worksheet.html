<!DOCTYPE html>
<!-- app/views/information/worksheet.html —— 工单（列表 + 添加 + 处理 + 取消 + 完成 + 图片上传）
  字段：wsid(工单ID) module(模块) content(内容) path(图片) creater createTime handler handTime status(状态) result(结果) -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>工单管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">单号</label><div class="layui-input-inline"><input type="text" name="code" data-op="eq" placeholder="工单单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">待处理</option><option value="1">已处理</option><option value="2">已完成</option><option value="3">已取消</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="addBox" style="display:none; padding:20px;"><form class="layui-form" id="addForm">
        <div class="layui-form-item"><label class="layui-form-label">模块</label><div class="layui-input-block"><input type="text" name="module" placeholder="工单模块" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">内容<span class="app-req">*</span></label><div class="layui-input-block"><textarea name="content" placeholder="工单内容" class="layui-textarea v_required" lay-verify="required"></textarea></div></div>
        <div class="layui-form-item"><label class="layui-form-label">图片</label><div class="layui-input-inline"><button type="button" class="layui-btn" id="btnUpload"><i class="layui-icon layui-icon-upload"></i>上传图片</button></div><div class="layui-input-inline"><input type="text" name="pathShow" readonly class="layui-input" placeholder="未上传"></div>
            <input type="hidden" name="path"></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveAdd">提交</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelAdd">取消</button></div>
    </form></div>
    <div id="handBox" style="display:none; padding:20px;"><form class="layui-form" id="handForm">
        <input type="hidden" name="wsid">
        <div class="layui-form-item"><label class="layui-form-label">处理结果<span class="app-req">*</span></label><div class="layui-input-block"><textarea name="result" placeholder="处理结果" class="layui-textarea v_required" lay-verify="required"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveHand">提交</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelHand">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="handle">处理</button><button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="finish">完成</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="cancel">取消</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/information/worksheet.js"></script>
</body></html>
