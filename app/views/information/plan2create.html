<!DOCTYPE html>
<!-- app/views/information/plan2create.html —— 计划创建（基于任务参数）
  字段：taskPlan(任务) dataTime(日期) time(时间) cuTime(条件值) orderId fields conditions -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>计划创建</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">任务</label><div class="layui-input-inline"><select name="taskPlan" id="taskPlan"><option value="">请选择任务</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">日期</label><div class="layui-input-inline"><input type="text" name="dataTime" id="dataTime" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
        <div class="layui-inline"><label class="layui-form-label">时间</label><div class="layui-input-inline"><input type="text" name="time" id="time" placeholder="HH:mm:ss" class="layui-input"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnCreate"><i class="layui-icon layui-icon-add-1"></i>创建计划</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">条件值<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="cuTime" placeholder="条件值(如公司/月份)" class="layui-input v_required" lay-verify="required"></div>
            <label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input type="text" name="orderId" placeholder="装修单号" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSubmit">确定</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script>
<script src="../../js/information/plan2create.js"></script>
</body></html>
