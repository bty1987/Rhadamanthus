<!DOCTYPE html>
<!-- app/views/information/activityItem.html —— 活动物品（按活动ID加载物品列表 + 添加/删除）
  字段：aid(活动ID) activityName activityItems: [{aiid name money integral type}] -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>活动物品</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">活动</label><div class="layui-input-inline"><input type="text" id="activityName" readonly class="layui-input"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加物品</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">物品ID<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="asid" placeholder="奖品库存asId" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">金额</label><div class="layui-input-inline"><input type="text" name="money" placeholder="金额" class="layui-input v_float"></div>
            <label class="layui-form-label">积分</label><div class="layui-input-inline"><input type="text" name="integral" placeholder="积分" class="layui-input v_int"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script>
<script src="../../js/information/activityItem.js"></script>
</body></html>
