<!DOCTYPE html>
<!-- app/views/information/awardPurchase.html —— 奖品采购（列表 + 创建 + 采购/入库/结算/撤销）
  字段：apid awardStock.name inprice(入库价) baprice(结算价) num(数量) surplus(剩余数量) status creater createTime purchaser purchaseTime instorer instoreTime balanceTime activity dept comment -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>奖品采购</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">物品编号</label><div class="layui-input-inline"><input type="text" name="awardStock.no" data-op="eq" placeholder="物品编号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">物品名称</label><div class="layui-input-inline"><input type="text" name="awardStock.name" data-op="cn" placeholder="物品名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">活动名称</label><div class="layui-input-inline"><input type="text" name="activity" data-op="eq" placeholder="活动名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">初始化</option><option value="1">采购中</option><option value="2">已入库</option><option value="3">已结算</option><option value="4">已撤销</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>创建</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="addBox" style="display:none; padding:20px;"><form class="layui-form" id="addForm">
        <div class="layui-form-item"><label class="layui-form-label">库存ID<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="asId" placeholder="奖品库存asId" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">数量<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="num" placeholder="数量" class="layui-input v_int v_required" lay-verify="required"></div>
            <label class="layui-form-label">活动名称</label><div class="layui-input-inline"><input type="text" name="activity" placeholder="活动名称" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">部门</label><div class="layui-input-inline"><input type="text" name="dept" placeholder="部门" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="comment" placeholder="备注" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveAdd">创建</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelAdd">取消</button></div>
    </form></div>
    <div id="instoreBox" style="display:none; padding:20px;"><form class="layui-form" id="instoreForm">
        <input type="hidden" name="apid">
        <div class="layui-form-item"><label class="layui-form-label">入库价<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="inprice" placeholder="入库价" class="layui-input v_float v_required" lay-verify="required"></div>
            <label class="layui-form-label">入库数量<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="warehousing" placeholder="入库数量" class="layui-input v_int v_required" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveInstore">提交</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelInstore">取消</button></div>
    </form></div>
    <div id="balanceBox" style="display:none; padding:20px;"><form class="layui-form" id="balanceForm">
        <input type="hidden" name="apid">
        <div class="layui-form-item"><label class="layui-form-label">结算价<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="baprice" placeholder="结算价" class="layui-input v_float v_required" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveBalance">提交</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelBalance">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="purchase">采购</button><button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="instore">入库</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="balance">结算</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="cancel">撤销</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script>
<script src="../../js/information/awardPurchase.js"></script>
</body></html>
