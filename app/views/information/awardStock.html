<!DOCTYPE html>
<!-- app/views/information/awardStock.html —— 奖品库存（列表 + 添加/编辑 + 启用/禁用 + 入库/出库/盘点 + 记录）
  字段：asId(库存ID) no(编号) name(名称) num(数量) type(类型) subtype(子类) storeroom(库房) format(规格) unitPrice(价格) price status isStock isPrefor isPayment content -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>奖品库存</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">编号</label><div class="layui-input-inline"><input type="text" name="no" data-op="cn" placeholder="编号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type" data-op="eq"><option value="">全部</option><option value="0">物品</option><option value="1">券</option><option value="2">红包</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">启用</option><option value="1">禁用</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="asId">
        <div class="layui-form-item"><label class="layui-form-label">编号<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="no" placeholder="编号" class="layui-input v_required" lay-verify="required"></div>
            <label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="name" placeholder="名称" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">数量</label><div class="layui-input-inline"><input type="text" name="num" placeholder="数量" class="layui-input v_int"></div>
            <label class="layui-form-label">价格</label><div class="layui-input-inline"><input type="text" name="price" placeholder="价格" class="layui-input v_float"></div>
            <label class="layui-form-label">规格</label><div class="layui-input-inline"><input type="text" name="format" placeholder="规格" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="0">物品</option><option value="1">券</option><option value="2">红包</option></select></div>
            <label class="layui-form-label">子类</label><div class="layui-input-inline"><select name="subtype"><option value="0">其他</option><option value="1">采购</option></select></div>
            <label class="layui-form-label">库房</label><div class="layui-input-inline"><select name="storeroom"><option value="0">主库</option><option value="1">分库</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">库存标识</label><div class="layui-input-inline"><select name="isStock"><option value="0">计算</option><option value="1">不计算</option></select></div>
            <label class="layui-form-label">业绩标识</label><div class="layui-input-inline"><select name="isPrefor"><option value="0">计算</option><option value="1">不计算</option></select></div>
            <label class="layui-form-label">金额标识</label><div class="layui-input-inline"><select name="isPayment"><option value="0">计算</option><option value="1">不计算</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="content" placeholder="备注" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <div id="opBox" style="display:none; padding:20px;"><form class="layui-form" id="opForm">
        <input type="hidden" name="asId">
        <input type="hidden" name="opFlag">
        <div class="layui-form-item"><label class="layui-form-label">编号</label><div class="layui-input-inline"><input type="text" name="no2" readonly class="layui-input"></div>
            <label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name2" readonly class="layui-input"></div>
            <label class="layui-form-label">当前数量</label><div class="layui-input-inline"><input type="text" name="nownum" readonly class="layui-input"></div></div>
        <div class="layui-form-item" id="rowIn"><label class="layui-form-label">入库数量</label><div class="layui-input-inline"><input type="text" name="warehousing" placeholder="入库数量" class="layui-input v_int"></div>
            <label class="layui-form-label">单价</label><div class="layui-input-inline"><input type="text" name="price2" placeholder="单价" class="layui-input v_float"></div>
            <label class="layui-form-label">子类</label><div class="layui-input-inline"><select name="awardRecordSubtype"><option value="2">采购入库</option><option value="4">其他入库</option></select></div></div>
        <div class="layui-form-item" id="rowOut"><label class="layui-form-label">出库数量</label><div class="layui-input-inline"><input type="text" name="warehousend" placeholder="出库数量" class="layui-input v_int"></div>
            <label class="layui-form-label">单价</label><div class="layui-input-inline"><input type="text" name="price2out" placeholder="单价" class="layui-input v_float"></div>
            <label class="layui-form-label">子类</label><div class="layui-input-inline"><select name="awardRecordSubtypeOut"><option value="1">销售出库</option><option value="3">其他出库</option></select></div></div>
        <div class="layui-form-item" id="rowCheck"><label class="layui-form-label">盘点数量</label><div class="layui-input-inline"><input type="text" name="checknum" placeholder="实际盘点数量" class="layui-input v_int"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnOpSave">提交</button><button type="reset" class="layui-btn layui-btn-primary" id="btnOpCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="in">入库</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="out">出库</button><button class="layui-btn layui-btn-xs" lay-event="check">盘点</button><button class="layui-btn layui-btn-xs" lay-event="status">切换状态</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script>
<script src="../../js/information/awardStock.js"></script>
</body></html>
