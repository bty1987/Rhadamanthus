<!DOCTYPE html>
<!-- app/views/information/vpayment.html —— 大活动收款（列表 + 创建 + 收款）
  字段：vpid mno(会员号) orderId type(类型) category(品类) brand(品牌) money(应收) status(状态) comment creater createTime collecter collectTime cash bank coupon bankInfo couponInfo -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>大活动收款</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">会员号</label><div class="layui-input-inline"><input type="text" name="mno" data-op="eq" placeholder="会员号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">品牌</label><div class="layui-input-inline"><input type="text" name="brand" data-op="eq" placeholder="品牌" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">创建人</label><div class="layui-input-inline"><input type="text" name="creater" data-op="eq" placeholder="创建人userId" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="addBox" style="display:none; padding:20px;"><form class="layui-form" id="addForm">
        <div class="layui-form-item"><label class="layui-form-label">会员号<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="mno" placeholder="会员号" class="layui-input v_required" lay-verify="required"></div>
            <label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input type="text" name="orderId" placeholder="装修单号" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型<span class="app-req">*</span></label><div class="layui-input-inline"><select name="type"><option value="0">定金</option><option value="1">诚意金</option><option value="2">活动款</option><option value="3">其他</option></select></div>
            <label class="layui-form-label">品牌-品类</label><div class="layui-input-inline"><input type="text" name="brand" placeholder="品牌-品类" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">金额<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="money" placeholder="金额" class="layui-input v_float v_required" lay-verify="required"></div>
            <label class="layui-form-label">备注</label><div class="layui-input-inline"><input type="text" name="comment" placeholder="备注" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveAdd">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelAdd">取消</button></div>
    </form></div>
    <div id="collectBox" style="display:none; padding:20px;"><form class="layui-form" id="collectForm">
        <input type="hidden" name="vpids">
        <div class="layui-form-item"><label class="layui-form-label">应收金额</label><div class="layui-input-inline"><input type="text" name="referMoney" readonly class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">现金</label><div class="layui-input-inline"><input type="text" name="cash" placeholder="现金" class="layui-input v_float"></div>
            <label class="layui-form-label">刷卡</label><div class="layui-input-inline"><input type="text" name="bank" placeholder="刷卡总额" class="layui-input v_float"></div>
            <label class="layui-form-label">刷卡明细</label><div class="layui-input-inline"><input type="text" name="bankInfo" placeholder="如 银行|金额|日期#" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">优惠券</label><div class="layui-input-inline"><input type="text" name="coupon" placeholder="优惠券总额" class="layui-input v_float"></div>
            <label class="layui-form-label">优惠券明细</label><div class="layui-input-inline"><input type="text" name="couponInfo" placeholder="如 类型|金额#" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="comment" placeholder="收款备注" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveCollect">收款</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelCollect">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="collect">收款</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script>
<script src="../../js/information/vpayment.js"></script>
</body></html>
