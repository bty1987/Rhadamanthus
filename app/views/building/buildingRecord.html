<!DOCTYPE html>
<!-- app/views/building/buildingRecord.html —— 施工记录（按房源查看 + 添加记录）
  字段：buildingHouse(房源) buildingCustomer(客户) type(类型) pattern(模式) value(值) comment -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>施工记录</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">房源编号</label><div class="layui-input-inline"><input type="text" name="no" id="searchNo" placeholder="房源编号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加记录</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">房源编号<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="houseNo" id="houseNo" placeholder="房源编号" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">客户编号</label><div class="layui-input-inline"><input type="text" name="customerNo" id="customerNo" placeholder="客户编号" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-inline"><input type="text" name="type" placeholder="类型" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">模式</label><div class="layui-input-inline"><input type="text" name="pattern" placeholder="模式" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">值</label><div class="layui-input-inline"><input type="text" name="value" placeholder="值" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea name="comment" placeholder="备注" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/building/buildingRecord.js"></script>
</body></html>
