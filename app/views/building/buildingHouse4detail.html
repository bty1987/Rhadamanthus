<!DOCTYPE html>
<!-- app/views/building/buildingHouse4detail.html —— 房源详情（查询+编辑）
  URL 参数 hsid → 查询房源详情 → 编辑保存 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>房源详情</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-crumb-bar" id="breadcrumb"></div>
    <div class="app-form-card">
        <form class="layui-form" id="detailForm">
            <input type="hidden" name="hsid">
            <div class="layui-form-item"><label class="layui-form-label">编号</label><div class="layui-input-block"><input type="text" name="no" disabled class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">装修程度</label><div class="layui-input-inline"><input type="text" name="decorateDegree" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">房产证号</label><div class="layui-input-inline"><input type="text" name="deedNum" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">房产证价值</label><div class="layui-input-inline"><input type="text" name="deedValue" class="layui-input v_float"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">是否允许贷款</label><div class="layui-input-inline"><input type="text" name="allowLoan" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">贷款中</label><div class="layui-input-inline"><input type="text" name="beingLoan" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea name="comment" class="layui-textarea"></textarea></div></div>
            <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnBack">返回</button></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/building/buildingHouse4detail.js"></script>
</body></html>
