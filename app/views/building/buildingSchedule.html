<!DOCTYPE html>
<!-- app/views/building/buildingSchedule.html —— 施工进度（查看 + 推进 + 重置）
  字段：buildingNode(节点) planTime(计划时间) status comment sore(得分)
  URL 参数 bid → 查询楼盘施工进度 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>施工进度</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">楼盘ID</label><div class="layui-input-inline"><input type="number" name="bid" id="searchBid" placeholder="楼盘ID" class="layui-input" value="0"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="next">推进</button><button class="layui-btn layui-btn-xs" lay-event="reset">重置</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/building/buildingSchedule.js"></script>
</body></html>
