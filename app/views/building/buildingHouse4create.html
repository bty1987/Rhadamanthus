<!DOCTYPE html>
<!-- app/views/building/buildingHouse4create.html —— 创建房源（表单页 + 创建客户弹窗）
  房源字段：type sourceType deedNum deedValue unitPrice totalPrice decorateTime decorateDegree
           discussType rentType indoores history propertyFee elevator onlyHousing documentsDate
           allowLoan beingLoan checkingTime followUserId keyerId housingGrade comment
  房产字段：villageNo built unit floor door type buildArea maxFloor houseType orientation feature
           waterVapour parlourType heatingType
  接口：api.building.addBuildingHouse / api.building.checkBuildingHouse / api.data.addCustomer
        api.data.queryVillageByVid / api.data.checkCustomerForPhone / api.data.queryCustomerForName
        api.personel.queryUserByPinyin -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>创建房源</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div id="breadcrumb"></div>
    <form class="layui-form" id="houseForm" lay-filter="houseForm">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md6">
                <div class="layui-form-item"><label class="layui-form-label">房源类型</label><div class="layui-input-block"><select name="type" lay-filter="type"><option value="0">出售</option><option value="1">出租</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">客户姓名<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="customerId" id="customerId" placeholder="客户编号(cid)" class="layui-input v_required"></div><button type="button" class="layui-btn layui-btn-normal layui-btn-sm" id="btnCreateCustomer">创建客户</button></div>
                <div class="layui-form-item"><label class="layui-form-label">楼盘名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="villageNo" id="villageNo" placeholder="楼盘编号(no)" class="layui-input v_required"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">楼牌号<span class="app-req">*</span></label><div class="layui-input-block">
                    <div class="layui-inline"><input type="text" name="built" maxlength="7" placeholder="楼" class="layui-input" style="width:80px;"></div>
                    <div class="layui-inline"><select name="builtrule" style="width:70px;"><option value="栋">栋</option><option value="号楼">号楼</option><option value="幢">幢</option></select></div>
                    <div class="layui-inline"><input type="text" name="unit" maxlength="3" placeholder="单元" class="layui-input" style="width:70px;"></div>
                    <div class="layui-inline"><select name="unitrule" style="width:70px;"><option value="单元">单元</option><option value="">无</option></select></div>
                    <div class="layui-inline"><input type="text" name="floor" maxlength="3" placeholder="层" class="layui-input" style="width:70px;"></div>
                    <div class="layui-inline"><select name="floorrule" style="width:70px;"><option value="层">层</option><option value="">无</option></select></div>
                    <div class="layui-inline"><input type="text" name="door" maxlength="3" placeholder="室" class="layui-input" style="width:70px;"></div>
                    <div class="layui-inline"><select name="doorrule" style="width:70px;"><option value="室">室</option><option value="号">号</option></select></div>
                </div></div>
                <div class="layui-form-item"><label class="layui-form-label">房产类型<span class="app-req">*</span></label><div class="layui-input-block"><select name="houseType" lay-filter="houseType"><option value="0">住宅</option><option value="1">商铺</option><option value="2">写字楼</option><option value="3">公寓</option><option value="4">别墅</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">户型</label><div class="layui-input-block">
                    <div class="layui-inline"><input type="text" name="houseTypeOne" maxlength="2" placeholder="室" class="layui-input v_number" style="width:70px;"></div>室
                    <div class="layui-inline"><input type="text" name="houseTypeTwo" maxlength="2" placeholder="厅" class="layui-input v_number" style="width:70px;"></div>厅
                    <div class="layui-inline"><input type="text" name="houseTypeThr" maxlength="2" placeholder="厨" class="layui-input v_number" style="width:70px;"></div>厨
                    <div class="layui-inline"><input type="text" name="houseTypeFour" maxlength="2" placeholder="卫" class="layui-input v_number" style="width:70px;"></div>卫
                </div></div>
                <div class="layui-form-item"><label class="layui-form-label">最高楼层<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="maxFloor" maxlength="2" class="layui-input v_required v_number"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">建筑面积<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="buildArea" id="buildArea" maxlength="8" class="layui-input v_required v_float"></div><div class="layui-form-mid layui-word-aux">平</div></div>
                <div class="layui-form-item"><label class="layui-form-label">交租方式</label><div class="layui-input-block"><select name="rentType"><option value="0">押一付三</option><option value="1">押一付六</option><option value="2">押二付三</option><option value="3">押一付一年</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">房屋朝向</label><div class="layui-input-inline"><select name="orientation"><option value="0">东</option><option value="1">南</option><option value="2">西</option><option value="3">北</option><option value="4">南北</option><option value="5">东西</option></select></div>
                    <label class="layui-form-label">是否越层</label><div class="layui-input-inline"><select name="through"><option value="0">否</option><option value="1">是</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">客厅类型</label><div class="layui-input-inline"><select name="parlourType"><option value="0">无</option><option value="1">一厅</option><option value="2">二厅</option></select></div>
                    <label class="layui-form-label">供暖类型</label><div class="layui-input-inline"><select name="heatingType"><option value="0">集中供暖</option><option value="1">地暖</option><option value="2">无</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">电梯<span class="app-req">*</span></label><div class="layui-input-inline"><select name="elevator"><option value="0">有</option><option value="1">无</option></select></div>
                    <label class="layui-form-label">唯一住房<span class="app-req">*</span></label><div class="layui-input-inline"><select name="onlyHousing"><option value="0">是</option><option value="1">否</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">水气设施</label><div class="layui-input-block"><select name="waterVapour"><option value="0">水气齐全</option><option value="1">仅水</option><option value="2">无</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">室内设施</label><div class="layui-input-block"><input type="text" name="indoores" class="layui-input"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">三不</label><div class="layui-input-block"><input type="text" name="feature" class="layui-input" placeholder="不议价/不按揭/不押金"></div></div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item"><label class="layui-form-label">信息来源</label><div class="layui-input-block"><select name="sourceType"><option value="0">网络</option><option value="1">门店</option><option value="2">介绍</option><option value="3">其他</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">跟进人<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="followUserId" placeholder="跟进人userId" class="layui-input v_required"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">收钥匙人<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="keyerId" placeholder="收钥匙人userId" class="layui-input v_required"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">契证编号</label><div class="layui-input-block"><input type="text" name="deedNum" maxlength="15" class="layui-input"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">契证原值</label><div class="layui-input-inline"><input type="text" name="deedValue" maxlength="15" class="layui-input v_float_3"></div>
                    <label class="layui-form-label">物业费</label><div class="layui-input-inline"><input type="text" name="propertyFee" class="layui-input v_float_3"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">总价<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="totalPrice" id="totalPrice" maxlength="32" class="layui-input v_required v_float_3"></div>
                    <label class="layui-form-label">单价</label><div class="layui-input-inline"><input type="text" name="unitPrice" id="unitPrice" readonly class="layui-input"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">装修程度</label><div class="layui-input-block"><select name="decorateDegree"><option value="0">毛坯</option><option value="1">简装</option><option value="2">精装</option><option value="3">豪装</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">装修时间</label><div class="layui-input-block"><input type="text" name="decorateTime" id="decorateTime" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">下证日期</label><div class="layui-input-block"><input type="text" name="documentsDate" id="documentsDate" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">商议类型</label><div class="layui-input-inline"><select name="discussType"><option value="0">可议</option><option value="1">不可议</option></select></div>
                    <label class="layui-form-label">房屋历史<span class="app-req">*</span></label><div class="layui-input-inline"><select name="history"><option value="0">自住</option><option value="1">出租</option><option value="2">空置</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">有无贷款<span class="app-req">*</span></label><div class="layui-input-inline"><select name="beingLoan"><option value="0">无</option><option value="1">有</option></select></div>
                    <label class="layui-form-label">允许贷款<span class="app-req">*</span></label><div class="layui-input-inline"><select name="allowLoan"><option value="0">不允许</option><option value="1">允许</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">看房时间</label><div class="layui-input-block"><input type="text" name="checkingTime" id="checkingTime" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">房源等级<span class="app-req">*</span></label><div class="layui-input-block"><select name="housingGrade"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div></div>
                <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea name="comment" maxlength="128" class="layui-textarea"></textarea></div></div>
            </div>
        </div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </form>

    <div id="customerBox" style="display:none; padding:20px;"><form class="layui-form" id="customerForm" lay-filter="customerForm">
        <div class="layui-form-item"><label class="layui-form-label">姓名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" maxlength="32" class="layui-input v_required v_name"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">性别</label><div class="layui-input-block"><select name="gender"><option value="男">男</option><option value="女">女</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">联系方式<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="phone" id="custPhone" maxlength="64" class="layui-input v_required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">证件类型</label><div class="layui-input-block"><select name="cardType"><option value="身份证">身份证</option><option value="军官证">军官证</option><option value="护照">护照</option><option value="其他">其他</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">证件号</label><div class="layui-input-block"><input type="text" name="cardNum" maxlength="18" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">QQ</label><div class="layui-input-block"><input type="text" name="qq" maxlength="15" class="layui-input v_number"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">微信</label><div class="layui-input-block"><input type="text" name="wechat" maxlength="15" class="layui-input v_name_en"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">邮箱</label><div class="layui-input-block"><input type="text" name="email" maxlength="32" class="layui-input v_email"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">客户类型</label><div class="layui-input-block"><select name="relationshipType"><option value="0">本人</option><option value="1">亲属</option><option value="2">朋友</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">通讯地址</label><div class="layui-input-block"><textarea name="address" maxlength="128" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnCustSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCustCancel">取消</button></div>
    </form></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/building/buildingHouse4create.js"></script>
</body></html>
