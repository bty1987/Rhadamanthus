<!DOCTYPE html>
<!-- app/views/test/upload-test.html —— 文件上传功能测试页：app.uploadImage（单图/批量）与 app.uploadFile（文档）三个用例 + 上传日志。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>文件上传测试</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css">
<style>
.upload-result { margin: 10px 0; }
.upload-result .ok { color: #16baaa; }
.upload-result .fail { color: #ff5722; }
.preview-area { margin-top: 10px; }
.preview-item { display: inline-block; border: 1px solid #ddd; padding: 8px; margin: 0 10px 10px 0; border-radius: 4px; max-width: 180px; vertical-align: top; }
.preview-item img { max-width: 100%; height: auto; }
.preview-item p { margin: 4px 0 0; font-size: 12px; color: #666; word-break: break-all; }
#logArea { background: #fff; padding: 12px; border: 1px solid #ddd; max-height: 260px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; }
</style>
</head>
<body><div class="app-page">

    <blockquote class="layui-elem-quote layui-quote-nm">上传走 app/js/app/upload.js（layui upload 封装，后端 UploadAction：uploadImg.do / uploadOther.do，字段名 strutsUploads，认证随 Cookie 注入）。原版为静态结构演示页（模拟 config），本页为可实际调用的测试页。<\/blockquote>

    <!-- 测试1: 单图片上传 -->
    <div class="layui-card"><div class="layui-card-header">测试1：单图片上传</div><div class="layui-card-body">
        <button type="button" class="layui-btn" id="uploadBtn1"><i class="layui-icon layui-icon-upload-drag"></i>选择单张图片</button>
        <div class="upload-result" id="result1"></div>
        <div class="preview-area" id="preview1"></div>
    </div></div>

    <!-- 测试2: 批量图片上传 -->
    <div class="layui-card"><div class="layui-card-header">测试2：批量图片上传（多选）</div><div class="layui-card-body">
        <button type="button" class="layui-btn layui-btn-normal" id="uploadBtn2"><i class="layui-icon layui-icon-upload-drag"></i>选择多张图片</button>
        <div class="upload-result" id="result2"></div>
        <div class="preview-area" id="preview2"></div>
    </div></div>

    <!-- 测试3: 文档上传 -->
    <div class="layui-card"><div class="layui-card-header">测试3：文档上传（PDF、Word、Excel）</div><div class="layui-card-body">
        <button type="button" class="layui-btn layui-btn-warm" id="uploadBtn3"><i class="layui-icon layui-icon-file"></i>选择文档</button>
        <div class="upload-result" id="result3"></div>
        <div class="preview-area" id="fileList3"></div>
    </div></div>

    <!-- 日志 -->
    <div class="layui-card"><div class="layui-card-header">上传日志</div><div class="layui-card-body">
        <div id="logArea"><div style="color:#999;">等待上传...<\/div></div>
    </div></div>

</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/test/upload-test.js"></script>
</body></html>
