<!DOCTYPE html>
<!-- app/views/quotation/quotetionIndex.html —— 预报（quotetion 并行报价模块）列表（depage 配置驱动；创建/复制/对比） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>预报</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="decoration.orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input name="decoration.designer.userId" data-op="eq" class="layui-input" placeholder="设计师编号"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="padding:0 15px 10px;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnCreate"><i class="layui-icon layui-icon-add-1"></i>创建</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnReplica"><i class="layui-icon layui-icon-upload"></i>复制</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnCompare"><i class="layui-icon layui-icon-cols"></i>对比</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="copy">复制</button>
        <button class="layui-btn layui-btn-xs" lay-event="edit">修改</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="view">查看</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
    <div id="editBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">版本</label><div class="layui-input-inline"><select id="quotationVersion"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input id="orderIdInput" class="layui-input" placeholder="装修单号"></div></div>
    </div>
    <div id="replicaBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">复制类型</label><div class="layui-input-inline"><select id="replicaType"><option value="0">唯一编号</option><option value="1">装修单号</option></select></div></div>
        <div class="layui-form-item" id="replicaNoGroup"><label class="layui-form-label">预报编号</label><div class="layui-input-inline"><input id="quotetionNo" class="layui-input"></div></div>
        <div class="layui-form-item" id="replicaOrderGroup" style="display:none;"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input id="replicaOrderId" class="layui-input" placeholder="装修单号（失焦加载报价）"></div></div>
        <div class="layui-form-item" id="replicaQuotationGroup" style="display:none;"><label class="layui-form-label">报价单</label><div class="layui-input-inline" style="width:260px;"><select id="quotationSel"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">保留</label><div class="layui-input-inline" style="text-align:left;padding-top:9px;">
            <input type="checkbox" id="quotationTime" title="保价时间"><input type="checkbox" id="quotationPrice" title="保价价格">
        </div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/quotetionIndex.js"></script>
</body></html>
