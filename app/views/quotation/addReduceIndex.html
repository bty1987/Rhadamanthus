<!DOCTYPE html>
<!-- app/views/quotation/addReduceIndex.html —— 增减项列表
  订单模式（默认）：queryAddReduceByOrderId + 批量提交/发送/打印（addReduceOutput）+ 创建；
  页面模式（?type=page&depage=）：queryQuotationFunctionRight(page,6) 配置驱动；
  决算模式（?type=account）：决算/工费 行操作。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>增减项</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px;">
        <span style="font-size:16px;font-weight:bold;">增减项<span id="orderIdLabel"></span></span>
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>创建</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnSubmit"><i class="layui-icon layui-icon-ok"></i>批量提交</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnNotice"><i class="layui-icon layui-icon-send"></i>发送通知</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnPrint"><i class="layui-icon layui-icon-print"></i>打印</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnRefresh"><i class="layui-icon layui-icon-refresh"></i>刷新</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div id="decorationInfo" style="padding:0 15px 10px;">
        <blockquote class="layui-elem-quote" style="padding:8px 15px;">
            装修单:<span id="decoOrderId">-</span> ｜ 地址:<span id="decoAddress">-</span> ｜ 报价版本:<span id="decoVersion">-</span>
            ｜ 报价折扣:<span id="quoDiscount">-</span> ｜ 管理费:<span id="quoManage">-</span> ｜ 税金:<span id="quoTax">-</span> ｜ 报价总额:<span id="quoTotal">-</span>
        </blockquote>
    </div>
    <div class="app-search" id="searchArea" style="display:none;"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="decoration.orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input name="decoration.designer.userId" data-op="eq" class="layui-input" placeholder="设计师编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类别</label><div class="layui-input-inline"><select name="type" data-op="eq"><option value="">全部</option><option value="0">增项</option><option value="1">减项</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="atttype" data-op="eq"><option value="">全部</option><option value="0">工程</option><option value="1">主材</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">提交</option><option value="2">已付款</option><option value="3">已确认</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table" style="padding:0 15px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar"></script>
    <div id="editBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">类别</label><div class="layui-input-inline"><select id="addReduceType"><option value="0">增项</option><option value="1">减项</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select id="atttype"><option value="0">工程</option><option value="1">主材</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-inline" style="width:320px;"><input id="addReduceDes" class="layui-input"></div></div>
    </div>
    <div id="accountBox" style="display:none;padding:20px 40px;">
        <div class="layui-form-item"><label class="layui-form-label">决算折扣</label><div class="layui-input-inline"><input id="accountDiscount" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">决算管理折扣</label><div class="layui-input-inline"><input id="accountManageDiscount" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">决算税金折扣</label><div class="layui-input-inline"><input id="accountTaxDiscount" class="layui-input"></div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/addReduceIndex.js"></script>
</body></html>
