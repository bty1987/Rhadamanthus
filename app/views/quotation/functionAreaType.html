<!DOCTYPE html>
<!-- app/views/quotation/functionAreaType.html —— 功能区类型（空间类型字典：客厅/卧室/厨房等，维护 functionareatype 基础数据） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>功能区类型</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:0 15px 10px;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs {{ d.status == 0 ? '' : 'layui-btn-primary' }}" lay-event="status">{{ d.status == 0 ? '启用' : '禁用' }}</button>
    </script>

    <div id="editBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">类型名称</label><div class="layui-input-inline"><input id="typeName" class="layui-input" maxlength="10" placeholder="类型名称"></div></div>
    </div>

</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/functionAreaType.js"></script>
</body></html>
