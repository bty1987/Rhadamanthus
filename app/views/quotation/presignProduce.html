<!DOCTYPE html>
<!-- app/views/quotation/presignProduce.html —— 预签产品（起报价/折扣/管理费税金公式{a}~{k}/成本比例；弹窗：预签项/价格/成本） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>预签产品</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input name="name" data-op="eq" class="layui-input" placeholder="名称"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">发布</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="padding:0 15px 10px;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>创建</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="item">项目</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="price">价格</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="cost">成本</button>
        <button class="layui-btn layui-btn-xs {{ d.status == 0 ? '' : 'layui-btn-primary' }}" lay-event="status">{{ d.status == 0 ? '启用' : '禁用' }}</button>
    </script>
    <div id="editBox" style="display:none;padding:15px 25px;max-height:80%;overflow:auto;">
        <form class="layui-form" lay-filter="editForm">
            <div class="layui-form-item"><label class="layui-form-label">版本</label><div class="layui-input-inline"><select id="version"></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input id="name" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">起报价</label><div class="layui-input-inline"><input id="quotePrice" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">折扣</label><div class="layui-input-inline"><input id="discount" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">二级折扣</label><div class="layui-input-inline"><input id="discountt" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">管理费比例</label><div class="layui-input-inline"><input id="manageRate" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">管理费公式</label><div class="layui-input-inline" style="width:340px;"><input id="manageFormula" class="layui-input" placeholder="起报价/优惠额/功能区/个性/减项/赋能/特殊优惠/浮动额/活动优惠"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">管理费折扣</label><div class="layui-input-inline"><input id="manageDiscount" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">二级管理费折扣</label><div class="layui-input-inline"><input id="manageDiscountt" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">税金比例</label><div class="layui-input-inline"><input id="taxRate" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">税金公式</label><div class="layui-input-inline" style="width:340px;"><input id="taxFormula" class="layui-input" placeholder="起报价/优惠额/功能区/个性/减项/赋能/管理费/特殊优惠/管理优惠/浮动额/活动优惠"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">成本单价</label><div class="layui-input-inline"><input id="costPrice" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">主材成本</label><div class="layui-input-inline"><input id="mostPrice" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">利润率</label><div class="layui-input-inline"><input id="profitRate" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">工程增项成本比例</label><div class="layui-input-inline"><input id="costRate" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">主材增项成本比例</label><div class="layui-input-inline"><input id="mostRate" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">浮动额</label><div class="layui-input-inline"><input id="activityPrice" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">偏移量</label><div class="layui-input-inline"><input id="offset" class="layui-input"></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/presignProduce.js"></script>
</body></html>
