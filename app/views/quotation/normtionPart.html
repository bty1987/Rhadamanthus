<!DOCTYPE html>
<!-- app/views/quotation/normtionPart.html —— 定额单编辑（材料定额/工费定额/附加项/工时定额 4 表 + 生成定额）
  上下文：app.params.quotation = { orderId, quotation:{qid} }。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>定额单编辑</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px;">
        <span style="font-size:16px;font-weight:bold;">定额单编辑<span id="orderIdLabel"></span></span>
        <button type="button" class="layui-btn layui-btn-sm" id="btnAddNormood"><i class="layui-icon layui-icon-add-1"></i>添加材料项</button>
        <button type="button" class="layui-btn layui-btn-sm" id="btnAddNormrice"><i class="layui-icon layui-icon-add-1"></i>添加工费项</button>
        <button type="button" class="layui-btn layui-btn-sm" id="btnAddNormtime"><i class="layui-icon layui-icon-add-1"></i>添加工时项</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnMake"><i class="layui-icon layui-icon-refresh"></i>生成定额</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div style="padding:0 15px 10px;">
        <blockquote class="layui-elem-quote" style="padding:8px 15px;">
            材料总额:<span id="moodTotal">-</span> ｜ 工费总额:<span id="mriceTotal">-</span> ｜ 工时总额:<span id="mtimeTotal">-</span>
        </blockquote>
    </div>
    <div class="layui-tab layui-tab-brief" style="margin:0 15px;" lay-filter="normTab">
        <ul class="layui-tab-title">
            <li class="layui-this">材料定额</li><li>工费定额</li><li>附加项</li><li>工时定额</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show"><table id="tableNormood" lay-filter="tableNormood"></table></div>
            <div class="layui-tab-item"><table id="tableNormrice" lay-filter="tableNormrice"></table></div>
            <div class="layui-tab-item"><table id="tableNormadd" lay-filter="tableNormadd"></table></div>
            <div class="layui-tab-item"><table id="tableNormtime" lay-filter="tableNormtime"></table></div>
        </div>
    </div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
    <script type="text/html" id="riceToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="confirm">确认</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="reject">拒绝</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
    <div id="normoodBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">货品编号</label><div class="layui-input-inline"><input id="noodsName" class="layui-input" placeholder="货品 nid"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">单位</label><div class="layui-input-inline"><input id="unit" class="layui-input" placeholder="定额/库房单位"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">数量</label><div class="layui-input-inline"><input id="normoNum" class="layui-input" placeholder="定额/库房数量"></div></div>
    </div>
    <div id="normriceBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">施工节点</label><div class="layui-input-inline"><select id="constructionNode"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input id="normrName" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工费</label><div class="layui-input-inline"><input id="salary" class="layui-input"></div></div>
    </div>
    <div id="normtimeBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">施工节点</label><div class="layui-input-inline"><select id="normtimeConstructionNode"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input id="normtName" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工时(天)</label><div class="layui-input-inline"><input id="workdays" class="layui-input"></div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/normtionPart.js"></script>
</body></html>
