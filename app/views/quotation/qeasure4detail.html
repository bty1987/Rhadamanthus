<!DOCTYPE html>
<!-- app/views/quotation/qeasure4detail.html —— 量房表详情（wizard → layui tab；无则按模板 makeQeasure 生成；
  表单项：文本/输入框/单选/多选/日期 → handleQeasure 保存；功能区 qeasureFunctionArea 管理）
  上下文：app.params.quotation = { orderId 或 qmid }。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>量房表</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px;">
        <span style="font-size:16px;font-weight:bold;">量房表<span id="orderIdLabel"></span></span>
        <button type="button" class="layui-btn layui-btn-sm" id="btnAddArea"><i class="layui-icon layui-icon-add-1"></i>添加功能区</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnExecute"><i class="layui-icon layui-icon-ok"></i>保存量房信息</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-danger" id="btnDelete"><i class="layui-icon layui-icon-delete"></i>删除量房表</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div class="layui-tab layui-tab-brief" style="margin:10px 15px;" lay-filter="qeasureTab">
        <ul class="layui-tab-title">
            <li class="layui-this">量房信息</li><li>功能区</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <div class="layui-form" lay-filter="qeasureForm" id="itemlist" style="max-height:65vh;overflow:auto;padding:5px 15px;"></div>
            </div>
            <div class="layui-tab-item">
                <div class="app-table"><table id="areaTable" lay-filter="areaTable"></table></div>
                <script type="text/html" id="areaToolbar">
                    <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
                    <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
                </script>
            </div>
        </div>
    </div>
    <div id="areaBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">功能区</label><div class="layui-input-inline" style="width:280px;"><select id="functionAreaSel"></select></div></div>
    </div>
    <div id="areaEditBox" style="display:none;padding:20px 40px;">
        <div id="areaEditForm"></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/qeasure4detail.js"></script>
</body></html>
