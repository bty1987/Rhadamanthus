<!DOCTYPE html>
<!-- app/views/quotation/presignCost.html —— 预签成本（弹窗页：面积上下限成本单价列表，金额 tranargs） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>预签成本</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加预签成本</button>
    </div>
    <div class="app-table" style="padding:0 15px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
    <div id="editBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">上限面积</label><div class="layui-input-inline"><input id="toplimit" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">下限面积</label><div class="layui-input-inline"><input id="lowlimit" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">成本单价</label><div class="layui-input-inline"><input id="costPrice" class="layui-input"></div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/presignCost.js"></script>
</body></html>
