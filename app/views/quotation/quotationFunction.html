<!DOCTYPE html>
<!-- app/views/quotation/quotationFunction.html —— 报价功能配置（页面级功能列表 + api/条件/字段/功能/类型/状态 分组配置） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>报价功能配置</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-table" style="padding:10px 15px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="config">配置</button>
    </script>
    <div id="configBox" style="display:none;padding:15px 25px;max-height:75%;overflow:auto;">
        <div class="layui-form" lay-filter="configForm">
            <div><h4 style="margin:8px 0;">接口</h4><div id="apiData"></div></div>
            <div><h4 style="margin:8px 0;">条件</h4><div id="condArrData"></div></div>
            <div><h4 style="margin:8px 0;">字段</h4><div id="fieldData"></div></div>
            <div><h4 style="margin:8px 0;">功能</h4><div id="functionData"></div></div>
            <div><h4 style="margin:8px 0;">类型</h4><div id="typeData"></div></div>
            <div><h4 style="margin:8px 0;">状态</h4><div id="statusData"></div></div>
        </div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/quotationFunction.js"></script>
</body></html>
