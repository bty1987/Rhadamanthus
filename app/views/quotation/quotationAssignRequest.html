<!DOCTYPE html>
<!-- app/views/quotation/quotationAssignRequest.html —— 预算分配请求（?mode=self 自助 / ?type=budget|design 维度切换；
  新建 createQuotationAssignRequest；行操作：自动/手动分配/替换/转交/交付/取消/编辑/删除/沟通） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>预算分配请求</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">公司</label><div class="layui-input-inline"><input name="company.cid" data-op="eq" class="layui-input" placeholder="公司编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label" id="userLabel">预算员</label><div class="layui-input-inline"><input name="budgetUser.userId" data-op="eq" class="layui-input" placeholder="预算员编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="1">待分配</option><option value="2">已分配</option><option value="3">已完成</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="padding:0 15px 10px;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnCreate"><i class="layui-icon layui-icon-add-1"></i>新建请求</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnAutoAssign"><i class="layui-icon layui-icon-refresh"></i>自动分配</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnManualAssign"><i class="layui-icon layui-icon-user"></i>手动分配</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="manual">手动分配</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="replace">替换</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="finish">交付</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="talk">沟通</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="cancel">取消请求</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
    <div id="editBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input id="orderId" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">公司</label><div class="layui-input-inline" style="width:280px;"><select id="companySel"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">装修类型</label><div class="layui-input-inline"><select id="decorationType"><option value="0">半包</option><option value="1">整装</option><option value="2">全包</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">优先级</label><div class="layui-input-inline"><select id="priority"><option value="5">普通</option><option value="3">高</option><option value="1">最高</option><option value="7">低</option><option value="9">最低</option></select></div></div>
    </div>
    <div id="manualBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label" id="manualUserLabel">预算员</label><div class="layui-input-inline" style="width:280px;"><select id="budgeterSel"></select></div></div>
    </div>
    <div id="replaceBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">新预算员</label><div class="layui-input-inline" style="width:280px;"><select id="replaceBudgeterSel"></select></div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/quotationAssignRequest.js"></script>
</body></html>
