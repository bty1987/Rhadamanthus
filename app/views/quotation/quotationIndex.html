<!DOCTYPE html>
<!-- app/views/quotation/quotationIndex.html —— 报价单列表（订单模式 + ?type=page&depage= 配置模式）
  创建/修改/复制/导入报价(clone/replica)；行操作：打印/记录/提交/审完/交付/审核/制作/查看/删除/默认/锁定/解锁/选材/定额/退单/优惠/信息/标签/装修单 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>报价单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px;">
        <span style="font-size:16px;font-weight:bold;">报价单<span id="orderIdLabel"></span></span>
        <button type="button" class="layui-btn layui-btn-sm" id="btnCreate"><i class="layui-icon layui-icon-add-1"></i>创建报价</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnCopy"><i class="layui-icon layui-icon-file"></i>复制报价</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnReplica"><i class="layui-icon layui-icon-upload"></i>导入报价</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div id="decorationInfo" style="padding:0 15px 10px;">
        <blockquote class="layui-elem-quote" style="padding:8px 15px;">
            装修单:<span id="decoOrderId">-</span> ｜ 地址:<span id="decoAddress">-</span> ｜ 报价版本:<span id="decoVersion">-</span>
            ｜ 可用数量:<span id="limitNum">-</span> ｜ 已用:<span id="usedNum">0</span> ｜ 剩余:<span id="subNum">0</span>
        </blockquote>
    </div>
    <div class="app-search" id="searchArea" style="display:none;"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="decoration.orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼盘</label><div class="layui-input-inline"><input name="decoration.village.no" data-op="eq" class="layui-input" placeholder="楼盘编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input name="decoration.designer.userId" data-op="eq" class="layui-input" placeholder="设计师编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input name="name" data-op="cn" class="layui-input" placeholder="报价名称"></div></div>
        <div class="layui-inline"><label class="layui-form-label">审核状态</label><div class="layui-input-inline"><select name="attstatus" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">提交</option><option value="2">审批</option><option value="3">完成</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table" style="padding:0 15px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar"></script>

    <div id="editBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item" id="createOredrIdGroup"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input id="createOredrId" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input id="name" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">风格</label><div class="layui-input-inline"><input id="style" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-inline" style="width:320px;"><input id="content" class="layui-input"></div></div>
        <div class="layui-form-item" id="copyFlags" style="display:none;"><label class="layui-form-label">保留</label><div class="layui-input-inline" style="text-align:left;padding-top:9px;">
            <input type="checkbox" id="quotationTimeCopy" title="保价时间"><input type="checkbox" id="quotationPriceCopy" title="保价价格">
        </div></div>
    </div>

    <div id="replicaBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">复制类型</label><div class="layui-input-inline"><select id="replicaType"><option value="0">唯一编号</option><option value="1">装修单号</option></select></div></div>
        <div class="layui-form-item" id="replicaNoGroup"><label class="layui-form-label">报价编号</label><div class="layui-input-inline"><input id="quotetionNo" class="layui-input" placeholder="报价编号"></div></div>
        <div class="layui-form-item" id="replicaOrderIdGroup" style="display:none;"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input id="replicaOrderId" class="layui-input" placeholder="装修单号（失焦加载报价）"></div></div>
        <div class="layui-form-item" id="replicaQuotationGroup" style="display:none;"><label class="layui-form-label">报价单</label><div class="layui-input-inline" style="width:260px;"><select id="quotationSel"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">保留</label><div class="layui-input-inline" style="text-align:left;padding-top:9px;">
            <input type="checkbox" id="quotationTime" title="保价时间"><input type="checkbox" id="quotationPrice" title="保价价格">
        </div></div>
    </div>

    <div id="preferBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">优惠额</label><div class="layui-input-inline"><input id="preferPrice" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">管理优惠</label><div class="layui-input-inline"><input id="managePrefer" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">特殊优惠</label><div class="layui-input-inline"><input id="advancePrefer" class="layui-input"></div></div>
    </div>

    <div id="infoBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">换设计</label><div class="layui-input-inline"><select id="redo"><option value="0">未换设计</option><option value="1">换设计</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">进度</label><div class="layui-input-inline"><select id="urgent"><option value="0">客户在店</option><option value="1">提前完成</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">图纸</label><div class="layui-input-inline"><select id="drawing"><option value="0">无</option></select></div></div>
    </div>

    <div id="printBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">打印类型</label><div class="layui-input-inline" style="text-align:left;padding-top:9px;">
            <input type="checkbox" name="printType" value="1" title="管理费">
            <input type="checkbox" name="printType" value="2" title="赋能">
            <input type="checkbox" name="printType" value="4" title="标配外">
            <input type="checkbox" name="printType" value="8" title="个性化">
            <input type="checkbox" name="printType" value="16" title="减项">
        </div></div>
    </div>

    <div id="refundBox" style="display:none;padding:20px 40px;">
        <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-inline" style="width:320px;"><input id="refundComment" class="layui-input"></div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/quotationIndex.js"></script>
</body></html>
