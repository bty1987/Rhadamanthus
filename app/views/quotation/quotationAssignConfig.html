<!DOCTYPE html>
<!-- app/views/quotation/quotationAssignConfig.html —— 预算分配配置（公司/部门/启用/自动分配；启停/删除） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>预算分配配置</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">公司</label><div class="layui-input-inline"><input name="company.cid" data-op="eq" class="layui-input" placeholder="公司编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="enabled" data-op="eq"><option value="">全部</option><option value="1">启用</option><option value="0">禁用</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="padding:0 15px 10px;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>新增</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="toggle">{{ d.enabled == 1 ? '禁用' : '启用' }}</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
    <div id="editBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">公司</label><div class="layui-input-inline" style="width:280px;"><select id="companySel"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">部门</label><div class="layui-input-inline" style="width:280px;"><select id="departmentSel"><option value="">所有部门</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">自动分配</label><div class="layui-input-inline"><select id="autoAssign"><option value="0">手动</option><option value="1">自动</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">启用</label><div class="layui-input-inline"><select id="enabled"><option value="1">启用</option><option value="0">禁用</option></select></div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/quotationAssignConfig.js"></script>
</body></html>
