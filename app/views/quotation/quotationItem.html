<!DOCTYPE html>
<!-- app/views/quotation/quotationItem.html —— 报价项管理（?pageType=selection|norm|finance 切按钮集）
  列表 pageQuotationItem；编辑 add/updateQuotationItem（价格 tranargs ÷1000）；状态/折扣开关；
  公式 updateQuotationItemForFormula（{a}~{k} 变量）；成本 updateQuotationItemForCost；
  弹窗：选材复制(soods)/定额材料/定额工费/定额工时/关联报价项/价格。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>报价项</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">版本</label><div class="layui-input-inline"><select name="version.no" data-op="eq" id="sVersion"><option value="">全部</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input name="name" data-op="cn" class="layui-input" placeholder="名称"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="category.id" data-op="eq" id="sQuotationType"><option value="">全部</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">分类</label><div class="layui-input-inline"><select name="classification.id" data-op="eq" id="sClassification"><option value="">全部</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">大类</label><div class="layui-input-inline"><select name="bigCategory.id" data-op="eq" id="sBigCategory"><option value="">全部</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">小类</label><div class="layui-input-inline"><select name="smallCategory.id" data-op="eq" id="sSmallCategory"><option value="">全部</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">业务</label><div class="layui-input-inline"><select name="type" data-op="eq"><option value="">全部</option><option value="0">标准</option><option value="1">自定义</option><option value="2">车运</option><option value="3">管理</option><option value="4">不计</option><option value="5">成本</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="padding:0 15px 10px;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd" style="display:none;"><i class="layui-icon layui-icon-add-1"></i>添加</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnImport" style="display:none;"><i class="layui-icon layui-icon-upload"></i>导入</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnExport" style="display:none;"><i class="layui-icon layui-icon-download-circle"></i>导出</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar"></script>
    <script type="text/html" id="copyToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="copy">复制</button>
    </script>

    <div id="editBox" style="display:none;padding:15px 25px;max-height:80%;overflow:auto;">
        <form class="layui-form" lay-filter="editForm">
            <div class="layui-form-item"><label class="layui-form-label">编号</label><div class="layui-input-inline"><input id="no" class="layui-input" placeholder="格式: (QI_00001)"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">版本</label><div class="layui-input-inline"><select id="version"></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input id="name" class="layui-input" placeholder="名称"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">别名</label><div class="layui-input-inline"><input id="alias" class="layui-input" placeholder="别名"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">业务</label><div class="layui-input-inline"><select id="type"><option value="0">标准</option><option value="1">自定义</option><option value="2">车运</option><option value="3">管理</option><option value="4">不计</option><option value="5">成本</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select id="quotationType" lay-filter="quotationTypeFilter"></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">分类</label><div class="layui-input-inline"><select id="quotationClassification"></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">大类</label><div class="layui-input-inline"><select id="quotationBigCategory"></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">小类</label><div class="layui-input-inline"><select id="quotationSmallCategory"></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">单位</label><div class="layui-input-inline"><select id="measurementUnit"></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">工种</label><div class="layui-input-inline"><select id="workType"></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">增补价</label><div class="layui-input-inline"><input id="addPrice" class="layui-input" placeholder="增补价"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">单价</label><div class="layui-input-inline"><input id="unitPrice" class="layui-input" placeholder="单价"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">退减价</label><div class="layui-input-inline"><input id="subPrice" class="layui-input" placeholder="退减价"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">业绩额</label><div class="layui-input-inline"><input id="achePrices" class="layui-input" placeholder="业绩额"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-inline"><input id="comment" class="layui-input" placeholder="说明"></div></div>
        </form>
    </div>

    <div id="formulaBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">公式</label><div class="layui-input-inline" style="width:320px;"><input id="formula" class="layui-input" placeholder="如: 取整(周长*2.5)+面积"></div></div>
        <p style="color:#999;padding-left:110px;">变量: 取整 周长 反计价面积 计价面积 面积 举架 洞面 参数 窗面 变量 梁长 梁高 楼层 电梯 税金 管理费 不打折总额 打折总额 车运费</p>
    </div>

    <div id="costBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">成本</label><div class="layui-input-inline"><input id="cost" class="layui-input" placeholder="成本"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">业绩额</label><div class="layui-input-inline"><input id="achePrice" class="layui-input" placeholder="业绩额"></div></div>
    </div>

    <div id="selectItemBox" style="display:none;padding:10px 15px;">
        <form class="layui-form" id="copyForm"><div class="layui-form-item">
            <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input name="name" data-op="cn" class="layui-input" placeholder="名称"></div></div>
            <div class="layui-inline"><button type="button" class="layui-btn" id="btnCopySearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
        </div></form>
        <table id="copyTable" lay-filter="copyTable"></table>
        <div id="copyPagenation"></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/quotationItem.js"></script>
</body></html>
