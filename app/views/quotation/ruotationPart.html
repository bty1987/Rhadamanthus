<!DOCTYPE html>
<!-- app/views/quotation/ruotationPart.html —— 软装报价编辑（按报价功能区加载退报项；数量公式编辑/删除/从报价项添加）
  上下文：app.params.quotation = { ruotation: {qrid, decoration.orderId, quotation.qid} }。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>软装报价编辑</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px;">
        <span style="font-size:16px;font-weight:bold;">软装报价编辑<span id="quotationName"></span></span>
        <button type="button" class="layui-btn layui-btn-sm" id="btnAddItem"><i class="layui-icon layui-icon-add-1"></i>从报价项添加</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div style="padding:0 15px 10px;">
        <blockquote class="layui-elem-quote" style="padding:8px 15px;">
            装修单:<span id="orderId">-</span> ｜ 地址:<span id="address">-</span> ｜ 报价版本:<span id="version">-</span>
            ｜ <b style="color:#E2737D;">总额:<span id="totalPrice">-</span></b>
        </blockquote>
    </div>
    <div id="areaTables" style="padding:0 15px;"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="editNum">数量</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
    <div id="numBox" style="display:none;padding:20px 40px;">
        <div class="layui-form-item"><label class="layui-form-label">公式/数量</label><div class="layui-input-inline"><input id="numInput" class="layui-input" placeholder="如: 2*3.5 或 7"></div></div>
    </div>
    <div id="itemsBox" style="display:none;padding:10px 15px;">
        <table id="pickTable" lay-filter="pickTable"></table>
        <div style="margin-top:10px;text-align:right;"><button type="button" class="layui-btn" id="btnSaveItems">保存勾选</button></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/ruotationPart.js"></script>
</body></html>
