<!DOCTYPE html>
<!-- app/views/quotation/quotetionCompare.html —— 预报对比（预报 quotetion vs 报价 quotation：功能区/项并排对比） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>预报对比</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px;">
        <span style="font-size:16px;font-weight:bold;">预报对比</span>
        <div class="layui-inline"><label class="layui-form-label">预报编号</label><div class="layui-input-inline"><input id="quotetionNo" class="layui-input" placeholder="预报编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">报价编号</label><div class="layui-input-inline"><input id="quotationNo" class="layui-input" placeholder="报价 qid"></div></div>
        <button type="button" class="layui-btn layui-btn-sm" id="btnCompare"><i class="layui-icon layui-icon-search"></i>对比</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div class="app-table" style="padding:0 15px;"><table id="resultTable" lay-filter="resultTable"></table></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/quotetionCompare.js"></script>
</body></html>
