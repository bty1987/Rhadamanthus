<!DOCTYPE html>
<!-- app/views/quotation/quotationVersion.html —— 报价版本管理（版本列表/编辑/默认/启停/导出报价项/定额材料/定额工费） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>报价版本</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">版本编号</label><div class="layui-input-inline"><input name="no" data-op="eq" class="layui-input" placeholder="版本编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">版本名称</label><div class="layui-input-inline"><input name="name" data-op="cn" class="layui-input" placeholder="版本名称"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type" data-op="eq"><option value="">全部</option><option value="-1">通用</option><option value="0">半包</option><option value="1">整装</option><option value="2">满减</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="padding:0 15px 10px;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="expItem">导出报价项</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="expNood">导出定额材料</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="expRice">导出定额工费</button>
        <button class="layui-btn layui-btn-xs {{ d.defaultFlag == 1 ? '' : 'layui-btn-primary' }}" lay-event="default">默认</button>
        <button class="layui-btn layui-btn-xs {{ d.status == 0 ? '' : 'layui-btn-primary' }}" lay-event="status">{{ d.status == 0 ? '启用' : '禁用' }}</button>
    </script>

    <div id="editBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="editForm" lay-filter="editForm">
            <div class="layui-form-item"><label class="layui-form-label">版本名称</label><div class="layui-input-inline"><input id="name" class="layui-input" placeholder="版本名称"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">车运费比例</label><div class="layui-input-inline"><input id="trafficRate" class="layui-input" placeholder="车运费比例"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">车运费折扣</label><div class="layui-input-inline"><input type="checkbox" id="trafficDiscount" lay-skin="switch" lay-text="打折|不打折"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">管理费比例</label><div class="layui-input-inline"><input id="manageRate" class="layui-input" placeholder="管理费比例"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">管理费折扣</label><div class="layui-input-inline"><input type="checkbox" id="manageDiscount" lay-skin="switch" lay-text="打折|不打折"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">税金比例</label><div class="layui-input-inline"><input id="taxRate" class="layui-input" placeholder="税金比例"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">税金折扣</label><div class="layui-input-inline" style="text-align:left;padding-top:9px;">
                <input type="radio" name="taxDiscount" id="notTaxDiscount" value="0" title="无税金">
                <input type="radio" name="taxDiscount" id="manageTaxDiscount" value="1" title="管理税金">
                <input type="radio" name="taxDiscount" id="totalTaxDiscount" value="2" title="总额税金">
            </div></div>
            <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select id="type"><option value="-1">通用</option><option value="0">半包</option><option value="1">整装</option><option value="2">满减</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">偏移量</label><div class="layui-input-inline"><input id="offset" class="layui-input" placeholder="偏移量"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-inline"><input id="comment" class="layui-input" placeholder="备注"></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/quotationVersion.js"></script>
</body></html>
