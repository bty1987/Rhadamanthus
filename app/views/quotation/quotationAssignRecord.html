<!DOCTYPE html>
<!-- app/views/quotation/quotationAssignRecord.html —— 预算分配记录（公司/预算员/装修单号/分配方式/结果；只读查询） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>预算分配记录</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">公司</label><div class="layui-input-inline"><input name="company.cid" data-op="eq" class="layui-input" placeholder="公司编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">预算员</label><div class="layui-input-inline"><input name="budgetUser.userId" data-op="eq" class="layui-input" placeholder="预算员编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/quotationAssignRecord.js"></script>
</body></html>
