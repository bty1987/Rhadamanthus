<!DOCTYPE html>
<!-- app/views/quotation/normriceItem.html —— 附加项管理（弹窗页：按装修单默认报价的附加项，新增/确认/驳回/删除）
  上下文：app.params.quotation.orderId + app.params.construction.constructionSchedule.cnid（按施工节点过滤附加项模板）。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>附加项</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px;">
        <span style="font-weight:bold;" id="orderIdLabel">-</span>
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>新增附加项</button>
    </div>
    <div class="app-table" style="padding:0 15px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="confirm">确认</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="reject">驳回</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
    <div id="editBox" style="display:none;padding:20px 30px;">
        <div class="layui-form-item"><label class="layui-form-label">附加项</label><div class="layui-input-inline" style="width:300px;"><select id="niNormadd"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">数量</label><div class="layui-input-inline"><input id="niNum" class="layui-input" value="1"></div></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/quotation/quotation-common.js"></script><script src="../../js/quotation/normriceItem.js"></script>
</body></html>
