<!DOCTYPE html>
<!-- app/views/store/muser.html —— 商城用户（列表 + 编辑）
  字段：name(昵称) phone(手机) gender(性别) birthday(生日) unionId -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>商城用户</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">昵称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="昵称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">手机号</label><div class="layui-input-inline"><input type="text" name="phone" data-op="cn" placeholder="手机号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="unionId">
        <div class="layui-form-item"><label class="layui-form-label">昵称</label><div class="layui-input-block"><input type="text" name="name" placeholder="昵称" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">手机号</label><div class="layui-input-block"><input type="text" name="phone" placeholder="手机号" class="layui-input v_phone"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">性别</label><div class="layui-input-block">
            <select name="gender"><option value="">未知</option><option value="true">男</option><option value="false">女</option></select>
        </div></div>
        <div class="layui-form-item"><label class="layui-form-label">生日</label><div class="layui-input-inline"><input type="text" name="birthday" id="birthday" placeholder="生日" class="layui-input" readonly></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/store/muser.js"></script>
</body></html>
