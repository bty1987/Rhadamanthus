<!DOCTYPE html>
<!-- app/views/store/picture.html —— 商品图片（上传 + 删除）
  字段：img(图URL) gid(商品) type(类型) pid
  两种图片：slideImg(轮播) detailImg(详情)，type 区分 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>商品图片</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">商品ID</label><div class="layui-input-inline"><input type="number" name="gid" id="searchGid" placeholder="商品ID" class="layui-input" value="0"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="slideUpload"><i class="layui-icon layui-icon-upload"></i>上传轮播图</button></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="detailUpload"><i class="layui-icon layui-icon-upload"></i>上传详情图</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/store/picture.js"></script>
</body></html>
