<!DOCTYPE html>
<!-- app/views/store/coupon.html —— 优惠券（CRUD + 启用/禁用）
  字段：title(券名) type(0券值/1折扣) value(面值/折扣率,金额需tranargs) status(状态)
  ★ value 是金额字段：pageCoupon/addCoupon/updateCoupon 已声明 tranargs（×1000/÷1000）-->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>优惠券</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
    <div class="app-search">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">券名</label>
                    <div class="layui-input-inline"><input type="text" name="title" data-op="cn" placeholder="券名" class="layui-input" autocomplete="off"></div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">类型</label>
                    <div class="layui-input-inline">
                        <select name="type" data-op="eq">
                            <option value="">全部</option>
                            <option value="0">券值</option>
                            <option value="1">折扣</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                    <button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
                </div>
            </div>
        </form>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>

    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form" id="editForm">
            <input type="hidden" name="cid">
            <div class="layui-form-item">
                <label class="layui-form-label">券名<span class="app-req">*</span></label>
                <div class="layui-input-block"><input type="text" name="title" placeholder="请输入券名" class="layui-input v_required" lay-verify="required"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">类型</label>
                <div class="layui-input-block">
                    <select name="type">
                        <option value="0">券值</option>
                        <option value="1">折扣</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">面值<span class="app-req">*</span></label>
                <div class="layui-input-inline"><input type="text" name="value" placeholder="券值/折扣率" class="layui-input v_required v_float_3" lay-verify="required"></div>
                <div class="layui-form-mid layui-word-aux">券值填金额(元)，折扣填0-1</div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnSave">保存</button>
                <button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
            </div>
        </form>
    </div>

    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs" lay-event="enable">启用</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button>
    </script>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/store/coupon.js"></script>
</body>
</html>
