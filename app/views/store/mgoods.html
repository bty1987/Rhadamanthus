<!DOCTYPE html>
<!-- app/views/store/mgoods.html —— 商城商品（CRUD + 图片 + 金额 + 品牌 + 状态）
  字段：name(商品名) no(编号) price(价格,金额→tranargs) barcode(条码) defaultImg(图片) mbrand(品牌) status -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>商城商品</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">商品名</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="商品名" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="gid">
        <input type="hidden" name="defaultImg">
        <div class="layui-form-item"><label class="layui-form-label">商品名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="商品名" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">编号</label><div class="layui-input-inline"><input type="text" name="no" placeholder="商品编号" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">价格<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="price" placeholder="价格(元)" class="layui-input v_required v_float_3" lay-verify="required"></div><div class="layui-form-mid layui-word-aux">元</div></div>
        <div class="layui-form-item"><label class="layui-form-label">条码</label><div class="layui-input-inline"><input type="text" name="barcode" placeholder="条码" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品牌</label><div class="layui-input-inline"><select name="bid" id="brandSel"><option value="">请选择品牌</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">商品图</label><div class="layui-input-block"><div style="margin-bottom:10px;"><img id="goodsImg" src="" style="width:100px;height:100px;object-fit:cover;border:1px solid #e8e8e8;border-radius:4px;display:none;"></div><button type="button" class="layui-btn" id="imgUpload"><i class="layui-icon layui-icon-upload"></i>上传图片</button></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs" lay-event="enable">启用</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/store/mgoods.js"></script>
</body></html>
