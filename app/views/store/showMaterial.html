<!DOCTYPE html>
<!-- app/views/store/showMaterial.html —— 材料展示（分类筛选 + 商品网格）
  字段：gid name price img defaultImg；按品类(mcategory)筛选，网格展示 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>材料展示</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css">
<style>
.app-goods-grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
.app-goods-card { width: 180px; background: #fff; border: 1px solid #e8e8e8; border-radius: 6px; overflow: hidden; transition: box-shadow .2s; }
.app-goods-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.app-goods-card img { width: 100%; height: 140px; object-fit: cover; background: #f5f5f5; }
.app-goods-card .info { padding: 10px; }
.app-goods-card .name { font-size: 14px; color: #333; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-goods-card .price { font-size: 16px; color: #ff5722; font-weight: 500; }
.app-goods-card .brand { font-size: 12px; color: #999; }
</style></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">品类</label><div class="layui-input-inline"><select name="cid" id="categorySel"><option value="">全部品类</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">商品名</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="商品名" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
    </div></form></div>
    <div class="app-goods-grid" id="goodsGrid"></div>
    <div id="pagenation" class="app-pagenation"></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/store/showMaterial.js"></script>
</body></html>
