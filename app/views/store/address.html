<!DOCTYPE html>
<!-- app/views/store/address.html —— 收货地址（CRUD + 启用/禁用）
  字段：name(收货人) province(省) proper(市) city(区) address(详细地址) phone(电话) uid(用户) status -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>收货地址</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
    <div class="app-search">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">收货人</label>
                    <div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="收货人" class="layui-input" autocomplete="off"></div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                    <button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
                </div>
            </div>
        </form>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>

    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form" id="editForm">
            <input type="hidden" name="aid">
            <input type="hidden" name="uid" value="0">
            <div class="layui-form-item">
                <label class="layui-form-label">收货人<span class="app-req">*</span></label>
                <div class="layui-input-block"><input type="text" name="name" placeholder="收货人姓名" class="layui-input v_required" lay-verify="required"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">手机号<span class="app-req">*</span></label>
                <div class="layui-input-block"><input type="text" name="phone" placeholder="手机号" class="layui-input v_required v_phone" lay-verify="required"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">省</label>
                <div class="layui-input-block"><input type="text" name="province" placeholder="省" class="layui-input"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">市</label>
                <div class="layui-input-block"><input type="text" name="proper" placeholder="市" class="layui-input"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">区</label>
                <div class="layui-input-block"><input type="text" name="city" placeholder="区/县" class="layui-input"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">详细地址<span class="app-req">*</span></label>
                <div class="layui-input-block"><input type="text" name="address" placeholder="详细地址" class="layui-input v_required" lay-verify="required"></div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnSave">保存</button>
                <button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
            </div>
        </form>
    </div>

    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs" lay-event="enable">启用</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button>
    </script>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/store/address.js"></script>
</body>
</html>
