<!DOCTYPE html>
<!-- app/views/store/slide.html —— 商城轮播图（CRUD + 图片上传 + 状态）
  字段：img(图URL) gid(商品ID) url(跳转链接) status -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>商城轮播图</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加轮播图</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="sid">
        <input type="hidden" name="img">
        <div class="layui-form-item"><label class="layui-form-label">轮播图</label><div class="layui-input-block"><div style="margin-bottom:10px;"><img id="slideImg" src="" style="width:200px;height:100px;object-fit:cover;border:1px solid #e8e8e8;border-radius:4px;display:none;"></div><button type="button" class="layui-btn" id="pictureUpload"><i class="layui-icon layui-icon-upload"></i>上传图片</button></div></div>
        <div class="layui-form-item"><label class="layui-form-label">商品ID</label><div class="layui-input-inline"><input type="number" name="gid" placeholder="关联商品ID" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">跳转链接</label><div class="layui-input-block"><input type="text" name="url" placeholder="点击跳转URL（可选）" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs" lay-event="enable">启用</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/store/slide.js"></script>
</body></html>
