<!DOCTYPE html>
<!-- app/views/data/buildingNameRule.html —— 楼盘命名规则（CRUD + 删除）
  字段：buildingNameRuleId(编号) rule(规则JSON) ruleContent(说明) ruleExample(示例) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>楼盘命名规则</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="id">
        <div class="layui-form-item"><label class="layui-form-label">规则编号<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="buildingNameRuleId" placeholder="规则编号" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">规则</label><div class="layui-input-block"><input type="text" name="rule" placeholder="规则(JSON)" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">规则说明</label><div class="layui-input-block"><textarea name="ruleContent" placeholder="规则说明" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item"><label class="layui-form-label">规则示例</label><div class="layui-input-block"><input type="text" name="ruleExample" placeholder="规则示例" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/buildingNameRule.js"></script>
</body></html>
