<!DOCTYPE html>
<!-- app/views/data/supplierSignet.html —— 厂商签章（CRUD + 多状态，关联 suid）
  字段：no(编号) name(名称) corporation(法人) taxNo(税号) address(地址) phone(电话) bankName/bankNo(开户行/账号) keyword(关键字) type(类型) path(图片) status(状态) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>厂商签章</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">厂商ID</label><div class="layui-input-inline"><input type="number" name="suid" id="searchSuid" placeholder="厂商ID" class="layui-input" value="0"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="ssid">
        <div class="layui-form-item"><label class="layui-form-label">编号<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="no" placeholder="编号" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="名称" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">法人</label><div class="layui-input-inline"><input type="text" name="corporation" placeholder="法人" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">税号</label><div class="layui-input-inline"><input type="text" name="taxNo" placeholder="税号" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">地址</label><div class="layui-input-block"><input type="text" name="address" placeholder="地址" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">电话</label><div class="layui-input-inline"><input type="text" name="phone" placeholder="电话" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">开户行</label><div class="layui-input-inline"><input type="text" name="bankName" placeholder="开户行" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">账号</label><div class="layui-input-inline"><input type="text" name="bankNo" placeholder="账号" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">关键字</label><div class="layui-input-block"><input type="text" name="keyword" placeholder="关键字" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="0">类型0</option><option value="1">类型1</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">图片路径</label><div class="layui-input-block"><input type="text" name="path" id="path" placeholder="图片路径" class="layui-input"><button type="button" class="layui-btn layui-btn-primary" id="btnUpload">上传图片</button></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="cancel">作废</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/supplierSignet.js"></script>
</body></html>
