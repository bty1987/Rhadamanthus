<!DOCTYPE html>
<!-- app/views/data/village.html —— 楼盘管理（CRUD + 状态切换）
  字段：no(编号) name(楼盘名) developer(开发商) salesPhone(售楼电话) mileage(距离) deliveryTime(交房) url(链接) status -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>楼盘管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">楼盘名</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="楼盘名" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="vid">
        <div class="layui-form-item"><label class="layui-form-label">编号<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="no" placeholder="编号" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">楼盘名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="楼盘名" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">开发商</label><div class="layui-input-block"><input type="text" name="developer" placeholder="开发商" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">售楼电话</label><div class="layui-input-inline"><input type="text" name="salesPhone" placeholder="售楼电话" class="layui-input v_phone"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">距离(km)</label><div class="layui-input-inline"><input type="text" name="mileage" placeholder="距离" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">交房时间</label><div class="layui-input-inline"><input type="text" name="deliveryTime" placeholder="交房时间" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">链接</label><div class="layui-input-block"><input type="text" name="url" placeholder="楼盘链接" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea name="content" placeholder="备注" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs" lay-event="enable">启用</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/village.js"></script>
</body></html>
