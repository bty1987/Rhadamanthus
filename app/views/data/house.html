<!DOCTYPE html>
<!-- app/views/data/house.html —— 房屋管理（列表 + 编辑，关联楼盘）
  字段：houseNumber(房号) houseType(户型) buildArea(建筑面积) innerArea(套内) floor(楼层) door(门牌) built(建成年份) heatingType(采暖) feature(特点) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>房屋管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">房号</label><div class="layui-input-inline"><input type="text" name="houseNumber" data-op="cn" placeholder="房号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="hid">
        <div class="layui-form-item"><label class="layui-form-label">房号<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="houseNumber" placeholder="房号" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">户型</label><div class="layui-input-inline"><input type="text" name="houseType" placeholder="户型" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">建筑面积</label><div class="layui-input-inline"><input type="text" name="buildArea" placeholder="㎡" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">套内面积</label><div class="layui-input-inline"><input type="text" name="innerArea" placeholder="㎡" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">楼层</label><div class="layui-input-inline"><input type="text" name="floor" placeholder="楼层" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">门牌</label><div class="layui-input-inline"><input type="text" name="door" placeholder="门牌" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">建成年份</label><div class="layui-input-inline"><input type="text" name="built" placeholder="建成年份" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">采暖方式</label><div class="layui-input-inline"><input type="text" name="heatingType" placeholder="采暖方式" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">特点</label><div class="layui-input-block"><textarea name="feature" placeholder="房屋特点" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/house.js"></script>
</body></html>
