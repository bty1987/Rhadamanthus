<!DOCTYPE html>
<!-- app/views/data/constructionPeriod4node.html —— 工期节点配置（关联 constructionPeriod）
  字段：constructionNode(节点) name(名称) period(工期) — 按 cpid 查询节点 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>工期节点配置</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">工期ID</label><div class="layui-input-inline"><input type="number" name="cpid" id="searchCpid" placeholder="工期ID" class="layui-input" value="0"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">节点</label><div class="layui-input-inline"><input type="text" name="cnid" placeholder="施工节点ID" class="layui-input v_int"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">名称</label><div class="layui-input-block"><input type="text" name="name" placeholder="名称" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工期</label><div class="layui-input-inline"><input type="text" name="period" placeholder="工期" class="layui-input v_int"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/constructionPeriod4node.js"></script>
</body></html>
