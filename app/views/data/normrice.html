<!DOCTYPE html>
<!-- app/views/data/normrice.html —— 定额工费（增删查，关联 quotationItem qiid）
  字段：constructionNode(节点) trannum(转换量) salary(工费) stuff(材料) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>定额工费</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">报价项ID</label><div class="layui-input-inline"><input type="number" name="qiid" id="formQiid" placeholder="报价项ID" class="layui-input" value="0"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">节点ID</label><div class="layui-input-inline"><input type="text" name="cnid" placeholder="施工节点ID" class="layui-input v_int"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">转换量</label><div class="layui-input-inline"><input type="text" name="trannum" placeholder="转换量" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工费</label><div class="layui-input-inline"><input type="text" name="salary" placeholder="工费" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">材料</label><div class="layui-input-inline"><input type="text" name="stuff" placeholder="材料" class="layui-input v_float"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/normrice.js"></script>
</body></html>
