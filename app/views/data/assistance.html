<!DOCTYPE html>
<!-- app/views/data/assistance.html —— 帮助文档（CRUD）
  字段：title(标题) keyword(关键字) content(内容) name(分类) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>帮助文档</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">标题</label><div class="layui-input-inline"><input type="text" name="title" data-op="cn" placeholder="标题" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="aid">
        <div class="layui-form-item"><label class="layui-form-label">标题<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="title" placeholder="标题" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">关键字</label><div class="layui-input-block"><input type="text" name="keyword" placeholder="关键字(逗号分隔)" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">分类</label><div class="layui-input-inline"><input type="text" name="name" placeholder="分类" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">内容</label><div class="layui-input-block"><textarea name="content" placeholder="内容" class="layui-textarea" style="height:200px;"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/assistance.js"></script>
</body></html>
