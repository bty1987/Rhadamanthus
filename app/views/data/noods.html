<!DOCTYPE html>
<!-- app/views/data/noods.html —— noods管理（CRUD + 状态 + 计算标识 + 集团定材引用）
  字段：name(名称) selling(售价) balance(结算价) surplus(浮动量) calc(计算标识) pnid(上级定材,>0为集团引用行) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>noods管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css">
<style>.noods-sel-list{position:absolute;z-index:9999;left:20px;right:20px;background:#fff;border:1px solid #d2d2d2;max-height:220px;overflow:auto;display:none}.noods-sel-item{padding:6px 12px;cursor:pointer}.noods-sel-item:hover{background:#f2f2f2}</style></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px; position:relative;"><form class="layui-form" id="editForm">
        <input type="hidden" name="nid">
        <div class="layui-form-item"><label class="layui-form-label">引用集团定材</label><div class="layui-input-block"><input type="text" id="noodSel" placeholder="输入名称选择集团定材" class="layui-input" autocomplete="off"><div id="noodSelList" class="noods-sel-list"></div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="名称" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">售价</label><div class="layui-input-inline"><input type="text" name="selling" placeholder="售价" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">结算价</label><div class="layui-input-inline"><input type="text" name="balance" placeholder="结算价" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">浮动量</label><div class="layui-input-inline"><input type="text" name="surplus" placeholder="浮动量" class="layui-input v_float"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs" lay-event="enable">启用</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/noods.js"></script>
</body></html>
