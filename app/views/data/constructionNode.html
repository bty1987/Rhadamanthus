<!DOCTYPE html>
<!-- app/views/data/constructionNode.html —— 施工节点（CRUD + 状态）
  字段：name(节点名) precheck/postcheck/stacheck/fincheck(款项比) accessoryLimit/salaryLimit(限额) timeLimit(工期) kino/kiname(金蝶) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>施工节点</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"><style>.node-sel-list{position:absolute;z-index:9999;left:20px;right:20px;background:#fff;border:1px solid #d2d2d2;max-height:220px;overflow:auto;display:none}.node-sel-item{padding:6px 12px;cursor:pointer}.node-sel-item:hover{background:#f2f2f2}</style></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">节点名</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="节点名" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="cnid">
        <div class="layui-form-item" id="nodeSelItem" style="display:none;"><label class="layui-form-label">集团节点<span class="app-req">*</span></label><div class="layui-input-block" style="position:relative;"><input type="text" id="nodeSel" placeholder="必选,集团没有的节点请先在集团下维护" class="layui-input" autocomplete="off"><div id="nodeSelList" class="node-sel-list"></div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">节点名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="节点名" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">开工款项比</label><div class="layui-input-inline"><input type="text" name="precheck" placeholder="开工款项比" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">完工款项比</label><div class="layui-input-inline"><input type="text" name="postcheck" placeholder="完工款项比" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">开工销售比</label><div class="layui-input-inline"><input type="text" name="stacheck" placeholder="开工销售比" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">完工销售比</label><div class="layui-input-inline"><input type="text" name="fincheck" placeholder="完工销售比" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">辅料限额</label><div class="layui-input-inline"><input type="text" name="accessoryLimit" placeholder="辅料总额限制" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工费限额</label><div class="layui-input-inline"><input type="text" name="salaryLimit" placeholder="工费总额限制" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工费保底额</label><div class="layui-input-inline"><input type="text" name="salaryFloor" placeholder="0为无保底" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工期</label><div class="layui-input-inline"><input type="text" name="timeLimit" placeholder="工期" class="layui-input v_int"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">金蝶编号</label><div class="layui-input-inline"><input type="text" name="kino" placeholder="金蝶编号" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">金蝶名称</label><div class="layui-input-inline"><input type="text" name="kiname" placeholder="金蝶名称" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs" lay-event="enable">启用</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/constructionNode.js"></script>
</body></html>
