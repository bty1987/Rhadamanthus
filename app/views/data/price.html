<!DOCTYPE html>
<!-- app/views/data/price.html —— 价格管理（增删查 + 状态，关联 goods gid）
  字段：name(说明) purchase(控价) selling(售价) confine(限价) ctype(结算类型) cvalue(结算值) type(类型) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>价格管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">商品ID</label><div class="layui-input-inline"><input type="number" name="gid" id="searchGid" placeholder="商品ID" class="layui-input" value="0"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">说明<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="价格说明" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">控价</label><div class="layui-input-inline"><input type="text" name="purchase" placeholder="控价" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">售价</label><div class="layui-input-inline"><input type="text" name="selling" placeholder="售价" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">限价</label><div class="layui-input-inline"><input type="text" name="confine" placeholder="限价" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">结算类型</label><div class="layui-input-inline"><select name="ctype"><option value="0">底价</option><option value="1">点位</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">结算值</label><div class="layui-input-inline"><input type="text" name="cvalue" placeholder="结算值" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="0">正价</option><option value="1">特价</option></select></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button><button class="layui-btn layui-btn-xs" lay-event="enable">启用</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/price.js"></script>
</body></html>
