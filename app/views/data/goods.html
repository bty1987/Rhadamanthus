<!DOCTYPE html>
<!-- app/views/data/goods.html —— 商品管理（CRUD + 状态）
  字段：no(编号) name(名称) barcode(条码) purchase(控价) selling(售价) pieceNum(件数) confine(限价) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>商品管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">编号</label><div class="layui-input-inline"><input type="text" name="no" data-op="cn" placeholder="编号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="gid">
        <div class="layui-form-item"><label class="layui-form-label">编号<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="no" placeholder="编号" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="名称" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">条码</label><div class="layui-input-inline"><input type="text" name="barcode" placeholder="条码" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品类</label><div class="layui-input-inline"><input type="text" name="category" placeholder="品类" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品牌</label><div class="layui-input-inline"><input type="text" name="brand" placeholder="品牌" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">单位</label><div class="layui-input-inline"><input type="text" name="measurementUnit" placeholder="单位" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">控价</label><div class="layui-input-inline"><input type="text" name="purchase" placeholder="控价" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">售价</label><div class="layui-input-inline"><input type="text" name="selling" placeholder="售价" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">限价</label><div class="layui-input-inline"><input type="text" name="confine" placeholder="限价" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">件数</label><div class="layui-input-inline"><input type="text" name="pieceNum" placeholder="件数" class="layui-input v_int"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea name="comment" placeholder="备注" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs" lay-event="enable">启用</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/goods.js"></script>
</body></html>
