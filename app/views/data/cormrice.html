<!DOCTYPE html>
<!-- app/views/data/cormrice.html —— 公共项工费（增删查，关联 quotationCtem qcid）
  字段：constructionNode(节点) unit(单位) trannum(转换量) salary(工费) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>公共项工费</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">公共项ID</label><div class="layui-input-inline"><input type="number" name="qcid" id="searchQcid" placeholder="公共项ID" class="layui-input" value="0"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">节点ID</label><div class="layui-input-inline"><input type="text" name="cnid" placeholder="施工节点ID" class="layui-input v_int"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">单位</label><div class="layui-input-inline"><input type="text" name="unit" placeholder="单位" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">转换量</label><div class="layui-input-inline"><input type="text" name="trannum" placeholder="转换量" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工费</label><div class="layui-input-inline"><input type="text" name="salary" placeholder="工费" class="layui-input v_float"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/cormrice.js"></script>
</body></html>
