<!DOCTYPE html>
<!-- app/views/data/normpackItem.html —— 定额包项目（增删查，关联 npid）
  字段：name(名称) normunit(定额单位) normnum(定额数量) storeunit(库房单位) storenum(库房数量) price(价格) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>定额包项目</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">包ID</label><div class="layui-input-inline"><input type="number" name="npid" id="searchNpid" placeholder="定额包ID" class="layui-input" value="0"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="名称" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">定额单位</label><div class="layui-input-inline"><input type="text" name="normunit" placeholder="定额单位" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">定额数量</label><div class="layui-input-inline"><input type="text" name="normnum" placeholder="定额数量" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">库房单位</label><div class="layui-input-inline"><input type="text" name="storeunit" placeholder="库房单位" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">库房数量</label><div class="layui-input-inline"><input type="text" name="storenum" placeholder="库房数量" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">价格</label><div class="layui-input-inline"><input type="text" name="price" placeholder="价格" class="layui-input v_float"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/normpackItem.js"></script>
</body></html>
