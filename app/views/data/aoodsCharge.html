<!DOCTYPE html>
<!-- app/views/data/aoodsCharge.html —— 辅料费用（增删查 + 编辑，关联 aoods aid）
  字段：name(费用名) price(价格) surplus(浮动额) type(类型) status(状态) sort(排序) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>辅料费用</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">辅料ID</label><div class="layui-input-inline"><input type="number" name="aid" id="searchAid" placeholder="辅料ID" class="layui-input" value="0"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="acid">
        <div class="layui-form-item"><label class="layui-form-label">费用名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="费用名" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">价格</label><div class="layui-input-inline"><input type="text" name="price" placeholder="价格" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">浮动额</label><div class="layui-input-inline"><input type="text" name="surplus" placeholder="浮动额" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="0">类型0</option><option value="1">类型1</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status"><option value="0">启用</option><option value="1">禁用</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">排序</label><div class="layui-input-inline"><input type="text" name="sort" placeholder="排序" class="layui-input v_int"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/aoodsCharge.js"></script>
</body></html>
