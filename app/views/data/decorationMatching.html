<!DOCTYPE html>
<!-- app/views/data/decorationMatching.html —— 装修配套（CRUD）
  字段：name(名称) base(基础) discount(折扣) material(材料) service(服务) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>装修配套</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="dmid">
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="名称" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">基础</label><div class="layui-input-inline"><input type="text" name="base" placeholder="基础" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">折扣</label><div class="layui-input-inline"><input type="text" name="discount" placeholder="折扣" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">材料</label><div class="layui-input-inline"><input type="text" name="material" placeholder="材料" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">服务</label><div class="layui-input-inline"><input type="text" name="service" placeholder="服务" class="layui-input v_float"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/decorationMatching.js"></script>
</body></html>
