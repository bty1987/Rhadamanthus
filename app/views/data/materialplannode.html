<!DOCTYPE html>
<!-- app/views/data/materialplannode.html —— 主材计划规则（公司级字典：品类/品牌×施工节点×动作×锚点×偏移, CRUD + 启停）
  生成订单主材计划时按公司拷贝启用规则。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>主材计划规则</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">维度</label><div class="layui-input-inline"><select name="type" data-op="eq">
            <option value=""></option><option value="0">品类</option><option value="1">品牌</option>
        </select></div></div>
        <div class="layui-inline"><label class="layui-form-label">动作</label><div class="layui-input-inline"><select name="action" data-op="eq">
            <option value=""></option><option value="0">下单</option><option value="1">配送</option><option value="2">到货</option>
        </select></div></div>
        <div class="layui-inline"><label class="layui-form-label">施工节点</label><div class="layui-input-inline"><input type="text" name="nodeName" data-op="cn" placeholder="施工节点" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq">
            <option value=""></option><option value="0">启用</option><option value="1">停用</option>
        </select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">维度<span class="app-req">*</span></label><div class="layui-input-inline" style="width:240px;"><select id="type" lay-filter="type"><option value="0">品类</option><option value="1">品牌</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品类<span class="app-req">*</span></label><div class="layui-input-inline" style="width:240px;"><select id="cid" lay-filter="cid"></select></div></div>
        <div class="layui-form-item" id="brandGroup"><label class="layui-form-label">品牌<span class="app-req">*</span></label><div class="layui-input-inline" style="width:240px;"><select id="bid"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">施工节点<span class="app-req">*</span></label><div class="layui-input-inline" style="width:240px;"><select id="cnid"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">动作<span class="app-req">*</span></label><div class="layui-input-inline" style="width:240px;"><select id="action"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">时间锚点<span class="app-req">*</span></label><div class="layui-input-inline" style="width:240px;"><select id="anchor"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">偏移天数</label><div class="layui-input-inline"><input type="text" id="offsetDay" placeholder="负=锚点前,0=当日" class="layui-input"></div></div>
        <div class="layui-form-item layui-form-text"><label class="layui-form-label">说明</label><div class="layui-input-block"><textarea id="comment" class="layui-textarea" placeholder="说明"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs" lay-event="enable">启用</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">停用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/data/materialplannode.js"></script>
</body></html>
