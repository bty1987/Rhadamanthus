<!DOCTYPE html>
<!-- app/views/system/role4base.html —— 角色基础管理（CRUD + 模块/操作权限配置）
  与 role.html 类似，但条件更简（仅角色名），用于基础角色配置场景。
  字段：no/name/content；配置：模块/操作权限 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>角色管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="角色名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>

    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="rid">
        <div class="layui-form-item"><label class="layui-form-label">编号<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="no" id="roleId" placeholder="角色编号" class="layui-input v_required v_name_en" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" id="roleName" placeholder="角色名称" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">描述</label><div class="layui-input-block"><textarea name="content" id="roleDes" placeholder="描述" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>

    <div id="moduleBox" style="display:none; padding:16px;">
        <div id="moduleTree" style="max-height:480px;overflow:auto;"></div>
        <div class="layui-form-item app-form-footer" style="margin-top:12px;"><button type="button" class="layui-btn" id="btnModuleSave">保存权限</button><button type="button" class="layui-btn layui-btn-primary" id="btnModuleCancel">取消</button></div>
    </div>

    <div id="operationBox" style="display:none; padding:16px;">
        <div class="layui-form-item"><input type="text" id="operationSearch" placeholder="搜索操作名称" class="layui-input" autocomplete="off" style="margin-bottom:10px;"></div>
        <div id="operationList" style="max-height:440px;overflow:auto;"></div>
        <div class="layui-form-item app-form-footer" style="margin-top:12px;"><button type="button" class="layui-btn" id="btnOpClose">完成</button></div>
    </div>

    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="module">模块配置</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="operation">操作配置</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/system/role4base.js"></script>
</body></html>
