<!DOCTYPE html>
<!-- app/views/system/upgradePackage.html —— 升级包管理（新增 + 上线/下线 + 删除 + 上传 zip）
  字段：no(最新版本) trialno(适用版本) status(状态) createTime(创建时间) content(说明) path(路径) fileSize(大小)
  状态：0=待上线 1=已上线 2=已下线 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>升级包管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">版本</label><div class="layui-input-inline"><input type="text" name="no" data-op="cn" placeholder="版本号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">版本号<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="upgradeNumber" placeholder="最新版本号" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">适用版本<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="trialUpgrade" placeholder="适用版本号" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">创建时间</label><div class="layui-input-block"><input type="text" name="createTime" id="createTime" placeholder="YYYY-MM-DD" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">版本说明</label><div class="layui-input-block"><textarea name="content" placeholder="版本说明" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item"><label class="layui-form-label">路径<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="path" id="path" placeholder="上传升级包后自动填入" class="layui-input v_required" lay-verify="required" readonly></div></div>
        <div class="layui-form-item"><label class="layui-form-label">文件大小</label><div class="layui-input-block"><input type="text" name="fileSize" id="fileSize" placeholder="字节" class="layui-input" readonly></div></div>
        <div class="layui-form-item"><label class="layui-form-label">上传</label><div class="layui-input-block"><button type="button" class="layui-btn" id="btnUpload"><i class="layui-icon layui-icon-upload"></i>选择升级包(zip)</button></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar">
        {{# if (d.status != 1) { }}<button class="layui-btn layui-btn-xs" lay-event="online">上线</button>{{# } }}
        {{# if (d.status == 1) { }}<button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="offline">下线</button>{{# } }}
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/system/upgradePackage.js"></script>
</body></html>
