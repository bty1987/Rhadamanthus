<!DOCTYPE html>
<!-- app/views/system/systemConfig.html —— 系统配置（列表 + 编辑值）
  字段：key(键) value(值) comment(说明)；只编辑 value -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>系统配置</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">键</label><div class="layui-input-inline"><input type="text" name="key" data-op="cn" placeholder="配置键" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="scid">
        <div class="layui-form-item"><label class="layui-form-label">键</label><div class="layui-input-block"><input type="text" name="key" disabled class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">值<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="value" placeholder="配置值" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/system/systemConfig.js"></script>
</body></html>
