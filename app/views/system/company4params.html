<!DOCTYPE html>
<!-- app/views/system/company4params.html —— 公司级系统配置（目录+DB 合并管理）
  依赖 systemConfigCatalog.js（window.SYSTEM_CONFIG_CATALOG / SYSTEM_CONFIG_GROUPS）
  字段：group(分组) key(键) name(名称) value(值) comment(说明) type(类型) defaultValue(默认值) -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>公司系统配置</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">关键字</label><div class="layui-input-inline"><input type="text" name="keyword" placeholder="搜索名称/键/说明/当前值" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">分组</label><div class="layui-input-inline"><select name="group" id="groupSel"><option value="">全部</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>新增自定义</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="scid">
        <div class="layui-form-item"><label class="layui-form-label">分组<span class="app-req">*</span></label><div class="layui-input-block"><select name="group" id="editGroupSel" lay-search=""><option value="">请选择</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">键<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="key" placeholder="配置键" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">值<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="value" placeholder="配置值" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-block"><textarea name="comment" placeholder="说明" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button><button type="button" class="layui-btn layui-btn-danger" id="btnDel" style="display:none;">删除</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        {{# if (d.configured) { }}<button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>{{# } else { }}<button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="set">设置值</button>{{# } }}
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/system/systemConfigCatalog.js"></script><script src="../../js/system/company4params.js"></script>
</body></html>
