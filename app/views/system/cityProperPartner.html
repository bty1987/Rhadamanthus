<!DOCTYPE html>
<!-- app/views/system/cityProperPartner.html —— 区域合作人管理（弹窗子页）
  父页 cityProper 通过 popup 打开，传递 app.params.system.cpid
  字段：partner(合作人,typeahead→user) type(类型) -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>区域合作人</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加合作人</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">合作人<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="partnerName" id="partnerName" placeholder="输入拼音/姓名搜索" class="layui-input v_required" lay-verify="required" autocomplete="off"><input type="hidden" name="partnerUserId"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型<span class="app-req">*</span></label><div class="layui-input-block"><select name="type" id="typeSel"><option value="0">设计师</option><option value="1">监理</option><option value="2">业务员</option></select></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/system/cityProperPartner.js"></script>
</body></html>
