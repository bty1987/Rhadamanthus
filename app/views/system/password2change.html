<!DOCTYPE html>
<!-- app/views/system/password2change.html —— 修改密码（表单）
  字段：oldPassword(原密码) password(新密码) rePassword(确认)
  密码 MD5 加密后提交，走 changePassword.do（communion 服务） -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>修改密码</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-form-card" style="max-width:480px; margin:40px auto;">
        <h2 style="margin-top:0;color:#1E88E5;">修改密码</h2>
        <form class="layui-form" id="changePasswordForm">
            <div class="layui-form-item"><label class="layui-form-label">原密码<span class="app-req">*</span></label><div class="layui-input-block"><input type="password" name="oldPassword" id="oldPassword" placeholder="原密码" class="layui-input v_required" lay-verify="required"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">新密码<span class="app-req">*</span></label><div class="layui-input-block"><input type="password" name="password" id="password" placeholder="新密码（至少6位）" class="layui-input v_required" lay-verify="required"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">确认密码<span class="app-req">*</span></label><div class="layui-input-block"><input type="password" name="rePassword" id="rePassword" placeholder="再次输入新密码" class="layui-input v_required" lay-verify="required"></div></div>
            <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">确认修改</button></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/md5.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/system/password2change.js"></script>
</body></html>
