<!DOCTYPE html>
<!--
  app/views/log/actionLog.html —— 操作日志查询（只读，含"含历史"开关 + 导出）
  条件：操作时间(createTime,between) 操作人账号(createUserId,eq) 操作人姓名(createUser,cn)
        接口名(actionName,cn) 业务模块(moduleId,eq) 操作类型(operateType,eq)
        结果(resultState,eq) 来源IP(ip,eq) 业务对象ID(businessId,eq)
  特性：含历史开关 → 切换 pageActionLog / pageActionLogWithHistory
-->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>操作日志</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page">
    <div class="app-search">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">操作人账号</label>
                    <div class="layui-input-inline"><input type="text" name="createUserId" data-op="eq" placeholder="操作人账号" class="layui-input" autocomplete="off"></div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">操作人姓名</label>
                    <div class="layui-input-inline"><input type="text" name="createUser" data-op="cn" placeholder="操作人姓名" class="layui-input" autocomplete="off"></div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">接口名</label>
                    <div class="layui-input-inline"><input type="text" name="actionName" data-op="cn" placeholder="接口名" class="layui-input" autocomplete="off"></div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">业务模块</label>
                    <div class="layui-input-inline">
                        <select name="moduleId" data-op="eq">
                            <option value="">全部</option>
                            <option value="decoration">装修订单</option>
                            <option value="quotation">报价</option>
                            <option value="construction">施工</option>
                            <option value="customer">客户</option>
                            <option value="balance">结算</option>
                            <option value="payment">款项</option>
                            <option value="material">主材</option>
                            <option value="sales">销售</option>
                            <option value="personel">人员</option>
                            <option value="system">系统</option>
                            <option value="approval">审批</option>
                            <option value="information">信息</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">操作类型</label>
                    <div class="layui-input-inline">
                        <select name="operateType" data-op="eq">
                            <option value="">全部</option>
                            <option value="ADD">新增</option>
                            <option value="UPDATE">修改</option>
                            <option value="DELETE">删除</option>
                            <option value="QUERY">查询</option>
                            <option value="EXPORT">导出</option>
                            <option value="LOGIN">登录</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">结果</label>
                    <div class="layui-input-inline">
                        <select name="resultState" data-op="eq">
                            <option value="">全部</option>
                            <option value="0">成功</option>
                            <option value="1">失败</option>
                            <option value="2">异常</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">来源IP</label>
                    <div class="layui-input-inline"><input type="text" name="ip" data-op="eq" placeholder="来源 IP" class="layui-input" autocomplete="off"></div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">业务对象ID</label>
                    <div class="layui-input-inline"><input type="text" name="businessId" data-op="eq" placeholder="业务对象ID" class="layui-input" autocomplete="off"></div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">操作时间</label>
                    <div class="layui-input-inline" style="width:260px;">
                        <input type="text" name="createTime" id="createTime" data-op="between" placeholder="开始 - 结束" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                    <button type="button" class="layui-btn layui-btn-warm" id="btnToggleHistory"><i class="layui-icon layui-icon-time"></i>含历史:关</button>
                    <button type="button" class="layui-btn layui-btn-normal" id="btnExport"><i class="layui-icon layui-icon-export"></i>导出</button>
                </div>
            </div>
        </form>
    </div>

    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/log/log-common.js"></script>
<script src="../../js/log/actionLog.js"></script>
</body>
</html>
