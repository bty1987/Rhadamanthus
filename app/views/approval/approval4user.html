<!DOCTYPE html>
<!-- app/views/approval/approval4user.html —— 审批人员管理（approver CRUD）
  pageApprover 分页；addApprover/deleteApprover；审批人用拼音输入框（blur 自动匹配 queryUserByPinyin）。 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>审批人员</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">用户名</label><div class="layui-input-inline"><input type="text" name="userBase.currentName" data-op="cn" placeholder="用户名" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="">全部</option><option value="1">客户信息</option><option value="6">主材退款</option><option value="8">装修活动</option><option value="10">销售退款</option><option value="17">客源</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>

    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">审批人<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="approver" placeholder="拼音/姓名，失焦自动匹配" class="layui-input v_required" lay-verify="required" autocomplete="off"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">审批类型<span class="app-req">*</span></label><div class="layui-input-block"><select name="type"><option value="1">客户信息</option><option value="6">主材退款</option><option value="8">装修活动</option><option value="10">销售退款</option><option value="17">客源</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-block"><textarea name="comment" maxlength="128" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/approval/approval4user.js"></script>
</body></html>
