<!DOCTYPE html>
<!-- app/views/approval/approval4track.html —— 审批轨迹列表（按 ?type=send/receive/dept/senior 选数据源）
  type=send→pageApprovalForSend；receive→pageApprovalForReceive；dept→pageApprovalForReceiveDept；senior→pageApproval
  操作：详情（按 type 查明细：主材退货/装修活动/销售退货/客源）、客户确认 affirmApproval、通过/拒绝 approve/refuseApproval -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>审批轨迹</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">申请人</label><div class="layui-input-inline"><input type="text" name="sender.currentName" data-op="cn" placeholder="申请人" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="">全部</option><option value="6">主材退款</option><option value="8">装修活动</option><option value="10">销售退款</option><option value="14">客源-装修</option><option value="17">客源</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status"><option value="">全部</option><option value="0">初始</option><option value="1">已确认</option><option value="2">已审批</option><option value="3">已拒绝</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>

    <!-- 审批操作弹窗 -->
    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form">
            <div class="layui-form-item"><label class="layui-form-label">结果</label><div class="layui-input-block"><span id="result" class="layui-form-text" style="line-height:38px;"></span></div></div>
            <div class="layui-form-item"><label class="layui-form-label">批注</label><div class="layui-input-block"><textarea id="annotate" maxlength="128" class="layui-textarea"></textarea></div></div>
            <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSubmit">提交</button><button type="button" class="layui-btn layui-btn-primary" id="btnClose">关闭</button></div>
        </form>
    </div>

    <!-- 明细弹窗 -->
    <div id="detailBox" style="display:none; padding:16px;">
        <h4 id="detailTitle" style="margin-bottom:10px;"></h4>
        <div id="detailBody"></div>
        <div id="totalMoney" style="margin-top:10px;font-weight:bold;"></div>
    </div>
    <script type="text/html" id="rowToolbar">
        {{# if ([6,8,10,14,17].indexOf(d.type) != -1){ }}<button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="detail">详情</button>{{# } }}
        {{# if (d._editable && [0,1,2].indexOf(d.status) != -1 && !d.piid){ }}<button class="layui-btn layui-btn-xs" lay-event="pass">通过</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refuse">拒绝</button>{{# } }}
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/approval/approval4track.js"></script>
</body></html>
