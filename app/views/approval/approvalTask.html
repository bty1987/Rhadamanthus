<!DOCTYPE html>
<!-- app/views/approval/approvalTask.html —— 我的待办任务（P2-P3 新引擎）
  待办列表 queryApprovalTodoTask；操作 agreeApprovalTask/refuseApprovalTask/transferApprovalTask；
  轨迹 queryApprovalTaskTrace；通用审批发起 startGeneralApproval（选流程→加载表单 queryApprovalFormByFlowId + queryApprovalFormField） -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>我的待办任务</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div style="margin-bottom:10px;text-align:right;"><button type="button" class="layui-btn" id="startApprovalBtn"><i class="layui-icon layui-icon-add-1"></i> 发起审批</button></div>
    <div class="app-table"><table id="taskTable" lay-filter="taskTable"></table></div>
    <div id="notTask" class="layui-bg-gray" style="padding:20px;text-align:center;display:none;">暂无待办任务</div>

    <!-- 审批操作弹窗 -->
    <div id="taskBox" style="display:none; padding:20px;">
        <form class="layui-form">
            <div class="layui-form-item" id="transferGroup" style="display:none;">
                <label class="layui-form-label">转交给<span class="app-req">*</span></label>
                <div class="layui-input-block"><input type="text" name="transferTo" placeholder="目标用户 userId" class="layui-input"></div>
            </div>
            <div class="layui-form-item"><label class="layui-form-label">批注</label><div class="layui-input-block"><textarea name="comment" maxlength="500" class="layui-textarea"></textarea></div></div>
        </form>
        <div style="text-align:center;margin-top:12px;">
            <button type="button" class="layui-btn" id="agreeBtn">通过</button>
            <button type="button" class="layui-btn layui-btn-danger" id="refuseBtn">拒绝</button>
            <button type="button" class="layui-btn layui-btn-warm" id="transferBtn">转交</button>
        </div>
    </div>

    <!-- 审批轨迹弹窗 -->
    <div id="traceBox" style="display:none; padding:10px;">
        <table class="layui-table" id="traceTable"><thead><tr>
            <th>节点</th><th>状态</th><th>审批人</th><th>转交</th><th>批注</th><th>时间</th>
        </tr></thead><tbody></tbody></table>
    </div>

    <!-- 发起审批弹窗 -->
    <div id="startBox" style="display:none; padding:20px;">
        <form class="layui-form">
            <div class="layui-form-item"><label class="layui-form-label">审批流程<span class="app-req">*</span></label><div class="layui-input-block"><select name="code" id="generalFlowSelect"><option value="">请选择</option></select></div></div>
        </form>
        <hr>
        <div id="generalFormArea"></div>
        <div style="text-align:center;margin-top:12px;">
            <button type="button" class="layui-btn" id="submitGeneralBtn">提交审批</button>
        </div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/approval/approvalTask.js"></script>
</body></html>
