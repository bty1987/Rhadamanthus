<!DOCTYPE html>
<!-- app/views/approval/approvalFlowCreate.html —— 审批流程新增/编辑（P2-P3 新引擎）
  上下文：app.params.approvalFlow = {flowId}（编辑）或 null（新增）
  元信息：code/name/businessType/version/comment；节点配置：纵向卡片流，至少 1 节点
  嵌套 List 参数：flowNodes[i].xxx（与旧版一致） -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>审批流程配置</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-form-card">
        <form class="layui-form" id="flowForm">
            <div class="layui-form-item">
                <label class="layui-form-label">流程编码<span class="app-req">*</span></label>
                <div class="layui-input-inline"><input type="text" name="code" placeholder="如 DECORATION_CONTRACT" maxlength="64" class="layui-input v_required" lay-verify="required"></div>
                <label class="layui-form-label">流程名称<span class="app-req">*</span></label>
                <div class="layui-input-inline"><input type="text" name="name" maxlength="100" class="layui-input v_required" lay-verify="required"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">业务类型<span class="app-req">*</span></label>
                <div class="layui-input-inline"><select name="businessType">
                    <option value="100">通用审批</option><option value="24">装饰合同</option><option value="5">装修退款</option>
                    <option value="6">主材退款</option><option value="10">销售退款</option><option value="3">装修归属</option>
                    <option value="22">报价优惠</option><option value="4">报价折扣</option><option value="19">装修终审</option><option value="26">预付款提现</option>
                </select></div>
                <label class="layui-form-label">版本</label>
                <div class="layui-input-inline"><input type="number" name="version" value="1" min="1" class="layui-input"></div>
            </div>
            <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-block"><textarea name="comment" maxlength="255" class="layui-textarea"></textarea></div></div>
        </form>
    </div>

    <fieldset class="layui-elem-field"><legend>审批节点配置 <span class="layui-badge layui-bg-gray">按顺序流转，至少一个节点</span></legend>
        <div class="layui-field-box">
            <div id="flowCanvas"></div>
            <div id="notnode" class="layui-bg-gray" style="padding:12px;text-align:center;display:none;">暂无节点，请点击下方按钮添加</div>
            <div style="margin:10px 0;">
                <button type="button" class="layui-btn layui-btn-warm" id="addNodeBtn"><i class="layui-icon layui-icon-add-1"></i>添加节点</button>
                <button type="button" class="layui-btn layui-btn-normal" style="float:right;" id="submitBtn"><i class="layui-icon layui-icon-ok"></i>保存流程</button>
            </div>
        </div>
    </fieldset>
</div>

<div id="editBox" style="display:none; padding:20px;">
    <form class="layui-form" id="nodeFormField">
        <input type="hidden" name="nodeIndex">
        <div class="layui-form-item">
            <label class="layui-form-label">节点顺序<span class="app-req">*</span></label>
            <div class="layui-input-inline"><input type="number" name="nodeSeq" min="1" class="layui-input v_required" lay-verify="required"></div>
            <label class="layui-form-label">节点名称<span class="app-req">*</span></label>
            <div class="layui-input-inline"><input type="text" name="nodeName" maxlength="100" placeholder="如 部门经理审批" class="layui-input v_required" lay-verify="required"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">节点类型</label>
            <div class="layui-input-inline"><select name="nodeType"><option value="1">串行</option><option value="2">并签(全通过)</option><option value="3">或签(任一通过)</option><option value="4">会签(按比例)</option></select></div>
            <label class="layui-form-label" id="ratioLabel" style="display:none;">通过比例</label>
            <div class="layui-input-inline" id="ratioWrap" style="display:none;"><input type="text" name="passRatio" placeholder="0~1, 如 0.5" class="layui-input"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">审批人规则</label>
            <div class="layui-input-inline"><select name="approverRule"><option value="0">指定人</option><option value="1">直属上级</option><option value="2">部门负责人</option><option value="3">角色</option><option value="4">发起人自选</option><option value="5">表达式</option></select></div>
            <label class="layui-form-label">超时(小时)</label>
            <div class="layui-input-inline"><input type="number" name="timeoutHours" min="0" class="layui-input"></div>
        </div>
        <div class="layui-form-item"><label class="layui-form-label">审批人数据</label><div class="layui-input-block"><textarea name="approverData" placeholder='指定人规则填 JSON 数组,如 ["U001","U002"]' class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item"><label class="layui-form-label">后置处理器</label><div class="layui-input-block"><input type="text" name="postHandler" placeholder="beanClass#methodName" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">驳回策略</label><div class="layui-input-block"><select name="rejectStrategy"><option value="0">整体驳回</option><option value="1">回退上一节点</option><option value="2">回退发起人</option></select></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="saveNodeBtn">确定</button><button type="reset" class="layui-btn layui-btn-primary" id="cancelNodeBtn">取消</button></div>
    </form>
</div>

<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/approval/approvalFlowCreate.js"></script>
</body></html>
