<!DOCTYPE html>
<!-- app/views/construction/customer4detail.html —— 客户评分详情（旧 ace_wizard → layui tab）
  上下文：app.params.construction = { orderId }。每个施工节点一个 tab：
  工人评分（工地卫生/质量标准/沟通服务 + 评语）/评分/推送 + 整体保存（updateConstructerForRate）。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>客户评分详情</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css">
<style>
.cw-worker { border: 1px solid #eee; border-radius: 4px; padding: 12px; margin-bottom: 10px; overflow: hidden; }
.cw-worker .cw-photo { float: left; width: 120px; text-align: center; }
.cw-worker .cw-photo img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; }
.cw-form { margin-left: 140px; }
.cw-form .cw-item { margin: 6px 0; }
.cw-form .cw-item label { display: inline-block; width: 80px; }
</style></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px 0;">
        <span style="font-size:16px;font-weight:bold;">客户评分：<span id="orderIdLabel">-</span></span>
        <button type="button" class="layui-btn layui-btn-sm" id="btnSave"><i class="layui-icon layui-icon-ok"></i>保存</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div class="layui-tab layui-tab-brief" style="margin:10px 15px;" lay-filter="nodeTab" lay-allowclose="false">
        <ul class="layui-tab-title" id="tabTitles"></ul>
        <div class="layui-tab-content" id="tabContent"></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/construction/construction-common.js"></script><script src="../../js/construction/customer4detail.js"></script>
</body></html>
