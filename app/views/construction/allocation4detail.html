<!DOCTYPE html>
<!-- app/views/construction/allocation4detail.html —— 工人分配详情（旧 ace_wizard → layui tab）
  上下文：app.params.construction = { orderId }。每个施工节点一个 tab（状态机完整版）：
  开工/完工（begin/finishConstructionSchedule）、验证/通过（checkoutConstructionSchedule）、
  进场/离场（enter/leaveConstructionSchedule）+ 工人分配（addConstructer/deleteConstructer）。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>工人分配详情</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css">
<style>
.al-worker { float: left; width: 160px; margin: 6px; text-align: center; border: 1px solid #eee; border-radius: 4px; padding: 8px; position: relative; }
.al-worker img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; }
.al-worker .al-del { position: absolute; top: 2px; right: 6px; color: #FF5722; cursor: pointer; }
.al-info-row { margin: 8px 0; }
.al-info-row label { display: inline-block; width: 90px; color: #666; }
.al-info-row input { width: 200px; display: inline-block; }
</style></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px 0;">
        <span style="font-size:16px;font-weight:bold;">工人分配：<span id="orderIdLabel">-</span></span>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack" style="margin-left:15px;"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div class="layui-tab layui-tab-brief" style="margin:10px 15px;" lay-filter="nodeTab" lay-allowclose="false">
        <ul class="layui-tab-title" id="tabTitles"></ul>
        <div class="layui-tab-content" id="tabContent"></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/construction/construction-common.js"></script><script src="../../js/construction/allocation4detail.js"></script>
</body></html>
