<!DOCTYPE html>
<!-- app/views/construction/inspection4record.html —— 巡检记录（订单维度 CRUD）
  上下文：app.params.construction = { orderId, orderAddr }。工具栏：返回/添加。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>巡检记录</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px 0;">
        <span style="font-size:16px;font-weight:bold;">巡检控制 / 巡检记录</span>
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div class="app-table" style="margin-top:10px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>

    <div id="recordBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="recordForm">
            <div class="layui-form-item"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input class="layui-input" id="orderId" disabled></div></div>
            <div class="layui-form-item"><label class="layui-form-label">楼盘地址</label><div class="layui-input-inline"><input class="layui-input" id="orderAddr" disabled></div></div>
            <div class="layui-form-item"><label class="layui-form-label">开始时间</label><div class="layui-input-inline"><input class="layui-input" id="startDate" placeholder="yyyy-MM-dd"></div>
                <div class="layui-input-inline" style="width:110px;"><input class="layui-input" id="startTime" placeholder="hh:mm:ss"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">结束时间</label><div class="layui-input-inline"><input class="layui-input" id="endDate" placeholder="yyyy-MM-dd"></div>
                <div class="layui-input-inline" style="width:110px;"><input class="layui-input" id="endTime" placeholder="hh:mm:ss"></div></div>
            <div class="layui-form-item layui-form-text"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea id="recordDes" class="layui-textarea" placeholder="备注"></textarea></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/construction/construction-common.js"></script><script src="../../js/construction/inspection4record.js"></script>
</body></html>
