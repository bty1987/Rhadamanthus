<!DOCTYPE html>
<!-- app/views/construction/drawline4user.html —— 放线人员部署（监理 + 五阶段质检员 + 所属公司）
  行按钮：人员部署。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>放线人员部署</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="decoration.orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼盘</label><div class="layui-input-inline"><input name="decoration.house.village.no" data-op="eq" class="layui-input" placeholder="楼盘编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼号</label><div class="layui-input-inline"><input name="decoration.house.houseNumber" data-op="cn" class="layui-input" placeholder="楼号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input name="decoration.designer.userId" data-op="eq" class="layui-input" placeholder="设计师编号"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="deploy">人员部署</button>
    </script>

    <div id="setupBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="setupForm">
            <div class="layui-form-item"><label class="layui-form-label">装修单</label><div class="layui-input-inline"><span id="orderIdText" style="line-height:38px;"></span></div></div>
            <div class="layui-form-item"><label class="layui-form-label">所属公司</label><div class="layui-input-inline"><span id="conpanyName" style="line-height:38px;"></span></div></div>
            <div class="layui-form-item"><label class="layui-form-label">公司调整</label><div class="layui-input-inline"><select id="conpany"><option value="">请选择公司</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">监理</label><div class="layui-input-inline" style="width:240px;"><select id="supervisor" lay-search=""><option value="">请选择监理(工程部)</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">水暖质检</label><div class="layui-input-inline" style="width:240px;"><select id="qualiter1" lay-search=""><option value="">请选择人员</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">电工质检</label><div class="layui-input-inline" style="width:240px;"><select id="qualiter2" lay-search=""><option value="">请选择人员</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">瓦工质检</label><div class="layui-input-inline" style="width:240px;"><select id="qualiter3" lay-search=""><option value="">请选择人员</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">木工质检</label><div class="layui-input-inline" style="width:240px;"><select id="qualiter4" lay-search=""><option value="">请选择人员</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">油工质检</label><div class="layui-input-inline" style="width:240px;"><select id="qualiter5" lay-search=""><option value="">请选择人员</option></select></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/construction/construction-common.js"></script><script src="../../js/construction/drawline4user.js"></script>
</body></html>
