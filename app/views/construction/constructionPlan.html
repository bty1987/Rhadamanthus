<!DOCTYPE html>
<!-- app/views/construction/constructionPlan.html —— 施工计划（订单维度：生成/添加/编辑/排序/删除）
  上下文：app.params.construction = { decoration: {...}, drawlineTime }（constructionInfo 行数据）。
  工具栏：生成(makeConstructionPlan)/添加/打印(constructionPlan2print)。行按钮：编辑/上移/下移/删除。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>施工计划</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px 0;">
        <span style="font-size:16px;font-weight:bold;">施工计划：<span id="orderIdLabel">-</span></span>
        <button type="button" class="layui-btn layui-btn-sm" id="makeBtn"><i class="layui-icon layui-icon-template-1"></i>生成</button>
        <button type="button" class="layui-btn layui-btn-sm" id="constructionPlanBtn"><i class="layui-icon layui-icon-add-1"></i>添加</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="printBtn"><i class="layui-icon layui-icon-print"></i>打印</button>
    </div>
    <div class="app-table" style="margin-top:10px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs" lay-event="up">上移</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="down">下移</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>

    <div id="constructionPlanBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="constructionPlanForm">
            <div class="layui-form-item"><label class="layui-form-label">节点</label><div class="layui-input-inline" style="width:240px;"><select id="name" lay-search=""></select></div></div>
            <div class="layui-form-item layui-form-text"><label class="layui-form-label">说明</label><div class="layui-input-block"><textarea id="comment" class="layui-textarea" placeholder="说明"></textarea></div></div>
        </form>
    </div>
    <div id="editConstructionPlanBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="editConstructionPlanForm">
            <div class="layui-form-item"><label class="layui-form-label">工程天数</label><div class="layui-input-inline"><input class="layui-input" id="connum"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">主材天数</label><div class="layui-input-inline"><input class="layui-input" id="comnum"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">前置间隔天数</label><div class="layui-input-inline"><input class="layui-input" id="prenum"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">后置间隔天数</label><div class="layui-input-inline"><input class="layui-input" id="postnum"></div></div>
            <div class="layui-form-item layui-form-text"><label class="layui-form-label">注释</label><div class="layui-input-block"><textarea id="content" class="layui-textarea" placeholder="注释"></textarea></div></div>
            <div class="layui-form-item layui-form-text"><label class="layui-form-label">说明</label><div class="layui-input-block"><textarea id="editcomment" class="layui-textarea" placeholder="说明"></textarea></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/construction/construction-common.js"></script><script src="../../js/construction/constructionPlan.js"></script>
</body></html>
