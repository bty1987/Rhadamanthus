<!DOCTYPE html>
<!-- app/views/construction/constructionInfo.html —— 工程信息（交底/放线方案确认/交接管理）
  url ?type=plan|done|issue|contract 切换初始过滤。
  工具栏：导出。行按钮：记录/服务/打印/施工计划/预派监理/验房/交接/画像/标签/重置设计。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>工程信息</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="decoration.orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼盘</label><div class="layui-input-inline"><input name="decoration.house.village.no" data-op="eq" class="layui-input" placeholder="楼盘编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼号</label><div class="layui-input-inline"><input name="decoration.house.houseNumber" data-op="cn" class="layui-input" placeholder="楼号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input name="decoration.designer.userId" data-op="eq" class="layui-input" placeholder="设计师编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">监理</label><div class="layui-input-inline"><input name="constructionInfo.decoration.supervisor.userId" data-op="eq" class="layui-input" placeholder="监理编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">房屋类型</label><div class="layui-input-inline"><select name="constructionInfo.decoration.houseType" data-op="eq"><option value="">全部</option><option value="期房">期房</option><option value="现房">现房</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计状态</label><div class="layui-input-inline"><select name="constructionInfo.decoration.designStatus" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">设计中</option><option value="2">已完成</option><option value="11">微改</option><option value="21">大改</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">分配状态</label><div class="layui-input-inline"><select name="constructionInfo.isIssue" data-op="eq"><option value="">全部</option><option value="0">未分配</option><option value="1">已分配</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">验房状态</label><div class="layui-input-inline"><select name="constructionInfo.isCheck" data-op="eq"><option value="">全部</option><option value="0">未验证</option><option value="1">已分配</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">交钥匙时间</label><div class="layui-input-inline"><input name="constructionInfo.keyTime.range" data-op="between" id="keyTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">放线时间</label><div class="layui-input-inline"><input name="constructionInfo.drawlineTime.range" data-op="between" id="drawlineTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">完工时间</label><div class="layui-input-inline"><input name="constructionInfo.finishTime.range" data-op="between" id="finishTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计完成时间</label><div class="layui-input-inline"><input name="constructionInfo.designTime.range" data-op="between" id="designTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">分配时间</label><div class="layui-input-inline"><input name="constructionInfo.issueTime.range" data-op="between" id="issueTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">合同方案确认</label><div class="layui-input-inline"><input name="constructionInfo.decoration.sdesignTime.range" data-op="between" id="sdesignTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">放线方案确认</label><div class="layui-input-inline"><input name="constructionInfo.decoration.edesignTime.range" data-op="between" id="edesignTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="padding:0 15px 10px;">
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnExport"><i class="layui-icon layui-icon-download-circle"></i>导出</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar"></script>

    <div id="constructionNodeBox" style="display:none;padding:15px 25px;max-height:500px;overflow:auto;">
        <form class="layui-form" id="constructionNodeForm">
            <div class="layui-form-item">
                <label class="layui-form-label">监理</label>
                <div class="layui-input-inline" style="width:220px;"><select id="supervisorSelect" lay-search=""><option value="">请选择监理(工程部)</option></select></div>
            </div>
            <div class="layui-form-item"><div class="layui-input-block" id="constructionNodes"></div></div>
        </form>
    </div>
    <div id="checkBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="checkForm">
            <div class="layui-form-item"><label class="layui-form-label">验房人</label><div class="layui-input-inline" style="width:220px;"><select id="checkUser" lay-search=""><option value="">请选择验房人</option></select></div></div>
        </form>
    </div>
    <div id="handoverBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="handoverForm">
            <div class="layui-form-item"><label class="layui-form-label">交接状态</label><div class="layui-input-inline"><select id="handoverStatus"><option value="0">未交接</option><option value="1">已交接</option><option value="2">不验证</option></select></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/construction/construction-common.js"></script><script src="../../js/construction/constructionInfo.js"></script>
</body></html>
