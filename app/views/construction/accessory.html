<!DOCTYPE html>
<!-- app/views/construction/accessory.html —— 工程辅料（订单辅料额度管理）
  上下文：app.params.construction = { cid, orderId }。添加（商品搜索）/更新额度。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>工程辅料</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px 0;">
        <span style="font-size:16px;font-weight:bold;">工程辅料</span>
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
    </div>
    <div class="app-table" style="margin-top:10px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="update">更新</button>
    </script>

    <div id="addBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="addForm">
            <div class="layui-form-item"><label class="layui-form-label">商品</label><div class="layui-input-inline" style="width:280px;"><select id="goodsName" lay-search=""><option value="">请输入商品名称</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">商品编号</label><div class="layui-input-inline"><input class="layui-input" id="goodsNo" disabled></div></div>
            <div class="layui-form-item"><label class="layui-form-label">品类</label><div class="layui-input-inline"><input class="layui-input" id="category" disabled></div></div>
            <div class="layui-form-item"><label class="layui-form-label">品牌</label><div class="layui-input-inline"><input class="layui-input" id="brand" disabled></div></div>
            <div class="layui-form-item"><label class="layui-form-label">单位</label><div class="layui-input-inline"><input class="layui-input" id="measurementUnit" disabled></div></div>
            <div class="layui-form-item"><label class="layui-form-label">验证标识</label><div class="layui-input-inline"><select id="addCheckup"><option value="0">验证</option><option value="1">通过</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">数量限制</label><div class="layui-input-inline"><input class="layui-input" id="addNumLimit" placeholder="数量限制"></div></div>
        </form>
    </div>
    <div id="updateBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="updateForm">
            <div class="layui-form-item"><label class="layui-form-label">验证标识</label><div class="layui-input-inline"><select id="checkup"><option value="0">验证</option><option value="1">通过</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">数量限制</label><div class="layui-input-inline"><input class="layui-input" id="numLimit" placeholder="数量限制"></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/construction/construction-common.js"></script><script src="../../js/construction/accessory.js"></script>
</body></html>
