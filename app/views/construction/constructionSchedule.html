<!DOCTYPE html>
<!-- app/views/construction/constructionSchedule.html —— 施工进度管理（定额/比例/工期/预估工费维护）
  查询：装修单/楼盘/楼号/设计师/监理/工程状态 + 进度时间组 + 状态组。
  行按钮：更新定额/更新比例/更新工期/确认预估/附加项。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>施工进度管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="decoration.orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼盘</label><div class="layui-input-inline"><input name="decoration.house.village.no" data-op="eq" class="layui-input" placeholder="楼盘编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼号</label><div class="layui-input-inline"><input name="decoration.house.houseNumber" data-op="cn" class="layui-input" placeholder="楼号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input name="decoration.designer.userId" data-op="eq" class="layui-input" placeholder="设计师编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">监理</label><div class="layui-input-inline"><input name="constructionSchedule.construction.supervisor.userId" data-op="eq" class="layui-input" placeholder="监理编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">工程状态</label><div class="layui-input-inline"><select name="decoration.projectStatus" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">开工</option><option value="2">完工</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">进度状态</label><div class="layui-input-inline"><select name="constructionSchedule.status" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">开工</option><option value="2">完工</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">预估状态</label><div class="layui-input-inline"><select name="constructionSchedule.planStatus" data-op="eq"><option value="">全部</option><option value="0">标准</option><option value="1">预估</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">附加项状态</label><div class="layui-input-inline"><select name="constructionSchedule.additemStatus" data-op="eq"><option value="">全部</option><option value="0">无</option><option value="1">待审</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">创建时间</label><div class="layui-input-inline"><input name="constructionSchedule.createTime.range" data-op="between" id="createTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">开工时间</label><div class="layui-input-inline"><input name="constructionSchedule.startTime.range" data-op="between" id="startTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">完工时间</label><div class="layui-input-inline"><input name="constructionSchedule.endTime.range" data-op="between" id="endTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">进场时间</label><div class="layui-input-inline"><input name="constructionSchedule.enterTime.range" data-op="between" id="enterTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">离场时间</label><div class="layui-input-inline"><input name="constructionSchedule.leaveTime.range" data-op="between" id="leaveTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar"></script>

    <div id="updateNormBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="updateNormForm">
            <div class="layui-form-item"><label class="layui-form-label">材料浮动限额</label><div class="layui-input-inline"><input class="layui-input" id="accessoryLimit"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">工费浮动限额</label><div class="layui-input-inline"><input class="layui-input" id="salaryLimit"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">材料总额限额</label><div class="layui-input-inline"><input class="layui-input" id="accessoryTotal"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">工费总额限额</label><div class="layui-input-inline"><input class="layui-input" id="salaryTotal"></div></div>
        </form>
    </div>
    <div id="updateCaleBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="updateCaleForm">
            <div class="layui-form-item"><label class="layui-form-label">开工装修比例</label><div class="layui-input-inline"><input class="layui-input" id="precheck"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">完工装修比例</label><div class="layui-input-inline"><input class="layui-input" id="postcheck"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">开工主材比例</label><div class="layui-input-inline"><input class="layui-input" id="stacheck"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">完工主材比例</label><div class="layui-input-inline"><input class="layui-input" id="fincheck"></div></div>
        </form>
    </div>
    <div id="updatePeriodBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="updatePeriodForm">
            <div class="layui-form-item"><label class="layui-form-label">工期</label><div class="layui-input-inline"><input class="layui-input" id="period"></div></div>
        </form>
    </div>
    <div id="planSalaryBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="planSalaryForm">
            <div class="layui-form-item"><label class="layui-form-label">预估工费</label><div class="layui-input-inline"><input class="layui-input" id="planSalary"></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/construction/construction-common.js"></script><script src="../../js/construction/constructionSchedule.js"></script>
</body></html>
