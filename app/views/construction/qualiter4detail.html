<!DOCTYPE html>
<!-- app/views/construction/qualiter4detail.html —— 质检员管理（工程单下的质检人员）
  上下文：app.params.construction = { orderId }。添加质检员/删除。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>质检员</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px 0;">
        <span style="font-size:16px;font-weight:bold;">质检员：<span id="orderIdLabel">-</span></span>
        <button type="button" class="layui-btn layui-btn-sm" id="qualiterBtn"><i class="layui-icon layui-icon-add-1"></i>添加质检员</button>
    </div>
    <div class="app-table" style="margin-top:10px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>

    <div id="qualiterBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="qualiterForm">
            <div class="layui-form-item"><label class="layui-form-label">人员</label><div class="layui-input-inline" style="width:240px;"><select id="user" lay-search=""><option value="">请选择人员</option></select></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/construction/construction-common.js"></script><script src="../../js/construction/qualiter4detail.js"></script>
</body></html>
