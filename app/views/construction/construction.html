<!DOCTYPE html>
<!-- app/views/construction/construction.html —— 工程单管理（pageConfig 驱动：constructionFunctionRight 按公司差异化）
  列：装修单/楼盘/楼号/客户/设计师/监理/总价/面积/工程状态/施工状态/时间组/额度组/控制状态。
  行按钮（按 pageBtn + 状态显隐）：信息/查看/记录/增减项/返工/工程节点/工人工费/工程辅料/更新/辅料开启/辅料锁定/结算/终止。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>工程单管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="decoration.orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼盘</label><div class="layui-input-inline"><input name="decoration.house.village.no" data-op="eq" class="layui-input" placeholder="楼盘编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼号</label><div class="layui-input-inline"><input name="decoration.house.houseNumber" data-op="cn" class="layui-input" placeholder="楼号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input name="decoration.designer.userId" data-op="eq" class="layui-input" placeholder="设计师编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">工程状态</label><div class="layui-input-inline"><select name="decoration.projectStatus" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">开工</option><option value="2">完工</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">施工状态</label><div class="layui-input-inline"><select name="construction.process" data-op="eq"><option value="">全部</option><option value="0">未完工</option><option value="1">竣工交付</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">开工时间</label><div class="layui-input-inline"><input name="construction.startTime.range" data-op="between" id="startTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">完工时间</label><div class="layui-input-inline"><input name="construction.endTime.range" data-op="between" id="endTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar"></script>

    <div id="constructionInfoBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="constructionInfoForm">
            <div class="layui-form-item"><label class="layui-form-label">铲墙</label><div class="layui-input-inline"><select id="ishovel"><option value="0">公司</option><option value="1">客户</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">交付钥匙</label><div class="layui-input-inline"><select id="iskey"><option value="0">工程中心</option><option value="1">客户</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">开工仪式</label><div class="layui-input-inline"><select id="isCeremony"><option value="0">有</option><option value="1">无</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">工期</label><div class="layui-input-inline"><input class="layui-input" id="timeLimit" placeholder="工期(天)"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">验收时间</label><div class="layui-input-inline"><input class="layui-input" id="finishTime" readonly placeholder="yyyy-MM-dd"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">交钥匙时间</label><div class="layui-input-inline"><input class="layui-input" id="keyTime" readonly placeholder="yyyy-MM-dd"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">放线时间</label><div class="layui-input-inline"><input class="layui-input" id="drawlineTime" readonly placeholder="yyyy-MM-dd"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">设计时间</label><div class="layui-input-inline"><input class="layui-input" id="designTime" readonly placeholder="yyyy-MM-dd"></div></div>
            <div class="layui-form-item layui-form-text"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea id="comment" class="layui-textarea" placeholder="备注"></textarea></div></div>
        </form>
    </div>
    <div id="updateConstructionBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="updateConstructionForm">
            <div class="layui-form-item"><label class="layui-form-label">辅料额上限</label><div class="layui-input-inline"><input class="layui-input" id="accessoryLimit" placeholder="辅料额上限"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">工费上限</label><div class="layui-input-inline"><input class="layui-input" id="salaryLimit" placeholder="工费上限"></div></div>
        </form>
    </div>
    <div id="updateTerminalStatusBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="updateTerminalStatusForm">
            <div class="layui-form-item"><label class="layui-form-label">终止状态</label><div class="layui-input-inline"><select id="terminalStatus"><option value="0">无</option><option value="1">瓦工终止</option><option value="2">木工终止</option><option value="3">油工终止</option></select></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/construction/construction-common.js"></script><script src="../../js/construction/construction.js"></script>
</body></html>
