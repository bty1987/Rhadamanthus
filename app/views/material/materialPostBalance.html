<!DOCTYPE html>
<!-- app/views/material/materialPostBalance.html —— 主材结算（列表 + 厂结值/厂结/结算值/结算/收款/退款/子项/退货）-->
<html lang="zh-CN"><head><meta charset="utf-8"><title>主材结算</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input type="text" name="material.orderId" data-op="cn" placeholder="装修单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">主材单号</label><div class="layui-input-inline"><input type="text" name="material.no" data-op="cn" placeholder="主材单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">品牌</label><div class="layui-input-inline"><input type="text" name="material.brand" data-op="cn" placeholder="品牌" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnExport">导出</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="vBox" style="display:none; padding:20px;"><form class="layui-form" id="vForm">
        <input type="hidden" name="mbid">
        <div class="layui-form-item"><label class="layui-form-label">总价</label><div class="layui-input-inline"><input type="text" name="total" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">厂商结算值<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="vbalance" class="layui-input v_float"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnVSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnVCancel">取消</button></div>
    </form></div>
    <div id="bBox" style="display:none; padding:20px;"><form class="layui-form" id="bForm">
        <input type="hidden" name="mbid">
        <div class="layui-form-item"><label class="layui-form-label">预结算成本额</label><div class="layui-input-inline"><input type="text" name="prebalance" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">厂商结算额</label><div class="layui-input-inline"><input type="text" name="vbalance" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">结算值<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="balance" class="layui-input v_float"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnBSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnBCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="supBalance">厂结值</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="supPost">厂结</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="balance">结算值</button>
        <button class="layui-btn layui-btn-xs layui-btn-disabled" lay-event="post">结算</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="charge">收款</button>
        <button class="layui-btn layui-btn-xs" lay-event="sub">子项</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/<script src="../../js/app/exporter.js"></script>bootstrap.js"></script><script src="../../js/material/materialPostBalance.js"></script>
</body></html>
