<!DOCTYPE html>
<!-- app/views/material/materialModel.html —— 主材型号（CRUD + 删除）
  字段：materialModelNo(编号) materialModelName(名称) materialBrandId(品牌) measurementUnitId(单位)
        materialPurchasePrice(进价) materialUnitPrice(标价) discount(折扣) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>主材型号</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">编号</label><div class="layui-input-inline"><input type="text" name="materialModelNo" data-op="cn" placeholder="编号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="materialModelName" data-op="cn" placeholder="名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="mmId">
        <div class="layui-form-item"><label class="layui-form-label">编号<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="materialModelNo" placeholder="编号" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="materialModelName" placeholder="名称" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品类</label><div class="layui-input-block"><select name="materialTypeId" id="selMaterialType" lay-filter="materialType"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品牌<span class="app-req">*</span></label><div class="layui-input-block"><select name="materialBrandId" id="selMaterialBrand"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">单位<span class="app-req">*</span></label><div class="layui-input-block"><select name="measurementUnitId" id="selMeasurementUnit"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">进价<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="materialPurchasePrice" placeholder="进价" class="layui-input v_float" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">标价<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="materialUnitPrice" placeholder="标价" class="layui-input v_float" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">折扣<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="discount" placeholder="折扣(0-1)" class="layui-input v_float" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/material/materialModel.js"></script>
</body></html>
