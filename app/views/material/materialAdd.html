<!DOCTYPE html>
<!-- app/views/material/materialAdd.html —— 主材添项（向已存在的子订单追加明细行）
  上下文：app.params.materialSubOrder（msoId / 品牌 / 客户）+ app.params.materialOrder。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>主材添项</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="headForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><input type="text" name="type" class="layui-input" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">主材单号</label><div class="layui-input-inline"><input type="text" name="msoNo" class="layui-input" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">业务员</label><div class="layui-input-inline"><input type="text" name="salesmanName" class="layui-input" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">客户姓名</label><div class="layui-input-inline"><input type="text" name="customerName" class="layui-input" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼盘地址</label><div class="layui-input-inline"><input type="text" name="orderAddr" class="layui-input" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">备注</label><div class="layui-input-inline"><input type="text" name="comment" class="layui-input" readonly></div></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div style="margin-top:10px;">
        <button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加行</button>
        <button type="button" class="layui-btn" id="btnSubmit">提交</button>
        <button type="button" class="layui-btn layui-btn-primary" id="btnBack">返回</button>
        <span class="app-pull-right" style="line-height:38px;">原总价：<b id="originalTotalSpan">0.00</b> 总价：<b id="totalSpan">0.00</b> 品牌：<b id="materialOrderBrand"></b></span>
    </div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/material/materialAdd.js"></script>
</body></html>
