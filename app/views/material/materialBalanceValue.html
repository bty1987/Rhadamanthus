<!DOCTYPE html>
<!-- app/views/material/materialBalanceValue.html —— 主材结算值（只编辑 calcType/point/base）
  列表展示型号信息，操作仅"编辑"用于修改结算值。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>主材结算值</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="materialModelName" data-op="cn" placeholder="名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">品类</label><div class="layui-input-inline"><input type="text" name="materialTypeName" data-op="cn" placeholder="品类" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">品牌</label><div class="layui-input-inline"><input type="text" name="materialBrandName" data-op="cn" placeholder="品牌" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="mmId">
        <div class="layui-form-item"><label class="layui-form-label">编号</label><div class="layui-input-block"><input type="text" name="materialModelNo" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">名称</label><div class="layui-input-block"><input type="text" name="materialModelName" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品类</label><div class="layui-input-block"><input type="text" name="materialTypeName" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品牌</label><div class="layui-input-block"><input type="text" name="materialBrandName" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">单位</label><div class="layui-input-block"><input type="text" name="measurementUnitName" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">进价</label><div class="layui-input-inline"><input type="text" name="materialPurchasePrice" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">标价</label><div class="layui-input-inline"><input type="text" name="materialUnitPrice" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">折扣</label><div class="layui-input-inline"><input type="text" name="discount" class="layui-input" disabled></div></div>
        <div class="layui-form-item"><label class="layui-form-label">计算方式</label><div class="layui-input-block"><input type="radio" name="calcType" value="0" title="底价"><input type="radio" name="calcType" value="1" title="点位"></div></div>
        <div class="layui-form-item" id="baseDiv"><label class="layui-form-label">底价<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="base" placeholder="底价" class="layui-input v_float"></div></div>
        <div class="layui-form-item" id="pointDiv" style="display:none;"><label class="layui-form-label">点位<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="point" placeholder="点位(0-1)" class="layui-input v_float"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/material/materialBalanceValue.js"></script>
</body></html>
