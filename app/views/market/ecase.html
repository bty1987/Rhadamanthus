<!DOCTYPE html>
<!-- app/views/market/ecase.html —— 装修案例（CRUD + 状态 + 图片管理）
  字段：comment(描述) area(面积) cycle(周期) designer(设计师) city cityId status
  图片：每案例可上传多张图（epicture），按 cid 管理 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>装修案例</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加案例</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="ecid">
        <div class="layui-form-item"><label class="layui-form-label">描述</label><div class="layui-input-block"><textarea name="comment" placeholder="案例描述" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item"><label class="layui-form-label">面积</label><div class="layui-input-inline"><input type="text" name="area" placeholder="面积" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">周期</label><div class="layui-input-inline"><input type="text" name="cycle" placeholder="施工周期" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input type="text" name="designer" placeholder="设计师" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs" lay-event="enable">启用</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button><button class="layui-btn layui-btn-xs" lay-event="pics">图片</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/market/ecase.js"></script>
</body></html>
