<!DOCTYPE html>
<!-- app/views/market/marketSource.html —— 营销来源（CRUD + 禁用）
  字段：code(编码) utmCampaign(utm) campaignId(活动) channelId(渠道) profileId(画像) url qrcode -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>营销来源</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">编码</label><div class="layui-input-inline"><input type="text" name="code" data-op="cn" placeholder="编码" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="msid">
        <div class="layui-form-item"><label class="layui-form-label">编码<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="code" placeholder="编码" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">UTM标识</label><div class="layui-input-block"><input type="text" name="utmCampaign" placeholder="utmCampaign" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">活动ID</label><div class="layui-input-inline"><input type="number" name="campaignId" placeholder="活动ID" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">渠道ID</label><div class="layui-input-inline"><input type="number" name="channelId" placeholder="渠道ID" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/market/marketSource.js"></script>
</body></html>
