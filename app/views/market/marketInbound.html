<!DOCTYPE html>
<!-- app/views/market/marketInbound.html —— 营销入客（查询 + 重试）
  字段：name campaignId(channelId) csid(归属) miid status -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>营销入客</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">客户名</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="客户名" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">活动ID</label><div class="layui-input-inline"><input type="text" name="campaignId" data-op="eq" placeholder="活动ID" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="retry">重试</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/market/marketInbound.js"></script>
</body></html>
