<!DOCTYPE html>
<!-- app/views/market/card.html —— 名片管理（列表 + 编辑 + 头像上传）
  字段：userName(姓名) userPhoto(头像) phone profession(职业) industry(行业) address info -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>名片管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">姓名</label><div class="layui-input-inline"><input type="text" name="userName" data-op="cn" placeholder="姓名" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="caid">
        <input type="hidden" name="userPhoto">
        <div class="layui-form-item"><label class="layui-form-label">姓名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="userName" placeholder="姓名" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">头像</label><div class="layui-input-block"><div style="margin-bottom:10px;"><img id="cardPhoto" src="" style="width:80px;height:80px;object-fit:cover;border-radius:50%;border:1px solid #e8e8e8;display:none;"></div><button type="button" class="layui-btn" id="photoUpload"><i class="layui-icon layui-icon-upload"></i>上传头像</button></div></div>
        <div class="layui-form-item"><label class="layui-form-label">电话</label><div class="layui-input-block"><input type="text" name="phone" placeholder="电话" class="layui-input v_phone"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">职业</label><div class="layui-input-block"><input type="text" name="profession" placeholder="职业" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">行业</label><div class="layui-input-block"><input type="text" name="industry" placeholder="行业" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">地址</label><div class="layui-input-block"><input type="text" name="address" placeholder="地址" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">简介</label><div class="layui-input-block"><textarea name="info" placeholder="简介" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/market/card.js"></script>
</body></html>
