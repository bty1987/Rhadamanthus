<!DOCTYPE html>
<!-- app/views/market/marketChannel.html —— 营销渠道（CRUD + 禁用）
  字段：name(渠道名) platform(平台) type(类型) ownerId(负责人) comment(备注) status -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>营销渠道</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">渠道名</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="渠道名" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">平台</label><div class="layui-input-inline"><input type="text" name="platform" data-op="cn" placeholder="平台" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="mchid">
        <div class="layui-form-item"><label class="layui-form-label">渠道名<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="渠道名" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">平台</label><div class="layui-input-block"><input type="text" name="platform" placeholder="平台" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-block"><input type="text" name="type" placeholder="类型" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">负责人</label><div class="layui-input-block"><input type="text" name="ownerId" placeholder="负责人ID" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="comment" placeholder="备注" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/market/marketChannel.js"></script>
</body></html>
