<!DOCTYPE html>
<!-- app/views/map/fl.html —— 地图数据可视化（百度地图）：城市客源气泡 + 小区分布标记。原 fl.js 为纯静态演示数据，此处保留演示能力并附数据表格。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="initial-scale=1.0, user-scalable=no">
<title>地图数据可视化</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css">
<style>
#dituContent { width: 100%; height: 520px; overflow: hidden; margin: 0; font-family: 'Microsoft YaHei', sans-serif; }
.fl-city-label { color: #fff; font-size: 14px; text-align: center; text-shadow: 0 0 5px #474a4d; }
.fl-city-label strong { display: block; font-size: 18px; }
.fl-village-label { color: #fff; background: #d9534f; border: 1px solid #a94442; border-radius: 3px; padding: 0 6px; font-size: 12px; white-space: nowrap; }
.map-note { padding: 8px 15px; color: #999; }
</style>
<script type="text/javascript" src="http://api.map.baidu.com/api?v=2.0&ak=YRZ8VtGFH30OjHaHpOXhcF3ehgGiCe1E"></script>
</head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" onsubmit="return false;"><div class="layui-form-item">
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnCity"><i class="layui-icon layui-icon-chart-screen"></i>全国城市客源</button><button type="button" class="layui-btn layui-btn-warm" id="btnVillage"><i class="layui-icon layui-icon-location"></i>沈阳小区分布</button></div>
    </div></form></div>
    <blockquote class="layui-elem-quote layui-quote-nm map-note">原 fl.js 为纯静态演示数据（二手房/租房演示），未接任何业务接口；此处保留同等演示：城市级客源气泡 / 沈阳小区标记 + 明细表格。<\/blockquote>
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12"><div id="dituContent"><div class="map-note" style="padding-top:220px;text-align:center;">百度地图 SDK（api.map.baidu.com）未加载或 AK 失效，地图画布不可用。<\/div></div></div>
        <div class="layui-col-md12"><table class="layui-hide" id="dataTable" lay-filter="dataTable"></table></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/map/fl.js"></script>
</body></html>
