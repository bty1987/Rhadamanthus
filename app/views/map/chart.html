<!DOCTYPE html>
<!-- app/views/map/chart.html —— 图表配置清单：原 chart.js 从 queryChart.do 取图表配置后委托内网 library 服务（192.168.5.22/library，硬编码 IP+token）渲染 echarts，该渲染服务已下线；此处保留配置清单表格 + 渲染服务占位说明。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>图表配置清单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css">
<style>
.chart-placeholder { height: 200px; line-height: 200px; text-align: center; color: #999; background: #f8f8f8; border: 1px dashed #ddd; border-radius: 4px; }
</style>
</head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" onsubmit="return false;"><div class="layui-form-item">
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-warm" id="btnRefresh"><i class="layui-icon layui-icon-refresh"></i>刷新</button></div>
    </div></form></div>
    <blockquote class="layui-elem-quote layui-quote-nm">原图表渲染依赖内网 library 服务（http://192.168.5.22/library，硬编码 IP 与令牌），已随内网下线不可达；此处保留 queryChart.do 返回的图表配置清单，图表画布为占位。<\/blockquote>
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12"><div class="chart-placeholder">图表画布占位 —— 渲染服务已下线，仅保留图表配置清单<\/div></div>
        <div class="layui-col-md12"><table class="layui-hide" id="chartTable" lay-filter="chartTable"></table></div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/map/chart.js"></script>
</body></html>
