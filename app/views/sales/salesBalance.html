<!DOCTYPE html>
<!-- app/views/sales/salesBalance.html —— 销售结算单（列表 + 改厂商/平台结算额 + 明细 + 上传图片）
  url ?type=bdompany|bsupplier|bpompany|allowance*|其他。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>销售结算单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">销售单号</label><div class="layui-input-inline"><input type="text" name="sales.no" data-op="cn" placeholder="销售单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">订单号</label><div class="layui-input-inline"><input type="text" name="sales.orderId" data-op="cn" placeholder="装修单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="sbid">
        <input type="hidden" name="field">
        <div class="layui-form-item"><label class="layui-form-label" id="fieldLabel">金额<span class="app-req">*</span></label><div class="layui-input-block"><input type="number" step="0.01" name="value" class="layui-input" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <div id="picBox" style="display:none; padding:20px;">
        <div style="margin-bottom:10px;"><button type="button" class="layui-btn" id="btnUpload"><i class="layui-icon layui-icon-upload"></i>上传图片</button></div>
        <div id="gallery" style="display:flex;flex-wrap:wrap;gap:10px;"></div>
        <input type="hidden" id="picSbid">
    </div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="detail">明细</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="vbalance">改厂商结算</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="pbalance">改平台结算</button>
        <button class="layui-btn layui-btn-xs" lay-event="pic">图片</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/sales/salesBalance.js"></script>
</body></html>
