<!DOCTYPE html>
<!-- app/views/sales/sales2xg.html —— 销售单转出库单（列表 + 批量/单条转出库）
  type 来自 url ?type=xxx（默认 dompany） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>销售单转出库单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">销售单号</label><div class="layui-input-inline"><input type="text" name="no" data-op="cn" placeholder="销售单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">订单号</label><div class="layui-input-inline"><input type="text" name="orderId" data-op="cn" placeholder="装修单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-warm" id="btnBatchXg"><i class="layui-icon layui-icon-release"></i>批量出库单</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form" id="editForm">
            <div class="layui-form-item"><label class="layui-form-label">出库时间<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="manifestTime" id="manifestTime" placeholder="yyyy-MM-dd" class="layui-input" lay-verify="required"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="comment" class="layui-input"></div></div>
        </form>
        <h3 style="font-size:14px;font-weight:bold;padding:8px 0;color:#333;margin-top:10px;">销售项明细（勾选需转出库的商品）</h3>
        <div class="app-table"><table id="itemTable" lay-filter="itemTable"></table></div>
        <div style="margin-top:10px;text-align:right;"><button type="button" class="layui-btn" id="xgSaveBtn">提交出库单</button></div>
    </div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="xg">出库单</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/sales/sales2xg.js"></script>
</body></html>
