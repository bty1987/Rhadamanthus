<!DOCTYPE html>
<!-- app/views/sales/salesDelivery.html —— 销售送货管理（列表 + 配送/审核/确认/完结/编辑/转运）
  url 参数 ?pagetype=init|check|confirm|finish|balance -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>销售送货管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">销售单号</label><div class="layui-input-inline"><input type="text" name="sales.no" data-op="cn" placeholder="销售单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">订单号</label><div class="layui-input-inline"><input type="text" name="sales.orderId" data-op="cn" placeholder="装修单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="sdiid">
        <div class="layui-form-item"><label class="layui-form-label">配送时间</label><div class="layui-input-block"><input type="text" name="protranTime" id="protranTime" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="comment" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <div id="tranBox" style="display:none; padding:20px;"><form class="layui-form" id="tranForm">
        <div class="layui-form-item"><label class="layui-form-label">商品</label><div class="layui-input-block"><input type="text" id="tranGoodsName" class="layui-input" readonly></div></div>
        <div class="layui-form-item"><label class="layui-form-label">订单数量</label><div class="layui-input-block"><input type="text" id="tranOrderNum" class="layui-input" readonly></div></div>
        <div class="layui-form-item"><label class="layui-form-label">配送数量<span class="app-req">*</span></label><div class="layui-input-block"><input type="number" step="0.01" id="tranNum" class="layui-input" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnTranSave">提交</button><button type="button" class="layui-btn layui-btn-primary" id="btnTranCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="tran">配送</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="check">审核</button>
        <button class="layui-btn layui-btn-xs" lay-event="confirm">确认</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="finish">完结</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/sales/salesDelivery.js"></script>
</body></html>
