<!DOCTYPE html>
<!-- app/views/sales/salesRefunds.html —— 销售退货单（列表 + 打印/退货/推送/确认） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>销售退货单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">销售单号</label><div class="layui-input-inline"><input type="text" name="sales.no" data-op="cn" placeholder="销售单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">品类</label><div class="layui-input-inline"><input type="text" name="sales.category" data-op="cn" placeholder="品类" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">品牌</label><div class="layui-input-inline"><input type="text" name="sales.brand.name" data-op="cn" placeholder="品牌" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="print">打印</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="refunds">退货</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="send">推送</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="affirm">确认</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/sales/salesRefunds.js"></script>
</body></html>
