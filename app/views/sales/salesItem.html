<!DOCTYPE html>
<!-- app/views/sales/salesItem.html —— 销售项明细（列表 + 编辑数量/退货/导入）
  上下文：app.params.sales.sales = {sid,...}, app.params.sales.dompany -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>销售项明细</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div style="margin-bottom:10px;">
        <button type="button" class="layui-btn layui-btn-danger" id="btnRefund">退货</button>
        <button type="button" class="layui-btn layui-btn-warm" id="btnFullRefund">整单退</button>
        <button type="button" class="layui-btn layui-btn-normal" id="btnReOrder">补单</button>
        <button type="button" class="layui-btn" id="btnImport">导入</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <!-- 编辑数量 -->
    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form" id="editForm">
            <input type="hidden" name="siid">
            <input type="hidden" name="oldNum">
            <input type="hidden" name="oldTotal">
            <div class="layui-form-item"><label class="layui-form-label">数量<span class="app-req">*</span></label><div class="layui-input-block"><input type="number" step="0.01" name="num" class="layui-input" lay-verify="required"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="comment" class="layui-input"></div></div>
            <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnEditSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnEditCancel">取消</button></div>
        </form>
    </div>
    <!-- 退货审批 -->
    <div id="refundBox" style="display:none; padding:20px;">
        <form class="layui-form" id="refundForm">
            <input type="hidden" name="approvalType">
            <div class="layui-form-item"><label class="layui-form-label">实退款金额<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" id="refundTotal" class="layui-input" lay-verify="required"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">审批人 userId<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" id="approver" class="layui-input" lay-verify="required"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">设计部</label><div class="layui-input-block"><input type="text" id="designDept" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">退货原因</label><div class="layui-input-block"><textarea id="refundDes" class="layui-textarea"></textarea></div></div>
            <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnApproveSave">提交审批</button><button type="button" class="layui-btn layui-btn-primary" id="btnApproveCancel">取消</button></div>
        </form>
    </div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/sales/salesItem.js"></script>
</body></html>
