<!DOCTYPE html>
<!-- app/views/sales/salesRefundsItem.html —— 销售退货明细（按销售单/退货单列出退货项 + 推送/打印）
  上下文：app.params.sales.sales = {sid,...}, app.params.flag = "refunds"|"sales",
  refunds 模式下 app.params.rid 指定退货单。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>销售退货明细</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-table"><table id="refundsTable" lay-filter="refundsTable"></table></div>
    <h3 style="font-size:14px;font-weight:bold;padding:8px 0;color:#333;" style="margin-top:14px;">退货项明细</h3>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="refundsToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="print">打印</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="send">推送</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/sales/salesRefundsItem.js"></script>
</body></html>
