<!DOCTYPE html>
<!-- app/views/sales/sales2supple.html —— 销售单补单（基于现有销售单复制商品，填写补单数量后提交新单）
  上下文：app.params.sales.sales = {sid, brand:{bid}, ...} -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>销售单补单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <form class="layui-form" id="searchInfo" style="margin-bottom:10px;border:1px solid #e6e6e6;padding:10px;">
        <div class="layui-form-item">
            <div class="layui-inline"><label class="layui-form-label">订单号</label><div class="layui-input-inline"><input type="text" id="SupplementOrderId" class="layui-input" readonly></div></div>
            <div class="layui-inline"><label class="layui-form-label">客户</label><div class="layui-input-inline"><input type="text" id="customerName" class="layui-input" readonly></div></div>
            <div class="layui-inline"><label class="layui-form-label">品牌-品类</label><div class="layui-input-inline"><input type="text" id="brands" class="layui-input" readonly></div></div>
            <div class="layui-inline"><label class="layui-form-label">地址</label><div class="layui-input-inline" style="width:260px;"><input type="text" id="orderAddr" class="layui-input" readonly></div></div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline"><label class="layui-form-label">渠道</label><div class="layui-input-inline"><input type="text" id="salesmanName" placeholder="拼音" class="layui-input"></div></div>
            <div class="layui-inline"><label class="layui-form-label">驻店</label><div class="layui-input-inline"><input type="text" id="instorer" placeholder="拼音" class="layui-input"></div></div>
            <div class="layui-inline"><label class="layui-form-label">导购</label><div class="layui-input-inline"><input type="text" id="guider" placeholder="拼音" class="layui-input"></div></div>
            <div class="layui-inline"><label class="layui-form-label">券</label><div class="layui-input-inline"><input type="text" id="SupplementCoupon" placeholder="券值" class="layui-input"></div></div>
            <div class="layui-inline"><label class="layui-form-label">抹零</label><div class="layui-input-inline"><input type="text" id="SupplementMaling" placeholder="抹零" class="layui-input"></div></div>
            <div class="layui-inline"><label class="layui-form-label">总额</label><div class="layui-input-inline"><input type="text" id="totals" class="layui-input" readonly></div></div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline"><label class="layui-form-label">备注</label><div class="layui-input-inline" style="width:400px;"><input type="text" id="comment" class="layui-input"></div></div>
            <div class="layui-inline"><button type="button" class="layui-btn" id="submit">提交补单</button></div>
        </div>
    </form>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/sales/sales2supple.js"></script>
</body></html>
