<!DOCTYPE html>
<!-- app/views/sales/salesBalance4pre.html —— 销售单预结（列表 + 详情 + 预结 + 改抹零）
  url ?type=predompany|prepompany|其他。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>销售单预结</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">销售单号</label><div class="layui-input-inline"><input type="text" name="no" data-op="cn" placeholder="销售单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">订单号</label><div class="layui-input-inline"><input type="text" name="orderId" data-op="cn" placeholder="装修单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="sid">
        <input type="hidden" name="originalMaling">
        <input type="hidden" name="venderMaling">
        <div class="layui-form-item"><label class="layui-form-label">当前抹零</label><div class="layui-input-inline"><input type="text" id="maling" class="layui-input" readonly></div></div>
        <div class="layui-form-item"><label class="layui-form-label">新增厂商抹零<span class="app-req">*</span></label><div class="layui-input-block"><input type="number" step="0.01" id="editVenderMaling" class="layui-input" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="detail">详情</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="wipezero">改抹零</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="pre">预结</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/sales/salesBalance4pre.js"></script>
</body></html>
