<!DOCTYPE html>
<!-- app/views/sales/sales4payment.html —— 销售收款记录（列表 + 撤款 + 落款）
  上下文：app.params.sales.sales = {sid,...}, app.params.sales.type = "sales"|"balance" -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>销售收款</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar">
        {{# if(d.status == 0 && (d.type == 2 || d.type == 3 || d.type == 8)){ }}<button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="settle">落款</button>{{# } else { }}<button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refund">撤款</button>{{# } }}
    </script>
    <div id="returnBox" style="display:none; padding:20px;">
        <form class="layui-form" id="returnForm">
            <div class="layui-form-item"><label class="layui-form-label">撤款金额</label><div class="layui-input-block"><input type="text" id="returnTotal" class="layui-input" readonly></div></div>
            <div class="layui-form-item"><label class="layui-form-label">审批人</label><div class="layui-input-block"><input type="text" id="approver" placeholder="审批人 userId" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea id="comment" class="layui-textarea"></textarea></div></div>
            <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnApproveSave">提交</button><button type="button" class="layui-btn layui-btn-primary" id="btnApproveCancel">取消</button></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/sales/sales4payment.js"></script>
</body></html>
