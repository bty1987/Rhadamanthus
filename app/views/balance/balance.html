<!DOCTYPE html>
<!-- app/views/balance/balance.html —— 结算单（列表 + 出纳/结算/明细/扣款/分摊 + 批量付款 + 新增）
  balance.type: 1应付款/2应收款；balance.status: 0初始/1结算/2付款；balance.isPay: 0未付款/1已付款。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>结算单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">结算单号</label><div class="layui-input-inline"><input type="text" name="no" data-op="cn" placeholder="结算单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="">全部</option><option value="1">应付款</option><option value="2">应收款</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status"><option value="">全部</option><option value="0">初始</option><option value="1">结算</option><option value="2">付款</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">付款标识</label><div class="layui-input-inline"><select name="isPay"><option value="">全部</option><option value="0">未付款</option><option value="1">已付款</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="margin:10px 0;">
        <button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>新增</button>
        <button type="button" class="layui-btn layui-btn-warm" id="btnPayed"><i class="layui-icon layui-icon-template-1"></i>批量付款</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>

    <div id="addBox" style="display:none; padding:20px;"><form class="layui-form" id="addForm">
        <div class="layui-form-item"><label class="layui-form-label">归属人<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="belongerName" id="belongerName" placeholder="拼音首字母" class="layui-input" autocomplete="off"><input type="hidden" name="belongerUserId"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">金额<span class="app-req">*</span></label><div class="layui-input-block"><input type="number" step="0.01" name="amount" class="layui-input" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型<span class="app-req">*</span></label><div class="layui-input-block"><select name="type" lay-verify="required"><option value="">请选择</option><option value="1">应付款</option><option value="2">应收款</option></select></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnAddConfirm">确定</button><button type="button" class="layui-btn layui-btn-primary" id="btnAddCancel">取消</button></div>
    </form></div>

    <div id="balanceBox" style="display:none; padding:20px;"><form class="layui-form" id="balanceForm">
        <div class="layui-form-item"><label class="layui-form-label">结算账户<span class="app-req">*</span></label><div class="layui-input-block"><select name="bccount" id="bccount" lay-verify="required"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">出纳账户<span class="app-req">*</span></label><div class="layui-input-block"><select name="cccount" id="cccount" lay-verify="required"></select></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnBalanceConfirm">结算</button><button type="button" class="layui-btn layui-btn-primary" id="btnBalanceCancel">取消</button></div>
    </form></div>

    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="pay">出纳</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="balance">结算</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="detail">结算明细</button>
        <button class="layui-btn layui-btn-xs" lay-event="cutpay">结算扣款</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="apport">分摊明细</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/balance/balance.js"></script>
</body></html>
