<!DOCTYPE html>
<!-- app/views/balance/balanceAccount.html —— 结算账户（列表 + 添加账户/结算账户/出纳账户 + 启用禁用 + 提款）
  balanceAccount.type: 0结算/1出纳；balanceAccount.status: 0启用/1禁用。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>结算账户</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="账户名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="">全部</option><option value="0">结算</option><option value="1">出纳</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status"><option value="">全部</option><option value="0">启用</option><option value="1">禁用</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="margin:10px 0;">
        <button type="button" class="layui-btn" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加账户</button>
        <button type="button" class="layui-btn layui-btn-normal" id="btnAddBccount"><i class="layui-icon layui-icon-add-1"></i>添加结算</button>
        <button type="button" class="layui-btn layui-btn-warm" id="btnAddCccount"><i class="layui-icon layui-icon-add-1"></i>添加出纳</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>

    <div id="addBox" style="display:none; padding:20px;"><form class="layui-form" id="addForm">
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" class="layui-input" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型<span class="app-req">*</span></label><div class="layui-input-block"><select name="type" lay-verify="required"><option value="">请选择</option><option value="0">结算</option><option value="1">出纳</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">归属人<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="belonger" placeholder="用户ID" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnAddConfirm">确定</button><button type="button" class="layui-btn layui-btn-primary" id="btnAddCancel">取消</button></div>
    </form></div>

    <div id="addrBox" style="display:none; padding:20px;"><form class="layui-form" id="addrForm">
        <input type="hidden" name="atype">
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" class="layui-input" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">归属人</label><div class="layui-input-block"><input type="text" name="belonger" placeholder="用户ID" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">电话</label><div class="layui-input-block"><input type="text" name="phone" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">地址</label><div class="layui-input-block"><input type="text" name="address" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">银行</label><div class="layui-input-block"><input type="text" name="bank" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">卡号</label><div class="layui-input-block"><input type="text" name="bankno" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnAddrConfirm">确定</button><button type="button" class="layui-btn layui-btn-primary" id="btnAddrCancel">取消</button></div>
    </form></div>

    <div id="withdrawBox" style="display:none; padding:20px;"><form class="layui-form" id="withdrawForm">
        <input type="hidden" name="baid">
        <div class="layui-form-item"><label class="layui-form-label">提款金额<span class="app-req">*</span></label><div class="layui-input-block"><input type="number" step="0.01" name="money" class="layui-input" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnWithdrawConfirm">确定</button><button type="button" class="layui-btn layui-btn-primary" id="btnWithdrawCancel">取消</button></div>
    </form></div>

    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs {{# if(d.status == 0){ }}layui-btn-normal{{# } else { }}layui-btn-disabled{{# } }}" lay-event="status">{{# if(d.status == 0){ }}禁用{{# } else { }}启用{{# } }}</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="withdraw">提款</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/balance/balanceAccount.js"></script>
</body></html>
