<!DOCTYPE html>
<!-- app/views/balance/balanceDccount.html —— 扣款账户（列表 + 创建/更新 + 有效/失效 + 明细）
  balanceDccount.type: 0类型A/1类型B；status: 0有效(VALID)/1失效(UNVALID)。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>扣款账户</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="账户名" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status"><option value="">全部</option><option value="0">有效</option><option value="1">失效</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="margin:10px 0;">
        <button type="button" class="layui-btn" id="btnCreate"><i class="layui-icon layui-icon-add-1"></i>创建</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>

    <div id="createBox" style="display:none; padding:20px;"><form class="layui-form" id="createForm">
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" class="layui-input" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型<span class="app-req">*</span></label><div class="layui-input-block"><select name="type" lay-verify="required"><option value="">请选择</option><option value="0">类型A</option><option value="1">类型B</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">归属人</label><div class="layui-input-block"><input type="text" name="belonger.userId" placeholder="用户ID" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">开始时间</label><div class="layui-input-block"><input type="text" name="startTime" id="startTime" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">结束时间</label><div class="layui-input-block"><input type="text" name="endTime" id="endTime" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">总额<span class="app-req">*</span></label><div class="layui-input-block"><input type="number" step="0.01" name="cutpay" class="layui-input" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-block"><textarea name="comment" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnCreateConfirm">确定</button><button type="button" class="layui-btn layui-btn-primary" id="btnCreateCancel">取消</button></div>
    </form></div>

    <div id="updateBox" style="display:none; padding:20px;"><form class="layui-form" id="updateForm">
        <input type="hidden" name="bdid">
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" class="layui-input" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnUpdateConfirm">确定</button><button type="button" class="layui-btn layui-btn-primary" id="btnUpdateCancel">取消</button></div>
    </form></div>

    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="detail">明细</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="update">更新</button>
        {{# if(d.status == 1){ }}<button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="valid">设为有效</button>{{# } }}
        {{# if(d.status == 0){ }}<button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="invalid">设为失效</button>{{# } }}
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/balance/balanceDccount.js"></script>
</body></html>
