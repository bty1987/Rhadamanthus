<!DOCTYPE html>
<!-- app/views/contract/C-001-D-1-0001.html —— 方林装修设计费合同（模板表单页）
  上下文：app.params.decoration = { orderId, contractargs:{cid,company,agent}, contract? }。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>方林装修设计费合同</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page" style="max-width:1020px;margin:0 auto;">
    <blockquote class="layui-elem-quote layui-quote-nm" style="margin-bottom:10px;">* 橙色标记为必填信息；补充条款文本域双击可插入话术。</blockquote>
    <form class="layui-form" id="form">
        <fieldset class="layui-elem-field"><legend>客户信息</legend><div class="layui-field-box">
            <div class="layui-form-item">
                <div class="layui-inline customer"><label class="layui-form-label">甲方<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-customer-name" maxlength="32"></div></div>
                <div class="layui-inline customer"><label class="layui-form-label">联系电话<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-customer-phone"></div></div>
                <div class="layui-inline customer"><label class="layui-form-label">身份证号<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-customer-ident"></div></div>
            </div>
        </div></fieldset>

        <fieldset class="layui-elem-field company"><legend>甲方公司信息</legend><div class="layui-field-box">
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">公司编号<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-company-no" value="/" maxlength="32"></div></div>
                <div class="layui-inline"><label class="layui-form-label">公司名称<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-company-name" value="/" maxlength="32"></div></div>
                <div class="layui-inline"><label class="layui-form-label">甲方公司1<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-company-name1" value="/" maxlength="32"></div></div>
                <div class="layui-inline"><label class="layui-form-label">公司地址<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-company-addr" value="/" maxlength="32"></div></div>
                <div class="layui-inline"><label class="layui-form-label">公司电话<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-company-phone" value="/" maxlength="32"></div></div>
                <div class="layui-inline"><label class="layui-form-label">开户行<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-company-bank" value="/" maxlength="32"></div></div>
                <div class="layui-inline"><label class="layui-form-label">开户账号<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-company-bankno" value="/" maxlength="32"></div></div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline" style="display:none;"><label class="layui-form-label">乙方<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem v_required" id="con-partyb-name" maxlength="32"></div></div>
            </div>
        </div></fieldset>

        <fieldset class="layui-elem-field"><legend>施工信息</legend><div class="layui-field-box">
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">施工地址</label><div class="layui-input-inline" style="width:560px;">
                    <input class="layui-input conitem" id="con-province-name" style="width:150px;display:inline-block;"> 省
                    <input class="layui-input conitem" id="con-city-name" style="width:150px;display:inline-block;"> 市
                    <input class="layui-input conitem" id="con-proper-name" style="width:150px;display:inline-block;"> 区
                </div></div>
                <div class="layui-inline"><label class="layui-form-label"></label><div class="layui-input-inline" style="width:560px;">
                    <input class="layui-input conitem" id="con-village-name" style="width:220px;display:inline-block;"> 园区
                    <input class="layui-input conitem" id="con-housenumber" style="width:280px;display:inline-block;">
                </div></div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">面积<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem" id="con-buildarea"></div></div>
                <div class="layui-inline"><label class="layui-form-label">设计费<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem" id="con-design-money" maxlength="32"></div></div>
                <div class="layui-inline"><label class="layui-form-label">实收设计费<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem" id="con-design-rmoney" maxlength="32"></div></div>
                <div class="layui-inline"><label class="layui-form-label">设计师<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem" id="con-designer-name" maxlength="32"></div></div>
                <div class="layui-inline"><label class="layui-form-label">联系电话<i class="app-req">*</i></label><div class="layui-input-inline"><input class="layui-input conitem" id="con-designer-phone"></div></div>
            </div>
        </div></fieldset>

        <fieldset class="layui-elem-field"><legend>补充条款</legend><div class="layui-field-box">
            <textarea class="layui-textarea conitem makeup" id="con-markup-one" rows="6" maxlength="512" placeholder="补充条款 , 请双击获取内容或手动输入"></textarea>
        </div></fieldset>

        <div class="layui-form-item" style="text-align:center;padding:10px 0;">
            <button type="button" class="layui-btn" id="preservation"><i class="layui-icon layui-icon-ok"></i>保存合同</button>
            <button type="button" class="layui-btn layui-btn-primary" id="btnClose">关闭</button>
        </div>
    </form>
    <div data-talking-box style="display:none;"><div id="talkingList"></div></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/contract/contract-common.js"></script><script src="../../js/contract/C-001-D-1-0001.js"></script>
</body></html>
