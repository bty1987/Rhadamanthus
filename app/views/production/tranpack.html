<!DOCTYPE html>
<!-- app/views/production/tranpack.html —— 运输包装（分页列表 + 状态流转：仓储/物流/运输/安装/完成/丢失 + 二维码）
  字段：no(编号) production.pno(生产单号) type(0外协/1五金/2计划) status(0初始/1仓库/2物流/3运输/4安装/5完成/6丢失) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>运输包装</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">编号</label><div class="layui-input-inline"><input type="text" name="no" data-op="cn" placeholder="编号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="qrcode">二维码</button>
        <button class="layui-btn layui-btn-xs" lay-event="instore">仓储</button>
        <button class="layui-btn layui-btn-xs" lay-event="receipt">物流</button>
        <button class="layui-btn layui-btn-xs" lay-event="transport">运输</button>
        <button class="layui-btn layui-btn-xs" lay-event="install">安装</button>
        <button class="layui-btn layui-btn-xs" lay-event="complete">完成</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="loss">丢失</button>
    </script>
    <div id="qrcodeBox" style="display:none; padding:20px; text-align:center;"></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/production/tranpack.js"></script>
</body></html>
