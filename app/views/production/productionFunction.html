<!DOCTYPE html>
<!-- app/views/production/productionFunction.html —— 生产功能权限配置
  上下文：app.params.productionFunction = {action}（action: production/hardware/outsource/productionPlan/tranpack）-->
<html lang="zh-CN"><head><meta charset="utf-8"><title>生产功能配置</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="config">配置</button></script>

    <div id="apiBox" style="display:none; padding:20px;">
        <form class="layui-form" id="apiForm">
            <div class="layui-form-item"><label class="layui-form-label">API</label><div class="layui-input-block" id="apiData"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">查询条件</label><div class="layui-input-block" id="condArrData"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">字段</label><div class="layui-input-block" id="fieldData"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">功能</label><div class="layui-input-block" id="functionData"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">节点</label><div class="layui-input-block" id="nodeData"></div></div>
            <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveApi">确定</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancelApi">取消</button></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/production/productionFunction.js"></script>
</body></html>
