<!DOCTYPE html>
<!-- app/views/production/productionPlan.html —— 生产计划（分页列表 + 子项/进度/上传/完结）
  字段：no(编号) production.pno(生产单号) status(0初始/1完结) timeLimit(工期) -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>生产计划</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">编号</label><div class="layui-input-inline"><input type="text" name="no" data-op="cn" placeholder="编号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="item">计划项</button>
        <button class="layui-btn layui-btn-xs" lay-event="progress">生产进度</button>
        <button class="layui-btn layui-btn-xs" lay-event="finish">完结</button>
    </script>

    <div id="finishBox" style="display:none; padding:20px;"><form class="layui-form" id="finishForm">
        <input type="hidden" name="ppid">
        <div class="layui-form-item"><label class="layui-form-label">数量<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="num" placeholder="数量" class="layui-input v_number" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnFinishOk">确定</button><button type="reset" class="layui-btn layui-btn-primary" id="btnFinishCancel">取消</button></div>
    </form></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/production/productionPlan.js"></script>
</body></html>
