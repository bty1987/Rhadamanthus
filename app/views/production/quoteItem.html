<!DOCTYPE html>
<!-- app/views/production/quoteItem.html —— 报价项（CRUD + 启用/禁用）
  字段：name(名称) format(型号) measurementunit(单位) unitprice(单价) quoteType.qtid(类型) status -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>报价项</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="quoteType.qtid" data-op="eq" id="searchQuoteType"><option value="">全部</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="qiid">
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="名称" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">型号</label><div class="layui-input-block"><input type="text" name="format" placeholder="型号" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">单位<span class="app-req">*</span></label><div class="layui-input-block"><select name="measurementunit" id="selUnit"></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">单价<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="unitprice" placeholder="单价" class="layui-input v_float" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型<span class="app-req">*</span></label><div class="layui-input-block"><select name="quoteType.qtid" id="selQuoteType"></select></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs" lay-event="status">启用/禁用</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/production/quoteItem.js"></script>
</body></html>
