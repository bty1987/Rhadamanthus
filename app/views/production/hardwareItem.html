<!DOCTYPE html>
<!-- app/views/production/hardwareItem.html —— 五金项（弹窗子页：分页列表 + 添加）
  上下文：app.params.hardwareItem = {hid, hardwareStatus, productionStatus} -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>五金项</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div style="padding:10px 15px;"><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button> <button type="button" class="layui-btn layui-btn-primary" id="btnBack">返回</button></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>

    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="名称(拼音自动匹配)" class="layui-input v_required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">单位</label><div class="layui-input-inline"><input type="text" name="measurementUnit" class="layui-input" readonly></div></div>
        <div class="layui-form-item"><label class="layui-form-label">单价<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="unitprice" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">数量<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="num" value="1" class="layui-input v_float"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">总价</label><div class="layui-input-inline"><input type="text" name="total" class="layui-input" readonly></div></div>
        <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-block"><input type="text" name="comment" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/production/hardwareItem.js"></script>
</body></html>
