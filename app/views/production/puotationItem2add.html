<!DOCTYPE html>
<!-- app/views/production/puotationItem2add.html —— 报价单添加子项（左侧填项+右侧累积，逐项提交 addPuotationItem）
  上下文：app.params.puotationItemAdd = {qid, discount, total, name, comment} -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>报价单添加子项</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md5">
            <fieldset class="layui-elem-field"><legend>报价项</legend><form class="layui-form" id="itemForm" style="padding:12px;">
                <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" placeholder="名称(拼音自动匹配)" class="layui-input v_required"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-block"><input type="text" name="brand" class="layui-input" readonly></div></div>
                <div class="layui-form-item"><label class="layui-form-label">单位</label><div class="layui-input-block"><input type="text" name="measurementunit" class="layui-input" readonly></div></div>
                <div class="layui-form-item"><label class="layui-form-label">规格</label><div class="layui-input-block"><input type="text" name="format" class="layui-input" readonly></div></div>
                <div class="layui-row">
                    <div class="layui-col-md4"><div class="layui-form-item"><label class="layui-form-label">高</label><div class="layui-input-block"><input type="text" name="height" value="0" class="layui-input v_float"></div></div></div>
                    <div class="layui-col-md4"><div class="layui-form-item"><label class="layui-form-label">宽</label><div class="layui-input-block"><input type="text" name="width" value="0" class="layui-input v_float"></div></div></div>
                    <div class="layui-col-md4"><div class="layui-form-item"><label class="layui-form-label">厚</label><div class="layui-input-block"><input type="text" name="thick" value="0" class="layui-input v_float"></div></div></div>
                </div>
                <div class="layui-form-item"><label class="layui-form-label">售价<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="unitprice" placeholder="售价" class="layui-input v_float"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">数量<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="num" value="1" class="layui-input v_float"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">总价</label><div class="layui-input-block"><input type="text" name="total" class="layui-input" readonly></div></div>
                <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="remark" class="layui-input"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">特型</label><div class="layui-input-block"><input type="text" name="specil" class="layui-input"></div></div>
                <div class="layui-form-item"><button type="button" class="layui-btn" id="btnAdd">添加到列表</button> <button type="button" class="layui-btn layui-btn-primary" id="btnRefresh">重置</button></div>
            </form></fieldset>
        </div>
        <div class="layui-col-md7">
            <fieldset class="layui-elem-field"><legend>报价信息</legend><form class="layui-form" id="headForm" style="padding:12px;">
                <div class="layui-form-item"><label class="layui-form-label">品牌</label><div class="layui-input-block"><input type="text" name="brands" class="layui-input" readonly></div></div>
                <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="comment" class="layui-input"></div></div>
                <div class="layui-form-item"><label class="layui-form-label">折让</label><div class="layui-input-inline"><input type="text" name="discount" class="layui-input v_discount" readonly></div></div>
                <div class="layui-form-item"><label class="layui-form-label">总额</label><div class="layui-input-inline"><input type="text" name="totals" class="layui-input" readonly></div></div>
            </form></fieldset>
            <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
            <div style="padding:10px;"><button type="button" class="layui-btn" id="btnSubmit">提交</button> <button type="button" class="layui-btn layui-btn-primary" id="btnBack">返回</button></div>
        </div>
    </div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/production/puotationItem2add.js"></script>
</body></html>
