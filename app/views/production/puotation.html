<!DOCTYPE html>
<!-- app/views/production/puotation.html —— 生产报价单列表（创建/编辑/折让/状态切换/删除/子项）
  上下文：app.params.productionPuotation = {pid, status, address} -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>生产报价单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div style="padding:10px 15px;"><button type="button" class="layui-btn layui-btn-normal" id="btnCreate"><i class="layui-icon layui-icon-add-1"></i>创建报价单</button> <button type="button" class="layui-btn layui-btn-primary" id="btnBack">返回</button></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="add">添加子项</button>
        <button class="layui-btn layui-btn-xs" lay-event="item">子项</button>
        <button class="layui-btn layui-btn-xs" lay-event="discount">折让</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button>
        <button class="layui-btn layui-btn-xs" lay-event="status">切换状态</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="edit">编辑</button>
    </script>

    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="qid">
        <div class="layui-form-item"><label class="layui-form-label">名称<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="name" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-block"><input type="text" name="comment" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveEdit">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelEdit">取消</button></div>
    </form></div>

    <div id="discountBox" style="display:none; padding:20px;"><form class="layui-form" id="discountForm">
        <input type="hidden" name="qid">
        <div class="layui-form-item"><label class="layui-form-label">折让<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="discount" class="layui-input v_discount" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">总价<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="total" class="layui-input v_float" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveDis">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelDis">取消</button></div>
    </form></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/production/puotation.js"></script>
</body></html>
