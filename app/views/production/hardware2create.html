<!DOCTYPE html>
<!-- app/views/production/hardware2create.html —— 生产单下的五金单列表（创建/编辑/图表/五金项/入库/完结）
  上下文：app.params.productionHardware = {pid, status} -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>五金单管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div style="padding:10px 15px;"><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>创建五金单</button> <button type="button" class="layui-btn layui-btn-primary" id="btnBack">返回</button></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs" lay-event="item">五金项</button>
        <button class="layui-btn layui-btn-xs" lay-event="instore">入库</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="finish">完结</button>
    </script>

    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="hid">
        <div class="layui-form-item" id="rowStatus"><label class="layui-form-label">状态<span class="app-req">*</span></label><div class="layui-input-block"><select name="status"><option value="1">采购</option><option value="2">入库</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工期<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="timeLimit" placeholder="工期(天)" class="layui-input v_number" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-block"><input type="text" name="comment" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/production/hardware2create.js"></script>
</body></html>
