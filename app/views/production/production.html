<!DOCTYPE html>
<!-- app/views/production/production.html —— 生产单（主页：分页列表 + 添加/售后单 + 状态流转 + 更新/高级更新 + 跳转子页）
  状态：0初始/1设计/2生产/3仓库/4物流/5运输/6安装/7完成/8售后/9完结/10废单 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>生产单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">生产单号</label><div class="layui-input-inline"><input type="text" name="pno" data-op="cn" placeholder="生产单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input type="text" name="orderId" data-op="cn" placeholder="装修单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button><button type="button" class="layui-btn layui-btn-warm" id="btnUphold">创建售后单</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>

    <div id="addBox" style="display:none; padding:20px;"><form class="layui-form" id="addForm">
        <div class="layui-form-item"><label class="layui-form-label">装修单号<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="orderId" placeholder="装修单号" class="layui-input v_required" lay-verify="required"></div><div class="layui-input-inline" style="width:auto;"><button type="button" class="layui-btn layui-btn-primary" id="btnLoadOrder">读取</button></div></div>
        <div class="layui-form-item"><label class="layui-form-label">楼盘地址</label><div class="layui-input-block"><input type="text" name="orderAddr" class="layui-input" readonly></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品牌<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="brand" placeholder="品牌(拼音首字母)" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品类</label><div class="layui-input-block"><input type="text" name="category" class="layui-input" readonly></div></div>
        <div class="layui-form-item"><label class="layui-form-label">总额<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="total" placeholder="总额" class="layui-input v_float" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">设计师<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="designer" placeholder="设计师(拼音)" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">销售员<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="salesman" placeholder="销售员(拼音)" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">拆单员</label><div class="layui-input-block"><input type="text" name="spliter" placeholder="拆单员(拼音)" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工期<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="timeLimit" placeholder="工期(天)" class="layui-input v_number" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelAdd">取消</button></div>
    </form></div>

    <div id="upholdBox" style="display:none; padding:20px;"><form class="layui-form" id="upholdForm">
        <div class="layui-form-item"><label class="layui-form-label">父级生产单号<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="spid" placeholder="父级生产单号" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品牌<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="mbrand" placeholder="品牌(拼音首字母)" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">品类</label><div class="layui-input-block"><input type="text" name="mcategory" class="layui-input" readonly></div></div>
        <div class="layui-form-item"><label class="layui-form-label">设计师<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="upholdDesigner" placeholder="设计师(拼音)" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">销售员<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="upholdSalesman" placeholder="销售员(拼音)" class="layui-input v_required" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">拆单员</label><div class="layui-input-block"><input type="text" name="upholdSpliter" placeholder="拆单员(拼音)" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">总额<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="upholdTotal" placeholder="总额" class="layui-input v_float" lay-verify="required"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工期<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="upholdTimeLimit" placeholder="工期(天)" class="layui-input v_number" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveUphold">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelUphold">取消</button></div>
    </form></div>

    <div id="updateBox" style="display:none; padding:20px;"><form class="layui-form" id="updateForm">
        <div class="layui-form-item"><label class="layui-form-label">设计师</label><div class="layui-input-block"><input type="text" name="uDesigner" placeholder="设计师(拼音)" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">销售员</label><div class="layui-input-block"><input type="text" name="uSalesman" placeholder="销售员(拼音)" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">拆单员</label><div class="layui-input-block"><input type="text" name="uSpliter" placeholder="拆单员(拼音)" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">工期</label><div class="layui-input-inline"><input type="text" name="uTimeLimit" placeholder="工期(天)" class="layui-input v_number"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSaveUpdate">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancelUpdate">取消</button></div>
    </form></div>

    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="design">设计</button>
        <button class="layui-btn layui-btn-xs" lay-event="split">拆单</button>
        <button class="layui-btn layui-btn-xs" lay-event="instore">入库</button>
        <button class="layui-btn layui-btn-xs" lay-event="logistics">物流</button>
        <button class="layui-btn layui-btn-xs" lay-event="finish">完结</button>
        <button class="layui-btn layui-btn-xs" lay-event="after">售后</button>
        <button class="layui-btn layui-btn-xs" lay-event="abandon">废单</button>
        <button class="layui-btn layui-btn-xs" lay-event="update">更新</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="advUpdate">高级更新</button>
        <button class="layui-btn layui-btn-xs" lay-event="bind">绑定</button>
        <button class="layui-btn layui-btn-xs" lay-event="quote">报价</button>
        <button class="layui-btn layui-btn-xs" lay-event="picture">图纸</button>
        <button class="layui-btn layui-btn-xs" lay-event="out">外协</button>
        <button class="layui-btn layui-btn-xs" lay-event="hard">五金</button>
        <button class="layui-btn layui-btn-xs" lay-event="plan">计划</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="view">查看</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/production/production.js"></script>
</body></html>
