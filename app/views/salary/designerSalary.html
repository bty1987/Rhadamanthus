<!DOCTYPE html>
<!-- app/views/salary/designerSalary.html —— 设计师工费（列表 + 添加/修改 + 通过/驳回/删除）
  字段：dsid duser(设计师) salary(金额) cuser(创建人) createTime auser(审批人) approveTime status -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>设计师工费</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input type="text" name="userId" data-op="eq" placeholder="userId" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">通过</option><option value="2">驳回</option><option value="3">撤销</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">创建时间</label><div class="layui-input-inline"><input type="text" name="createTime" id="createTime" data-op="between" placeholder="创建时间" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">审批时间</label><div class="layui-input-inline"><input type="text" name="approveTime" id="approveTime" data-op="between" placeholder="审批时间" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>创建</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="uid">
        <div class="layui-form-item"><label class="layui-form-label">设计师<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" id="designersalaryuser" placeholder="姓名/工号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">金额<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="salary" placeholder="金额" class="layui-input v_float" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <div id="updateBox" style="display:none; padding:20px;"><form class="layui-form" id="updateForm">
        <input type="hidden" name="dsid">
        <div class="layui-form-item"><label class="layui-form-label">设计师</label><div class="layui-input-block"><input type="text" name="userShow" readonly class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">金额<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" name="salary" placeholder="金额" class="layui-input v_float" lay-verify="required"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnUpdate">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnUpdateCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="adopt">通过</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refuse">驳回</button><button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">修改</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script>
<script src="../../js/salary/designerSalary.js"></script>
</body></html>
