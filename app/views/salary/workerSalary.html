<!DOCTYPE html>
<!-- app/views/salary/workerSalary.html —— 工人工费（列表 + 创建/导入/批量通过/批量通知/按时间通过 + 通过/驳回/撤销/通知/备注/图片/质检）
  字段：wsid decoration(装修单) user(工人) cnid(施工节点) type(类型) onetype twotype
       money(操作金额) salary(工费) deposit(质保金) count status isSend isCheck isPlan
  pagetype=checker 时为质检模式（仅质检按钮） -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>工人工费</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input type="text" name="orderId" data-op="eq" placeholder="装修单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">工人</label><div class="layui-input-inline"><input type="text" name="userId" data-op="eq" placeholder="userId" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">工种</label><div class="layui-input-inline"><input type="text" name="duty" data-op="eq" placeholder="工种" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">通过</option><option value="2">驳回</option><option value="3">撤销</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">二类</label><div class="layui-input-inline"><select name="twotype" data-op="eq"><option value="">全部</option><option value="1">工费</option><option value="2">增项</option><option value="3">油工一级奖励</option><option value="4">维修款</option><option value="5">罚款</option><option value="10">附加项</option><option value="11">预支工费</option><option value="12">运费</option><option value="13">上楼费</option><option value="14">工人维修款</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">质检状态</label><div class="layui-input-inline"><select name="isCheck" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">确认</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div>
    <div class="layui-form-item">
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>创建</button></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnAdopt"><i class="layui-icon layui-icon-ok"></i>批量通过</button></div>
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-warm" id="btnBatchSend"><i class="layui-icon layui-icon-email"></i>批量通知</button></div>
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-disabled" id="btnBatchAdopt"><i class="layui-icon layui-icon-time"></i>按时间通过</button></div>
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-danger" id="btnImport"><i class="layui-icon layui-icon-upload"></i>导入</button></div>
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-primary" id="btnExport"><i class="layui-icon layui-icon-download-circle"></i>导出</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>

    <!-- 创建工费 -->
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="userId">
        <div class="layui-form-item"><label class="layui-form-label">工人<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" id="workersalaryuser" placeholder="姓名/工号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">二类<span class="app-req">*</span></label><div class="layui-input-inline"><select name="subtype" id="workersalarySubtype"><option value="">请选择</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">操作金额<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="money" placeholder="金额" class="layui-input v_float" lay-verify="required"></div>
            <label class="layui-form-label">备注</label><div class="layui-input-inline"><input type="text" name="comment" placeholder="备注" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>

    <!-- 批量通知 -->
    <div id="batchSendBox" style="display:none; padding:20px;"><form class="layui-form" id="batchSendForm">
        <div class="layui-form-item"><label class="layui-form-label">开始时间<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="beginTime" id="batchSendBegin" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">结束时间<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="finishTime" id="batchSendFinish" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnBatchSendGo">发送</button><button type="reset" class="layui-btn layui-btn-primary" id="btnBatchSendCancel">取消</button></div>
    </form></div>

    <!-- 按时间通过 -->
    <div id="batchAdoptBox" style="display:none; padding:20px;"><form class="layui-form" id="batchAdoptForm">
        <div class="layui-form-item"><label class="layui-form-label">开始时间<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="adoptBeginTime" id="batchAdoptBegin" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">结束时间<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="adoptFinishTime" id="batchAdoptFinish" placeholder="yyyy-MM-dd" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnBatchAdoptGo">通过</button><button type="reset" class="layui-btn layui-btn-primary" id="btnBatchAdoptCancel">取消</button></div>
    </form></div>

    <!-- 导入 -->
    <div id="importBox" style="display:none; padding:20px;"><form class="layui-form" id="importForm">
        <div class="layui-form-item"><label class="layui-form-label">Excel文件</label><div class="layui-input-block"><button type="button" class="layui-btn" id="btnImportUpload"><i class="layui-icon layui-icon-upload"></i>选择文件</button><span id="importFileTip" style="margin-left:10px;color:#999;">支持 .xls .xlsx</span></div></div>
    </form></div>

    <!-- 备注 -->
    <div id="annotateBox" style="display:none; padding:20px;"><form class="layui-form" id="annotateForm">
        <input type="hidden" name="wsid">
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea name="annotate" placeholder="工费备注" class="layui-textarea"></textarea></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnAnnotateSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnAnnotateCancel">取消</button></div>
    </form></div>

    <!-- 图片管理 -->
    <div id="drawingBox" style="display:none; padding:20px;">
        <div class="layui-form-item">
            <div class="layui-inline"><button type="button" class="layui-btn" id="btnDrawingUpload"><i class="layui-icon layui-icon-upload"></i>上传图片</button></div>
            <div class="layui-inline"><span style="color:#999;">支持 jpg/png/gif</span></div>
        </div>
        <ul id="workerDrawing" class="layui-row layui-col-space10" style="list-style:none;padding:0;"></ul>
    </div>

    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="adopt">通过</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refuse">驳回</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="cancel">撤销</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="send">发送通知</button>
        <button class="layui-btn layui-btn-xs layui-btn-disabled" lay-event="cancelSend">取消通知</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="annotate">备注</button>
        <button class="layui-btn layui-btn-xs" lay-event="drawing">图片</button>
        <button class="layui-btn layui-btn-xs layui-btn-disabled" lay-event="check">质检</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/upload.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/salary/workerSalary.js"></script>
</body></html>
