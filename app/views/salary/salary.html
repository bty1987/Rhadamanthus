<!DOCTYPE html>
<!-- app/views/salary/salary.html —— 薪资管理（列表 + 添加 + 通过/拒绝/撤销）
  字段：sid user(归属人) type(类型) onetype(一类) twotype(二类) thrtype(三类) money(操作金额) comment(说明)
       status(状态) createTime operateTime operater
  pagetype=belong 时按当前登录用户过滤，隐藏归属人/操作人列与操作按钮 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>薪资管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">归属人</label><div class="layui-input-inline"><input type="text" id="searchUser" name="userId" data-op="eq" placeholder="姓名/工号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">通过</option><option value="2">驳回</option><option value="3">撤销</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">创建时间</label><div class="layui-input-inline"><input type="text" name="createTime" id="createTime" data-op="between" placeholder="创建时间" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">操作时间</label><div class="layui-input-inline"><input type="text" name="operateTime" id="operateTime" data-op="between" placeholder="操作时间" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm">
        <input type="hidden" name="userId">
        <div class="layui-form-item"><label class="layui-form-label">归属人<span class="app-req">*</span></label><div class="layui-input-block"><input type="text" id="salaryuser" placeholder="姓名/工号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型<span class="app-req">*</span></label><div class="layui-input-inline"><select name="type" id="type1"><option value="">请选择</option></select></div>
            <label class="layui-form-label">二类</label><div class="layui-input-inline"><select name="onetype" id="type2"><option value="">请选择</option></select></div>
            <label class="layui-form-label">三类</label><div class="layui-input-inline"><select name="twotype" id="type3"><option value="">请选择</option></select></div>
            <label class="layui-form-label">四类</label><div class="layui-input-inline"><select name="thrtype" id="type4"><option value="">请选择</option></select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">操作金额<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="money" placeholder="金额" class="layui-input v_float" lay-verify="required"></div>
            <label class="layui-form-label">说明</label><div class="layui-input-inline"><input type="text" name="comment" placeholder="说明" class="layui-input"></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="pass">通过</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="reject">拒绝</button><button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="cancel">撤销</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script>
<script src="../../js/salary/salary.js"></script>
</body></html>
