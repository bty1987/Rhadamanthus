<!DOCTYPE html>
<!-- app/views/decoration/decorationBalance.html —— 装修单内决（pageDecorationForBalance，编辑结算金额） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>装修单内决</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="decoration.orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼盘</label><div class="layui-input-inline"><input name="decoration.village.no" data-op="eq" class="layui-input" placeholder="楼盘编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼号</label><div class="layui-input-inline"><input name="decoration.house.houseNumber" data-op="cn" class="layui-input" placeholder="楼号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input name="decoration.designer.userId" data-op="eq" class="layui-input" placeholder="设计师编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">业务员</label><div class="layui-input-inline"><input name="decoration.salesman.userId" data-op="eq" class="layui-input" placeholder="业务员编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">订单状态</label><div class="layui-input-inline"><select name="decoration.status" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">定金</option><option value="2">预签</option><option value="3">签约</option><option value="4">重签</option><option value="5">废单</option><option value="6">终止</option><option value="7">决算</option><option value="8">完工</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">内决状态</label><div class="layui-input-inline"><select name="decoration.balanceStatus" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">内决</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">内决时间</label><div class="layui-input-inline"><input name="decoration.balanceTime.range" data-op="between" id="balanceTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button></script>
    <div id="editBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="editForm">
            <div class="layui-form-item"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input class="layui-input" id="orderId" disabled></div></div>
            <div class="layui-form-item"><label class="layui-form-label">结算金额</label><div class="layui-input-inline"><input class="layui-input" id="balance" placeholder="结算金额"></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/decoration/decoration-common.js"></script><script src="../../js/decoration/decorationBalance.js"></script>
</body></html>
