<!DOCTYPE html>
<!-- app/views/decoration/decorationBackVisit.html —— 装修单回访（时间线列表 + 添加回访/提醒人员）
  上下文：app.params.decoration = { orderId }，app.params.historyPage 为返回页。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>装修单回访</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px 0;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div class="app-table" style="padding:10px 15px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div class="app-page" id="editBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="editForm">
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">内容</label>
                <div class="layui-input-block"><textarea name="content" id="content" maxlength="128" lay-verify="required" placeholder="请输入回访内容" class="layui-textarea"></textarea></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">提醒人员</label>
                <div class="layui-input-block"><select name="receivers" id="receivers" multiple lay-filter="receivers" lay-search=""><option value="">请选择提醒人员</option></select></div>
            </div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/decoration/decoration-common.js"></script><script src="../../js/decoration/decorationBackVisit.js"></script>
</body></html>
