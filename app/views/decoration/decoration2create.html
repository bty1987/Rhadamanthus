<!DOCTYPE html>
<!-- app/views/decoration/decoration2create.html —— 创建装修单（弹窗子页：客户/房产/订单三段录入）
  上下文：app.params.urlLoadParams.maketype=advance（多单）/ entrytype=country（国补）。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>创建装修单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page" style="padding:15px;max-width:860px;margin:0 auto;">
    <fieldset class="layui-elem-field"><legend class="layui-field-box" style="font-weight:bold;">客户信息</legend><div class="layui-field-box">
        <form class="layui-form">
            <div class="layui-inline"><label class="layui-form-label">客户</label><div class="layui-input-inline" style="width:240px;"><select id="customerId" lay-search=""><option value="">请选择客户（可搜索）</option></select></div></div>
            <button type="button" class="layui-btn layui-btn-sm" id="btnCreateCustomer">新建客户</button>
        </form>
    </div></fieldset>

    <fieldset class="layui-elem-field"><legend class="layui-field-box" style="font-weight:bold;">房产信息</legend><div class="layui-field-box">
        <form class="layui-form">
            <div class="layui-inline"><label class="layui-form-label">楼盘</label><div class="layui-input-inline" style="width:200px;"><select id="villageId" lay-search=""><option value="">请选择楼盘</option></select></div></div>
            <div class="layui-inline"><label class="layui-form-label">楼号</label><div class="layui-input-inline"><input class="layui-input" id="houseNumber" placeholder="楼号（失焦校验）"></div></div>
            <button type="button" class="layui-btn layui-btn-sm" id="btnCreateHouse">新建房产</button>
            <div class="layui-form-item" style="margin-top:8px;">
                <div class="layui-inline"><label class="layui-form-label">建筑面积</label><div class="layui-input-inline"><input class="layui-input" id="houseArea" disabled></div></div>
                <div class="layui-inline"><label class="layui-form-label">计价面积</label><div class="layui-input-inline"><input class="layui-input" id="houseInnerArea" disabled></div></div>
                <div class="layui-inline"><label class="layui-form-label">户型</label><div class="layui-input-inline"><input class="layui-input" id="apartmentType" disabled></div></div>
            </div>
        </form>
    </div></fieldset>

    <fieldset class="layui-elem-field"><legend class="layui-field-box" style="font-weight:bold;">订单信息</legend><div class="layui-field-box">
        <form class="layui-form" id="orderForm">
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">订单类型</label><div class="layui-input-inline"><select id="orderType"><option value="">请选择</option></select></div></div>
                <div class="layui-inline"><label class="layui-form-label">房屋现状</label><div class="layui-input-inline"><select id="houseType"><option value="期房">期房</option><option value="现房">现房</option></select></div></div>
                <div class="layui-inline"><label class="layui-form-label">房屋类型</label><div class="layui-input-inline"><select id="houseClass"><option value="平层">平层</option><option value="阁楼">阁楼</option><option value="地下室">地下室</option><option value="复式">复式</option><option value="别墅">别墅</option><option value="叠拼">叠拼</option></select></div></div>
                <div class="layui-inline"><label class="layui-form-label">订单等级</label><div class="layui-input-inline"><select id="orderGrade"><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></div></div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">业务类型</label><div class="layui-input-inline"><select id="busitype"><option value="">请选择</option></select></div></div>
                <div class="layui-inline"><label class="layui-form-label">客源</label><div class="layui-input-inline"><select id="status"><option value="0">咨询</option><option value="1">量房</option></select></div></div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline" style="width:180px;"><select id="designerId" lay-search=""><option value="">请选择设计师</option></select></div></div>
                <div class="layui-inline"><label class="layui-form-label">业务员</label><div class="layui-input-inline" style="width:180px;"><select id="salesmanId" lay-search=""><option value="">请选择业务员</option></select></div></div>
                <div class="layui-inline"><label class="layui-form-label">报价员</label><div class="layui-input-inline" style="width:180px;"><select id="quoterId" lay-search=""><option value="">请选择报价员</option></select></div></div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">方案设计</label><div class="layui-input-inline" style="width:180px;"><select id="escorterId" lay-search=""><option value="">请选择方案设计</option></select></div></div>
                <div class="layui-inline"><label class="layui-form-label">跟单员</label><div class="layui-input-inline" style="width:180px;"><select id="materialerId" lay-search=""><option value="">请选择跟单员</option></select></div></div>
                <div class="layui-inline"><label class="layui-form-label">非业务员比例</label><div class="layui-input-inline"><input class="layui-input" id="notSalesmanRate" value="0" placeholder="提点(0-1)或提成金额(>1)"></div></div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">非业务员名</label><div class="layui-input-inline"><input class="layui-input" id="notSalesmanName"></div></div>
                <div class="layui-inline"><label class="layui-form-label">非业务员电话</label><div class="layui-input-inline"><input class="layui-input" id="notSalesmanPhone"></div></div>
                <div class="layui-inline"><label class="layui-form-label">非业务员备注</label><div class="layui-input-inline"><input class="layui-input" id="notSalesmanContent"></div></div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">返单人员名</label><div class="layui-input-inline"><input class="layui-input" id="backOrderName"></div></div>
                <div class="layui-inline"><label class="layui-form-label">返单人员电话</label><div class="layui-input-inline"><input class="layui-input" id="backOrderPhone"></div></div>
                <div class="layui-inline"><label class="layui-form-label">返单人员备注</label><div class="layui-input-inline"><input class="layui-input" id="backOrderContent"></div></div>
            </div>
            <div class="layui-form-item" style="text-align:center;">
                <button type="button" class="layui-btn" id="btnSave"><i class="layui-icon layui-icon-ok"></i>保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
            </div>
        </form>
    </div></fieldset>

    <div id="customerBox" style="display:none;padding:20px 25px;">
        <form class="layui-form" id="customerForm">
            <div class="layui-form-item"><label class="layui-form-label">姓名</label><div class="layui-input-inline"><input class="layui-input" id="cName"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">性别</label><div class="layui-input-inline"><select id="cGender"><option value="0">男</option><option value="1">女</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">电话</label><div class="layui-input-inline"><input class="layui-input" id="cPhone" maxlength="11"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">身份证</label><div class="layui-input-inline"><input class="layui-input" id="cIdentity" maxlength="18"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">QQ</label><div class="layui-input-inline"><input class="layui-input" id="cQq"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">微信</label><div class="layui-input-inline"><input class="layui-input" id="cWechat"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">邮箱</label><div class="layui-input-inline"><input class="layui-input" id="cEmail"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">客户关系</label><div class="layui-input-inline"><select id="cRelationshipType"><option>普通客户</option><option>企业高端客户</option><option>企业关系客户</option><option>领导关系客户</option><option>员工关系</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">地址</label><div class="layui-input-inline" style="width:320px;"><input class="layui-input" id="cAddress"></div></div>
        </form>
    </div>

    <div id="houseBox" style="display:none;padding:20px 25px;">
        <form class="layui-form" id="houseForm">
            <div class="layui-form-item"><label class="layui-form-label">楼盘</label><div class="layui-input-inline" style="width:240px;"><select id="hVillage" lay-search=""><option value="">请选择楼盘</option></select></div></div>
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">期</label><div class="layui-input-inline" style="width:70px;"><input class="layui-input" id="hBuilt"></div></div>
                <div class="layui-inline"><label class="layui-form-label">单元</label><div class="layui-input-inline" style="width:70px;"><input class="layui-input" id="hUnit"></div></div>
                <div class="layui-inline"><label class="layui-form-label">楼层</label><div class="layui-input-inline" style="width:70px;"><input class="layui-input" id="hFloor"></div></div>
                <div class="layui-inline"><label class="layui-form-label">户</label><div class="layui-input-inline" style="width:70px;"><input class="layui-input" id="hDoor"></div></div>
            </div>
            <div class="layui-form-item"><label class="layui-form-label">楼号</label><div class="layui-input-inline"><input class="layui-input" id="hHouseNumber" placeholder="如期-单元-楼层-户"></div></div>
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">建筑面积</label><div class="layui-input-inline"><input class="layui-input" id="hBuildArea" value="0"></div></div>
                <div class="layui-inline"><label class="layui-form-label">最大层数</label><div class="layui-input-inline"><input class="layui-input" id="hMaxFloor"></div></div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline"><label class="layui-form-label">室</label><div class="layui-input-inline" style="width:70px;"><input class="layui-input" id="hRoom1"></div></div>
                <div class="layui-inline"><label class="layui-form-label">厅</label><div class="layui-input-inline" style="width:70px;"><input class="layui-input" id="hRoom2"></div></div>
                <div class="layui-inline"><label class="layui-form-label">厨</label><div class="layui-input-inline" style="width:70px;"><input class="layui-input" id="hRoom3"></div></div>
                <div class="layui-inline"><label class="layui-form-label">卫</label><div class="layui-input-inline" style="width:70px;"><input class="layui-input" id="hRoom4"></div></div>
            </div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/decoration/decoration-common.js"></script><script src="../../js/decoration/decoration2create.js"></script>
</body></html>
