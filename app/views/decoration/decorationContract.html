<!DOCTYPE html>
<!-- app/views/decoration/decorationContract.html —— 装修单合同（客户认证 + 合同生成/签署/归档/下载/通知）
  上下文：app.params.decoration = { orderId, cid }；app.params.urlLoadParams.showtype: advance|design。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>装修单合同</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="layui-row" style="padding:10px 15px 0;" id="infoArea">
        <div class="layui-col-md4"><div class="layui-card"><div class="layui-card-header">装修单</div><div class="layui-card-body" id="decorationInfo">-</div></div></div>
        <div class="layui-col-md4"><div class="layui-card"><div class="layui-card-header">客户信息</div><div class="layui-card-body" id="customerInfo">-</div></div></div>
        <div class="layui-col-md4"><div class="layui-card"><div class="layui-card-header">合同记录</div><div class="layui-card-body" id="contractRecordInfo">-</div></div></div>
    </div>
    <div class="app-toolbar" style="padding:10px 15px;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnCreate"><i class="layui-icon layui-icon-add-1"></i>创建合同</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnAuth"><i class="layui-icon layui-icon-vercode"></i>客户认证</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnConfirm"><i class="layui-icon layui-icon-ok"></i>确认客户</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnReset"><i class="layui-icon layui-icon-refresh"></i>重置认证</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnRecord"><i class="layui-icon layui-icon-date"></i>合同记录</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div class="app-table" style="padding:0 15px 15px;"><table id="resultTable" lay-filter="resultTable"></table></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="view">查看</button>
        {{# if(d.status == 5){ }}}<button class="layui-btn layui-btn-xs" lay-event="make">生成</button>{{# } }}
        {{# if(d.status == 1){ }}}<button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="filing">归档</button>{{# } }}
        {{# if((d.status == 3 || d.status == 4)){ }}}<button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="download">下载</button>{{# } }}
        {{# if(d.ishow == 0){ }}}<button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="hide">隐藏</button>{{# } }}
        {{# if(d.ishow == 1){ }}}<button class="layui-btn layui-btn-xs" lay-event="show">显示</button>{{# } }}
        {{# if(d.status == 0){ }}}<button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="signed">已签</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="expire">失效</button>{{# } }}
        {{# if(d.status == 0){ }}}<button class="layui-btn layui-btn-xs layui-btn-disabled" lay-event="csign">公司签</button>
        <button class="layui-btn layui-btn-xs layui-btn-disabled" lay-event="usign">客户签</button>
        <button class="layui-btn layui-btn-xs layui-btn-primary" lay-event="qrsign">二维签名</button>
        <button class="layui-btn layui-btn-xs layui-btn-primary" lay-event="qrusign">二维客签</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="notice1">签名通知</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="notice2">客签通知</button>{{# } }}
    </script>
    <div id="recordBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="recordForm">
            <div class="layui-form-item"><label class="layui-form-label">提交时间</label><div class="layui-input-inline"><input class="layui-input" id="recordCommitTime" placeholder="提交时间"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">开始时间</label><div class="layui-input-inline"><input class="layui-input" id="recordStartTime" placeholder="开始时间"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">结束时间</label><div class="layui-input-inline"><input class="layui-input" id="recordEndTime" placeholder="结束时间"></div></div>
            <div class="layui-form-item layui-form-text"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea id="recordComment" class="layui-textarea" maxlength="128"></textarea></div></div>
        </form>
    </div>
    <div id="qrBox" style="display:none;padding:20px;text-align:center;">
        <p style="word-break:break-all;margin-bottom:10px;" id="qrUrl"></p>
        <p style="color:#999;font-size:12px;">扫码打开签署页面</p>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/decoration/decoration-common.js"></script><script src="../../js/decoration/decorationContract.js"></script>
</body></html>
