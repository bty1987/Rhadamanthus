<!DOCTYPE html>
<!-- app/views/decoration/decoration.html —— 装修单主列表（pageConfig 驱动：按 depage 读功能权限决定查询接口/按钮/节点）
  url ?depage=general|salesman|designer|... → queryDecorationFunctionRightByName。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>装修单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="decoration.orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼盘</label><div class="layui-input-inline"><input name="decoration.village.no" data-op="eq" class="layui-input" placeholder="楼盘编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼号</label><div class="layui-input-inline"><input name="decoration.house.houseNumber" data-op="cn" class="layui-input" placeholder="楼号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input name="decoration.designer.userId" data-op="eq" class="layui-input" placeholder="设计师编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">业务员</label><div class="layui-input-inline"><input name="decoration.salesman.userId" data-op="eq" class="layui-input" placeholder="业务员编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">订单状态</label><div class="layui-input-inline"><select name="decoration.status" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">定金</option><option value="2">预签</option><option value="3">签约</option><option value="4">重签</option><option value="5">废单</option><option value="6">终止</option><option value="7">决算</option><option value="8">完工</option><option value="22">审批中</option><option value="23">审批中</option><option value="32">可终止</option><option value="33">可终止</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">签单类型</label><div class="layui-input-inline"><select name="decoration.orderType" data-op="eq"><option value="">全部</option><option value="0">半包</option><option value="1">整装</option><option value="2">满减</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">业务类型</label><div class="layui-input-inline"><select name="decoration.busitype.no" data-op="eq"><option value="">全部</option><option value="1">市场部客源</option><option value="2">电商信息流客源</option><option value="3">上门咨询客源</option><option value="4">设计返单客源</option><option value="5">工程返单客源</option><option value="6">电商新媒体客源</option><option value="7">400渠道客源</option><option value="8">其他渠道客源</option><option value="16">渠道中介客源</option><option value="25">主材厂商</option><option value="26">主材自媒体</option><option value="27">渠道芒果客源</option><option value="28">渠道房小二客源</option><option value="33">渠道售楼物业客源</option><option value="38">渠道小客源</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计状态</label><div class="layui-input-inline"><select name="decoration.designStatus" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">设计中</option><option value="2">已完成</option><option value="11">微改</option><option value="21">大改</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">确认状态</label><div class="layui-input-inline"><select name="decoration.sourceStatus" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">合同方案确认</option><option value="2">放线方案确认</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">保修状态</label><div class="layui-input-inline"><select name="decoration.repairStatus" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">终身</option><option value="2">转卖</option><option value="3">免责</option><option value="4">欠款</option><option value="5">过保</option><option value="6">2/5年</option><option value="7">无保</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">内决状态</label><div class="layui-input-inline"><select name="decoration.balanceStatus" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">内决</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">工程状态</label><div class="layui-input-inline"><select name="decoration.projectStatus" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">开工</option><option value="2">完工</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">创建时间</label><div class="layui-input-inline"><input name="decoration.createTime.range" data-op="between" id="createTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">量尺时间</label><div class="layui-input-inline"><input name="decoration.measureTime.range" data-op="between" id="measureTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">定金时间</label><div class="layui-input-inline"><input name="decoration.depositTime.range" data-op="between" id="depositTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">预签时间</label><div class="layui-input-inline"><input name="decoration.precontractTime.range" data-op="between" id="precontractTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><label class="layui-form-label">签单时间</label><div class="layui-input-inline"><input name="decoration.signTime.range" data-op="between" id="signTime" class="layui-input" placeholder="起始 - 结束" readonly></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-toolbar" style="padding:0 15px 10px;" id="toolArea">
        <button type="button" class="layui-btn layui-btn-sm" id="btnCreate" style="display:none;"><i class="layui-icon layui-icon-add-1"></i>创建</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnCreateAdvance" style="display:none;"><i class="layui-icon layui-icon-add-circle"></i>多单</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnCreateCountry" style="display:none;"><i class="layui-icon layui-icon-flag"></i>国补</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-disabled" id="btnExport" style="display:none;"><i class="layui-icon layui-icon-download-circle"></i>导出</button>
    </div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar"></script>

    <div id="signBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="signForm">
            <div class="layui-form-item"><label class="layui-form-label">签单公司</label><div class="layui-input-inline"><span id="signCompanyName" style="line-height:38px;"></span></div></div>
            <div class="layui-form-item"><label class="layui-form-label">券优惠</label><div class="layui-input-inline"><span id="signCoupon" style="line-height:38px;"></span></div></div>
            <div class="layui-form-item"><label class="layui-form-label">物品优惠</label><div class="layui-input-inline"><span id="signThing" style="line-height:38px;"></span></div></div>
            <div class="layui-form-item"><label class="layui-form-label">净业绩</label><div class="layui-input-inline"><input class="layui-input" id="signNetperfor" disabled></div></div>
            <div class="layui-form-item"><label class="layui-form-label">复合业绩</label><div class="layui-input-inline"><input class="layui-input" id="signComperfor" disabled></div></div>
        </form>
    </div>
    <div id="prosignBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="prosignForm">
            <div class="layui-form-item"><label class="layui-form-label">预签额</label><div class="layui-input-inline"><input class="layui-input" id="prosignPrice" placeholder="预签额"></div></div>
        </form>
    </div>
    <div id="terminalBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="terminalForm">
            <div class="layui-form-item"><label class="layui-form-label">订单状态</label><div class="layui-input-inline"><span id="terminalStatusText" style="line-height:38px;"></span></div></div>
            <div class="layui-form-item"><label class="layui-form-label">合同预付款</label><div class="layui-input-inline" style="width:300px;"><span id="advancePaymentText" style="line-height:38px;"></span></div></div>
            <div class="layui-form-item"><label class="layui-form-label">积分</label><div class="layui-input-inline"><span id="decorationActivityAmountText" style="line-height:38px;"></span></div></div>
            <div class="layui-form-item"><label class="layui-form-label">付款信息</label><div class="layui-input-inline" style="width:300px;"><div id="decorationPaymentInfoText" style="line-height:20px;padding-top:9px;"></div></div></div>
            <div class="layui-form-item"><label class="layui-form-label">预签额</label><div class="layui-input-inline"><input class="layui-input" id="terminalPrecontractPrice"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">终止金额</label><div class="layui-input-inline"><input class="layui-input" id="terminalBackup" value="0"></div></div>
        </form>
    </div>
    <div id="repairBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="repairForm">
            <div class="layui-form-item"><label class="layui-form-label">保修状态</label><div class="layui-input-inline"><select id="repairStatus"><option value="0">初始</option><option value="1">终身</option><option value="2">转卖</option><option value="3">免责</option><option value="4">欠款</option><option value="5">过保</option><option value="6">2/5年</option><option value="7">无保</option></select></div></div>
        </form>
    </div>
    <div id="terminalStatusBox" style="display:none;padding:20px 30px;">
        <form class="layui-form" id="terminalStatusForm">
            <div class="layui-form-item"><label class="layui-form-label">工程终止</label><div class="layui-input-inline"><select id="updateTerminalStatus"><option value="0">未终止</option><option value="1">已终止</option></select></div></div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/decoration/decoration-common.js"></script><script src="../../js/decoration/decoration.js"></script>
</body></html>
