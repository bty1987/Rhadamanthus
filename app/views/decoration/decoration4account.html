<!DOCTYPE html>
<!-- app/views/decoration/decoration4account.html —— 装修单决算向导（旧 ace_wizard → layui tab；决算计算/保存/生成/推送/打印）
  上下文：app.params.decoration = { orderId, typeness, status, viewNode }。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>装修单决算</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px 0;">
        <span style="font-size:16px;font-weight:bold;">决算：<span id="orderIdLabel">-</span></span>
        <button type="button" class="layui-btn layui-btn-sm" id="btnSave"><i class="layui-icon layui-icon-ok"></i>保存</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnMake"><i class="layui-icon layui-icon-template-1"></i>生成决算</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-warm" id="btnSend"><i class="layui-icon layui-icon-share"></i>推送客户</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-disabled" id="btnPrint"><i class="layui-icon layui-icon-print"></i>打印</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div class="layui-tab layui-tab-brief" style="margin:10px 15px;" lay-filter="accountTab">
        <ul class="layui-tab-title">
            <li class="layui-this">决算信息</li>
            <li>汇总数据</li>
            <li>主材/外销</li>
            <li>决算明细</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <form class="layui-form" id="accountForm">
                    <div class="layui-form-item">
                        <div class="layui-inline"><label class="layui-form-label">决算名称</label><div class="layui-input-inline"><input class="layui-input" id="name"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">决算类型</label><div class="layui-input-inline"><select id="typeness"><option value="0">半包</option><option value="1">整装</option><option value="2">半价</option><option value="3">满减</option><option value="4">减上捡</option><option value="5">达额减</option><option value="6">新满减</option><option value="7">局改</option><option value="8">全翻</option><option value="9">全案</option><option value="10">新达额减</option><option value="11">满额减</option><option value="12">新配减</option><option value="13">精装房</option><option value="14">新满减</option><option value="15">新惠减</option></select></div></div>
                        <div class="layui-inline"><label class="layui-form-label">增减配比</label><div class="layui-input-inline"><select id="arcal"><option value="0">计算配比</option><option value="1">不计算配比</option></select></div></div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline"><label class="layui-form-label">主材配比</label><div class="layui-input-inline"><input class="layui-input" id="matching"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">折扣</label><div class="layui-input-inline"><input class="layui-input" id="discount"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">折扣基数</label><div class="layui-input-inline"><input class="layui-input" id="discountBase"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">服务费比例</label><div class="layui-input-inline"><input class="layui-input" id="serviceRate"></div></div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline"><label class="layui-form-label">决算主材额</label><div class="layui-input-inline"><input class="layui-input" id="materialPrice"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">决算服务费</label><div class="layui-input-inline"><input class="layui-input" id="servicePrice"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">工程总额</label><div class="layui-input-inline"><input class="layui-input" id="projectPrice"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">工程基数</label><div class="layui-input-inline"><input class="layui-input" id="projectBase"></div></div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline"><label class="layui-form-label">实花配比</label><div class="layui-input-inline"><input class="layui-input" id="paidupMatching"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">差额</label><div class="layui-input-inline"><input class="layui-input" id="difference"></div></div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline"><label class="layui-form-label">优惠券</label><div class="layui-input-inline"><input class="layui-input" id="coupon"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">内部优惠券</label><div class="layui-input-inline"><input class="layui-input" id="internal"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">满送</label><div class="layui-input-inline"><input class="layui-input" id="fulldel"></div></div>
                        <div class="layui-inline"><label class="layui-form-label">返现</label><div class="layui-input-inline"><input class="layui-input" id="cashback"></div></div>
                    </div>
                    <div class="layui-form-item layui-form-text">
                        <label class="layui-form-label">备注</label><div class="layui-input-block" style="max-width:640px;"><textarea id="comment" class="layui-textarea" maxlength="128"></textarea></div>
                    </div>
                </form>
            </div>
            <div class="layui-tab-item">
                <table class="layui-table" id="sumTable" style="width:720px;"></table>
            </div>
            <div class="layui-tab-item">
                <b>销售单</b><table id="matSalesTable" lay-filter="matSalesTable"></table>
                <b style="display:block;margin-top:12px;">外销单</b><table id="oalesTable" lay-filter="oalesTable"></table>
            </div>
            <div class="layui-tab-item">
                <table id="itemTable" lay-filter="itemTable"></table>
            </div>
        </div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/decoration/decoration-common.js"></script><script src="../../js/decoration/decoration4account.js"></script>
</body></html>
