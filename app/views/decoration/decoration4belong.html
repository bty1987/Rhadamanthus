<!DOCTYPE html>
<!-- app/views/decoration/decoration4belong.html —— 装修单归属（pageDecorationForBelong；操作：查看/设计归属/业务归属） -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>装修单归属</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input name="decoration.orderId" data-op="eq" class="layui-input" placeholder="装修单号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼盘</label><div class="layui-input-inline"><input name="decoration.village.no" data-op="eq" class="layui-input" placeholder="楼盘编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">楼号</label><div class="layui-input-inline"><input name="decoration.house.houseNumber" data-op="cn" class="layui-input" placeholder="楼号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">面积</label><div class="layui-input-inline"><input name="decoration.houseArea" data-op="eq" class="layui-input" placeholder="面积"></div></div>
        <div class="layui-inline"><label class="layui-form-label">设计师</label><div class="layui-input-inline"><input name="decoration.designer.userId" data-op="eq" class="layui-input" placeholder="设计师编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">业务员</label><div class="layui-input-inline"><input name="decoration.salesman.userId" data-op="eq" class="layui-input" placeholder="业务员编号"></div></div>
        <div class="layui-inline"><label class="layui-form-label">订单类型</label><div class="layui-input-inline"><select name="decoration.orderType" data-op="eq"><option value="">全部</option><option value="0">半包</option><option value="1">整装</option><option value="2">满减</option></select></div></div>
        <div class="layui-inline"><label class="layui-form-label">业务类型</label><div class="layui-input-inline"><select name="decoration.busitype.no" data-op="eq"><option value="">全部</option><option value="1">市场部客源</option><option value="2">电商信息流客源</option><option value="3">上门咨询客源</option><option value="4">设计返单客源</option><option value="5">工程返单客源</option><option value="6">电商新媒体客源</option><option value="7">400渠道客源</option><option value="8">其他渠道客源</option><option value="16">渠道中介客源</option><option value="25">主材厂商</option><option value="26">主材自媒体</option><option value="27">渠道芒果客源</option><option value="28">渠道房小二客源</option><option value="33">渠道售楼物业客源</option><option value="38">渠道小客源</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="look">查看</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="design">设计</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="salesman">业务</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/decoration/decoration-common.js"></script><script src="../../js/decoration/decoration4belong.js"></script>
</body></html>
