<!DOCTYPE html>
<!-- app/views/decoration/decoration4timeline.html —— 装修单信息轴（基本信息 + 效果图/放线图 + 款项 + 施工节点工人/图片）
  上下文：app.params.decoration = { orderId 或 decorationOrderId }。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>装修单信息轴</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body><div class="app-page">
    <div class="app-toolbar" style="padding:10px 15px 0;">
        <span style="font-size:16px;font-weight:bold;">装修单进程：<span id="oid">-</span></span>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnBack" style="margin-left:15px;"><i class="layui-icon layui-icon-return"></i>返回</button>
    </div>
    <div class="layui-tab layui-tab-brief" style="margin:10px 15px;" lay-filter="mainTab">
        <ul class="layui-tab-title">
            <li class="layui-this">基本信息</li>
            <li>图纸</li>
            <li>款项信息</li>
            <li>施工进程</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <table class="layui-table" id="baseTable"></table>
            </div>
            <div class="layui-tab-item">
                <p style="font-weight:bold;">效果图（合同方案）</p><div id="effectPics" class="app-piclist"></div>
                <p style="font-weight:bold;">放线图（放线方案）</p><div id="projectPics" class="app-piclist"></div>
            </div>
            <div class="layui-tab-item">
                <table id="paymentTable" lay-filter="paymentTable"></table>
            </div>
            <div class="layui-tab-item" id="constructionArea"></div>
        </div>
    </div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/decoration/decoration-common.js"></script><script src="../../js/decoration/decoration4timeline.js"></script>
</body></html>
