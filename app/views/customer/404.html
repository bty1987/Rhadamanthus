<!DOCTYPE html>
<!-- app/views/customer/404.html —— 客服模块 404 页（原 WebContent/views/customer/404.html） -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>404 - 页面不存在</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page" style="text-align:center;padding-top:120px;">
    <i class="layui-icon layui-icon-404" style="font-size:120px;color:#FF5722;"></i>
    <h2 style="margin:20px 0 10px;">404</h2>
    <p style="color:#666;">抱歉，您访问的页面不存在或已被移除。</p>
    <button type="button" class="layui-btn" onclick="if(window.parent&&window.parent!==window){try{window.parent.history.back();}catch(e){history.back();}}else{history.back();}">返回上一页</button>
</div>
</body>
</html>
