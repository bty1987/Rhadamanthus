<!DOCTYPE html>
<!-- app/views/customer/customerOrigine.html —— 客源（页面配置驱动：编辑/绑定/初审/审批/直接转单/释放/二维码/确认/撤销/记录/归属/认领）
     urlLoadParams.depage 决定 queryCustomerFunctionRight 配置名（页面按钮/列/条件） -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>客源</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page" id="customerOriginePage">

    <div class="app-search">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">客源电话</label>
                    <div class="layui-input-inline">
                        <input type="text" name="phone" data-op="eq" placeholder="客源电话" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline">
                        <select name="status" data-op="eq">
                            <option value="">全部</option>
                            <option value="0">初始</option>
                            <option value="1">初审</option>
                            <option value="2">提交</option>
                            <option value="3">确认</option>
                            <option value="4">审批</option>
                            <option value="5">绑定</option>
                            <option value="6">驳回</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">创建时间</label>
                    <div class="layui-input-inline" style="width:220px;">
                        <input type="text" name="createTime" id="createTime" placeholder="创建时间范围" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                    <button type="button" class="layui-btn layui-btn-normal" id="btnCreate" style="display:none;"><i class="layui-icon layui-icon-add-1"></i>创建</button>
                </div>
            </div>
        </form>
    </div>

    <div class="app-table">
        <table id="resultTable" lay-filter="resultTable"></table>
    </div>

    <div id="pagenation" class="app-pagenation"></div>

    <!-- 创建/编辑客源 -->
    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="editForm" id="editForm">
            <div class="layui-form-item">
                <label class="layui-form-label">姓名<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:120px;">
                    <input type="text" name="name" placeholder="姓名" class="layui-input v_required">
                </div>
                <label class="layui-form-label">性别</label>
                <div class="layui-input-inline" style="width:80px;">
                    <select name="gender">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <label class="layui-form-label">电话</label>
                <div class="layui-input-inline" style="width:130px;">
                    <input type="text" name="phone" placeholder="电话" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">楼盘<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:190px;">
                    <input type="text" name="villageName" id="villageName" placeholder="输入拼音检索楼盘" class="layui-input v_required">
                </div>
                <div class="layui-input-inline" id="villageList" style="line-height:38px;"></div>
                <div class="edit-house-number">
                    <label class="layui-form-label">楼号</label>
                    <div class="layui-input-inline" style="width:120px;">
                        <input type="text" name="houseNumber" placeholder="楼号" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">建筑面积<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:110px;">
                    <input type="text" name="buildArea" placeholder="建筑面积" class="layui-input v_required v_float_3">
                </div>
                <label class="layui-form-label">意向</label>
                <div class="layui-input-inline" style="width:100px;">
                    <select name="intention">
                        <option value="0">到店</option>
                        <option value="1">量房</option>
                        <option value="2">守园</option>
                    </select>
                </div>
                <label class="layui-form-label">需求价格</label>
                <div class="layui-input-inline" style="width:110px;">
                    <input type="text" name="price" placeholder="需求价格" class="layui-input v_float_3">
                </div>
            </div>
            <div class="layui-form-item create-only">
                <label class="layui-form-label">设计师</label>
                <div class="layui-input-inline" style="width:150px;">
                    <input type="text" name="designerName" id="designerName" placeholder="点击选择设计师" class="layui-input" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnPickDesigner">选择</button>
                </div>
                <label class="layui-form-label">业务员</label>
                <div class="layui-input-inline" style="width:150px;">
                    <input type="text" name="salesmanName" id="salesmanName" placeholder="点击选择业务员" class="layui-input" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnPickSalesman">选择</button>
                </div>
            </div>
            <div class="layui-form-item create-only">
                <label class="layui-form-label">业务类型</label>
                <div class="layui-input-inline" style="width:150px;">
                    <select name="decorationBusitype"></select>
                </div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="comment" placeholder="请输入备注" class="layui-textarea"></textarea>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 绑定相关信息 -->
    <div id="bindBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="bindForm" id="bindForm">
            <div class="layui-form-item">
                <label class="layui-form-label">设计师</label>
                <div class="layui-input-inline" style="width:150px;">
                    <input type="text" name="designerName" id="bindDesignerName" placeholder="点击选择设计师" class="layui-input" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnBindPickDesigner">选择</button>
                </div>
                <label class="layui-form-label">业务员</label>
                <div class="layui-input-inline" style="width:150px;">
                    <input type="text" name="salesmanName" id="bindSalesmanName" placeholder="点击选择业务员" class="layui-input" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnBindPickSalesman">选择</button>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">业务类型</label>
                <div class="layui-input-inline" style="width:150px;">
                    <select name="decorationBusitype"></select>
                </div>
                <label class="layui-form-label">楼盘</label>
                <div class="layui-input-inline" style="width:190px;">
                    <input type="text" name="villageName" id="bindVillageName" placeholder="楼盘" class="layui-input" readonly>
                </div>
                <label class="layui-form-label">楼号</label>
                <div class="layui-input-inline" style="width:110px;">
                    <input type="text" name="houseNumber" placeholder="楼号" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">姓名</label>
                <div class="layui-input-inline" style="width:110px;">
                    <input type="text" name="name" placeholder="姓名" class="layui-input">
                </div>
                <label class="layui-form-label">电话</label>
                <div class="layui-input-inline" style="width:130px;">
                    <input type="text" name="phone" placeholder="电话" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnBindSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnBindCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 归属 -->
    <div id="belongerBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="belongerForm" id="belongerForm">
            <div class="layui-form-item">
                <label class="layui-form-label">归属人<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:180px;">
                    <input type="text" name="belongerName" id="origineBelongerName" placeholder="点击选择归属人" class="layui-input v_required" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnOriginePickBelonger">选择</button>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnBelongerSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnBelongerCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 直接转单 -->
    <div id="directTranBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="directTranForm" id="directTranForm">
            <div class="layui-form-item">
                <label class="layui-form-label">楼盘</label>
                <div class="layui-input-inline" style="width:180px;">
                    <input type="text" name="villageName" id="dtVillageName" placeholder="楼盘" class="layui-input" readonly>
                </div>
                <label class="layui-form-label">楼号</label>
                <div class="layui-input-inline" style="width:100px;">
                    <input type="text" name="houseNumber" placeholder="楼号" class="layui-input">
                </div>
                <label class="layui-form-label">姓名</label>
                <div class="layui-input-inline" style="width:90px;">
                    <input type="text" name="name" placeholder="姓名" class="layui-input">
                </div>
                <label class="layui-form-label">电话</label>
                <div class="layui-input-inline" style="width:120px;">
                    <input type="text" name="phone" placeholder="电话" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">业务员<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:150px;">
                    <input type="text" name="salesmanName" id="dtSalesmanName" placeholder="点击选择业务员" class="layui-input v_required" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnDtPickSalesman">选择</button>
                </div>
                <label class="layui-form-label">业务类型</label>
                <div class="layui-input-inline" style="width:140px;">
                    <select name="decorationBusitype"></select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">订单类型<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:130px;">
                    <select name="orderType" lay-verify="required">
                        <option value="0">半包</option><option value="1">整装</option><option value="2">半价</option>
                        <option value="3">满减</option><option value="4">减上捡</option><option value="5">达额减</option>
                        <option value="6">新满减</option><option value="7">局改</option><option value="8">全翻</option>
                        <option value="9">全案</option><option value="10">新达额减</option><option value="11">满额减</option>
                        <option value="12">新配减</option><option value="13">精装房</option><option value="14">新满减</option>
                        <option value="15">新惠减</option>
                    </select>
                </div>
                <label class="layui-form-label">房屋类型</label>
                <div class="layui-input-inline" style="width:100px;">
                    <select name="houseType">
                        <option value="期房">期房</option>
                        <option value="现房">现房</option>
                    </select>
                </div>
                <label class="layui-form-label">房型</label>
                <div class="layui-input-inline" style="width:100px;">
                    <select name="houseClass">
                        <option value="平层">平层</option><option value="阁楼">阁楼</option>
                        <option value="地下室">地下室</option><option value="复式">复式</option>
                        <option value="别墅">别墅</option><option value="叠拼">叠拼</option>
                    </select>
                </div>
                <label class="layui-form-label">来源类型</label>
                <div class="layui-input-inline" style="width:90px;">
                    <select name="resourceType">
                        <option value="0">咨询</option>
                        <option value="1">量房</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnDtSave">转单</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnDtCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 二维码 -->
    <div id="codeBox" style="display:none; padding:20px; text-align:center;">
        <img id="codeImg" alt="客源二维码" style="width:200px;height:200px;">
        <p style="color:#999;font-size:12px;">微信扫码进入客源登记页</p>
    </div>

</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/customer/customer-common.js"></script>
<script src="../../js/customer/customerOrigine.js"></script>
</body>
</html>
