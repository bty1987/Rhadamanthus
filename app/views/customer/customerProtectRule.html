<!DOCTYPE html>
<!-- app/views/customer/customerProtectRule.html —— 保护期规则（面积/预付/设计/定金/岗位） -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>保护期规则</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page" id="customerProtectRulePage">

    <div class="app-search">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">类型</label>
                    <div class="layui-input-inline">
                        <select name="type" data-op="eq">
                            <option value="">全部</option>
                            <option value="0">面积</option>
                            <option value="1">预付</option>
                            <option value="2">设计</option>
                            <option value="3">定金</option>
                            <option value="4">岗位</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">起始值</label>
                    <div class="layui-input-inline" style="width:120px;">
                        <input type="text" name="uppval" data-op="ge" placeholder="起始值" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">终止值</label>
                    <div class="layui-input-inline" style="width:120px;">
                        <input type="text" name="lowval" data-op="le" placeholder="终止值" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline">
                        <select name="status" data-op="eq">
                            <option value="">全部</option>
                            <option value="0">有效</option>
                            <option value="1">失效</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                    <button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
                </div>
            </div>
        </form>
    </div>

    <div class="app-table">
        <table id="resultTable" lay-filter="resultTable"></table>
    </div>

    <div id="pagenation" class="app-pagenation"></div>

    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="editForm" id="editForm">
            <div class="layui-form-item">
                <label class="layui-form-label">标题<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="title" placeholder="请输入标题" class="layui-input v_required">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">类型<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <select name="type" lay-filter="typeFilter" lay-verify="required">
                        <option value="0">面积</option>
                        <option value="1">预付</option>
                        <option value="2">设计</option>
                        <option value="3">定金</option>
                        <option value="4">岗位</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item" id="uppvalDiv">
                <label class="layui-form-label">起始值<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="uppval" placeholder="请输入起始值" class="layui-input v_required v_float_3">
                </div>
            </div>
            <div class="layui-form-item" id="lowvalDiv">
                <label class="layui-form-label">终止值<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="lowval" placeholder="请输入终止值" class="layui-input v_required v_float_3">
                </div>
            </div>
            <div class="layui-form-item" id="dutyDiv" style="display:none;">
                <label class="layui-form-label">岗位<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <select name="duty" id="dutySel"></select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">天数<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="days" placeholder="请输入天数" class="layui-input v_required v_number">
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
            </div>
        </form>
    </div>

</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/customer/customer-common.js"></script>
<script src="../../js/customer/customerProtectRule.js"></script>
</body>
</html>
