<!DOCTYPE html>
<!-- app/views/customer/droup.html —— 群组消息（钉钉/微信群绑定 + 对话查看器） -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>群组消息</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page" id="droupPage">

    <div class="app-search">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">装修单号</label>
                    <div class="layui-input-inline">
                        <input type="text" name="orderId" data-op="eq" placeholder="装修单号" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">客户名称</label>
                    <div class="layui-input-inline">
                        <input type="text" name="name" data-op="eq" placeholder="客户名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">类型</label>
                    <div class="layui-input-inline">
                        <select name="type" data-op="eq">
                            <option value="">全部</option>
                            <option value="1">钉钉</option>
                            <option value="2">微信</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline">
                        <select name="status" data-op="eq">
                            <option value="">全部</option>
                            <option value="0">有效</option>
                            <option value="1">无效</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">更新时间</label>
                    <div class="layui-input-inline" style="width:220px;">
                        <input type="text" name="updateTime" id="updateTime" placeholder="更新时间范围" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                    <button type="button" class="layui-btn layui-btn-normal" id="btnBind"><i class="layui-icon layui-icon-add-1"></i>绑定</button>
                </div>
            </div>
        </form>
    </div>

    <div class="app-table">
        <table id="resultTable" lay-filter="resultTable"></table>
    </div>

    <div id="pagenation" class="app-pagenation"></div>

    <!-- 绑定群 -->
    <div id="bindBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="bindForm" id="bindForm">
            <div class="layui-form-item">
                <label class="layui-form-label">装修单号<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="orderId" placeholder="装修单号" class="layui-input v_required">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">群名称<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="name" placeholder="群名称" class="layui-input v_required">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">群ID<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="chatId" placeholder="群ID" class="layui-input v_required">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">类型</label>
                <div class="layui-input-block">
                    <select name="type">
                        <option value="1">钉钉</option>
                        <option value="2">微信</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnBindSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnBindCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 添加人员 -->
    <div id="addUserBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="addUserForm" id="addUserForm">
            <div class="layui-form-item">
                <label class="layui-form-label">人员<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:190px;">
                    <input type="text" name="userName" id="userName" placeholder="点击选择人员" class="layui-input v_required" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnPickUser">选择</button>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnAddUserSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnAddUserCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 对话查看器 -->
    <div id="chatBox" style="display:none; padding:10px 15px;">
        <div style="margin-bottom:8px;">
            <label>内容：</label>
            <input type="text" id="chatContent" placeholder="消息内容" class="layui-input" style="width:160px;display:inline-block;">
            <label style="margin-left:8px;">发送时间：</label>
            <input type="text" id="chatTime" placeholder="发送时间" class="layui-input" style="width:140px;display:inline-block;" readonly>
            <button type="button" class="layui-btn layui-btn-sm" id="btnChatSearch">查询</button>
            <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnChatReset">重置</button>
            <button type="button" class="layui-btn layui-btn-sm" id="btnChatMore">加载更多</button>
        </div>
        <div id="chatList" style="overflow-y:auto;overflow-x:hidden;height:480px;border:1px solid #eee;border-radius:4px;padding:8px;"></div>
        <div style="margin-top:8px;">
            <input type="text" id="chatEnter" placeholder="请输入" class="layui-input" style="width:70%;display:inline-block;">
            <button type="button" class="layui-btn layui-btn-sm" id="btnChatSend">发送</button>
            <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnChatUpload"><i class="layui-icon layui-icon-upload-drag"></i>发图片</button>
        </div>
    </div>

</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/app/upload.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/customer/customer-common.js"></script>
<script src="../../js/customer/droup.js"></script>
</body>
</html>
