<!DOCTYPE html>
<!-- app/views/customer/customerUserRule.html —— 人员规则（量尺/签单/金额指标 + 接单状态机）
     urlLoadParams.depage: null=管理页 / dept=部门页 / fatherDept|company=分区页（只读） -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>人员规则</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page" id="customerUserRulePage">

    <div class="app-search">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">人员</label>
                    <div class="layui-input-inline" style="width:170px;">
                        <input type="text" name="user" id="userInput" placeholder="点击选择人员" class="layui-input" readonly>
                    </div>
                    <div class="layui-input-inline">
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnPickUser">选择</button>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline">
                        <select name="status" data-op="eq">
                            <option value="">全部</option>
                            <option value="0">启用</option>
                            <option value="1">停止(个人)</option>
                            <option value="2">停止(部门)</option>
                            <option value="3">停止(分区)</option>
                            <option value="4">失效</option>
                            <option value="5">停止(管理)</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">创建时间</label>
                    <div class="layui-input-inline" style="width:220px;">
                        <input type="text" name="createTime" id="createTime" placeholder="创建时间范围" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                    <button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
                    <button type="button" class="layui-btn layui-btn-danger" id="btnDisableAll">失效</button>
                </div>
            </div>
        </form>
    </div>

    <div class="app-table">
        <table id="resultTable" lay-filter="resultTable"></table>
    </div>

    <div id="pagenation" class="app-pagenation"></div>

    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="editForm" id="editForm">
            <div class="layui-form-item">
                <label class="layui-form-label">人员<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:190px;">
                    <input type="text" name="userName" id="userName" placeholder="点击选择人员" class="layui-input v_required" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnEditPickUser">选择</button>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">周期<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="period" placeholder="如 2026-08" class="layui-input v_required">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">量尺数</label>
                <div class="layui-input-inline"><input type="text" name="measureNum" placeholder="量尺数" class="layui-input v_number"></div>
                <label class="layui-form-label" style="width:70px;">签单数</label>
                <div class="layui-input-inline"><input type="text" name="contractNum" placeholder="签单数" class="layui-input v_number"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">签单额</label>
                <div class="layui-input-inline"><input type="text" name="contractPrice" placeholder="签单额" class="layui-input v_float_3"></div>
                <label class="layui-form-label" style="width:70px;">主材额</label>
                <div class="layui-input-inline"><input type="text" name="materialPrice" placeholder="主材额" class="layui-input v_float_3"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">设计费</label>
                <div class="layui-input-inline"><input type="text" name="designPrice" placeholder="设计费" class="layui-input v_float_3"></div>
                <label class="layui-form-label" style="width:70px;">折前额</label>
                <div class="layui-input-inline"><input type="text" name="predisPrice" placeholder="折前额" class="layui-input v_float_3"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">机会数</label>
                <div class="layui-input-inline"><input type="text" name="chance" placeholder="机会数" class="layui-input v_number"></div>
                <label class="layui-form-label" style="width:70px;">剩余数</label>
                <div class="layui-input-inline"><input type="text" name="surplus" placeholder="剩余数" class="layui-input v_number"></div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
            </div>
        </form>
    </div>

</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/customer/customer-common.js"></script>
<script src="../../js/customer/customerUserRule.js"></script>
</body>
</html>
