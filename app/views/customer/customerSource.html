<!DOCTYPE html>
<!-- app/views/customer/customerSource.html —— 客户来源（尺源管理：添加/更新/房产/分配/失效/机会/记录/画像）
     urlLoadParams.depage: null管理/user人员/dept部门/region分区 -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>客户来源</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page" id="customerSourcePage">

    <div class="app-search">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">客户名称</label>
                    <div class="layui-input-inline">
                        <input type="text" name="name" data-op="cn" placeholder="客户名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">电话</label>
                    <div class="layui-input-inline">
                        <input type="text" name="phone" data-op="eq" placeholder="电话" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">对接人</label>
                    <div class="layui-input-inline">
                        <input type="text" name="contact" data-op="eq" placeholder="对接人" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">来源方</label>
                    <div class="layui-input-inline">
                        <input type="text" name="source" data-op="eq" placeholder="来源方" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline">
                        <select name="status" data-op="eq">
                            <option value="">全部</option>
                            <option value="0">初始</option>
                            <option value="1">失效</option>
                            <option value="2">审批</option>
                            <option value="3">确认</option>
                            <option value="5">转换</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">客户类型</label>
                    <div class="layui-input-inline">
                        <select name="customerType" data-op="eq">
                            <option value="">全部</option>
                            <option value="0">到店</option>
                            <option value="1">量房</option>
                            <option value="2">守园</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">装修需求</label>
                    <div class="layui-input-inline">
                        <select name="demand" data-op="eq">
                            <option value="">全部</option>
                            <option value="0">基装</option>
                            <option value="1">整装</option>
                            <option value="2">局改装</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">创建时间</label>
                    <div class="layui-input-inline" style="width:220px;">
                        <input type="text" name="createTime" id="createTime" placeholder="创建时间范围" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                    <button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
                </div>
            </div>
        </form>
    </div>

    <div class="app-table">
        <table id="resultTable" lay-filter="resultTable"></table>
    </div>

    <div id="pagenation" class="app-pagenation"></div>

    <!-- 添加/更新客户来源 -->
    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="editForm" id="editForm">
            <div class="layui-form-item">
                <label class="layui-form-label">姓名<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:130px;">
                    <input type="text" name="name" placeholder="姓名" class="layui-input v_required">
                </div>
                <label class="layui-form-label">性别</label>
                <div class="layui-input-inline" style="width:90px;">
                    <select name="gender">
                        <option value="0">男</option>
                        <option value="1">女</option>
                    </select>
                </div>
                <div class="edit-phone-group">
                    <label class="layui-form-label">电话</label>
                    <div class="layui-input-inline" style="width:130px;">
                        <input type="text" name="phone" placeholder="电话" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">楼盘<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:190px;">
                    <input type="text" name="villageName" id="villageName" placeholder="输入拼音检索楼盘" class="layui-input v_required">
                </div>
                <div class="layui-input-inline" id="villageList" style="line-height:38px;"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">楼号</label>
                <div class="layui-input-inline" style="width:70px;"><input type="text" name="built" placeholder="楼" class="layui-input"></div>
                <div class="layui-input-inline" style="width:80px;"><select name="builtrule"></select></div>
                <div class="layui-input-inline" style="width:70px;"><input type="text" name="unit" placeholder="单元" class="layui-input"></div>
                <div class="layui-input-inline" style="width:80px;"><select name="unitrule"></select></div>
                <div class="layui-input-inline" style="width:70px;"><input type="text" name="floor" placeholder="层" class="layui-input"></div>
                <div class="layui-input-inline" style="width:80px;"><select name="floorrule"></select></div>
                <div class="layui-input-inline" style="width:70px;"><input type="text" name="door" placeholder="门" class="layui-input"></div>
                <div class="layui-input-inline" style="width:80px;"><select name="doorrule"></select></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">建筑面积</label>
                <div class="layui-input-inline" style="width:100px;"><input type="text" name="buildArea" placeholder="建筑面积" class="layui-input v_float_3"></div>
                <label class="layui-form-label">套内面积</label>
                <div class="layui-input-inline" style="width:100px;"><input type="text" name="innerArea" placeholder="套内面积" class="layui-input v_float_3"></div>
                <label class="layui-form-label">赠送面积</label>
                <div class="layui-input-inline" style="width:100px;"><input type="text" name="freeArea" placeholder="赠送面积" class="layui-input v_float_3"></div>
                <label class="layui-form-label">总面积</label>
                <div class="layui-input-inline" style="width:100px;"><input type="text" name="totalArea" placeholder="总面积" class="layui-input v_float_3"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">意向</label>
                <div class="layui-input-inline" style="width:110px;">
                    <select name="intention">
                        <option value="0">到店</option>
                        <option value="1">量房</option>
                        <option value="2">守园</option>
                    </select>
                </div>
                <label class="layui-form-label">需求价格</label>
                <div class="layui-input-inline" style="width:110px;">
                    <input type="text" name="price" placeholder="需求价格" class="layui-input v_float_3">
                </div>
                <label class="layui-form-label">业务类型</label>
                <div class="layui-input-inline" style="width:130px;">
                    <select name="businessType"></select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">推荐单号</label>
                <div class="layui-input-inline" style="width:150px;">
                    <input type="text" name="referOrderId" placeholder="推荐单号（可选）" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="comment" placeholder="请输入备注" class="layui-textarea"></textarea>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 分配 -->
    <div id="issueBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="issueForm" id="issueForm">
            <div class="layui-form-item">
                <label class="layui-form-label">业务类型</label>
                <div class="layui-input-block">
                    <span id="busitypeInfo" class="layui-badge layui-bg-blue"></span>
                    <select name="busitype" id="issueBusitype" style="display:none;"></select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">公司</label>
                <div class="layui-input-block">
                    <select name="company" id="companySel"></select>
                </div>
            </div>
            <div class="layui-form-item issue-group group-user" style="display:none;">
                <label class="layui-form-label">人员<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:180px;">
                    <input type="text" name="belongerName" id="issueBelongerName" placeholder="点击选择人员" class="layui-input" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnIssuePickBelonger">选择</button>
                </div>
            </div>
            <div class="layui-form-item issue-group group-dept" style="display:none;">
                <label class="layui-form-label">部门<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <select name="department" id="issueDeptSel"></select>
                </div>
            </div>
            <div class="layui-form-item issue-group group-region" style="display:none;">
                <label class="layui-form-label">分区<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <select name="region" id="issueRegionSel"></select>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnIssueSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnIssueCancel">取消</button>
            </div>
        </form>
    </div>

</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/customer/customer-common.js"></script>
<script src="../../js/customer/customerSource.js"></script>
</body>
</html>
