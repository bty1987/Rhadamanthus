<!DOCTYPE html>
<!-- app/views/customer/vustomerAdvance.html —— 预进客户：绑定装修单/记录/积分/归属 -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>预进客户</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page" id="vustomerAdvancePage">

    <div class="app-search">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">客户名称</label>
                    <div class="layui-input-inline">
                        <input type="text" name="name" data-op="eq" placeholder="请输入客户名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                </div>
            </div>
        </form>
    </div>

    <div class="app-table">
        <table id="resultTable" lay-filter="resultTable"></table>
    </div>

    <div id="pagenation" class="app-pagenation"></div>

    <!-- 绑定装修单号 -->
    <div id="bindOrderBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="bindOrderForm" id="bindOrderForm">
            <div class="layui-form-item">
                <label class="layui-form-label">装修单号<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="orderId" placeholder="请输入装修单号" class="layui-input v_required">
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnBindSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnBindCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 修改归属人 -->
    <div id="belongerBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="belongerForm" id="belongerForm">
            <div class="layui-form-item">
                <label class="layui-form-label">归属人<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:200px;">
                    <input type="text" name="belongerName" id="belongerName" placeholder="点击选择归属人" class="layui-input v_required" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnPickBelonger">选择</button>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnBelongerSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnBelongerCancel">取消</button>
            </div>
        </form>
    </div>

</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/customer/customer-common.js"></script>
<script src="../../js/customer/vustomerAdvance.js"></script>
</body>
</html>
