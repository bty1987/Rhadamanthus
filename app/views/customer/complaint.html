<!DOCTYPE html>
<!-- app/views/customer/complaint.html —— 投诉内容（弹窗页，上下文 app.params.customer.aid = complain.cid） -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>投诉内容</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page" id="complaintPage">

    <div class="app-toolbar" style="padding:10px 15px 0;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnBack"><i class="layui-icon layui-icon-return"></i>返回</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
    </div>

    <div class="app-table">
        <table id="resultTable" lay-filter="resultTable"></table>
    </div>

    <!-- 添加投诉内容 -->
    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="editForm" id="editForm">
            <div class="layui-form-item">
                <label class="layui-form-label">类型<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <select name="type" lay-verify="required">
                        <option value="0">设计</option>
                        <option value="1">业务</option>
                        <option value="2">工程</option>
                        <option value="3">销售</option>
                        <option value="4">其他</option>
                        <option value="5">无理</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">人员<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:180px;">
                    <input type="text" name="staffName" id="staffName" placeholder="点击选择人员" class="layui-input v_required" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnPickStaff">选择</button>
                </div>
                <div class="layui-input-inline" style="width:160px;">
                    <input type="text" name="deptName" id="deptName" placeholder="部门（选择人员带出）" class="layui-input" readonly>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">品牌</label>
                <div class="layui-input-inline" style="width:180px;">
                    <input type="text" name="brandName" id="brandName" placeholder="输入拼音检索品牌" class="layui-input">
                </div>
                <div class="layui-input-inline" id="brandList" style="line-height:38px;"></div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">内容<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <textarea name="content" placeholder="请输入投诉内容" class="layui-textarea v_required"></textarea>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 跟踪（写跟踪内容） -->
    <div id="trackBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="trackForm" id="trackForm">
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">跟踪内容<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <textarea name="comment" placeholder="请输入跟踪内容" class="layui-textarea v_required"></textarea>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnTrackSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnTrackCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 跟踪内容列表 -->
    <div id="complackBox" style="display:none; padding:15px;">
        <table id="complackTable" lay-filter="complackTable"></table>
    </div>

</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/customer/customer-common.js"></script>
<script src="../../js/customer/complaint.js"></script>
</body>
</html>
