<!DOCTYPE html>
<!-- app/views/customer/repair.html —— 返修记录（弹窗页，上下文 app.params.customer.aid）：维修/完工/添加 -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>返修记录</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="app-page" id="repairPage">

    <div class="app-toolbar" style="padding:10px 15px 0;">
        <button type="button" class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button>
    </div>

    <div class="app-table">
        <table id="resultTable" lay-filter="resultTable"></table>
    </div>

    <!-- 添加返修 -->
    <div id="editBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="editForm" id="editForm">
            <div class="layui-form-item">
                <label class="layui-form-label">维修人<span class="app-req">*</span></label>
                <div class="layui-input-inline" style="width:200px;">
                    <input type="text" name="userNameRepair" id="userNameRepair" placeholder="点击选择维修人" class="layui-input v_required" readonly>
                </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-normal" id="btnPickUser">选择</button>
                </div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">内容<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <textarea name="content" placeholder="请输入返修内容" class="layui-textarea v_required"></textarea>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnSave">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 维修/完工进度 -->
    <div id="scheduleBox" style="display:none; padding:20px;">
        <form class="layui-form" lay-filter="scheduleForm" id="scheduleForm">
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">进度<span class="app-req">*</span></label>
                <div class="layui-input-block">
                    <textarea name="schedule" placeholder="请输入进度说明" class="layui-textarea v_required"></textarea>
                </div>
            </div>
            <div class="layui-form-item app-form-footer">
                <button type="button" class="layui-btn" id="btnScheduleSave">提交</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnScheduleCancel">取消</button>
            </div>
        </form>
    </div>

</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/app/config.js"></script>
<script src="../../js/app/server.js"></script>
<script src="../../js/app/utils.js"></script>
<script src="../../js/app/post.js"></script>
<script src="../../js/app/api.js"></script>
<script src="../../js/app/core.js"></script>
<script src="../../js/app/validate.js"></script>
<script src="../../js/app/bootstrap.js"></script>
<script src="../../js/customer/customer-common.js"></script>
<script src="../../js/customer/repair.js"></script>
</body>
</html>
