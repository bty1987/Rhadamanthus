<!DOCTYPE html>
<!-- app/views/manifest/occessories2create.html —— 创建外辅单（装修单 + 外辅项列表 → addOccessories）
  header: orderId isEnter isLift isExceed isAttic loadFloor
  明细: goods.gid num selling sennum recnum rbalance vbalance charge -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>创建外辅单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div id="breadcrumb"></div>
    <form class="layui-form" id="headForm" lay-filter="headForm">
        <div class="layui-form-item">
            <div class="layui-inline"><label class="layui-form-label">装修单号<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="orderId" id="orderId" placeholder="装修单号" class="layui-input v_required"></div></div>
            <div class="layui-inline"><label class="layui-form-label">是否入户</label><div class="layui-input-inline"><select name="isEnter"><option value="0">是</option><option value="1">否</option></select></div></div>
            <div class="layui-inline"><label class="layui-form-label">是否有电梯</label><div class="layui-input-inline"><select name="isLift"><option value="0">有</option><option value="1">无</option></select></div></div>
        </div>
    </form>
    <div class="app-table"><div id="itemTableWrap"></div></div>
    <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnAdd">添加外辅项</button><button type="button" class="layui-btn layui-btn-normal" id="btnSubmit">提交</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/manifest/occessories2create.js"></script>
</body></html>
