<!DOCTYPE html>
<!-- app/views/manifest/accessories2create.html —— 创建辅料单（装修单信息 + 辅料项列表 → addAccessories）
  header: orderId supervisorName orderAddr schedule(cnid) fetchTime type comment
  明细: goods.gid num selling caid total normnum normunit storenum storeunit -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>创建辅料单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div id="breadcrumb"></div>
    <form class="layui-form" id="headForm" lay-filter="headForm">
        <div class="layui-form-item">
            <div class="layui-inline"><label class="layui-form-label">装修单号<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="orderId" id="orderId" placeholder="装修单号" class="layui-input v_required"></div></div>
            <div class="layui-inline"><button type="button" class="layui-btn layui-btn-sm" id="btnLoadOrder">载入</button></div>
            <div class="layui-inline"><label class="layui-form-label">监理</label><div class="layui-input-inline"><input type="text" name="supervisorName" readonly class="layui-input"></div></div>
            <div class="layui-inline"><label class="layui-form-label">地址</label><div class="layui-input-inline" style="width:240px;"><input type="text" name="orderAddr" readonly class="layui-input"></div></div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline"><label class="layui-form-label">施工环节<span class="app-req">*</span></label><div class="layui-input-inline"><select name="schedule" id="schedule"></select></div></div>
            <div class="layui-inline"><label class="layui-form-label">领取时间<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="fetchTime" id="fetchTime" placeholder="yyyy-MM-dd" class="layui-input v_required"></div></div>
            <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="0">包工包料</option><option value="1">包清工</option></select></div></div>
        </div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="comment" maxlength="128" class="layui-input"></div></div>
    </form>
    <div class="app-table"><div id="itemTableWrap"></div></div>
    <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnAdd">添加辅料项</button><button type="button" class="layui-btn layui-btn-normal" id="btnSubmit">提交</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/manifest/accessories2create.js"></script>
</body></html>
