<!DOCTYPE html>
<!-- app/views/manifest/manifestTemplateItem2add.html —— 添加商品到模板（商品列表，多选后确定）
  URL: ?mtid=xxx
  字段：no name barcode category brand measurementUnit type pieceNum status -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>添加商品</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">编号</label><div class="layui-input-inline"><input type="text" name="no" data-op="cn" placeholder="商品编号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">名称</label><div class="layui-input-inline"><input type="text" name="name" data-op="cn" placeholder="商品名称" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">条形码</label><div class="layui-input-inline"><input type="text" name="barcode" data-op="cn" placeholder="条形码" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnConfirm">确定</button><button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/manifest/manifestTemplateItem2add.js"></script>
</body></html>
