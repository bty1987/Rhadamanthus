<!DOCTYPE html>
<!-- app/views/manifest/accessories.html —— 辅料单管理（列表 + 查看/预出/出货/修改/拒绝/退货/打印/到货/审核）
  字段：no orderId creater createTime approver approverTime total cnid status type comment
  status: 0初始 1预出 2批出 3出货/到货 4 ... -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>辅料单管理</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div class="app-search"><form class="layui-form" id="searchForm"><div class="layui-form-item">
        <div class="layui-inline"><label class="layui-form-label">辅料单号</label><div class="layui-input-inline"><input type="text" name="no" data-op="cn" placeholder="辅料单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">装修单号</label><div class="layui-input-inline"><input type="text" name="orderId" data-op="cn" placeholder="装修单号" class="layui-input" autocomplete="off"></div></div>
        <div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="status" data-op="eq"><option value="">全部</option><option value="0">初始</option><option value="1">预出</option><option value="2">批出</option><option value="3">出货</option></select></div></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="btnSearch"><i class="layui-icon layui-icon-search"></i>查询</button><button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="pagenation" class="app-pagenation"></div>
    <script type="text/html" id="rowToolbar">
        <button class="layui-btn layui-btn-xs" lay-event="view">查看</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="preout">预出</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="out">出货</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="edit">修改</button>
        <button class="layui-btn layui-btn-xs layui-btn-success" lay-event="refuse">拒绝</button>
        <button class="layui-btn layui-btn-xs" lay-event="refund">退货</button>
        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="delive">到货</button>
        <button class="layui-btn layui-btn-xs" lay-event="print">打印</button>
    </script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/manifest/accessories.js"></script>
</body></html>
