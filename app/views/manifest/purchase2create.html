<!DOCTYPE html>
<!-- app/views/manifest/purchase2create.html —— 创建采购单（header + 多行明细，提交 addPurchase）
  header: deliveryTime comment total；明细: goods.gid color.cid format.fid num inprice -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>创建采购单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div id="breadcrumb"></div>
    <form class="layui-form" id="headForm" lay-filter="headForm">
        <div class="layui-form-item">
            <div class="layui-inline"><label class="layui-form-label">交期时间<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="deliveryTime" id="deliveryTime" placeholder="yyyy-MM-dd" class="layui-input v_required"></div></div>
            <div class="layui-inline"><label class="layui-form-label">总价</label><div class="layui-input-inline"><input type="text" id="totalSpan" readonly class="layui-input" value="0"></div></div>
        </div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="comment" maxlength="128" class="layui-input"></div></div>
    </form>
    <div class="app-table"><div id="itemTableWrap"></div></div>
    <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnAdd">添加明细</button><button type="button" class="layui-btn layui-btn-normal" id="btnSubmit">提交</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/manifest/purchase2create.js"></script>
</body></html>
