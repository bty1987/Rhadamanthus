<!DOCTYPE html>
<!-- app/views/manifest/manifest2create.html —— 创建货单（CG进货/XG出货：header + 多行明细）
  header: type(1进货/3出货) manifestTime manifestTemplate(mtid) comment
  明细: goods.gid color.cid format.fid storehouse.shid num inprice/outprice comment
  接口：type=1 → addManifestForCG(instorehouse/inprice)；type=3 → addManifestForXG(outstorehouse/outprice) -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>创建货单</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div id="breadcrumb"></div>
    <form class="layui-form" id="headForm" lay-filter="headForm">
        <div class="layui-form-item">
            <div class="layui-inline"><label class="layui-form-label">类型<span class="app-req">*</span></label><div class="layui-input-inline"><select name="type" lay-filter="type"><option value="1">进货</option><option value="3">出货</option></select></div></div>
            <div class="layui-inline"><label class="layui-form-label">货单时间<span class="app-req">*</span></label><div class="layui-input-inline"><input type="text" name="manifestTime" id="manifestTime" placeholder="yyyy-MM-dd" class="layui-input v_required"></div></div>
            <div class="layui-inline"><label class="layui-form-label">模板</label><div class="layui-input-inline"><select name="manifestTemplate" id="manifestTemplate"><option value="">不选</option></select></div></div>
            <div class="layui-inline"><button type="button" class="layui-btn layui-btn-normal layui-btn-sm" id="btnAddStyle">按模板添加</button></div>
        </div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="comment" maxlength="128" class="layui-input"></div></div>
    </form>
    <div class="app-table"><table id="itemTable" lay-filter="itemTable"></table></div>
    <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnAddItem">添加明细</button><button type="button" class="layui-btn layui-btn-normal" id="btnSubmit">提交</button><button type="button" class="layui-btn layui-btn-primary" id="btnReset">重置</button></div>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/manifest/manifest2create.js"></script>
</body></html>
