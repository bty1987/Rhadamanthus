<!DOCTYPE html>
<!-- app/views/manifest/occessoriesCost.html —— 外辅成本（按 oid 查看/增改/删除成本项）
  URL: ?oid=xxx
  字段：initPrice(原费用) price(费用) cost(成本) type -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>外辅成本</title>
<link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/app.css"></head>
<body>
<div class="app-page">
    <div id="breadcrumb"></div>
    <div class="app-search"><form class="layui-form"><div class="layui-form-item">
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-normal" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>添加</button></div>
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-primary" id="btnBack">返回</button></div>
    </div></form></div>
    <div class="app-table"><table id="resultTable" lay-filter="resultTable"></table></div>
    <div id="editBox" style="display:none; padding:20px;"><form class="layui-form" id="editForm" lay-filter="editForm">
        <input type="hidden" name="ocid">
        <div class="layui-form-item"><label class="layui-form-label">原费用</label><div class="layui-input-block"><input type="text" name="initPrice" class="layui-input v_float_3"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">费用</label><div class="layui-input-block"><input type="text" name="price" class="layui-input v_float_3"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">成本</label><div class="layui-input-block"><input type="text" name="cost" class="layui-input v_float_3"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-block"><select name="type" id="costType"></select></div></div>
        <div class="layui-form-item app-form-footer"><button type="button" class="layui-btn" id="btnSave">保存</button><button type="reset" class="layui-btn layui-btn-primary" id="btnCancel">取消</button></div>
    </form></div>
    <script type="text/html" id="rowToolbar"><button class="layui-btn layui-btn-xs" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button></script>
</div>
<script src="../../layui/layui.js"></script><script src="../../js/app/config.js"></script><script src="../../js/app/server.js"></script><script src="../../js/app/utils.js"></script><script src="../../js/app/post.js"></script><script src="../../js/app/api.js"></script><script src="../../js/app/core.js"></script><script src="../../js/app/validate.js"></script><script src="../../js/app/bootstrap.js"></script><script src="../../js/manifest/occessoriesCost.js"></script>
</body></html>
