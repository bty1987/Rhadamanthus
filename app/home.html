<!DOCTYPE html>
<!--
  app/home.html —— 简单首页（默认 tab 页）

  作为主框架的默认 iframe 内容，展示欢迎信息 + 快捷入口。
  仅引 layui + home.js，不依赖 ace/bootstrap。
-->
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>首页</title>
    <link rel="stylesheet" href="layui/css/layui.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-home">
    <div class="app-home-hero">
        <h1>欢迎使用方林信息平台</h1>
        <p>当前用户：<span id="homeUserName">—</span></p>
    </div>

    <div class="layui-row layui-col-space20 app-home-cards">
        <div class="layui-col-md3">
            <div class="app-card">
                <i class="layui-icon layui-icon-template-1"></i>
                <div class="app-card-text">业务模块</div>
            </div>
        </div>
        <div class="layui-col-md3">
            <div class="app-card">
                <i class="layui-icon layui-icon-chart"></i>
                <div class="app-card-text">数据报表</div>
            </div>
        </div>
        <div class="layui-col-md3">
            <div class="app-card">
                <i class="layui-icon layui-icon-set"></i>
                <div class="app-card-text">系统设置</div>
            </div>
        </div>
        <div class="layui-col-md3">
            <div class="app-card">
                <i class="layui-icon layui-icon-auz"></i>
                <div class="app-card-text">权限管理</div>
            </div>
        </div>
    </div>
</div>

<script src="layui/layui.js"></script>
<script src="js/app/config.js"></script>
<script src="js/app/server.js"></script>
<script src="js/home.js"></script>
</body>
</html>
