#==========================================
oss.enabled=true
oss.accessKeyId=LTAI5t6vzgwB8CcUR4pV5Jku
oss.accessKeySecret=ENC(p/JOG5lK50oHrKtHvl/3vqSHiKlNqIwfCDUc8uvNMrg=)
oss.endpoint=oss-cn-beijing.aliyuncs.com
oss.bucket=fl-prod-erp
oss.region=cn-beijing

# STS 临时凭证配置(角色信任 fanglin-erp-oss,上传按登录userId会话目录隔离,由后端保证)
oss.roleArn.upload=acs:ram::1545849196553175:role/oss-uploader
oss.roleArn.read=acs:ram::1545849196553175:role/oss-reader
oss.sts.expireSeconds=900
oss.presign.expireSeconds=1800

# 文件上传约束
oss.upload.maxFileSize=5242880
oss.upload.allowedExts=jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx
