
#==========================================
# 阿里云 OSS 配置（独立配置文件）
#==========================================
# 主账号 AK/SK 仅后端持有，不入库、不进 git
# accessKeySecret 用 ENC(...) 包裹，启动时由 EncryptPropertyPlaceholderConfigurer 自动解密
# 生成密文：调用 AESHelper.encrypt(明文, KeyManager.getCurrentKey(), KeyManager.getCurrentIv())
#==========================================
oss.enabled=true
oss.accessKeyId=LTAI5tNewRotatedKeyId
oss.accessKeySecret=ENC(请用AESHelper.encrypt生成密文替换本占位)
oss.endpoint=oss-cn-hangzhou.aliyuncs.com
oss.bucket=fanglin-erp
oss.region=cn-hangzhou

# STS 临时凭证配置（roleArn 在阿里云 RAM 控制台创建角色后获取）
oss.roleArn.upload=acs:ram::<主账号UID>:role/oss-uploader
oss.roleArn.read=acs:ram::<主账号UID>:role/oss-reader
oss.sts.expireSeconds=900
oss.presign.expireSeconds=1800

# 文件上传约束
oss.upload.maxFileSize=5242880
oss.upload.allowedExts=jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx
