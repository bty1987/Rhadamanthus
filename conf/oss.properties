# 资源为阿里云 RAM 子账号 fanglin-erp-oss（仅允许 AssumeRole 两个角色）:
#   角色 oss-uploader 上传 / oss-reader 读取, 桶 fl-prod-erp(生产) / fl-daily-erp(测试)
