
#加密配置
encryptType=AES
encryptKey=b4d617b336124c63
encryptIv=b4d1a58a416957a5


#系统配置
debug=error
communion=communion


#=== 日志模块配置（运维可调）===
#操作日志总开关，true=启用 actionLog 写入（紧急熔断用，出故障时改 false 停日志）
actionLog.enable=true
#采样率 0-100，100=全采，0=不采（性能压力大时调低）
actionLog.sampling=100
#params 字段最大字符数，超出截断
actionLog.maxParamLen=2000
#热表保留天数，超期数据由归档任务搬到月表
actionLog.retentionDays=90
#是否启用按月归档定时任务（每月1号02:00执行）
actionLog.archiveEnabled=true
#历史查询最多扫描的归档月表数量（防止大范围查询拖垮DB）
actionLog.archiveLookupMaxMonths=12

#=== 登录日志配置（运维可调）===
#登录日志保留天数（每天03:00由清理任务删除超期数据）
recordLoginLogDay=30
#防爆破统计窗口（分钟），默认5分钟内的失败次数计入爆破检测
refuseLoginStatMin=5
#连续失败次数阈值，达到后拒绝登录
refuseLoginTimes=5

